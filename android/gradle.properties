# 3g + ParallelGC: a clean assembleRelease (R8) spent 17.0 s in G1 pauses under the old
# 2g heap vs 3.3 s here. A CI job has 16 GB; its worst case (ci.yml's LocalServer job:
# sbt 4g + this daemon + the Kotlin daemon, which inherits these args, + a test JVM) is ~11 GB.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
