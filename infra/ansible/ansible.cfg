[defaults]
# Everything here is relative to this directory, so `ansible-playbook` behaves the same whether it is
# run from a shell or from CI. Nothing reads a file outside infra/ansible/ except the Terraform root
# and the flake, both of which are named explicitly by the roles that use them.
inventory        = inventory/hcloud.yml
roles_path       = roles
collections_path = collections

# `stdout_callback = yaml` is NOT this: that named community.general.yaml, which was removed in
# community.general 12.0.0 and fails the run outright on a current controller. The supported
# spelling is the built-in callback plus result_format. Ported from bitcashier/infra, where the
# older spelling had to be corrected once already.
stdout_callback  = default
result_format    = yaml

# WHICH PYTHON RUNS OUR MODULES. auto_silent picks the interpreter without printing a deprecation
# warning on every task. It also SUPPRESSES the warning that would tell "found only an unversioned
# /usr/bin/python3" apart from "found no interpreter at all" -- which matters more on this fleet
# than on an all-Ubuntu one, because a NixOS host has neither. See the long note on
# `ansible_interpreter_python_fallback` in inventory/group_vars/all.yml, which is what keeps that
# distinction readable, and note that the deploy and convert paths use `raw` precisely so they do
# not depend on this being right.
interpreter_python = auto_silent

# RAISED FROM THE DEFAULT 10, ported from bitcashier/infra with its reasoning intact because the
# reasoning is not about that fleet. This one number governs two different things:
#
#   - the SSH connect timeout, which is what the default is written for, and
#   - `2 + timeout` seconds of select() waiting for sudo to answer -- see `timeout = 2 +
#     self.get_option('timeout')` in ansible/plugins/connection/ssh.py, and the message it raises,
#     `Timeout (%ds) waiting for privilege escalation prompt`.
#
# On bitcashier's fleet the second killed a database cutover: ordinary become latency there was
# already at the 12s ceiling, and the migration was simply the first run whose failure was expensive
# enough to notice. This estate has three hosts and no jump host, so it is nowhere near that ceiling
# today -- the value is carried anyway because the cost of being generous is that an unreachable
# host says so in thirty seconds instead of twelve, and the cost of being tight is a cutover that
# dies between stopping one thing and starting another.
timeout = 30

# any_errors_fatal is deliberately NOT set here. It is right for a migration playbook -- which says
# so itself -- and wrong for anything that reports on the fleet, where one host that cannot be
# reached must not suppress the answer for the other two.

# Host keys are checked. These hosts are long-lived, so a CHANGED key is a real event and not
# something to click past.
#
# `accept-new` in ssh_args below is the other half, and is not a weakening of this: it accepts a key
# for a host that has never been seen, which is exactly what converting one produces, while still
# refusing a host whose key has changed. Without it, playbooks/convert-host-to-nixos.yml cannot talk
# to the rescue system it just booted -- and that playbook removes the stale key DELIBERATELY
# (`ssh-keygen -R`) rather than relying on a looser setting here, so that the removal is a visible
# step in the run rather than a policy.
host_key_checking = True

# Three hosts. The default of 5 already covers the whole fleet at once, and nothing here is a
# twenty-host sweep, so this is stated rather than tuned -- it exists to be the number somebody
# raises deliberately if this estate grows, not to be a performance knob today.
forks = 5

# No fact gathering by default. These playbooks orchestrate an API, a flake and a Terraform root;
# they do not template a config from facts. More sharply than on an Ubuntu fleet: a freshly
# converted NixOS host has no python at all, so `gather_facts: true` there does not cost a round
# trip, it FAILS. Plays that need facts ask for them, on hosts that can answer.
gathering = explicit

[ssh_connection]
pipelining = True
# ControlPersist matters more than usual during a conversion: every step is another short command
# over ssh to the same machine, and without it each one pays a fresh handshake. ServerAliveInterval
# is what stops a long `nixos-rebuild switch` -- which can be silent for many minutes while it
# builds -- from being dropped by a NAT in the middle.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new
