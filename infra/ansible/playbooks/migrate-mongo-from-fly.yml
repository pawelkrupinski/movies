---
# Move the kinowo database off the Fly app `kinowo-mongo` and onto mongo-1, over the private network.
#
#   set -a; . .env.local; set +a
#   ansible-playbook playbooks/migrate-mongo-from-fly.yml -e migrate_confirmed=mongo-1
#
# THE FLY SIDE IS THE ROLLBACK AND IS NEVER TOUCHED. Nothing here stops, scales, drains or deletes
# `kinowo-mongo`; it does not even write to it. The only thing that reaches it is a `flyctl proxy`
# and two READS -- a `mongodump` and a `countDocuments` sweep. Keeping it running and authoritative
# is the entire rollback plan: until the app's MONGODB_URI is repointed (a separate, deliberate act),
# Fly is still the live database and this playbook has only ever produced a copy.
#
# THEREFORE IT IS SAFE TO RE-RUN, and re-running is the expected way to use it: dump, restore, look
# at the count comparison, fix whatever it complains about, run it again. Each run takes a FRESH dump
# and restores it with `--drop`, so the target converges on the source rather than accumulating.
#
#   -> THE ONE THING THAT MAKES A RE-RUN DANGEROUS is doing it AFTER the app has been repointed at
#      mongo-1. From that moment the target holds writes the source has never seen, and `--drop`
#      throws them away in favour of a stale Fly copy. There is deliberately no automated check for
#      that, because this playbook cannot see where the app is pointed -- read it off fly.toml /
#      the app's MONGODB_URI before re-running late in a cutover.
#
# THE TARGET MUST BE A SINGLE-NODE REPLICA SET, NOT A STANDALONE, and this is not a preference.
# common/src/main/scala/services/readmodel/WebReadModel.scala hydrates the read model at boot and
# then keeps it fresh over MONGO CHANGE STREAMS. Change streams require an oplog, and an oplog
# requires replication -- a standalone mongod rejects `watch()` outright with "The $changeStream
# stage is only supported on replica sets". So a restore onto a standalone produces a database that
# passes every count check here and a web tier that serves a snapshot frozen at its boot. The flake
# must set `services.mongodb.replSetName` (or equivalent) and the set must have been initiated;
# this playbook ASSERTS it rather than assuming, before it writes anything.
#
# WHAT IT DOES NOT DO:
#   * it does not create users on the target. Authentication is the flake's business.
#   * it does not repoint the application. That is the cutover, and it is a person's decision.
#   * it does not take a --oplog point-in-time dump. `--oplog` needs read access to `local.oplog.rs`,
#     which the application's own credential does not have, and adding a second credential to make a
#     ONE-OFF migration marginally more consistent is the wrong trade. The consequence is stated
#     rather than hidden: the dump is NOT a consistent snapshot of a live database, so a corpus being
#     written during the dump can legitimately produce a count mismatch below. The remedy is to stop
#     the writers (`flyctl scale count 0 --app kinowo-worker`, which is NOT this playbook's business
#     either) and re-run.

- name: Copy the kinowo database from Fly onto mongo-1
  hosts: "{{ target | default('role_mongo', true) }}"
  gather_facts: false

  vars:
    ansible_host: >-
      {{ kinowo_public_ipv4 if kinowo_connect_over == 'public' else hcloud_private_ipv4 }}
    # mongorestore and the mongosh probes run ON the target through `raw`, for the same reason
    # roles/nixos_deploy does: a NixOS host has no python unless its configuration declares one, and
    # this playbook must work on a machine whose configuration is one deploy old.
    ansible_user: root

    # THE LOCAL END OF THE TUNNEL. `flyctl proxy <local>:<remote> --app kinowo-mongo` publishes the
    # Fly app's 27017 on this port on the controller.
    #
    # IT IS A VARIABLE BECAUSE 27017 ON A DEVELOPER'S MACHINE IS OFTEN ALREADY A MONGOD. This
    # repository runs a local mongo for its integration layer, and the failure if one is listening is
    # not an error -- `flyctl proxy` fails to bind, the dump connects to the LOCAL database instead,
    # and the migration cheerfully copies an empty test corpus over the top of production. The
    # refusal below is what stops that; this variable is how you get past it without stopping your
    # own mongod.
    migrate_local_port: "{{ migrate_local_port_override | default(27017, true) }}"

    # THE SOURCE URI MUST NAME THE TUNNEL, not the Fly internal address. Two things make this
    # non-obvious enough to be worth asserting:
    #
    #   * `kinowo-mongo.internal:27017` is a 6PN address. It resolves inside Fly and nowhere else, so
    #     a URI carrying it simply hangs from the controller.
    #   * `directConnection=true` IS REQUIRED. Without it the driver treats the tunnel endpoint as a
    #     seed, runs replica-set discovery, learns the member's ADVERTISED hostname (which is that
    #     same unroutable 6PN name), and tries to connect to it -- so the connection fails AFTER
    #     appearing to succeed, with a server-selection timeout that names a host you never typed.
    #
    # Supplied rather than derived: MONGODB_URI in .env.local points at the app's real endpoint, and
    # rewriting somebody's connection string with a regex to move its host is exactly the kind of
    # cleverness that silently produces a URI to the wrong database.
    migrate_source_uri: >-
      {{ lookup('ansible.builtin.env', 'KINOWO_FLY_MONGO_URI') | default('', true) }}

    # The target end. mongorestore runs on mongo-1 itself, so this is a loopback URI and needs no
    # firewall hole; `directConnection=true` for the same reason as above -- the set advertises its
    # member by a name that may not resolve to itself from inside a shell.
    migrate_target_uri: >-
      {{ lookup('ansible.builtin.env', 'KINOWO_MONGO_TARGET_URI')
         | default('mongodb://127.0.0.1:27017/?directConnection=true', true) }}

    migrate_dump_dir: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp/', true) }}kinowo-mongo-migrate"
    migrate_archive: "{{ migrate_dump_dir }}/{{ kinowo_mongo_database }}.archive.gz"
    migrate_remote_archive: "/var/tmp/{{ kinowo_mongo_database }}.archive.gz"
    migrate_proxy_log: "{{ migrate_dump_dir }}/flyctl-proxy.log"

    # ONE STATEMENT OF THE COUNTING QUERY, used against both ends. Two copies would drift, and the
    # direction of the drift is the bad one: a verification that counts the source one way and the
    # target another can only ever produce mismatches nobody trusts, which is how a check stops being
    # read. `countDocuments` and not `estimatedDocumentCount`: the estimate comes from collection
    # metadata, is allowed to be stale, and is exactly wrong for the one question being asked here.
    migrate_count_js: >-
      const d = db.getSiblingDB("{{ kinowo_mongo_database }}");
      print(JSON.stringify(d.getCollectionNames().sort().reduce(
        (acc, c) => { acc[c] = d.getCollection(c).countDocuments({}); return acc; }, {})));

  tasks:
    # -------------------------------------------------------------------------------------------
    # REFUSALS
    # -------------------------------------------------------------------------------------------

    - name: Exactly one mongo host, and it must be the one that was confirmed
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - migrate_confirmed | default('') == inventory_hostname
        fail_msg: >-
          This play resolved {{ ansible_play_hosts_all | length }} host(s)
          ({{ ansible_play_hosts_all | join(', ') }}) and was confirmed for
          "{{ migrate_confirmed | default('') }}". Re-run with -e migrate_confirmed={{ inventory_hostname }}.
          The confirmation is required because the restore below runs with `--drop`: every collection
          in {{ kinowo_mongo_database }} on the target is DROPPED and rewritten from the Fly copy.
          That is exactly what you want before the cutover and exactly what you do not want after it.
        quiet: true

    - name: The source must be reached through the tunnel, explicitly
      ansible.builtin.assert:
        that:
          - migrate_source_uri | length > 0
          - "'127.0.0.1' in migrate_source_uri or 'localhost' in migrate_source_uri"
          - "'directConnection=true' in migrate_source_uri"
        fail_msg: >-
          KINOWO_FLY_MONGO_URI must name the LOCAL end of the flyctl tunnel and must set
          directConnection=true, e.g.
          mongodb://<user>:<pass>@127.0.0.1:{{ migrate_local_port }}/?authSource=admin&directConnection=true
          A URI naming kinowo-mongo.internal is a Fly 6PN address and resolves nowhere on this
          machine; a URI without directConnection resolves the seed, then follows the replica set's
          ADVERTISED member name -- which is that same unroutable address -- and fails with a
          server-selection timeout naming a host you never typed.
        quiet: true

    # ASKED UP FRONT rather than discovered at the task that needs it. `mongosh` missing is found by
    # the replica-set probe, which reads as "the target is not a replica set" -- the wrong diagnosis
    # entirely. `shell` and not `command` because `command -v` is a SHELL BUILTIN and there is no
    # executable of that name to exec.
    - name: Read which of the tools this needs are on the controller
      ansible.builtin.shell:
        cmd: "command -v {{ item }} >/dev/null"
        executable: /bin/bash
      loop: [flyctl, mongodump, mongosh]
      register: migrate_tools
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: All of them must be present
      ansible.builtin.assert:
        that:
          - migrate_tools.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Not on this controller's PATH:
          {{ migrate_tools.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.
          mongodump and mongosh come from the MongoDB Database Tools and the mongosh package; flyctl
          is what opens the tunnel.
        quiet: true

    # THE FAR END'S TOOLS ARE A PROPERTY OF THE FLAKE, so they are asked of the far end. mongorestore
    # and mongosh have to be in this host's `environment.systemPackages` (or the mongodb module's
    # closure) -- a NixOS host has nothing on PATH that is not declared. Asked before the dump,
    # because spending twenty minutes pulling a database down a laptop's uplink and THEN finding the
    # restore has no binary is the avoidable version of this failure.
    - name: The restore tools must be on the target
      ansible.builtin.raw: command -v mongorestore >/dev/null && command -v mongosh >/dev/null
      register: migrate_target_tools
      changed_when: false
      failed_when: false

    - name: Say which one is missing rather than failing at the restore
      ansible.builtin.assert:
        that:
          - migrate_target_tools.rc == 0
        fail_msg: >-
          mongorestore and/or mongosh are not on {{ inventory_hostname }}'s PATH. On NixOS that means
          they are not declared -- add them to this host's configuration (the mongodb role is the
          natural place) and deploy before running this. Nothing has been dumped.
        quiet: true

    # NOTHING MAY ALREADY BE LISTENING ON THE LOCAL PORT. If something is, `flyctl proxy` fails to
    # bind and every command below silently talks to whatever IS there. On a developer machine that
    # is a local mongod holding a test corpus -- so the migration would dump a handful of fixture
    # documents and restore them over the top of the production database, and the count comparison at
    # the end would agree with itself perfectly.
    - name: Nothing may already be listening on the tunnel's local port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ migrate_local_port | int }}"
        state: stopped
        timeout: 1
      delegate_to: localhost

    # -------------------------------------------------------------------------------------------
    # THE TARGET MUST BE A REPLICA SET BEFORE ANYTHING IS WRITTEN TO IT
    # -------------------------------------------------------------------------------------------
    #
    # Asserted here rather than discovered later, because the failure it prevents is invisible: a
    # restore onto a standalone mongod succeeds, every count matches, and the web tier then serves a
    # read model frozen at its boot because `watch()` is rejected. See the header.
    - name: Ask the target what kind of deployment it is
      ansible.builtin.raw: >-
        mongosh "{{ migrate_target_uri }}" --quiet --eval
        'print(JSON.stringify({set: db.hello().setName || "", primary: db.hello().isWritablePrimary === true}))'
      register: migrate_target_hello
      changed_when: false

    - name: The target must be an initiated replica set with a writable primary
      ansible.builtin.assert:
        that:
          - migrate_target_hello_json.set | length > 0
          - migrate_target_hello_json.primary
        fail_msg: >-
          {{ inventory_hostname }} reports setName="{{ migrate_target_hello_json.set }}"
          isWritablePrimary={{ migrate_target_hello_json.primary }}. This application keeps its read
          model fresh over CHANGE STREAMS, which need an oplog, which needs replication -- a
          standalone mongod rejects watch() outright. Restoring here would produce a database that
          looks perfect and a web tier that never sees an update. Declare
          `replication.replSetName` in this host's nix configuration, deploy it, and `rs.initiate()`
          once; then re-run.
        success_msg: >-
          target is replica set "{{ migrate_target_hello_json.set }}" and this member is primary
        quiet: true
      vars:
        # `raw` is ssh, so the lines come back CRLF-terminated and mongosh may print a banner ahead
        # of the answer whatever --quiet claims. Take the last non-empty line and trim it, rather
        # than parsing the whole blob.
        migrate_target_hello_json: >-
          {{ (migrate_target_hello.stdout.splitlines() | map('trim')
              | reject('equalto', '') | list | last) | from_json }}

    # -------------------------------------------------------------------------------------------
    # DUMP, THROUGH A TUNNEL THAT IS ALWAYS TORN DOWN
    # -------------------------------------------------------------------------------------------

    - name: Make somewhere for the dump to live
      ansible.builtin.file:
        path: "{{ migrate_dump_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Dump from Fly through a proxy, and always tear the proxy down
      # `block`/`always` and not a pair of tasks, because a flyctl left running holds the port and the
      # NEXT run of this playbook then refuses to start ("nothing may already be listening") -- or
      # worse, quietly reuses a tunnel to a Fly app somebody else pointed it at. The teardown has to
      # survive a failed dump, an unreachable API and a Ctrl-C.
      block:
        - name: Open the tunnel to the Fly app
          # `setsid` + `nohup` so the proxy survives the shell this task runs in; the pid is what the
          # `always` block below kills. `flyctl proxy` is a foreground process with no daemon mode.
          ansible.builtin.shell:
            cmd: >-
              setsid nohup flyctl proxy {{ migrate_local_port }}:27017
              --app {{ kinowo_fly_mongo_app }}
              > "{{ migrate_proxy_log }}" 2>&1 &
              echo $!
            executable: /bin/bash
          register: migrate_proxy
          changed_when: true
          delegate_to: localhost

        - name: Wait for the tunnel to accept connections
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ migrate_local_port | int }}"
            state: started
            timeout: 60
          delegate_to: localhost

        # COUNTED BEFORE AND AFTER THE DUMP, and the reason is in the header: without --oplog this is
        # not a point-in-time snapshot, so a corpus being written while it runs moves underneath it.
        # Two readings turn "the counts do not match" from a mystery into a measurement -- if the
        # source itself moved between them, that is the answer, and the remedy is to stop the writers
        # rather than to distrust the restore.
        - name: Count the source before dumping
          ansible.builtin.command:
            argv: [mongosh, "{{ migrate_source_uri }}", --quiet, --eval, "{{ migrate_count_js }}"]
          register: migrate_source_before
          changed_when: false
          delegate_to: localhost
          no_log: true

        # --gzip AND --archive: one file rather than a directory tree, compressed, because it crosses
        # the operator's uplink twice (down from Fly, up to Hetzner) and the corpus is mostly text.
        - name: mongodump from Fly
          ansible.builtin.command:
            argv:
              - mongodump
              - --uri={{ migrate_source_uri }}
              - --db={{ kinowo_mongo_database }}
              - --archive={{ migrate_archive }}
              - --gzip
          register: migrate_dump
          changed_when: true
          delegate_to: localhost
          # The URI carries the source credentials. no_log on the TASK, not on the register, so a
          # failure still fails loudly -- it just does not print the password with the command line.
          no_log: true

        - name: Count the source after dumping
          ansible.builtin.command:
            argv: [mongosh, "{{ migrate_source_uri }}", --quiet, --eval, "{{ migrate_count_js }}"]
          register: migrate_source_after
          changed_when: false
          delegate_to: localhost
          no_log: true

      always:
        - name: Close the tunnel
          ansible.builtin.command:
            argv: [kill, "{{ migrate_proxy.stdout | trim }}"]
          changed_when: true
          failed_when: false
          delegate_to: localhost
          when: migrate_proxy is defined and (migrate_proxy.stdout | default('') | trim) | length > 0

    - name: Say how much the source moved while it was being read
      ansible.builtin.debug:
        msg: >-
          The source's counts {{ 'did NOT change' if migrate_source_counts_before == migrate_source_counts
          else 'CHANGED' }} during the dump.
          before: {{ migrate_source_counts_before }}
          after:  {{ migrate_source_counts }}
          A change here is the worker writing to Fly, which is normal and is why the comparison below
          may not be exact. It is not evidence of a bad dump.
      vars:
        migrate_source_counts_before: >-
          {{ (migrate_source_before.stdout.splitlines() | map('trim')
              | reject('equalto', '') | list | last) | from_json }}
        migrate_source_counts: >-
          {{ (migrate_source_after.stdout.splitlines() | map('trim')
              | reject('equalto', '') | list | last) | from_json }}

    # -------------------------------------------------------------------------------------------
    # RESTORE
    # -------------------------------------------------------------------------------------------

    # rsync rather than a `copy`, because the archive is hundreds of MB and `copy` reads the whole
    # file into memory on both ends. `ansible.posix.synchronize` runs rsync on the CONTROLLER, so it
    # needs no python on the target -- but it does need `rsync` in the target's systemPackages, which
    # is the same requirement roles/nixos_deploy already makes.
    - name: Send the archive to the target
      ansible.posix.synchronize:
        src: "{{ migrate_archive }}"
        dest: "{{ migrate_remote_archive }}"

    # --drop, AND THIS IS THE DESTRUCTIVE LINE. Each collection in the archive is dropped on the
    # target immediately before being rewritten. It is what makes a re-run converge instead of
    # colliding on duplicate _ids -- and it is what would throw away real writes if this were run
    # after the application had been repointed at mongo-1. The confirmation at the top of this
    # playbook exists for this one flag.
    #
    # --preserveUUID is NOT used: it needs --drop and matching collection UUIDs, and it buys nothing
    # here because nothing downstream references a collection UUID. The indexes ARE restored -- they
    # are in the archive -- which matters more than it looks: the read-model projection does a
    # `replaceOne` per changed document, and an unindexed one is a collection scan each time.
    - name: mongorestore onto the target
      ansible.builtin.raw: >-
        mongorestore --uri="{{ migrate_target_uri }}"
        --archive={{ migrate_remote_archive }} --gzip --drop
        --nsInclude='{{ kinowo_mongo_database }}.*'
      register: migrate_restore
      changed_when: true

    # -------------------------------------------------------------------------------------------
    # VERIFY, PER COLLECTION, AND FAIL LOUDLY
    # -------------------------------------------------------------------------------------------
    #
    # "The restore exited 0" is not the claim being made. mongorestore reports a document count of
    # its own, but it counts what it WROTE, not what is there -- so a collection that was already
    # half-present, or one silently skipped by an nsInclude typo, reads as a clean run. Counting both
    # ends independently, with the same query, is the only version of this that can disagree.
    - name: Count the target
      ansible.builtin.raw: >-
        mongosh "{{ migrate_target_uri }}" --quiet --eval '{{ migrate_count_js }}'
      register: migrate_target_counts_raw
      changed_when: false

    - name: Every collection must have arrived, with the same number of documents
      ansible.builtin.assert:
        that:
          - migrate_missing_collections | length == 0
          - migrate_extra_collections | length == 0
          - migrate_differing_counts | length == 0
        fail_msg: |-
          The restore does not match the source.
            collections in Fly but not on {{ inventory_hostname }}: {{ migrate_missing_collections | join(', ') | default('none', true) }}
            collections on {{ inventory_hostname }} but not in Fly: {{ migrate_extra_collections | join(', ') | default('none', true) }}
            counts that differ: {{ migrate_differing_counts }}

          NOTHING ON THE FLY SIDE HAS BEEN TOUCHED, so this is not an outage -- it is a copy that is
          not yet good enough to cut over to.

          Read it in this order:
            * If the differing collections are the ones the worker writes constantly, the source
              moved underneath the dump -- the debug line above says whether it did. Stop the writers
              (`flyctl scale count 0 --app kinowo-worker`) and run this again.
            * Extra collections on the target mean an earlier restore left something behind that this
              archive does not contain. `--drop` only drops what it is about to write.
            * Anything else: read the mongorestore output above before re-running.
        success_msg: >-
          {{ migrate_target_counts | length }} collection(s), all present with matching counts:
          {{ migrate_target_counts }}
        quiet: true
      vars:
        migrate_source_counts: >-
          {{ (migrate_source_after.stdout.splitlines() | map('trim')
              | reject('equalto', '') | list | last) | from_json }}
        migrate_target_counts: >-
          {{ (migrate_target_counts_raw.stdout.splitlines() | map('trim')
              | reject('equalto', '') | list | last) | from_json }}
        migrate_missing_collections: >-
          {{ migrate_source_counts.keys() | list | difference(migrate_target_counts.keys() | list) }}
        migrate_extra_collections: >-
          {{ migrate_target_counts.keys() | list | difference(migrate_source_counts.keys() | list) }}
        # Compared only over the collections BOTH ends have, so a missing collection is reported once
        # as missing rather than twice -- once as absent and once as a count of zero against N.
        migrate_differing_counts: >-
          {%- set differing = {} -%}
          {%- for name in migrate_source_counts.keys() | list
                          | intersect(migrate_target_counts.keys() | list) | sort -%}
            {%- if migrate_source_counts[name] != migrate_target_counts[name] -%}
              {%- set _ = differing.update({name: (migrate_source_counts[name] | string)
                                                  ~ ' on Fly vs ' ~ (migrate_target_counts[name] | string)
                                                  ~ ' here'}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ differing }}

    - name: Remove the archive from the target
      # The controller's copy is deliberately LEFT in place: it is the only artefact of the run, it
      # costs nothing on a laptop, and having last night's dump on hand is worth more during a
      # cutover than a tidy temp directory. The target's copy goes because leaving a full database
      # dump in /var/tmp on the database host is how a disk fills.
      ansible.builtin.raw: "rm -f {{ migrate_remote_archive }}"
      changed_when: true

    - name: What is deliberately not done
      ansible.builtin.debug:
        msg:
          - "{{ kinowo_mongo_database }} is on {{ inventory_hostname }} and matches Fly."
          - "The Fly app {{ kinowo_fly_mongo_app }} is UNTOUCHED and still the live database."
          - "NOT DONE, on purpose:"
          - "  1. repointing the application. That is the cutover: change MONGODB_URI and deploy."
          - "  2. re-running this afterwards. Once the app writes here, --drop discards those writes."
          - "  3. retiring the Fly app. Keep it until you are sure; it is the rollback."
