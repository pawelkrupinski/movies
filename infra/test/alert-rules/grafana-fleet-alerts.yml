# THE GRAFANA-MANAGED ALERTS WITH NO SUITE OF THEIR OWN, EVALUATED TO BOTH SIDES OF THEIR THRESHOLD.
#
# Same approach as grafana-showtime-volume.yml: these rules live in Grafana's provisioning
# (grafana/alerting/alert-rules.yaml), so promtool cannot load them as rules, but each one's query A
# is ordinary PromQL and `promql_expr_test` evaluates it. The threshold is the rule's condition C
# (a `last` reduced against one number); test_alert_rule_coverage.py reads it from the provisioning
# file and requires, for every Grafana rule, a case here whose expression is the production one
# character-for-character (whitespace aside) and whose value crosses that threshold, and a case
# whose value does not. Change a rule's query and this file has to change with it.
rule_files: []

evaluation_interval: 1m

tests:
  # ── kinowo-worker-crash-looping (> 4 restarts in an hour) ────────────────────────────────────
  # The PL worker restarts five times in an hour -- a crash loop the k8s backoff has not yet
  # stretched out -- while the UK worker restarts once, which is a deploy.
  - interval: 1m
    input_series:
      - series: 'process_start_time_seconds{app="kinowo-worker-pl",instance="kinowo-worker-pl",job="kinowo-worker"}'
        values: '0x10 660x10 1260x10 1860x10 2460x10 3060x19'
      - series: 'process_start_time_seconds{app="kinowo-worker-uk",instance="kinowo-worker-uk",job="kinowo-worker"}'
        values: '0x30 1860x39'
    promql_expr_test:
      - expr: 'max by (app, instance) (changes(process_start_time_seconds{app=~"kinowo-worker.*"}[1h]))'
        eval_time: 69m
        exp_samples:
          - labels: '{app="kinowo-worker-pl",instance="kinowo-worker-pl"}'
            value: 5
          - labels: '{app="kinowo-worker-uk",instance="kinowo-worker-uk"}'
            value: 1

  # ── kinowo-web-serving-down (min up < 1) ──────────────────────────────────────────────────────
  # One web pod's scrape fails (up 0) while the other answers: `min by (instance)` keeps each pod
  # its own series, so the failing one crosses and the healthy one sits at 1.
  - interval: 1m
    input_series:
      - series: 'up{instance="kinowo-web-a",job="kinowo-web"}'
        values: '1x5 0x10'
      - series: 'up{instance="kinowo-web-b",job="kinowo-web"}'
        values: '1x15'
    promql_expr_test:
      - expr: 'min by (instance) (up{job="kinowo-web"})'
        eval_time: 10m
        exp_samples:
          - labels: '{instance="kinowo-web-a"}'
            value: 0
          - labels: '{instance="kinowo-web-b"}'
            value: 1
      - expr: 'min by (instance) (up{job="kinowo-web"})'
        eval_time: 3m
        exp_samples:
          - labels: '{instance="kinowo-web-a"}'
            value: 1
          - labels: '{instance="kinowo-web-b"}'
            value: 1

  # ── kinowo-enrichment-source-failing (failure share > 0.5) ────────────────────────────────────
  # TMDB fails 30 of its last 40 checks in PL (0.75); IMDb fails 2 of 40 (0.05), the ordinary
  # noise of a rating source. A cinema service failing hard is not an enrichment source and is
  # not in the result at all.
  - interval: 1m
    input_series:
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="TMDB"}'
        values: '30x10'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="TMDB"}'
        values: '10x10'
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="IMDb"}'
        values: '2x10'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="IMDb"}'
        values: '38x10'
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="Kino Muza"}'
        values: '40x10'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="Kino Muza"}'
        values: '0x10'
    promql_expr_test:
      - expr: 'sum by (service, country) (kinowo_uptime_recent_failures{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}) / clamp_min(sum by (service, country) (kinowo_uptime_recent_failures{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}) + sum by (service, country) (kinowo_uptime_recent_successes{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}), 1)'
        eval_time: 5m
        exp_samples:
          - labels: '{country="pl",service="TMDB"}'
            value: 0.75
          - labels: '{country="pl",service="IMDb"}'
            value: 0.05

  # ── kinowo-corpus-census-stuck (> 4.5 missed census ticks in 45m) ──────────────────────────
  # The US census misses five ticks 5 minutes apart — its cache has not read the corpus for ~25
  # minutes and the gauges it feeds are frozen. DE misses four, which reads ~4.04 once `increase`
  # extrapolates: under the threshold, so a shorter spell rides out. The census ticks every 5
  # minutes since 2026-10-04 (it was a 15-minute scan with a `> 1.5` threshold: two passes).
  - interval: 30s
    input_series:
      - series: 'kinowo_worker_corpus_census_incomplete_total{country="us",job="kinowo-worker"}'
        values: '5x40 6x9 7x9 8x9 9x9 10x40'
      - series: 'kinowo_worker_corpus_census_incomplete_total{country="de",job="kinowo-worker"}'
        values: '5x40 6x9 7x9 8x9 9x60'
    promql_expr_test:
      - expr: 'sum by (country) (increase(kinowo_worker_corpus_census_incomplete_total[45m]))'
        eval_time: 55m
        exp_samples:
          - labels: '{country="us"}'
            value: 5.056179775280899
          - labels: '{country="de"}'
            value: 4.044943820224719
