# UNIT TESTS FOR THE MONGOD REPLICA-SET ALERTS, and specifically for the one thing a rule file
# cannot be read for: WHETHER AN EXPRESSION FIRES WHEN IT SHOULD.
#
# `promtool check rules` proves a rule file parses. It says nothing about meaning, and the failure
# this file was written for is entirely about meaning: `MongodNoPrimary` was
#
#     max(mongodb_mongod_replset_my_state == 1) or vector(0)
#
# which reads like a question and is not one. AN ALERT FIRES ON THE PRESENCE OF A SAMPLE, NOT ON
# ITS TRUTH -- and `max(x == 1)` produces a sample precisely when a member IS primary. The rule
# therefore fired continuously against a perfectly healthy set, and paged with the words "THE SET
# HAS NO LEADER AND IS REFUSING EVERY WRITE" while mongo-1 was PRIMARY and writing. It could only
# ever have gone quiet in the one situation it exists to catch.
#
# Every case below is written against the state the exporter actually reports (1 PRIMARY,
# 2 SECONDARY), so the pair `MongodNotPrimary` / `MongodNoPrimary` is pinned together: they overlap
# by design and the interesting assertions are the ones about which of them stays SILENT.
rule_files:
  - ../../nix/files/monitoring/rules/mongodb.rules

evaluation_interval: 1m

tests:

  # ---------------------------------------------------------------------------------------------
  # THE CASE THAT WAS BROKEN IN PRODUCTION. One member, PRIMARY, healthy -- the live shape of `rs0`
  # after the nbg1 -> fsn1 move retired the second member. Neither rule may say anything at all.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a single healthy PRIMARY is silent
    input_series:
      - series: 'mongodb_mongod_replset_my_state{host="mongo-1",instance="10.20.0.13:9216",job="mongodb",set="rs0"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: MongodNoPrimary
        exp_alerts: []
      - eval_time: 15m
        alertname: MongodNotPrimary
        exp_alerts: []


  # ---------------------------------------------------------------------------------------------
  # A PRIMARY AND A SECONDARY -- the shape of the set for the whole of a migration. The secondary is
  # doing exactly what it was added to do, so silence from both rules is the requirement.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a PRIMARY beside a healthy SECONDARY is silent
    input_series:
      - series: 'mongodb_mongod_replset_my_state{host="mongo-1",instance="10.20.0.13:9216",job="mongodb",set="rs0"}'
        values: "1x15"
      - series: 'mongodb_mongod_replset_my_state{host="mongo-2",instance="10.20.0.14:9216",job="mongodb",set="rs0"}'
        values: "2x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: MongodNoPrimary
        exp_alerts: []
      - eval_time: 15m
        alertname: MongodNotPrimary
        exp_alerts: []


  # ---------------------------------------------------------------------------------------------
  # THE FAILURE THE RULE EXISTS FOR. Two members, both SECONDARY: every series is a healthy-looking
  # 2, `MongodNotPrimary` is correctly silent, and the database is refusing every write.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: two secondaries and no leader fires MongodNoPrimary alone
    input_series:
      - series: 'mongodb_mongod_replset_my_state{host="mongo-1",instance="10.20.0.13:9216",job="mongodb",set="rs0"}'
        values: "2x15"
      - series: 'mongodb_mongod_replset_my_state{host="mongo-2",instance="10.20.0.14:9216",job="mongodb",set="rs0"}'
        values: "2x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: MongodNotPrimary
        exp_alerts: []
      - eval_time: 15m
        alertname: MongodNoPrimary
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: &no_primary_annotations
              summary: "no mongod in rs0 is PRIMARY"
              description: "THE SET HAS NO LEADER AND IS REFUSING EVERY WRITE. Reads still succeed and change streams cannot be opened, so the read tier goes on serving its projection out of memory and passing health checks while the showtimes age -- nothing looks broken.\nOn a set with one voting member this means that member is not PRIMARY and `MongodNotPrimary` will say which state it is in instead. On a set mid-migration it usually means a reconfig left two voters and one of them is unreachable, so neither can take a majority: `mongosh --eval 'rs.status()'` on either box names the member that is not answering."

  # ---------------------------------------------------------------------------------------------
  # THE ONE-MEMBER SET THAT STEPPED DOWN. Both rules fire, and that is intended: `MongodNotPrimary`
  # names the state the member is in, `MongodNoPrimary` says the set has no leader.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a lone member in RECOVERING fires both rules
    input_series:
      - series: 'mongodb_mongod_replset_my_state{host="mongo-1",instance="10.20.0.13:9216",job="mongodb",set="rs0"}'
        values: "3x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: MongodNotPrimary
        exp_alerts:
          - exp_labels:
              host: mongo-1
              instance: "10.20.0.13:9216"
              job: mongodb
              set: rs0
              severity: critical
            exp_annotations:
              summary: "mongod on mongo-1 is not PRIMARY (state 3)"
              description: "THIS MEMBER IS NEITHER PRIMARY NOR A HEALTHY SECONDARY. State 0/3/5 is a member still starting or recovering and may clear on its own; 6, 8 or 10 usually means mongod cannot see the replica-set configuration it is registered in, which on this fleet means the member host in that config (`fleet.mongodb.replSetMemberHost`) is not an address mongod is bound to. `mongosh --eval 'rs.status()'` on the box is the first command.\nA SECONDARY (state 2) IS NOT THIS ALERT and never was intended to be -- see the note on the expression. The failure where the set is up and refusing every write is `MongodNoPrimary`: reads succeed, writes fail, and CHANGE STREAMS -- which the web tier's whole live-update path depends on -- cannot be opened, while the read tier keeps serving its projected read model out of memory and passing its health checks. NOTHING LOOKS BROKEN while the showtimes age."
      - eval_time: 15m
        alertname: MongodNoPrimary
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *no_primary_annotations

  # ---------------------------------------------------------------------------------------------
  # NOTHING REPORTING AT ALL. `or vector(0)` is what makes the rule answer in this case, and the
  # answer is deliberately "fires": a monitoring stack that cannot see a primary should say so
  # loudly rather than go quiet. `MongodReplsetStateAbsent` still explains the absence separately.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: no member state at all still fires
    input_series:
      - series: 'up{job="mongodb",instance="10.20.0.13:9216"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: MongodNoPrimary
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations: *no_primary_annotations

  # ---------------------------------------------------------------------------------------------
  # ASSERTS. These two rules replaced ONE that summed every assert class together, and this block
  # is the reason: on 2026-09-05 that rule fired at 1.5/s and every assert in it was `user` --
  # connection churn from a five-worker `Recreate` rollout, against a mongod whose internal
  # counters were flat zero. The interesting assertions below are the ones about SILENCE.
  #
  # `mongodb_ss_asserts` is a COUNTER, so every series feeds a rising ramp: `1+Nx15` steps by N
  # each minute, which `rate(...[15m])` reads as N/60 per second.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a rollout's user-assert burst is silent
    input_series:
      # 90/min = 1.5/s, the measured peak of the 2026-09-05 rollout. Below the > 4 floor.
      - series: 'mongodb_ss_asserts{assert_type="user",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+90x40"
      - series: 'mongodb_ss_asserts{assert_type="regular",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+0x40"
      - series: 'mongodb_ss_asserts{assert_type="msg",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MongodUserAssertionsRising
        exp_alerts: []
      # THE POINT OF THE SPLIT: a healthy server's internal counters are not dragged over the line
      # by its clients' rejected operations. The old single rule fired here.
      - eval_time: 35m
        alertname: MongodInternalAssertionsRising
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # A CLIENT SENDING REJECTED OPERATIONS CONSTANTLY -- the shape the user rule is actually for,
  # e.g. a deploy that changed a credential. Well clear of any rollout's churn.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a sustained flood of rejected client operations fires
    input_series:
      # 600/min = 10/s.
      - series: 'mongodb_ss_asserts{assert_type="user",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+600x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MongodUserAssertionsRising
        exp_alerts:
          - exp_labels:
              host: mongo-1
              severity: warning
            exp_annotations:
              summary: "mongod on mongo-1 is rejecting 10.00 client operations/s"
              description: "CLIENTS ARE SENDING OPERATIONS MONGOD REJECTS -- a bad query, a failed authentication, an unauthorised command. Often a deploy that changed a credential. FIRST check whether this is just churn: `rate(mongodb_ss_connections{conn_type=\"totalCreated\"}[5m])` rising alongside it means pods are cycling and each new connection is paying its usual probe cost, which is not a fault. Then name the actual commands -- `grep -a '\"id\":20436' /var/log/mongodb/mongod.log` on mongo-1 gives the errmsg with the command and the database in it, and `\"id\":5286307` is a failed authentication. WRITE CONFLICTS ARE A RED HERRING HERE: `rate(mongodb_ss_metrics_operation_writeConflicts)` runs a flat ~1.7/s all day against the task queues, it is the loudest thing in the log, and it does not move this counter."
      - eval_time: 35m
        alertname: MongodInternalAssertionsRising
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # THE SERVER ITSELF UNHAPPY. `regular` at a trickle no client-side rule would notice -- 12/min
  # is 0.2/s, which the retired combined rule (> 1) would have sat silently through while a failed
  # internal invariant repeated every five seconds. `rollovers` is loud beside it and must be
  # ignored by BOTH rules: it counts the assert counters wrapping, not a fault.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a trickle of internal assertions fires while rollovers are ignored
    input_series:
      - series: 'mongodb_ss_asserts{assert_type="regular",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+12x40"
      - series: 'mongodb_ss_asserts{assert_type="rollovers",host="mongo-1",instance="10.20.0.13:9216",job="mongodb"}'
        values: "1+6000x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MongodInternalAssertionsRising
        exp_alerts:
          - exp_labels:
              host: mongo-1
              severity: warning
            exp_annotations:
              summary: "mongod on mongo-1 is raising 0.20 internal assertions/s"
              description: "ASSERTIONS ARE A LEADING INDICATOR, NOT AN OUTAGE, which is why this is a warning -- but these are the ones that suggest the SERVER is unhappy rather than its clients, and they normally sit at exactly zero. Read /var/log/mongodb/mongod.log: `warning` and `msg` are mongod explaining itself in prose, and a sustained `regular` count means a failed internal invariant. Check WiredTiger and the replica-set state next (`MongodNotPrimary`, the oplog rules above)."
      # 100/s of rollovers, and neither rule may see any of it.
      - eval_time: 35m
        alertname: MongodUserAssertionsRising
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # A HEALTHY MONGO-1 OVER A WEEK AND A BIT, WHICH NONE OF THE PROCESS, BACKUP, OPLOG OR CONNECTION
  # RULES MAY FIRE ON. mongod active, the exporter reaching it, a dump every night of a slowly
  # growing database (the timestamp is the dump's own finishing time), an 8h oplog window and a
  # fifth of the connection ceiling in use. Hourly samples: the backup rules think in days.
  # ---------------------------------------------------------------------------------------------
  - interval: 1h
    name: a healthy mongod with nightly dumps is silent
    input_series:
      - series: 'node_systemd_unit_state{name="mongodb.service",state="active",host="mongo-1"}'
        values: "1x200"
      - series: 'kinowo_mongodump_last_success_timestamp_seconds{host="mongo-1"}'
        values: "3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 3600 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 90000 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 176400 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 262800 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 349200 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 435600 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 522000 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 608400 694800 694800 694800 694800 694800 694800 694800 694800 694800"
      - series: 'kinowo_mongodump_last_size_bytes{host="mongo-1"}'
        values: "1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1000000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1010000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1020000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1030000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1040000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1050000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1060000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1070000 1080000 1080000 1080000 1080000 1080000 1080000 1080000 1080000 1080000"
      - series: 'mongodb_up{host="mongo-1"}'
        values: "1x200"
      - series: 'mongodb_mongod_replset_my_state{host="mongo-1",set="rs0"}'
        values: "1x200"
      - series: 'mongodb_mongod_replset_oplog_head_timestamp{host="mongo-1"}'
        values: "28800+3600x200"
      - series: 'mongodb_mongod_replset_oplog_tail_timestamp{host="mongo-1"}'
        values: "0+3600x200"
      - series: 'mongodb_ss_connections{conn_type="current",host="mongo-1"}'
        values: "200x200"
      - series: 'mongodb_ss_connections{conn_type="available",host="mongo-1"}'
        values: "800x200"
    alert_rule_test:
      - eval_time: 200h
        alertname: MongodNotRunning
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodUnitStateAbsent
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodumpStale
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodumpMetricAbsent
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodumpShrankSharply
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodExporterCannotReachMongod
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodReplsetStateAbsent
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodOplogWindowShort
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodOplogWindowMetricAbsent
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodConnectionsSaturated
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodServerStatusSeriesAbsent
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # MONGO-1 REPORTS NOTHING: no unit state, no exporter series, no dump textfile. Every absent()
  # rule fires once its own hold has run -- the 30m ones at 45m, the backup one, which waits out a
  # fresh host's first night, only at 7h.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a silent mongo-1 fires every absent() rule after its hold
    input_series:
      - series: 'up{job="node",host="mongo-1"}'
        values: "1x480"
    alert_rule_test:
      - eval_time: 20m
        alertname: MongodUnitStateAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: MongodUnitStateAbsent
        exp_alerts:
          - exp_labels:
              name: "mongodb.service"
              severity: "warning"
            exp_annotations:
              description: "`MongodNotRunning` above is a comparison and cannot fire without this series, so the database is currently unwatched. Either node_exporter's systemd collector is off or the mongo host has dropped out of scrape entirely (check `TargetDown`). It does NOT mean mongod is running."
              summary: "Nothing is reporting the state of mongod's unit"
      - eval_time: 20m
        alertname: MongodReplsetStateAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: MongodReplsetStateAbsent
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              description: "`MongodNotPrimary` above is a comparison and cannot fire without this series, so the single failure this exporter was deployed to catch is currently uncovered. THE MOST LIKELY CAUSE IS NOT AN OUTAGE, it is a name: this series exists only because roles/mongodb-exporter.nix passes `--compatible-mode`, and it is one of the names this file's header says to verify against a live /metrics on first deploy. Check the flag and the spelling before looking for a fault. If the exporter itself were down, `TargetDown` would have said so first."
              summary: "Nothing is reporting mongod's replica-set member state"
      - eval_time: 20m
        alertname: MongodOplogWindowMetricAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: MongodOplogWindowMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              description: "`MongodOplogWindowShort` is a comparison and cannot fire without this series. As with the replica-set state above, suspect the METRIC NAME first -- these are `--compatible-mode` names this file's header says to verify once against a live /metrics. The other candidate is the `kinowo_monitor` user having been created without `clusterMonitor`: the oplog is measured out of `local.oplog.rs`, and `clusterMonitor` is what grants read on `local`. A user with a narrower role authenticates and scrapes perfectly well, and simply publishes fewer series."
              summary: "Nothing is reporting the oplog window on mongo-1"
      - eval_time: 20m
        alertname: MongodServerStatusSeriesAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: MongodServerStatusSeriesAbsent
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              description: "`MongodConnectionsSaturated` and both `Mongod*AssertionsRising` rules are comparisons against this collector's output and none of them can fire without it. This one series stands in for the whole `diagnosticdata` collector: if it is absent, `--collector.diagnosticdata` has been dropped from the exporter's ExecStart, the metric names have moved, or the `kinowo_monitor` user lost the role that lets it run `serverStatus`. IT DOES NOT MEAN THE DATABASE IS HEALTHY."
              summary: "Nothing is reporting mongod's serverStatus counters"
      - eval_time: 5h
        alertname: MongodumpMetricAbsent
        exp_alerts: []
      - eval_time: 7h
        alertname: MongodumpMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              description: "`MongodumpStale` cannot fire without this series, so the backup is unwatched. Either the dump has never run on this host, or node_exporter is not reading the textfile directory the dump writes to (`--collector.textfile.directory` must point at fleet.mongodb.backup.textfileDirectory). AN ABSENT SERIES IS NOT A HEALTHY BACKUP."
              summary: "Nothing is publishing mongodump's success timestamp"

  # ---------------------------------------------------------------------------------------------
  # MONGOD STOPS AT 11M, the exporter losing it at the same moment, while the oplog window
  # collapses to 2h46m and connections reach 90% of the ceiling. Each is quiet before 11m and
  # firing once its own hold has run.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: a stopped, unreachable, short-oplog, saturated mongod fires
    input_series:
      - series: 'node_systemd_unit_state{name="mongodb.service",state="active",host="mongo-1"}'
        values: "1x10 0x30"
      - series: 'mongodb_up{host="mongo-1"}'
        values: "1x10 0x30"
      - series: 'mongodb_mongod_replset_oplog_head_timestamp{host="mongo-1"}'
        values: "100000x40"
      - series: 'mongodb_mongod_replset_oplog_tail_timestamp{host="mongo-1"}'
        values: "50000x10 90000x30"
      - series: 'mongodb_ss_connections{conn_type="current",host="mongo-1"}'
        values: "100x10 900x30"
      - series: 'mongodb_ss_connections{conn_type="available",host="mongo-1"}'
        values: "900x10 100x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: MongodNotRunning
        exp_alerts: []
      - eval_time: 15m
        alertname: MongodNotRunning
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              name: "mongodb.service"
              severity: "critical"
              state: "active"
            exp_annotations:
              description: "The database is down. The web tier will keep serving its projected read model from memory and its health checks will stay green, so THE SITE WILL LOOK FINE while it stops updating and every write from the worker fails. Check `journalctl -u mongodb -n 200`; the two failures worth ruling out first are the data volume not being mounted (the unit has RequiresMountsFor, so it refuses to start rather than creating an empty database) and the replica-set key file's permissions, which mongod checks at startup."
              summary: "mongod is not running on mongo-1"
      - eval_time: 10m
        alertname: MongodExporterCannotReachMongod
        exp_alerts: []
      - eval_time: 15m
        alertname: MongodExporterCannotReachMongod
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              severity: "critical"
            exp_annotations:
              description: "The exporter is running and answering scrapes; the DATABASE is what it cannot talk to. THIS IS NOT THE SAME ALERT AS `MongodNotRunning` and the difference is the point: if that one is silent, mongod's unit is `active` and the failure is between the exporter and the server. Three things produce that, in the order worth checking -- the `kinowo_monitor` user does not exist or its password in nix/secrets/mongo-1.yaml (`mongodb/exporter-password`) does not match, mongod has been restarted into `fleet.mongodb.bootstrapMode` (auth off, loopback only), or mongod is alive but wedged and answering nothing. `journalctl -u mongodb-exporter -n 50` names which."
              summary: "mongodb_exporter cannot reach mongod on mongo-1"
      - eval_time: 10m
        alertname: MongodOplogWindowShort
        exp_alerts: []
      - eval_time: 30m
        alertname: MongodOplogWindowShort
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              severity: "warning"
            exp_annotations:
              description: "This is the RESUME BUDGET for the application's change streams, not a disk warning. While it is this short, any consumer offline for longer than the window comes back to ChangeStreamHistoryLost and a full re-read. It shrinks for one of two reasons and they need opposite responses: a burst of writes (transient -- check whether the worker is backfilling), or a sustained rise in write rate (structural -- the oplog is now too small for the workload). THE FIX FOR THE SECOND IS NOT FREE: `oplogSizeMB` was cut from 4096 to 1024 because the data volume is 5GB, so growing the window means growing the Hetzner volume first (it grows in place; see terraform/server.mongo.tf)."
              summary: "The oplog window on mongo-1 is down to 2h 46m 40s"
      - eval_time: 10m
        alertname: MongodConnectionsSaturated
        exp_alerts: []
      - eval_time: 25m
        alertname: MongodConnectionsSaturated
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              severity: "warning"
            exp_annotations:
              description: "The ceiling comes from `LimitNOFILE` on the mongodb unit (64000), not from a MongoDB setting, so raising it is a change to roles/mongodb.nix. Before doing that, find out who is holding them: `db.currentOp(true)` and `db.serverStatus().connections` name the clients. A pool that grows without bound is a client bug, and raising the ceiling for it postpones the same failure at greater cost."
              summary: "mongod on mongo-1 is using 90% of its connection ceiling"

  # ---------------------------------------------------------------------------------------------
  # THE NIGHTLY DUMP STOPS. The last one finished at hour 1; 36 hours later it is still the last.
  # Silent at 30h, when one night's dump is merely late; firing at 40h.
  # ---------------------------------------------------------------------------------------------
  - interval: 1h
    name: a dump older than 36 hours fires
    input_series:
      - series: 'kinowo_mongodump_last_success_timestamp_seconds{host="mongo-1"}'
        values: "3600x48"
    alert_rule_test:
      - eval_time: 30h
        alertname: MongodumpStale
        exp_alerts: []
      - eval_time: 40h
        alertname: MongodumpStale
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              severity: "warning"
            exp_annotations:
              description: "The nightly dump has not completed since 1d 15h 0m 0s ago. Check `systemctl status mongodump` and `journalctl -u mongodump`. Remember what this covers and what it does not: it is a logical copy on the SAME volume as the database, so it protects against a bad migration or a dropped collection and not against losing the volume. Off-box replication of these dumps is a known gap."
              summary: "No successful mongodump for over 36 hours"

  # ---------------------------------------------------------------------------------------------
  # A TRUNCATED DUMP. A week of ~1 MB dumps, then night 8's comes out at 400 KB -- the shape of a
  # dump that died part-way and still wrote its directory. It fires against the week BEFORE it,
  # and night 9's dump at a normal 900 KB (under the old minimum, but nowhere near half) does not.
  # ---------------------------------------------------------------------------------------------
  - interval: 1h
    name: a dump under half the previous week's smallest fires
    input_series:
      - series: 'kinowo_mongodump_last_size_bytes{host="mongo-1"}'
        values: "1000000x191 400000x23 900000x23"
    alert_rule_test:
      - eval_time: 190h
        alertname: MongodumpShrankSharply
        exp_alerts: []
      - eval_time: 200h
        alertname: MongodumpShrankSharply
        exp_alerts:
          - exp_labels:
              host: "mongo-1"
              severity: "warning"
            exp_annotations:
              description: "A backup that is present but truncated is worse than a missing one, because it passes every check that only asks whether a dump exists. Compare the directory listings under fleet.mongodb.backup.directory before the next rotation removes the older copy."
              summary: "The last mongodump is less than half the size of the smallest in the past week"
      - eval_time: 230h
        alertname: MongodumpShrankSharply
        exp_alerts: []
