# UNIT TESTS FOR THE IDENTITY REGRESSION ALERTS (identity-regressions.rules).
#
# The gauges are what nix/files/identity-regressions.py publishes from the take-change log every 5
# minutes, scraped through node_exporter on monitoring-1. Cases are the two incidents the file was
# written for -- PL Peppa (123, build 96fb23c) and DE "Der kleine Prinz" (16) -- plus the quiet cases
# beside them: a 9-listing loss, a loss undone inside the 15-minute hold, a DE build at its churn bar,
# a listing that moved only twice ("Rose", 2026-10-22), and the watch going stale.
rule_files:
  - ../../nix/files/monitoring/rules/identity-regressions.rules

evaluation_interval: 1m

tests:
  # PL Peppa: 123 listings lost by 96fb23c. The film alert holds 15 minutes, then fires naming the film,
  # count and build; the build alert (PL's bar is 10) fires beside it. DE Prinz's 16 fires too; DE's
  # 9-listing loss and a 40-listing loss undone after 10 minutes do not.
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_film_net_lost{country="pl",tmdb="1778515",title="Świąteczna zabawa z Peppą",build="96fb23c6c38a",host="monitoring-1"}'
        values: '_x5 123x30'
      - series: 'kinowo_identity_film_net_lost{country="de",tmdb="309809",title="Der kleine Prinz",build="627fa9416268",host="monitoring-1"}'
        values: '_x5 16x30'
      - series: 'kinowo_identity_film_net_lost{country="de",tmdb="1499673",title="Rental Family",build="aa334f31db4c",host="monitoring-1"}'
        values: '_x5 9x30'
      - series: 'kinowo_identity_film_net_lost{country="uk",tmdb="1151422",title="Royal Opera House: Carmen",build="aa334f31db4c",host="monitoring-1"}'
        values: '_x5 40x10 _x20'
      - series: 'kinowo_identity_build_net_lost{country="pl",build="96fb23c6c38a",cause="code",tmdb="1778515",title="Świąteczna zabawa z Peppą",host="monitoring-1"}'
        values: '_x5 123x30'
      - series: 'kinowo_identity_build_net_lost{country="de",build="627fa9416268",cause="code",tmdb="309809",title="Der kleine Prinz",host="monitoring-1"}'
        values: '_x5 65x30'
      - series: 'kinowo_identity_regressions_last_success_timestamp_seconds{host="monitoring-1"}'
        values: '0+60x35'
    alert_rule_test:
      - eval_time: 15m
        alertname: IdentityFilmListingsLost
        exp_alerts: []
      # Still inside the hold; and DE's 65 is at its bar, not over it, for the whole run.
      - eval_time: 15m
        alertname: IdentityBuildNetLosses
        exp_alerts: []
      - eval_time: 25m
        alertname: IdentityFilmListingsLost
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl, tmdb: "1778515", title: "Świąteczna zabawa z Peppą", build: "96fb23c6c38a", host: monitoring-1 }
            exp_annotations:
              summary: "pl: 'Świąteczna zabawa z Peppą' (tmdb 1778515) lost 123 listings in 6h, build 96fb23c6c38a"
              description: "123 pl listings held 'Świąteczna zabawa z Peppą' (tmdb 1778515) six hours ago and now show no film (no rating, poster or synopsis), net of listings newly matched to it; most were unmatched by build 96fb23c6c38a. Dig in (logs.kinowo.net): `_time:6h country:pl kind:* (tmdb_before:=1778515 or tmdb_after:=1778515) | stats by (kind, build, basis, venue) count() n | sort by (n desc)` -- each line's `repro` reproduces one listing at the build; `scripts/listing-history pl --title '...'` gives the per-deploy history."
          - exp_labels: { domain: identity, severity: warning, country: de, tmdb: "309809", title: "Der kleine Prinz", build: "627fa9416268", host: monitoring-1 }
            exp_annotations:
              summary: "de: 'Der kleine Prinz' (tmdb 309809) lost 16 listings in 6h, build 627fa9416268"
              description: "16 de listings held 'Der kleine Prinz' (tmdb 309809) six hours ago and now show no film (no rating, poster or synopsis), net of listings newly matched to it; most were unmatched by build 627fa9416268. Dig in (logs.kinowo.net): `_time:6h country:de kind:* (tmdb_before:=309809 or tmdb_after:=309809) | stats by (kind, build, basis, venue) count() n | sort by (n desc)` -- each line's `repro` reproduces one listing at the build; `scripts/listing-history de --title '...'` gives the per-deploy history."
      - eval_time: 25m
        alertname: IdentityBuildNetLosses
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl, build: "96fb23c6c38a", cause: code, tmdb: "1778515", title: "Świąteczna zabawa z Peppą", host: monitoring-1 }
            exp_annotations:
              summary: "pl: build 96fb23c6c38a's code unmatched 123 more listings than it matched (most: 'Świąteczna zabawa z Peppą')"
              description: "Over its last 24h in pl, build 96fb23c6c38a took the film away from 123 more listings than it gave one to on inputs that did not move (cause code) -- above the country's normal deploy churn (DE 65, UK 25, elsewhere 10). The film that lost most: 'Świąteczna zabawa z Peppą' (tmdb 1778515). Dig in: `_time:24h country:pl build:=96fb23c6c38a cause:code kind:* | stats by (kind, tmdb_before, title_before) count() n | sort by (n desc)` then the listings' `repro` lines. If the build is still deployed, CI's identity takes check for it should have listed these takes."
      - eval_time: 25m
        alertname: IdentityRegressionWatchStale
        exp_alerts: []

  # The cause decides: a build's net loss pages only when its code did it. PL build dbee52416, 2026-10-24 18:51Z: 11
  # listings of "Kupiłem motocykl, który jest wampirem" rested on Kino Pionier 1907's one listing, which left when its
  # screening passed -- the evidence's, past PL's bar of 10 and silent. The same 11 lost on inputs that did not move
  # after a build change (cause code, build 0e41a4812) page.
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_build_net_lost{country="pl",build="dbee52416",cause="evidence",tmdb="41153",title="Kupiłem motocykl, który jest wampirem",host="monitoring-1"}'
        values: '11x40'
      - series: 'kinowo_identity_build_net_lost{country="pl",build="0e41a4812",cause="code",tmdb="41153",title="Kupiłem motocykl, który jest wampirem",host="monitoring-1"}'
        values: '11x40'
      - series: 'kinowo_identity_regressions_last_success_timestamp_seconds{host="monitoring-1"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: IdentityBuildNetLosses
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl, build: "0e41a4812", cause: code, tmdb: "41153", title: "Kupiłem motocykl, który jest wampirem", host: monitoring-1 }
            exp_annotations:
              summary: "pl: build 0e41a4812's code unmatched 11 more listings than it matched (most: 'Kupiłem motocykl, który jest wampirem')"
              description: "Over its last 24h in pl, build 0e41a4812 took the film away from 11 more listings than it gave one to on inputs that did not move (cause code) -- above the country's normal deploy churn (DE 65, UK 25, elsewhere 10). The film that lost most: 'Kupiłem motocykl, który jest wampirem' (tmdb 41153). Dig in: `_time:24h country:pl build:=0e41a4812 cause:code kind:* | stats by (kind, tmdb_before, title_before) count() n | sort by (n desc)` then the listings' `repro` lines. If the build is still deployed, CI's identity takes check for it should have listed these takes."

  # A listing moving between two films three times in a day fires at once; "Rose" at two does not.
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_listing_flips{country="uk",tmdb_a="1096642",tmdb_b="1460982",title="The Ties That Bind Us",build="afa874093",venue="Chichester Cinema at New Park",host="monitoring-1"}'
        values: '2x5 3x10'
      - series: 'kinowo_identity_listing_flips{country="de",tmdb_a="1176962",tmdb_b="1712584",title="Rose",build="6032747",venue="Eschborn K",host="monitoring-1"}'
        values: '2x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: IdentityListingFlipFlop
        exp_alerts: []
      - eval_time: 8m
        alertname: IdentityListingFlipFlop
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk, tmdb_a: "1096642", tmdb_b: "1460982", title: "The Ties That Bind Us", build: afa874093, venue: "Chichester Cinema at New Park", host: monitoring-1 }
            exp_annotations:
              summary: "uk: 'The Ties That Bind Us' flipped 3 times in 24h between tmdb 1096642 and 1460982 (build afa874093)"
              description: "A uk listing (e.g. at Chichester Cinema at New Park) moved between films 1096642 and 1460982 3 times in the last 24h, the latest under build afa874093: two rules undoing each other. Dig in: `_time:24h country:uk kind:changed (tmdb_before:=1096642 or tmdb_before:=1460982) | fields _time, venue, listing, tmdb_before, tmdb_after, basis, projection_mode, build, repro`"

  # The watch stops: its timestamp ages past 30 minutes, held 15 more. And a host that never published
  # at all (absent) is the same alert.
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_regressions_last_success_timestamp_seconds{host="monitoring-1"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: IdentityRegressionWatchStale
        exp_alerts: []
      - eval_time: 50m
        alertname: IdentityRegressionWatchStale
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, host: monitoring-1 }
            exp_annotations:
              summary: "The identity regression watch has not read the take-change log for over 30 minutes"
              description: "identity-regressions.timer on monitoring-1 publishes kinowo_identity_* gauges from VictoriaLogs every 5 minutes; IdentityFilmListingsLost, IdentityBuildNetLosses and IdentityListingFlipFlop read them. `journalctl -u identity-regressions -n 50` on monitoring-1 (VictoriaLogs down, or a query error)."
  - interval: 1m
    input_series:
      - series: 'up{job="node",host="monitoring-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: IdentityRegressionWatchStale
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning }
            exp_annotations:
              summary: "The identity regression watch has not read the take-change log for over 30 minutes"
              description: "identity-regressions.timer on monitoring-1 publishes kinowo_identity_* gauges from VictoriaLogs every 5 minutes; IdentityFilmListingsLost, IdentityBuildNetLosses and IdentityListingFlipFlop read them. `journalctl -u identity-regressions -n 50` on monitoring-1 (VictoriaLogs down, or a query error)."
  # The flip gauge gone while the watch runs (2026-10-24..26: no pair at the floor of 2 wrote no sample) fires once the
  # 15-minute hold passes; the script's 0 when nothing flips is quiet, and so is a stopped watch with both gauges gone
  # (IdentityRegressionWatchStale's, above).
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_regressions_last_success_timestamp_seconds{host="monitoring-1"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: IdentityListingFlipsAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: IdentityListingFlipsAbsent
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning }
            exp_annotations:
              summary: "The identity regression watch runs but publishes no kinowo_identity_listing_flips"
              description: "identity-regressions on monitoring-1 reads the take-change log (kinowo_identity_regressions_last_success_timestamp_seconds is present) but its textfile has no kinowo_identity_listing_flips sample, so IdentityListingFlipFlop and the fleet dashboard's flip-flop panel are blind. render() in nix/files/identity-regressions.py must write the gauge every run (0 when nothing flips): `grep listing_flips /etc/node-exporter/textfile.d/identity-regressions.prom`."
  - interval: 1m
    input_series:
      - series: 'kinowo_identity_regressions_last_success_timestamp_seconds{host="monitoring-1"}'
        values: '0+60x30'
      - series: 'kinowo_identity_listing_flips{host="monitoring-1"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: IdentityListingFlipsAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: IdentityListingFlipFlop
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="node",host="monitoring-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: IdentityListingFlipsAbsent
        exp_alerts: []
  # The nightly drift check (.github/workflows/identity-live-drift.yml), one pushed sample per country and kind a night:
  # DE's 7 drifted listings (4 lost, 3 changed) fire once the 5-minute hold passes and hold through the day with no
  # newer sample; PL's 3 stay under the bar of 5. The next night's push of 0 clears DE.
  - interval: 1h
    input_series:
      - series: 'kinowo_identity_drift_listings{country="de",kind="lost",job="kinowo-ci"}'
        values: '4 _x23 0'
      - series: 'kinowo_identity_drift_listings{country="de",kind="changed",job="kinowo-ci"}'
        values: '3 _x23 0'
      - series: 'kinowo_identity_drift_listings{country="de",kind="gained",job="kinowo-ci"}'
        values: '0 _x23 0'
      - series: 'kinowo_identity_drift_listings{country="pl",kind="lost",job="kinowo-ci"}'
        values: '3 _x23 3'
    alert_rule_test:
      - eval_time: 3m
        alertname: IdentityIncrementalDrift
        exp_alerts: []
      - eval_time: 23h
        alertname: IdentityIncrementalDrift
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: 7 listings' live identity takes differ from a whole resolve of the same listings"
              description: "The nightly drift check found 7 de listings whose live film (what prod screened them as when the newest recording was made) is not what a whole resolve with nothing kept takes. The listings: the newest \"Identity live drift\" run's `identity-live-drift` artifact, live-drift-de.tsv; `scripts/identity-slice de --key 'venue|title'` slices one, and `scripts/identity-slice de --drift` replays the incremental sequence on a recording."
      - eval_time: 25h
        alertname: IdentityIncrementalDrift
        exp_alerts: []
  # The check stopping: DE's newest compared moment was recorded at 0 and never again, PL's a day later. DE fires once
  # its moment is two days old and the hour's hold has passed; PL is a day younger.
  - interval: 1h
    input_series:
      - series: 'kinowo_identity_drift_recorded_timestamp_seconds{country="de",job="kinowo-ci"}'
        values: '0'
      - series: 'kinowo_identity_drift_recorded_timestamp_seconds{country="pl",job="kinowo-ci"}'
        values: '_x24 86400'
    alert_rule_test:
      - eval_time: 48h30m
        alertname: IdentityLiveDriftStale
        exp_alerts: []
      - eval_time: 50h
        alertname: IdentityLiveDriftStale
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: the identity drift check has compared nothing for over two days"
              description: "kinowo_identity_drift_recorded_timestamp_seconds{country=\"de\"} is over two days old: the nightly \"Record scrape fixtures\" run or the \"Identity live drift\" run after it failed for de, so IdentityIncrementalDrift reads nothing new. `agentctl ci-why` or the \"Identity live drift\" run's log."
