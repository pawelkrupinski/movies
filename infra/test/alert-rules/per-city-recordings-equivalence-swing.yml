# THE THREE PER-CITY RULES READ THROUGH RECORDINGS SAY WHAT THEY SAID ON THE RAW SERIES.
#
# 2026-11-18: CityDarkInBothTiers, kinowo-movies-served-city-empty and kinowo-movies-served-swing
# moved their long windows into recording rules (rules/runtime-invariants.rules: the groups
# per-city-served-history and per-city-served-swing). These suites keep each rule's OLD expression
# verbatim and ask, at hundreds of instants over series built to put a single qualifying (or
# disqualifying) sample at every boundary the recordings introduce, whether the old and the
# production expression return the same series: `(old unless new) or (new unless old)` is empty,
# and where the value is what the alert reports, `old != new` is empty too. A control per case
# shows the production expression does fire, so an empty difference is not two empty sides.
#
# Written by a generator (the eval_time lists are sweeps plus every boundary crossing, too many to
# write by hand); change a rule and its expression here together.
#
# The swing recording runs every minute, as Grafana evaluated the raw query.
rule_files:
  - ../../nix/files/monitoring/rules/runtime-invariants.rules

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------------------------------------------
  # kinowo-movies-served-swing: the recorded ratio against the raw query
  # A crater with the corpus holding, one thinning in lockstep, a two-step decline, a jump, a retired
  # page, a corpus that fell by just under half, and a worker restart. At every minute the old query and `drop_ratio_1h * 1` return the same
  # series with the same values.
  # ------------------------------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kinowo_web_movies_served{scope="all",country="pl",city="crater"}'
        values: '20x119 0x60 20x60'
      - series: 'kinowo_worker_movies_served{scope="all",country="pl",city="crater"}'
        values: '20x240'
      - series: 'kinowo_web_movies_served{scope="all",country="pl",city="lockstep"}'
        values: '20x119 0x60 20x60'
      - series: 'kinowo_worker_movies_served{scope="all",country="pl",city="lockstep"}'
        values: '20x119 0x60 20x60'
      - series: 'kinowo_web_movies_served{scope="all",country="pl",city="stepdown"}'
        values: '12x119 7x60 2x60'
      - series: 'kinowo_worker_movies_served{scope="all",country="pl",city="stepdown"}'
        values: '12x240'
      - series: 'kinowo_web_movies_served{scope="all",country="pl",city="jump"}'
        values: '3x119 13x120'
      - series: 'kinowo_worker_movies_served{scope="all",country="pl",city="jump"}'
        values: '3x240'
      - series: 'kinowo_web_movies_served{scope="all",country="pl",city="partial"}'
        values: '20x119 0x120'
      - series: 'kinowo_worker_movies_served{scope="all",country="pl",city="partial"}'
        values: '20x119 11x120'
      - series: 'kinowo_web_movies_served{scope="all",country="de",city="retired"}'
        values: '34x119 0x10 _x110'
      - series: 'kinowo_worker_movies_served{scope="all",country="de",city="retired"}'
        values: '34x119 _x120'
      - series: 'kinowo_web_movies_served{scope="all",country="de",city="stillhere"}'
        values: '34x119 0x120'
      - series: 'kinowo_worker_movies_served{scope="all",country="de",city="stillhere"}'
        values: '34x119 stale _x2 34x117'
      - series: 'kinowo_web_movies_served{scope="all",country="de",city="calm"}'
        values: '20x240'
      - series: 'kinowo_worker_movies_served{scope="all",country="de",city="calm"}'
        values: '20x119 stale _x2 20x117'
    promql_expr_test:
      - expr: 'instance_city:web_movies_served:drop_ratio_1h * 1'
        eval_time: 120m
        exp_samples:
          - labels: '{city="crater",country="pl",scope="all"}'
