          - labels: '{city="partial",country="pl",scope="all"}'
            value: 1
          - labels: '{city="retired",country="de",scope="all"}'
            value: 1
          - labels: '{city="stepdown",country="pl",scope="all"}'
            value: 4.1258741258741255E-01
