      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="0.1"}'
        values: '0+0x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="0.15"}'
        values: '0+0x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="0.25"}'
        values: '0+0x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="0.5"}'
        values: '0+0x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="1"}'
        values: '0+0x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="2.5"}'
        values: '0+30x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="5"}'
        values: '0+30x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="10"}'
        values: '0+30x200'
      - series: 'kinowo_web_http_request_duration_seconds_bucket{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream",le="+Inf"}'
        values: '0+30x200'
      - series: 'kinowo_web_http_request_duration_seconds_count{job="kinowo-web",country="pl",instance="kinowo-web-pl",route="/uptime/stream"}'
        values: '0+30x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebPageLatencyHigh
        exp_alerts: []
      - eval_time: 2h
        alertname: WebEndpointLatencyHigh
        exp_alerts: []
