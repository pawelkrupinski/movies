# THE CAUSE-1-VS-CAUSE-2 GATE ON `kinowo-movies-served-swing`, EVALUATED RATHER THAN READ.
#
# Mirrors grafana-movies-served-city-empty.yml's structure: this rule lives in Grafana's
# provisioning (grafana/alerting/alert-rules.yaml), not a file Prometheus loads itself, so
# promtool cannot load it as a rule — but its query A is ordinary PromQL against the same
# datasource, and `promql_expr_test` will evaluate it. test_alert_rule_coverage.py
# fails if this file's expression ever drifts from alert-rules.yaml's, so this suite cannot
# quietly go on testing a query production no longer runs.
#
# WHY THIS SUITE EXISTS. es/zamora paged `kinowo-movies-served-swing` three times in September
# 2026 (09-03, 09-11, 09-17) and all three were confirmed cause (2): a single-venue city's corpus
# thinning as its freshest scraped listing ran out of upcoming screenings between scrape passes,
# not a web tier failing to serve what the corpus still had.
# `kinowo_worker_movies_served{city="zamora"}` moved in EXACT lockstep with the web-side gauge at
# every 5-minute sample through the whole 2026-09-17 episode (7 → 6 → 2, held 8h, back to 13), and
# `kinowo_worker_readmodel_films_pruned_total{city="zamora"}` was empty the entire time — ruling
# out a prune. Query A now excludes (`unless on (city)`) any city whose corpus-side gauge swung
# down by the same >50% margin over the same window, so only a city whose corpus did NOT also
# crater still fires — the read-model-defect shape (cause 1) this rule exists to catch.
rule_files: []

evaluation_interval: 10m

tests:
  # ── BOTH CAUSES, SIDE BY SIDE ────────────────────────────────────────────────────────────────
  # Two cities, both dropping from 8 films to 0 on the web side in the same sample (an 8-film drop
  # comfortably clears the >=4 floor). "hadbug"'s corpus reading stays flat at 8 throughout — the
  # web stopped serving what the corpus still has, cause (1). "wentdark"'s corpus reading drops in
  # lockstep with its web reading — the corpus itself thinned, cause (2), the exact shape
  # es/zamora turned out to be on 09-03, 09-11 and 09-17.
  - interval: 10m
    input_series:
      - series: 'kinowo_web_movies_served{scope="all",city="hadbug",country="pl"}'
        values: '8x300 0x10'
      - series: 'kinowo_worker_movies_served{scope="all",city="hadbug",country="pl"}'
        values: '8x310'
      - series: 'kinowo_web_movies_served{scope="all",city="wentdark",country="es"}'
        values: '8x300 0x10'
      - series: 'kinowo_worker_movies_served{scope="all",city="wentdark",country="es"}'
        values: '8x300 0x10'
    promql_expr_test:
      # THE EXPRESSION, PINNED VERBATIM FROM alert-rules.yaml
      # (test_alert_rule_coverage.py checks some suite evaluates it
      # character-for-character). eval_time lands on the FIRST post-drop sample, where the 1h
      # lookback still averages mostly pre-drop 8s — the transition moment the live rule pages on.
      - expr: '((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_web_movies_served{scope="all"}[1h]), 1)) and ((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) >= 4) unless on (city) ((avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]) - kinowo_worker_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]), 1) > 0.5) unless on (city) ((max_over_time(kinowo_worker_movies_served{scope="all"}[1h]) unless on (city) kinowo_worker_movies_served{scope="all"}) and on (country) kinowo_worker_movies_served{scope="all"})'
        eval_time: 3010m
        exp_samples:
          # ONLY "hadbug" — a listed sample and nothing else, so if "wentdark" ever reappeared (a
          # future regression that drops the `unless on (city)` clause) this test fails on the
          # extra, unlisted series.
          - labels: '{scope="all",city="hadbug",country="pl"}'
            value: 1

  # ── A STEADY CITY IS SILENT ──────────────────────────────────────────────────────────────────────
  # Both sides flat at 8 films for the whole window, and a small dip of 2 (under the >=4 floor)
  # elsewhere: no series at all comes out, so Grafana has nothing to hold against the threshold.
  - interval: 10m
    input_series:
      - series: 'kinowo_web_movies_served{scope="all",city="steady",country="pl"}'
        values: '8x310'
      - series: 'kinowo_worker_movies_served{scope="all",city="steady",country="pl"}'
        values: '8x310'
      - series: 'kinowo_web_movies_served{scope="all",city="dipped",country="pl"}'
        values: '8x300 6x10'
      - series: 'kinowo_worker_movies_served{scope="all",city="dipped",country="pl"}'
        values: '8x310'
    promql_expr_test:
      - expr: '((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_web_movies_served{scope="all"}[1h]), 1)) and ((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) >= 4) unless on (city) ((avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]) - kinowo_worker_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]), 1) > 0.5) unless on (city) ((max_over_time(kinowo_worker_movies_served{scope="all"}[1h]) unless on (city) kinowo_worker_movies_served{scope="all"}) and on (country) kinowo_worker_movies_served{scope="all"})'
        eval_time: 3010m
        exp_samples: []

  # ── A PAGE THAT LEFT THE ROSTER IS NOT A READ-MODEL OUTAGE ───────────────────────────────────
  # 2026-09-23 18:29Z: the Polish re-cluster (8db89099c) retired the `ketrzyn` and
  # `starogard-gdanski` pages (`PolishPages.retired`: → gizycko, → tczew). From the deploy the
  # worker stopped publishing a corpus series for either, while the web gauge read 0 for them for
  # ten minutes before its series went too — 10 → 0 and 34 → 0 with NO corpus series left to
  # compare, so the `unless` found nothing to exclude and both paged, then "resolved" through
  # MissingSeries. Every film had moved to the page now holding the town (gizycko 9-10, tczew 68 =
  # 34 + 34), none was lost. A city whose corpus series was there in the last hour and is gone
  # now has left the roster (or its worker stopped counting it — ReadModelServedGaugesAbsent's
  # alarm, not this one's), so it is excluded like a corpus that cratered. "stillhere" is the
  # control: its corpus series is present and flat, so its web drop still pages.
  - interval: 5m
    input_series:
      - series: 'kinowo_web_movies_served{scope="all",city="retired",country="pl"}'
        values: '34x24 0x2'
      - series: 'kinowo_worker_movies_served{scope="all",city="retired",country="pl"}'
        values: '34x24 _x2'
      - series: 'kinowo_web_movies_served{scope="all",city="stillhere",country="pl"}'
        values: '34x24 0x2'
      - series: 'kinowo_worker_movies_served{scope="all",city="stillhere",country="pl"}'
        values: '34x26'
    promql_expr_test:
      - expr: '((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_web_movies_served{scope="all"}[1h]), 1)) and ((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) >= 4) unless on (city) ((avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]) - kinowo_worker_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]), 1) > 0.5) unless on (city) ((max_over_time(kinowo_worker_movies_served{scope="all"}[1h]) unless on (city) kinowo_worker_movies_served{scope="all"}) and on (country) kinowo_worker_movies_served{scope="all"})'
        eval_time: 130m
        exp_samples:
          - labels: '{scope="all",city="stillhere",country="pl"}'
            value: 1

  # ── A WORKER RESTART IS NOT A RETIREMENT ────────────────────────────────────────────────────────
  # The exclusion above must not fire on the ~3 minutes a worker restart leaves EVERY one of its
  # country's corpus series absent: that would hide a real web drop for the gap and reset the
  # rule's 5m hold. What tells the two apart is the rest of the country -- a retired page vanishes
  # while the worker goes on counting its other cities, a restart takes them all. Here pl's worker
  # is gone for three minutes at 60m (`stale`), and "broken"'s web side drops 34 -> 0 at the same
  # moment -- the read-model shape this rule exists for, still reported through the gap.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_movies_served{scope="all",city="broken",country="pl"}'
        values: '34x59 0x10'
      - series: 'kinowo_worker_movies_served{scope="all",city="broken",country="pl"}'
        values: '34x59 stale _x2 34x7'
      - series: 'kinowo_web_movies_served{scope="all",city="calm",country="pl"}'
        values: '20x69'
      - series: 'kinowo_worker_movies_served{scope="all",city="calm",country="pl"}'
        values: '20x59 stale _x2 20x7'
    promql_expr_test:
      - expr: '((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_web_movies_served{scope="all"}[1h]), 1)) and ((avg_over_time(kinowo_web_movies_served{scope="all"}[1h]) - kinowo_web_movies_served{scope="all"}) >= 4) unless on (city) ((avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]) - kinowo_worker_movies_served{scope="all"}) / clamp_min(avg_over_time(kinowo_worker_movies_served{scope="all"}[1h]), 1) > 0.5) unless on (city) ((max_over_time(kinowo_worker_movies_served{scope="all"}[1h]) unless on (city) kinowo_worker_movies_served{scope="all"}) and on (country) kinowo_worker_movies_served{scope="all"})'
        eval_time: 61m
        exp_samples:
          - labels: '{scope="all",city="broken",country="pl"}'
            value: 1
