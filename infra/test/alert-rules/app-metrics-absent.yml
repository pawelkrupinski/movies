- interval: 1m
  input_series:
  - series: up{job="kinowo-web",country="pl"}
    values: 1x30
  - series: up{job="kinowo-worker",country="pl"}
    values: 1x30
  - series: kinowo_uptime_recent_failures{job="kinowo-web",country="pl"}
    values: '0x30'
  - series: kinowo_uptime_recent_successes{job="kinowo-web",country="pl"}
    values: '0x30'
  - series: kinowo_web_decode_failures_total{job="kinowo-web",country="pl"}
    values: '0x30'
  - series: kinowo_web_http_request_duration_seconds_count{job="kinowo-web",country="pl"}
    values: '0x30'
  - series: kinowo_web_mongo_unauthorized_total{job="kinowo-web",country="pl"}
    values: '0x30'
  - series: kinowo_web_mongo_write_errors_total{job="kinowo-web",country="pl"}
    values: '0x30'
