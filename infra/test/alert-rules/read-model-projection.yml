# UNIT TESTS FOR THE READ-MODEL PROJECTION ALERTS.
#
# The load-bearing test is the SECOND one: it replays 2026-09-04 as the metrics saw it once BOTH
# cursors are counted, and asserts that nothing fires. That evening's 40x projection climb was a
# `screenings` cursor doing exactly its job -- one event, one projection -- and a rule that pages
# for it would be paging for a working worker. The rule exists for the case where the projections
# have no metered trigger AT ALL, which is what the same evening looked like through the metrics
# that existed at the time (the first test).
rule_files:
  - ../../nix/files/monitoring/rules/read-model-projection.rules

evaluation_interval: 1m

tests:
  # THE SHAPE THE RULE EXISTS FOR: 2 projections/s against a movies cursor doing 0.04/s and a
  # screenings cursor reporting nothing. 50:1. This is worker-de on 2026-09-04 as the dashboard
  # actually rendered it -- and it is also what a THIRD, unmetered trigger would look like.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_project_calls_total{country="de",job="kinowo-worker"}'
        values: '0+120x180'
      - series: 'kinowo_worker_movie_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+2.4x180'
      - series: 'kinowo_worker_screenings_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+0x180'
      - series: 'kinowo_worker_movie_slots_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+0x180'
    alert_rule_test:
      # `for: 1h` -- a worker rollout restarts both cursors and both counters, and the fleet
      # redeployed five times in four hours the day this was written.
      - eval_time: 45m
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts: []
      - eval_time: 2h
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts:
          - exp_labels:
              severity: warning
              country: de
            exp_annotations:
              summary: "de is projecting 2.00/s more than its change streams can explain"
              description: "`readmodel_project_calls_total` is running more than 3x the combined rate of the three cursors that are supposed to drive it, so something is projecting rows that no metered change-stream event asked for. Panel 47 on the application dashboard plots all four series together and panel 48 draws the sum. Check, in order: whether a FOURTH trigger has been added and not metered (that is what this rule exists to catch -- the `screenings` cursor itself was unmetered until 2026-09-05 and cost an evening); whether `ReadModelProjector.reconcile` is being called by something other than a backfill script (the scheduled sweep re-projects nothing and logs \"reprojected 0 doc(s)\", so its log line settles that in one grep); and whether a cursor is reopening in a loop, which replays its resume token and inflates projections without inflating the event counters proportionally."

  # THE SAME EVENING, ONCE THE SECOND CURSOR IS COUNTED. Identical projection rate, but the
  # screenings cursor now reports the ~2 events/s that were driving it. One event, one projection:
  # the worker was explaining itself perfectly and only the instrumentation was short. NOTHING may
  # fire here -- this is the case that decides whether the rule is worth having.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_project_calls_total{country="de",job="kinowo-worker"}'
        values: '0+120x180'
      - series: 'kinowo_worker_movie_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+2.4x180'
      - series: 'kinowo_worker_screenings_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+118x180'
      - series: 'kinowo_worker_movie_slots_change_events_total{country="de",job="kinowo-worker",op="update"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts: []

  # A WIDE RELEASE, COALESCED. 100 screenings events/s while the apply collapses them onto ~4
  # projections/s, because they all name the same film and the apply re-reads its current state.
  # A ratio far UNDER 1 is the coalescing working, and this rule must never read it as a fault —
  # it only ever looks upward.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_project_calls_total{country="us",job="kinowo-worker"}'
        values: '0+4x180'
      - series: 'kinowo_worker_movie_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+6x180'
      - series: 'kinowo_worker_screenings_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+6000x180'
      - series: 'kinowo_worker_movie_slots_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts: []

  # THE FLOOR, and the reason it is not decoration. A quiet country projecting 0.05/s against zero
  # metered events is an INFINITE ratio -- every country idles there overnight, and PL's baseline
  # over 2026-09-01..04 never left 0.1-0.6/s. Without the 0.5/s floor this rule pages the fleet
  # every night for nothing.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_project_calls_total{country="pl",job="kinowo-worker"}'
        values: '0+3x180'
      - series: 'kinowo_worker_movie_change_events_total{country="pl",job="kinowo-worker",op="update"}'
        values: '0+0x180'
      - series: 'kinowo_worker_screenings_change_events_total{country="pl",job="kinowo-worker",op="update"}'
        values: '0+0x180'
      - series: 'kinowo_worker_movie_slots_change_events_total{country="pl",job="kinowo-worker",op="update"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts: []

  # A BUSY, HEALTHY WORKER. US at ~1.3 projections/s, fully accounted for by its cursors, with
  # the ratio sitting slightly under 1 the way a reopened cursor's replay leaves it. Well above the
  # floor, so only the ratio keeps it quiet.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_project_calls_total{country="us",job="kinowo-worker"}'
        values: '0+78x180'
      - series: 'kinowo_worker_movie_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+6x180'
      - series: 'kinowo_worker_screenings_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+90x180'
      - series: 'kinowo_worker_movie_slots_change_events_total{country="us",job="kinowo-worker",op="update"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelProjectionTriggerUnaccounted
        exp_alerts: []

  # THE TRIPWIRE. With the projection counter gone the rule above is a comparison against nothing,
  # so it is silent -- and silence is what a well-behaved projector looks like too.
  - interval: 1m
    input_series:
      - series: 'up{job="kinowo-worker",instance="kinowo-worker-pl"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReadModelProjectionMetricsAbsent
        exp_alerts: []
      - eval_time: 90m
        alertname: ReadModelProjectionMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No worker is publishing read-model projection metrics"
              description: "`kinowo_worker_readmodel_project_calls_total` has no series from any country, so ReadModelProjectionTriggerUnaccounted cannot fire and the read model's whole input path is unwatched. Either every worker is down -- in which case TargetDown in monitoring-self.rules is also firing and is the better alert to read -- or the projector is no longer wired to `WorkerTaskMetrics`, which TargetDown would NOT catch because the pod is up and serving /metrics without this family in it."

  # ---------------------------------------------------------------------------------------------
  # FILMS INVISIBLE WHILE SCREENING. The measured baseline is zero, so the rule is a plain > 0 --
  # these cases pin that a steady zero stays quiet, that one stuck row pages after 2h, and that a
  # row which resolves itself inside the window never does.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",subset="unresolved_with_showtimes"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: ReadModelFilmsInvisibleWithScreenings
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kinowo_worker_corpus_movies{country="es",job="kinowo-worker",subset="unresolved_with_showtimes"}'
        values: '1x240'
    alert_rule_test:
      # Still inside `for: 2h` -- a transient re-key wave must not page.
      - eval_time: 1h
        alertname: ReadModelFilmsInvisibleWithScreenings
        exp_alerts: []
      - eval_time: 3h
        alertname: ReadModelFilmsInvisibleWithScreenings
        exp_alerts:
          - exp_labels:
              severity: warning
              country: es
            exp_annotations:
              summary: "es has 1 film(s) screening but invisible on the site"
              description: "`kinowo_worker_corpus_movies{subset=\"unresolved_with_showtimes\"}` counts rows that fail `readyToProject` while their cinemas still list an UPCOMING showtime, so the read model prunes their cards and the films 404 while tickets are on sale. Read the worker\'s `kinowo.removal-audit` log to name them (`reason=reconcile-prune`), then for each row compare the CINEMA slots\' director and runtime against the film it resolved to and search TMDB for the title the venues actually publish. Write the correct `tmdbId` and TMDB slot directly -- do NOT clear `tmdbId` to force a re-resolve, because that prunes the card within minutes and `UnresolvedTmdbReaper` will not revisit the key for up to 24h. Its sibling `subset=\"misresolved\"` counts the sweep\'s INPUT: that falling while this rises is the sweep trading wrong films for invisible ones. Full method in `docs/misresolution-sweep.md`."

  # THE SAME ONE ROW, WHILE TWO TARGETS ARE ANSWERING FOR THE SAME WORKER — one worker scraped
  # under an old and a new `instance` name, which is what Prometheus's 5m lookback did to all five
  # countries across the 2026-09-06 relabel. (Not a rollout: `replicas: 1` + `Recreate`.) It is ONE
  # census published twice, so the count the operator is sent to look for must still be 1. Under
  # `sum by (country)` this said "es has 2 film(s) screening but invisible" and sent them hunting
  # for a row that does not exist. Held for the whole window here deliberately: the real duplicate
  # lasted four minutes, far inside `for: 2h`, so it could bend the reported NUMBER but never the
  # alert's state. This case pins the arithmetic, which is what a longer duplicate would ride on.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_corpus_movies{country="es",job="kinowo-worker",instance="10.20.0.12:30904",subset="unresolved_with_showtimes"}'
        values: '1x240'
      - series: 'kinowo_worker_corpus_movies{country="es",job="kinowo-worker",instance="kinowo-worker-es",subset="unresolved_with_showtimes"}'
        values: '1x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: ReadModelFilmsInvisibleWithScreenings
        exp_alerts:
          - exp_labels:
              severity: warning
              country: es
            exp_annotations:
              summary: "es has 1 film(s) screening but invisible on the site"
              description: "`kinowo_worker_corpus_movies{subset=\"unresolved_with_showtimes\"}` counts rows that fail `readyToProject` while their cinemas still list an UPCOMING showtime, so the read model prunes their cards and the films 404 while tickets are on sale. Read the worker\'s `kinowo.removal-audit` log to name them (`reason=reconcile-prune`), then for each row compare the CINEMA slots\' director and runtime against the film it resolved to and search TMDB for the title the venues actually publish. Write the correct `tmdbId` and TMDB slot directly -- do NOT clear `tmdbId` to force a re-resolve, because that prunes the card within minutes and `UnresolvedTmdbReaper` will not revisit the key for up to 24h. Its sibling `subset=\"misresolved\"` counts the sweep\'s INPUT: that falling while this rises is the sweep trading wrong films for invisible ones. Full method in `docs/misresolution-sweep.md`."

  # A row that goes invisible and is repaired 30 minutes later: never reaches `for: 2h`.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_corpus_movies{country="uk",job="kinowo-worker",subset="unresolved_with_showtimes"}'
        values: '1x30 0x210'
    alert_rule_test:
      - eval_time: 3h
        alertname: ReadModelFilmsInvisibleWithScreenings
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # THE HOLE THE BURST LEAVES BEHIND -- 2026-09-07 replayed at PL's real numbers. The corpus says
  # 435 films for warszawa and the web serves 435, until 04:06Z takes it to 322 (26% short). The
  # prune stops immediately; the SHORTFALL does not. This is the case ReadModelFilmPruneBurst
  # cannot cover: it cleared 25 minutes in, with 84 cards still missing.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '435x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl",job="kinowo-web",scope="all"}'
        values: '435x60 322x240'
    alert_rule_test:
      # Nothing before the loss, and nothing yet 30 minutes into it -- `for: 45m` is deliberately
      # longer than the one prune tick the projection path calls a legitimate disagreement.
      - eval_time: 50m
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []
      - eval_time: 85m
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []
      # And still lit hours later, which is the whole point: the prune ended at minute 60.
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl is serving 25.98% fewer films than its corpus holds"
              description: "`kinowo_worker_movies_served{scope=\"all\"}` is the films this country\'s corpus WOULD serve and `kinowo_web_movies_served{scope=\"all\"}` is what the site IS serving; they have disagreed by more than 3% for 45 minutes, so cards that should be on the site are missing and their schedules with them. Unlike ReadModelFilmPruneBurst this watches the HOLE rather than the event that made it, so it stays lit until the read model is whole again -- on 2026-09-07 the burst alert cleared with 84 cards still gone. Find WHICH cards per city with `max by (city) (kinowo_worker_movies_served{country=\"pl\",scope=\"all\"}) - max by (city) (kinowo_web_movies_served{country=\"pl\",scope=\"all\"})`, then read the worker\'s `kinowo.removal-audit` log for what removed them. The known shape is a reconcile prune whose cards the boot heal then declines to re-project: the 2026-09-07 one deleted VARIANT cards (`<filmId>~<variant>`, the decorated listings like \"Poranek dla dzieci: Pucio\") while each film\'s plain card survived, and a heal that only projected rows with NO card skipped every one of them. If this is firing during a deliberate projection change, it is telling you the change has not finished landing."

  # THE POST-FIX FLOOR, WHICH MUST STAY SILENT. Every country sat between 0.00% and 0.22% once the
  # stable-film-id re-key landed on 2026-09-07T00:00Z. US at its measured floor: 30,945 corpus
  # against 30,829 served, a gap of 116. That is 0.37% -- lag, not a hole -- and the threshold has
  # to have room above it. (Calibrating instead on the WEEK BEFORE, when this ratio ran to a US
  # p99 of 16%, would have sized the rule around a defect that has since been fixed.)
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="us",city="new-york",instance="kinowo-worker-us",job="kinowo-worker",scope="all"}'
        values: '30945x300'
      - series: 'kinowo_web_movies_served{country="us",city="new-york",instance="kinowo-web-us",job="kinowo-web",scope="all"}'
        values: '30829x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []

  # A CENSUS THAT READS ZERO MUST NOT PAGE. `WorkerCorpusMetrics` seeds every gauge at 0 on boot
  # and publishes nothing on a scan that could not read the whole corpus, so a restart into a
  # failing read leaves the worker side at a genuine 0 while the web serves a full city. What
  # makes that safe is the DIRECTION of the subtraction, not the guard: corpus minus served is
  # -435 here, and no negative clears the threshold. Pinned because it is the case an author
  # reaching for `clamp_min` would assume needs protecting, and it does not -- see the rule's own
  # comment. `kinowo-corpus-census-stuck` owns the census outage itself.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '0x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl",job="kinowo-web",scope="all"}'
        values: '435x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []

  # THE OTHER DIRECTION, WHICH MUST PAGE AND LOUDLY: the corpus is intact and the web is serving
  # NOTHING. The ratio is a clean 1.0 and this rule says so. TargetDown is the better alert when
  # the tier is actually down, but the tier can serve /metrics and an empty corpus perfectly well
  # -- a malformed read-model row emptying `web_movies` is a shape this repo has hit twice -- and
  # then nothing else here notices. This is the case that makes it `critical`.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '435x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl",job="kinowo-web",scope="all"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl is serving 100% fewer films than its corpus holds"
              description: "`kinowo_worker_movies_served{scope=\"all\"}` is the films this country\'s corpus WOULD serve and `kinowo_web_movies_served{scope=\"all\"}` is what the site IS serving; they have disagreed by more than 3% for 45 minutes, so cards that should be on the site are missing and their schedules with them. Unlike ReadModelFilmPruneBurst this watches the HOLE rather than the event that made it, so it stays lit until the read model is whole again -- on 2026-09-07 the burst alert cleared with 84 cards still gone. Find WHICH cards per city with `max by (city) (kinowo_worker_movies_served{country=\"pl\",scope=\"all\"}) - max by (city) (kinowo_web_movies_served{country=\"pl\",scope=\"all\"})`, then read the worker\'s `kinowo.removal-audit` log for what removed them. The known shape is a reconcile prune whose cards the boot heal then declines to re-project: the 2026-09-07 one deleted VARIANT cards (`<filmId>~<variant>`, the decorated listings like \"Poranek dla dzieci: Pucio\") while each film\'s plain card survived, and a heal that only projected rows with NO card skipped every one of them. If this is firing during a deliberate projection change, it is telling you the change has not finished landing."

  # A REAL SHORTFALL DURING A WEB ROLLING DEPLOY, which is the case that makes `max by` matter
  # MORE on the web side than on the worker side. The worker Deployment is `replicas: 1` /
  # `Recreate` and never overlaps, but the WEB Deployment is `RollingUpdate` with `maxSurge: 1`,
  # so two web pods really do publish this gauge at once, every deploy. Summed, the 322 the site
  # is actually serving reads as 644 against a corpus of 435 -- a NEGATIVE shortfall, silently
  # under threshold. So the un-de-duplicated form does not merely mis-report here, it MISSES a
  # 26% hole for as long as the deploy takes, and a deploy is exactly when one is most likely.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '435x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl-old",job="kinowo-web",scope="all"}'
        values: '322x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl-new",job="kinowo-web",scope="all"}'
        values: '322x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl is serving 25.98% fewer films than its corpus holds"
              description: "`kinowo_worker_movies_served{scope=\"all\"}` is the films this country\'s corpus WOULD serve and `kinowo_web_movies_served{scope=\"all\"}` is what the site IS serving; they have disagreed by more than 3% for 45 minutes, so cards that should be on the site are missing and their schedules with them. Unlike ReadModelFilmPruneBurst this watches the HOLE rather than the event that made it, so it stays lit until the read model is whole again -- on 2026-09-07 the burst alert cleared with 84 cards still gone. Find WHICH cards per city with `max by (city) (kinowo_worker_movies_served{country=\"pl\",scope=\"all\"}) - max by (city) (kinowo_web_movies_served{country=\"pl\",scope=\"all\"})`, then read the worker\'s `kinowo.removal-audit` log for what removed them. The known shape is a reconcile prune whose cards the boot heal then declines to re-project: the 2026-09-07 one deleted VARIANT cards (`<filmId>~<variant>`, the decorated listings like \"Poranek dla dzieci: Pucio\") while each film\'s plain card survived, and a heal that only projected rows with NO card skipped every one of them. If this is firing during a deliberate projection change, it is telling you the change has not finished landing."

  # ONE WORKER SCRAPED TWICE must not read as the corpus doubling and the web being half short.
  # Same relabel shape as the cases above; `max by (country, city)` on BOTH sides is what holds.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="10.20.0.12:30900",job="kinowo-worker",scope="all"}'
        values: '435x300'
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '435x300'
      - series: 'kinowo_web_movies_served{country="pl",city="warszawa",instance="kinowo-web-pl",job="kinowo-web",scope="all"}'
        values: '435x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []

  # AND THE COMPANION: lose the WEB side and the subtraction goes silent, which is the dangerous
  # direction -- a site serving nothing looks exactly like a site serving everything.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_movies_served{country="pl",city="warszawa",instance="kinowo-worker-pl",job="kinowo-worker",scope="all"}'
        values: '435x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: ReadModelServingShortOfCorpus
        exp_alerts: []
      - eval_time: 30m
        alertname: ReadModelServedGaugesAbsent
        exp_alerts: []
      - eval_time: 2h
        alertname: ReadModelServedGaugesAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "One side of the read-model drift comparison has stopped publishing"
              description: "Either `kinowo_worker_movies_served` or `kinowo_web_movies_served` has no series from any country, so ReadModelServingShortOfCorpus cannot fire -- its subtraction drops unmatched pairs and goes SILENT rather than loud. Whichever side is missing, the site is unwatched for cards that should be there and are not. If the WEB gauge is the one gone, check TargetDown in monitoring-self.rules first: a web tier that is down is the better alert to read. If the gauge is missing while the pod serves /metrics happily, the collector has been unwired from the tier\'s metrics registry, which TargetDown cannot see."

  # ---------------------------------------------------------------------------------------------
  # THE PRUNE BURST. A 1,000-film corpus losing 8 films a minute is 480 in the increase window --
  # 48%, well past the threshold, and the shape of a backfill eating a country's read model.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_films_pruned_total{country="pl",job="kinowo-worker"}'
        values: '0+8x180'
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",subset="total"}'
        values: '1000x180'
    alert_rule_test:
      # Nothing yet at 20m: only ~160 films have gone, 16% of the corpus, which is inside the
      # healthy band PL itself reached in the week this was measured.
      - eval_time: 20m
        alertname: ReadModelFilmPruneBurst
        exp_alerts: []
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl dropped 48% of its films from the read model in an hour"
              description: "`kinowo_worker_readmodel_films_pruned_total` has removed more than 30% of `corpus_movies{subset=\"total\"}` for this country within an hour, so schedules are disappearing from the site with the films that carried them. The worst healthy hour measured over the week to 2026-09-05 was 16.9%. Read the worker's `kinowo.removal-audit` log first -- it names every card removed with its screening count and a reason (reconcile-prune / scrape-prune) -- then check whether a backfill or reprojection script is running against this country, whether a city slug was renamed (which re-keys every CityScreening and orphans the old ones), and whether the source `movies` rows still exist: a prune whose rows are intact is a projection fault, and a prune that follows rows actually vanishing is a scrape or cleanup fault."

  # THE SAME BURST, WHILE ONE WORKER IS BEING SCRAPED TWICE. Identical prunes and an identical
  # 1,000-film corpus, but two targets are publishing that corpus -- the 2026-09-06 relabel shape,
  # where Prometheus answered under both the old and the new `instance` name until the old one fell
  # out of lookback. Under `sum by (country)` the denominator reads 2,000, the ratio halves to 24%,
  # and the rule is silent through a 48% prune.
  #
  # THE DUPLICATE IS HELD FOR THE WHOLE WINDOW HERE ON PURPOSE, and that is NOT what prod did: the
  # real one lasted four minutes, inside `for: 15m`, so it could delay this rule but not silence
  # it, and it did neither -- the only rule that actually paged off the doubling was
  # kinowo-showtime-volume-collapsed, whose `max_over_time` baseline latched it for six hours. What
  # this case pins is the arithmetic a longer-lived duplicate would ride on: a scrape config
  # listing one worker twice never falls out of lookback at all.
  #
  # The prune counter is deliberately still summed: two live processes each count their own
  # removals, and those genuinely add.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_films_pruned_total{country="pl",job="kinowo-worker",instance="kinowo-worker-pl"}'
        values: '0+8x180'
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",instance="10.20.0.12:30900",subset="total"}'
        values: '1000x180'
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",instance="kinowo-worker-pl",subset="total"}'
        values: '1000x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl dropped 48% of its films from the read model in an hour"
              description: "`kinowo_worker_readmodel_films_pruned_total` has removed more than 30% of `corpus_movies{subset=\"total\"}` for this country within an hour, so schedules are disappearing from the site with the films that carried them. The worst healthy hour measured over the week to 2026-09-05 was 16.9%. Read the worker's `kinowo.removal-audit` log first -- it names every card removed with its screening count and a reason (reconcile-prune / scrape-prune) -- then check whether a backfill or reprojection script is running against this country, whether a city slug was renamed (which re-keys every CityScreening and orphans the old ones), and whether the source `movies` rows still exist: a prune whose rows are intact is a projection fault, and a prune that follows rows actually vanishing is a scrape or cleanup fault."

  # THE HEALTHY WEEK, replayed: PL's worst real hour over the 7 days to 2026-09-05 was 16.9% of
  # its corpus, which is routine re-keying and must stay silent. 2.8 films/min against 1,000 is
  # 168/h -- that exact shape.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_films_pruned_total{country="pl",job="kinowo-worker"}'
        values: '0+2.8x180'
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",subset="total"}'
        values: '1000x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts: []

  # A SMALL COUNTRY loses the same NUMBER of films and must page where the big one did not: ES
  # carries 192 films, so 100 gone in an hour is over half its catalogue. This is why the rule
  # divides by the corpus instead of thresholding a rate.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_films_pruned_total{country="es",job="kinowo-worker"}'
        values: '0+1.7x180'
      - series: 'kinowo_worker_corpus_movies{country="es",job="kinowo-worker",subset="total"}'
        values: '192x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts:
          - exp_labels:
              severity: critical
              country: es
            exp_annotations:
              summary: "es dropped 53.12% of its films from the read model in an hour"
              description: "`kinowo_worker_readmodel_films_pruned_total` has removed more than 30% of `corpus_movies{subset=\"total\"}` for this country within an hour, so schedules are disappearing from the site with the films that carried them. The worst healthy hour measured over the week to 2026-09-05 was 16.9%. Read the worker's `kinowo.removal-audit` log first -- it names every card removed with its screening count and a reason (reconcile-prune / scrape-prune) -- then check whether a backfill or reprojection script is running against this country, whether a city slug was renamed (which re-keys every CityScreening and orphans the old ones), and whether the source `movies` rows still exist: a prune whose rows are intact is a projection fault, and a prune that follows rows actually vanishing is a scrape or cleanup fault."

  # A CENSUS OUTAGE MUST NOT PAGE AS A PRUNE. `WorkerCorpusMetrics` seeds every subset
  # at 0 on boot and publishes NOTHING on a scan that could not read the whole corpus,
  # so after a restart with a failing read the denominator sits at a real 0 while the
  # numerator still carries the last hour's routine re-keys. Dividing by a clamped 1
  # turned that into "pl dropped 4000% of its films" — the exact shape this rule's own
  # comment rejects the showtime-volume rules for.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_readmodel_films_pruned_total{country="pl",job="kinowo-worker"}'
        values: '0+0.7x180'
      - series: 'kinowo_worker_corpus_movies{country="pl",job="kinowo-worker",subset="total"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts: []

  # A COUNTRY THAT HAS PRUNED NOTHING has no counter series at all -- a labelled counter only
  # appears on its first observation. The rule must be silent, not absent-firing, which is why it
  # has no absent() companion.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_corpus_movies{country="uk",job="kinowo-worker",subset="total"}'
        values: '1600x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReadModelFilmPruneBurst
        exp_alerts: []

  # ---------------------------------------------------------------------------------------------
  # TTL-INDEX RECONCILIATION. The gauge is always present and 0 when healthy, so the interesting
  # assertion is that a healthy fleet is SILENT from both rules — the `absent()` companion must not
  # fire merely because the value is zero.
  # ---------------------------------------------------------------------------------------------
  - interval: 1m
    name: every TTL index matching the code is silent
    input_series:
      - series: 'kinowo_worker_ttl_index_mismatches{country="pl",instance="10.20.0.12:9091",job="kinowo-worker"}'
        values: "0x70"
      - series: 'kinowo_worker_ttl_index_mismatches{country="de",instance="10.20.0.12:9092",job="kinowo-worker"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: TtlIndexUnreconciled
        exp_alerts: []
      # A ZERO IS A SAMPLE. If this fired, the rule would be testing presence rather than truth.
      - eval_time: 65m
        alertname: TtlIndexMetricAbsent
        exp_alerts: []

  - interval: 1m
    name: an index the app could not reconcile fires
    input_series:
      - series: 'kinowo_worker_ttl_index_mismatches{country="pl",instance="10.20.0.12:9091",job="kinowo-worker"}'
        values: "1x30"
      - series: 'kinowo_worker_ttl_index_mismatches{country="de",instance="10.20.0.12:9092",job="kinowo-worker"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TtlIndexUnreconciled
        exp_alerts:
          - exp_labels:
              country: pl
              severity: warning
            exp_annotations:
              summary: "pl: 1 TTL index(es) do not match what the code asks for"
              description: "A TTL index's `expireAfterSeconds` disagrees with the constant in the code AND the app could not rebuild it. THE COSTLY CASE IS AN INDEX THAT IS NOW ABSENT: the reconciler drops and recreates (`collMod` is not in `readWrite`), so a drop that succeeded and a create that failed leaves the collection reaping NOTHING and growing without bound -- check `detailCache-*` and `uptimeBuckets` sizes first. WHICH collection is in the worker log, not in this metric: `kubectl -n kinowo logs deploy/worker-pl | grep -i \"TTL index\"` names it, with both expiries and the database it is in. This class of drift was invisible until 2026-09-06, when `detailCache-cinema-city` was found still reaping at 6h a day after the code moved it to 2h, so treat a sustained reading here as real."
      - eval_time: 25m
        alertname: TtlIndexMetricAbsent
        exp_alerts: []

  - interval: 1m
    name: the gauge going away fires the companion, not the comparison
    input_series:
      - series: 'up{job="kinowo-worker",instance="10.20.0.12:9091"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: TtlIndexUnreconciled
        exp_alerts: []
      - eval_time: 65m
        alertname: TtlIndexMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No worker is publishing the TTL-index reconciliation gauge"
              description: "`kinowo_worker_ttl_index_mismatches` has no series, so `TtlIndexUnreconciled` cannot fire and nothing is watching whether the TTL constants in the code are the ones Mongo is enforcing. Either every worker is down -- TargetDown in monitoring-self.rules is the better alert then -- or `TtlIndexMetrics.register` has been dropped from `WorkerMetrics`, which TargetDown would NOT catch because the pod serves /metrics perfectly well without this family in it."
