# UNIT TESTS FOR THE SHARE-CARD ALERTS.
#
# Each alert fires for a real shape, stays quiet for a healthy one, and holds its `for:` across a
# worker restart (a `stale` gap in the gauges). The two replicas of `pl` publish the same directory
# figures: the budget ratio must count them once (`max`), not twice.
rule_files:
  - ../../nix/files/monitoring/rules/share-cards.rules

evaluation_interval: 1m

tests:
  # NEAR BUDGET: 900 MiB of a 1 GiB budget (≈88%), mostly posters, published by two replicas and
  # through a restart gap. Fires after 30m, names posters.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_bytes{country="pl",kind="card",instance="w1",job="kinowo-worker"}'
        values: '314572800x20 stale _x2 314572800x40'
      - series: 'kinowo_worker_share_cards_bytes{country="pl",kind="poster",instance="w1",job="kinowo-worker"}'
        values: '629145600x20 stale _x2 629145600x40'
      - series: 'kinowo_worker_share_cards_bytes{country="pl",kind="card",instance="w2",job="kinowo-worker"}'
        values: '314572800x62'
      - series: 'kinowo_worker_share_cards_bytes{country="pl",kind="poster",instance="w2",job="kinowo-worker"}'
        values: '629145600x62'
      - series: 'kinowo_worker_share_cards_budget_bytes{country="pl",instance="w1",job="kinowo-worker"}'
        values: '1073741824x20 stale _x2 1073741824x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ShareCardsNearBudget
        exp_alerts: []
      - eval_time: 45m
        alertname: ShareCardsNearBudget
        exp_alerts:
          - exp_labels:
              severity: warning
              country: pl
              kind: poster
            exp_annotations:
              summary: "pl's share cards and posters use 87.89% of their disk budget"
              description: "`kinowo_worker_share_cards_bytes` summed over cards, cached posters and card bases is above 85% of `kinowo_worker_share_cards_budget_bytes` for this country; most of it is posters. The janitor evicts unreferenced files oldest-first every ten minutes, so this staying high means most of the directory is CURRENT (the card, base and poster of every film web_movies points a card at) -- compare `kinowo_worker_share_cards_current_bytes`. Raise KINOWO_SHARE_CARD_BUDGET_MB if the corpus grew; if current bytes did not grow, look for a flood of re-renders in `kinowo_worker_share_cards_render_total` by reason."
      - eval_time: 45m
        alertname: ShareCardsOverBudget
        exp_alerts: []

  # HEALTHY: half the budget stays quiet.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_bytes{country="uk",kind="card",instance="w1",job="kinowo-worker"}'
        values: '268435456x60'
      - series: 'kinowo_worker_share_cards_bytes{country="uk",kind="poster",instance="w1",job="kinowo-worker"}'
        values: '268435456x60'
      - series: 'kinowo_worker_share_cards_budget_bytes{country="uk",instance="w1",job="kinowo-worker"}'
        values: '1073741824x60'
      - series: 'kinowo_worker_share_cards_current_bytes{country="uk",kind="card",instance="w1",job="kinowo-worker"}'
        values: '200000000x60'
      - series: 'kinowo_worker_share_cards_current_bytes{country="uk",kind="poster",instance="w1",job="kinowo-worker"}'
        values: '200000000x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: ShareCardsNearBudget
        exp_alerts: []
      - eval_time: 50m
        alertname: ShareCardsOverBudget
        exp_alerts: []

  # OVER BUDGET: current cards + posters (700 + 500 MiB) above 1 GiB, through a restart gap. Critical,
  # names cards (the larger), after 15m.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_current_bytes{country="de",kind="card",instance="w1",job="kinowo-worker"}'
        values: '734003200x10 stale _x2 734003200x20'
      - series: 'kinowo_worker_share_cards_current_bytes{country="de",kind="poster",instance="w1",job="kinowo-worker"}'
        values: '524288000x10 stale _x2 524288000x20'
      - series: 'kinowo_worker_share_cards_budget_bytes{country="de",instance="w1",job="kinowo-worker"}'
        values: '1073741824x10 stale _x2 1073741824x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ShareCardsOverBudget
        exp_alerts: []
      - eval_time: 25m
        alertname: ShareCardsOverBudget
        exp_alerts:
          - exp_labels:
              severity: critical
              country: de
              kind: card
            exp_annotations:
              summary: "de's current share cards and posters alone exceed their disk budget"
              description: "`kinowo_worker_share_cards_current_bytes` -- the card, base and poster of every film web_movies points a card at, mostly cards -- is 1.172GiB, over the country's budget. The janitor never deletes current files, so nothing will bring this down on its own: raise KINOWO_SHARE_CARD_BUDGET_MB (and check the node's disk, FilesystemSpaceLow on k3s-worker-1), or find why the corpus holds more films on screen than before."

  # POSTERS FAILING: 2 of 3 films end with no poster per minute (60 films per 30m), through a restart gap.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="es",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0+2x20 stale _x2 42+2x60'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="es",result="ok",instance="w1",job="kinowo-worker"}'
        values: '0+1x20 stale _x2 21+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ShareCardPosterFetchFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: ShareCardPosterFetchFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              country: es
            exp_annotations:
              summary: "es's share-card posters are failing for 66.67% of films"
              description: "For more than half of the films whose poster was first fetched over the last half hour, not one poster URL worked -- every candidate (all its renditions, e.g. TMDB w780 then the original) unreachable, over the 50 MB download cap, or undecodable. Those films get a card WITHOUT a poster meanwhile, re-tried daily and at each worker boot. `kinowo_worker_share_cards_poster_fetch_total` counts the URLs, with a `reason` label saying why (http_4xx, http_5xx, timeout, too_large, decode_error, vips_cap, progressive_estimate, ...), and the worker logs `share card: poster for <film> from <host> failed: <reason>` -- check whether one host or one reason dominates; `kinowo_worker_http_total` does not see these fetches."

  # QUIET: a failing PRIMARY whose fallback works is no failed film. Two of every three poster URLs
  # fail (a Multikino origin 403ing the datacentre, say) while every film still gets its poster.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_poster_fetch_total{country="uk",result="failed",reason="http_4xx",instance="w1",job="kinowo-worker"}'
        values: '0+2x90'
      - series: 'kinowo_worker_share_cards_poster_fetch_total{country="uk",result="ok",reason="none",instance="w1",job="kinowo-worker"}'
        values: '0+1x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="uk",result="ok",instance="w1",job="kinowo-worker"}'
        values: '0+1x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="uk",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ShareCardPosterFetchFailing
        exp_alerts: []

  # QUIET: mostly successful films, and a failing trickle under ten films, both stay silent.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="us",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0+1x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="us",result="ok",instance="w1",job="kinowo-worker"}'
        values: '0+4x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="pl",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0+0.1x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="pl",result="ok",instance="w1",job="kinowo-worker"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ShareCardPosterFetchFailing
        exp_alerts: []

  # QUIET: a boot's re-try of the cards drawn without a poster fails again, 40 films at once, every
  # 25 minutes through a day of deploys -- beside a trickle of first loads that mostly work.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="retry",country="pl",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0x10 40x25 80x25 120x25 160x5'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="pl",result="ok",instance="w1",job="kinowo-worker"}'
        values: '0+0.2x90'
      - series: 'kinowo_worker_share_cards_poster_load_total{attempt="first",country="pl",result="failed",instance="w1",job="kinowo-worker"}'
        values: '0+0.03x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ShareCardPosterFetchFailing
        exp_alerts: []

  # COVERAGE STALLED: pl sits at 60% for seven hours, through a restart gap. Quiet for the first six
  # hours of the hold, then fires.
  - interval: 5m
    input_series:
      - series: 'kinowo_worker_share_cards_coverage_ratio{country="pl",instance="kinowo-worker-pl",job="kinowo-worker"}'
        values: '0.6x40 stale 0.6x44'
    alert_rule_test:
      - eval_time: 5h
        alertname: ShareCardCoverageLow
        exp_alerts: []
      - eval_time: 7h
        alertname: ShareCardCoverageLow
        exp_alerts:
          - exp_labels:
              severity: warning
              country: pl
            exp_annotations:
              summary: "pl has share cards for only 60% of its films on screen"
              description: "`kinowo_worker_share_cards_coverage_ratio` -- the share of films with screenings whose card for their CURRENT inputs exists on disk -- has been under 95% for six hours. A fresh backfill (a new template, a first deploy) refills from zero in under three hours (2026-09-24: pl, the slowest, in 2h20m), so the backfill is not keeping up or not running. Read `kinowo_worker_share_cards_render_total` by outcome: quiet means no renders are being queued (is the ShareCardBackfill task running?); busy with `failed` means ShareCardRendersFailing is the alert to read. Every uncovered film keeps the city fallback card, and the web switches og:image to film cards only while every country is at 99% or more."

  # QUIET: a fresh backfill, replayed from pl's on 2026-09-24 -- 0 to 100% over 2h20m, with a restart
  # halfway -- then healthy. Never fires.
  - interval: 5m
    input_series:
      - series: 'kinowo_worker_share_cards_coverage_ratio{country="pl",instance="kinowo-worker-pl",job="kinowo-worker"}'
        values: '0+0.006x10 0.06+0.035x10 stale 0.45+0.05x11 0.998x60'
      - series: 'up{country="pl",instance="kinowo-worker-pl",job="kinowo-worker"}'
        values: '1x93'
    alert_rule_test:
      - eval_time: 6h
        alertname: ShareCardCoverageLow
        exp_alerts: []
      - eval_time: 7h
        alertname: ShareCardCoverageLow
        exp_alerts: []
      - eval_time: 7h
        alertname: ShareCardCoverageAbsent
        exp_alerts: []

  # COVERAGE ABSENT: uk's worker publishes its coverage gauge for ten minutes, then -- through a
  # restart, and still up and scraped after it -- never again; de publishes one and stays quiet.
  # Fires for uk an hour after the gauge's last sample ages out of the 10m window.
  - interval: 1m
    input_series:
      - series: 'up{country="uk",instance="kinowo-worker-uk",job="kinowo-worker"}'
        values: '1x30 stale _x3 1x60'
      - series: 'kinowo_worker_share_cards_coverage_ratio{country="uk",instance="kinowo-worker-uk",job="kinowo-worker"}'
        values: '1x10 stale'
      - series: 'up{country="de",instance="kinowo-worker-de",job="kinowo-worker"}'
        values: '1x93'
      - series: 'kinowo_worker_share_cards_coverage_ratio{country="de",instance="kinowo-worker-de",job="kinowo-worker"}'
        values: '1x93'
    alert_rule_test:
      - eval_time: 50m
        alertname: ShareCardCoverageAbsent
        exp_alerts: []
      - eval_time: 90m
        alertname: ShareCardCoverageAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              country: uk
            exp_annotations:
              summary: "uk's worker is up but publishes no share-card coverage"
              description: "The worker answers its scrape (`up`) but has published no `kinowo_worker_share_cards_coverage_ratio` for this country for an hour, so ShareCardCoverageLow cannot fire and a stalled card pipeline goes unseen. The ShareCardBackfill tick publishes it every minute while the country has films on screen; its absence means the tick is not running, or the gauge was unwired from the worker's metrics. A worker that is DOWN is WorkerDown's to report, not this one's."

  # QUIET: a worker restart leaves both `up` and the gauge absent for a few minutes; nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{country="es",instance="kinowo-worker-es",job="kinowo-worker"}'
        values: '1x30 stale _x5 1x60'
      - series: 'kinowo_worker_share_cards_coverage_ratio{country="es",instance="kinowo-worker-es",job="kinowo-worker"}'
        values: '1x30 stale _x6 1x60'
    alert_rule_test:
      - eval_time: 95m
        alertname: ShareCardCoverageAbsent
        exp_alerts: []

  # RENDERS FAILING: of 3 renders a minute in us, 2 fail, through a restart gap. Fires after 30m.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_render_total{country="us",outcome="failed",reason="backfill",instance="w1",job="kinowo-worker"}'
        values: '0+2x20 stale _x2 42+2x60'
      - series: 'kinowo_worker_share_cards_render_total{country="us",outcome="rendered",reason="backfill",instance="w1",job="kinowo-worker"}'
        values: '0+1x20 stale _x2 21+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ShareCardRendersFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: ShareCardRendersFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              country: us
            exp_annotations:
              summary: "us's share-card renders are failing: 66.67% of the last half hour's"
              description: "More than a quarter of the last half hour's `kinowo_worker_share_cards_render_total` ended `failed`: the card could not be drawn at all, not even without its poster (a poster-less card is `rendered_no_poster`, which ShareCardPosterFetchFailing watches). Each failed task is retried up to three times and then given up, so those films keep the city fallback card and coverage falls. The `reason` label names the input change that queued the failing renders, and the worker logs `share card: <film> could not be drawn: <exception>`. After a deploy, suspect the template, the fonts or libvips."

  # QUIET: an occasional failure among a busy backfill, and a few failures among fewer than ten renders.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_share_cards_render_total{country="de",outcome="failed",reason="ratings",instance="w1",job="kinowo-worker"}'
        values: '0+0.1x90'
      - series: 'kinowo_worker_share_cards_render_total{country="de",outcome="rendered",reason="backfill",instance="w1",job="kinowo-worker"}'
        values: '0+5x90'
      - series: 'kinowo_worker_share_cards_render_total{country="es",outcome="failed",reason="new_film",instance="w1",job="kinowo-worker"}'
        values: '0+0.1x90'
      - series: 'kinowo_worker_share_cards_render_total{country="es",outcome="rendered",reason="new_film",instance="w1",job="kinowo-worker"}'
        values: '0+0.1x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: ShareCardRendersFailing
        exp_alerts: []
