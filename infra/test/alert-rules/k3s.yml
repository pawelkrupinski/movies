# UNIT TESTS FOR THE K3S RULES, first written for the container image collector's alerts.
#
# These two rules exist because `FilesystemWillFillWithin7Days` fired on k3s-worker-1 on
# 2026-09-05 with 73G of the root disk held by 209 containerd images, nine of which were in use.
# The collection that prevents a repeat is modules/fleet/container-image-gc.nix; these rules are
# what notice it stopping, and a rule that notices nothing is exactly as silent as no rule at all.
#
# ⚠️ THE LOAD-BEARING TEST IS THE THIRD ONE, and it is about the JOIN rather than the threshold.
#    `NixGarbageCollectionMetricAbsent` next door asks "scraped, but never collected" of the whole
#    fleet via `machine == 1`, which is right for a Nix store because every host has one. Copying
#    that shape here would fire for ever about mongo-1, which has no container runtime and no
#    collector by design -- an alert nobody can act on, which is how a group of alerts stops being
#    read. Joining on the k3s unit instead makes the rule cover exactly the hosts that have an
#    image store, and this file is where that claim is checked rather than merely asserted in a
#    comment.
#
# The staleness rule's threshold is a `time()` comparison, so every test below pins its readings
# to absolute values and evaluates at an absolute `eval_time`; a series that merely "looks old"
# relative to nothing would pass whatever the threshold said.
rule_files:
  - ../../nix/files/monitoring/rules/k3s.rules

evaluation_interval: 1m

tests:
  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A NODE COLLECTING NORMALLY. The timer ran ten minutes ago and holds nine images -- the steady
  # state of this cluster, where the number of images tracks the number of running pods rather
  # than the number of merges. Neither rule may fire.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",host="k3s-worker-1"}'
        values: '1+0x300'
      - series: 'fleet_container_image_gc_last_success_timestamp_seconds{host="k3s-worker-1"}'
        values: '3000+0x300'
      - series: 'fleet_container_image_gc_images{host="k3s-worker-1"}'
        values: '9+0x300'
    alert_rule_test:
      - eval_time: 1h
        alertname: ContainerImageGarbageCollectionStale
        exp_alerts: []
      - eval_time: 1h
        alertname: ContainerImageGarbageCollectionMetricAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE COLLECTOR STOPPED, WHICH IS THE WHOLE POINT. The textfile is still there and node_exporter
  # still reports it -- a textfile is not a heartbeat, it is served as current for ever -- so the
  # only thing that says anything is wrong is the timestamp inside it going old. Frozen at epoch 0
  # and read four days later: past the three-day threshold, silent before it.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",host="k3s-worker-1"}'
        values: '1+0x8000'
      - series: 'fleet_container_image_gc_last_success_timestamp_seconds{host="k3s-worker-1"}'
        values: '0+0x8000'
    alert_rule_test:
      # Two days in, one missed run: deliberately still quiet.
      - eval_time: 2d
        alertname: ContainerImageGarbageCollectionStale
        exp_alerts: []
      - eval_time: 4d
        alertname: ContainerImageGarbageCollectionStale
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
            exp_annotations:
              summary: "k3s-worker-1 has not collected its container images for over 3 days"
              description: >-
                Left alone this ends as a full root filesystem: the images are one per merge and
                nothing else deletes them, which is what put k3s-worker-1 at 84G of 150G with 200
                unused images on 2026-09-05. `systemctl status fleet-container-image-gc` and its
                timer. `fleet_container_image_gc_images` says how many images are currently held --
                compare it against the number of distinct images actually running (`k3s crictl
                ps`), which on this cluster is single digits. THE REPAIR IS `k3s crictl rmi
                --prune`, which is what the timer runs.
      # The comparison cannot fire without the series, so the companion must stay quiet here: this
      # host IS publishing, it is publishing something old.
      - eval_time: 4d
        alertname: ContainerImageGarbageCollectionMetricAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # ⚠️ THE JOIN. Two hosts, neither publishing a collection timestamp, and only ONE of them is
  # wrong: k3s-worker-1 runs k3s and has an image store nobody is collecting; mongo-1 runs no
  # container runtime at all and correctly has no collector. A `machine == 1` join -- the shape
  # the Nix collector's companion uses, and the obvious thing to copy -- would report both.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",host="k3s-worker-1"}'
        values: '1+0x5000'
      - series: 'machine{host="k3s-worker-1",role="k3s-worker",env="prod"}'
        values: '1+0x5000'
      - series: 'machine{host="mongo-1",role="mongodb",env="prod"}'
        values: '1+0x5000'
    alert_rule_test:
      - eval_time: 1d
        alertname: ContainerImageGarbageCollectionMetricAbsent
        exp_alerts: []
      - eval_time: 3d
        alertname: ContainerImageGarbageCollectionMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              name: k3s.service
              state: active
            exp_annotations:
              summary: "k3s-worker-1 has never reported a successful container image collection"
              description: >-
                `ContainerImageGarbageCollectionStale` is a comparison and cannot fire without this
                series, so this node's image store is unwatched and will grow by one image per
                merge until the root filesystem alerts. Either the collection has never succeeded
                here or `fleet.containerImageGc.enable` is false on it. AN ABSENT SERIES IS NOT A
                COLLECTED IMAGE STORE.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE `== 1`, WHICH IS THE SAME TRAP `MongodNoPrimary` FELL INTO. node_exporter publishes one
  # series per unit STATE and moves the value between 0 and 1, so `state="active"` exists and sits
  # at 0 on a node whose k3s is stopped. Without the comparison this rule would report a node that
  # has no running runtime to collect from -- and would go on doing it while k3s was down, which
  # is when there is least to say about images.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",host="k3s-worker-1"}'
        values: '0+0x5000'
    alert_rule_test:
      - eval_time: 3d
        alertname: ContainerImageGarbageCollectionMetricAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A HEALTHY CLUSTER, WHICH EVERY K3S AND KUBE-STATE-METRICS RULE MUST LEAVE SILENT. Both k3s
  # units active, the node Ready, every Deployment at its replica count, no container waiting or
  # OOM-killed, and kube-state-metrics answering -- the steady state these rules page away from.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: a healthy cluster is silent
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",role="monitoring",host="monitoring-1"}'
        values: '1x60'
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",role="k3s-worker",host="k3s-worker-1"}'
        values: '1x60'
      - series: 'kube_node_info{node="k3s-worker-1"}'
        values: '1x60'
      - series: 'kube_node_status_condition{condition="Ready",status="true",node="k3s-worker-1"}'
        values: '1x60'
      - series: 'kube_deployment_spec_replicas{namespace="kinowo",deployment="web"}'
        values: '2x60'
      - series: 'kube_deployment_status_replicas_ready{namespace="kinowo",deployment="web"}'
        values: '2x60'
      - series: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '0x60'
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '1x60'
      - series: 'kube_pod_container_status_restarts_total{namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '3x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: K3sServerNotRunning
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sAgentNotRunning
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sUnitStateAbsent
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sNodeNotReady
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sDeploymentReplicasMissing
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sPodCrashLooping
        exp_alerts: []
      - eval_time: 45m
        alertname: K3sContainerOOMKilled
        exp_alerts: []
      - eval_time: 45m
        alertname: KubeStateMetricsSeriesAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE CONTROL PLANE STOPS on monitoring-1 at 11m, and the agent on the worker at the same
  # moment. The server pages after its 5m hold; the agent, which a rolling restart of k3s itself
  # takes down for minutes, waits 10m -- so at 18m only the server is firing.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: stopped k3s units fire after their holds
    input_series:
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",role="monitoring",host="monitoring-1"}'
        values: '1x10 0x30'
      - series: 'node_systemd_unit_state{name="k3s.service",state="active",role="k3s-worker",host="k3s-worker-1"}'
        values: '1x10 0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: K3sServerNotRunning
        exp_alerts: []
      - eval_time: 18m
        alertname: K3sServerNotRunning
        exp_alerts:
          - exp_labels:
              host: "monitoring-1"
              name: "k3s.service"
              role: "monitoring"
              severity: "critical"
              state: "active"
            exp_annotations:
              description: "No API server: nothing can be scheduled, `kubectl` does not answer, and the agent on k3s-worker-1 will go NotReady on its own once its lease expires. `journalctl -u k3s -n 200`. REMEMBER WHERE THIS PROCESS SITS IN THE QUEUE: k3s runs on the monitoring host with `CPUWeight = 100` against Prometheus's 400 and Alertmanager's 300 (roles/k3s-server.nix says so on its own unit, roles/prometheus.nix on the others), so a starved monitoring-1 sheds k3s FIRST, by design. If this fires alongside `CpuBusySustained` or a memory alert on the same host, the CPU weighting worked and k3s is the symptom rather than the cause."
              summary: "The k3s control plane is not running on monitoring-1"
      - eval_time: 18m
        alertname: K3sAgentNotRunning
        exp_alerts: []
      - eval_time: 25m
        alertname: K3sAgentNotRunning
        exp_alerts:
          - exp_labels:
              host: "k3s-worker-1"
              name: "k3s.service"
              role: "k3s-worker"
              severity: "warning"
              state: "active"
            exp_annotations:
              description: "A WARNING ONLY BECAUSE THIS NODE IS IDLE. k3s-worker-1 is an 8-core cx43 bought ahead of the workloads that will move onto it, and it currently runs none -- so an agent that is down costs nothing today. The moment anything real is scheduled there, raise this to critical and shorten the `for:`; leaving a warning on a node that serves traffic is how an outage gets found by a user. Check that the control plane is up first (see `K3sServerNotRunning`): an agent whose server is gone stops for a reason that is not its own."
              summary: "The k3s agent is not running on k3s-worker-1"

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # NOTHING REPORTS AT ALL: no k3s unit state and no kube-state-metrics. Both absent() rules
  # hold for 30m, so they are silent at 20m and firing at 40m.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: missing k3s unit state and kube-state-metrics fire after 30m
    input_series:
      - series: 'node_systemd_unit_state{name="sshd.service",state="active",role="k3s-worker",host="k3s-worker-1"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: K3sUnitStateAbsent
        exp_alerts: []
      - eval_time: 40m
        alertname: K3sUnitStateAbsent
        exp_alerts:
          - exp_labels:
              name: "k3s.service"
              severity: "warning"
            exp_annotations:
              description: "Both k3s alerts are comparisons and cannot fire without this series, so the only view of k3s that survives the control plane being gone has itself gone. kube-state-metrics does NOT cover this: it learns everything from the apiserver, so it goes quiet in exactly the case these two rules exist for. The likely causes are node_exporter's systemd collector being off, or both k3s hosts having dropped out of scrape. IT DOES NOT MEAN K3S IS RUNNING."
              summary: "Nothing is reporting the state of any k3s unit"
      - eval_time: 20m
        alertname: KubeStateMetricsSeriesAbsent
        exp_alerts: []
      - eval_time: 40m
        alertname: KubeStateMetricsSeriesAbsent
        exp_alerts:
          - exp_labels:
              severity: "warning"
            exp_annotations:
              description: "Every rule in this group is a comparison and none of them can fire without kube-state-metrics, so the cluster's workloads are currently unwatched -- node conditions, replica counts, crash loops and OOM kills all included. If `TargetDown` is silent alongside this, the exporter IS answering and the problem is inside it: either the ClusterRole in movies-gitops/kube-state-metrics/rbac.yaml no longer grants `nodes`, or the `--resources=` list in the Deployment stopped naming them, or the image was bumped across a rename. Those two files are written to agree with each other and nothing enforces it. IT DOES NOT MEAN THE CLUSTER IS HEALTHY."
              summary: "Nothing is reporting Kubernetes object state"

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A NODE GOES NOT-READY, A DEPLOYMENT FALLS A REPLICA SHORT, AND A CONTAINER CRASH-LOOPS, all
  # from 11m. Each is quiet before it happens and fires once its own hold has run.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: a not-ready node, a short deployment and a crash loop fire after their holds
    input_series:
      - series: 'kube_node_status_condition{condition="Ready",status="true",node="k3s-worker-1"}'
        values: '1x10 0x30'
      - series: 'kube_deployment_spec_replicas{namespace="kinowo",deployment="web"}'
        values: '2x40'
      - series: 'kube_deployment_status_replicas_ready{namespace="kinowo",deployment="web"}'
        values: '2x10 1x30'
      - series: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: K3sNodeNotReady
        exp_alerts: []
      - eval_time: 25m
        alertname: K3sNodeNotReady
        exp_alerts:
          - exp_labels:
              condition: "Ready"
              node: "k3s-worker-1"
              severity: "warning"
              status: "true"
            exp_annotations:
              description: "CHECK `K3sServerNotRunning` AND `K3sAgentNotRunning` FIRST. This rule reads the apiserver's opinion; those two read the machines directly, and a node that is NotReady because its k3s unit is dead is one fact reported twice. A node NotReady with both of those silent is the interesting case -- the unit is running and the kubelet is failing its own checks, for which `journalctl -u k3s -n 200` on that node is the first command. SEVERITY IS A WARNING BECAUSE OF WHAT IS SCHEDULED HERE TODAY, matching `K3sAgentNotRunning`'s reasoning in the group above; if that rule is ever raised to critical, raise this one in the same commit."
              summary: "Kubernetes node k3s-worker-1 is not Ready"
      - eval_time: 20m
        alertname: K3sDeploymentReplicasMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: K3sDeploymentReplicasMissing
        exp_alerts:
          - exp_labels:
              deployment: "web"
              namespace: "kinowo"
              severity: "warning"
            exp_annotations:
              description: "A rollout that has not converged. `kubectl -n kinowo describe deployment web` and then `describe pod` on the pending replica; the three causes worth ruling out in order are an image that cannot be pulled (the `ghcr-pull` secret is a read:packages token created out of band and is not in git -- see movies-gitops/worker/README.md), a PersistentVolumeClaim that cannot bind, and a pod that cannot be scheduled at all. THAT LAST ONE IS A REAL CONSTRAINT ON THIS CLUSTER, not a hypothetical: monitoring-1 is tainted NoSchedule as the control plane, so there is one schedulable node, and a pod holding a local-path PVC cannot move off it."
              summary: "Deployment kinowo/web has 1 replica(s) short"
      - eval_time: 10m
        alertname: K3sPodCrashLooping
        exp_alerts: []
      - eval_time: 25m
        alertname: K3sPodCrashLooping
        exp_alerts:
          - exp_labels:
              container: "worker"
              namespace: "kinowo"
              pod: "worker-pl-5d8f"
              reason: "CrashLoopBackOff"
              severity: "warning"
            exp_annotations:
              description: "The container starts, exits, and is restarted with increasing backoff. `kubectl -n kinowo logs worker-pl-5d8f -c worker --previous` is the command that shows WHY -- the current logs are from the attempt that has not failed yet. IF THIS IS THE WORKER, note that its own startup path is slow by design (a generous startupProbe covers a Mongo hydrate that can take minutes) and that `-XX:+ExitOnOutOfMemoryError` is set, so a heap problem presents as a clean exit and a restart loop rather than as an OOM kill. Check `K3sContainerOOMKilled` below to tell the two apart."
              summary: "kinowo/worker-pl-5d8f container worker is in CrashLoopBackOff"

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # AN OOM KILL THAT RESTARTS THE CONTAINER. The last-terminated reason has read OOMKilled all
  # along -- a kill from long ago, which the healthy case shows must NOT fire -- and the restart
  # counter moves at 11m. That movement is what makes it news.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    name: an OOM-killed container restarting fires
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="kinowo",pod="worker-pl-5d8f",container="worker"}'
        values: '3x10 4x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: K3sContainerOOMKilled
        exp_alerts: []
      - eval_time: 20m
        alertname: K3sContainerOOMKilled
        exp_alerts:
          - exp_labels:
              container: "worker"
              namespace: "kinowo"
              pod: "worker-pl-5d8f"
              reason: "OOMKilled"
              severity: "warning"
            exp_annotations:
              description: "THE CGROUP LIMIT KILLED IT, WHICH IS NOT THE SAME AS THE NODE RUNNING OUT OF MEMORY -- k3s-worker-1 has 16GB and one workload. Check the container's `resources.limits.memory` first; the limit is the number that decided this. FOR A JVM CONTAINER, an OOM kill means the process grew past its limit in NATIVE memory rather than heap, because `-XX:+ExitOnOutOfMemoryError` makes a heap exhaustion a clean exit instead -- so look at metaspace, direct buffers and thread stacks, not `-Xmx`. If the host itself is under memory pressure, `MemoryAvailableLow` in host-health.rules will be firing alongside this and it is the one to read first."
              summary: "kinowo/worker-pl-5d8f container worker was OOMKilled"
