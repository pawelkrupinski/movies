# UNIT TESTS FOR THE FLUX DEPLOY-PATH ALERTS.
#
# ⚠️ THIS FILE PREVIOUSLY PROVED THREE ALERTS CORRECT THAT COULD NEVER FIRE, and that is the most
# useful thing about its history. It fed promtool synthetic `gotk_reconcile_condition` and
# `gotk_suspend_status` series, asserted careful things about them, and passed -- while this
# fleet's Flux has never published either gauge. `count(max_over_time(...[30d]))` returns 0 for
# both. A unit test supplies its own inputs, so it can only ever say "IF this series existed, the
# rule would behave"; it cannot notice that the premise is false in production.
#
# The lesson kept here rather than in a commit message: for any rule watching a metric this
# repository does not itself publish, the test proves the LOGIC and something else has to prove the
# METRIC. That something is a series count against real Prometheus over a window longer than the
# condition being reported -- longer, because `kube_pod_container_status_waiting_reason` and
# `nixos_auto_apply_blocked_reason` both read zero at any healthy instant and are perfectly alive.
#
# What remains is one rule that watches reconciles CEASING, which the surviving metrics can say,
# and one that watches the controller being gone. Reconciliation FAILURE and a SUSPENDED object are
# not watched at all -- see the note in flux.rules.
rule_files:
  - ../../nix/files/monitoring/rules/flux.rules

evaluation_interval: 1m

tests:
  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A HEALTHY FLUX. Objects reconcile at the cadence this cluster actually runs -- the busiest sit
  # at 12-14 an hour -- and the controller is up. Nothing may fire.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      # 14/h, the measured rate for ImageUpdateAutomation/movies: one every ~4.3 minutes.
      - series: 'gotk_reconcile_duration_seconds_count{kind="ImageUpdateAutomation",name="movies",namespace="flux-system",job="flux"}'
        values: '0+0.233x300'
      - series: 'gotk_reconcile_duration_seconds_count{kind="Kustomization",name="web-pl-config",namespace="flux-system",job="flux"}'
        values: '0+0.2x300'
      - series: 'up{job="flux"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 250m
        alertname: FluxReconciliationStopped
      - eval_time: 250m
        alertname: FluxControllerDown

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE DEPLOY PATH STOPS WITHOUT AN OUTAGE. One Kustomization's counter flatlines while the other
  # keeps moving and the controller stays up -- which is the shape that hid a read-model fix for
  # hours on 2026-09-07: CI green, image built, nothing reaching pods.
  #
  # It must name the object that stopped and NOT the one still working.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'gotk_reconcile_duration_seconds_count{kind="Kustomization",name="web-pl-config",namespace="flux-system",job="flux"}'
        values: '500+0x300'
      - series: 'gotk_reconcile_duration_seconds_count{kind="Kustomization",name="headlamp",namespace="flux-system",job="flux"}'
        values: '0+0.2x300'
      - series: 'up{job="flux"}'
        values: '1+0x300'
    alert_rule_test:
      # THE `for:` IS LOAD-BEARING AND THIS IS WHAT PINS IT. The condition is already true at five
      # minutes -- see the note below -- so without `for: 15m` a single flat scrape interval would
      # page. Deleting the `for:` from the rule fails HERE and nowhere else.
      - eval_time: 5m
        alertname: FluxReconciliationStopped
      # ⚠️ NOT "nothing before 75m", which is the intuitive and wrong expectation this test was
      # first written with. `increase(counter[1h])` over a FLAT series is 0 as soon as the window
      # holds samples at all -- it does not wait for the window to span an hour of wall clock. So
      # the condition is true early and the `for: 15m` is the only delay. Asserted at 90m because
      # that is comfortably past it, not because 75m is a boundary.
      - eval_time: 90m
        alertname: FluxReconciliationStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: Kustomization
              name: web-pl-config
              namespace: flux-system
              job: flux
            exp_annotations:
              summary: 'flux Kustomization/web-pl-config has not reconciled for an hour'
              description: "`gotk_reconcile_duration_seconds_count` for this object has not moved in an hour, while the busiest objects on this cluster reconcile 12-14 times an hour. Either its controller is wedged, the object is suspended, or its source is unreachable. This is the DEPLOY PATH: a stopped Kustomization means merged changes stop reaching pods, silently, with CI green and the image built -- the state that hid a read-model fix for hours on 2026-09-07. Check `flux get all -A` on monitoring-1 and the controller's own output in the log store (`namespace:flux-system`). This alert does NOT watch reconciliation FAILURE: an object that reconciles and fails every time keeps this counter moving and stays silent here."

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A SLOW OBJECT IS NOT A STOPPED ONE. Some Flux objects reconcile on long intervals by design, so
  # the rule must not page for one that moves only a few times an hour.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      # 2 per hour -- far below the busiest objects, and still alive.
      - series: 'gotk_reconcile_duration_seconds_count{kind="GitRepository",name="movies",namespace="flux-system",job="flux"}'
        values: '0+0.0333x300'
      - series: 'up{job="flux"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 120m
        alertname: FluxReconciliationStopped

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE CONTROLLER IS GONE. `FluxReconciliationStopped` is expected to fire too once the counter
  # stops advancing -- both are true and both are worth saying, but the controller alert is the one
  # that names the cause.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="flux"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: FluxControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: flux
            exp_annotations:
              summary: 'flux  is not answering its metrics port'
              description: 'Either the controller is down or its NodePort no longer matches. The ports are fixed in movies-gitops/flux-metrics/services.yaml and must agree with `fleet.prometheus.fluxTargets`; nothing checks that, and a disagreement looks exactly like this. Check `kubectl -n flux-system get pods` first -- if they are Running, it is the port.'
