# UNIT TESTS FOR THE IDENTITY MATCHING ALERTS.
#
# IdentityTakesLost fires for UK's real 2026-10-14 loss (213 of 36,700 listings, 0.58%) across a worker
# restart, and stays quiet for the healthy hours beside it: DE's worst (20 lost of 34,650), a small country's
# 20 (over 0.15% of its 5,400, under the 25-listing floor), and US gaining 656 (gained is not lost).
# IdentityTakeChangesBurst fires for 600 of PL's 9,408 listings re-matched (6.4%) across a restart, and stays
# quiet for UK's ordinary hour, DE's real benign 39 re-takes (0.12%), and a burst of LOST takes (the other alert's).
rule_files:
  - ../../nix/files/monitoring/rules/identity-matching.rules

evaluation_interval: 1m

tests:
  # UK loses 213 listings' films at its first projection after a deploy, the worker having restarted just before.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_take_changes_total{country="uk",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '1x30 stale _x2 213x40'
      - series: 'kinowo_worker_identity_cutover_listings{country="uk",path="projection",instance="w1"}'
        values: '36700x30 stale _x2 36700x40'
      - series: 'kinowo_worker_identity_take_changes_total{country="de",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '0x30 20x43'
      - series: 'kinowo_worker_identity_take_changes_total{country="de",basis="OwnMatch",kind="changed",instance="w1"}'
        values: '0x30 39x43'
      - series: 'kinowo_worker_identity_cutover_listings{country="de",path="projection",instance="w1"}'
        values: '34650x73'
      - series: 'kinowo_worker_identity_take_changes_total{country="es",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '0x30 20x43'
      - series: 'kinowo_worker_identity_cutover_listings{country="es",path="projection",instance="w1"}'
        values: '5400x73'
      - series: 'kinowo_worker_identity_take_changes_total{country="us",basis="OwnMatch",kind="gained",instance="w1"}'
        values: '0x30 656x43'
      - series: 'kinowo_worker_identity_take_changes_total{country="us",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '0x73'
      - series: 'kinowo_worker_identity_cutover_listings{country="us",path="projection",instance="w1"}'
        values: '103800x73'
    alert_rule_test:
      - eval_time: 35m
        alertname: IdentityTakesLost
        exp_alerts: []
      - eval_time: 45m
        alertname: IdentityTakesLost
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk }
            exp_annotations:
              summary: "uk: 0.5804% of its listings lost their film within an hour"
              description: "The identity projection unmatched more than 0.15% of this country's published listings in the last hour: they had a TMDB film and now have none, so they show no rating, poster or synopsis. Its normal hour is under 0.07%. Which ones, why, and which build: VictoriaLogs `country:<cc> \"identity take change\" kind:lost | stats by (build, basis) count()`, one line per listing with the resolver's reason. A loss at a worker's first projection after a deploy is that build's resolver change -- CI's identity takes check should have listed it; one mid-pod is the data or an answer store moving."
      - eval_time: 45m
        alertname: IdentityTakeChangesBurst
        exp_alerts: []

  # PL re-matches 600 of its 9,408 listings at once (6.4%), the worker restarting a few minutes later. Quiet until
  # the `for:` is up, then firing for pl alone.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_take_changes_total{country="pl",basis="OwnMatch",kind="changed",instance="w1"}'
        values: '0x30 600x5 stale _x2 600x40'
      - series: 'kinowo_worker_identity_take_changes_total{country="pl",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '0x30 0x5 stale _x2 0x40'
      - series: 'kinowo_worker_identity_cutover_listings{country="pl",path="projection",instance="w1"}'
        values: '9408x35 stale _x2 9408x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: IdentityTakeChangesBurst
        exp_alerts: []
      - eval_time: 50m
        alertname: IdentityTakeChangesBurst
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl }
            exp_annotations:
              summary: "pl: 6.378% of its listings changed their film within an hour"
              description: "The identity projection moved more than 0.5% of this country's published listings to another TMDB film in the last hour. Listings leaving the schedule and re-keys that keep the film are not counted, so this is the site showing different films under the same listings. Which ones and why: VictoriaLogs `country:<cc> \"identity take change\" kind:changed` (one line per listing: venue, listing, old -> new film, the resolver's reason, the build). A burst right after a worker deploy is the deploy's resolver change -- CI's identity takes check should have listed it; one with no deploy is the data or an answer store moving (the agreement stage, a TMDB answer re-read). Panel: worker diagnostics, \"Identity cutover -- regroupings\"."
      - eval_time: 50m
        alertname: IdentityTakesLost
        exp_alerts: []

  # Quiet: UK's ordinary hour (100 changed of 35,891 = 0.3%), a 1,000-listing country re-matching 40 (4%, but
  # under the floor), and US gaining 5,000 takes at once (gained is not counted).
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_take_changes_total{country="uk",basis="OwnMatch",kind="changed",instance="w1"}'
        values: '0+2x60'
      - series: 'kinowo_worker_identity_cutover_listings{country="uk",path="projection",instance="w1"}'
        values: '35891x60'
      - series: 'kinowo_worker_identity_take_changes_total{country="xx",basis="OwnMatch",kind="changed",instance="w1"}'
        values: '0x20 40x40'
      - series: 'kinowo_worker_identity_cutover_listings{country="xx",path="projection",instance="w1"}'
        values: '1000x60'
      - series: 'kinowo_worker_identity_take_changes_total{country="us",basis="OwnMatch",kind="gained",instance="w1"}'
        values: '0x20 5000x40'
      - series: 'kinowo_worker_identity_take_changes_total{country="us",basis="OwnMatch",kind="lost",instance="w1"}'
        values: '0x60'
      - series: 'kinowo_worker_identity_cutover_listings{country="us",path="projection",instance="w1"}'
        values: '101678x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: IdentityTakeChangesBurst
        exp_alerts: []
      - eval_time: 55m
        alertname: IdentityTakesLost
        exp_alerts: []

  # SUSPECT TAKES: UK at 40 for a day, then 60 (+20) for three hours across a worker restart -- fires after its
  # two-hour hold. PL rising by 5 (under 10), DE from 300 to 312 (+12, but 4%) and ES with no value a day ago stay quiet.
  - interval: 10m
    input_series:
      - series: 'kinowo_worker_identity_suspect_takes{country="uk",signal="era",instance="w1"}'
        values: '30x150 50x8 stale 50x12'
      - series: 'kinowo_worker_identity_suspect_takes{country="uk",signal="sequel",instance="w1"}'
        values: '10x150 10x8 stale 10x12'
      - series: 'kinowo_worker_identity_suspect_takes{country="pl",signal="era",instance="w1"}'
        values: '20x150 25x21'
      - series: 'kinowo_worker_identity_suspect_takes{country="es",signal="era",instance="w1"}'
        values: '_x150 90x21'
      - series: 'kinowo_worker_identity_suspect_takes{country="de",signal="era",instance="w1"}'
        values: '300x150 312x21'
    alert_rule_test:
      - eval_time: 1560m
        alertname: IdentitySuspectTakesRising
        exp_alerts: []
      - eval_time: 1700m
        alertname: IdentitySuspectTakesRising
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk }
            exp_annotations:
              summary: "uk: 20 more suspect takes than a day ago"
              description: "The live resolve's suspect takes (billings whose film a signal doubts against the listing's own evidence: a title fragment, an era, a runtime, a sequel number, a feed id, a fill route) rose by more than 10 over the same time yesterday, for two hours. Which signal: worker diagnostics, the identity cutover panel (`kinowo_worker_identity_suspect_takes` by signal); which takes: the suspect-take audit (scripts.SuspectTakesMeasure over a recording, or the convergence legs' step summary on the next push). A rise right after a worker deploy is the deploy's; IdentityTakeChangesBurst or IdentityTakesLost firing beside it says the films themselves moved."

  # IdentityTakeOscillating: UK's Ties That Bind Us reverses once per pod start (hourly) -- fires once a second hour
  # holds a reversal; one batch of reversals in a single hour (a quick correction) stays quiet; DE restarting with no
  # reversal stays quiet.
  - interval: 5m
    input_series:
      - series: 'kinowo_worker_identity_take_reversals_total{country="uk",instance="w1"}'
        values: '0x11 1x12 stale 0x11 1x12'
      - series: 'kinowo_worker_identity_take_reversals_total{country="pl",instance="w1"}'
        values: '0x11 32x50'
      - series: 'kinowo_worker_identity_take_reversals_total{country="de",instance="w1"}'
        values: '0x23 stale 0x30'
    alert_rule_test:
      - eval_time: 3h
        alertname: IdentityTakeOscillating
        exp_alerts: []
      - eval_time: 4h
        alertname: IdentityTakeOscillating
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk }
            exp_annotations:
              summary: "uk: listings moved back to a film they held, in 2 of the last 6 hours"
              description: "The identity projection keeps undoing its own take changes: a listing taken from film A to B is taken back to A within three projections, and it happened again in another hour. Two rules disagree on the listing and each undoes the other (2026-10-13/14: UK \"The Ties That Bind Us\", the exact-top-hit own match against the families-and-poster correction, once per pod start). Which listings: VictoriaLogs `country:<cc> \"identity take change\" | stats by (venue, listing) count() n | sort by (n desc)`, then the listing's lines' basis, reason_last and projection_mode on each side of the flip. Panel: worker diagnostics, \"Identity cutover -- regroupings\"."

  # IdentityBillingTakeOscillating: UK's RBO Macbeth reverses at a boot in each of three hours -- fires once the third
  # hour holds one; Arirang's one burst of reversals in one hour (two record renames) stays quiet, as does a billing
  # reversing in two hours only.
  - interval: 5m
    input_series:
      - series: 'kinowo_worker_identity_billing_reversals_total{country="uk",billing="rbo cinema season 2026 27 macbeth",instance="w1"}'
        values: '0x11 1x12 stale 0x11 1x12 stale 0x11 1x12'
      - series: 'kinowo_worker_identity_billing_reversals_total{country="uk",billing="bts world tour arirang in buenos aires live viewing",instance="w1"}'
        values: '0x11 5x60'
      - series: 'kinowo_worker_identity_billing_reversals_total{country="de",billing="the killer",instance="w1"}'
        values: '0x11 1x12 2x50'
    alert_rule_test:
      - eval_time: 4h
        alertname: IdentityBillingTakeOscillating
        exp_alerts: []
      - eval_time: 6h
        alertname: IdentityBillingTakeOscillating
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk, billing: "rbo cinema season 2026 27 macbeth" }
            exp_annotations:
              summary: "uk: 'rbo cinema season 2026 27 macbeth' moved back to a film it held, in 3 hours of the last 24"
              description: "Two identity rules or stages keep undoing each other on one billing: its listings were taken from film A to B and back to A within three projections, in three or more separate hours today. Treat it as a bug in the rules, never churn. Which listings and why: `scripts/listing-history <cc> --title '<billing>' --since 1d` (each change's basis, projection_mode and deploy)."

  # IdentityAgreementBackfillStalled / IdentityAgreementBackfillGaugeAbsent: DE's backfill falling by 500 an apply is
  # quiet, as is UK at 0 from boot; PL stuck at 43 for the whole window fires. With no series at all the gauge-absent
  # alert fires after 30m, and with one it stays quiet.
  - interval: 30m
    input_series:
      - series: 'kinowo_worker_identity_agreement_clusters{country="de",state="incomplete",instance="w1"}'
        values: '1597 1097 597 97 0 0 0 0 0 0 0 0'
      - series: 'kinowo_worker_identity_agreement_clusters{country="uk",state="incomplete",instance="w1"}'
        values: '0x11'
      - series: 'kinowo_worker_identity_agreement_clusters{country="pl",state="incomplete",instance="w1"}'
        values: '43x11'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentityAgreementBackfillStalled
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl, instance: w1, state: incomplete }
            exp_annotations:
              summary: "pl: 43 agreement verdicts still to decide again, none in 3 hours"
              description: "The agreement backfill after a rules change decides a budget of stored verdicts an apply, and the count of those left has not fallen in three hours. Worker diagnostics, the agreement panels; is the projection running (IdentityProjectionStale), and does the worker log an agreement apply error?"
      - eval_time: 5h
        alertname: IdentityAgreementBackfillGaugeAbsent
        exp_alerts: []

  - interval: 30m
    input_series:
      - series: 'kinowo_worker_identity_agreement_clusters{country="de",state="agreed",instance="w1"}'
        values: '94x11'
    alert_rule_test:
      - eval_time: 2h
        alertname: IdentityAgreementBackfillGaugeAbsent
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, state: incomplete }
            exp_annotations:
              summary: "no worker reports the agreement backfill's incomplete count"
              description: "`kinowo_worker_identity_agreement_clusters{state=\"incomplete\"}` is exported at 0 from boot by every worker, so none at all means the workers are not scraped or the series was renamed."

  # IdentityAgreementBackfillStalled stays quiet while a backfill is going on: DE still above 0 every sample of the
  # window but falling 500 an apply (the delta clause holds it), and UK at 0 from boot (the min clause holds it).
  - interval: 30m
    input_series:
      - series: 'kinowo_worker_identity_agreement_clusters{country="de",state="incomplete",instance="w1"}'
        values: '6000-500x11'
      - series: 'kinowo_worker_identity_agreement_clusters{country="uk",state="incomplete",instance="w1"}'
        values: '0x11'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentityAgreementBackfillStalled
        exp_alerts: []
