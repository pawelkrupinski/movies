        values: '0x120'
      - series: 'kinowo_uptime_recent_failures{country="es",job="kinowo-web",service="Cinesa Enrichment"}'
        values: '3x120'
      - series: 'kinowo_uptime_recent_successes{country="es",job="kinowo-web",service="Cinesa Enrichment"}'
