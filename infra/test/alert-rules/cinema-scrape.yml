# UNIT TESTS FOR THE CINEMA-SCRAPE CENSUS ALERTS.
#
# The rules read two gauges and nothing else, and every threshold in them is a literal that
# `CinemaScrapeStalenessAlertSpec` in the application repository derives from the deploy configs.
# What that spec cannot ask is whether the PromQL around those literals means what the comments
# say -- that an `or` chain yields one alert per breaching country, that a country with no clause
# is silent however stale it gets, that the never-scraped count and the age are two separate
# questions, and that the companion `absent()` fires on the census going missing rather than on
# any country going quiet. Those are the claims pinned here.
#
# The age rule's summary renders `$value` through `humanizeDuration`, so the breaching readings
# are round numbers of hours; a value like 5401 would render as "1h 30m 1s" and prove nothing
# the round one does not.

rule_files:
  - ../../nix/files/monitoring/rules/cinema-scrape.rules

evaluation_interval: 1m

tests:
  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A HEALTHY SAWTOOTH. PL rides just under its 1.5x window (5400s) and DE sits at half of its
  # (54000s): the shape the header describes as normal operation, which must not fire even
  # though PL is within a few minutes of the line. Nobody is never-scraped, and the census is
  # present, so the companion is quiet too.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="pl"}'
        values: '5000+0x120'
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="de"}'
        values: '27000+0x120'
      - series: 'kinowo_worker_cinema_scrape_never_scraped{country="pl"}'
        values: '0+0x120'
      - series: 'kinowo_worker_cinema_scrape_never_scraped{country="de"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts: []
      - eval_time: 1h
        alertname: CinemaScrapeNeverScraped
        exp_alerts: []
      - eval_time: 1h
        alertname: CinemaScrapeCensusAbsent
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # ONE COUNTRY OVER ITS OWN LINE, ANOTHER OVER PL'S LINE BUT UNDER ITS OWN. PL at two hours
  # is past 5400s; the US at the same two hours is nowhere near its 75600s. A single fleet-
  # wide threshold would have paged the US here or missed PL -- the whole reason the clauses
  # are per country. The `for: 30m` holds the PL alert back at the twenty-minute mark and
  # releases it at the hour.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="pl"}'
        values: '7200+0x120'
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="us"}'
        values: '7200+0x120'
    alert_rule_test:
      # Past the line but not yet for thirty minutes: the restart-spike filter.
      - eval_time: 20m
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts: []
      - eval_time: 1h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts:
          - exp_labels:
              country: pl
              severity: warning
            exp_annotations:
              summary: "pl's oldest cinema has not scraped in 2h 0m 0s"
              description: >-
                The least recently scraped cinema in "pl" is past 1.5x that country's
                KINOWO_SCRAPE_FRESHNESS_MINUTES window, so the sweep is not keeping up with its own cadence.
                Read the shape before reading the number: a line climbing in a straight diagonal is ONE
                cinema failing every attempt (a failed scrape does not mark freshness, so it stays stale for
                ever and drags the maximum with it), while an oscillating but high ceiling is the whole
                sweep running slower than its window -- a slow upstream, a pacing change, or a roster that
                grew. Panel 58 on the application dashboard draws it. Check the worker's logs for a venue
                erroring on every pass, and `RealHttpFetch.HostPolicies` for a pace that has been tightened
                without the cadence being widened to match; that pairing is what put DE 4x over its window
                in July 2026 with every other panel clean. If the sweep is simply too slow for the window,
                the cadence is the lever, and `WorkerScrapeCadenceConfigSpec` asserts the arithmetic.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE SAME PL BREACH, THROUGH A WORKER RESTART. The pod change at 40m leaves the gauge absent
  # for three minutes -- a staleness marker, then nothing -- and the census comes back reading
  # the same age from the freshness mirror. Read raw, the gap emptied the result, dropped the
  # pending alert, and the thirty-minute hold started over at 44m, so a country whose worker
  # restarted every half hour (a deploy day) never paged at all.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="pl"}'
        values: '7200x40 stale _x2 7200x77'
    alert_rule_test:
      - eval_time: 1h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts:
          - exp_labels:
              country: pl
              severity: warning
            exp_annotations:
              summary: "pl's oldest cinema has not scraped in 2h 0m 0s"
              description: >-
                The least recently scraped cinema in "pl" is past 1.5x that country's
                KINOWO_SCRAPE_FRESHNESS_MINUTES window, so the sweep is not keeping up with its own cadence.
                Read the shape before reading the number: a line climbing in a straight diagonal is ONE
                cinema failing every attempt (a failed scrape does not mark freshness, so it stays stale for
                ever and drags the maximum with it), while an oscillating but high ceiling is the whole
                sweep running slower than its window -- a slow upstream, a pacing change, or a roster that
                grew. Panel 58 on the application dashboard draws it. Check the worker's logs for a venue
                erroring on every pass, and `RealHttpFetch.HostPolicies` for a pace that has been tightened
                without the cadence being widened to match; that pairing is what put DE 4x over its window
                in July 2026 with every other panel clean. If the sweep is simply too slow for the window,
                the cadence is the lever, and `WorkerScrapeCadenceConfigSpec` asserts the arithmetic.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE OR-CHAIN YIELDS ONE ALERT PER BREACHING COUNTRY. DE and UK are both past their lines
  # at once; the header promises "five times with five names rather than once with none", and
  # this is the two-name version of that promise.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="de"}'
        values: '72000+0x120'
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="uk"}'
        values: '43200+0x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts:
          - exp_labels:
              country: de
              severity: warning
            exp_annotations:
              summary: "de's oldest cinema has not scraped in 20h 0m 0s"
              description: >-
                The least recently scraped cinema in "de" is past 1.5x that country's
                KINOWO_SCRAPE_FRESHNESS_MINUTES window, so the sweep is not keeping up with its own cadence.
                Read the shape before reading the number: a line climbing in a straight diagonal is ONE
                cinema failing every attempt (a failed scrape does not mark freshness, so it stays stale for
                ever and drags the maximum with it), while an oscillating but high ceiling is the whole
                sweep running slower than its window -- a slow upstream, a pacing change, or a roster that
                grew. Panel 58 on the application dashboard draws it. Check the worker's logs for a venue
                erroring on every pass, and `RealHttpFetch.HostPolicies` for a pace that has been tightened
                without the cadence being widened to match; that pairing is what put DE 4x over its window
                in July 2026 with every other panel clean. If the sweep is simply too slow for the window,
                the cadence is the lever, and `WorkerScrapeCadenceConfigSpec` asserts the arithmetic.
          - exp_labels:
              country: uk
              severity: warning
            exp_annotations:
              summary: "uk's oldest cinema has not scraped in 12h 0m 0s"
              description: >-
                The least recently scraped cinema in "uk" is past 1.5x that country's
                KINOWO_SCRAPE_FRESHNESS_MINUTES window, so the sweep is not keeping up with its own cadence.
                Read the shape before reading the number: a line climbing in a straight diagonal is ONE
                cinema failing every attempt (a failed scrape does not mark freshness, so it stays stale for
                ever and drags the maximum with it), while an oscillating but high ceiling is the whole
                sweep running slower than its window -- a slow upstream, a pacing change, or a roster that
                grew. Panel 58 on the application dashboard draws it. Check the worker's logs for a venue
                erroring on every pass, and `RealHttpFetch.HostPolicies` for a pace that has been tightened
                without the cadence being widened to match; that pairing is what put DE 4x over its window
                in July 2026 with every other panel clean. If the sweep is simply too slow for the window,
                the cadence is the lever, and `WorkerScrapeCadenceConfigSpec` asserts the arithmetic.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # A COUNTRY WITH NO CLAUSE IS NOT WATCHED -- stated in the rule's own comment as the failure
  # mode to look for after onboarding, and pinned here so the sentence stays true rather than
  # merely written. A week-old "fr" reading fires nothing. If this case ever starts failing,
  # the rule grew a fleet-wide fallback and the per-country reasoning in the header needs
  # revisiting, not the test.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="fr"}'
        values: '604800+0x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # CINEMAS THAT HAVE NEVER SCRAPED. Three US venues carry no successful scrape while the US
  # age gauge sits at a healthy value: the hole the age rule is structurally blind to. Twelve
  # hours in, this is still what a fresh US worker looks like before its first sweep reaches
  # everything, so nothing fires; at twenty-five hours it is not a cold start any more.
  # THROUGH RESTARTS. Each series goes stale for ~3 minutes every five hours -- a worker restart, which the
  # fleet does ~16 times on a deploy day -- and the hold must ride through it.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_oldest_age_seconds{country="us"}'
        values: '36000x299 stale _x2 36000x299 stale _x2 36000x299 stale _x2 36000x299 stale _x2 36000x299 stale _x2 36000x85'
      - series: 'kinowo_worker_cinema_scrape_never_scraped{country="us"}'
        values: '3x299 stale _x2 3x299 stale _x2 3x299 stale _x2 3x299 stale _x2 3x299 stale _x2 3x85'
    alert_rule_test:
      - eval_time: 12h
        alertname: CinemaScrapeNeverScraped
        exp_alerts: []
      - eval_time: 25h
        alertname: CinemaScrapeNeverScraped
        exp_alerts:
          - exp_labels:
              country: us
              severity: warning
            exp_annotations:
              summary: "3 cinema(s) in us have never been scraped successfully"
              description: >-
                These venues carry no successful scrape at all, so they contribute no age to
                CinemaScrapeOldestAgeHigh and appear in no scrape counter -- they are invisible to every
                other signal. A full day is longer than any country's sweep, so this is not a cold start.
                Most likely a venue was added to the roster with a URL that has never resolved, or a client
                throws before it can record anything. Panel 59 on the application dashboard counts them per
                country; the `cinema_scrapes` archive names which.
      # The never-scraped venues contribute no age, by design, so the age rule stays quiet.
      - eval_time: 25h
        alertname: CinemaScrapeOldestAgeHigh
        exp_alerts: []

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # THE CENSUS IS GONE. No worker in any country publishes the age gauge -- the one shape both
  # rules above cannot see, because they only ever compare a series that is there. Quiet
  # inside the hour, which is a fleet-wide rollout; firing after it. `absent()` carries no
  # country label, so the alert has none.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_cinema_scrape_never_scraped{country="pl"}'
        values: '0+0x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CinemaScrapeCensusAbsent
        exp_alerts: []
      - eval_time: 2h
        alertname: CinemaScrapeCensusAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No worker is publishing the cinema-scrape census"
              description: >-
                kinowo_worker_cinema_scrape_oldest_age_seconds has no series from any country, so
                CinemaScrapeOldestAgeHigh and CinemaScrapeNeverScraped cannot fire and the roster is
                unwatched. Either every worker is down -- in which case TargetDown in monitoring-self.rules
                is also firing and is the better alert to read -- or `CinemaScrapeCensus` has stopped being
                scheduled, which TargetDown would NOT catch because the pod is up and serving /metrics
                without this gauge in it. AN ABSENT CENSUS IS NOT A FRESH ROSTER.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # RETIRED-VENUE ROWS: FIFTY HOURS OVER ZERO FIRES, A CLEANUP INSIDE THE GRACE DOES NOT. PL
  # carries 6 rows for 51 hours; UK carries 20 for 47 hours -- the 24h grace plus a daily tick
  # that came late -- and then its cleanup runs. The `max by (country)` takes the larger
  # collection, so the summary names the rows still left.
  # PL THROUGH RESTARTS. Each series goes stale for ~3 minutes every ten hours -- a worker restart, which the
  # fleet does ~16 times on a deploy day -- and the hold must ride through it.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_retired_venue_side_rows{country="pl",collection="screenings",job="kinowo-worker"}'
        values: '3x599 stale _x2 3x599 stale _x2 3x599 stale _x2 3x599 stale _x2 3x599 stale _x2 3x105'
      - series: 'kinowo_worker_retired_venue_side_rows{country="pl",collection="movie_slots",job="kinowo-worker"}'
        values: '6x599 stale _x2 6x599 stale _x2 6x599 stale _x2 6x599 stale _x2 6x599 stale _x2 6x105'
      - series: 'kinowo_worker_retired_venue_side_rows{country="uk",collection="screenings",job="kinowo-worker"}'
        values: '20x2820 0x300'
    alert_rule_test:
      - eval_time: 49h
        alertname: RetiredVenueRowsLingering
        exp_alerts: []
      - eval_time: 51h
        alertname: RetiredVenueRowsLingering
        exp_alerts:
          - exp_labels:
              country: pl
              severity: warning
            exp_annotations:
              summary: "pl still holds 9 side row(s) under a venue its roster no longer lists"
              description: >-
                `screenings` or `movie_slots` rows in "pl" have been filed under a venue
                name missing from that country's roster for over two days -- longer than the daily
                retired-venue cleanup and its 24h grace allow. Nothing serves them, and that cleanup
                evidently has not removed them (look for its RemovalAudit line or its refusal WARN,
                "Retired-venue rows: ..." in the worker log); every
                census that reads the side collections raw counts their future showtimes
                (`kinowo_worker_retired_venue_future_showtimes`) as live. Name the venues with
                `db.screenings.aggregate([{$group: {_id: {$arrayElemAt: [{$split: ["$slotKey", "␟"]}, 0]}, n: {$sum: 1}}}])`
                against the country's database and compare with its roster. A foreign country's venue
                in the list means rows were written into the wrong database.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # DUPLICATE VENUES: A DAY OF OVERLAP FIRES, AN EVENING OF IT DOES NOT, PER SCOPE. PL holds one
  # same-city pair for 25 hours; US one cross-city pair for 25 hours (its same-city count stays
  # zero, so only the cross_city series fires); UK holds two for 6 hours and then diverges.
  # PL's cross-city pair is held for 25 hours THROUGH a worker restart every ~5 hours: each
  # restart leaves the series absent for ~3 minutes (the old pod's staleness marker, then the new
  # pod's boot), which is what the fleet does ~16 times a day on a deploy day -- and a `for:`
  # that one absent evaluation resets could only fire after a day with no deploy at all (one
  # day-long uptime in the week to 2026-09-23).
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_duplicate_venue_pairs{country="pl",scope="same_city",job="kinowo-worker"}'
        values: '1x1560'
      - series: 'kinowo_worker_duplicate_venue_pairs{country="us",scope="cross_city",job="kinowo-worker"}'
        values: '1x1560'
      - series: 'kinowo_worker_duplicate_venue_pairs{country="pl",scope="cross_city",job="kinowo-worker"}'
        values: '1x300 stale _x2 1x300 stale _x2 1x300 stale _x2 1x300 stale _x2 1x300 stale _x2 1x40'
      - series: 'kinowo_worker_duplicate_venue_pairs{country="us",scope="same_city",job="kinowo-worker"}'
        values: '0x1560'
      - series: 'kinowo_worker_duplicate_venue_pairs{country="uk",scope="same_city",job="kinowo-worker"}'
        values: '2x360 0x1200'
    alert_rule_test:
      - eval_time: 23h
        alertname: DuplicateVenueListing
        exp_alerts: []
      - eval_time: 25h
        alertname: DuplicateVenueListing
        exp_alerts:
          - exp_labels:
              country: pl
              scope: same_city
              severity: warning
            exp_annotations:
              summary: "1 same_city venue pair(s) in pl have shared their programme for a day"
              description: >-
                Two roster venues in "pl" have listed (nearly) the same upcoming films
                at the same start times for 24 hours. same_city (90%+, one city): one screen listed
                twice under two names, or two venues wired to one upstream listing. cross_city (95%+,
                no city in common): one venue's feed listed under another's name. The worker's WARN
                line "duplicate-venue census (pl, same_city)" names the
                pairs. A pair whose shared showtimes book through each venue's own links is cleared before
                it is counted, so what is left books the same sessions or has no links on one side. Check
                its sources in CinemaScraperCatalog: one upstream programme behind two names is a wiring bug
                to fix (or a venue with no feed of its own to drop); two real venues programmed alike with
                no links to tell them apart go on `services.cinemas.roster.DistinctVenuePairs` with the
                reason, which clears them here and in the offline roster audit alike.
          - exp_labels:
              country: pl
              scope: cross_city
              severity: warning
            exp_annotations:
              summary: "1 cross_city venue pair(s) in pl have shared their programme for a day"
              description: >-
                Two roster venues in "pl" have listed (nearly) the same upcoming films
                at the same start times for 24 hours. same_city (90%+, one city): one screen listed
                twice under two names, or two venues wired to one upstream listing. cross_city (95%+,
                no city in common): one venue's feed listed under another's name. The worker's WARN
                line "duplicate-venue census (pl, cross_city)" names the
                pairs. A pair whose shared showtimes book through each venue's own links is cleared before
                it is counted, so what is left books the same sessions or has no links on one side. Check
                its sources in CinemaScraperCatalog: one upstream programme behind two names is a wiring bug
                to fix (or a venue with no feed of its own to drop); two real venues programmed alike with
                no links to tell them apart go on `services.cinemas.roster.DistinctVenuePairs` with the
                reason, which clears them here and in the offline roster audit alike.
          - exp_labels:
              country: us
              scope: cross_city
              severity: warning
            exp_annotations:
              summary: "1 cross_city venue pair(s) in us have shared their programme for a day"
              description: >-
                Two roster venues in "us" have listed (nearly) the same upcoming films
                at the same start times for 24 hours. same_city (90%+, one city): one screen listed
                twice under two names, or two venues wired to one upstream listing. cross_city (95%+,
                no city in common): one venue's feed listed under another's name. The worker's WARN
                line "duplicate-venue census (us, cross_city)" names the
                pairs. A pair whose shared showtimes book through each venue's own links is cleared before
                it is counted, so what is left books the same sessions or has no links on one side. Check
                its sources in CinemaScraperCatalog: one upstream programme behind two names is a wiring bug
                to fix (or a venue with no feed of its own to drop); two real venues programmed alike with
                no links to tell them apart go on `services.cinemas.roster.DistinctVenuePairs` with the
                reason, which clears them here and in the offline roster audit alike.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # FAILURE SHARE: A SUSTAINED SPIKE FIRES; EMPTY LISTINGS, NON-CINEMA SERVICES AND A THIN WINDOW
  # DO NOT. UK: 30 venues, 12 failing (40%) for 3h. PL: 20 venues, every one returning an EMPTY
  # listing (a closed season), plus TMDB and the chain-wide "Cinema City Enrichment" detail row
  # failing hard -- enrichment, not a scrape, so zero cinema failures and silent. ES: 2
  # checks, 1 failed -- 50%, but under the 10-check floor. UK's failures start at t=0 and the
  # rule holds for 2h, so it is pending at 1h and firing at 2h10m.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_uptime_recent_failures{country="uk",job="kinowo-web",service="Cineworld Feltham"}'
        values: '12x200'
      - series: 'kinowo_uptime_recent_successes{country="uk",job="kinowo-web",service="Cineworld Feltham"}'
        values: '18x200'
      - series: 'kinowo_uptime_recent_zeroes{country="uk",job="kinowo-web",service="Cineworld Feltham"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="Kino Sława"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="Kino Sława"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_zeroes{country="pl",job="kinowo-web",service="Kino Sława"}'
        values: '20x200'
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="TMDB"}'
        values: '50x200'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="TMDB"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_zeroes{country="pl",job="kinowo-web",service="TMDB"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_failures{country="pl",job="kinowo-web",service="Cinema City Enrichment"}'
        values: '50x200'
      - series: 'kinowo_uptime_recent_successes{country="pl",job="kinowo-web",service="Cinema City Enrichment"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_zeroes{country="pl",job="kinowo-web",service="Cinema City Enrichment"}'
        values: '0x200'
      - series: 'kinowo_uptime_recent_failures{country="es",job="kinowo-web",service="Cines Victoria Mérida"}'
        values: '1x200'
      - series: 'kinowo_uptime_recent_successes{country="es",job="kinowo-web",service="Cines Victoria Mérida"}'
        values: '1x200'
      - series: 'kinowo_uptime_recent_zeroes{country="es",job="kinowo-web",service="Cines Victoria Mérida"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 1h
        alertname: CinemaScrapeFailureShareHigh
        exp_alerts: []
      - eval_time: 2h10m
        alertname: CinemaScrapeFailureShareHigh
        exp_alerts:
          - exp_labels:
              country: uk
              severity: warning
            exp_annotations:
              summary: "40% of uk's cinema scrape checks have been failing for two hours"
              description: >-
                More than a fifth of the cinema uptime checks in "uk" have FAILED
                (fetch or parse threw, not an empty listing) for two hours straight. That is a shared
                code path, not one venue: a chain client, a ticketing portal, a proxy or an upstream
                that changed its markup or started refusing us. Open https://kinowo.net/uptime (or the
                country's own /uptime) and group the red rows by source host -- the one host they share
                is the cause, and its error text is on the row. Empty listings are NOT counted: a
                seasonally closed venue returns nothing and is healthy. A single venue failing every
                attempt shows up in CinemaScrapeOldestAgeHigh instead.

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # CHAIN-WIDE DETAIL ENRICHMENT FAILING. UK: Cineworld Enrichment at 100% failed from t=0 (the
  # 2026-09-18..21 shape), with the web target going stale for 3 minutes at 30min -- a pod change
  # -- which the hold must ride through: pending at 45m, firing at 70m. PL: Cinema City
  # Enrichment at 60% for 30 minutes and then healthy -- the longest excursion in 14 days of
  # prod history -- silent. ES: 3 of 4 failing, under the 10-check floor -- silent.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'kinowo_uptime_recent_failures{country="uk",job="kinowo-web",service="Cineworld Enrichment"}'
        values: '200x29 stale _x2 200x90'
      - series: 'kinowo_uptime_recent_successes{country="uk",job="kinowo-web",service="Cineworld Enrichment"}'
        values: '0x29 stale _x2 0x90'
      - series: 'kinowo_uptime_recent_zeroes{country="uk",job="kinowo-web",service="Cineworld Enrichment"}'
