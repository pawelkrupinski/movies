  # ...WHILE A RUNAWAY THAT STARTS AFTER A QUIET DAY STILL WARNS WITH MORE THAN A DAY LEFT. 24 hours
  # flat at 135G -- the history a real disk has, which the cases above omit -- then 3 GB an hour,
  # which empties it 45 hours in. The day-long fit is diluted by the flat day, so this warns later
  # than the six-hour fit alone would: modelled at ~13h in, with ~32h still left.
  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="k3s-worker-1",mountpoint="/",fstype="ext4",device="/dev/sda2",instance="10.20.0.12:9100",job="node"}'
        values: '135000000000x288 135000000000-250000000x200'
    alert_rule_test:
      - eval_time: 30h
        alertname: FilesystemWillFillWithin3Days
        exp_alerts: []
      - eval_time: 38h30m
        alertname: FilesystemWillFillWithin3Days
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              mountpoint: /
              fstype: ext4
              device: /dev/sda2
              instance: 10.20.0.12:9100
              job: node
            exp_annotations:
              summary: "/ on k3s-worker-1 is on course to fill within 3 days"
              description: "A RUNAWAY WRITER, NOT A DRIFT -- the last six hours' slope and the last day's both empty this filesystem within three days (or the six hours' alone within one), so it is not the deploy-day image pulls the nightly container-image collection takes back. `du -xh --max-depth=3 / | sort -h | tail -20` names it. On k3s-worker-1 look first at /var/lib/kinowo/share-cards (the workers' share cards: check `kinowo_worker_share_cards_bytes` against its budget and whether PruneShareCards is running), then /var/lib/rancher (images -- is `ContainerImageGarbageCollectionStale` firing? -- and pod logs)."

  # A FAST RUNAWAY DOES NOT WAIT FOR THE DAY-LONG FIT: 5 GB an hour after the same quiet day projects
  # to empty within ONE day on the six-hour fit alone, which warns on its own clause long before the
  # diluted day-long fit agrees -- the notice the rule gave before the day-long gate existed.
  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="k3s-worker-1",mountpoint="/",fstype="ext4",device="/dev/sda2",instance="10.20.0.12:9100",job="node"}'
        values: '135000000000x288 135000000000-416666666x200'
    alert_rule_test:
      - eval_time: 31h
        alertname: FilesystemWillFillWithin3Days
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              mountpoint: /
              fstype: ext4
              device: /dev/sda2
              instance: 10.20.0.12:9100
              job: node
            exp_annotations:
              summary: "/ on k3s-worker-1 is on course to fill within 3 days"
              description: "A RUNAWAY WRITER, NOT A DRIFT -- the last six hours' slope and the last day's both empty this filesystem within three days (or the six hours' alone within one), so it is not the deploy-day image pulls the nightly container-image collection takes back. `du -xh --max-depth=3 / | sort -h | tail -20` names it. On k3s-worker-1 look first at /var/lib/kinowo/share-cards (the workers' share cards: check `kinowo_worker_share_cards_bytes` against its budget and whether PruneShareCards is running), then /var/lib/rancher (images -- is `ContainerImageGarbageCollectionStale` firing? -- and pod logs)."

  # THE LEVEL, ON THE DISK THAT HOLDS THE SHARE CARDS. 14% free on k3s-worker-1's root -- under the
  # 15% the share-card plan asked for -- is already past `FilesystemSpaceLow`'s 20%, so the existing
  # rule is that alert and no second level rule was added. Pinned here for this mount so a later
  # re-tune of the threshold cannot drop below it unnoticed.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{host="k3s-worker-1",mountpoint="/",fstype="ext4",device="/dev/sda2",instance="10.20.0.12:9100",job="node"}'
        values: '21000000000x60'
      - series: 'node_filesystem_size_bytes{host="k3s-worker-1",mountpoint="/",fstype="ext4",device="/dev/sda2",instance="10.20.0.12:9100",job="node"}'
        values: '150000000000x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: FilesystemSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              mountpoint: /
              fstype: ext4
              device: /dev/sda2
              instance: 10.20.0.12:9100
              job: node
            exp_annotations:
              summary: "Less than 20% of / (k3s-worker-1) is free"
              description: "Note WHICH mountpoint. On `/` the usual cause is the nix store or an unrotated log. On /var/lib/mongodb it is the data itself, which grows monotonically and cannot be collected -- that one is a capacity decision (grow the volume) rather than a cleanup, and it wants planning before the critical alert rather than after. On /var/lib/mongodb-backups, check whether rotation is still working: the dump keeps the most recent N by count, so a growing directory means dumps are landing and none are being pruned. `du -xh --max-depth=2 <mount> | sort -h | tail -20` names the consumer."
