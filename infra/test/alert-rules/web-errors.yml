# UNIT TESTS FOR THE WEB SERVING ALERTS.
#
# The rule file's whole argument is that a 4xx here is not evidence of anything and a 5xx is, so the
# load-bearing test is the THIRD one: it replays 2026-09-04, when the error-share panel sat at ~25%
# for an afternoon on nothing but 401s from the poster beacon, and asserts that NOTHING fires. A
# rule that pages for that is worse than no rule -- it teaches you to ignore the channel.
rule_files:
  - ../../nix/files/monitoring/rules/web-errors.rules

evaluation_interval: 1m

tests:
  # A TIER ACTUALLY FAILING: ~9% of responses are 5xx, at 0.2/s, which is the shape of a pod that
  # boots and then cannot read.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/:city/",method="GET",status="5xx"}'
        values: '0+12x60'
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/:city/",method="GET",status="2xx"}'
        values: '0+120x60'
    alert_rule_test:
      # `for: 10m` — a rolling deploy's own 5xx window is shorter than this.
      - eval_time: 5m
        alertname: WebServerErrorsServed
        exp_alerts: []
      - eval_time: 25m
        alertname: WebServerErrorsServed
        exp_alerts:
          - exp_labels:
              severity: critical
              country: pl
            exp_annotations:
              summary: "pl web is serving 9.091% 5xx"
              description: "The web tier is the only part users see, so this is a user-visible outage rather than a degradation. Check the pod first -- `kubectl -n kinowo logs deploy/web-pl` -- and then whether it is failing to read: a 5xx on the read path is usually Mongo (mongodb.rules) or a heap that no longer leaves room to collect (jvm-heap.rules), and both have their own rules that should be read alongside this one."

  # THE ABSOLUTE FLOOR. Same 33% share, but the tier is serving 1.5 requests a minute and exactly
  # one of them failed. A share-only rule pages here; this one must not, because at this volume the
  # share is noise and the next request will move it 30 points either way.
  - interval: 2m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="es",job="kinowo-web",route="/es/:city/",method="GET",status="5xx"}'
        values: '0+1x60'
      - series: 'kinowo_web_http_requests_total{country="es",job="kinowo-web",route="/es/:city/",method="GET",status="2xx"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 1h
        alertname: WebServerErrorsServed
        exp_alerts: []

  # 2026-09-04, REPLAYED. A quarter of every response is a 4xx and it is entirely the poster beacon
  # being 401ed on a site that is serving perfectly. Nothing here may fire.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="us",job="kinowo-web",route="/us/uptime/img-event",method="POST",status="4xx"}'
        values: '0+30x120'
      - series: 'kinowo_web_http_requests_total{country="us",job="kinowo-web",route="/us/:city/movies",method="GET",status="2xx"}'
        values: '0+72x120'
      - series: 'kinowo_web_http_requests_total{country="us",job="kinowo-web",route="/us/:city/movie/:slug",method="GET",status="2xx"}'
        values: '0+14x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: WebServerErrorsServed
        exp_alerts: []
      - eval_time: 1h
        alertname: WebAssetsNotFound
        exp_alerts: []
      - eval_time: 1h
        alertname: WebHttpMetricsAbsent
        exp_alerts: []

  # THE BROKEN DEPLOY: the HTML references an asset fingerprint the pod will not serve, so every
  # visitor gets an unstyled page and no request "fails" in a way any other rule can see.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/uk/assets/:file",method="GET",status="4xx"}'
        values: '0+3x60'
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/uk/assets/:file",method="GET",status="2xx"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: WebAssetsNotFound
        exp_alerts: []
      - eval_time: 30m
        alertname: WebAssetsNotFound
        exp_alerts:
          - exp_labels:
              severity: warning
              country: uk
            exp_annotations:
              summary: "uk web is 404ing its own assets"
              description: "Visitors are being served HTML that references an asset the tier will not serve, which renders as an unstyled or inert page rather than as an error. The usual cause is a fingerprint the deploy changed on one side only -- compare the asset URLs in the rendered HTML against what the pod has."

  # The ordinary trickle of asset 404s -- a stale bookmark, a crawler holding an old URL -- stays
  # under the threshold. Measured at <0.001/s across all five countries over 2026-08-30..09-04.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/assets/:file",method="GET",status="4xx"}'
        values: '0+0.03x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: WebAssetsNotFound
        exp_alerts: []

  # THE TRIPWIRE. With the series gone the two rules above are comparisons against nothing, so they
  # are silent -- and silence is what a healthy site looks like too.
  - interval: 1m
    input_series:
      - series: 'up{job="kinowo-web",instance="kinowo-web-pl"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: WebHttpMetricsAbsent
        exp_alerts: []
      - eval_time: 35m
        alertname: WebHttpMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The web tier's request metric has stopped arriving"
              description: "`WebServerErrorsServed` and `WebAssetsNotFound` are both silent while this is firing, and their silence means nothing. Either every web pod is gone (k3s.rules, monitoring-self.rules) or `WebHttpMetrics` stopped registering -- check `/metrics` on a web pod for the `kinowo_web_http_requests_total` family before assuming the scrape."

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # USER-STATE WRITES FAILING WHILE THE TIER IS FINE -- the 2026-09 lost-writes shape. A signed-in
  # visitor's hides answer 503 (the store could not write) one in two, a few an hour, while the
  # tier serves 50 requests a second of healthy pages. `WebServerErrorsServed` is a TIER-WIDE share
  # and cannot see this: /api/me is under 0.01% of traffic, so every write could fail and the share
  # would not move. `UserStateWritesFailing` asks per route: at least three 5xx in 30 minutes and
  # over 10% of that route's responses. Anonymous 401s from GET /api/me -- by far its commonest
  # answer -- are 4xx and never count.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  - interval: 5m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/:city/",method="GET",status="2xx"}'
        values: '0+15000x16'
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/api/me/:country/hidden-films/:title",method="PUT",status="5xx"}'
        values: '0+1x16'
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/api/me/:country/hidden-films/:title",method="PUT",status="2xx"}'
        values: '0+1x16'
      - series: 'kinowo_web_http_requests_total{country="pl",job="kinowo-web",route="/api/me",method="GET",status="4xx"}'
        values: '0+40x16'
    alert_rule_test:
      - eval_time: 10m
        alertname: UserStateWritesFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: WebServerErrorsServed
        exp_alerts: []
      - eval_time: 40m
        alertname: UserStateWritesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              country: pl
              route: /api/me/:country/hidden-films/:title
            exp_annotations:
              summary: "pl /api/me/:country/hidden-films/:title is answering 5xx to 50% of requests"
              description: >-
                Signed-in visitors' writes to their own state are failing -- a hide that does not
                stick, a language pick that reverts -- while the rest of the tier is fine, which is
                why `WebServerErrorsServed` (a tier-wide share) cannot see it. A 503 here is the
                store refusing the write: `sum by (endpoint, outcome)
                (increase(kinowo_web_user_state_writes_total[1h]))` says whether it is
                `store_failure` (Mongo threw -- the web log has `UserStateRepository.… failed`) or
                `unavailable` (the pod has no users store at all).

  # READS ARE NOT WRITES. GET /api/me/:country/hidden-films answering 5xx to half its requests is
  # a page that cannot show the hides, not a write that failed to stick, which is all this rule
  # claims. Silent.
  - interval: 1m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/api/me/:country/hidden-films",method="GET",status="5xx"}'
        values: '0+1x40'
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/api/me/:country/hidden-films",method="GET",status="2xx"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: UserStateWritesFailing
        exp_alerts: []

  # ONE 5xx IS NOT A PATTERN: a single 503 on a route that saw four requests in half an hour is a
  # 25% share and must stay silent, because it is below the three-error floor.
  - interval: 5m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="de",job="kinowo-web",route="/api/me/state",method="PUT",status="5xx"}'
        values: '0 1+0x15'
      - series: 'kinowo_web_http_requests_total{country="de",job="kinowo-web",route="/api/me/state",method="PUT",status="2xx"}'
        values: '0 1 1 2 2 3+0x11'
    alert_rule_test:
      - eval_time: 40m
        alertname: UserStateWritesFailing
        exp_alerts: []

  # THE SHOWTIMES COUNTRIES ARE MOUNTED, AND THE ROUTE LABEL SAYS SO. Play's `HandlerDef.path` carries
  # the deployment's prefix, so /uk's hide route is `/uk/api/me/...`, never `/api/me/...` -- the same
  # reason `WebAssetsNotFound` matches `.*/assets/:file`. A regex anchored at `/api/me` saw Poland only.
  - interval: 5m
    input_series:
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/uk/api/me/:country/hidden-films/:title",method="PUT",status="5xx"}'
        values: '0+1x16'
      - series: 'kinowo_web_http_requests_total{country="uk",job="kinowo-web",route="/uk/api/me/:country/hidden-films/:title",method="PUT",status="2xx"}'
        values: '0+1x16'
    alert_rule_test:
      - eval_time: 40m
        alertname: UserStateWritesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              country: uk
              route: /uk/api/me/:country/hidden-films/:title
            exp_annotations:
              summary: "uk /uk/api/me/:country/hidden-films/:title is answering 5xx to 50% of requests"
              description: >-
                Signed-in visitors' writes to their own state are failing -- a hide that does not
                stick, a language pick that reverts -- while the rest of the tier is fine, which is
                why `WebServerErrorsServed` (a tier-wide share) cannot see it. A 503 here is the
                store refusing the write: `sum by (endpoint, outcome)
                (increase(kinowo_web_user_state_writes_total[1h]))` says whether it is
                `store_failure` (Mongo threw -- the web log has `UserStateRepository.… failed`) or
                `unavailable` (the pod has no users store at all).

  # A FAILED UNIQUE-INDEX BUILD PAGES AS A WARNING, and only while some pod still reports it: one
  # country's gauge at 0 for longer than `for:` fires for that country alone.
  - interval: 5m
    input_series:
      - series: 'kinowo_web_user_state_userid_index_unique{country="uk",job="kinowo-web",instance="a"}'
        values: '0x6'
      - series: 'kinowo_web_user_state_userid_index_unique{country="pl",job="kinowo-web",instance="b"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: UserStateUniqueIndexMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: UserStateUniqueIndexMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              country: uk
            exp_annotations:
              summary: "uk userStates has no unique userId index"
              description: >-
                A web pod could not build the unique `userId` index on `userStates` (the web log has the
                ERROR `userStates has NO unique userId index` with the reason -- usually duplicate rows
                for one userId). Writes keyed on userId may land on either duplicate, and reads may
                disagree with them. Dedupe the rows -- and if the reason is IndexKeySpecsConflict, drop the
                non-unique `userId_1` by hand (pods no longer rebuild it) -- then restart a web pod to build it.
