# UNIT TESTS FOR THE AGREEMENT STAGE ALERTS.
#
# IdentityAgreementBackfillStalled fires for DE's 510 incomplete clusters held six hours across a worker restart, and
# stays quiet for ES's backlog that drained. The cost regressions fire for DE's periodic agreement phase going from 30 s
# and 1.5 GB a projection to 85 s and 6 GB, and stay quiet for the same move in the hour after a worker start.
# IdentityStagingEventsDropped fires for PL dropping three events and stays quiet for UK, seeded at 0.
# IdentityInputGateStuck fires for DE's oldest held listing passing an hour and for UK holding 1,500, both across a
# worker restart, and stays quiet for PL, whose held listings are taken in within minutes, a restart's NaN seed included.
rule_files:
  - ../../nix/files/monitoring/rules/identity-agreement.rules

evaluation_interval: 1m

tests:
  # DE's oldest held listing ages a minute a minute from 50 min; UK holds 1,500 for 40 min; each worker restarts once
  # (the `stale` gap) and its wait goes on. PL holds a few, briefly.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_model_held_oldest_seconds{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '3000+60x25 stale _x2 4740+60x11'
      - series: 'kinowo_worker_identity_model_held_listings{job="kinowo-worker",instance="kinowo-worker-uk",country="uk"}'
        values: '1500x10 stale _x2 1500x26'
      - series: 'kinowo_worker_identity_model_held_oldest_seconds{job="kinowo-worker",instance="kinowo-worker-uk",country="uk"}'
        values: '120x40'
      - series: 'kinowo_worker_identity_model_held_listings{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '4x40'
      - series: 'kinowo_worker_identity_model_held_oldest_seconds{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '90x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: IdentityInputGateStuck
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk }
            exp_annotations:
              summary: "uk: the identity model's input gate holds listings too long or too many (1500)"
              description: "Listings whose newest version waits on its own questions are held over an hour, or over a thousand are held. Their questions are AskQuestion tasks claimed at 0 and venue-page reads; the worker diagnostics dashboard's \"Identity input gate\" panel draws the held count, the oldest wait and the promotions. The one switch: IdentityModelService.NewWhilePending."
      - eval_time: 30m
        alertname: IdentityInputGateStuck
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: uk }
            exp_annotations:
              summary: "uk: the identity model's input gate holds listings too long or too many (1500)"
              description: "Listings whose newest version waits on its own questions are held over an hour, or over a thousand are held. Their questions are AskQuestion tasks claimed at 0 and venue-page reads; the worker diagnostics dashboard's \"Identity input gate\" panel draws the held count, the oldest wait and the promotions. The one switch: IdentityModelService.NewWhilePending."
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: the identity model's input gate holds listings too long or too many (4800)"
              description: "Listings whose newest version waits on its own questions are held over an hour, or over a thousand are held. Their questions are AskQuestion tasks claimed at 0 and venue-page reads; the worker diagnostics dashboard's \"Identity input gate\" panel draws the held count, the oldest wait and the promotions. The one switch: IdentityModelService.NewWhilePending."
  # PL holds a few for seconds to minutes; its worker restarts at minute 15 and seeds both gauges NaN until the gate
  # measures them; a scrape's burst of 800 is taken in within ten minutes.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_model_held_listings{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '4x15 stale _x2 NaN 800x10 4x10'
      - series: 'kinowo_worker_identity_model_held_oldest_seconds{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '90x15 stale _x2 NaN 300x10 90x10'
    alert_rule_test:
      - eval_time: 25m
        alertname: IdentityInputGateStuck
        exp_alerts: []
      - eval_time: 40m
        alertname: IdentityInputGateStuck
        exp_alerts: []
  # DE never drains its backlog, the worker restarting at minute 120; ES drains its in under two hours.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_agreement_clusters{job="kinowo-worker",instance="kinowo-worker-de",country="de",state="incomplete"}'
        values: '510x120 stale _x2 510x300'
      - series: 'kinowo_worker_identity_agreement_clusters{job="kinowo-worker",instance="kinowo-worker-es",country="es",state="incomplete"}'
        values: '50x100 0x322'
    alert_rule_test:
      - eval_time: 5h
        alertname: IdentityAgreementBackfillStalled
        exp_alerts: []
      - eval_time: 6h30m
        alertname: IdentityAgreementBackfillStalled
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: 510 agreement clusters have stayed incomplete for 6 hours"
              description: "The agreement stage has had clusters with unread verdicts for six hours without draining them. Its per-projection progress is in VictoriaLogs `country:<cc> \"agreement\"`; the worker diagnostics dashboard draws the clusters by state."

  # A projection every 10 minutes: a day at 30 s / 1.5 GB (the (20,40] and (1e9,2e9] buckets), then 4 hours at
  # 85 s / 6 GB ((60,90] and (4e9,8e9]). The worker has run since epoch 0.
  - interval: 10m
    input_series:
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="20"}'
        values: '0x168'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="40"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="60"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="90"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="+Inf"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="1e+09"}'
        values: '0x168'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="2e+09"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="4e+09"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="8e+09"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="+Inf"}'
        values: '0+1x144 145+1x23'
      - series: 'process_start_time_seconds{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '0x168'
    alert_rule_test:
      - eval_time: 23h
        alertname: IdentityAgreementCostRegression
        exp_alerts: []
      - eval_time: 25h30m
        alertname: IdentityAgreementCostRegression
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de, mode: periodic }
            exp_annotations:
              summary: "de: the periodic agreement phase's hourly median is 1m 15s, over twice its week"
              description: "The identity projection's agreement phase has doubled its weekly median. Find the build and the projections: VictoriaLogs `country:<cc> \"identity projection:\"`, whose phase list names each phase's seconds and MB; the worker diagnostics dashboard draws the hour against the week."
      - eval_time: 23h
        alertname: IdentityAgreementAllocationRegression
        exp_alerts: []
      - eval_time: 25h30m
        alertname: IdentityAgreementAllocationRegression
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de, mode: periodic }
            exp_annotations:
              summary: "de: the periodic agreement phase's hourly median allocation is 6GB, over twice its week"
              description: "The identity projection's agreement phase allocates twice its weekly median. VictoriaLogs `country:<cc> \"identity projection:\"` names each projection's phases with their MB; compare the build before and after."

  # The same move, but the worker restarted at 24h50m (a deploy): its first hour is not judged.
  - interval: 10m
    input_series:
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="40"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="90"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_seconds_bucket{job="kinowo-worker",country="de",mode="periodic",le="+Inf"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="2e+09"}'
        values: '0+1x144 144x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="8e+09"}'
        values: '0+1x144 145+1x23'
      - series: 'kinowo_worker_identity_agreement_phase_allocated_bytes_bucket{job="kinowo-worker",country="de",mode="periodic",le="+Inf"}'
        values: '0+1x144 145+1x23'
      - series: 'process_start_time_seconds{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '0x148 89400x19'
    alert_rule_test:
      - eval_time: 25h30m
        alertname: IdentityAgreementCostRegression
        exp_alerts: []
      - eval_time: 25h30m
        alertname: IdentityAgreementAllocationRegression
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_staging_dropped_total{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '0x10 3x30'
      - series: 'kinowo_worker_identity_staging_dropped_total{job="kinowo-worker",instance="kinowo-worker-uk",country="uk"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: IdentityStagingEventsDropped
        exp_alerts: []
      - eval_time: 15m
        alertname: IdentityStagingEventsDropped
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: pl }
            exp_annotations:
              summary: "pl: the identity staging publisher dropped events"
              description: "Identity staging events (take changes, waits) were let go before a publish wrote them -- the feed let them go, or publishes kept failing -- so the staging screen misses them. VictoriaLogs `country:<cc> \"identity staging\"` has the WARN line per drop and the failed publishes before it."

  # DE keeps 40,000 departed listings against 32,500 billed for over an hour, its worker restarting once (the `stale`
  # gap, then the NaN seed): fires, the hold bridging the restart. UK keeps 7,000 of 33,000: quiet. PL only ever NaN:
  # quiet.
  - interval: 1m
    input_series:
      - series: 'kinowo_worker_identity_model_kept_listings{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '40000x30 stale _x2 NaN 40000x46'
      - series: 'kinowo_worker_identity_model_present_listings{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '32500x30 stale _x2 NaN 32500x46'
      - series: 'kinowo_worker_identity_model_kept_listings{job="kinowo-worker",instance="kinowo-worker-uk",country="uk"}'
        values: '7000x80'
      - series: 'kinowo_worker_identity_model_present_listings{job="kinowo-worker",instance="kinowo-worker-uk",country="uk"}'
        values: '33000x80'
      - series: 'kinowo_worker_identity_model_kept_listings{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: 'NaN _x79'
      - series: 'kinowo_worker_identity_model_present_listings{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: 'NaN _x79'
    alert_rule_test:
      - eval_time: 50m
        alertname: IdentityKeptListingsHigh
        exp_alerts: []
      - eval_time: 70m
        alertname: IdentityKeptListingsHigh
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: the identity model keeps 40000 departed listings, more than it bills"
              description: "The departed listings kept as identity inputs (ListingRetention, identity_retained) outnumber the billed ones, so every family's resolve reads at least twice its population. The window is ListingRetention's grace (docs/design/identity-listing-retention.md); the worker diagnostics dashboard draws kept, departed and billed listings beside the projection's seconds."

  # DE's projections took 40 s for a week, then 60 s (1.5x) for ten hours: fires once the 6h mean is over 1.25x and held
  # an hour, across one missed scrape (the `stale` hour, no restart: the start time is unchanged). PL's 40 -> 45 s
  # (1.125x): quiet. Each worker has run for weeks.
  - interval: 1h
    input_series:
      - series: 'kinowo_worker_identity_projection_seconds{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '40x168 60x4 stale 60x6'
      - series: 'kinowo_worker_identity_projection_seconds{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '40x168 45x12'
      - series: 'process_start_time_seconds{job="kinowo-worker",instance="kinowo-worker-de",country="de"}'
        values: '0x172 stale 0x6'
      - series: 'process_start_time_seconds{job="kinowo-worker",instance="kinowo-worker-pl",country="pl"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 168h
        alertname: IdentityProjectionSlower
        exp_alerts: []
      - eval_time: 176h
        alertname: IdentityProjectionSlower
        exp_alerts:
          - exp_labels: { domain: identity, severity: warning, country: de }
            exp_annotations:
              summary: "de: identity projections average 1m 0s over 6h, a quarter slower than a week ago"
              description: "The identity projection's mean wall clock over the last six hours is over 1.25x the same window a week ago. Compare kinowo_worker_identity_model_kept_listings with the billed listings (a longer retention window costs resolve time), then the builds deployed between: VictoriaLogs `country:<cc> \"identity projection:\"`."
