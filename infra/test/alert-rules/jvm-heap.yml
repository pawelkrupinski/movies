# UNIT TESTS FOR THE JVM HEAP ALERT.
#
# `promtool check rules` proves the file parses. What it cannot say is whether the expression means
# what the prose above it claims, and this rule has three ways to be quietly wrong:
#
#   1. It could fire on a HEALTHY pod. Peak heap ~= -Xmx is normal on every JVM here (93-99%), so
#      an alert written against the instantaneous value would page constantly. The `min_over_time`
#      floor is what separates "collecting hard" from "nothing left to collect into".
#   2. It could cover only HALF THE FLEET. web runs G1 (`G1 Old Gen`), the workers run SerialGC
#      (`Tenured Gen`). A rule naming one pool sits in the list looking like coverage while the
#      other tier can die unwatched — the failure k3s.rules warns about at length.
#   3. It could page on a ROUTINE RESTART, which is how an alert gets ignored.
#
# The series below are shaped like the real ones: `jvm_memory_pool_used_bytes` /
# `jvm_memory_pool_max_bytes`, labelled by instance, job, country and pool.
rule_files:
  - ../../nix/files/monitoring/rules/jvm-heap.rules

evaluation_interval: 1m

tests:
  # web-us on the day it died: a 768 MiB cap with the tenured floor parked around 690 MiB (90%).
  - interval: 1m
    input_series:
      - series: 'jvm_memory_pool_used_bytes{instance="web-us:9000",job="kinowo-web",country="us",pool="G1 Old Gen"}'
        values: '690000000+0x200'
      - series: 'jvm_memory_pool_max_bytes{instance="web-us:9000",job="kinowo-web",country="us",pool="G1 Old Gen"}'
        values: '805306368+0x200'
    alert_rule_test:
      # Not yet — `for: 2h` is deliberately longer than any deploy gap, so a pod that restarts
      # every couple of hours never pages on its own.
      - eval_time: 1h
        alertname: JvmOldGenNearCap
        exp_alerts: []
      - eval_time: 2h5m
        alertname: JvmOldGenNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: web-us:9000
              job: kinowo-web
              country: us
              pool: G1 Old Gen
            exp_annotations:
              summary: "kinowo-web us old gen is 85.68% of its cap"
              description: "The tenured floor has sat above 85% of this JVM's heap cap for two hours, so what is left is not enough to collect into and the next large allocation is the one that fails. This is the shape that OOM-killed web-us on 2026-09-03. FIRST CHECK THAT THE HEAP IS THE SIZE THE REPOSITORY THINKS IT IS -- Flux reconciles the ConfigMap now and Reloader rolls the pod on a real change, so a disagreement here means Flux is FAILING rather than merely waiting -- see flux.rules. Compare `kubectl -n kinowo get cm <tier>-env-<country> -o jsonpath='{.data.JAVA_OPTS}'` against the overlay. If they already agree, something RETAINS more than this heap holds -- which is NOT always the corpus, so measure before resizing. On a worker (SerialGC) first confirm `increase(jvm_gc_collection_seconds_count{gc=\"MarkSweepCompact\"}[30m])` actually moved: with no full GC under it the floor is uncollected garbage, not the live set. worker-pl paged here on 2026-09-05 carrying the fleet's SMALLEST corpus, because a cache bounded by entry count held 228 MiB of HTML; the fix was the cache, not the heap."

  # A HEALTHY pod must stay silent. Same cap, floor at ~62% — the shape web-de reads today.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_pool_used_bytes{instance="web-de:9000",job="kinowo-web",country="de",pool="G1 Old Gen"}'
        values: '500000000+0x200'
      - series: 'jvm_memory_pool_max_bytes{instance="web-de:9000",job="kinowo-web",country="de",pool="G1 Old Gen"}'
        values: '805306368+0x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: JvmOldGenNearCap
        exp_alerts: []

  # THE SAWTOOTH, which is the whole reason the expression uses a floor. Occupancy swings between
  # 55% and 99% of the cap every few minutes — an instantaneous rule would fire on this healthy
  # pod, and the floor correctly does not.
  - interval: 5m
    input_series:
      - series: 'jvm_memory_pool_used_bytes{instance="web-pl:9000",job="kinowo-web",country="pl",pool="G1 Old Gen"}'
        values: '450000000 790000000 460000000 795000000 455000000 792000000'
      - series: 'jvm_memory_pool_max_bytes{instance="web-pl:9000",job="kinowo-web",country="pl",pool="G1 Old Gen"}'
        values: '805306368+0x10'
    alert_rule_test:
      - eval_time: 50m
        alertname: JvmOldGenNearCap
        exp_alerts: []

  # THE WORKERS ARE COVERED TOO — SerialGC names its tenured pool differently, and a rule that
  # matched only `G1 Old Gen` would watch nothing here. worker-us at 92% of 1280m.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_pool_used_bytes{instance="worker-us:9000",job="kinowo-worker",country="us",pool="Tenured Gen"}'
        values: '1234000000+0x200'
      - series: 'jvm_memory_pool_max_bytes{instance="worker-us:9000",job="kinowo-worker",country="us",pool="Tenured Gen"}'
        values: '1342177280+0x200'
    alert_rule_test:
      - eval_time: 2h5m
        alertname: JvmOldGenNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: worker-us:9000
              job: kinowo-worker
              country: us
              pool: Tenured Gen
            exp_annotations:
              summary: "kinowo-worker us old gen is 91.94% of its cap"
              description: "The tenured floor has sat above 85% of this JVM's heap cap for two hours, so what is left is not enough to collect into and the next large allocation is the one that fails. This is the shape that OOM-killed web-us on 2026-09-03. FIRST CHECK THAT THE HEAP IS THE SIZE THE REPOSITORY THINKS IT IS -- Flux reconciles the ConfigMap now and Reloader rolls the pod on a real change, so a disagreement here means Flux is FAILING rather than merely waiting -- see flux.rules. Compare `kubectl -n kinowo get cm <tier>-env-<country> -o jsonpath='{.data.JAVA_OPTS}'` against the overlay. If they already agree, something RETAINS more than this heap holds -- which is NOT always the corpus, so measure before resizing. On a worker (SerialGC) first confirm `increase(jvm_gc_collection_seconds_count{gc=\"MarkSweepCompact\"}[30m])` actually moved: with no full GC under it the floor is uncollected garbage, not the live set. worker-pl paged here on 2026-09-05 carrying the fleet's SMALLEST corpus, because a cache bounded by entry count held 228 MiB of HTML; the fix was the cache, not the heap."

  # ─── JvmResidentNearContainerLimit ─────────────────────────────────────────────────────────────
  #
  # A CLIMB PAGES, A PLATEAU DOES NOT. Both inputs are web-pl's REAL RSS, one sample a minute, from
  # Prometheus; the limit is its 1 GiB, labelled the way kube-state-metrics labels it (the tier is
  # the container name, the country only exists inside the pod name).
  #
  # 2026-09-21 17:40-18:24Z: a restart at 17:55, then 0.61 -> 0.89 of the limit in half an hour and
  # an OOM kill at 18:25. The alert must be firing before the end of this series.
  - interval: 1m
    input_series:
      - series: 'process_resident_memory_bytes{instance="kinowo-web-pl",job="kinowo-web",app="kinowo",tier="web",country="pl"}'
        values: '781160448 823533568 823705600 825094144 826163200 834990080 837300224 837443584 838352896 839176192 842727424 849784832 849227776 849264640 849420288 650813440 668217344 692711424 699633664 731328512 739565568 740249600 740843520 757387264 812490752 814231552 814292992 814497792 819363840 873160704 888262656 887955456 888061952 888115200 897404928 930738176 929943552 930058240 930209792 934109184 938385408 939966464 956153856 956174336'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="web-pl-5c55479c9c-xxn56",container="web",resource="memory",unit="byte"}'
        values: '1073741824+0x44'
    alert_rule_test:
      # 0.76-0.78 of the limit and rising, but not steeply enough to reach it in 30 minutes yet.
      - eval_time: 35m
        alertname: JvmResidentNearContainerLimit
        exp_alerts: []
      - eval_time: 43m
        alertname: JvmResidentNearContainerLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              tier: web
              country: pl
            exp_annotations:
              summary: "web-pl RSS is 89.05% of its container memory limit and climbing toward it"
              description: "The process's resident memory is climbing toward the cgroup limit fast enough to reach it within half an hour, and the kernel -- not the JVM -- decides what happens then: an OOM kill with no heap dump and no log line. Find WHICH memory grew before resizing anything. Heap, non-heap pools and direct buffers are `jvm_memory_committed_bytes` and `jvm_buffer_pool_used_bytes{pool=\"direct\"}`; RSS minus their sum is memory NO JVM POOL SEES (native allocations: image decoding, fonts, glibc arenas). On web that used to be the og-image share cards under a crawler sweep; the worker renders them since 2026-09-24, and its poster shrinks run in a vips subprocess that counts against the same cgroup -- check `kinowo_worker_share_cards_render_total` for a render burst. Raising the limit only buys time if the growth is unbounded."

  # 2026-09-20 00:50-02:20Z: one step from 0.79 to 0.86 of the limit, then a plateau that held for
  # ten hours with no kill (the old static 0.82 line paged for all ten). Flat is not a threat.
  - interval: 1m
    input_series:
      - series: 'process_resident_memory_bytes{instance="kinowo-web-pl",job="kinowo-web",app="kinowo",tier="web",country="pl"}'
        values: '847925248 847855616 847855616 847855616 847855616 847855616 847855616 847855616 847859712 847859712 847929344 847929344 847929344 847859712 847859712 847933440 847933440 847933440 847941632 847872000 847941632 848007168 847941632 847872000 847872000 847876096 847953920 847884288 847884288 847896576 924250112 924254208 924254208 924254208 924184576 924270592 924336128 924270592 924205056 924205056 924340224 924393472 924323840 924323840 924323840 924323840 924323840 924323840 924381184 924381184 924381184 924385280 924385280 924454912 924434432 924663808 924729344 924680192 924684288 924684288 924753920 924766208 924696576 924696576 924696576 924766208 924766208 924798976 927166464 927096832 927100928 927170560 927166464 927113216 927645696 927154176 927223808 927154176 927223808 927158272 927158272 927158272 927162368 927162368 927162368 927453184 927252480 927252480 927256576 927195136 927260672'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="web-pl-5c55479c9c-xxn56",container="web",resource="memory",unit="byte"}'
        values: '1073741824+0x90'
    alert_rule_test:
      - eval_time: 35m
        alertname: JvmResidentNearContainerLimit
        exp_alerts: []
      - eval_time: 60m
        alertname: JvmResidentNearContainerLimit
        exp_alerts: []
      - eval_time: 90m
        alertname: JvmResidentNearContainerLimit
        exp_alerts: []

  # A STEEP CLIMB FROM LOW DOWN is a boot filling its caches, not a pod about to die: web-us rising
  # 0.30 -> 0.70 of 2 GiB in 20 minutes would "reach" the limit on a straight line, and the 0.75
  # floor keeps it quiet. A rolling deploy's second pod is present too -- two limit series for one
  # country must not break the join.
  - interval: 1m
    input_series:
      - series: 'process_resident_memory_bytes{instance="kinowo-web-us",job="kinowo-web",app="kinowo",tier="web",country="us"}'
        values: '644245094+42949673x20 1503238553+0x10'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="web-us-6d4b8c7f9d-abcde",container="web",resource="memory",unit="byte"}'
        values: '2147483648+0x30'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="web-us-7f8e9a0b1c-fghij",container="web",resource="memory",unit="byte"}'
        values: '2147483648+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: JvmResidentNearContainerLimit
        exp_alerts: []

  # THE WORKERS BY THE SAME RULE. worker-pl flat at its healthy 0.86 stays quiet; worker-uk climbing
  # 0.80 -> 0.95 of 1 GiB over 30 minutes fires.
  - interval: 1m
    input_series:
      - series: 'process_resident_memory_bytes{instance="kinowo-worker-pl",job="kinowo-worker",app="kinowo-worker",tier="worker",country="pl"}'
        values: '923000000+0x40'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="worker-pl-5b9c8d7e6f-klmno",container="worker",resource="memory",unit="byte"}'
        values: '1073741824+0x40'
      - series: 'process_resident_memory_bytes{instance="kinowo-worker-uk",job="kinowo-worker",app="kinowo-worker",tier="worker",country="uk"}'
        values: '858993459+5368709x30 1020054733+0x10'
      - series: 'kube_pod_container_resource_limits{job="kube-state-metrics",namespace="kinowo",pod="worker-uk-5fd6cb68bb-lmchv",container="worker",resource="memory",unit="byte"}'
        values: '1073741824+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: JvmResidentNearContainerLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              tier: worker
              country: uk
            exp_annotations:
              summary: "worker-uk RSS is 95% of its container memory limit and climbing toward it"
              description: "The process's resident memory is climbing toward the cgroup limit fast enough to reach it within half an hour, and the kernel -- not the JVM -- decides what happens then: an OOM kill with no heap dump and no log line. Find WHICH memory grew before resizing anything. Heap, non-heap pools and direct buffers are `jvm_memory_committed_bytes` and `jvm_buffer_pool_used_bytes{pool=\"direct\"}`; RSS minus their sum is memory NO JVM POOL SEES (native allocations: image decoding, fonts, glibc arenas). On web that used to be the og-image share cards under a crawler sweep; the worker renders them since 2026-09-24, and its poster shrinks run in a vips subprocess that counts against the same cgroup -- check `kinowo_worker_share_cards_render_total` for a render burst. Raising the limit only buys time if the growth is unbounded."

  # HeapDumpWritten -- web-pl's directory is empty (0) until a dump lands 1h in; worker-us holds an
  # old dump the whole time and the timer keeps republishing it. Only the MOVE may fire, only for
  # the directory that moved, and it must resolve once the value has been flat for 30m.
  - interval: 15m
    input_series:
      - series: 'kinowo_heapdumps_newest_timestamp_seconds{host="k3s-worker-1",dir="web-pl"}'
        values: '0 0 0 0 1790000000 1790000000 1790000000 1790000000 1790000000'
      - series: 'kinowo_heapdumps_newest_timestamp_seconds{host="k3s-worker-1",dir="worker-us"}'
        values: '1756900000+0x8'
    alert_rule_test:
      - eval_time: 45m
        alertname: HeapDumpWritten
        exp_alerts: []
      - eval_time: 1h
        alertname: HeapDumpWritten
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              dir: web-pl
            exp_annotations:
              summary: "web-pl wrote a heap dump on k3s-worker-1"
              description: "A web-pl JVM wrote a heap dump -- a heap OOM (or the worker's liveness watchdog catching a wedged heap), which restarts the container quietly. The dump is in /var/lib/kinowo/heapdumps/web-pl/ on k3s-worker-1 and only the 3 newest per directory are kept, so COPY IT OFF FIRST: see docs/heap-dumps.md for scp and reading it. `kinowo_heapdumps_files` and `kinowo_heapdumps_bytes` say what is held."
      - eval_time: 1h15m
        alertname: HeapDumpWritten
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              dir: web-pl
            exp_annotations:
              summary: "web-pl wrote a heap dump on k3s-worker-1"
              description: "A web-pl JVM wrote a heap dump -- a heap OOM (or the worker's liveness watchdog catching a wedged heap), which restarts the container quietly. The dump is in /var/lib/kinowo/heapdumps/web-pl/ on k3s-worker-1 and only the 3 newest per directory are kept, so COPY IT OFF FIRST: see docs/heap-dumps.md for scp and reading it. `kinowo_heapdumps_files` and `kinowo_heapdumps_bytes` say what is held."
      # Flat for 30m: resolved. And the republished old worker-us dump never fired at all.
      - eval_time: 1h45m
        alertname: HeapDumpWritten
        exp_alerts: []

  # THE TIMER BEHIND HeapDumpWritten. That rule reads a textfile the node's kinowo-heap-dumps timer
  # writes, so a timer that stops -- or a node whose first, hand-applied switch never happened
  # (docs/heap-dumps.md) -- leaves it unable to fire and the budget unenforced, and nothing else
  # says so. The timer runs every 15 minutes: it publishes 0..45m, then stops.
  - interval: 15m
    input_series:
      - series: 'kinowo_heapdumps_prune_last_success_timestamp_seconds{host="k3s-worker-1",job="node",role="k3s-worker"}'
        values: '0 900 1800 2700 2700+0x16'
    alert_rule_test:
      # An hour after its last run: a few missed passes are not yet a stopped timer.
      - eval_time: 1h45m
        alertname: HeapDumpBudgetStale
        exp_alerts: []
      - eval_time: 3h
        alertname: HeapDumpBudgetStale
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              job: node
              role: k3s-worker
            exp_annotations:
              summary: "k3s-worker-1 has not pruned or reported its heap dumps for over 2 hours"
              description: "The kinowo-heap-dumps timer holds the node's heap dumps to their budget and publishes the `kinowo_heapdumps_*` series HeapDumpWritten reads, so while it is stopped a new dump neither alerts nor is bounded by anything but each container's own boot prune. `systemctl status kinowo-heap-dumps.service kinowo-heap-dumps.timer` and `journalctl -u kinowo-heap-dumps` on the node; the script is infra/nix/files/heap-dumps.sh."

  # ...and the node that never published it at all: the k3s worker fires, the k3s SERVER on
  # monitoring-1 (which runs k3s.service too, but hosts no kinowo pod) and mongo-1 never do.
  - interval: 1m
    input_series:
      - series: 'up{host="k3s-worker-1",instance="10.20.0.12:9100",job="node",role="k3s-worker"}'
        values: '1+0x150'
      - series: 'up{host="monitoring-1",instance="10.20.0.11:9100",job="node",role="monitoring"}'
        values: '1+0x150'
      - series: 'up{host="mongo-1",instance="10.20.0.13:9100",job="node",role="mongodb"}'
        values: '1+0x150'
    alert_rule_test:
      - eval_time: 45m
        alertname: HeapDumpBudgetMetricAbsent
        exp_alerts: []
      - eval_time: 1h15m
        alertname: HeapDumpBudgetMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              host: k3s-worker-1
              instance: 10.20.0.12:9100
              job: node
              role: k3s-worker
            exp_annotations:
              summary: "k3s-worker-1 has never reported its heap-dump budget"
              description: "HeapDumpBudgetStale and HeapDumpWritten are comparisons and cannot fire without the `kinowo_heapdumps_*` series, so a heap dump on this node would land unannounced. Either `fleet.heapDumps.enable` is off here or its units were never switched in -- auto-apply refuses the switch that first introduces them; docs/heap-dumps.md has the command. AN ABSENT SERIES IS NOT A NODE WITH NO DUMPS."

  - interval: 1m
    input_series:
      - series: 'up{host="k3s-worker-1",instance="10.20.0.12:9100",job="node",role="k3s-worker"}'
        values: '1+0x150'
      - series: 'kinowo_heapdumps_prune_last_success_timestamp_seconds{host="k3s-worker-1",instance="10.20.0.12:9100",job="node",role="k3s-worker"}'
        values: '0+60x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: HeapDumpBudgetMetricAbsent
        exp_alerts: []
      - eval_time: 2h
        alertname: HeapDumpBudgetStale
        exp_alerts: []
