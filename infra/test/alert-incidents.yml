# Real incidents (and real misfires) on the fleet, replayed by bin/backtest-alerts.
#
# Each entry is a UTC window from something that actually happened, with the alerts that MUST fire
# in it and the alerts that MUST stay quiet. It is the only regression test an alert has against the
# event it was written for: a rule rewritten later that no longer catches the incident -- or that
# newly misfires in a window known to be healthy -- fails here.
#
#   expect_firing  must fire at least once in [start, end + grace]   (grace defaults to 1h, to
#                  cover the `for:` hold of an alert whose condition began at `start`)
#   expect_quiet   must not fire at all in [start, end]
#
# Firing inside an `expect_firing` window is also excused from that alert's noise budget.
# Prometheus retention starts ~2026-08-29; an incident older than that cannot be replayed.
# Times are evidence, not guesses: each entry says where its window came from.

incidents:
  - id: mongo-1-relocation-blind-2026-09-01
    description: >-
      mongo-1 moved hosts (10.20.0.10 -> 10.20.0.13). From 23:00Z the old member reported state 6
      with no `set` label and the new one was not scraped until 04:45Z, so NO member visible to
      Prometheus was primary. MongodNoPrimary fires here BY DESIGN -- a monitor that cannot see a
      primary says so (see mongodb.rules) -- and must keep doing so.
    source: mongodb_mongod_replset_my_state{instance="10.20.0.10:9216"} == 6 from 23:00Z; first 10.20.0.13 sample 04:45Z
    start: 2026-09-01T23:00:00Z
    end: 2026-09-02T04:40:00Z
    grace: 10m
    expect_firing: [MongodNoPrimary]

  - id: mongod-no-primary-misfire-2026-09-02
    description: >-
      The new mongo-1 was primary and writing, and MongodNoPrimary kept paging: it was
      `max(state == 1) or vector(0)`, which returns a sample exactly when a member IS primary.
      Fixed by 14410c44f at 13:54Z.
    source: ALERTS{alertname="MongodNoPrimary"} firing to 14:00Z while mongodb_mongod_replset_my_state{instance="10.20.0.13:9216"} == 1; commit 14410c44f
    start: 2026-09-02T05:00:00Z
    end: 2026-09-02T14:00:00Z
    expect_quiet: [MongodNoPrimary, MongodNotPrimary, MongodNotRunning]

  - id: flux-imagepolicy-flapping-2026-09-01
    description: >-
      FluxReconciliationStopped fired 46%/43% of the time on the two ImagePolicy objects, which
      reconcile only when an image is built, on a deploy path that was healthy throughout. Fixed
      by 5dc4ea68e.
    source: commit 5dc4ea68e (seven-day duty cycle measured before the fix)
    start: 2026-09-01T00:00:00Z
    end: 2026-09-08T00:00:00Z
    expect_quiet: [FluxReconciliationStopped]

  - id: decodo-503-cascade-2026-09-10
    description: >-
      Decodo's residential tunnel answered 503 and PL fetches fell off the proxy.
    source: memory project_decodo_tunnel_503_cascade_2026_09_10; ALERTS ResidentialProxyFallingBackToZyte{country="pl"} 10:40..11:10Z (the rule's former name)
    start: 2026-09-10T07:40:00Z
    end: 2026-09-10T11:10:00Z
    expect_firing: [ResidentialProxyFailing]

  - id: kino-aurum-invisible-films-2026-09-09
    description: >-
      Films with upcoming screenings failed readyToProject and were pruned from the read model
      (Kino Aurum's frozen screenings among them); fixed by the 09-14 deploy, tail cleared 09-17.
    source: memory project_kino_aurum_screenings_freeze; replayed episodes 09-08T22:36Z..09-17T17:05Z
    start: 2026-09-08T22:00:00Z
    end: 2026-09-17T16:30:00Z
    expect_firing: [ReadModelFilmsInvisibleWithScreenings]

  - id: cineworld-relaunch-2026-09-18
    description: >-
      Cineworld relaunched its site; the UK chain client's detail enrichment failed almost every
      fetch and the chain fell back to the aggregator until the rebuilt client shipped.
    source: memory project_cineworld_relaunch_2026_09_17; kinowo_uptime_recent_failures{service="Cineworld Enrichment"} ratio > 0.9 09-18T21Z..09-21T16Z; replayed firing to 17:25Z
    start: 2026-09-18T21:00:00Z
    end: 2026-09-21T17:30:00Z
    expect_firing: [ChainEnrichmentFailing, ChainFallbackSaturated]

  - id: us-readmodel-writes-slow-until-2026-09-23
    description: >-
      Every venue change in the US rebuilt and re-diffed the film's whole screenings set, so the
      read-model write per call ran at 27-47 ms against 3-7 ms elsewhere, until the 09-23
      venue-scoping fix.
    source: sum(rate(kinowo_worker_readmodel_write_burst_seconds_sum[3h])) / count, country=us; ReadModelProjectionWritePerCallHigh's own description; replayed firing 09-08T16:33Z..09-23T22:23Z (the write-burst histogram begins 09-08)
    start: 2026-09-08T15:00:00Z
    end: 2026-09-23T23:00:00Z
    expect_firing: [ReadModelProjectionWritePerCallHigh]

  - id: web-pl-oom-2026-09-17
    description: >-
      web-pl's container was OOM-killed twice while rendering share cards (the poster shrink held
      whole decoded posters), later fixed by capping the shrink's memory.
    source: ALERTS K3sContainerOOMKilled{pod=~"web-pl.*"} 09-17T11:00Z and 14:50Z
    start: 2026-09-17T10:30:00Z
    end: 2026-09-17T15:00:00Z
    # ONE PAGE PER KILL, NAMING THE POD. Both kills were the container's own limit on a node with
    # memory to spare, so the host-level alert stays quiet (host-health.rules); it used to fire
    # beside K3sContainerOOMKilled for every one.
    expect_firing: [K3sContainerOOMKilled]
    expect_quiet: [HostOomKilled]

  - id: worker-us-oom-2026-09-30
    description: >-
      worker-us's container was OOM-killed by its own memory limit three times in ten minutes on
      k3s-worker-1 (dmesg `constraint=CONSTRAINT_MEMCG`, ~6 GB of the node available). It paged
      twice per kill window -- HostOomKilled and K3sContainerOOMKilled -- until HostOomKilled
      learned to step aside for a container-limit kill on a node with memory to spare.
    source: replayed HostOomKilled 07:52-08:10Z and K3sContainerOOMKilled{pod="worker-us-646cc786db-66q89"} 07:57-08:14Z; node_memory_MemAvailable_bytes on k3s-worker-1
    start: 2026-09-30T07:45:00Z
    end: 2026-09-30T08:20:00Z
    grace: 10m
    expect_firing: [K3sContainerOOMKilled]
    expect_quiet: [HostOomKilled]

  - id: healthy-2026-09-22
    description: >-
      A quiet two days: no infrastructure incident in memory, git history or ALERTS beyond the
      heartbeat. The paging-severity alerts must stay silent through it.
    source: ALERTS history; memory notes 09-22..09-24
    start: 2026-09-22T00:00:00Z
    end: 2026-09-24T00:00:00Z
    expect_quiet:
      - MongodNoPrimary
      - MongodNotRunning
      - WorkerDown
      - TargetDown
      - K3sNodeNotReady
      - FilesystemSpaceCritical
      - FluxReconciliationStopped
      - kinowo-web-serving-down

  - id: showtimes-film-probes-challenged-2026-09-24
    description: >-
      From the probes' first switch, the discovered film pages of uk/de/us/es were showtimes.cc
      `/movie/` URLs, which Cloudflare's managed-challenge rule answers with a 403 that blackbox
      cannot pass, so ProbeBlockedByEdge fired on them without cease -- true, but about a probe
      that could never succeed. Fixed by the discovery reading such pages from the origin and not
      probing them (6de1c0983, on main at 17:36:45Z); the window ends once monitoring-1 had
      switched it in -- the last 403 firing sample is 17:47Z, none since -- so any later firing
      is a real edge block and still fails the budget, as it should.
    source: ALERTS{alertname="ProbeBlockedByEdge",kind="film"} firing from 15:46Z; probe_http_status_code 403 on every showtimes.cc film target
    start: 2026-09-24T15:46:00Z
    end: 2026-09-24T17:50:00Z
    grace: 0m
    expect_firing: [ProbeBlockedByEdge]

  - id: readmodel-heals-in-flight-2026-09-24
    description: >-
      Every sweep heal in this window (US x3, UK x1) was a scrape landing a new venue or row within
      five seconds of the prune sweep's start: its change-stream event waited behind the sweep's
      lock, so the heal wrote what the stream was about to, and ReadModelHealsRecurring paged twice
      for the US on a stream that was fine. Fixed by 845a335c4 (a heal counts only if the stream
      does not apply the row itself); the window ends at the last such heal, and the default grace
      covers the rule's one-hour increase window after it.
    source: worker WARN "projected N ready row(s) missing a card" (prune sweep) 2026-09-24 21:08Z .. 09-25 02:37Z; ALERTS{alertname="ReadModelHealsRecurring",country="us"} firing 23:16-00:06Z and 01:16-02:06Z; commit 845a335c4
    start: 2026-09-24T21:00:00Z
    end: 2026-09-25T02:40:00Z
    expect_firing: [ReadModelHealsRecurring]

  - id: readmodel-poster-derivation-stale-2026-09-24
    description: >-
      The 2026-09-24 poster-selection deploy changed what ReadModelProjection derives from an
      unchanged row, so stored cards kept the old poster until the rolling content check reached
      their slice, and ReadModelContentMismatch held for PL until KINOWO_READMODEL_CONTENT_SLICES=1
      was set by hand. Fixed by d24022bfb (a whole-corpus re-projection once per derivation change).
    source: ALERTS{alertname="ReadModelContentMismatch",country="pl"} firing 19:06-21:21Z; commit d24022bfb
    start: 2026-09-24T18:45:00Z
    end: 2026-09-24T21:25:00Z
    grace: 0m
    expect_firing: [ReadModelContentMismatch]

  - id: readmodel-heals-debounce-held-2026-09-30
    description: >-
      From the debounce deploy (2b94ad700, every country, ~21:13Z; narrowed to US/UK/DE by
      ab90cf8e4) a film's side-collection re-read could be held up to 2 minutes, and the prune
      sweep's heal verdict neither saw a held re-read nor waited that long, so a sweep healing a
      film whose burst was held counted a stream miss. The same wide releases healed sweep after
      sweep (clayface|2026 x4, whalefall|2026 x3) with no card retirement behind any; PL and ES
      healed nothing once undebounced. Fixed by 823bc569b; the window ends before it can deploy.
    source: worker WARN "projected N ready row(s) missing a card or a venue before the prune" 2026-09-30 21:22Z .. 10-01 15:12Z (us/uk/de only after 23:36Z); ALERTS{alertname="ReadModelHealsRecurring"} firing us/uk/de
    start: 2026-09-30T21:13:00Z
    end: 2026-10-01T15:30:00Z
    expect_firing: [ReadModelHealsRecurring]

  - id: readmodel-chicago-served-ahead-2026-09-30
    description: >-
      us/chicago's site served one film-in-a-city more than the corpus counted for 22 hours (worker
      minus web = -1 from ~09:20Z, back to 0 by ~07:45Z on 10-01), the only US city difference over
      09-29 .. 10-01 to last 20 minutes. ReadModelServingDiffersFromCorpus must fire on it; the rest
      of that window's US pages were a relay of 4-6 minute census-skew differences in other cities,
      which the rule no longer counts.
    source: max(last_over_time(kinowo_worker_movies_served{scope="all",country="us",city="chicago"}[10m])) - max(kinowo_web_movies_served{scope="all",country="us",city="chicago"}) == -1 09-30 ~09:20Z .. 10-01 ~07:45Z
    start: 2026-09-30T09:20:00Z
    end: 2026-10-01T07:45:00Z
    grace: 30m
    expect_firing: [ReadModelServingDiffersFromCorpus]

  - id: auto-apply-mongodb-8-3-restart-2026-09-27
    description: >-
      b4aa74516 moved mongo-1 to MongoDB 8.3.11, so the staged closure changed mongodb.service and
      the applier refused to restart the replica set's primary on its own -- the refusal it exists
      to make -- until the closure was switched in by hand. AutoApplyRefusingChange must keep
      saying so for a staged change to a unit it may not restart.
    source: ALERTS{alertname="AutoApplyRefusingChange",host="mongo-1",reason="units_would_change"} firing 04:46-07:48Z; commit b4aa74516 (03:39Z)
    start: 2026-09-27T03:40:00Z
    end: 2026-09-27T07:50:00Z
    expect_firing: [AutoApplyRefusingChange]

  - id: auto-apply-systemd-hardlinked-by-optimise-2026-09-28
    description: >-
      The nightly nix-store --optimise hard-linked a duplicate over PID 1's systemd binary, so
      /proc/1/exe read "(deleted)" and every closure "would restart systemd" while the unit tree
      saw no change: all three hosts sat in classifier_disagreement (k3s-worker-1 4.5h, mongo-1
      and monitoring-1 18h) until hand switches re-executed the identical binary. A refusal on a
      false premise, closed by 7a1aafecc (forgive it when PID 1 already runs the candidate's
      systemd byte for byte); the host-reported reason is still in history, so the replay fires.
    source: ALERTS{alertname="AutoApplyRefusingChange",reason="classifier_disagreement"} k3s-worker-1 09-28 04:48-09:22Z, mongo-1 + monitoring-1 09-28T15:52Z..09-29T10:10Z; commit 7a1aafecc
    start: 2026-09-28T03:45:00Z
    end: 2026-09-29T10:15:00Z
    expect_firing: [AutoApplyRefusingChange]

  - id: us-drive-ins-closed-for-season-2026-09-27
    description: >-
      Seventeen US drive-ins closed for the season: their Flicks pages parsed and carried the
      "no movie times" notice, yet an empty plan archived exactly like a parser that stopped
      matching, so CinemaContentStaleVenuesGrowing (us) held for 44 hours on venues that were
      fine. A firing on a false premise, closed by b821575ec (a venue whose own page says it has
      no schedule is left out of the stale count); the archive written before it does not carry
      that flag, so the replay fires.
    source: ALERTS{alertname="CinemaContentStaleVenuesGrowing",country="us"} firing 09-27T23:04Z..09-29T19:08Z; commit b821575ec
    start: 2026-09-27T23:00:00Z
    end: 2026-09-29T19:10:00Z
    expect_firing: [CinemaContentStaleVenuesGrowing]

  - id: worker-pl-metaspace-growth-2026-09-27
    description: >-
      worker-pl's metaspace climbed to its 128m cap (every worker sat at 80-97% of it), pushing
      the container's resident memory past JvmResidentNearContainerLimit's threshold again and
      again before the metaspace OOMs below. Fixed by c62064dbb, which serves the apps' classes
      from an AOT cache trained into the image, out of metaspace.
    source: ALERTS{alertname="JvmResidentNearContainerLimit",tier="worker",country="pl"} 19 episodes 09-27T14:26Z..09-28T20:36Z; commit c62064dbb
    start: 2026-09-27T14:20:00Z
    end: 2026-09-28T20:40:00Z
    expect_firing: [JvmResidentNearContainerLimit]

  - id: worker-uk-heap-and-pl-metaspace-ooms-2026-09-28
    description: >-
      Real JVM deaths, each writing a heap dump: worker-uk ran out of heap five times under the
      identity take-up (fixed by gitops b140647 raising its heap 448m -> 640m, recorded by
      f5572b448), then worker-pl died of OutOfMemoryError: Metaspace at its 128m cap (fixed by
      c62064dbb). HeapDumpWritten must page for every one.
    source: ALERTS{alertname="HeapDumpWritten"} dir=worker-uk 09-28 02:46, 07:16, 11:00, 17:48, 19:48Z; dir=worker-pl 09-28T21:48Z .. 09-29T03:18Z (4 episodes); commits f5572b448, c62064dbb
    start: 2026-09-28T02:40:00Z
    end: 2026-09-29T03:50:00Z
    grace: 0m
    expect_firing: [HeapDumpWritten]

  - id: heap-dumps-requested-on-demand-2026-09-29
    description: >-
      Two dumps taken through POST /heapdump while measuring the heap (worker-uk 13:05Z,
      worker-us 17:42Z; both pods kept running) were written as wedge-<millis>.hprof like the
      liveness watchdog's, so HeapDumpWritten paged them as worker deaths. A firing on a false
      premise, closed by ee5b94f19 (an on-demand dump is named requested-* and the newest-death
      time skips it); the dumps written before it carry the old name, so the replay fires. The
      window spans both dumps; nothing else fired between them.
    source: ALERTS{alertname="HeapDumpWritten"} dir=worker-uk 13:18-13:46Z, dir=worker-us 17:46-18:14Z; commit ee5b94f19
    start: 2026-09-29T13:00:00Z
    end: 2026-09-29T18:20:00Z
    grace: 0m
    expect_firing: [HeapDumpWritten]

  - id: worker-dedup-table-oom-storm-2026-10-02
    description: >-
      3f4bf656a held every unmatched listing's scored candidates; the uk and de heaps thrashed at
      their caps and the String Deduplication table (native, outside -Xmx) grew to 500-765 MB until
      the memory cgroup killed the workers, crash-looping four countries until 161fbc450 at 02:55Z.
      JvmStringDedupTableLarge, written for this, must fire in it.
    source: kinowo_worker_native_memory_bytes{category="String Deduplication"} uk 627m at 23:27Z; ALERTS{alertname="K3sContainerOOMKilled"} 10-02 22:30Z..10-03 02:50Z; commits 3f4bf656a, 161fbc450
    start: 2026-10-02T22:20:00Z
    end: 2026-10-03T03:00:00Z
    expect_firing: [JvmStringDedupTableLarge]
