# What bin/backtest-alerts accepts from an alert on REAL data that it would otherwise fail.
#
# Every entry needs a `reason` -- an allowlisting nobody can explain is the rule being wrong with
# extra steps. Before adding one, prefer (in order): fixing the rule, with a promtool case; or, when
# the firing was a REAL incident, cataloguing that incident in alert-incidents.yml under
# `expect_firing`, which both excuses the firing from the budget AND pins that the alert still
# catches it.

defaults:
  # An alert that is firing 5% of the time -- over eight hours a week -- is either a real,
  # unfixed problem or a rule that means the wrong thing. FluxReconciliationStopped ran at 46%.
  max_firing_fraction: 0.05
  # One distinct episode a day, averaged over the window.
  max_episodes_per_week: 7

allow:
  MonitoringHeartbeat:
    noisy: true
    reason: >-
      The dead-man's switch, `expr: vector(1)`. It fires 100% of the time by design; the thing
      that pages is its ABSENCE at the receiver.

  # AN `absent()` COMPANION THAT FIRES UNTIL A HAND STEP IS DONE, and whose firing IS the reminder
  # of it -- a warning that names the step, never a page. Remove the entry once its series exists: a
  # companion still firing after that is a real fault and should fail this check again.
  # (ProbeResultsAbsent and ProbeDiscoveryStale stood here until monitoring-1 was switched to the
  # probes on 2026-09-24 and both series appeared.)
  FluxObjectStateAbsent:
    noisy: true
    reason: >-
      flux:resource_info (recorded from kube-state-metrics' gotk_<kind>_info series) did not exist
      until the movies-gitops change giving kube-state-metrics a custom-resource-state config for
      Flux (see flux.rules' flux-objects group) landed on 2026-09-24, so the replayed fortnight
      still holds this warning firing before it. Remove this entry and the two below once that
      fortnight has passed (2026-10-09).
  # ...and the two comparisons it stands in for, DEAD over the same stretch: they read nothing but
  # flux:resource_info. Remove both with the entry above.
  FluxObjectNotReady:
    dead: true
    reason: >-
      Reads only flux:resource_info, which did not exist before the 2026-09-24 movies-gitops
      kube-state-metrics change; FluxObjectStateAbsent is the warning that said so meanwhile.
  FluxObjectSuspended:
    dead: true
    reason: >-
      Reads only flux:resource_info, which did not exist before the 2026-09-24 movies-gitops
      kube-state-metrics change; FluxObjectStateAbsent is the warning that said so meanwhile.

  # FIRING IS THE CONDITION ITSELF, NOT A MISREADING OF IT.
  LandingGateRed:
    noisy: true
    reason: >-
      Every firing is a gate genuinely red on main for over two hours, read off the conclusion each run
      pushes. The fortnight it was written against (2026-10-12..25) had Identity model convergence red
      for 4-9 h stretches seven times and Main twice: the alert reports a red main, which is its job, and
      the budget measures how often main was red rather than how wrong the rule is.
  EnrichmentApiKeyRefused:
    noisy: true
    reason: >-
      OMDb's free key answers 401 for a spent daily quota as well as a bad key, and CI's recording legs
      spend that quota alongside production: 2026-10-20..25 had five stretches of two hours and more with
      401s and no success. Each one stopped the OMDb backfill, so each is worth the warning; drop this
      entry once the key's quota is raised or CI stops sharing it.

# Metrics a rule reads that are published ONLY in an exceptional state, so their absence over the
# whole window is the healthy case, not a dead selector. They are excluded from the dead-alert
# check and from rollout clipping.
conditional_metrics:
  mongodb_collstats_storageStats_storageSize:
    reason: >-
      Published by mongodb-exporter's collstats collector for the identity_retained allow-list
      (roles/mongodb-exporter.nix, 2026-11-07), absent from the fleet until that role is applied to
      mongo-1 (infra/bin/deploy mongo-1 --apply). IdentityRetainedArchiveLarge and its absent()
      companion read it. Strike this entry once a metric-names.json snapshot taken after the apply holds it.
  mongodb_collstats_storageStats_totalIndexSize:
    reason: >-
      As mongodb_collstats_storageStats_storageSize: the identity_retained collstats, published once
      the exporter role is applied to mongo-1.
  mongodb_collstats_storageStats_count:
    reason: >-
      As mongodb_collstats_storageStats_storageSize: the identity_retained collstats, published once
      the exporter role is applied to mongo-1. IdentityRetainedArchiveLarge's description names it.
  nixos_auto_apply_excluded:
    reason: >-
      Published by fleet/auto-apply.nix only on a host with `excludedBecause` set; no host is
      excluded today. StagedClosureNotLive reads it in an `unless` arm.
  country:readmodel_cities_short_of_corpus:count:
    reason: >-
      Recorded by runtime-invariants.rules as a count OF the cities in violation, so it has a
      series only while some city serves far short of its corpus -- none in a healthy fortnight.
      CityServingShortOfCorpus reads it.
