---
# Alertmanager's configuration, installed at /etc/alertmanager/alertmanager.yaml by
# nix/modules/roles/prometheus.nix. `@TELEGRAM_BOT_TOKEN_FILE@` is substituted at build time.
#
# EVERYTHING GOES TO TELEGRAM, to the same @kinowobot channel the application's own alerts and the
# Grafana rules use. One channel is a deliberate choice for a one-operator fleet: a second
# destination is a second thing to notice has stopped working.
#
# ------------------------------------------------------------------------------------------------
# THE CHAT ID IS A NUMBER HERE AND A QUOTED STRING IN GRAFANA. THAT IS NOT AN INCONSISTENCY.
# ------------------------------------------------------------------------------------------------
#
# Alertmanager's own schema types `chat_id` as an INTEGER, so it is unquoted below. Grafana's
# provisioning schema types the same value as a STRING, and its environment expansion re-types a
# numeric one to a number regardless of quoting -- which makes Grafana fail to unmarshal it and
# exit before ever becoming healthy (see the header of nix/modules/roles/grafana.nix, and the
# warning in grafana-contactpoints.yaml). Two schemas, two correct spellings of one number. Copying
# either file's quoting into the other breaks it.
#
# THE BOT TOKEN IS READ FROM A FILE AT SEND TIME, never interpolated into this document: this file
# is in the world-readable Nix store, and `bot_token_file` is the reason nothing secret is.

global:
  # How long a firing alert may go unseen before Alertmanager decides it has resolved on its own.
  # Longer than the longest `for:` in the rule files, so a slow-moving alert is not resolved out
  # from under itself between evaluations.
  resolve_timeout: 15m

route:
  # GROUPED BY HOST FIRST, AND THAT ORDERING IS THE WHOLE POINT ON A FLEET THIS SHAPE. A machine in
  # trouble trips several rules at once -- a host that fills its disk produces
  # FilesystemSpaceCritical, FilesystemInodesLow, SystemdUnitFailed and probably MongodNotRunning,
  # which is ONE incident and should arrive as one message. On a Fly app the equivalent grouping key
  # was `app`; here the unit of trouble is a machine, so it is `host`.
  #
  # WHAT IS NOT IN THE GROUPING KEY, deliberately: `severity`. Grouping by it would split one
  # machine's incident into a critical message and a warning message, which is exactly the split
  # that makes somebody chase two problems.
  #
  # ALERTS WITH NO `host` LABEL still group, on the empty value -- `absent()` companions and the
  # heartbeat have no host, and they land together in one "fleet-wide" group, which is the right
  # place for them: they are statements about the monitoring, not about a machine.
  group_by: ["host", "alertname"]
  group_wait: 30s
  group_interval: 5m
  # Re-nag every four hours while an alert still holds. Matches the Grafana notification policy
  # ported alongside it, so the two halves of this fleet's alerting nag at the same rhythm.
  repeat_interval: 4h
  receiver: telegram

  routes:
    # THE DEAD-MAN'S HANDLE. `MonitoringHeartbeat` (monitoring-self.rules) fires permanently and by
    # design; this route delivers it once a day.
    #
    # WHAT IT BUYS: every other alert in this fleet is evidence that something is WRONG, and none
    # of them is evidence that the notification path still WORKS. A revoked bot token, a bot
    # removed from the channel, a broken egress route -- all of them present as silence, which is
    # exactly what a healthy fleet also looks like. One message a day is the price of being able to
    # tell those apart, and its ABSENCE is the signal, so it is worth as much as the message.
    #
    # `send_resolved` is off for this receiver: the heartbeat never resolves, and a "resolved"
    # message for it would only ever mean Prometheus stopped evaluating.
    - matchers:
        - alertname = "MonitoringHeartbeat"
      receiver: telegram-heartbeat
      group_wait: 0s
      repeat_interval: 24h

    # THE DISK AND WORKER-PIPELINE ALERTS ALSO GO TO EMAIL, and they are the only ones that do.
    #
    # WHY THESE AND NOT EVERYTHING. Two classes earn a mailbox. A filling disk is the alert whose
    # useful response is days away rather than minutes -- growing a volume is a Tuesday-afternoon
    # decision, not a 03:00 one. A stalled or runaway task queue is the one whose damage is
    # CUMULATIVE and invisible: nothing 500s, the site keeps serving, and the listings simply go
    # stale hour by hour, so it is the failure most likely to be scrolled past in a chat channel
    # and least likely to announce itself any other way. Everything else here wants to be seen NOW,
    # and Telegram is better at that than a mailbox.
    #
    # BOTH DESTINATIONS, NOT INSTEAD. This file's header argues for one channel because a second
    # is a second thing to notice has stopped working, and that argument is still right -- so the
    # email path is ADDITIVE. A relay that starts rejecting costs a duplicate that stops arriving,
    # never an alert that stops arriving.
    #
    # TWO ROUTES RATHER THAN ONE, so the cadences below stay exactly what the severity routes that
    # follow would have given them. One route matching both severities would have to pick a single
    # `repeat_interval`, and quietly re-time either the critical (1h) or the warning (12h). These
    # MUST stay above the severity routes: first match wins, and a route that matched `severity`
    # first would never reach these.
    #
    # WHAT THE MATCHER ACTUALLY CATCHES, listed because a regex is not a list and the answer
    # should not have to be re-derived: FilesystemSpaceLow/Critical, FilesystemInodesLow/Critical,
    # FilesystemWillFillWithin7Days, FilesystemReadOnly, FilesystemMetricsAbsent, WorkerDown,
    # WorkerQueueStalled, WorkerQueueGrowingUnbounded, WorkerQueueMetricsAbsent,
    # WorkerTasksFailingRepeatedly, WorkerTaskTypeUnhandled, plus the three named in full below.
    # Sixteen, and every one of them is meant.
    #
    # THE THREE NAMES SPELLED OUT IN FULL, NOT GIVEN A PREFIX, and the asymmetry with the two
    # families above is the point. A prefix is right for Filesystem and Worker because EVERY rule
    # in those families has the silent-failure property that earns a mailbox. It is wrong for
    # ReadModel, where six of the eight rules watch the pipeline's own movement and belong in the
    # chat stream with everything else -- a prefix would enrol them without anyone deciding to --
    # and `ResidentialProxyFallingBackToZyte` has no family of its own at all (residential-proxy.rules
    # holds exactly one rule).
    #
    # WHAT EARNS THE TWO READ-MODEL NAMES THE MAILBOX is the same property the Worker note below
    # describes, in its sharpest form yet. On 2026-09-07 a prune deleted 509 cards,
    # ReadModelFilmPruneBurst fired for 25 minutes and RESOLVED correctly on its own terms, and the
    # hole stayed open for four and a half hours with the site quietly serving a short catalogue.
    # Nothing 500s, nothing goes down, and the one signal that existed had already stood down. That
    # is precisely the shape a chat channel scrolls past. `FilesystemReadOnly` lives in
    # host-health.rules rather than with the other six and is easy to miss when reading this — a
    # root that has gone read-only is exactly the kind of thing worth a mailbox, so it is kept,
    # deliberately rather than by accident.
    #
    # `ResidentialProxyFallingBackToZyte` EARNS IT THE SAME WAY: the fallback chain means scraping
    # itself does not break when Decodo degrades, so nothing 500s and no cinema goes dark -- the
    # only trace is a per-request Zyte bill climbing and one /uptime row nobody is staring at.
    # Ported from Grafana on 2026-09-10 specifically because Grafana's contact points are
    # Telegram-only (see the tombstone on `kinowo-residential-proxy-failing` in
    # grafana/alerting/alert-rules.yaml) and this incident -- UK's Cineworld/Odeon scrapes retrying
    # 8+ times with no working path, found by hand on /uk/tasks rather than by any alert -- is
    # exactly the case a chat-only channel missed.
    #
    # THE PREFIX MEANS A NEW `Worker*` OR `Filesystem*` RULE EMAILS BY DEFAULT. That is the right
    # default for these two families -- they are the ones whose failure is silent -- but it is a
    # decision a rule inherits without saying so, so add the name above and a case in
    # test_alertmanager.sh when you add one, or the list stops being the answer.
    #
    # THE `absent()` COMPANIONS MATCH TOO, deliberately: "nothing is watching any disk" and
    # "nothing is publishing queue metrics" belong with the alerts they cover rather than with the
    # fleet-wide noise.
    #
    # THESE ROUTES DO NOT OVERRIDE `group_by`, and the attempt to is worth recording. The root
    # groups by `[host, alertname]`; the email SUBJECT is built from `.CommonLabels`, which holds
    # only what every alert in a group agrees on, so a host with two filling volumes produced
    # "[FIRING] FilesystemSpaceLow on mongo-1" with no mountpoint, and five countries' `WorkerDown`
    # produced "[FIRING] WorkerDown" with no country. Adding `mountpoint` and `country` to
    # `group_by` here fixed the subject and cost far more than it looked: this receiver is
    # `telegram-and-email`, so splitting the group multiplied BOTH. One k3s node reboot went from
    # one message to five, repeating hourly, on the channel this file's header argues must stay a
    # single stream. The subject is fixed below instead, where it costs nothing.
    - matchers:
        - alertname =~ "Filesystem.*|Worker.*|ReadModelServingShortOfCorpus|ReadModelServedGaugesAbsent|ResidentialProxyFallingBackToZyte"
        - severity = "critical"
      receiver: telegram-and-email
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - alertname =~ "Filesystem.*|Worker.*|ReadModelServingShortOfCorpus|ReadModelServedGaugesAbsent|ResidentialProxyFallingBackToZyte"
        - severity = "warning"
      receiver: telegram-and-email
      group_interval: 15m
      repeat_interval: 12h

    # CRITICALS DO NOT WAIT FOR THEIR FRIENDS. The root `group_wait` of 30s exists to let a
    # multi-rule incident coalesce into one message; on a critical -- mongod down, a read-only
    # filesystem, the WireGuard tunnel gone -- thirty seconds of tidiness is not worth thirty
    # seconds of delay. `group_wait: 10s` still catches the common case where two criticals fire in
    # the same evaluation cycle (`evaluation_interval` is 15s) without holding the first one back.
    #
    # STILL GROUPED BY HOST, and it inherits the root `group_by` rather than restating it: a route
    # that omits `group_by` uses its parent's, and restating it here would be a second copy to keep
    # in step.
    #
    # THE ONE-HOUR RE-NAG IS THE OTHER HALF. Four hours is a reasonable rhythm for "the disk is
    # getting full"; for "the database is down" it means an alert can be missed and not repeat
    # until after lunch. This fleet has one operator and no on-call rotation, so repetition is the
    # only escalation mechanism there is.
    - matchers:
        - severity = "critical"
      receiver: telegram
      group_wait: 10s
      repeat_interval: 1h

    # WARNINGS NAG MORE SLOWLY THAN THE ROOT DEFAULT. Almost everything added at the post-migration
    # audit is a warning that describes a SLOW condition -- a disk filling over days, a reboot owed
    # for a week, an auto-apply verdict waiting for a decision. Re-sending those every four hours
    # is how a channel stops being read, and a channel that is not read is the failure mode this
    # whole stack is trying to avoid. Twelve hours is roughly "morning and evening", which matches
    # how quickly any of them actually need acting on.
    #
    # A LONGER `group_interval` TOO (15m against the root's 5m): when a warning is already firing
    # for a host and a second one joins it, this is how long before the group is re-sent with the
    # new member. Slower is fine for warnings and keeps a host that is degrading in several small
    # ways from producing a message every five minutes.
    - matchers:
        - severity = "warning"
      receiver: telegram
      group_interval: 15m
      repeat_interval: 12h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: "@TELEGRAM_BOT_TOKEN_FILE@"
        # UNQUOTED, because Alertmanager types this as an integer. See the header.
        chat_id: 1771340065
        # PARSING TURNED OFF, DELIBERATELY. Alertmanager's default parse_mode is HTML, and Telegram
        # rejects a message whose text contains anything it reads as a malformed tag -- a `<` from
        # a PromQL threshold in an annotation is enough. The alert is then dropped at delivery with
        # only a log line to say so, which is the worst possible place to lose one. Plain text
        # cannot fail that way; the cost is that nothing can be bolded.
        parse_mode: ""
        send_resolved: true
        message: |-
          {{ range .Alerts }}[{{ .Status | toUpper }}] {{ .Labels.alertname }}{{ if .Labels.host }} on {{ .Labels.host }}{{ end }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # ONE RECEIVER THAT DOES BOTH, rather than a route with `continue: true` into a second one.
  # `continue` would work and is how this is usually written; it also means the Telegram message
  # is produced by a DIFFERENT route from the email, with its own timing, so the two halves of one
  # alert can drift apart in when and how often they arrive. One receiver keeps them in step by
  # construction.
  - name: telegram-and-email
    telegram_configs:
      - bot_token_file: "@TELEGRAM_BOT_TOKEN_FILE@"
        chat_id: 1771340065
        # Plain text for the reason the `telegram` receiver gives: a `<` from a PromQL threshold in
        # an annotation is enough for Telegram to reject an HTML-parsed message and drop the alert
        # at delivery.
        parse_mode: ""
        send_resolved: true
        message: |-
          {{ range .Alerts }}[{{ .Status | toUpper }}] {{ .Labels.alertname }}{{ if .Labels.host }} on {{ .Labels.host }}{{ end }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: "@ALERT_EMAIL_TO@"
        from: "@ALERT_EMAIL_FROM@"
        smarthost: "@SMTP_SMARTHOST@"
        auth_username: "@SMTP_USERNAME@"
        # The API key, read from a file at send time -- never interpolated into this document,
        # which lives in the world-readable Nix store.
        auth_password_file: "@SMTP_PASSWORD_FILE@"
        # REFUSE TO SEND IN CLEARTEXT. Without this Alertmanager will happily fall back to an
        # unencrypted submission if STARTTLS is not offered, which would put the alert -- and the
        # API key authenticating it -- on the wire in plain text.
        require_tls: true
        send_resolved: true
        headers:
          # The SUBJECT is the whole message for anyone reading on a phone, so it names WHAT and
          # WHERE. `host` + `mountpoint` place a disk alert; `country` places a worker one, which
          # has no host to name.
          #
          # THE COUNT IS THE HONEST ANSWER WHEN A LABEL IS NOT COMMON, and it is why this does not
          # need a `group_by` override to be useful. `.CommonLabels` holds only what the whole group
          # agrees on, so two mountpoints or five countries leave that field empty -- and the fix
          # for that is to say "5 alerts", not to split the group and send five messages to Telegram
          # as well. The body below ranges over `.Alerts` and names every one of them individually.
          subject: >-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.host }} on
            {{ .CommonLabels.host }}{{ end }}{{ if .CommonLabels.country }}
            ({{ .CommonLabels.country }}){{ end }}{{ if .CommonLabels.mountpoint }}
            ({{ .CommonLabels.mountpoint }}){{ end }}{{ if gt (len .Alerts) 1 }}
            -- {{ len .Alerts }} alerts{{ end }}
        # PLAIN TEXT, not `html`. Alertmanager's default HTML template is a large document that
        # renders poorly in half the clients that receive it, and the descriptions in these rules
        # are already written as prose with shell commands in them -- which is exactly what HTML
        # mangles. The cost is that nothing is clickable.
        text: |-
          {{ range .Alerts }}[{{ .Status | toUpper }}] {{ .Labels.alertname }}{{ if .Labels.host }} on {{ .Labels.host }}{{ end }}

          {{ .Annotations.summary }}

          {{ .Annotations.description }}

          {{ end }}
          Silence or inspect: {{ .ExternalURL }}

  - name: telegram-heartbeat
    telegram_configs:
      - bot_token_file: "@TELEGRAM_BOT_TOKEN_FILE@"
        chat_id: 1771340065
        parse_mode: ""
        send_resolved: false
        message: |-
          Monitoring heartbeat: Prometheus, Alertmanager and the Telegram path are all working.
          Its ABSENCE for more than a day is the alarm.

# ------------------------------------------------------------------------------------------------
# INHIBITIONS. WHAT NOT TO SAY WHEN A BIGGER THING IS ALREADY BEING SAID.
# ------------------------------------------------------------------------------------------------
#
# WHY A THREE-HOST FLEET NEEDS THESE AT ALL, when the list of alerts is short: because the alerts
# are highly correlated BY HOST. One machine going away takes its node_exporter with it, and every
# comparison rule reading that machine's series stops being able to fire -- but the `absent()`
# companions this directory is full of DO fire, all of them, at once. A host that reboots for two
# minutes can produce TargetDown plus four "nothing is publishing X" warnings, which is five
# messages describing one event, and the four that are consequences bury the one that is the cause.
#
# HOW TO READ AN `equal:` CLAUSE, because getting it backwards is the usual mistake: the source and
# target alerts must AGREE on every label named there. `equal: ["host"]` means an alert is silenced
# only by a source firing on THE SAME host -- mongo-1 being down never silences anything about
# monitoring-1.
#
# AND THE STANDING RISK IN ALL OF THIS: an inhibition can hide a real, unrelated alert that happens
# to share a host with a firing critical. That is the trade being made deliberately -- on this fleet
# the correlated case is far commoner than the coincidental one, and a message that arrives buried
# in four others has already failed at being read.
inhibit_rules:
  # A HOST THAT CANNOT BE SCRAPED SILENCES EVERY OTHER ALERT ABOUT IT. `TargetDown` already says the
  # machine is unreachable; the warnings that follow are all forms of "and therefore I cannot see
  # anything about it", which is not news.
  #
  # NOTE WHAT THIS DOES NOT SILENCE: another host's alerts, and this fleet's `absent()` companions
  # that carry no `host` label at all (they are fleet-wide statements, and a fleet-wide "nothing is
  # publishing filesystem metrics" during a single host's outage is genuinely different news).
  #
  # `job = "node"` ON THE SOURCE SIDE IS LOAD-BEARING, TWICE OVER. `TargetDown` fires on `up == 0`
  # for ANY job, including this stack's own prometheus/alertmanager/grafana targets -- and those
  # carry no `host` label at all. Without this matcher, Grafana being down would count as a source
  # whose `host` is empty, which would silence every OTHER host-less alert on this fleet: precisely
  # the `absent()` companions that say "nothing is watching X any more". Restricting the source to
  # the `node` job means only a MACHINE being unreachable inhibits anything, and a machine always
  # has a real hostname to match on.
  #
  # `alertname != "TargetDown"` ON THE TARGET SIDE follows Alertmanager's own recommendation that
  # source and target matchers should never overlap. Two hosts down would otherwise be a rule whose
  # source and target both match, which Alertmanager handles by refusing to inhibit -- correct, but
  # by accident rather than by design, and it is one upstream behaviour change away from silencing
  # half an outage.
  # `host =~ ".+"` SAYS THE SAME THING AS `job = "node"` DIRECTLY. The paragraph above argues that a
  # node target always carries a hostname, which is true and is an ASSUMPTION about the scrape
  # config living two files away. Stating the requirement on the label the `equal:` actually uses
  # costs nothing, survives a relabelling change that the argument would not, and lets the check in
  # test_alertmanager.sh verify the property mechanically for every rule here rather than by
  # reading.
  - source_matchers:
      - alertname = "TargetDown"
      - job = "node"
      - host =~ ".+"
    target_matchers:
      - severity =~ "warning|critical"
      - alertname != "TargetDown"
    equal: ["host"]

  # A CRITICAL SILENCES THE WARNING OF THE SAME NAME ON THE SAME HOST. Several rules in this
  # directory come in warning/critical pairs over one series -- FilesystemSpaceLow and
  # FilesystemSpaceCritical, the two memory rules, the two inode rules -- and when the critical is
  # firing the warning is firing too, by construction. Two messages, one condition, and the warning
  # is the less useful of them.
  #
  # `mountpoint` IS IN THE `equal:` LIST FOR THE FILESYSTEM PAIRS SPECIFICALLY. Without it a
  # critical on /var/lib/mongodb would silence a warning on / of the same host, which is a different
  # disk and a different problem. Alerts with no `mountpoint` label match each other on the empty
  # value, so the memory pair still pairs up correctly.
  #
  # `host =~ ".+"` ON THE SOURCE IS THE SAME LOAD-BEARING GUARD THE RULE ABOVE SPELLS OUT, and it
  # was missing here until 2026-09-06. Alertmanager compares an ABSENT label to an absent label as
  # equal, so without it any critical that carries no `host` -- and this fleet has TEN, including
  # `WorkerDown` and `WorkerQueueStalled` -- matched EVERY host-less warning on the fleet and
  # silenced it. One OOM-killed US worker would have muted `FilesystemMetricsAbsent`,
  # `WorkerQueueMetricsAbsent` and every `CinemaScrape*` / `ReadModelProjection*` / `Web*` warning
  # at once. Requiring the source to name a machine means only a machine's critical can silence a
  # machine's warning; the application pairs are handled by the rule below, on their own label.
  - source_matchers:
      - severity = "critical"
      - host =~ ".+"
    target_matchers:
      - severity = "warning"
    equal: ["host", "mountpoint"]

  # THE SAME STATEMENT FOR THE WORKER PIPELINE, which is scoped by COUNTRY rather than by host: the
  # workers run on k3s and carry `country`, never `host`. A queue that has stalled (critical) makes
  # "the queue is growing" and "the queue is failing everything it claims" (warnings) for the same
  # country true by construction, and a worker that is DOWN makes every warning about that country's
  # pipeline a restatement of it.
  #
  # BOTH SIDES NAME THE FAMILY, and that is not decoration. `country` is set by the SCRAPE TARGET,
  # so the web tier carries it too -- this rule first shipped matching on `country` alone, which
  # meant `WebServerErrorsServed{country=pl}` silenced `WorkerTaskTypeUnhandled{country=pl}`: the
  # web tier crash-looping would have deleted the one alert that exists BECAUSE nothing else can see
  # a worker discarding its tasks. That is the same empty-join mistake as the rule above, narrowed
  # from fleet-wide to country-wide, which is not narrow enough. Naming the family on the source AND
  # the target keeps the statement to what it can actually justify: a dead or stalled worker
  # explains that worker's other warnings, and nothing else's.
  #
  # `equal: ["country"]` ALONE IS RIGHT HERE, unlike a job- or tier-scoped join, because
  # `WorkerQueueStalled` aggregates with `sum by (country)` and therefore carries NO `job` label to
  # match on. Scoping by alertname on both sides is what survives that.
  #
  # THE TARGETS ARE NAMED ONE BY ONE, and the list is the argument. A dead worker stops that
  # country's scraping and its read-model projection, so those warnings are restatements arriving
  # minutes later — but only the ones a dead worker can actually CAUSE, which is not the same as
  # the ones that share its prefix. Two do not belong and were swept in by a `Worker.*|CinemaScrape.*`
  # shape for one revision:
  #
  #   - `WorkerTaskTypeUnhandled` fires on `increase(no_handler[1h]) > 0`, a WIRING BUG. A worker
  #     that is down cannot produce one; a worker that is crash-looping can be down AND still have
  #     dropped tasks in the window, and that is the diagnosis, not the noise. This is the alert
  #     the paragraph above protects from the web tier — silencing it here undid that by another
  #     door.
  #   - `CinemaScrapeNeverScraped` has `for: 24h`. Nothing a five-minute outage does can cause it,
  #     and a `WorkerQueueStalled` held for hours would hide a venue whose parse is permanently
  #     broken.
  #
  # Matching by `country` alone is what let the WEB tier in a revision before that: it carries
  # `country` from the same scrape config. So the rule is pinned at both ends, and every entry
  # below has a case in inhibition_cases.py — as does every alert deliberately NOT here.
  - source_matchers:
      - severity = "critical"
      - alertname =~ "Worker.*"
      - country =~ ".+"
    target_matchers:
      - severity = "warning"
      - alertname =~ "WorkerQueueGrowingUnbounded|WorkerTasksFailingRepeatedly|CinemaScrapeOldestAgeHigh|ReadModelProjectionTriggerUnaccounted"
    equal: ["country"]

  # NO FLUX RULE, deliberately, and this is the second time that has been decided. A rule joining
  # `FluxControllerDown` to its warnings on `controller` reads obviously right and earns nothing:
  # when a controller is down its `gotk_*` series go ABSENT, so the warnings it would silence
  # resolve on their own within a scrape or two. What it does do is silence `FluxSuspended` --
  # `controller` comes from the scrape target, so every flux series carries it -- and a suspension
  # somebody set by hand is exactly the news a controller being down does not contain.
  #
  # Two messages for a Flux outage is the same trade already taken for `WorkerDown` and
  # `TargetDown` above: they say the same thing five minutes apart, and the second confirms the
  # first. That is cheaper than an inhibit rule that hides a deliberate suspension.

# NO MUTE INTERVALS. There is no maintenance window on this fleet -- deploys are continuous and
# reboots are occasional and by hand -- so a time-of-day mute would only ever suppress a real alert
# that happened to arrive at night. Silences set by hand in Alertmanager during a known change are
# the right tool for that, and they expire on their own.
mute_time_intervals: []
