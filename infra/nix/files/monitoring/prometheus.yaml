---
# Prometheus's configuration, installed at /etc/prometheus/prometheus.yaml by
# nix/modules/roles/prometheus.nix.
#
# `@LISTEN_ADDRESS@`, `@FLY_TOKEN_FILE@` and `@GRAFANA_PORT@` are substituted at build time from
# that module's options, and the build FAILS if any at-sign placeholder survives the substitution
# (the guard greps the OUTPUT for one, so this sentence deliberately does not spell the pattern out
# -- writing it here literally would trip the guard on this very file). An unsubstituted
# placeholder would reach Prometheus as a literal hostname, and a target that does not
# resolve is simply "down", which reads as a machine problem rather than a rendering one.
#
# THE NODE TARGETS ARE NOT IN THIS FILE. They are generated into
# /etc/prometheus/scrape.d/node-targets.yaml from `fleet.prometheus.nodeTargets`, so each machine's
# address is read off its own host declaration rather than typed here twice.

global:
  # 15s, matching the `timeInterval` on both Prometheus datasources in roles/grafana.nix. A
  # datasource that disagrees with this is not an error: it makes `rate()` over short windows
  # return nothing at all, silently, on the panels that use it.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# EVERY FILE HERE MUST ALSO BE IN `ruleNames` IN roles/prometheus.nix, which is what installs it.
# In this list and not that one, Prometheus refuses to start (loud). In that list and not this one,
# the file is installed and read by nobody -- the alerts simply never fire, which is silent and is
# the dangerous half.
rule_files:
  - "/etc/prometheus/rules/filesystem-capacity.rules"
  - "/etc/prometheus/rules/mongodb.rules"
  - "/etc/prometheus/rules/monitoring-self.rules"
  - "/etc/prometheus/rules/wireguard-fly.rules"

# EVERY JOB THAT IS NOT UNCONDITIONAL LIVES IN scrape.d, AND THIS IS ONE GLOB OVER ALL OF THEM.
# Two files land there today:
#
#   node-targets.yaml  generated from `fleet.prometheus.nodeTargets`, always written -- with an
#                      empty `scrape_configs` if the list is empty, so the glob never matches a
#                      half-written file.
#   scrape-fly.yaml    written only when `fleet.prometheus.scrapeFly` is true. See the long note in
#                      roles/prometheus.nix: the job needs a Fly token, the only one available is
#                      org-wide, and an org-wide Fly token must not sit on the host that also runs
#                      the k3s control plane. Off means ABSENT rather than failing -- a job with a
#                      dead credential is a target that sits red for ever, and a target list with a
#                      permanent red in it stops being read.
#
# A GLOB RATHER THAN TWO NAMED ENTRIES so that "off" needs no edit here; the file simply is not
# written. `scrape_config_files` MUST APPEAR ONCE -- it was briefly written twice, and a duplicate
# YAML key does not error, it silently discards one of the two.
scrape_config_files:
  - "/etc/prometheus/scrape.d/*.yaml"

scrape_configs:
  # ---------------------------------------------------------------------------------------------
  # THE STACK WATCHING ITSELF. Not vanity: `up{job="prometheus"}` is what makes an alert on a
  # missing series meaningful, and monitoring-self.rules reads all three of these.
  # ---------------------------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["@LISTEN_ADDRESS@:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["@LISTEN_ADDRESS@:9093"]

  # Grafana publishes its own alert-rule evaluation and notification counters. On this fleet
  # Grafana evaluates ALL 24 of the ported kinowo alert rules, so a Grafana that is up but failing
  # to evaluate is a monitoring outage that nothing else here would see.
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["@LISTEN_ADDRESS@:@GRAFANA_PORT@"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["@LISTEN_ADDRESS@:9093"]

remote_read: []
remote_write: []
