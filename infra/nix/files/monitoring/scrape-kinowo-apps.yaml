# THE APPLICATION'S OWN METRICS -- both tiers, both on k3s.
#
# These are NOT node_exporter numbers. They are what the JVM and the application publish about
# themselves: heap, GC, task-queue depth, scrape pacing, enrichment counters. Host health says the
# machine is alive; this says the software is doing its job.
#
# WHY THIS FILE EXISTS SEPARATELY from prometheus.yaml: it is installed unconditionally into
# scrape.d, which prometheus.yaml globs. Keeping the app jobs out of the main file means a change to
# what the application exposes does not touch the file that also defines the fleet's own monitoring.

# THE WORKER, on k3s, reached by NodePort.
#
# 10.20.0.12:30900, NOT a pod IP and NOT a Service name. Prometheus runs OUTSIDE the cluster with no
# Kubernetes credentials -- deliberately, since the only credential k3s issues is cluster-admin -- so
# it can neither discover pods nor resolve cluster DNS. A pod IP would work today and go stale on the
# next rollout, reading as "worker down" every time the worker is deployed. The NodePort is the one
# address that survives a restart. See infra/kubernetes/worker/ (base + overlays).

# A MAPPING WITH `scrape_configs:`, NOT A BARE LIST. A file named by `scrape_config_files` is
# parsed as a fragment of the main config, so it must carry the key -- a top-level sequence fails
# with `cannot unmarshal !!seq into config.ScrapeConfigs` and PROMETHEUS REFUSES TO START, taking
# the fleet's monitoring down rather than skipping the file. Hit on 2026-08-29.
scrape_configs:
  - job_name: kinowo-worker
    metrics_path: /metrics
    # 30s, not 15s. These are counters and gauges about batch work measured in minutes; twice the
    # resolution would double the series volume on a 4GB box for no question it would answer sooner.
    scrape_interval: 30s
    scrape_timeout: 10s
    # ONE TARGET PER COUNTRY. Each is its own Kubernetes Deployment with its own NodePort, because
    # `KINOWO_COUNTRIES` also selects the DATABASE -- so these are three separate corpora, not three
    # replicas of one, and any panel that aggregates them without keeping the `country` label is
    # adding three different fleets together.
    #
    static_configs:
      - targets: ["10.20.0.12:30900"]
        labels: { app: kinowo-worker, country: pl, tier: worker, platform: k3s }
      - targets: ["10.20.0.12:30901"]
        labels: { app: kinowo-worker, country: de, tier: worker, platform: k3s }
      - targets: ["10.20.0.12:30902"]
        labels: { app: kinowo-worker, country: uk, tier: worker, platform: k3s }

    # DROP `exported_country`, WHICH IS 3961 SERIES OF PURE NOISE. Both apps export a `country`
    # label of their own, and this job also SETS one from the target definition -- so Prometheus
    # keeps its own and renames the app's to `exported_country` rather than silently overwriting it.
    #
    # They have never disagreed (checked across all 360 worker and web series on 2026-08-29: zero
    # mismatches), which is the point: it is the same fact twice. Keeping it costs a label on every
    # series and invites a query grouped by `exported_country` that quietly works until the day the
    # two DO diverge.
    #
    # THE SCRAPE'S LABEL IS THE ONE KEPT, deliberately. It comes from the target definition in this
    # file, so it is true by construction even if a worker were misconfigured to report the wrong
    # country -- and a worker writing to the wrong database is exactly the failure where you want
    # the monitoring to say which target it was, not which country the process believes it is.
    metric_relabel_configs:
      - regex: exported_country
        action: labeldrop
  # THE WEB TIER, on k3s beside the worker since the Fly frontend was retired.
  #
  # NODEPORTS AGAIN, for the same reason as the worker above: Prometheus holds no Kubernetes
  # credentials, so it can neither discover pods nor resolve cluster DNS, and a NodePort is the one
  # address that survives a rollout. This replaced a `dns_sd_configs` job that discovered the Fly
  # machine's 6PN address over `kinowo.internal` -- there is no Fly machine to discover any more.
  #
  # ONE TARGET PER COUNTRY, and each is a SINGLE pod deliberately. A second replica behind one
  # NodePort would have kube-proxy alternate between two independent sets of counters, which reads
  # as phantom resets on every alert built from these series -- see the replica note in
  # infra/kubernetes/web/overlays/pl/patch.yaml.
  - job_name: kinowo-web
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["10.20.0.12:30910"]
        labels: { app: kinowo, country: pl, tier: web, platform: k3s, instance: kinowo-web-pl }
      - targets: ["10.20.0.12:30911"]
        labels: { app: kinowo, country: de, tier: web, platform: k3s, instance: kinowo-web-de }
      - targets: ["10.20.0.12:30912"]
        labels: { app: kinowo, country: uk, tier: web, platform: k3s, instance: kinowo-web-uk }

    # DROP `exported_country`, WHICH IS 3961 SERIES OF PURE NOISE. Both apps export a `country`
    # label of their own, and this job also SETS one from the target definition -- so Prometheus
    # keeps its own and renames the app's to `exported_country` rather than silently overwriting it.
    #
    # They have never disagreed (checked across all 360 worker and web series on 2026-08-29: zero
    # mismatches), which is the point: it is the same fact twice. Keeping it costs a label on every
    # series and invites a query grouped by `exported_country` that quietly works until the day the
    # two DO diverge.
    #
    # THE SCRAPE'S LABEL IS THE ONE KEPT, deliberately. It comes from the target definition in this
    # file, so it is true by construction even if a worker were misconfigured to report the wrong
    # country -- and a worker writing to the wrong database is exactly the failure where you want
    # the monitoring to say which target it was, not which country the process believes it is.
    metric_relabel_configs:
      - regex: exported_country
        action: labeldrop
