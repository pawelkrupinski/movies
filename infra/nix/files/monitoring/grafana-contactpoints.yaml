# Grafana's contact point and notification policy, for nix/modules/roles/grafana.nix.
#
# It started as fly/grafana/provisioning/alerting/{contact-points,notification-policies}.yaml,
# merged into one file because a route naming a receiver that was never written is FATAL at
# startup rather than inert. That original is gone with the Fly Grafana; see that module's header.
#
# ================================================================================================
# THE CHAT ID IS A QUOTED LITERAL. IT MUST NEVER BECOME ${VAR}. KEEP THE QUOTES.
# ================================================================================================
#
# Grafana expands environment variables in provisioning files, and that expansion RE-TYPES a
# numeric chat id as a YAML number no matter how it was quoted. Grafana's schema wants a string, so
# it fails to unmarshal ("cannot unmarshal number into ... string") -- and it does not skip the
# contact point and carry on, IT EXITS. Grafana never becomes healthy, which on the monitoring host
# means no dashboards and no alert evaluation at all, from a change that looks like tidying a
# hard-coded value into a variable.
#
# A chat id is not a secret (it is useless without the bot token), so there is nothing to protect
# by making it a variable. The BOT TOKEN is the secret, it is non-numeric, expansion keeps it a
# string, and it is a `$VAR` below -- delivered through an EnvironmentFile that sops-nix renders
# into /run, so it never reaches the world-readable Nix store.
#
# NOTE the different spelling in alertmanager.yaml, where the same number is UNQUOTED because
# Alertmanager's schema types it as an integer. Two schemas, two correct spellings. Do not
# harmonise them.
# ================================================================================================
#
# WHAT WAS DELIBERATELY DROPPED FROM THE FLY VERSION, so that its absence does not read as a
# mistake: the three `WorkerThrottle*` webhook contact points and their routes. Those POSTed to
# `kinowo-worker*.internal:9000/throttle` over Fly's 6PN to drive the workers' reaper backoff.
# THERE ARE NO WORKERS ON 6PN TO REACH -- since 2026-08-29 all of them run as pods on k3s, so
# `kinowo-worker*.internal` resolves to nothing and those webhooks would fail on every send,
# leaving the workers never told to back off. The 6PN peer this host held is gone too (2026-09-04),
# along with the rest of the Fly integration.
#
# THE WORKER SIDE OF THAT PATH IS ALSO GONE: `CpuCreditPoller`, the in-process authoritative
# throttle that read Fly's shared-CPU credit balance, was deleted with the platform. The worker's
# `/throttle` endpoint and its reaper backoff remain and are platform-neutral, so restoring the
# path means pointing a webhook at the pods' NodePorts on 10.20.0.12 -- not at 6PN -- and deciding
# what signal should drive it now that there is no credit bucket to watch.
#
# THE CONSEQUENCE IS NOT SILENT, WHICH IS WHY THIS IS SAFE TO DO: with no route matching them, the
# `worker-throttle` group's alerts fall through to the root policy and arrive on Telegram as
# ordinary pages instead. Noisier, and visible.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram-primary
        type: telegram
        settings:
          # The secret half. Non-numeric, so expansion keeps it a string.
          bottoken: '$TELEGRAM_BOT_TOKEN'
          # The non-secret half. QUOTED LITERAL. Read the block at the top of this file before
          # touching this line.
          chatid: "1771340065"
        # Send a follow-up when an alert clears, so that a quiet channel means "all good" rather
        # than "did that ever recover?".
        disableResolveMessage: false

policies:
  # THE ROOT POLICY, so no rule has to name a receiver itself. That matters more than it looks: a
  # rule naming a contact point Grafana cannot find is rejected FATALLY at startup -- the whole
  # provisioning pass fails and nothing listens. One receiver that everything falls through to
  # cannot be missing.
  - orgId: 1
    receiver: Telegram
    # GROUPED BY `app` AS WELL AS `alertname`, carried from the Fly policy: a multi-rule incident
    # on one app (a task-age alert AND a queue-backlog alert, which are the same event twice)
    # arrives as one message rather than a burst.
    #
    # `host` IS BESIDE IT AND IS DEAD WEIGHT TODAY -- said plainly so nobody spends time working out
    # what it does. THIS POLICY ROUTES ONLY GRAFANA-MANAGED RULES, and every one of those carries
    # `app` and no `host` (alerting/alert-rules.yaml). The rules that carry `host` are Prometheus's,
    # in nix/files/monitoring/rules/, and they are routed by ALERTMANAGER's own config, which never
    # consults this file -- alertmanager.yaml groups them by `host` first, for exactly the reason
    # given here.
    #
    # IT IS THERE ANYWAY BECAUSE THE COST IS ZERO AND THE FAILURE IT PREVENTS IS QUIET. An alert
    # with no `host` label groups on the empty value, so nothing changes for the rules that exist.
    # But the day somebody writes a Grafana rule with a `host` label and no `app` -- against the
    # node or mongodb jobs, say -- without this line every such alert from all three machines would
    # collapse into one group and arrive as a single message that names one of them. That is the
    # kind of grouping bug found during the incident it spoiled.
    group_by:
      - alertname
      - app
      - host
    group_wait: 30s
    group_interval: 5m
    # Re-nag every four hours, matching the Alertmanager route in alertmanager.yaml so the fleet's
    # two alerting halves nag at one rhythm.
    repeat_interval: 4h
