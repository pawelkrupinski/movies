# Grafana's alert rules, for nix/modules/roles/grafana.nix. THE ONLY COPY.
#
# It started as a copy of fly/grafana/provisioning/alerting/alert-rules.yaml, in the application
# repository, which the `kinowo-grafana` Fly app read directly. Copied rather than referenced
# because the flake root is infra/, not the repository root (see infra/flake.nix's header: rooting
# it at the top would drag ~18k tracked files of a Scala application into the store on every
# evaluation), and a Nix path reaching outside the flake root does not exist in pure evaluation.
#
# THAT ORIGINAL IS DELETED, along with the Fly Grafana it provisioned, so the drift this header
# used to warn about is over: there is one file, this one, and editing it plus `nixos-rebuild
# switch` is the whole loop. The two copies had already diverged by ~579 lines when the original
# went, which is what a "kept as the rollback" copy nobody deploys turns into.
#
# THE datasource uid `fly-prometheus` in every rule below is a CONTRACT with roles/grafana.nix,
# which provisions a datasource under exactly that uid; renaming either silently empties every rule
# that queries it.
#
# ================================================================================================
# POST-MIGRATION AUDIT, 2026-08-29.
# ================================================================================================
#
# This file was copied verbatim and then audited rule by rule against the world that exists after
# the move off Fly. FOUR RULES WERE DELETED and ONE WAS CHANGED relative to that original; each
# deletion leaves a comment where the rule used to be, so a reader finds an explanation rather
# than a hole.
#
# ------------------------------------------------------------------------------------------------
# READ THIS BEFORE CONCLUDING THAT ANY RULE BELOW IS WORKING
# ------------------------------------------------------------------------------------------------
#
# EVERY RULE IN THIS FILE QUERIES THE `fly-prometheus` DATASOURCE, AND THAT DATASOURCE HAS NO
# WORKING CREDENTIAL. Both read-only Fly tokens were revoked; the only token this estate has is
# org-wide, it cannot mint a replacement (`createLimitedAccessToken Not authorized`), and an
# org-wide token must not sit on the host that also runs the k3s control plane -- the long note on
# `fleet.prometheus.scrapeFly` in roles/prometheus.nix sets out why. So as of the audit date:
#
#   * every rule here evaluates to an execution error, not to data;
#   * the ones with `noDataState`/`execErrState: OK` -- which is nearly all of them -- go quietly
#     to Normal, which is why this is not currently a firehose of false pages;
#   * NONE of them is protecting anything. A rule in the Normal state because its datasource is
#     unreachable looks exactly like a rule in the Normal state because everything is fine.
#
# THEY ARE KEPT RATHER THAN DELETED BECAUSE THE APPS THEY WATCH ARE STILL RUNNING. The web tier
# (`kinowo`) and the scraping worker (`kinowo-worker`) are both still on Fly; the day a genuinely
# read-only token exists, every rule below starts working again with no edit. Deleting them would
# be throwing away working alerting to tidy up a credential problem.
#
# WHAT COVERS THE HETZNER SIDE INSTEAD is nix/files/monitoring/rules/*.rules, evaluated by
# Prometheus rather than by Grafana, against the local `local-prometheus` datasource, with no Fly
# dependency of any kind. Two of the deletions below were made specifically because a rule in that
# directory now does the same job better.
#
# ------------------------------------------------------------------------------------------------
# THE ONE PATTERN THAT KEPT THE AUDIT SHORT, and it was already in this file before the migration
# ------------------------------------------------------------------------------------------------
#
# The fleet rules reach their apps by `app=~` REGEX, and every one of them is already
# `noDataState: OK` -- so an app that stops simply drops out of them, silently and correctly. That
# was written for the 2026-08-02 UK/DE shutdown (see the note above the `app-uptime` group) and it
# is why `kinowo-mongo` and `showtimes-.*` were left in those regexes here rather than edited out:
# a dead app costs nothing in a rule shaped this way, the regexes are asserted country-blind by
# GrafanaCountryBlindAppMatcherSpec in the application repository, and narrowing them would break
# that spec to fix a problem that does not exist. THE RULES THAT HAD TO BE TOUCHED ARE EXACTLY THE
# ONES THAT DID NOT FOLLOW THAT PATTERN: two that named Fly VOLUME MOUNTPOINTS which no longer
# exist, one that was `noDataState: Alerting` on an app that is gone, and one whose only consumer
# was a webhook this host cannot reach.
#
apiVersion: 1

# Alert rules wired to the Fly managed Prometheus. Every expression below was
# validated against the live endpoint (org `personal`) before being committed —
# metric names and label shapes are real, not copied from docs (the docs'
# `fly_instance_exit_oom` does NOT exist in this org; Fly's own email covers the
# OOM kill, and rule "memory-pressure" below catches the pre-OOM condition).
#
# Each rule maps to a real past incident:
#   - cpu-credit-exhausted / cpu-throttled  -> 2026-06-07 web 93% steal (shared
#     vCPU credit exhaustion after the 5->19 city + zlib deploy)
#   - memory-pressure                       -> 2026-06-06 Mongo OOM cascade
#   - serving-app-down / http-5xx-high      -> the 502/503 web outage
#   - http-p95-high                         -> "percentiles suddenly increasing"
#
# noDataState is OK for traffic/credit metrics (a quiet hobby app legitimately
# has no HTTP series for minutes), EXCEPT serving-app-down where missing data IS
# the alarm.
groups:
  # ================================================================================================
  # AUDIT VERDICT FOR THIS GROUP (2026-08-29) -- `fly-resources`
  #
  #   KEEP  CPU credit exhausted (serving app)      kinowo is still on Fly; `app=~` + noData:OK, so
  #                                                 the retired kinowo-mongo/showtimes-* simply drop
  #                                                 out. Nothing to change.
  #   KEEP  CPU throttled (serving app)             As above.
  #   KEEP  CPU steal high                          As above. Steal is a property of Fly's shared
  #                                                 hosts and has no analogue on a dedicated Hetzner
  #                                                 vCPU, so this rule does not migrate -- it stays
  #                                                 pointed at the apps that are still on Fly.
  #   KEEP  Worker CPU starved (sustained throttle)  kinowo-worker is still on Fly.
  #   KEEP  Worker crash-looping                     As above.
  #   KEEP  Memory pressure (pre-OOM)                As above. The Hetzner hosts get their own
  #                                                 coverage from MemoryAvailableLow/Critical in
  #                                                 rules/host-health.rules; the two do not overlap
  #                                                 because they watch different machines.
  #   KEEP  Memory pressure building (PSI)           As above; rules/host-health.rules'
  #                                                 `MemoryStallHigh` is its Hetzner counterpart,
  #                                                 written from this rule's intent.
  #   DROP  Disk space low (persistent volume)       Fly volumes that no longer exist. Tombstone
  #                                                 below, at the point it was removed.
  #   DROP  Disk projected to fill within 7 days     Same. Tombstone below.
  #
  # EVERY "KEEP" ABOVE IS A KEEP WITH A CAVEAT, and the caveat is the same one for all of them: the
  # datasource has no token, so none of these is currently doing anything. See the header.
  # ================================================================================================
  - orgId: 1
    name: fly-resources
    folder: Fly Alerts
    interval: 1m
    rules:
      # ---- CPU credit exhaustion (the 93%-steal root cause) -----------------
      # Shared-cpu credit balance collapsing toward 0 on a serving app means it
      # is about to run at baseline only = the latency/steal incident. Worker is
      # excluded: it runs credit-starved by design (continuous scrape).
      - uid: kinowo-cpu-credit-exhausted
        title: CPU credit exhausted (serving app)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app }} shared-CPU credit balance is near zero'
          description: 'fly_instance_cpu_balance < 500 for 10m on {{ $labels.app }} ({{ $labels.instance }}). The machine is throttled to baseline CPU — this is the shape of the 2026-06-07 web 93%-steal incident. Check what deploy preceded it (deploy annotations on the dashboard).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'min by (app, instance) (fly_instance_cpu_balance{app=~"kinowo|kinowo-mongo|showtimes-.*"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [500] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- CPU actively throttled ------------------------------------------
      - uid: kinowo-cpu-throttled
        title: CPU throttled (serving app)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} is being CPU-throttled'
          description: 'rate(fly_instance_cpu_throttle) > 0.2 (throttled >20% of wall-clock) for 10m on {{ $labels.app }}. Serving latency will suffer.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max by (app, instance) (rate(fly_instance_cpu_throttle{app=~"kinowo|kinowo-mongo|showtimes-.*"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.2] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- CPU steal (host contention, secondary signal) -------------------
      - uid: kinowo-cpu-steal-high
        title: CPU steal high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} CPU steal > 25%'
          description: 'The hypervisor is stealing >25% of CPU from {{ $labels.app }} for 10m — noisy-neighbour or our own overcommit. Heap was fine in the 2026-06-07 incident; steal was the tell.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum by (app) (rate(fly_instance_cpu{mode="steal",app!="schowek"}[5m])) / sum by (app) (rate(fly_instance_cpu{app!="schowek"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.25] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Worker CPU starvation (sustained throttle, NOT the chronic low balance) -
      # The worker runs credit-starved by design, so the credit-balance alert above
      # excludes it (it would false-fire constantly). But sustained THROTTLE — actual
      # CPU denial, ~0 in normal low-balance operation — means the worker can't keep
      # up: a cold-boot scrape/enrich backlog, a heavy pass, or repeated reboots are
      # pinning it at baseline long enough to fall behind. 15m window so the expected
      # ~90s reboot blip (post boot-stagger fix) doesn't page; the 2026-06-12 episode
      # was 28m of >75% steal with throttle pinned high — this would have caught it.
      # WARM-JVM GUARD (`and on(app,instance) uptime > 1h`). A cold JVM legitimately
      # burns CPU re-JITing the whole scrape/parse surface, and a machine replaced by a
      # deploy starts at ~0 credit, so it is throttled to baseline for roughly an hour
      # while it warms. That flare is a KNOWN, self-limiting, harmless pattern (CPU-only,
      # 0 uncommon traps, bucket recovers — see reference_worker_jit_churn_c2), NOT a
      # starved worker. Without the guard this rule fired for ~31%% of a 24h window on
      # kinowo-worker and on every deploy for all three, which is noise that trains you to
      # ignore it. What IS actionable is sustained throttling on a JVM that has finished
      # warming, which is exactly what survives the guard.
      #
      # Deliberately NOT a fix for the underlying restart cadence, which IS a real gap.
      # Measured from the persistent /data/logs/worker.log (2026-07-18): "Worker starting"
      # outnumbers "received shutdown signal" EVERY day — 07-14 had 5 boots, 0 shutdown
      # signals and 1 commit, i.e. 5 restarts with no deploy at all; 07-13 7, 07-15 6,
      # 07-17 7. So kinowo-worker takes ~5-7 UNGRACEFUL restarts on a quiet day, and no
      # rule catches them: crash-looping needs >4/HOUR and this is ~0.3/hour.
      # (An earlier note here compared 7d restart averages across the three workers. That
      # was WRONG — -de/-uk had only 13.7/16.7 HOURS of series in that window vs pl's 158,
      # so the comparison measured metric availability, not restarts. Over a window where
      # all three have data the counts are comparable.)
      # Cause narrowed by ELIMINATION, not yet proven: not OOM (0 OutOfMemory markers in
      # worker-stderr.log, newest heap dump predates the index-only fix), not a JVM crash
      # (0 hs_err files), not the LivenessWatchdog (it has never logged "heartbeat stale"),
      # not a graceful drain. That leaves an external kill. To PROVE it, read the machine
      # event exit_code right after an ungraceful restart, BEFORE a deploy replaces the
      # machine and wipes its event history: flyctl machine status <id> -a kinowo-worker.
      - uid: kinowo-worker-cpu-starved
        title: Worker CPU starved (sustained throttle)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} is CPU-throttled for 15m+ (falling behind)'
          description: 'rate(fly_instance_cpu_throttle) > 0.2 on {{ $labels.app }}, on a JVM already up >1h (see the warm-JVM guard below) (throttled >20% of wall-clock) for 15m — the worker is starved past its baseline. Likely a cold-boot scrape/enrich backlog, a heavy pass, or repeated reboots. Check recent worker deploys/restarts and the queue depth (web queue-monitor page); if it recurs without a deploy, the fix is a bigger [[vm]] (more shared-CPU credit), not scheduling. Short reboot blips (~90s) are expected and sit below this 15m window.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max by (app, instance) (rate(fly_instance_cpu_throttle{app=~"kinowo-worker.*"}[5m])) and on (app, instance) ((time() - max by (app, instance) (process_start_time_seconds{app=~"kinowo-worker.*"})) > 3600)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.2] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Worker crash-looping (restarts far above the normal cadence) -----
      # The worker restarts a few times a day BY DESIGN — a JVM-internal non-heap
      # OOM (exit_code=3, ExitOnOutOfMemoryError) every ~5-6h; flyd restarts it in
      # 2s and credit recovers, so the baseline (~0.5 restarts/h) is not an
      # incident (see reference_worker_native_oom_and_disk). But a BURST — a bad
      # deploy, a boot failure, or the OOM cadence collapsing — is a crash loop.
      # >4 restarts in 1h clears the baseline with wide margin. `changes()` on the
      # ever-increasing process_start_time counts boots in the window.
      - uid: kinowo-worker-crash-looping
        title: Worker crash-looping
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} restarted > 4 times in the last hour'
          description: 'changes(process_start_time_seconds[1h]) > 4 on {{ $labels.app }} — the worker is restarting far above its normal ~5-6h cadence. Check the `flyctl machine status <id>` event log for the exit reason (exit_code=3 = ExitOnOutOfMemoryError native OOM; 126/127 = bad launcher; 1 = boot failure), recent worker deploys, and the "Kinowo — Worker Diagnostics" dashboard (native memory + RSS climb). See reference_worker_native_oom_and_disk.'
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max by (app, instance) (changes(process_start_time_seconds{app=~"kinowo-worker.*"}[1h]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [4] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Memory pressure (pre-OOM, the Mongo-cascade precursor) -----------
      - uid: kinowo-memory-pressure
        title: Memory pressure (pre-OOM)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} has < 8% memory available'
          description: 'fly_instance_memory_mem_available/total < 0.08 for 15m on {{ $labels.app }} ({{ $labels.instance }}). This is the runway to an OOM kill — the 2026-06-06 Mongo OOM cascaded into a web outage. Fly also emails on the actual kill.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'min by (app, instance) (fly_instance_memory_mem_available{app!="schowek"} / fly_instance_memory_mem_total{app!="schowek"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [0.08] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ================================================================================
      # DROPPED AT THE POST-MIGRATION AUDIT (2026-08-29): "Disk space low (persistent
      # volume)", uid kinowo-disk-space-low.
      #
      # It watched `fly_instance_filesystem_blocks_avail{mount=~"/data/db|/var/lib/grafana"}`
      # -- the Fly volumes belonging to the kinowo-mongo app and the kinowo-grafana app.
      # BOTH OF THOSE MACHINES ARE STOPPED AND SUPERSEDED: the database is on mongo-1 and
      # Grafana is on monitoring-1. There is no filesystem left for the rule to describe,
      # so it could never fire again for any reason other than a mistake.
      #
      # ITS JOB IS NOT LOST, it moved: nix/files/monitoring/rules/filesystem-capacity.rules
      # watches every mountpoint on all three Hetzner hosts through node_exporter, at 15%
      # (warning) and 7% (critical) free, and it watches INODES as well -- the axis the Fly
      # rule never had and the one that actually bit the fleet those rules were ported from.
      # /var/lib/mongodb and /var/lib/monitoring are covered there by the generic match
      # rather than by name, so a mount nobody remembered to list is still watched.
      #
      # THE INCIDENT IT WAS WRITTEN FOR STILL HAPPENED and is still worth knowing about: on
      # 2026-06-10 the Fly kinowo-mongo /data/db volume reached ~92%, mongod's FTDC thread
      # could not write its temp file, mongod aborted, and the crash-loop took web down with
      # it. Nothing alerted; it was found with `df`. That is precisely the shape the
      # filesystem-capacity rules exist to catch, on the machine that now holds that data.
      # ================================================================================

      # ================================================================================
      # DROPPED AT THE POST-MIGRATION AUDIT (2026-08-29): "Disk projected to fill within
      # 7 days", uid kinowo-disk-fill-projected.
      #
      # Same reason as the rule above it: it read `predict_linear` over
      # `fly_instance_filesystem_blocks_avail` on the SAME two Fly volumes, and those
      # volumes are gone with the machines they were attached to.
      #
      # REWRITTEN RATHER THAN ABANDONED. `FilesystemWillFillWithin7Days` in
      # nix/files/monitoring/rules/filesystem-capacity.rules keeps the intent, the 7-day
      # horizon and the 6-hour regression window, against node_exporter's series instead of
      # Fly's agent's. It adds one clause this rule did not need and the node version does:
      # a floor of 40% free, because on a nearly empty disk any slope at all extrapolates to
      # zero inside a week and the rule would otherwise never stop firing.
      # ================================================================================

      # ---- Memory PSI pressure (earliest pre-OOM lead indicator) -----------
      # Linux PSI "some" = % of wall-clock any task stalled waiting on memory. It
      # rises BEFORE mem_available collapses and well before the OOM kill, so it
      # leads the memory-pressure rule above (which watches the <8% avail floor).
      # The 2026-06-06 cascade was an OOM; this is the earliest tap on that
      # runway. Healthy idle boxes sit flat at 0, so a sustained avg60 > 5% is a
      # real, building squeeze. Covers the SPOF mongo + the web app.
      - uid: kinowo-memory-pressure-psi
        title: Memory pressure building (PSI)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} under sustained memory pressure (PSI)'
          description: 'fly_instance_memory_pressure_some (avg60) > 5% for 5m on {{ $labels.app }} ({{ $labels.instance }}) — tasks are stalling on memory allocation. This LEADS the mem-available collapse and the OOM kill that cascaded to a web outage on 2026-06-06. Check RSS/cache and consider a memory bump before it trips memory-pressure / OOMs.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max by (app, instance) (fly_instance_memory_pressure_some{app=~"kinowo|kinowo-mongo|showtimes-.*", pressure_duration="avg60"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

  # ================================================================================================
  # AUDIT VERDICT FOR THIS GROUP (2026-08-29) -- `fly-serving`
  #
  #   DROP     Mongo down                 The app is retired AND the rule was noDataState:Alerting,
  #                                       so it was firing permanently. Tombstone below. Replaced by
  #                                       `MongodNotRunning` in rules/mongodb.rules.
  #   KEEP     HTTP 5xx rate high         `kinowo` still serves from Fly and its edge 5xx rate is
  #                                       still the truest "are users seeing errors" signal this
  #                                       estate has. Nothing on Hetzner can replace it: the web
  #                                       tier is not here.
  #   KEEP     HTTP p95 latency high      As above.
  #   REWRITE  Serving app down           noDataState/execErrState Alerting -> OK, because the
  #                                       revoked token turned "no data" into a permanent page. The
  #                                       reasoning, and how to undo it, is written above the rule.
  #   KEEP     UK serving app down        Already handled correctly before the migration -- it was
  #                                       flipped to noDataState:OK when showtimes-uk was stopped on
  #                                       2026-08-02, with its own note explaining the restore. The
  #                                       migration changes nothing about it, so it is left exactly
  #                                       as found.
  # ================================================================================================
  - orgId: 1
    name: fly-serving
    folder: Fly Alerts
    interval: 1m
    rules:

      # ================================================================================
      # DROPPED AT THE POST-MIGRATION AUDIT (2026-08-29): "Mongo down", uid
      # kinowo-mongo-down.
      #
      # It read `max(fly_instance_up{app="kinowo-mongo"})` with `noDataState: Alerting` and
      # `execErrState: Alerting` -- deliberately, because when it was written a Mongo that
      # had stopped reporting WAS the alarm.
      #
      # THAT SETTING IS EXACTLY WHY IT COULD NOT BE LEFT IN PLACE. The kinowo-mongo app is
      # stopped, so the series is permanently absent; the Fly datasource has no working
      # token, so the query errors as well. Both states are configured to fire. This rule
      # was therefore a critical Telegram page every four hours, for ever, about a machine
      # that was retired on purpose -- and an always-firing critical does not merely add
      # noise, it teaches the channel that criticals can be ignored.
      #
      # REPLACED BY `MongodNotRunning` in nix/files/monitoring/rules/mongodb.rules, which
      # watches the unit state of the real database on mongo-1 through node_exporter's
      # systemd collector, with a 3-minute `for:` so an ordinary restart does not page. Note
      # what neither rule can do: say whether mongod is PRIMARY, or how much oplog window is
      # left. Both need a mongodb_exporter this fleet does not have, and mongodb.rules'
      # header says so at length rather than pretending otherwise.
      # ================================================================================

      # ---- HTTP 5xx rate ---------------------------------------------------
      - uid: kinowo-http-5xx-high
        title: HTTP 5xx rate high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.app }} serving > 5% 5xx'
          description: 'Over 5% of responses are 5xx for 5m on {{ $labels.app }} — the shape of the boot-crash-loop / Mongo-blocked-bind outage. Cross-check the latest deploy marker.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum by (app) (rate(fly_app_http_responses_count{status=~"5..",app!="schowek"}[5m])) / sum by (app) (rate(fly_app_http_responses_count{app!="schowek"}[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.05] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- HTTP p95 latency ------------------------------------------------
      - uid: kinowo-http-p95-high
        title: HTTP p95 latency high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} p95 latency > 2s'
          description: 'p95 response time > 2s for 10m on {{ $labels.app }} ("percentiles suddenly increasing"). Often the first visible symptom of CPU-credit exhaustion before it trips the credit alarm.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'histogram_quantile(0.95, sum by (app, le) (rate(fly_app_http_response_time_seconds_bucket{app!="schowek"}[5m])))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [2] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Serving app down ------------------------------------------------
      # The ONLY rule where missing data is the alarm: if kinowo stops reporting
      # fly_instance_up (machine gone / wedged), or reports 0, page after 3m.
      #
      # ================================================================================
      # REWRITTEN AT THE POST-MIGRATION AUDIT (2026-08-29). ONE CHANGE, TWO WORDS:
      # `noDataState` and `execErrState` were `Alerting` and are now `OK`.
      #
      # WHY, AND IT IS NOT BECAUSE THE OLD SETTING WAS WRONG. It was right, and it is
      # the setting this rule should go back to. It says "an app that has stopped
      # reporting is an app that is down", which is true of a healthy datasource and is
      # the whole point of watching `kinowo`.
      #
      # IT IS NOT TRUE OF THIS DATASOURCE TODAY. The `fly-prometheus` token was revoked
      # and cannot be reissued (see this file's header), so EVERY query through it
      # returns an execution error -- which `execErrState: Alerting` turns into a firing
      # critical. The result is a permanent, unresolvable "Serving app down" page every
      # four hours about a web tier that is, in fact, up. That does more damage than
      # having no rule: a critical that is always on is a critical nobody reads, and this
      # channel carries the mongod, WireGuard and filesystem criticals too.
      #
      # THIS IS EXACTLY THE PRECEDENT ALREADY SET IN THIS FILE by `showtimes-uk-serving-down`
      # below, which was flipped to OK for the same reason (a permanently absent series
      # turning a 3-minute `for:` into a page every four hours, for ever) and kept rather
      # than deleted so that restoring it is a one-word edit.
      #
      # WHAT IS LOST WHILE IT IS OK: the case this rule was written for -- kinowo's
      # machine vanishing entirely. What it still catches: a machine that is up and
      # reporting `fly_instance_up == 0`, which needs the datasource to work anyway.
      # Realistically, nothing here watches the Fly web tier until there is a token.
      #
      # ON RESTORE, put BOTH back to `Alerting` in the same edit as the new token. A
      # token without this flip leaves the fleet's most important Fly rule silent.
      # ================================================================================
      # ---- The web tier is down (k3s) --------------------------------------
      # THE RULE THAT ACTUALLY WATCHES THE PRODUCT since 2026-08-29, and the reason the two
      # `fly_instance_up` rules below no longer do.
      #
      # Moving the web tier onto k3s took every `fly_instance_up{app="kinowo"}` series with it.
      # Those rules were already `noDataState: OK` (see the long note below), so the migration
      # did not make them page -- it made them SILENT, which is worse and is invisible: a
      # critical that can never fire looks exactly like a critical that never needed to.
      #
      # This one keys on the fleet's own Prometheus instead, which scrapes all three web pods
      # by NodePort (`job="kinowo-web"`, see infra/nix/files/monitoring/scrape-kinowo-apps.yaml).
      # `min by (instance)` so ONE country going dark fires while the others are healthy, and
      # names which in the notification -- the three run the same image but different databases,
      # so they fail independently.
      #
      # `noDataState: Alerting`, unlike the Fly rules: these targets are STATIC, so the series
      # exists from the moment the scrape config lands and absence means Prometheus itself has
      # stopped seeing them. The cost of that honesty is that this fires during the bootstrap
      # window between the scrape config landing and the pods first serving; that window is a
      # deliberate deploy, not a surprise (see docs/domain-cutover.md).
      - uid: kinowo-web-serving-down
        title: Web tier down (k3s)
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: 'kinowo web pod {{ $labels.instance }} is down or not reporting'
          description: 'up{job="kinowo-web"} is 0 for 3m on {{ $labels.instance }} — that country''s user-facing site is unreachable. Check `k3s kubectl -n kinowo get pods -l app=web` on monitoring-1, the pod logs, and Mongo (a Mongo hiccup blocks web boot). If every instance is down together, suspect Mongo or the node rather than the app.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: local-prometheus
            model:
              datasource: { type: prometheus, uid: local-prometheus }
              editorMode: code
              expr: 'min by (instance) (up{job="kinowo-web"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      - uid: kinowo-serving-down
        title: Serving app down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'kinowo (web, Fly) is down or not reporting'
          description: 'DORMANT since the web tier moved to k3s on 2026-08-29 — `fly_instance_up{app="kinowo"}` is permanently absent and this rule cannot fire. `kinowo-web-serving-down` above is what watches the live tier. Kept only for the documented Fly rollback (main.yml matrix `enabled: true` + `flyctl scale count 1`); retire it with the Fly app.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max (fly_instance_up{app="kinowo"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- UK serving app down ---------------------------------------------
      # The showtimes-uk web app (KINOWO_COUNTRY=uk, London) is the UK-facing
      # sibling of `kinowo`. A separate rule (not a broadened app=~ matcher on the
      # rule above) so each app gets its own clean attribution and its own Telegram
      # thread (the policy groups by alertname+app).
      #
      # ⚠️ `noDataState`/`execErrState` are OK here, NOT Alerting like the `kinowo`
      # rule above — the ONE line that differs, and the reason is the whole story.
      # showtimes-uk was stopped on 2026-08-02 to cut hosting cost, so
      # `fly_instance_up{app="showtimes-uk"}` is now permanently ABSENT: the
      # expected state, not an alarm. On Alerting, absence + `for: 3m` + the policy's
      # 4h repeat_interval is a critical Telegram page every 4 hours, forever.
      #
      # The rule is kept rather than deleted so the UK's monitoring survives the
      # shutdown intact and restoring is a one-word edit. What it still catches:
      # a machine that is UP and reporting `fly_instance_up == 0`. What it no
      # longer catches while the app is down: the app vanishing — which is
      # precisely the state we put it in deliberately.
      #
      # ON RESTORE: set both back to `Alerting`, so absence is the alarm again for
      # an app that is once more supposed to be running. See docs/restoring-a-country.md.
      - uid: showtimes-uk-serving-down
        title: UK serving app down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: 'showtimes-uk (UK web, Fly) is down or not reporting — DORMANT, see kinowo-web-serving-down'
          description: 'fly_instance_up{app="showtimes-uk"} is 0 for 3m — the UK user-facing app is unreachable. Check `fly status -a showtimes-uk` and Mongo (a Mongo hiccup blocks web boot; UK reads the same cluster, db kinowo_uk). While the UK deployment is stopped this rule is deliberately silent on absence — see the noDataState note above.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max (fly_instance_up{app="showtimes-uk"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # The fleet rules that reach these apps by `app=~` regex (CPU credit,
      # throttle, memory PSI, worker starvation/crash-loop/credit) were LEFT
      # UNTOUCHED by the shutdown: every one is already `noDataState: OK`, so a
      # stopped machine drops out of them silently, and the regexes stay
      # country-blind — which is what GrafanaCountryBlindAppMatcherSpec requires
      # while the fly.*.toml files are still checked in. Same for every dashboard
      # panel: the de/uk series simply render empty until those apps report again.

  # ── App uptime (the in-app /uptime health, via the web /metrics scrape) ───────
  # These watch the SAME data the public /uptime page shows — the Mongo
  # `uptimeBuckets` health that Fly's host metrics can't see — exposed as
  # Prometheus gauges by web's MetricsController (kinowo_uptime_recent_* over a
  # 30-min window) and scraped via the [[metrics]] block in fly.toml.
  # ================================================================================================
  # AUDIT VERDICT FOR THIS GROUP (2026-08-29) -- `app-uptime`: ALL SIX KEPT, UNCHANGED.
  #
  #   KEEP  Residential proxy failing (falling back to Zyte)
  #   KEEP  Enrichment source failing (ratings stopped refreshing)
  #   KEEP  Films served per city swung suddenly
  #   KEEP  City serving zero films (was active)
  #   KEEP  Showtime volume collapsed (country)
  #   KEEP  Corpus census stuck (country)
  #
  # WHY THIS GROUP NEEDED NO EDITS AT ALL, unlike the two above it: these rules read `kinowo_*`
  # gauges published by the APPLICATION -- the web tier's MetricsController and the worker's own
  # instrumentation -- not `fly_instance_*` produced by Fly's host agent. They are statements about
  # the product (is any city serving zero films? did a country's showtime volume collapse?), and
  # the product did not move. Every one of them will be exactly as correct on the day these
  # services run on Hetzner as it was on Fly.
  #
  # WHAT DID CHANGE IS ONLY HOW THE NUMBERS REACH GRAFANA, and it changed for the worse in two
  # independent ways, either of which alone is enough to make this whole group inert today:
  #
  #   1. They are queried through `fly-prometheus`, whose token is revoked (see the header).
  #   2. Even with a token, Fly's managed Prometheus runs these series 15-25 MINUTES BEHIND -- which
  #      is why the Fly deployment ran a VictoriaMetrics sidecar scraping the apps directly over 6PN
  #      as the `app-metrics-live` datasource. monitoring-1 has no 6PN path, so that sidecar has no
  #      equivalent here; roles/grafana.nix's header names this as a known, unfixed gap.
  #
  # THE REAL FIX FOR BOTH IS THE SAME ONE and it is not a rule edit: give monitoring-1 its own Fly
  # WireGuard peer, exactly as roles/wireguard-fly.nix does for mongo-1, and let the LOCAL
  # Prometheus scrape the apps' /metrics endpoints directly. That would make this group work
  # against `local-prometheus` with no token at all -- at which point the datasource uid in these
  # six rules is the only thing that needs changing.
  # ================================================================================================
  - orgId: 1
    name: app-uptime
    folder: Fly Alerts
    interval: 1m
    rules:
      # ---- Residential (Decodo) proxy failing -----------------------------
      # The proxy egress for the Cloudflare-blocked cinemas (Multikino, biletyna)
      # sits behind a Zyte/direct fallback, so when it dies EVERY cinema bar stays
      # green and only the "Residential proxy" /uptime row goes red — a silent
      # failure nobody watches while the Zyte bill (~$25/mo vs the proxy's ~$2)
      # quietly returns. This is exactly the 2026-06-16 incident (Decodo's per-IP
      # "Limit: 3" concurrent-auth cap rolled everything to Zyte for hours,
      # unnoticed). Alert on the recent failure RATIO: failures /
      # (failures+successes) over the last 30 min. clamp_min keeps an idle/low-
      # volume window from dividing by zero; an absent series (proxy disabled, no
      # KINOWO_PROXY_* secrets) yields no data → no alarm. Warning, not critical:
      # scraping never breaks (the fallback serves), it's a cost + capability
      # regression, so 15m of sustained majority-failure is the right trip.
      - uid: kinowo-residential-proxy-failing
        title: Residential proxy failing (falling back to Zyte)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'The Decodo residential proxy is mostly failing — cinema scrapes are falling back to Zyte'
          description: 'Over half of the residential-proxy fetches in the last 30 min failed (kinowo_uptime_recent_failures vs _recent_successes for service "Residential proxy"). Scraping still works via the Zyte/direct fallback so no cinema is down — but the flat-fee Decodo proxy is not serving and the per-request Zyte egress is back in use. Check the "Residential proxy" row on https://kinowo.net/uptime for the error text (per-IP "Limit: 3" auth cap, 401/407, or a burned IP), and the Decodo dashboard. See reference_decodo_isp_proxy.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum(kinowo_uptime_recent_failures{service="Residential proxy"}) / clamp_min(sum(kinowo_uptime_recent_failures{service="Residential proxy"}) + sum(kinowo_uptime_recent_successes{service="Residential proxy"}), 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- An enrichment source is refusing us --------------------------------
      # 2026-07-30: IMDb's GraphQL CDN started 403-ing every request that didn't
      # name a client. Ratings stopped refreshing in all three countries for ~47
      # hours and nothing paged, even though every piece of detection already
      # existed — HttpOutcome splits 403 into its own series precisely so "a host
      # refusing us" is legible, and MonitoringHttpFetch already counted it as an
      # IMDb failure, so /uptime showed the source 100% failed for two days. The
      # gap was that no rule read any of it.
      #
      # Same shape as the residential-proxy rule above, and for the same reason:
      # a source dying is SILENT. Ratings are best-effort, so nothing 5xxs, no
      # page goes blank, and the stored ratings simply freeze at their last value
      # — the failure is invisible except as a badge that quietly stops moving.
      #
      # Grouped `by (service, country)` because one dead source among five reads
      # as roughly a fifth of enrichment traffic failing when summed fleet-wide,
      # which trips nothing; per source it is unmissable and the alert names the
      # source that died. Ratio rather than a raw count because the Metacritic /
      # RT / Filmweb resolvers probe candidate slugs that 404 by design, so a
      # failure count is never zero — only failures/(failures+successes)
      # distinguishes routine probe misses from a wholesale refusal. clamp_min
      # keeps an idle window from dividing by zero; an absent series (a country
      # not exporting yet) yields no data → no alarm.
      #
      # Warning, not critical, and a slow 30m trip: no user-facing page breaks,
      # ratings are retried forever, and a brief upstream wobble (Cloudflare
      # challenging a probe burst) must not page. 30m of a source majority-
      # failing is still ~94x faster than the 47h this took to notice by eye.
      - uid: kinowo-enrichment-source-failing
        title: Enrichment source failing (ratings stopped refreshing)
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: 'An enrichment source is mostly failing — its ratings have stopped refreshing'
          description: 'Over half of the fetches to one enrichment source (IMDb / TMDB / Filmweb / Metacritic / Rotten Tomatoes) failed in the last 30 min — kinowo_uptime_recent_failures vs _recent_successes, per service. Nothing user-facing is down: stored ratings keep serving, they just freeze at their last value, which is why this class of outage goes unnoticed (IMDb 2026-07-30, ~47h). Check the source''s row on https://kinowo.net/uptime for the error text. A 403 across the board is the upstream refusing our requests wholesale — usually a new header/auth requirement rather than a ban; the IMDb case was fixed by naming ourselves via RealHttpFetch.HostPolicies headers.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum by (service, country) (kinowo_uptime_recent_failures{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}) / clamp_min(sum by (service, country) (kinowo_uptime_recent_failures{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}) + sum by (service, country) (kinowo_uptime_recent_successes{service=~"IMDb|TMDB|Filmweb|Metacritic|Rotten Tomatoes"}), 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Per-city served-film count swung suddenly (either direction) -----
      # The web exposes kinowo_web_movies_served{city,scope} — distinct films
      # served per /:city/ page, sampled every minute from the real serving path
      # (all future showings / showing tomorrow). This rule fires when a city's
      # count deviates from its own trailing 1h average by >50% AND by >=4 films
      # — in EITHER direction (abs()). The relative test catches the shape of a
      # read-model outage (a malformed web_movies row empties the corpus → a city
      # craters to 0); the absolute >=4 floor suppresses the noise of tiny-town
      # cities where +-2 films is a normal day-to-day swing. It's inherently a
      # TRANSITION ping (the 1h baseline catches up within ~an hour, so it
      # self-resolves); the city-empty rule below is the companion that keeps
      # paging while a city stays dark.
      - uid: kinowo-movies-served-swing
        title: Films served per city swung suddenly
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.city }} ({{ $labels.scope }}) film count swung sharply vs its 1h average'
          description: 'kinowo_web_movies_served for city "{{ $labels.city }}" scope "{{ $labels.scope }}" is >50% and >=4 films off its trailing 1h average — a sudden jump or drop in what the web is serving. A drop is the read-model-outage shape (a malformed web_movies row empties the corpus, every city craters); a jump can be a scrape/projection anomaly. Check https://kinowo.net/{{ $labels.city }}/ and the "films served per city" dashboard panel.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: '(abs(kinowo_web_movies_served - avg_over_time(kinowo_web_movies_served[1h])) / clamp_min(avg_over_time(kinowo_web_movies_served[1h]), 1)) and (abs(kinowo_web_movies_served - avg_over_time(kinowo_web_movies_served[1h])) >= 4)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- A city that WAS serving films dropped to zero (sustained) --------
      # The defensive floor under the swing rule above (which self-resolves once
      # its 1h baseline decays). Fires when a city's all-scope count is 0 now AND
      # averaged >=4 over the last 6h — i.e. it was genuinely serving films and
      # went dark, NOT a tiny city that is simply empty by nature (those never
      # satisfy the 6h>=4 guard, so they don't page). The 6h baseline keeps this
      # firing for hours while the city stays at 0 — that's the read-model-outage
      # signal the swing alert can't hold. Resolves (noData → OK) the moment the
      # city serves a film again.
      - uid: kinowo-movies-served-city-empty
        title: City serving zero films (was active)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.city }} is serving ZERO films (it was active in the last 6h)'
          description: 'kinowo_web_movies_served{city="{{ $labels.city }}",scope="all"} has been 0 for 5m despite a >=4 film average over the last 6h — the city went dark. The likely cause is a read-model outage (a malformed web_movies document makes the web''s findAllMovies throw and empties the whole corpus → every city to 0; see reference_web_movies_required_ratings_outage). Check web logs for "findAllMovies failed" / "Missing field", and https://kinowo.net/{{ $labels.city }}/.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: '(kinowo_web_movies_served{scope="all"} == 0) and (avg_over_time(kinowo_web_movies_served{scope="all"}[6h] offset 10m) >= 4)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- A country's SLOT VOLUME collapsed (films flat, showtimes gone) ---
      # The two rules above count distinct FILMS, and are structurally blind to
      # a chain dropping every evening slot of every film it carries: the card
      # stays, the schedule empties, neither rule moves. kinowo_worker_showtimes
      # is the volume complement — upcoming single dated slots the source corpus
      # would serve, per country and city, sampled through the real projection
      # path. This rule is what makes that panel page.
      #
      # 2026-07-27: the UK fell 152,315 -> ~40,000 upcoming slots in six hours
      # (London 22,066 -> 9,956) while its film count ROSE over the same window,
      # 1,271 -> 1,559 rows (corpus_movies{subset="total"} — note the other
      # subsets overlap it, so summing them over-counts the corpus ~6x). Slots at
      # a 24h low with films at a high is the whole signal: the loss cannot be a
      # scrape outage, because a dead cinema takes its films with it. The
      # sibling countries stayed put throughout (PL ~900 films / ~36k slots flat;
      # DE refilled to 1,198 / ~59k and HELD), so it is not a fleet-wide effect
      # either. The swing rule above was live and silent
      # the whole time, because its baseline is avg_over_time(...[1h]) — over a
      # multi-hour bleed the reference falls with the metric and the ratio never
      # trips. The fix is a baseline LONGER than the incident.
      #
      # max_over_time (not avg) is the baseline on purpose: a restart walks the
      # gauge up from a cold scan, so the series carries low samples that are not
      # losses. The peak of the window is therefore the trustworthy sample, and an
      # averaged baseline would be dragged down by exactly that noise.
      #
      # WHAT THIS RULE CAN NO LONGER SEE: a truncated corpus pass. It used to
      # publish what it had read, so a read fault dragged the gauge down and this
      # ratio with it. WorkerShowtimesMetrics.publish() now gates on scanComplete
      # and publishes NOTHING on a partial pass, so the gauge FREEZES at its last
      # complete value — and a frozen numerator over a frozen max_over_time
      # denominator is a flat 1.0 that never trips. That failure mode moved to
      # kinowo-corpus-census-stuck below; the two rules are complements, not
      # overlaps, and neither covers the other's shape.
      #
      # Per country, never fleet-wide: the UK's 63% loss was only a 27% dent in
      # sum(kinowo_worker_showtimes) because PL and DE were healthy. Backtested
      # over the 7 days to 2026-07-27 (~1,000 country-samples, including the DE
      # scrape starvation and the PL/DE overnight refills): the ratio never went
      # below 0.6 for any healthy country (DE floor 0.707, PL floor 0.796) and
      # went below only for the UK, only during the incident (floor 0.09) — so
      # 0.6 has real margin on both sides. `for: 30m` rides out the re-climb
      # after a worker restart, which walks the gauge back up from a cold scan.
      - uid: kinowo-showtime-volume-collapsed
        title: Showtime volume collapsed (country)
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.country }} is serving under 60% of its 6h peak showtime volume'
          description: 'sum by (country) (kinowo_worker_showtimes) for "{{ $labels.country }}" has been below 60% of its own 6h peak for 30m — upcoming showtimes are disappearing without whole films disappearing with them, so the film-count alerts stay green. Check the "total upcoming showtimes served" panel on the Fly-health dashboard scoped to this country, compare kinowo_worker_corpus_movies (flat corpus + falling slots = the slots are being lost in projection/storage, not in scraping), and check the worker''s removal audit for scrape-prune / reproject-trim bursts. See project_uk_slot_volume_collapse.'
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum by (country) (kinowo_worker_showtimes) / clamp_min(max_over_time(sum by (country) (kinowo_worker_showtimes)[6h:10m]), 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [0.6] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- A country's corpus census stopped reading (gauges frozen) --------
      # Every census gauge on the Fly-health dashboard — kinowo_worker_corpus_movies,
      # kinowo_worker_movies_served, kinowo_worker_showtimes — comes from ONE paged
      # scan of `movies` every 5 min, and each of them now SKIPS its publish when
      # that scan could not read every row. That is the right call for the gauges
      # (a partial count is fewer rows read, not a smaller corpus, and 2026-07-27's
      # `Missing field: sourceData` decode bug published total=0 for ~50 min while
      # the corpus sat intact at 943 films) — but it means a total read failure now
      # renders as three flat, plausible, entirely stale lines and pages nobody:
      # the swing/floor rules see no swing, and the collapse rule above sees a
      # frozen ratio of 1.0. This counter is the only remaining evidence, so it is
      # the only thing that can carry the alert.
      #
      # Any incomplete pass at all is worth a page: the scan is read-only and
      # keyset-paged over a collection the worker reads constantly, so a batch that
      # fails is a real fault (decode, connection, timeout), not routine noise. The
      # counter is materialized at 0 per country from boot, so `increase` has a
      # baseline to move off immediately rather than only once it has gone wrong.
      # `for: 10m` over a 30m window means two consecutive failed 5-min passes, not
      # one — a single transient miss self-heals on the next tick and the gauges
      # were only one sample stale.
      - uid: kinowo-corpus-census-stuck
        title: Corpus census stuck (country)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.country }} corpus census cannot read the whole collection — its census gauges are frozen'
          description: 'kinowo_worker_corpus_scan_incomplete_total is rising for "{{ $labels.country }}": the 5-minute corpus scan is failing to read every row, so kinowo_worker_corpus_movies / _movies_served / _showtimes have STOPPED publishing and are showing their last complete values. Treat every census panel on the Fly-health dashboard as stale until this clears — including the ones the showtime-collapse and films-served alerts read, which cannot fire on a frozen gauge. Check the worker logs for `worker-corpus-scan: corpus scan incomplete` and for the decode/read error underneath it (2026-07-27 was a required-field decode bug failing every batch; see reference_failed_read_is_not_data).'
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'sum by (country) (increase(kinowo_worker_corpus_scan_incomplete_total[30m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [1] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

  # ================================================================================================
  # AUDIT VERDICT FOR THIS GROUP (2026-08-29) -- `worker-throttle`
  #
  #   DROP  Worker credit low (drive backoff)          Its only consumer was a webhook this host
  #                                                    cannot reach. Tombstone inside the group,
  #                                                    where the rule was.
  #   KEEP  Worker throttling                          Reports that the worker IS backing off, for
  #                                                    any reason, from the app's own
  #                                                    `kinowo_worker_throttled` gauge. Still true,
  #                                                    still a useful human heads-up.
  #   KEEP  Worker task queue head-of-line age high    Application queue health; nothing to do with
  #                                                    Fly beyond how the number is fetched.
  #   KEEP  Worker task queue backlog high             As above.
  #
  # THE GROUP NAME IS NOW HALF A LIE AND IT IS LEFT ALONE DELIBERATELY. With the control rule gone
  # this group throttles nothing -- the three survivors are plain notifications. Renaming it would
  # change the group identity Grafana keys alert state on, for a cosmetic gain, and would diverge
  # this copy from the Fly original by more than the audit already has. If the 6PN peer is ever
  # added and the control rule comes back, the name becomes accurate again.
  #
  # THE 30s `interval` BELOW IS ALSO NOW OVERSPECIFIED, and is likewise left alone: it was 30s
  # because a control loop wants to react quickly, and the three remaining rules would be perfectly
  # happy at 1m. It costs three extra queries a minute against a datasource that 401s. Not worth an
  # edit today; worth one if this group ever stops being a control loop for good.
  # ================================================================================================
  #
  # ---- Worker CPU-credit throttle CONTROL (drives the worker's /throttle) -----
  # HISTORICAL. The rule this paragraph describes was dropped at the audit -- see the tombstone
  # inside the group below. It is kept here because it is the only written record of how the
  # credit-driven backoff loop actually worked, and restoring that loop means restoring exactly
  # this.
  #
  # NOT a page. The worker runs credit-starved by design; this rule is the
  # external "credit logic" for its self-heal backoff. When kinowo-worker's
  # shared-CPU credit balance drops below ~5k (its 2x cap is ~8k) the rule FIRES →
  # the WorkerThrottle webhook POSTs http://kinowo-worker.internal:9000/throttle →
  # ExternalThrottleGate flips on → all reapers (scrape/ratings/detail/tmdb) back
  # off enqueue → the pool idles → credit rebuilds → balance climbs back above 5k →
  # the alert RESOLVES → webhook (status=resolved) → reapers resume. The threshold
  # lives HERE, outside the worker (it only receives firing/resolved). 30s eval over
  # a 2-min AVERAGE of the balance + `for: 1m` so a single spurious low/zero scrape
  # sample (fly_instance_cpu_balance is occasionally noisy) can't trip the backoff —
  # it was firing while the dashboard balance sat well above 6k because the old rule
  # read ONE instantaneous sample with `for: 0`. Routed to WorkerThrottle (NOT
  # Telegram) by the `notify: worker-throttle` label. noData/execErr = OK (never
  # throttle on a missing/erroring balance — fail-safe).
  - orgId: 1
    name: worker-throttle
    folder: Fly Alerts
    interval: 30s
    rules:
      # ================================================================================
      # DROPPED AT THE POST-MIGRATION AUDIT (2026-08-29): "Worker credit low (drive
      # backoff)", uid kinowo-worker-credit-low.
      #
      # THIS RULE WAS NEVER A PAGE -- it was a CONTROL LOOP. It fired on kinowo-worker's Fly
      # CPU-credit balance falling under 6000, and the `notify: worker-throttle` label routed
      # it to a webhook contact point that POSTed to
      # http://kinowo-worker.internal:9000/throttle over Fly 6PN, which flipped
      # ExternalThrottleGate on and made the reapers back off until credit rebuilt. The
      # threshold lived out here precisely so the worker only had to receive firing/resolved.
      #
      # THE WEBHOOK IT DROVE DOES NOT EXIST ON THIS HOST. monitoring-1 is not a Fly 6PN peer
      # -- only mongo-1 is (roles/wireguard-fly.nix) -- so the three `WorkerThrottle*` contact
      # points were deliberately not carried across, and grafana-contactpoints.yaml says so in
      # its own header. With no receiver named `worker-throttle`, this rule falls through to
      # the root policy and arrives on TELEGRAM instead: a critical-looking page about a
      # shared-CPU credit balance, every hour, that nobody can act on and that no longer
      # throttles anything. A control signal delivered to a human is not a quieter version of
      # a control loop; it is noise plus a broken control loop.
      #
      # WHAT IS LOST, STATED PLAINLY: the worker's external credit-based backoff. Its
      # IN-PROCESS scrape-duration backstop is unaffected and still runs, and
      # `kinowo_worker_throttled` (the rule immediately below) still reports when the worker
      # is backing off for any reason. RESTORING THE LOOP means giving monitoring-1 a 6PN peer
      # of its own, at which point this rule and the webhook contact points come back together
      # from the Fly copy verbatim -- both, or neither.
      # ================================================================================

      # ---- Worker throttle NOTIFICATION (Telegram on start / end) -----------------
      # A human heads-up, separate from the control gate above. Fires to Telegram
      # whenever the worker is ACTUALLY backing off — the kinowo_worker_throttled
      # gauge = 1, set from the live composite signal, so it covers BOTH the external
      # credit gate AND the in-process scrape-duration backstop (not just credit).
      # `for: 2m` so a brief EWMA blip doesn't message; firing = "throttling started",
      # resolved = "ended" (the Telegram contact point sends both). NO `notify` label,
      # so it falls through to the default Telegram receiver, not the /throttle webhook.
      - uid: kinowo-worker-throttled
        title: Worker throttling
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: 'kinowo-worker is throttling — reapers backing off to let CPU credit rebuild'
          description: 'kinowo_worker_throttled = 1 for 2m: the worker is backing off all reapers (the credit gate or the scrape-duration backstop tripped). Expected under load on shared CPU; this resolves when it returns to full enqueue.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max(kinowo_worker_throttled{app="kinowo-worker"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Task-queue head-of-line starvation ------------------------------------
      # The EARLIEST symptom of a throttle/backlog spiral. During the 2026-06-23
      # episode the oldest waiting task aged to ~29min while credit drained for two
      # HOURS before anyone looked — this gauge crossing 10min would have paged at
      # ~04:00, long before the floor at 05:00. `for: 5m` so a brief reaper pause
      # doesn't message. Human Telegram heads-up (no `notify` label → default
      # receiver), not the /throttle control webhook.
      - uid: kinowo-worker-task-age-high
        title: Worker task queue head-of-line age high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: 'kinowo-worker oldest waiting task > 10min — the queue is not draining'
          description: 'kinowo_worker_queue_oldest_waiting_age_seconds > 600 for 5m: the head of the task queue has been waiting over ten minutes, so the worker pool is not keeping up (a CPU-credit throttle spiral, a wedged reaper, or a slow-host backlog). The earliest signal of the sustained-throttle failure mode.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max(kinowo_worker_queue_oldest_waiting_age_seconds{app="kinowo-worker"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [600] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C

      # ---- Task-queue backlog depth ----------------------------------------------
      # Backs up the age signal with a volume one: a large WAITING set that isn't
      # draining. Normal steady state is ~0 (work is claimed near-instantly); the
      # spiral piled 286→568. `for: 10m` rides out the brief post-boot flush (the
      # 568 blip cleared in ~4min) and only fires on a genuinely stuck backlog.
      - uid: kinowo-worker-queue-backlog
        title: Worker task queue backlog high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: 'kinowo-worker waiting task backlog > 150 for 10min — pool not keeping up'
          description: 'kinowo_worker_queue_depth{state="waiting"} > 150 for 10m: the waiting task set has stayed large, so the worker pool is not draining it (throttle spiral or a stuck reaper). Pairs with kinowo-worker-task-age-high.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: fly-prometheus
            model:
              datasource: { type: prometheus, uid: fly-prometheus }
              editorMode: code
              expr: 'max(kinowo_worker_queue_depth{app="kinowo-worker", state="waiting"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [150] }
                  operator: { type: and }
                  query: { params: [] }
                  reducer: { type: last, params: [] }
              refId: C
