// SCALAFIX (scripts/scalafix-organize; scripts/scalafix-move adds its MoveSymbol rule on the command line). The build
// compiles Scala 3 with -Wunused:all -Werror, so RemoveUnused finds what the compile already refuses; OrganizeImports
// sorts each source's imports into three groups -- java/javax, scala, everything else -- keeping how each import groups
// its selectors (`import a.{B, C}` stays one import) and their order, so the rewrite moves lines, never re-spells them.
rules = [RemoveUnused, OrganizeImports]
OrganizeImports {
  targetDialect = Scala3
  removeUnused = false
  groupedImports = Keep
  importSelectorsOrder = Keep
  groups = ["re:javax?\\.", "scala.", "*"]
}
