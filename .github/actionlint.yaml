# actionlint's built-in GitHub-hosted label list (1.7.12) predates the Ubuntu 26.04 image, a hosted
# runner GitHub announced in actions/runner-images#14748. Listed here so the lint knows it; drop the
# entry once actionlint ships it.
self-hosted-runner:
    labels:
        - ubuntu-26.04
# Its bundled metadata for actions/create-github-app-token@v3 (1.7.12, 2026-03-30) predates v3's `client-id` input
# (which replaced the deprecated, no longer required `app-id`), so it calls client-id unknown and app-id missing.
# Drop these once actionlint ships the newer metadata (ActionPinningSpec keeps every step on client-id).
paths:
    .github/workflows/**/*.{yml,yaml}:
        ignore:
            - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
            - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
