# CI TIMINGS' HISTORY, into Prometheus once: every finished run on main of the last 90 days, as GitHub's run list
# holds them, so the CI board's trends reach back as far as Prometheus keeps (scripts/ci/ci_timings.py's header).
#
# Its input is a file, not GitHub's API: a run's jobs are one API call each, thousands for 90 days, and the
# GITHUB_TOKEN's 1000 requests an hour are the whole repository's -- a backfill reading them here would starve every
# convergence leg's own `gh` calls. So a person writes it with their own token and puts it on the fixture release:
#
#   python3 scripts/ci/ci_timings.py --repo pawelkrupinski/movies --history-days 90 --out ci-timings-history.jsonl
#   gzip ci-timings-history.jsonl && gh release upload convergence-fixtures ci-timings-history.jsonl.gz --clobber
#   gh workflow run "CI timings backfill"
#
# and this pushes it with the token only CI holds, then deletes it. Pushing the same history again is harmless: every
# sample is stamped at its run's start, so a re-push is an identical duplicate.
name: CI timings backfill

on:
    workflow_dispatch:
        inputs:
            asset:
                description: The fixture release's asset holding the history (ci_timings.py --history-days).
                required: false
                default: ci-timings-history.jsonl.gz

permissions: {}

jobs:
    backfill:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        env:
            FIXTURE_RELEASE_TAG: convergence-fixtures
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
            - name: Push the history to Prometheus
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  ASSET: ${{ inputs.asset }}
                  GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
                  GRAFANA_ANNOTATION_TOKEN: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
              run: |
                  set -euo pipefail
                  mkdir -p history
                  gh release download "$FIXTURE_RELEASE_TAG" --pattern "$ASSET" --dir history
                  gunzip -f "history/$ASSET"
                  python3 scripts/ci/ci_timings.py --push-file "history/${ASSET%.gz}"
                  # Only a history pushed whole is deleted: one that was not stays for the next dispatch.
                  scripts/ci/gh-release.sh delete-asset "$FIXTURE_RELEASE_TAG" "$ASSET" -y

    # EVERY JOB'S AND STEP'S TIME, in this run's log and summary and on Grafana's CI dashboards
    # (.github/actions/report-timings). After every other job but the failure report; never fails the run.
    timings:
        needs: [backfill]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/report-timings
                  sparse-checkout-cone-mode: false
            - uses: ./.github/actions/report-timings
              with:
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
