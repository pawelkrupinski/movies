#
# DOES THE NEWEST RECORDING DECIDE THE SAME READ AS PROD READS IT? integration.LeanWholeGuard resolves each country's
# recording read LEAN -- as prod's identity model reads the scrape archives (services.identity.ModelRead), and as every
# measurement now replays them -- and read WHOLE, every screening day kept, and names each rule firing on whole data
# only. Such a rule measured cured while dead in prod until 2026-10-21: four were, 10-15 to 10-21 (17da3656b), because
# the measurements replayed the recordings whole. Measurements read lean now; this is the one place that reads whole,
# to say which rules a lean read starves.
#
# A FINDINGS REPORT, not a gate: the per-rule summary goes to the run's summary and, with each differing listing
# (lean-whole-<cc>.tsv), to the `identity-lean-whole` artifact. Red when a TAKE differs between the reads (a rule
# deciding a film is dead in prod); not one of the red-build gate's workflows, since a push neither makes nor mends a
# recording. After each recording on main, and by hand (`run-id`: any recording's run).
#
name: Identity lean vs whole

on:
    workflow_run:
        workflows: [Record scrape fixtures]
        types: [completed]
    workflow_dispatch:
        inputs:
            run-id:
                description: The Record scrape fixtures run to compare (default the one that just completed).
                required: true
                type: string
            countries:
                description: Comma-separated codes the recording holds.
                required: false
                default: 'pl,de,uk,us,es'
                type: string

concurrency:
    group: identity-lean-whole
    cancel-in-progress: false

env:
    CI_ROLE: ${{ vars.CI_ROLE }} # the shadow switch: scripts/ci/ci-writes.sh
    FIXTURE_RELEASE_TAG: convergence-fixtures

permissions:
    contents: read

jobs:
    # THE PLAN: which recording to measure (.github/actions/upstream-run, UpstreamRunSpec). A recording off main, or one that failed, records nothing the
    # measurements replay, and an older one would only repeat its own measurement: `skip`, an empty run and no compare.
    plan:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'measure' }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            run: ${{ steps.upstream.outputs.run }}
            # SHARDS: one country a job on github.com's hosted runners (16 GB, 6 h a job: the five countries in one job
            # ran up to ~5 h on ci-runner's measure tier), all five in one job on Forgejo, as before.
            shards: ${{ steps.shards.outputs.shards }}
            # The compare rows' runner and ceiling, evaluated HERE: their matrix reads this job's outputs, so Forgejo
            # re-parses them with these outputs and nothing else (WorkflowPlanSpec).
            runner: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'measure' }}
            ceiling: ${{ github.server_url == 'https://github.com' && 350 || 600 }}
            hosted: ${{ github.server_url == 'https://github.com' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      .github/actions/upstream-run
                      scripts
            - id: upstream
              uses: ./.github/actions/upstream-run
              with:
                  workflow: Record scrape fixtures
                  run-id: ${{ inputs.run-id }}
                  on-fallback: skip
            - id: shards
              shell: bash
              env:
                  COUNTRIES: ${{ inputs.countries || 'pl,de,uk,us,es' }}
                  HOSTED: ${{ github.server_url == 'https://github.com' }}
              run: |
                  set -euo pipefail
                  if [ "$HOSTED" = true ]; then
                      echo "shards=$(tr ',' '\n' <<< "$COUNTRIES" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"
                  else
                      echo "shards=$(jq -nc --arg c "$COUNTRIES" '[$c]')" >> "$GITHUB_OUTPUT"
                  fi

    compare:
        needs: [plan]
        if: needs.plan.outputs.run != ''
        # mongod 8.3 will not start on 26.04's kernel 7.0 (MongoServerVersionParitySpec)
        runs-on: ${{ needs.plan.outputs.runner || 'ubuntu-24.04' }}
        # github.com caps a job at 6 h: one country's shard there, the whole set on Forgejo.
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.ceiling || '350') }}
        strategy:
            fail-fast: false
            matrix:
                countries: ${{ fromJSON(needs.plan.outputs.shards) }}
        permissions:
            contents: read
            actions: read
        steps:
            # THE ROW'S CEILING, in its log, for the timings reporter (ci_timings.py `CEILING_LINE`): the job's expression.
            - name: Report the row's ceiling
              shell: bash
              run: echo "ci-job-ceiling ${{ fromJSON(needs.plan.outputs.ceiling || '350') }} minutes"
            - uses: actions/checkout@v5
            - uses: ./.github/actions/free-disk
            - name: Lay out the recording
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RECORDING: ${{ needs.plan.outputs.run }}
                  COUNTRIES: ${{ matrix.countries }}
                  KINOWO_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  [[ "$RECORDING" =~ ^[0-9]+$ ]] || { echo "::error::run-id is a run id, not $RECORDING"; exit 1; }
                  IFS=, read -r -a ccs <<< "$COUNTRIES"
                  scripts/identity-fetch-recording.sh "$RECORDING" "$RUNNER_TEMP/recording" "${ccs[@]}"
                  rm -rf "$RUNNER_TEMP/recording/archive"
            - uses: ./.github/actions/setup-sbt-build
            - name: Start MongoDB (single-node replica set, the replay's throwaway database)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Resolve each country lean and whole
              shell: bash
              env:
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  # 16 GB hosted runners also hold mongod and the page cache: 10 GB of heap there, 11 on ci-runner.
                  SBT_OPTS: ${{ needs.plan.outputs.hosted == 'true' && '-Xmx10g' || '-Xmx11g' }}
                  COUNTRIES: ${{ matrix.countries }}
              run: |
                  set -uo pipefail
                  fixtures="$RUNNER_TEMP/recording/pair/test/resources/fixtures" out="$RUNNER_TEMP/identity-lean-whole"
                  mkdir -p "$out"
                  failed=0
                  IFS=, read -r -a ccs <<< "$COUNTRIES"
                  for cc in "${ccs[@]}"; do
                      echo "::group::$cc"
                      sbt -batch "worker/IntegrationTest/runMain integration.LeanWholeGuard --strict --out $out --full $cc --corpus-dir $fixtures/corpus --fixtures $fixtures" \
                          2>&1 | tee "$out/sbt-$cc.log" || failed=1
                      echo "::endgroup::"
                      if [ -f "$out/lean-whole-$cc.txt" ]; then
                          { echo "### $cc"; echo '```'; cat "$out/lean-whole-$cc.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                      else
                          echo "### $cc: no report (see sbt-$cc.log)" >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
                  exit $failed
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: identity-lean-whole${{ needs.plan.outputs.hosted == 'true' && format('-{0}', matrix.countries) || '' }}
                  path: ${{ runner.temp }}/identity-lean-whole/
                  retention-days: 30
            - uses: ./.github/actions/runner-peaks
              if: always()
    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [plan, compare]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        with:
            lane: ${{ github.server_url != 'https://github.com' && 'measure' || '' }}
        # `inherit`: Forgejo 15 refuses a workflow_call `secrets:` block naming them (identity-decorations.yml)
        secrets: inherit
