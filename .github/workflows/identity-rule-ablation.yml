#
# RULE ABLATION on CI: which identity and title rules move takes when switched off (scripts/identity-rule-ablation),
# over the recordings named, off the laptop. Each `ablate` row bisects its own share of the first round's batches
# (`--shard I/N`, two rows so the sweep leaves ci-runner's other slots free) over every recording, one after another; `collect` merges the rows' settled rules into one report.
# Dispatch-only; the report comes back as an artifact (identity-rule-ablation), never pushed.
#
name: Identity rule ablation
run-name: identity rule ablation ${{ inputs.recordings }}

on:
    workflow_dispatch:
        inputs:
            recordings:
                description: The `Record scrape fixtures` runs to replay, comma-separated.
                required: false
                # 573 and 528: the recordings this forge holds (38713274617 is github.com-era; Forgejo never had it).
                default: '573,528'
                type: string
            kinds:
                description: Which rules, comma-separated (title, accept, veto, join, apart).
                required: false
                default: 'title'
                type: string
            resume-run:
                description: An earlier identity-rule-ablation run whose state this one carries on from (its `identity-rule-ablation` artifact); empty starts afresh.
                required: false
                default: ''
                type: string
            rounds:
                description: Bisection rounds this run resolves before it stops (a resumed run carries on); keeps the row short, so a runner drain never waits long on it.
                required: false
                default: '1'
                type: string
            only:
                description: Ablate exactly these rules (comma-separated trace names); empty for every rule. Keep it to a few dozen, so each row ends well inside its bound.
                required: false
                default: ''
                type: string

concurrency:
    group: identity-rule-ablation-${{ github.ref }}
    cancel-in-progress: false

env:
    CI_ROLE: ${{ vars.CI_ROLE }} # the shadow switch: scripts/ci/ci-writes.sh
    FIXTURE_RELEASE_TAG: convergence-fixtures
    # ONE row, a round or so at a time: six bisecting rows held every ubuntu slot on ci-runner for hours (run 805), and a
    # runner drain (every ci-runner deploy) waits for its longest job (run 1050 held one for ~2h). A sweep is a chain of
    # short dispatches instead, each resuming the last one's state (`resume-run`, `rounds`).
    SHARDS: '1'

permissions:
    contents: read

jobs:
    ablate:
        name: ablate
        # mongod 8.3 will not start on 26.04's kernel 7.0 (MongoServerVersionParitySpec)
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'measure' }}
        # SHORT ROWS: a runner drain waits for its longest job (runs 850, 1050 held the ubuntu runner for hours). One
        # recording and one round fit in ~25 minutes; the default two do not (#2400: ~60). The ablation stops itself at
        # its --deadline-minutes, keeping its state and every configuration it resolved for the next dispatch's
        # resume-run, and ends green; its step's bound is only the backstop for a hang. A JOB timeout cancels the
        # `always()` upload too (#2376 was cut 27 minutes into its step and lost the round and its log), a step's does
        # not, so a row cut there still uploads its state and the configurations it resolved. Bounds: CiRowTimeoutSpec.
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                # as many as SHARDS
                shard: [0]
        steps:
            - uses: actions/checkout@v5

            # SECONDS, BEFORE THE 14 GB LAYOUT AND THE BUILD: every input this row cannot run without. Runs 850 and 1015
            # died 112-167 minutes in on runner/Docker kills (exit 137, a daemon restart), which the 30-minute resumable
            # rows now bound; what CAN be known at t=0 fails here instead -- a kind that is no rule kind, a rounds that is
            # no number, an `only` rule of another kind, a recording this forge does not hold, a resume-run without the
            # row's state (that one is the next step, moved ahead of the layout for the same reason).
            - name: Preflight the inputs
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RECORDINGS: ${{ inputs.recordings }}
                  KINDS: ${{ inputs.kinds }}
                  ROUNDS: ${{ inputs.rounds }}
                  ONLY: ${{ inputs.only }}
              run: |
                  set -uo pipefail
                  bad=0
                  err() { echo "::error::$*"; bad=1; }
                  IFS=, read -r -a kinds <<< "$KINDS"
                  for k in "${kinds[@]}"; do
                      case "$k" in title|accept|veto|join|apart) ;; *) err "kinds: '$k' is not one of title, accept, veto, join, apart" ;; esac
                  done
                  [[ "$ROUNDS" =~ ^[0-9]+$ ]] || err "rounds: '$ROUNDS' is not a whole number"
                  IFS=, read -r -a only <<< "$ONLY"
                  for r in "${only[@]+"${only[@]}"}"; do
                      # identity rules are `<kind>:<name>`; a title rule has no colon and needs `title` in kinds
                      kind=title; [[ "$r" != *:* ]] || kind=${r%%:*}
                      [[ ",$KINDS," == *",$kind,"* ]] || err "only: '$r' is a $kind rule, and kinds is '$KINDS' -- it would never be ablated"
                  done
                  IFS=, read -r -a runs <<< "$RECORDINGS"
                  for run in "${runs[@]}"; do
                      if names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
                              --jq '.artifacts[] | select(.expired != true) | .name' 2>"$RUNNER_TEMP/err"); then
                          grep -q '^scrape-fixtures-' <<< "$names" || err "recording $run holds no scrape-fixtures-* corpus (expired or deleted)"
                      elif grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
                          err "recording $run is not on this forge (a github.com-era run?) -- name one it holds, e.g. 573,528"
                      else
                          echo "::warning::could not list recording $run's artifacts ($(head -c 200 "$RUNNER_TEMP/err")) -- not checked"
                      fi
                  done
                  exit "$bad"

            - name: Carry on from the earlier run's state
              if: ${{ inputs.resume-run != '' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RESUME: ${{ inputs.resume-run }}
              run: |
                  set -euo pipefail
                  # the row's own artifact (one row since d40b133ce), not `collect`'s: a resumed run need not wait for the
                  # earlier run's collect job to find a free slot
                  gh run download "$RESUME" -R "$GITHUB_REPOSITORY" --name identity-rule-ablation-shard-0 --dir "$RUNNER_TEMP/resume"
                  mkdir -p ablation
                  cp "$RUNNER_TEMP/resume/ablation/state.json" ablation/state.json
                  # and the rounds' resolved configurations (moves-<cc>.jsonl, done-<cc>): a row cut mid-round carries on
                  # from the last configuration it resolved, not from the round's start
                  for round in "$RUNNER_TEMP"/resume/ablation/round-*; do
                      if [ -d "$round" ]; then cp -R "$round" ablation/; fi
                  done
                  echo "carried on: $(find ablation -name 'done-*' | wc -l) configuration-countries already resolved"
                  python3 -c 'import json; s=json.load(open("ablation/state.json")); print("resuming round", s["round"], "with", len(s["pending"] or []), "configurations")'

            - name: Lay out the recordings
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RECORDINGS: ${{ inputs.recordings }}
                  KINOWO_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  cache="$RUNNER_TEMP/kinowo-identity"
                  echo "KINOWO_IDENTITY_CACHE=$cache" >> "$GITHUB_ENV"
                  IFS=, read -r -a runs <<< "$RECORDINGS"
                  for run in "${runs[@]}"; do
                      scripts/identity-fetch-recording.sh --no-overlay "$run" "$cache/recordings/$run"
                      rm -rf "$cache/recordings/$run/archive"
                  done

            - uses: ./.github/actions/free-disk
            - uses: ./.github/actions/setup-sbt-build

            - name: Start MongoDB (single-node replica set, the replay's throwaway database)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Ablate this shard's batches
              shell: bash
              timeout-minutes: 34
              env:
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  SBT_OPTS: -Xmx8g
                  RECORDINGS: ${{ inputs.recordings }}
                  ONLY: ${{ inputs.only }}
                  KINDS: ${{ inputs.kinds }}
                  ROUNDS: ${{ inputs.rounds }}
                  SHARD: ${{ matrix.shard }}
              run: |
                  . scripts/ci/bounded-step.sh
                  set -o pipefail
                  python3 -I scripts/identity_rule_ablation.py --out ablation --recordings "$RECORDINGS" \
                      --kinds "$KINDS" --max-rounds "$ROUNDS" --deadline-minutes 28 \
                      --shard "$SHARD/$SHARDS" ${ONLY:+--only "$ONLY"} 2>&1 | tee ablation.out

            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: identity-rule-ablation-shard-${{ matrix.shard }}
                  path: |
                      ablation/state.json
                      ablation/report.md
                      ablation/round-*/*/*/moves-*.jsonl
                      ablation/round-*/*/*/done-*
                      ablation/sbt-*.log
                      ablation.out
                  retention-days: 14

    collect:
        name: collect
        needs: [ ablate ]
        if: ${{ !cancelled() }}
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'measure' }}
        timeout-minutes: 20
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5

            - uses: actions/download-artifact@v6
              with:
                  pattern: identity-rule-ablation-shard-*
                  path: shards

            - name: Merge the shards' reports
              shell: bash
              run: |
                  set -o pipefail
                  # each row's artifact keeps its `ablation/` directory (it uploads ablation.out beside it)
                  python3 -I scripts/identity_rule_ablation.py --out merged --merge shards/*/ablation/state.json | tee merged.out
                  cat merged/report.md >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: identity-rule-ablation
                  path: merged/
                  retention-days: 30

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ ablate, collect ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        with:
            lane: ${{ github.server_url != 'https://github.com' && 'measure' || '' }}
        # `inherit`: Forgejo 15 refuses a workflow_call `secrets:` block naming them (identity-decorations.yml)
        secrets: inherit
