name: Android

on:
    pull_request:
        paths:
            - 'android/**'
            - '.github/workflows/android.yml'
            # The retry-classification table the language-push tests hold the app's rule to.
            - 'test/resources/retry-classification.json'
            # The store-script helper tests below live here and in ios/scripts,
            # and the lookup tables they guard are SHARED with the iOS capture.
            # Without these, editing the file that actually broke Spain's
            # capture would not run the test that catches it.
            - 'scripts/store-screenshots-common.sh'
            - 'ios/scripts/store-screenshots*.sh'
            # The mobile RELEASE scripts' own specs run in the same step; this
            # workflow calls tag-mobile-release.sh itself after a Play publish.
            - 'scripts/*mobile-release*.sh'
            - 'scripts/log.sh'
            - 'scripts/shell-spec.sh'
            # The seeded order devtest-shuffled.sh (the nightly emulator leg) draws from.
            - 'scripts/seeded-order*.sh'
            # The nightly swift leg's runner, whose spec runs in the step below.
            - 'ios/scripts/swift-test-shuffled*.sh'
            # The nightly order-independence run's seed check, whose spec runs below.
            - 'scripts/ci/order-seed*.sh'
            # The rolling-release publish below runs through these.
            - 'scripts/ci/gh-release*.sh'
            - 'scripts/ci/publish-rolling-release.sh'
    push:
        branches: [main]
        paths:
            - 'android/**'
            - '.github/workflows/android.yml'
            # The retry-classification table the language-push tests hold the app's rule to.
            - 'test/resources/retry-classification.json'
            # The store-script helper tests below live here and in ios/scripts,
            # and the lookup tables they guard are SHARED with the iOS capture.
            # Without these, editing the file that actually broke Spain's
            # capture would not run the test that catches it.
            - 'scripts/store-screenshots-common.sh'
            - 'ios/scripts/store-screenshots*.sh'
            # The mobile RELEASE scripts' own specs run in the same step; this
            # workflow calls tag-mobile-release.sh itself after a Play publish.
            - 'scripts/*mobile-release*.sh'
            - 'scripts/log.sh'
            - 'scripts/shell-spec.sh'
            # The seeded order devtest-shuffled.sh (the nightly emulator leg) draws from.
            - 'scripts/seeded-order*.sh'
            # The nightly swift leg's runner, whose spec runs in the step below.
            - 'ios/scripts/swift-test-shuffled*.sh'
            # The nightly order-independence run's seed check, whose spec runs below.
            - 'scripts/ci/order-seed*.sh'
            # The rolling-release publish below runs through these.
            - 'scripts/ci/gh-release*.sh'
            - 'scripts/ci/publish-rolling-release.sh'
    workflow_dispatch:

# A newer push to the same ref cancels the older run mid-flight instead of
# letting both build the APK/AAB in parallel.
concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

# Single lane: Linux runner, JDK 17 (AGP 9 needs 17+), the preinstalled
# Android SDK + Gradle wrapper (9.7.1). Runs the JVM unit suite, assembles the
# debug APK, then builds the R8-minified release APK + AAB and ships all three
# as (login-gated) workflow artifacts. On main pushes it ALSO publishes the
# signed release APK to a rolling `android-latest` GitHub Release, which has a
# stable anonymous download URL anyone can install from. The release build
# signs with the keystore decoded from repo secrets (see below); with no
# secrets it still builds, just unsigned (and the publish step then fails).
# Most Compose UI tests (e.g. ShowtimeChipFitTest) render off-device via
# Robolectric inside `testDebugUnitTest`; the few that need real touch physics,
# pixels or a running MainActivity live in `androidTest` and run in the separate
# `instrumented` job below, on an emulator.
#
# Release signing secrets (Settings ▸ Secrets and variables ▸ Actions):
#   KINOWO_RELEASE_KEYSTORE_BASE64 — `base64 -i kinowo-release.jks`
#   KINOWO_RELEASE_STORE_PASSWORD  — keystore password
#   KINOWO_RELEASE_KEY_ALIAS       — key alias (kinowo)
#   KINOWO_RELEASE_KEY_PASSWORD    — key password
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # Seconds, first: the signing secrets are set and the SDK licence Gradle needs is accepted.
    # Without it a missing secret surfaced minutes in, as an UNSIGNED release APK that the
    # rolling-release step then refused, and an unaccepted licence as Gradle declining to install
    # a platform. PRs build unsigned by design (see the header), so only other events require
    # the secrets. scripts/ci/preflight.sh never prints a value. (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            emulator: ${{ steps.android.outputs.changed }}
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/changed-paths
                  sparse-checkout-cone-mode: false

            # Whether the `instrumented` emulator lane runs — see the note over that job. The base
            # commit is fetched treeless-shallow: changed-paths only diffs names.
            - name: Fetch this push's base, for the emulator filter
              if: github.event_name == 'push'
              env:
                  BASE: ${{ github.event.before }}
              run: |
                  if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
                      git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
                  fi

            - name: Did this push touch the app?
              id: android
              uses: ./.github/actions/changed-paths
              with:
                  patterns: |
                      android/**

            # The same SDK set-up `build` uses, so the licence checked is the one it will see.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Signing secrets present, SDK licence accepted
              env:
                  KINOWO_RELEASE_KEYSTORE_BASE64: ${{ secrets.KINOWO_RELEASE_KEYSTORE_BASE64 }}
                  KINOWO_RELEASE_STORE_PASSWORD: ${{ secrets.KINOWO_RELEASE_STORE_PASSWORD }}
                  KINOWO_RELEASE_KEY_ALIAS: ${{ secrets.KINOWO_RELEASE_KEY_ALIAS }}
                  KINOWO_RELEASE_KEY_PASSWORD: ${{ secrets.KINOWO_RELEASE_KEY_PASSWORD }}
                  EVENT: ${{ github.event_name }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      scripts/ci/preflight.sh --android-sdk-licence
                  else
                      scripts/ci/preflight.sh --android-sdk-licence \
                          KINOWO_RELEASE_KEYSTORE_BASE64 KINOWO_RELEASE_STORE_PASSWORD \
                          KINOWO_RELEASE_KEY_ALIAS KINOWO_RELEASE_KEY_PASSWORD
                  fi

    build:
        needs: preflight
        runs-on: ubuntu-latest
        # `checks: write` so action-junit-report can post the failure
        # check-run + summary from the Gradle JUnit XML. `contents: write`
        # so the rolling-release step can create/update the public
        # `android-latest` GitHub Release + its tag.
        permissions:
            contents: write
            checks: write
        # Hoisted to job scope so the Play-publish step's `if:` can test whether
        # the service-account secret is set (secrets can't be read directly in
        # an `if:`, but a job-level env derived from one can).
        env:
            PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        defaults:
            run:
                working-directory: android
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'

            # Provisions cmdline-tools + accepts SDK licenses so AGP can
            # auto-fetch platform-37 / build-tools 37.0.0 if the runner image
            # doesn't already carry them. `packages: platform-tools` pins the
            # install to a minimal set instead of the action's default
            # `tools platform-tools` — the deprecated `tools` meta-package drags
            # in the Android Emulator (~hundreds of MB), which this JVM-only
            # `testDebugUnitTest` lane never uses and whose download flakily
            # corrupts ("Error on ZipFile unknown archive"), failing the job.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  # platform-tools only (NOT the default `tools`, which drags in
                  # the flaky emulator download); ndk so the release build can
                  # extract native debug symbols into the AAB — must match
                  # `ndkVersion` in app/build.gradle.kts.
                  packages: platform-tools ndk;29.0.14206865

            # Caches ~/.gradle (wrapper dist + dependency + build caches),
            # keyed on the build scripts and wrapper version.
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Pure-bash helper tests for the store-screenshot / store-graphics
            # scripts: the country→locale→label lookups a capture depends on.
            # They need no emulator and run in a second, but ran in NO workflow
            # until now — so `us` and `es` sat without an area-picker label for
            # weeks, red on anyone's laptop and invisible everywhere else. A
            # missing entry returns "" rather than failing, which is how Spain's
            # first capture skipped all ten cities.
            #
            # The mobile RELEASE scripts' specs ride along for the same reason:
            # tag-mobile-release-test.sh and mobile-release-test.sh ran in no
            # workflow either, although this one runs tag-mobile-release.sh
            # after every Play publish.
            - name: Store and release script helper tests
              working-directory: ${{ github.workspace }}
              run: |
                  android/scripts/store-screenshots-test.sh
                  android/scripts/store-graphics-test.sh
                  ios/scripts/store-screenshots-test.sh
                  scripts/mobile-release-test.sh
                  scripts/tag-mobile-release-test.sh
                  scripts/ci/gh-release-test.sh
                  scripts/seeded-order-test.sh
                  ios/scripts/swift-test-shuffled-test.sh
                  scripts/ci/order-seed-test.sh

            - name: Unit tests
              run: ./gradlew --no-daemon testDebugUnitTest

            # Surface the Gradle JUnit XML as a check-run + summary. The
            # HTML report is still uploaded on failure below for the full
            # stack traces. `report_paths` is repo-relative (the action
            # runs outside the `working-directory: android` default).
            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
                  check_name: Android unit tests
                  detailed_summary: true
                  include_passed: false

            - name: Assemble debug APK
              run: ./gradlew --no-daemon assembleDebug

            - name: Upload debug APK
              uses: actions/upload-artifact@v6
              if: success()
              with:
                  name: kinowo-debug-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error

            # Decode the base64 keystore secret to a file the Gradle signing
            # config can read. Absent secret → no file, and the release build
            # falls back to unsigned (build.gradle.kts logs a warning).
            - name: Decode release keystore
              id: keystore
              env:
                  KEYSTORE_BASE64: ${{ secrets.KINOWO_RELEASE_KEYSTORE_BASE64 }}
              run: |
                  if [ -n "$KEYSTORE_BASE64" ]; then
                      echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinowo-release.jks"
                      echo "store_file=$RUNNER_TEMP/kinowo-release.jks" >> "$GITHUB_OUTPUT"
                      echo "Release keystore decoded — release build will be signed."
                  else
                      echo "::warning::No KINOWO_RELEASE_KEYSTORE_BASE64 secret — release build will be UNSIGNED."
                  fi

            - name: Assemble release APK + AAB
              env:
                  KINOWO_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
                  KINOWO_RELEASE_STORE_PASSWORD: ${{ secrets.KINOWO_RELEASE_STORE_PASSWORD }}
                  KINOWO_RELEASE_KEY_ALIAS: ${{ secrets.KINOWO_RELEASE_KEY_ALIAS }}
                  KINOWO_RELEASE_KEY_PASSWORD: ${{ secrets.KINOWO_RELEASE_KEY_PASSWORD }}
                  # Strictly-increasing versionCode for Play (see build.gradle.kts).
                  KINOWO_VERSION_CODE: ${{ github.run_number }}
              run: ./gradlew --no-daemon assembleRelease bundleRelease assembleTuneRelease

            - name: Upload release APK
              uses: actions/upload-artifact@v6
              if: success()
              with:
                  name: kinowo-release-apk
                  # Glob catches both the signed `app-release.apk` and the
                  # unsigned-fallback `app-release-unsigned.apk` (no secrets).
                  path: android/app/build/outputs/apk/release/app-release*.apk
                  if-no-files-found: error

            - name: Upload release AAB
              uses: actions/upload-artifact@v6
              if: success()
              with:
                  name: kinowo-release-aab
                  path: android/app/build/outputs/bundle/release/app-release.aab
                  if-no-files-found: error

            # Manually-triggered publish of the signed AAB to Google Play's
            # `internal` testing track via Gradle Play Publisher (the `play {}`
            # block in app/build.gradle.kts). workflow_dispatch ONLY — a normal
            # push/PR never ships to Play; you click "Run workflow" in the Actions
            # tab when you want to release. Gated on PLAY_SERVICE_ACCOUNT_JSON:
            # absent → the step below is skipped and a notice explains how to
            # enable it, so the workflow still passes without the secret.
            #
            # `publishReleaseBundle` uploads ONLY the app binary + its R8 mapping
            # (auto-detected → Play can symbolicate crashes); it does NOT touch
            # the store listing/description. Editing descriptions is a separate,
            # deliberate `publishReleaseListing` — see android/PLAY_PUBLISHING.md —
            # so a routine deploy can't clobber the live listing. (Switch the task
            # to `publishRelease` here if you ever want CI to push both.)
            #
            # Prerequisites (one-time, outside CI): the app `net.pawel.kinowo`
            # must already exist in the Play Console with its FIRST AAB uploaded
            # manually once; a Google Cloud service account with the Play Android
            # Developer API enabled + release permission in the Console; its JSON
            # key stored as the PLAY_SERVICE_ACCOUNT_JSON repo secret.
            - name: Publish to Google Play (internal)
              if: ${{ github.event_name == 'workflow_dispatch' && env.PLAY_JSON != '' }}
              env:
                  # GPP reads the service-account key from a file; write the
                  # secret out and point the build at it (same env-var-or-local
                  # -file shape build.gradle.kts uses). Reuse the signing env +
                  # version code so the re-resolved bundleRelease is the identical
                  # signed AAB assembled above (up-to-date, not rebuilt).
                  KINOWO_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
                  KINOWO_RELEASE_STORE_PASSWORD: ${{ secrets.KINOWO_RELEASE_STORE_PASSWORD }}
                  KINOWO_RELEASE_KEY_ALIAS: ${{ secrets.KINOWO_RELEASE_KEY_ALIAS }}
                  KINOWO_RELEASE_KEY_PASSWORD: ${{ secrets.KINOWO_RELEASE_KEY_PASSWORD }}
                  KINOWO_VERSION_CODE: ${{ github.run_number }}
              run: |
                  printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-credentials.json"
                  KINOWO_PLAY_CREDENTIALS_FILE="$RUNNER_TEMP/play-credentials.json" \
                      ./gradlew --no-daemon :app:publishReleaseBundle

            - name: Note skipped Play publish
              if: ${{ github.event_name == 'workflow_dispatch' && env.PLAY_JSON == '' }}
              run: echo "::notice::Play upload skipped — add the PLAY_SERVICE_ACCOUNT_JSON secret (service-account key with Play release permission) to enable it."

            # Marks the commit this internal-track build was actually cut from — see
            # tag-mobile-release.sh. A later production promotion
            # (`:app:promoteReleaseArtifact`) ships this SAME artifact unchanged, so the tag
            # stays correct through that step without needing its own update. `success()` is
            # required in the `if:` (not implied by the custom condition alone — a step's own
            # `if:` REPLACES the default success()-only check, it doesn't AND with it), or a
            # failed Play publish still gets tagged as shipped. Non-fatal on push failure — see
            # the script — so a best-effort dashboard tag can never turn an already-shipped
            # release into red CI and skip the artifact-upload steps below.
            - name: Tag the commit this internal build was cut from
              if: ${{ success() && github.event_name == 'workflow_dispatch' && env.PLAY_JSON != '' }}
              working-directory: ${{ github.workspace }}
              run: |
                  version="$(tr -d '\n' < mobile-version.txt)"
                  scripts/tag-mobile-release.sh android "$version" "$GITHUB_SHA"

            - name: Upload tune APK
              uses: actions/upload-artifact@v6
              if: success()
              with:
                  name: kinowo-tune-apk
                  # Signed, minified build that exposes the tweak screen (the
                  # "Kinowo Tune" launcher icon). Glob catches the unsigned
                  # fallback too when no signing secrets are present.
                  path: android/app/build/outputs/apk/tuneRelease/app-tuneRelease*.apk
                  if-no-files-found: error

            # Publish the signed release APK + AAB to a rolling `android-latest`
            # GitHub Release so they have stable, anonymous download URLs that
            # don't require a GitHub login (unlike the upload-artifact above):
            #   https://github.com/${{ github.repository }}/releases/download/android-latest/kinowo.apk
            #   https://github.com/${{ github.repository }}/releases/download/android-latest/kinowo.aab
            # The APK is for sideloading; the AAB is the Play Console upload
            # artifact (Play requires an AAB, not an APK).
            #
            # Only on main pushes / manual runs — never on PRs. Each run edits
            # the same release in place and --clobbers its assets (a rolling
            # "latest", not a versioned release); its notes name the commit.
            # The git tag itself stays where the release was first created —
            # `--target` only moves a tag that does not exist yet. Marked
            # prerelease so it stays out of the repo's "Latest release" slot.
            # Requires the KINOWO_RELEASE_* signing secrets: an unsigned APK
            # won't install, so we fail loudly rather than publish a dud.
            - name: Publish rolling APK + AAB release
              if: success() && github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  apk=app/build/outputs/apk/release/app-release.apk
                  aab=app/build/outputs/bundle/release/app-release.aab
                  if [ ! -f "$apk" ]; then
                      echo "::error::Signed $apk not found — set KINOWO_RELEASE_KEYSTORE_BASE64 (+ store/key secrets); unsigned builds won't install."
                      exit 1
                  fi
                  if [ ! -f "$aab" ]; then
                      echo "::error::Signed $aab not found — the bundleRelease step should have produced it."
                      exit 1
                  fi
                  cp "$apk" "$RUNNER_TEMP/kinowo.apk"
                  cp "$aab" "$RUNNER_TEMP/kinowo.aab"
                  # Upsert + retry of transient 403/409/5xx: see the header of
                  # publish-rolling-release.sh and gh-release.sh for the two
                  # 403s (2026-09-04, 2026-09-23) that shaped it.
                  notes="Signed build from the latest \`main\` commit (${GITHUB_SHA:0:7}). \`kinowo.apk\` to sideload on Android (enable installing from unknown sources); \`kinowo.aab\` to upload to the Google Play Console."
                  "$GITHUB_WORKSPACE/scripts/ci/publish-rolling-release.sh" android-latest \
                      "Kinowo Android (latest)" "$notes" \
                      "$RUNNER_TEMP/kinowo.apk" "$RUNNER_TEMP/kinowo.aab"

            # Same as above, for the tweak build: a signed, minified APK
            # (≈ the same size as kinowo.apk) that adds the "Kinowo Tune"
            # launcher icon → the on-device tweak screen. Published to its own
            # rolling release so the public android-latest stays clean:
            #   https://github.com/${{ github.repository }}/releases/download/android-tune-latest/kinowo-tune.apk
            - name: Publish rolling tune APK release
              if: success() && github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  apk=app/build/outputs/apk/tuneRelease/app-tuneRelease.apk
                  if [ ! -f "$apk" ]; then
                      echo "::error::Signed $apk not found — set KINOWO_RELEASE_KEYSTORE_BASE64 (+ store/key secrets); unsigned builds won't install."
                      exit 1
                  fi
                  cp "$apk" "$RUNNER_TEMP/kinowo-tune.apk"
                  notes="Signed APK from the latest \`main\` build (${GITHUB_SHA:0:7}) WITH the on-device tweak screen — tap the \"Kinowo Tune\" launcher icon to open it. Sideload \`kinowo-tune.apk\` on Android; enable installing from unknown sources."
                  "$GITHUB_WORKSPACE/scripts/ci/publish-rolling-release.sh" android-tune-latest \
                      "Kinowo Android — tweak build (latest)" "$notes" \
                      "$RUNNER_TEMP/kinowo-tune.apk"

            - name: Upload test report
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: unit-test-report
                  path: android/app/build/reports/tests/testDebugUnitTest
                  if-no-files-found: ignore

    # The on-device suite (android/app/src/androidTest) on an x86_64 emulator —
    # the same `connectedDebugAndroidTest` android/scripts/devtest.sh runs on a
    # phone. It ran in NO workflow until 2026-09-23, and two of its thirteen
    # tests had been red since June by then (a Polish-only string lookup, and a
    # pixel gauge a tuning pass outdated) with nothing saying so.
    #
    # `needs: build` rather than a parallel job: the workflow then never holds
    # more than one runner at a time (see CiRunnerBudgetSpec on why a job that
    # starts at t=0 is the costly kind), a red unit suite skips the slower
    # emulator boot, and the build job's Play publish / rolling releases are
    # NOT gated on this lane, since they run inside `build` before it starts.
    #
    # ONLY WHEN THE APP CHANGED, not on every push this workflow runs for. The workflow also
    # triggers on the release and store scripts, which cannot change what runs on a device, and in
    # its first four weeks the lane caught no bug — its one red run was an adb flake. A push
    # touching android/** (and any PR or hand dispatch, which changed-paths treats as all
    # changed) still runs it; every androidTest class also runs on the emulator NIGHTLY, each
    # alone, in order-independence.yml's android-instrumented leg.
    instrumented:
        needs: [preflight, build]
        if: needs.preflight.outputs.emulator == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 35
        permissions:
            contents: read
        defaults:
            run:
                working-directory: android
        env:
            # Matches the local `kinowo` AVD the suite is tuned on (Pixel 6,
            # API 34): RatingPillVisualPaddingTest's pixel thresholds were
            # measured at that density.
            API_LEVEL: 34
            AVD_PROFILE: pixel_6
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'

            # Same minimal install as `build` — the emulator runner below
            # fetches the emulator + system image itself.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Hardware acceleration: without KVM the x86_64 emulator falls back
            # to software emulation and does not boot inside the timeout.
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            # A booted-once AVD snapshot, so later runs cold-start from it
            # instead of a first boot (minutes) — keyed on everything that
            # shapes the image.
            - name: Cache AVD
              id: avd-cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.android/avd/*
                      ~/.android/adb*
                  key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.AVD_PROFILE }}

            - name: Create AVD snapshot
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."

            - name: Instrumented tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  emulator-boot-timeout: 600
                  working-directory: android
                  # devtest.sh adds the `.debug` applicationId suffix and the
                  # local.properties/adb setup, exactly as on a phone. It leaves
                  # out the tests that play a real YouTube video: from a runner's
                  # datacenter address YouTube answers the embed with error 150
                  # (run 35915030310), which says nothing about our code. See
                  # pl.kinowo.RequiresLiveYouTube.
                  script: scripts/devtest.sh --skip-live-youtube

            # The runner only prints a one-line failure; the per-test stack
            # traces are in the connected-test report.
            - name: Upload instrumented test report
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: instrumented-test-report
                  path: |
                      android/app/build/reports/androidTests/connected
                      android/app/build/outputs/androidTest-results/connected
                  if-no-files-found: ignore
