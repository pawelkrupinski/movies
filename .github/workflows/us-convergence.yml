#
# The United States' pipeline convergence — the same leg the other countries run,
# in a build of its own.
#
# It asks the same question `country-convergence.yml` does (does the scrape → fold
# → settle loop reach a fixpoint on THIS country's catalogue and title rules?) and
# it calls the same reusable leg with the same inputs. Nothing about the pipeline
# differs, and — since 2026-09-08 — nothing about the LANE differs either: both
# workflows now take `cancel-in-progress: false` on a constant group (see below).
# What still forces a file of its own is the WIRING: `needs:` joins JOBS, not
# matrix legs, so one shared `needs: sample` would gate every country's full leg
# on every OTHER country's sample finishing first (`country-convergence.yml`'s
# own header covers this in full).
#
# WHY THE US NEEDED `cancel-in-progress: false` FIRST, AND WHY IT MATTERS MORE HERE
#
# `cancel-in-progress: true` — what `country-convergence.yml` used until this
# split proved the alternative — trades a cancelled run's progress for one
# authoritative answer per push. For Poland, Germany and the UK that used to be a
# good trade: their legs are 12 to 73 minutes on a WARM enrichment tree, and a
# superseded run costs a dozen minutes of a tree that stays warm regardless.
#
# The US has no warm tree. Its budget is 330 minutes against their 135, not because
# its corpus is bigger (1,419 films sits between Poland and Germany) but because
# every rating and lookup is fetched live and RECORDED for the next run. A US leg
# that is superseded at hour four has published nothing, so the run that cancelled
# it starts from the same cold tree and is itself superseded at hour four. The
# suite that is meant to converge cannot: on a repo that pushes several times a day
# the five-hour leg never reaches an assertion, and the tree it exists to build
# never gets warm enough for the leg to get short enough to survive. The three warm
# countries yielded cheaply under the old lane; the US would have yielded forever
# — which is why this file, and this setting, existed before the sibling adopted it.
#
# WHAT `cancel-in-progress: false` ACTUALLY BUYS — and it is not "no lane"
#
# The group is still a constant, so this is one lane, not one lane per commit.
# GitHub's rule for a group that does not cancel in progress is: the run in flight
# is left alone, at most ONE run may be pending behind it, and a newly queued run
# CANCELS whatever was pending before it. So a day of pushes into a running leg
# produces exactly two runs — the one finishing, and the newest commit's, with
# every older queued run discarded. Finish what is running, then pick up the latest
# and drop the rest. (ConvergenceConcurrencyConfigSpec)
#
# `main.yml` used to run a `free-runners` step that cancelled in-flight
# `Country convergence` runs to take their runners back for the deploy, and it
# named that workflow explicitly so this one was never touched. It is retired
# now that the sibling shares this lane too — cancelling a run neither workflow
# intends to throw away would destroy real progress, not merely accelerate a
# supersede that was coming anyway. (DeployImageReuseSpec)
#
# The price is three of the account's twenty concurrent jobs held for as long as the
# leg runs — the sample, then the full leg and the order-independence replay side by
# side. That is deliberate, and it is what an answer costs for this country.
#
name: US convergence

on:
    # Dispatched by `Main` alongside the shared suite, off the same `needs: ci` — see
    # `kick-convergence` there. Two lanes need two dispatches.
    schedule:
        # 04:20 UTC, with the shared suite — after the nightly country-fixture recorder.
        # The two no longer contend the way three legs in one workflow did, and a nightly
        # run that meets a leg still in flight from the day's last push queues behind it
        # rather than killing it.
        - cron: '20 4 * * *'
    workflow_dispatch:

concurrency:
    group: us-convergence
    # SEPARATE from `country-convergence`'s group (this file's own group name),
    # but the SAME shape as it now: see the header for why this setting used to
    # be what set this file apart and no longer is.
    cancel-in-progress: false

jobs:
    # A one-row matrix rather than a bare `with:` block, so this caller and the shared
    # one stay the same SHAPE: `ConvergenceLegWiringSpec` reads both callers' matrix
    # rows and checks the sample/full pairing, the alias names, and the timeout budgets
    # across all five countries at once. A US row written in a different shape would be
    # a country the leg rules silently stopped covering.
    leg:
        name: ${{ matrix.country }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Several hours, against the warm countries' 135/120 — the US has no
                    # enrichment tree yet and its first legs fetch everything live. See
                    # the leg's input docs for why a cold country given a warm country's
                    # budget is cancelled before it can record the tree that would have
                    # made it fast.
                    #
                    # `heap` is the sbt JVM's `-Xmx`, and 10g against the other four's
                    # 4g is the ceiling this country actually needs. A leg holds the whole
                    # country resident at once — the replayed corpus, the enrichment
                    # cache, and the read model it reloads once the boot has projected
                    # it. On 2026-09-01 that projection was 114,002 documents, and both
                    # runs that day spent their last 45 seconds above 70% GC and then
                    # exited 3 on `.jvmopts`' `-XX:+ExitOnOutOfMemoryError` — before
                    # ScalaTest had reported one assertion. A budget buys nothing if the
                    # heap runs out first.
                    #
                    # 8g was not enough for the order-independence row. It died the same
                    # way on 2026-09-05 at 116,065 documents, and the run four hours
                    # earlier had PASSED on an identical corpus with 2.10 GB to spare —
                    # the row had no margin rather than a regression, on a projection
                    # that grows every day. `CorpusComparison` took the peak down by
                    # holding one pass's corpus at a time instead of all three; this
                    # raise is the other half, and it only became available once
                    # `convergence-setup` stopped letting mongod default its WiredTiger
                    # cache to ~7.5 GB of the same 16 GB runner.
                    #
                    # `order`/`orderJob`/`orderSuite` split the whole-corpus
                    # order-independence replay out of the full leg — the ONLY country
                    # that does. It runs as a second ROW of the leg's `convergence` job
                    # rather than a job of its own, so the four countries that fold the
                    # replay into their standard run render nothing at all for it.
                    #
                    # The full leg boots this corpus in 167 minutes and the three
                    # concurrent replays cost ~1.5x a boot again (the UK's measured ratio:
                    # 2,586s of replays against a 1,676s boot), so together they are 5.5
                    # hours in a job GitHub cancels at 6. Every US leg before this died on
                    # the replays' own 75-minute guard having diverged on nothing. The two
                    # rows run side by side off the same sample gate.
                    - { country: united-states, code: us, cmd: convergenceUs, sample: convergenceUsSample, job: 330, suite: 315, sampleJob: 75, sampleSuite: 60, heap: 10g, order: convergenceUsOrder, orderJob: 330, orderSuite: 315 }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
        with:
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-job-timeout-minutes:    ${{ matrix.sampleJob }}
            sample-suite-timeout-minutes:  ${{ matrix.sampleSuite }}
            order-command:                 ${{ matrix.order }}
            order-job-timeout-minutes:     ${{ matrix.orderJob }}
            order-suite-timeout-minutes:   ${{ matrix.orderSuite }}
            heap:                          ${{ matrix.heap }}
        # TMDB_API_KEY / OMDB_API_KEY, and the GITHUB_TOKEN the setup action reads.
        secrets: inherit
