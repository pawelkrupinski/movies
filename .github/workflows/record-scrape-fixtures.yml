#
# Nightly capture of every country's REAL `cinema_scrapes` into a fixture file,
# stored in the actions cache for the convergence legs to replay.
#
# The enrichment capture follows it in the SAME run (the `enrichment` jobs below) but
# stays out of its way: the corpus is recorded and uploaded in minutes by the `record`
# jobs, and only then does each country's convergence leg run in RECORDING mode over that
# exact corpus, filling its enrichment tree live and pinning corpus + tree as the pair the
# hermetic verdict legs replay. The two only mean anything together, which is why they are
# recorded in one run rather than on two schedules that drift.
#
# Fetching the corpus INSIDE a leg is what every convergence failure traced back
# to: prod Mongo is not reachable from a runner without a hop, and the leg met pages
# large enough to overflow the Mongo driver's completion chain, a proxy that exited
# mid-run, a proxy that wedged while holding its port, and a driver that noticed
# neither for 30s at a time. Recording out of band leaves the legs reading local
# files.
#
# The hop is no longer `flyctl proxy --app kinowo-mongo`: prod Mongo lives on the
# Hetzner host mongo-1 and that Fly app is stopped. It is now an ssh key pinned to a
# forced command there, which is the narrowest route in that a driver-side read can
# use — infra/nix/modules/roles/mongo-ci-read.nix argues the case, and
# scripts/ci/wait-for-mongo-tunnel.sh holds this end of it.
#
# It also pins the corpus. Prod drifts under a running test — the same Polish
# corpus measured 7,044, then 7,055, then 7,063 listings inside an hour as venues
# rescraped — so a divergence found in one run could not be re-examined in the
# next. A recorded fixture makes a failing corpus keepable.
#
name: Record scrape fixtures

on:
    # Midnight Warsaw, year-round. GitHub cron is UTC-only and DST-unaware, and
    # Warsaw is UTC+1 (CET) / UTC+2 (CEST); 23:01 UTC is the latest instant that is
    # still just-after-midnight Warsaw in winter, and lands 01:01 in summer. Both
    # are after midnight, so one plain cron covers the year with no DST gate — the
    # same reasoning `country-fixture-artifact.yml` documents.
    schedule:
        # 23:31, not 23:01: `country-fixture-artifact.yml` already fires at 23:01,
        # and both are multi-job live-recording workflows — running them in the same
        # minute put four heavyweight jobs on the pool at once, competing for the
        # same prod tunnel that is documented to wedge under load.
        - cron: '31 23 * * *'
    workflow_dispatch:
        inputs:
            identity-lookups:
                description: >-
                    Also record the identity resolver's per-listing lookups (every listing's own
                    detail page and TMDB resolve — docs/design/identity-resolver.md §9) into each
                    country's tree. Off on the nightly cron.
                required: false
                type: boolean
                default: false

concurrency:
    group: record-scrape-fixtures-${{ github.ref }}
    # NOT `true` any more: this workflow now also RECORDS the enrichment trees (the
    # `enrichment` jobs below), hours of paid-for live fills that a manual re-record
    # dispatched mid-run would have thrown away. A second run queues behind the first.
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # Seconds, first: the secrets the jobs below read are set, so a missing one fails here
    # rather than hours into a leg. The tunnel key for the scrape capture, the TMDB key for the enrichment recording. scripts/ci/preflight.sh never prints a value.
    # (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Secrets present
              env:
                  MONGO_CI_SSH_KEY: ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh MONGO_CI_SSH_KEY MONGO_CI_SSH_HOST_KEY TMDB_API_KEY

    record:
        needs: preflight
        name: scrapes (${{ matrix.country }})
        strategy:
            # Parallel and independent: one country's tunnel trouble must not cost
            # the other two their capture.
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl }
                    - { country: germany,        code: de }
                    - { country: united-kingdom, code: uk }
                    - { country: united-states,  code: us }
                    - { country: spain,          code: es }
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            statuses: write
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt
            - uses: sbt/setup-sbt@v1
            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  key: sbt-target-convergence-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala') }}
                  restore-keys: |
                      sbt-target-convergence-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            # Refuses an empty read rather than writing a fixture from one, and
            # `findAll` discards an incomplete keyset scan — a fixture is
            # AUTHORITATIVE, and a truncated one already slipped through once at 236
            # of 281 Polish venues.
            # Opened LAST, immediately before the step that uses it. A tunnel wedges
            # while idle (see wait-for-mongo-tunnel.sh), and establishing it before a
            # JDK install and a possibly-cold sbt compile left it rotting for 5-10
            # minutes before anything touched it.
            #
            # THE CONNECTION STRING IS NOT A SECRET OF THIS WORKFLOW. The step asks
            # mongo-1's forced-command endpoint for the read-only credential and exports
            # KINOWO_CONVERGENCE_SCRAPES_URI itself, so the only thing GitHub holds is an
            # ssh key that can do exactly two read-only things — and rotating the
            # database password is a sops edit on one host rather than a repository
            # secret nobody remembers exists.
            - name: Tunnel to prod Mongo
              run: scripts/ci/wait-for-mongo-tunnel.sh 27018
              env:
                  MONGO_CI_SSH_KEY:      ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}

            - name: Record ${{ matrix.country }}'s corpus
              run: sbt "worker/Test/runMain scripts.RecordCorpusFixture ${{ matrix.code }}"
              env:
                  KINOWO_COUNTRY:   ${{ matrix.code }}
                  KINOWO_COUNTRIES: ${{ matrix.code }}

            - name: Pack
              run: |
                  set -euo pipefail
                  mkdir -p scrape-archive
                  # The baseline travels WITH the corpus, in the same archive. They are
                  # captured from one connection at one instant and only mean anything
                  # together — the convergence band compares this run's coverage of the
                  # corpus against what prod had achieved on that same repertoire, so a
                  # corpus arriving without its baseline (or beside a staler one) would
                  # be comparing two different days.
                  # Corpus, baseline and the sample pair all travel in ONE archive.
                  # They are captured from a single connection at a single instant and
                  # only mean anything together — a corpus arriving beside a staler
                  # baseline would be comparing two different days.
                  tar -czf "scrape-archive/scrapes-${{ matrix.code }}.tar.gz" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ matrix.code }}.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}.json" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ matrix.code }}-sample.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}-sample.json" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}.json"
                  ls -l scrape-archive/

            # Run-id-suffixed so each capture is a new entry; the legs restore by
            # prefix and so always take the newest.
            - uses: actions/cache/save@v5
              with:
                  path: scrape-archive
                  key: scrape-fixtures-${{ matrix.code }}-${{ github.run_id }}

            - uses: actions/upload-artifact@v6
              with:
                  name: scrape-fixtures-${{ matrix.code }}
                  path: scrape-archive/scrapes-${{ matrix.code }}.tar.gz
                  # 14 days, not 3. This artifact is now the ONLY durable copy a
                  # convergence leg reads — the cache entry beside it is evicted within
                  # hours by 7 GB of sbt-target builds, which is how the UK corpus went
                  # missing and the leg silently replayed invented films instead. Three
                  # days is two nights of slack on a nightly job: one failed run over a
                  # weekend and every country's corpus expires at once. The three
                  # tarballs together are ~12 MB, so the margin costs nothing.
                  retention-days: 14
                  overwrite: true
                  if-no-files-found: warn

            # Last, and whatever happened: this leg's verdict, now rather than when the
            # slowest leg of the run ends (scripts/ci/leg-verdict.sh).
            - uses: ./.github/actions/leg-verdict
              if: always()
              with:
                  leg:    scrapes (${{ matrix.country }})
                  status: ${{ job.status }}
                  token:  ${{ secrets.GITHUB_TOKEN }}

    # THE ENRICHMENT RECORDING — the only place the convergence fixture trees grow.
    #
    # Every convergence leg that renders a verdict is HERMETIC (`country-convergence-leg.yml`,
    # `mode`): it replays a recorded corpus and the enrichment tree recorded against it, and
    # never touches the network. Something still has to fill that tree for each night's new
    # corpus, and it is this: the same leg in `record` mode, over the corpus the job above
    # just captured — expire what is past its lifetime, fill every gap live, remember every
    # failure, publish the working tree, and once the full leg's boot is complete pin
    # corpus + tree as the PAIR the hermetic legs replay from then on.
    #
    # Here rather than on the convergence schedule, because a recording belongs with the
    # corpus it records against: pinned to this run's corpus, a new corpus and its tree
    # reach the verdict legs together or not at all.
    #
    # The United States runs without its split-out order-independence row: a recording
    # needs the boot, which is where every request is made; the replays re-ask nothing.
    enrichment:
        name: enrichment (${{ matrix.country }})
        needs: [preflight, record]
        # Past a failed `record` leg (the other countries' corpora are still worth a tree), but
        # never past a failed preflight: that skips `record` too, and `!cancelled()` alone would
        # start five legs of up to 330 minutes without the TMDB key or a corpus.
        if: ${{ !cancelled() && needs.preflight.result == 'success' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl, cmd: convergencePoland,  sample: convergencePolandSample,  job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: germany,        code: de, cmd: convergenceGermany, sample: convergenceGermanySample, job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk,      sample: convergenceUkSample,      job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: spain,          code: es, cmd: convergenceSpain,   sample: convergenceSpainSample,   job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: united-states,  code: us, cmd: convergenceUs,      sample: convergenceUsSample,      job: 330, suite: 315, sampleJob: 75, sampleSuite: 60, heap: 10g }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            mode:           record
            corpus-run:     ${{ github.run_id }}
            identity-lookups: ${{ inputs.identity-lookups == true }}
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-job-timeout-minutes:    ${{ matrix.sampleJob }}
            sample-suite-timeout-minutes:  ${{ matrix.sampleSuite }}
            heap:                          ${{ matrix.heap }}
        # TMDB_API_KEY / OMDB_API_KEY for the live fills, and the GITHUB_TOKEN the setup reads.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec). This is the AGGREGATE,
    # and it waits for the slowest leg; each leg has already posted its own verdict as a
    # commit status the moment it ended (.github/actions/leg-verdict, LegVerdictWiringSpec).
    report:
        needs: [preflight, record, enrichment]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
