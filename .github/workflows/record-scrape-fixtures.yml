#
# Nightly capture of every country's REAL `cinema_scrapes` into a fixture file,
# stored in the actions cache for the convergence legs to replay.
#
# Separate from the enrichment capture because the two have nothing in common but
# a destination. This one reads one Mongo collection and is done in minutes; the
# enrichment capture depends on what a convergence run discovered and therefore
# runs after it. Bundling them meant recording a corpus cost a full convergence
# run — scrape, fold, settle, project, enrich, three order-independence passes —
# to obtain something a single collection read produces.
#
# Fetching the corpus INSIDE a leg is what every convergence failure traced back
# to: prod Mongo is not reachable from a runner without a hop, and the leg met pages
# large enough to overflow the Mongo driver's completion chain, a proxy that exited
# mid-run, a proxy that wedged while holding its port, and a driver that noticed
# neither for 30s at a time. Recording out of band leaves the legs reading local
# files.
#
# The hop is no longer `flyctl proxy --app kinowo-mongo`: prod Mongo lives on the
# Hetzner host mongo-1 and that Fly app is stopped. It is now an ssh key pinned to a
# forced command there, which is the narrowest route in that a driver-side read can
# use — infra/nix/modules/roles/mongo-ci-read.nix argues the case, and
# scripts/ci/wait-for-mongo-tunnel.sh holds this end of it.
#
# It also pins the corpus. Prod drifts under a running test — the same Polish
# corpus measured 7,044, then 7,055, then 7,063 listings inside an hour as venues
# rescraped — so a divergence found in one run could not be re-examined in the
# next. A recorded fixture makes a failing corpus keepable.
#
name: Record scrape fixtures

on:
    # Midnight Warsaw, year-round. GitHub cron is UTC-only and DST-unaware, and
    # Warsaw is UTC+1 (CET) / UTC+2 (CEST); 23:01 UTC is the latest instant that is
    # still just-after-midnight Warsaw in winter, and lands 01:01 in summer. Both
    # are after midnight, so one plain cron covers the year with no DST gate — the
    # same reasoning `country-fixture-artifact.yml` documents.
    schedule:
        # 23:31, not 23:01: `country-fixture-artifact.yml` already fires at 23:01,
        # and both are multi-job live-recording workflows — running them in the same
        # minute put four heavyweight jobs on the pool at once, competing for the
        # same prod tunnel that is documented to wedge under load.
        - cron: '31 23 * * *'
    workflow_dispatch:

concurrency:
    group: record-scrape-fixtures-${{ github.ref }}
    cancel-in-progress: true

jobs:
    record:
        name: scrapes (${{ matrix.country }})
        strategy:
            # Parallel and independent: one country's tunnel trouble must not cost
            # the other two their capture.
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl }
                    - { country: germany,        code: de }
                    - { country: united-kingdom, code: uk }
                    - { country: united-states,  code: us }
                    - { country: spain,          code: es }
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt
            - uses: sbt/setup-sbt@v1
            - uses: actions/cache@v5
              with:
                  path: |
                      target
                      project/target
                      project/project/target
                  key: sbt-target-convergence-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala') }}
                  restore-keys: |
                      sbt-target-convergence-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            # Refuses an empty read rather than writing a fixture from one, and
            # `findAll` discards an incomplete keyset scan — a fixture is
            # AUTHORITATIVE, and a truncated one already slipped through once at 236
            # of 281 Polish venues.
            # Opened LAST, immediately before the step that uses it. A tunnel wedges
            # while idle (see wait-for-mongo-tunnel.sh), and establishing it before a
            # JDK install and a possibly-cold sbt compile left it rotting for 5-10
            # minutes before anything touched it.
            #
            # THE CONNECTION STRING IS NOT A SECRET OF THIS WORKFLOW. The step asks
            # mongo-1's forced-command endpoint for the read-only credential and exports
            # KINOWO_CONVERGENCE_SCRAPES_URI itself, so the only thing GitHub holds is an
            # ssh key that can do exactly two read-only things — and rotating the
            # database password is a sops edit on one host rather than a repository
            # secret nobody remembers exists.
            - name: Tunnel to prod Mongo
              run: scripts/ci/wait-for-mongo-tunnel.sh 27018
              env:
                  MONGO_CI_SSH_KEY:      ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}

            - name: Record ${{ matrix.country }}'s corpus
              run: sbt "worker/Test/runMain scripts.RecordCorpusFixture ${{ matrix.code }}"
              env:
                  KINOWO_COUNTRY:   ${{ matrix.code }}
                  KINOWO_COUNTRIES: ${{ matrix.code }}

            - name: Pack
              run: |
                  set -euo pipefail
                  mkdir -p scrape-archive
                  # The baseline travels WITH the corpus, in the same archive. They are
                  # captured from one connection at one instant and only mean anything
                  # together — the convergence band compares this run's coverage of the
                  # corpus against what prod had achieved on that same repertoire, so a
                  # corpus arriving without its baseline (or beside a staler one) would
                  # be comparing two different days.
                  # Corpus, baseline and the sample pair all travel in ONE archive.
                  # They are captured from a single connection at a single instant and
                  # only mean anything together — a corpus arriving beside a staler
                  # baseline would be comparing two different days.
                  tar -czf "scrape-archive/scrapes-${{ matrix.code }}.tar.gz" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ matrix.code }}.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}.json" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ matrix.code }}-sample.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}-sample.json" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ matrix.code }}.json"
                  ls -l scrape-archive/

            # Run-id-suffixed so each capture is a new entry; the legs restore by
            # prefix and so always take the newest.
            - uses: actions/cache/save@v5
              with:
                  path: scrape-archive
                  key: scrape-fixtures-${{ matrix.code }}-${{ github.run_id }}

            - uses: actions/upload-artifact@v6
              with:
                  name: scrape-fixtures-${{ matrix.code }}
                  path: scrape-archive/scrapes-${{ matrix.code }}.tar.gz
                  # 14 days, not 3. This artifact is now the ONLY durable copy a
                  # convergence leg reads — the cache entry beside it is evicted within
                  # hours by 7 GB of sbt-target builds, which is how the UK corpus went
                  # missing and the leg silently replayed invented films instead. Three
                  # days is two nights of slack on a nightly job: one failed run over a
                  # weekend and every country's corpus expires at once. The three
                  # tarballs together are ~12 MB, so the margin costs nothing.
                  retention-days: 14
                  overwrite: true
                  if-no-files-found: warn
