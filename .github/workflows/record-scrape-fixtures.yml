#
# Nightly capture of every country's REAL `cinema_scrapes` into a fixture file,
# stored in the actions cache for the convergence legs to replay.
#
# The enrichment capture follows it in the SAME job: each country's convergence leg runs
# in RECORDING mode (the `enrichment` jobs below), records that country's corpus as its
# first step, then fills its enrichment tree live over that exact corpus and pins corpus +
# tree as the pair the hermetic verdict legs replay. The two only mean anything together,
# which is why they are recorded in one run rather than on two schedules that drift.
#
# The corpus used to be five `scrapes (<country>)` jobs ahead of the legs, and all five had
# to finish before ANY leg started (`needs:` joins jobs, not matrix rows) — each paying a
# runner, a checkout and a JDK/sbt setup only to hand a tarball over through an artifact.
#
# Fetching the corpus DURING a suite is what every convergence failure traced back
# to: prod Mongo is not reachable from a runner without a hop, and the leg met pages
# large enough to overflow the Mongo driver's completion chain, a proxy that exited
# mid-run, a proxy that wedged while holding its port, and a driver that noticed
# neither for 30s at a time. So the leg records it in a step of its own, BEFORE the suite,
# through a tunnel it closes straight afterwards; the suites only ever read local files.
#
# The hop is no longer `flyctl proxy --app kinowo-mongo`: prod Mongo lives on the
# Hetzner host mongo-1 and that Fly app is stopped. It is now an ssh key pinned to a
# forced command there, which is the narrowest route in that a driver-side read can
# use — infra/nix/modules/roles/mongo-ci-read.nix argues the case, and
# scripts/ci/wait-for-mongo-tunnel.sh / close-mongo-tunnel.sh hold this end of it (the
# leg's "Tunnel to prod Mongo" step is the only one that sees the key).
#
# It also pins the corpus. Prod drifts under a running test — the same Polish
# corpus measured 7,044, then 7,055, then 7,063 listings inside an hour as venues
# rescraped — so a divergence found in one run could not be re-examined in the
# next. A recorded fixture makes a failing corpus keepable.
#
# CAPTURE ONLY (docs/forgejo-ci.md, "Capture, then verify"). This run goes red only when the capture
# itself failed -- the corpus could not be read, a country's boot never completed, an origin refused most
# of the recording -- never on what its suites assert: a recording's suite runs with live fallback, so
# its asserts are no verdict on code (country-convergence-leg.yml, `continue-on-error` in record mode).
# Its last job, `verify`, dispatches `Verify scrape recording` with this run's id: the hermetic replay
# of exactly what was captured, which judges the code and is what the pre-push red gate reads.
#
name: Record scrape fixtures

on:
    # Midnight Warsaw, year-round. GitHub cron is UTC-only and DST-unaware, and
    # Warsaw is UTC+1 (CET) / UTC+2 (CEST); 23:01 UTC is the latest instant that is
    # still just-after-midnight Warsaw in winter, and lands 01:01 in summer. Both
    # are after midnight, so one plain cron covers the year with no DST gate — the
    # same reasoning `country-fixture-artifact.yml` documents.
    schedule:
        # 23:31, not 23:01: `country-fixture-artifact.yml` already fires at 23:01,
        # and both are multi-job live-recording workflows — running them in the same
        # minute put four heavyweight jobs on the pool at once, competing for the
        # same prod tunnel that is documented to wedge under load.
        - cron: '31 23 * * *'
    workflow_dispatch:
        inputs:
            identity-lookups:
                description: >-
                    Also record the identity resolver's per-listing lookups (every listing's own
                    detail page and TMDB resolve — docs/design/identity-resolver.md §9) into each
                    country's tree. ON by default and always on the nightly cron, so the phase-1
                    gate stays met as the corpus moves; untick only to bisect a recording.
                required: false
                type: boolean
                default: true
            pin-hermetic:
                description: >-
                    Also make this recording the HERMETIC PAIR every verdict leg and identity measure replays
                    (the landing bar). Off by default and always off on the nightly cron: a complete recording is
                    published under its run and marked prod-latest (`--recording prod-latest`,
                    scripts/identity-repro) without moving the landing bar (573) until prod-latest has proven stable.
                required: false
                type: boolean
                default: false

concurrency:
    group: record-scrape-fixtures-${{ github.ref }}
    # NOT `true` any more: this workflow now also RECORDS the enrichment trees (the
    # `enrichment` jobs below), hours of paid-for live fills that a manual re-record
    # dispatched mid-run would have thrown away. A second run queues behind the first.
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # Seconds, first: the secrets the jobs below read are set, so a missing one fails here
    # rather than hours into a leg. The tunnel key for each leg's corpus capture, the TMDB key for its enrichment recording. scripts/ci/preflight.sh never prints a value.
    # (PreflightWiringSpec)
    preflight:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'forgejo-recording' }}
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            # One request each to OMDb and TMDB: a refused key (spent daily quota, rotated key) ended 5 of the week's
            # 14 failed recordings 22-125 min in (runs 335, 408, 528, 563, 2507), after every leg had started.
            - name: OMDb and TMDB still take the keys
              env:
                  OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/recording-preflight.sh
            - name: Secrets present
              env:
                  MONGO_CI_SSH_KEY: ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh MONGO_CI_SSH_KEY MONGO_CI_SSH_HOST_KEY TMDB_API_KEY

    # THE CORPUS AND ENRICHMENT RECORDING — the only place the convergence fixtures grow.
    #
    # Every convergence leg that renders a verdict is HERMETIC (`country-convergence-leg.yml`,
    # `mode`): it replays a recorded corpus and the enrichment tree recorded against it, and
    # never touches the network. Something still has to record both for each night, and it is
    # this: the same leg in `record` mode, which first captures its country's corpus from prod
    # (and uploads it as the `scrape-fixtures-<code>` artifact every later leg reads), then
    # over that corpus — expire what is past its lifetime, fill every gap live, remember every
    # failure, publish the working tree, and once the full leg's boot is complete pin
    # corpus + tree as the PAIR the hermetic legs replay from then on.
    #
    # Here rather than on the convergence schedule, because a recording belongs with the
    # corpus it records against: pinned to this run's corpus, a new corpus and its tree
    # reach the verdict legs together or not at all.
    #
    # The United States runs without its split-out order-independence row: a recording
    # needs the boot, which is where every request is made; the replays re-ask nothing.
    # The United Kingdom runs its replays as a SECOND ROW instead (`order`), over the corpus
    # its convergence row records and the tree it restored, gap-filled: inline they were ~6
    # of its 14 minutes and the longest leg of the run (37105119296), and a recording is
    # nightly, so the one extra runner is not a per-push cost.
    #
    # Each country's corpus capture runs as the FIRST STEPS of its full leg's job, so `job` is that one job's
    # ceiling over all of it: the corpus steps' own fifteen (tunnel and read), the full leg's `suite`, plus ten
    # minutes for setup and the publish (HermeticConvergenceWiringSpec). No row runs the sample: a recording never
    # requests a bisect, the one thing that still replays it.
    enrichment:
        name: enrichment (${{ matrix.country }})
        # Behind the preflight alone: each leg records its own corpus, so one country's tunnel
        # trouble fails only that country's leg (`fail-fast: false`).
        needs: [ preflight ]
        strategy:
            fail-fast: false
            matrix:
                # EVERY ROW CARRIES EVERY KEY THE JOB READS, empty or at its fallback where the row has no
                # value: Forgejo (CI since the GitHub suspension) evaluates a reusable call's `with:` strictly
                # and refuses `matrix.<key>` a row lacks -- github.com reads it as null. Same values either way.
                include:
                    # The US first: the longest leg (run 37111868620: 11.8 min against the next 9.0) and
                    # so the critical path. Matrix rows are queued in this order, and when runners are
                    # short (the convergence lanes, measure runs) the last row waited 1.7 min for one.
                    - { country: united-states,  code: us, cmd: convergenceUs,      shape: corpusShapeUs,      job: 360, suite: 315, heap: 10g, order: '' }
                    - { country: poland,         code: pl, cmd: convergencePoland,  shape: corpusShapePoland,  job: 170, suite: 120, heap: 4g, order: '' }
                    - { country: germany,        code: de, cmd: convergenceGermany, shape: corpusShapeGermany, job: 170, suite: 120, heap: 4g, order: '' }
                    - { country: united-kingdom, code: uk, cmd: convergenceUkWithoutOrder, order: convergenceUkOrder, shape: corpusShapeUk, job: 170, suite: 120, heap: 4g }
                    - { country: spain,          code: es, cmd: convergenceSpain,   shape: corpusShapeSpain,   job: 170, suite: 120, heap: 4g, order: '' }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            mode:           record
            corpus-run:     ${{ github.run_id }}
            # Every scheduled run records the resolver's query set too (a schedule has no
            # inputs, so it cannot read the dispatch default): the gate is kept met, not met once.
            identity-lookups: ${{ github.event_name == 'schedule' || inputs.identity-lookups == true }}
            # Off on the cron (a schedule has no inputs): nightlies become prod-latest, not the hermetic pair.
            pin-hermetic:   ${{ github.event_name == 'workflow_dispatch' && inputs.pin-hermetic == true }}
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            command:        ${{ matrix.cmd }}
            shape-command:  ${{ matrix.shape }}
            # The UK's replays in a row of their own, beside its boot (`convergenceUkOrder`):
            # they were ~6 of its 14 minutes, the run's longest leg (run 37105119296). Empty for
            # every other country, whose leg stays one row.
            order-command:  ${{ matrix.order || '' }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            # Germany's recording ran out of its 4g twice off github.com, in GC thrash from ~20 min into the suite
            # (runs 322, 408 -- Forgejo, CI since the GitHub suspension); 8g still fits the runner beside
            # mongod (ConvergenceRunnerMemorySpec). github.com keeps the row's own heap.
            heap: ${{ github.server_url != 'https://github.com' && matrix.code == 'de' && '8g' || matrix.heap }}
            # ONE RATE BUDGET FOR ALL LEGS OFF github.com: Forgejo's runners (CI since the GitHub suspension) share
            # one IP, and TMDB and IMDb limit per IP — six legs at once, each pacing only itself, drew ~70k 429s
            # (run 322). The `forgejo-recording` runner sets FORGEJO_RATE_PERMITS, and every leg's live wire asks
            # that one permit service before each request (tools.RatePermits), so the legs run side by side under
            # one per-service budget. github.com keeps the leg's default runner, its own IP and no permits.
            runner: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'forgejo-recording' }}
        # TMDB_API_KEY / OMDB_API_KEY for the live fills, the GITHUB_TOKEN the setup reads, and
        # MONGO_CI_SSH_KEY / MONGO_CI_SSH_HOST_KEY — which the leg maps into its "Tunnel to prod
        # Mongo" step's env and no other.
        secrets: inherit

    # THE VERIFY PHASE, handed off: `Verify scrape recording` replays this run's recording hermetically for every
    # country it captured complete (scripts/ci/recorded-countries.sh) and judges main's code against it. A separate
    # run, so its verdict is a workflow of its own for the red gate to read, and it can be dispatched again on the
    # same recording once a fix lands. Main only: a branch's recording publishes no tree to replay. None captured
    # complete, none dispatched -- the capture is red, and there is nothing to judge.
    verify:
        needs: [ preflight, enrichment ]
        if: ${{ !cancelled() && needs.preflight.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'main') }}
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'forgejo-recording' }}
        timeout-minutes: 5
        permissions:
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Dispatch the hermetic verify of this recording
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
              run: |
                  set -euo pipefail
                  countries=$(scripts/ci/recorded-countries.sh "$GITHUB_RUN_ID")
                  if [ -z "$countries" ]; then
                      echo "::warning::no country captured complete in run $GITHUB_RUN_ID -- no verify dispatched"
                      exit 0
                  fi
                  gh workflow run verify-scrape-recording.yml --ref main -f recording="$GITHUB_RUN_ID" -f countries="$countries"
                  echo "dispatched Verify scrape recording on recording $GITHUB_RUN_ID for: $countries" | tee -a "$GITHUB_STEP_SUMMARY"

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ preflight, enrichment, verify ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        with:
            lane: ${{ github.server_url != 'https://github.com' && 'forgejo-recording' || '' }}
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec). This is the AGGREGATE,
    # and it waits for the slowest leg; each leg has already posted its own verdict as a
    # commit status the moment it ended (.github/actions/leg-verdict, LegVerdictWiringSpec).
    report:
        name: report (scheduled run)
        needs: [ preflight, enrichment, verify, timings ]
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'forgejo-recording' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
