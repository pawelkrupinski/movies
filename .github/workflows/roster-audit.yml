name: Cinema roster audit

# Weekly ONLINE half of the cinema-roster audit (the offline half,
# CinemaRosterAuditSpec, runs with the unit tests on every push). It reads
# every Polish venue's source page that names a town — bilety24 organiser
# pages and Filmweb's cinema-info API — and fails when a source disagrees with
# the roster: a town other than the one we file the venue under, one street
# address published for two of our venues, an address the source only
# redirects now, or a venue the source dropped. The three mistakes it exists
# for (2026-09-23): Braniewo's Baszta on Środa Wielkopolska's organiser, Koło's
# Kino nad Wartą on Konin's culture centre, Kino Etiuda wired twice.
#
# NOT on push: it hits live sites (~170 requests, 5 at a time, backing off on
# 429/503). The findings land in the run's job summary.
on:
    # Monday 05:00 UTC — before discover-cinemas' 06:00 slot.
    schedule:
        - cron: '0 5 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    roster-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            # Mirror the repo's Scala CI toolchain (see ci.yml): Temurin JDK 25
            # with sbt dependency caching.
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            # Exits 1 on any mismatch; the report is appended to the job summary
            # either way.
            - name: Run RosterAudit
              run: sbt "worker/runMain tools.RosterAudit $GITHUB_STEP_SUMMARY"
