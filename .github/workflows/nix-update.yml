name: Nix update

# EVERY NIX DEPENDENCY UPGRADE, WEEKLY, AS ONE PULL REQUEST (ported from bitcashier/infra's
# nix-update.yaml, 2026-10-22). Nothing upgraded the fleet flake before: Renovate is scoped to
# Gradle and scala-steward to sbt. infra/bin/nix-update finds the upgrades (every flake input, and
# mongod -- pinned in infra/nix/modules/roles/mongodb.nix -- within its current major), builds every
# host before and after, and writes the patch and a body with what changes on the machines;
# infra/bin/propose-pr force-pushes branch nix-update/all and opens or updates its PR with the Sync Bot App's token.
# The self-tests (infra/bin/nix-update-test.sh, propose-pr-test.sh) run with every other script self-test.
# The same PR carries the container image pins no other bumper owns (infra/bin/image_pins.py, its
# self-test infra/bin/image_pins_test.py) in this repository. movies-gitops' tag pins (kube-state-metrics,
# Reloader, Headlamp) get that repository's own PR, branch image-pins/all, the same way; Flux, a
# generated manifest, is only listed.
#
# IT PROPOSES, IT NEVER MERGES. A merge to main is a deploy here (nix-stage-closures.yml stages, and
# fleet.autoApply activates what it may), so the reviewer is the gate; the same holds for
# movies-gitops, where Flux reconciles a merge. These are the two PRs the "no PRs" rule in CLAUDE.md
# expects from it.
on:
  schedule:
    # Monday morning UTC, so the PR is waiting at the start of the week.
    - cron: '17 4 * * 1'
  # The external scheduler's run of a cron slot (infra/nix/files/scheduled_dispatch.py; GitHub's own
  # runs come hours late, or not at all): treated as the schedule wherever this workflow branches on it.
  repository_dispatch:
    types: [scheduled-nix-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-update-${{ github.ref }}
  cancel-in-progress: false

env:
  # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
  LANG: C.UTF-8

jobs:
  update:
    runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
    # Two builds of every host from an empty store; most of it comes from cache.nixos.org.
    timeout-minutes: 180
    steps:
      # Full history: propose-pr asks who authored the existing branch's commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job token must not ride along on the push: the App's does, so its PR fires CI.
          persist-credentials: false

      # The Sync Bot App's token, for both PRs: one the job's GITHUB_TOKEN opened would fire no checks. A missing
      # App secret fails here, before the builds.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.SYNC_PR_APP_ID }}
          private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}
          owner: pawelkrupinski
          repositories: movies,movies-gitops

      # The same nix as nix-stage-closures.yml: this runner image has none of its own.
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # movies-gitops at infra/kubernetes (gitignored here): infra/bin/image_pins.py reads its cluster
      # component pins (Flux, kube-state-metrics, Reloader, Headlamp). Anonymous, this server.
      - name: Check out the GitOps manifests
        run: infra/bin/fetch-gitops

      # Two trees: the old one, exported from HEAD before anything changes, and the checkout itself,
      # which nix-update upgrades in place. Both hosts' closures are built and compared.
      - name: Find and apply every upgrade, build every host before and after
        id: find
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/nix-update"
          old="${RUNNER_TEMP}/nix-update-old"
          rm -rf "${out}" "${old}" && mkdir -p "${out}" "${old}"
          git archive HEAD infra | tar -x -C "${old}"
          status=0
          python3 infra/bin/nix-update --old "${old}/infra" --out "${out}" || status=$?
          [ -f "${out}/summary.md" ] && cat "${out}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            0|1) ;;
            *) echo "::error title=Nothing was checked::infra/bin/nix-update exited ${status} -- it could not look, which is NOT the same as everything being current." ; exit 1 ;;
          esac

      # Proposes whatever was found even when part of the run failed (exit 1: upstream unreadable,
      # or a checksum refused); the body lists the failures, and the next step turns the run red.
      - name: Open or update the pull request
        env:
          PROPOSE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: infra/bin/propose-pr --branch nix-update/all "${RUNNER_TEMP}/nix-update"

      # AFTER this repository's PR, never before: nix-update lists movies-gitops' pins as they are on its
      # main, and propose-pr leaves that checkout on the bumped branch. Runs whatever became of the steps
      # above -- its own repository, its own PR.
      - name: Bump movies-gitops' image pins
        id: gitops
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/image-pins"
          rm -rf "${out}"
          status=0
          python3 infra/bin/image_pins.py --gitops-out "${out}" || status=$?
          [ -f "${out}/body.md" ] && cat "${out}/body.md" >> "${GITHUB_STEP_SUMMARY}"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          [ "${status}" -le 1 ]

      - name: Open or update movies-gitops' pull request
        if: ${{ !cancelled() && steps.gitops.outcome == 'success' }}
        env:
          PROPOSE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: infra/bin/propose-pr -C infra/kubernetes --repo pawelkrupinski/movies-gitops --branch image-pins/all "${RUNNER_TEMP}/image-pins"

      - name: Part of the run failed
        if: ${{ !cancelled() && (steps.find.outputs.status == '1' || steps.gitops.outputs.status == '1') }}
        run: |
          echo "::error title=Part of the update failed::infra/bin/nix-update or infra/bin/image_pins.py --gitops-out exited 1: see the summary above (an upstream that could not be read, or bytes that did not match upstream's checksum). What did work was proposed."
          exit 1

  # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
  # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
  report:
    name: report (scheduled run)
    needs: [update]
    if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
    runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/report-scheduled-run
        with:
          failed: ${{ contains(needs.*.result, 'failure') }}
