# Purpose: The weekly exemption report (CLAUDE.md, "Coupling is reviewed on every change"; a report, never a gate)
name: Coupling exemptions

# THE WEEKLY EXEMPTION REPORT (CLAUDE.md, "Coupling is reviewed on every change"; a report, never a gate). The owner,
# 2026-11-19, let agents exempt a new class past the fan-out limit on two conditions: each row carries a specific
# reason, and the new rows are reported weekly. This workflow does the reporting. It runs
# `scripts/coupling-report --new-exemptions --since 7d`, which lists main's exemption rows added in the last 7 days with
# their dates, commits, reasons and `Coupling: exempt` trailers, and writes the list to the run's summary. When the list
# is not empty, the report job opens an issue assigned to the owner, or refreshes its body if one is already open
# (scripts/ci/scheduled-failure-issue.sh `alert`). The owner reads it and strikes any row he does not accept. The next
# week with no new rows closes the issue. No sbt run: the list comes from git history.
# The same report lists the week's FIX-REPLAY EXEMPTIONS (the owner, 2026-11-20: a gate red's fix lands only with
# `Fix-Replay: <command>`, which agentctl runs, or `Fix-Replay: none — <why>`, "listed in the owner's weekly report like
# exemptions"): `scripts/ci/fix_replay_exemptions.py --since 7d`, each `none` with its commit, reds and reason.
# And it lists the STALE EXEMPTIONS (the owner, 2026-11-20): the `slack` job builds the production code and runs `sbt
# couplingExemptionSlack` (scripts/coupling-report --exemption-slack), which reads every `class` row's class files for
# the collaborators it could give up -- a pass-through, a builder, a co-used group, one reached through another -- and
# names each class whose suggested cut would bring it within the fan-out limit. Any such class raises the same issue.
on:
    schedule:
        # Mondays 10:47 UTC, a slot no other scheduled job uses
        - cron: '47 10 * * 1'
    # The external scheduler's run of a cron slot (infra/nix/files/scheduled_dispatch.py): treated as the schedule.
    repository_dispatch:
        types: [scheduled-coupling-exemptions]
    workflow_dispatch:

concurrency:
    group: coupling-exemptions
    cancel-in-progress: false

permissions:
    contents: read

env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    exemptions:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 10
        outputs:
            found: ${{ steps.list.outputs.found }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # the week of history the list reads
                  fetch-depth: 0
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: List the week's new exemptions
              id: list
              run: |
                  scripts/coupling-report --new-exemptions --since 7d > "$RUNNER_TEMP/exemptions.md"
                  cat "$RUNNER_TEMP/exemptions.md" >> "$GITHUB_STEP_SUMMARY"
                  scripts/ci/fix_replay_exemptions.py --since 7d > "$RUNNER_TEMP/fix-replay.md"
                  { echo; cat "$RUNNER_TEMP/fix-replay.md"; } >> "$GITHUB_STEP_SUMMARY"
                  rows="$(grep -c '^- ' "$RUNNER_TEMP/exemptions.md" || true)"
                  nones="$(grep -c '^- ' "$RUNNER_TEMP/fix-replay.md" || true)"
                  if [ "$rows" -gt 0 ] || [ "$nones" -gt 0 ]; then
                      echo "found=$rows new coupling exemption row(s) and $nones Fix-Replay: none exemption(s) this week: their reasons and commits are in the run's summary (scripts/coupling-report --new-exemptions --since 7d, scripts/ci/fix_replay_exemptions.py --since 7d); strike any you do not accept" >> "$GITHUB_OUTPUT"
                  fi
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    slack:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 45
        outputs:
            stale: ${{ steps.slack.outputs.stale }}
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - uses: ./.github/actions/setup-sbt-build
            - name: Read every class exemption's slack
              id: slack
              run: |
                  sbt "couplingExemptionSlack $RUNNER_TEMP/slack.md"
                  { echo; cat "$RUNNER_TEMP/slack.md"; } >> "$GITHUB_STEP_SUMMARY"
                  stale="$(grep -c '(within the limit: the exemption may be stale)$' "$RUNNER_TEMP/slack.md" || true)"
                  if [ "$stale" -gt 0 ]; then
                      echo "stale=$stale class exemption(s) whose suggested cut would bring the class within the fan-out limit: each with its collaborators and the cut in the run's summary (scripts/coupling-report --exemption-slack); cut it, or keep the row and say why" >> "$GITHUB_OUTPUT"
                  fi
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # New rows, or a stale exemption, open (or refresh) one issue assigned to the owner, closed by the next week with
    # none. A failed run opens the same issue: .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [exemptions, slack]
        if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
                  alert: ${{ needs.exemptions.outputs.found != '' || needs.slack.outputs.stale != '' }}
                  found: ${{ needs.exemptions.outputs.found }} ${{ needs.slack.outputs.stale }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
