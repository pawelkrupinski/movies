                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-oldrefs
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    check-page:
        name: check (page)
        # AFTER the rest, not beside it: beside it its WebKit rows starved (landing check run 4059:
        # every WebKit test ~40 s, then timed out, past the 80 minutes) -- the reason it runs with a cap of its own -- and
        # after the heavy rows and the old refs' compile, which run beside the rest and would starve it the same way. Only for
        # a change the plan gives a page check: any other change no longer waits ~2 min at the end for a job with nothing to do.
        needs: [ plan, check, check-identity, check-oldrefs, heavy ]
        if: ${{ !cancelled() && needs.plan.outputs.page == 'true' && needs.check.result == 'success' && needs.check-identity.result != 'failure' && needs.check-identity.result != 'cancelled' && needs.check-oldrefs.result != 'failure' && needs.check-oldrefs.result != 'cancelled' && needs.heavy.result != 'failure' }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-check' || 'ubuntu-26.04' }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  # every commit and tree, no file contents but HEAD's (fetched with the checkout) -- the history the hook walks
                  # (merge base, commit rules, old refs) is all there and any older file arrives on demand. The whole repository
                  # (2 GB of packs) took 65-71 s a job; this 18 s (probe run 41387934910, ci-runner).
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet --filter=blob:none origin main
            # What the hook runs in this job (scripts/ci/precommit-share.sh: the hook's own selection, PREPUSH_LIST=1): nothing set
            # up below for a share with nothing to run. The hook step still runs, so a check this missed fails there, never unrun.
            - name: What this job runs
              id: share
              env:
                  SHARE: page
              run: |
                  scripts/ci/precommit-share.sh env "$SHARE" >> "$GITHUB_ENV"
                  checks="$(scripts/ci/precommit-share.sh checks "$SHARE")"
                  echo "this job's checks: ${checks:-none}"
                  echo "checks=$checks" >> "$GITHUB_OUTPUT"
            # sbt, the JDK and main's landing-check build cache, restored only: a check's tree is no main build to save
            - uses: ./.github/actions/setup-sbt-build
              if: steps.share.outputs.checks != ''
              with:
                  target-cache-restore-only: 'true'
                  # main's newest complete build (precheck-build-cache.yml); the shared family only before its first
                  target-cache-key: sbt-target-precheck-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-precheck-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
            - uses: actions/setup-node@v5
              if: steps.share.outputs.checks != ''
              with:
                  node-version: '22'
                  cache: 'npm'
            # the hook's tools that the job image lacks: a missing one blocks the check, as on the laptop
            - name: The hook's tools
              if: steps.share.outputs.checks != ''
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
                  for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
            - name: The pre-push hook's checks of the change
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  SHARE: page
              run: |
                  mkdir -p "$TMPDIR"
                  # inside the job's 90 minutes, so the two failure steps below still print and upload its logs: the
                  # job's own timeout ends every step, those too, and leaves a run with no output at all (run 3357)
                  rc=0
                  # the branch names the hook's mode (PREPUSH_MODE, from precommit-share.sh): check/fast-<id> is agentctl's batch
                  # check -- the fast-only set (compile + the fast tests; each change passed its own full checks), as on the
                  # laptop; every other check/<id> the change's own checks. The fast-only set is the rest's alone.
                  [ "$SHARE" = rest ] || [ "$PREPUSH_MODE" = --checks-only ] || exit 0
                  timeout --kill-after=60 80m scripts/hooks/pre-push "$PREPUSH_MODE" "$PREPUSH_RANGE" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the pre-push checks ran past 80 minutes and were stopped"
                  exit "$rc"
            # A failed check keeps the hook's logs (its temp dir): their failure lines AND their tail here, as agentctl's
            # verdict reads them, so a remote check never fails output-less. Each log's errors first (Playwright's
            # `Error:` blocks, sbt's FAILED/[error]: run 3342's 60 `✘` lines filled every head and its error never
            # showed), then its last lines, whatever matched: `grep | head` exits 0 on no match, so the old `|| tail`
            # never ran.
            - name: The failed checks' lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      echo "-- its error lines (first 120):"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-page
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # MAIN'S HEAVY ROWS the change can move, in two jobs (the plan's heavy-groups): `itrest` alone, the others together. One
    # job ran them one after another, 9-10 min (itrest 264 s, itidentity 74, e2ecorpus 111, e2e 98: run 41373956176).
    heavy:
        name: heavy rows (${{ matrix.rows }})
        needs: [ plan ]
        if: ${{ needs.plan.outputs.heavy != '' }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-check' || 'ubuntu-22.04' }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                rows: ${{ fromJSON(needs.plan.outputs.heavy-groups) }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # every commit and tree, no file contents but HEAD's (fetched with the checkout) -- the history the hook walks
                  # (merge base, commit rules, old refs) is all there and any older file arrives on demand. The whole repository
                  # (2 GB of packs) took 65-71 s a job; this 18 s (probe run 41387934910, ci-runner).
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet --filter=blob:none origin main
            - name: Start MongoDB (single-node replica set, for change streams)
              if: ${{ contains(matrix.rows, 'it') }}
              run: scripts/ci/in-background.sh start mongo-start scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
                  target-cache-key: sbt-target-precheck-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-precheck-${{ runner.os }}-
                      sbt-target-it-${{ runner.os }}-
                      sbt-target-unit-worker-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
            - name: Check out the gitops manifests (movies-gitops main, anonymously)
              if: ${{ contains(matrix.rows, 'itrest') }}
              run: git clone --quiet --depth 1 --branch main "$GITHUB_SERVER_URL/pawelkrupinski/movies-gitops" infra/kubernetes
            - name: Wait for MongoDB, started in the background above
              if: ${{ contains(matrix.rows, 'it') }}
              run: scripts/ci/in-background.sh wait mongo-start 240
            - name: The change's heavy rows
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  ROWS: ${{ matrix.rows }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB: kinowo
              run: |
                  mkdir -p "$TMPDIR"
                  rc=0
                  PREPUSH_HEAVY_ROWS=1 PREPUSH_ONLY="$ROWS" timeout --kill-after=60 80m \
                      scripts/hooks/pre-push --checks-only "$(git merge-base HEAD origin/main)..HEAD" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the heavy rows ($ROWS) ran past 80 minutes and were stopped"
                  exit "$rc"
            - name: The failed row's lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job.
    timings:
        needs: [ plan, check, check-identity, check-oldrefs, check-page, heavy ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`: report-timings.yml declares no secrets.
        secrets: inherit
