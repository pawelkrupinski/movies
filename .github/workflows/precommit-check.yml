name: Pre-commit check

# REMOTE CHECKS (agentctl's land queue, ~/bin/AGENTCTL.md "remote checks"; the owner, 2026-10-27): while the laptop is
# under memory or CPU pressure, a queued change's pre-commit checks run HERE, on ci-runner's check tier (the ubuntu
# runner, cgroup slice `check`), instead of on the laptop. agentctl pushes the change's checked tip to `check/<entry>`
# (the pre-push hook checks nothing for a check/ branch: a run's ref, never landed), this run runs THE SAME HOOK over it
# -- `scripts/hooks/pre-push --checks-only <merge-base with main>..HEAD`: the path-selected checks, the basic tests and
# the touched areas' tests, the red gate left to the push to main -- and agentctl reads the verdict, deletes the branch
# and pushes to main with PREPUSH_REMOTE_RUN=<this run's id>, which the hook takes for its checks only once Forgejo
# confirms that this workflow succeeded on that very commit.
on:
    push:
        branches: ['check/**']

concurrency:
    group: precommit-check-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# SHADOW SWITCH (scripts/ci/ci-writes.sh): on github.com this run writes nothing outside its runner unless CI_ROLE=primary.
env:
    CI_ROLE: ${{ vars.CI_ROLE }}

jobs:
    # WHICH OF MAIN'S HEAVY ROWS THE CHANGE CAN MOVE (scripts/hooks/pre-push --plan with PREPUSH_HEAVY_ROWS=1: `itrest`,
    # `itidentity`, `e2e`, `e2ecorpus`), space-separated, for the `heavy` job. The batch's fast check (check/fast-*) runs none.
    plan:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            heavy: ${{ steps.rows.outputs.heavy }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet origin main
            - name: The heavy rows the change can move
              id: rows
              run: |
                  rows=""
                  case "$GITHUB_REF_NAME" in
                      fast-*|check/fast-*) ;;
                      *) rows="$(git diff --name-only "$(git merge-base HEAD origin/main)" HEAD \
                              | PREPUSH_HEAVY_ROWS=1 scripts/hooks/pre-push --plan | grep -xE 'itrest|itidentity|e2ecorpus|e2e' || true)" ;;
                  esac
                  echo "heavy rows: ${rows:-none}" | tr '\n' ' '
                  echo "heavy=$(printf '%s' "$rows" | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

    # THE SPLIT CHECK (scripts/hooks/pre-push, PREPUSH_ONLY / PREPUSH_ELSEWHERE): the hook's selected checks shared
    # between two jobs, each with an 80-minute cap of its own. In one job they ran one after another under one cap: run
    # 4025 (a 124-path batch) spent 7 min on scripttests, 8 on sbt, 13 on identity and 37 on page, and ran out of its 80
    # minutes with oldrefs, ios and identitydrift still to go. `check (rest)` runs every selected check but the page
    # area and the old refs; `check (oldrefs)` the old refs beside it; `check (page)` the page area alone, after both.
    check:
        name: check (rest)
        runs-on: ubuntu-26.04
        # the page area alone is ~45 min here (diag run 3367, 2026-10-27: browsers + warm-up 2 min, the Chromium rows
        # 4 min, the WebKit row at its one worker ~23 min; web/PageTest/test ~10 min before them), so the hook gets 80
        # and the job 90, room for the failure steps after it
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet origin main
            # sbt, the JDK and the shared build cache, restored only: a check's tree is no main build to save
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'
            # the hook's tools that the job image lacks: a missing one blocks the check, as on the laptop
            - name: The hook's tools
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
                  for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
            - name: The pre-push hook's checks of the change
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  SHARE: rest
              run: |
                  mkdir -p "$TMPDIR"
                  # inside the job's 60 minutes, so the two failure steps below still print and upload its logs: the
                  # job's own timeout ends every step, those too, and leaves a run with no output at all (run 3357)
                  rc=0
                  # the branch names the hook's mode: check/fast-<id> is agentctl's batch check from ci-runner --
                  # the fast-only set (compile + the fast tests; each change passed its own full checks), as on the
                  # laptop; every other check/<id> the change's own checks
                  mode=--checks-only
                  case "$GITHUB_REF_NAME" in fast-*|check/fast-*) mode=--fast-only ;; esac
                  # the fast-only set is the sbt check alone: nothing for the page or oldrefs share
                  [ "$SHARE" = rest ] || [ "$mode" = --checks-only ] || exit 0
                  if [ "$SHARE" = rest ]; then export PREPUSH_ELSEWHERE="page oldrefs"; else export PREPUSH_ONLY="$SHARE"; fi
                  timeout --kill-after=60 80m scripts/hooks/pre-push "$mode" "$(git merge-base HEAD origin/main)..HEAD" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the pre-push checks ran past 80 minutes and were stopped"
                  exit "$rc"
            # The drift gate's commit rules over the change's commits, whatever paths it touched (scripts/ci/commit-rules-ci.sh):
            # the hook selects them by path; here no selection can leave them out.
            - name: The change's commits keep the drift gate's commit rules
              run: scripts/ci/commit-rules-ci.sh --base "$(git merge-base HEAD origin/main)"
            # A failed check keeps the hook's logs (its temp dir): their failure lines AND their tail here, as agentctl's
            # verdict reads them, so a remote check never fails output-less. Each log's errors first (Playwright's
            # `Error:` blocks, sbt's FAILED/[error]: run 3342's 60 `✘` lines filled every head and its error never
            # showed), then its last lines, whatever matched: `grep | head` exits 0 on no match, so the old `|| tail`
            # never ran.
            - name: The failed checks' lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      echo "-- its error lines (first 120):"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-rest
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore


    check-oldrefs:
        name: check (oldrefs)
        # identity-slice's tool files compiled into each floor ref: two whole old trees, 5-30 min cold under load. In the
        # rest job they pushed it past its 80 minutes (run 4083: scripttests, sbt and identity took 50, oldrefs the rest);
        # beside it in a job of its own, from the old trees Main's runs keep (restored below)
        runs-on: ubuntu-26.04
        # the page area alone is ~45 min here (diag run 3367, 2026-10-27: browsers + warm-up 2 min, the Chromium rows
        # 4 min, the WebKit row at its one worker ~23 min; web/PageTest/test ~10 min before them), so the hook gets 80
        # and the job 90, room for the failure steps after it
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet origin main
            # sbt, the JDK and the shared build cache, restored only: a check's tree is no main build to save
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'
            # the hook's tools that the job image lacks: a missing one blocks the check, as on the laptop
            - name: The hook's tools
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
                  for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
            # The old refs' laid-out, compiled trees Main keeps (tool-self-tests.yml, integration-test before it): the
            # compile then redoes only the tool files
            - name: Restore identity-slice's compiled old refs
              uses: actions/cache/restore@v5
              with:
                  path: ${{ runner.temp }}/kinowo-identity/refs
                  key: identity-old-ref-c2974e3aaea73fb841096a24316fb5e872154de9-none
                  restore-keys: |
                      identity-old-ref-c2974e3aaea73fb841096a24316fb5e872154de9-
            - name: The pre-push hook's checks of the change
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  SHARE: oldrefs
                  KINOWO_IDENTITY_CACHE: ${{ runner.temp }}/kinowo-identity
              run: |
                  mkdir -p "$TMPDIR"
                  # inside the job's 60 minutes, so the two failure steps below still print and upload its logs: the
                  # job's own timeout ends every step, those too, and leaves a run with no output at all (run 3357)
                  rc=0
                  # the branch names the hook's mode: check/fast-<id> is agentctl's batch check from ci-runner --
                  # the fast-only set (compile + the fast tests; each change passed its own full checks), as on the
                  # laptop; every other check/<id> the change's own checks
                  mode=--checks-only
                  case "$GITHUB_REF_NAME" in fast-*|check/fast-*) mode=--fast-only ;; esac
                  # the fast-only set is the sbt check alone: nothing for the page or oldrefs share
                  [ "$SHARE" = rest ] || [ "$mode" = --checks-only ] || exit 0
                  if [ "$SHARE" = rest ]; then export PREPUSH_ELSEWHERE="page oldrefs"; else export PREPUSH_ONLY="$SHARE"; fi
                  timeout --kill-after=60 80m scripts/hooks/pre-push "$mode" "$(git merge-base HEAD origin/main)..HEAD" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the pre-push checks ran past 80 minutes and were stopped"
                  exit "$rc"
            # A failed check keeps the hook's logs (its temp dir): their failure lines AND their tail here, as agentctl's
            # verdict reads them, so a remote check never fails output-less. Each log's errors first (Playwright's
            # `Error:` blocks, sbt's FAILED/[error]: run 3342's 60 `✘` lines filled every head and its error never
            # showed), then its last lines, whatever matched: `grep | head` exits 0 on no match, so the old `|| tail`
            # never ran.
            - name: The failed checks' lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      echo "-- its error lines (first 120):"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-oldrefs
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore


    check-page:
        name: check (page)
        # AFTER the rest, not beside it: beside it on the check tier its WebKit rows starved (landing check run 4059:
        # every WebKit test ~40 s, then timed out, past the 80 minutes) -- the reason it runs with a cap of its own -- and
        # after the heavy rows and the old refs' compile, which run beside the rest and would starve it the same way
        needs: [ check, check-oldrefs, heavy ]
        if: ${{ !cancelled() && needs.check.result == 'success' && needs.check-oldrefs.result == 'success' && needs.heavy.result != 'failure' }}
        runs-on: ubuntu-26.04
        # the page area alone is ~45 min here (diag run 3367, 2026-10-27: browsers + warm-up 2 min, the Chromium rows
        # 4 min, the WebKit row at its one worker ~23 min; web/PageTest/test ~10 min before them), so the hook gets 80
        # and the job 90, room for the failure steps after it
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet origin main
            # sbt, the JDK and the shared build cache, restored only: a check's tree is no main build to save
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'
            # the hook's tools that the job image lacks: a missing one blocks the check, as on the laptop
            - name: The hook's tools
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
                  for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
            - name: The pre-push hook's checks of the change
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  SHARE: page
              run: |
                  mkdir -p "$TMPDIR"
                  # inside the job's 60 minutes, so the two failure steps below still print and upload its logs: the
                  # job's own timeout ends every step, those too, and leaves a run with no output at all (run 3357)
                  rc=0
                  # the branch names the hook's mode: check/fast-<id> is agentctl's batch check from ci-runner --
                  # the fast-only set (compile + the fast tests; each change passed its own full checks), as on the
                  # laptop; every other check/<id> the change's own checks
                  mode=--checks-only
                  case "$GITHUB_REF_NAME" in fast-*|check/fast-*) mode=--fast-only ;; esac
                  # the fast-only set is the sbt check alone: nothing for the page or oldrefs share
                  [ "$SHARE" = rest ] || [ "$mode" = --checks-only ] || exit 0
                  if [ "$SHARE" = rest ]; then export PREPUSH_ELSEWHERE="page oldrefs"; else export PREPUSH_ONLY="$SHARE"; fi
                  timeout --kill-after=60 80m scripts/hooks/pre-push "$mode" "$(git merge-base HEAD origin/main)..HEAD" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the pre-push checks ran past 80 minutes and were stopped"
                  exit "$rc"
            # A failed check keeps the hook's logs (its temp dir): their failure lines AND their tail here, as agentctl's
            # verdict reads them, so a remote check never fails output-less. Each log's errors first (Playwright's
            # `Error:` blocks, sbt's FAILED/[error]: run 3342's 60 `✘` lines filled every head and its error never
            # showed), then its last lines, whatever matched: `grep | head` exits 0 on no match, so the old `|| tail`
            # never ran.
            - name: The failed checks' lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      echo "-- its error lines (first 120):"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-page
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore

    # MAIN'S HEAVY ROWS, BEFORE MAIN (ci-failures-2026-10-30, recommendation 3): 8 of Main's 14 code reds in five days
    # were in integration-test or e2e rows that nothing ran before the push -- Main was the first place they ran. Each
    # row the change can move (the plan above) runs here as Main runs it, through the same hook (PREPUSH_ONLY=<rows>):
    # `IT_ROW=<row> sbt itAll` against a throwaway MongoDB replica set (on 24.04: mongod 8.3 will not start on 26.04's
    # kernel 7.0, MongoServerVersionParitySpec), `sbt e2eRest` and `sbt e2eCorpus`.
    # ONE job running the selected rows one after another, not a job a row: four rows at once beside the rest and the
    # old refs starved the check tier, and an integration spec's loopback server missed its 30 s connect (landing
    # check run 4131, IssuerCertificateFetchingSpec; itrest took 1403 s against 431 s alone).
    heavy:
        name: heavy rows
        needs: [ plan ]
        if: ${{ needs.plan.outputs.heavy != '' }}
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet origin main
            - name: Start MongoDB (single-node replica set, for change streams)
              if: ${{ contains(needs.plan.outputs.heavy, 'it') }}
              run: scripts/ci/in-background.sh start mongo-start scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            # The it rows' build-cache family first (every module's main + test + it), restored only
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
                  target-cache-restore-keys: |
                      sbt-target-it-${{ runner.os }}-
                      sbt-target-unit-worker-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
            # The deploy specs the rest row runs read the gitops manifests where Main's row checks them out
            - name: Check out the gitops manifests (movies-gitops main, anonymously)
              if: ${{ contains(needs.plan.outputs.heavy, 'itrest') }}
              run: git clone --quiet --depth 1 --branch main "$GITHUB_SERVER_URL/pawelkrupinski/movies-gitops" infra/kubernetes
            - name: Wait for MongoDB, started in the background above
              if: ${{ contains(needs.plan.outputs.heavy, 'it') }}
              run: scripts/ci/in-background.sh wait mongo-start 240
            - name: The change's heavy rows
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  ROWS: ${{ needs.plan.outputs.heavy }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB: kinowo
              run: |
                  mkdir -p "$TMPDIR"
                  rc=0
                  PREPUSH_HEAVY_ROWS=1 PREPUSH_ONLY="$ROWS" timeout --kill-after=60 80m \
                      scripts/hooks/pre-push --checks-only "$(git merge-base HEAD origin/main)..HEAD" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the heavy rows ($ROWS) ran past 80 minutes and were stopped"
                  exit "$rc"
            - name: The failed row's lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job.
    timings:
        needs: [ plan, check, check-oldrefs, check-page, heavy ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not secrets by name: Forgejo 15 refuses a `workflow_call.secrets` block.
        secrets: inherit
