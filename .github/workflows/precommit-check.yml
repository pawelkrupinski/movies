name: Pre-commit check

# REMOTE CHECKS (agentctl's land queue, ~/bin/AGENTCTL.md "remote checks"; the owner, 2026-10-27): while the laptop is
# under memory or CPU pressure, a queued change's pre-commit checks run HERE, on CI (the ubuntu
# runner), instead of on the laptop. agentctl pushes the change's checked tip to `check/<entry>`
# (the pre-push hook checks nothing for a check/ branch: a run's ref, never landed), this run runs THE SAME HOOK over it
# -- `scripts/hooks/pre-push --checks-only <merge-base with main>..HEAD`: the path-selected checks, the basic tests and
# the touched areas' tests, the red gate left to the push to main -- and agentctl reads the verdict, deletes the branch
# and pushes to main with PREPUSH_REMOTE_RUN=<this run's id>, which the hook takes for its checks only once GitHub
# confirms that this workflow succeeded on that very commit.
#
# WHERE IT RUNS: with the repository variable MOVIES_CI_RUNNERS=self-hosted, every job on ci-runner's `movies-check` slots
# (infra nix/hosts/ci-runner/movies-runners.nix: one ephemeral hosted-Ubuntu container per job), so landing checks never
# queue Main for GitHub Free's 20 hosted runners; unset, on GitHub's hosted runners as before -- the fallback while
# ci-runner is down. (SelfHostedRunnersSpec)
on:
    push:
        branches: ['check/**']

concurrency:
    group: precommit-check-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read


env:
    # ci-runner's job image (catthehacker's hosted-Ubuntu copy) sets no locale, where a hosted VM sets C.UTF-8: the JVM
    # then encodes file names as ASCII and every fixture path with a Polish letter throws InvalidPathException
    # (precommit-check run 41356052566). (SelfHostedRunnersSpec)
    LANG: C.UTF-8

jobs:
    # WHAT THE CHANGE SELECTS (scripts/ci/precommit-share.sh checks plan: the hook's own selection, PREPUSH_LIST=1, with
    # PREPUSH_HEAVY_ROWS=1), for the jobs that run only when it names their share: the old refs, the page area and Main's
    # heavy rows (`itrest`, `itidentity`, `e2e`, `e2ecorpus`), and identity's three shards. A job the plan does not name is
    # skipped, never created: under load a created job waits for a slot even to do nothing. The rest starts beside it.
    plan:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-check' || 'ubuntu-26.04' }}
        timeout-minutes: 10
        outputs:
            heavy: ${{ steps.plan.outputs.heavy }}
            heavy-groups: ${{ steps.plan.outputs.heavy-groups }}
            page: ${{ steps.plan.outputs.page }}
            oldrefs: ${{ steps.plan.outputs.oldrefs }}
            identity: ${{ steps.plan.outputs.identity }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # every commit and tree, no file contents but HEAD's (fetched with the checkout) -- the history the hook walks
                  # (merge base, commit rules, old refs) is all there and any older file arrives on demand. The whole repository
                  # (2 GB of packs) took 65-71 s a job; this 18 s (probe run 41387934910, ci-runner).
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet --filter=blob:none origin main
            - name: What the change selects
              id: plan
              run: |
                  checks=" $(scripts/ci/precommit-share.sh checks plan) "
                  echo "the change's checks:${checks% }"
                  rows="$(tr ' ' '\n' <<< "$checks" | grep -xE 'itrest|itidentity|e2ecorpus|e2e' | tr '\n' ' ' | sed 's/ *$//' || true)"
                  echo "heavy=$rows" >> "$GITHUB_OUTPUT"
                  # THE HEAVY ROWS IN TWO JOBS: `itrest` (~4.5 min with its compile) alone, the other rows (~1.5-2 min each) together
                  groups="$(python3 -c 'import json, sys; r = sys.argv[1].split(); g = [x for x in (["itrest"] if "itrest" in r else []) + [" ".join(x for x in r if x != "itrest")] if x]; print(json.dumps(g or [""]))' "$rows")"
                  echo "heavy-groups=$groups" >> "$GITHUB_OUTPUT"
                  for share in page oldrefs identity; do
                      case "$checks" in *" $share "*) echo "$share=true" ;; *) echo "$share=false" ;; esac >> "$GITHUB_OUTPUT"
                  done
                  echo "heavy rows: ${rows:-none} as $groups"
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # THE SPLIT CHECK (scripts/hooks/pre-push, PREPUSH_ONLY / PREPUSH_ELSEWHERE): the hook's selected checks shared
    # between jobs, each with an 80-minute cap of its own. In one job they ran one after another under one cap: run
    # 4025 (a 124-path batch) spent 7 min on scripttests, 8 on sbt, 13 on identity and 37 on page, and ran out of its 80
    # minutes with oldrefs, ios and identitydrift still to go. `check (rest)` runs every selected check but the page
    # area, the old refs and identity; `check (identity k/3)` a third of identity's specs each; `check (oldrefs)` the old
    # refs beside them; `check (page)` the page area alone, after all of them.
    check:
        name: check (rest)
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-check' || 'ubuntu-26.04' }}
        # the page area alone is ~45 min here (diag run 3367, 2026-10-27: browsers + warm-up 2 min, the Chromium rows
        # 4 min, the WebKit row at its one worker ~23 min; web/PageTest/test ~10 min before them), so the hook gets 80
        # and the job 90, room for the failure steps after it
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  # every commit and tree, no file contents but HEAD's (fetched with the checkout) -- the history the hook walks
                  # (merge base, commit rules, old refs) is all there and any older file arrives on demand. The whole repository
                  # (2 GB of packs) took 65-71 s a job; this 18 s (probe run 41387934910, ci-runner).
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Fetch main, the base the change sits on
              run: git fetch --quiet --filter=blob:none origin main
            # What the hook runs in this job (scripts/ci/precommit-share.sh: the hook's own selection, PREPUSH_LIST=1): nothing set
            # up below for a share with nothing to run. The hook step still runs, so a check this missed fails there, never unrun.
            - name: What this job runs
              id: share
              env:
                  SHARE: rest
              run: |
                  scripts/ci/precommit-share.sh env "$SHARE" >> "$GITHUB_ENV"
                  checks="$(scripts/ci/precommit-share.sh checks "$SHARE")"
                  echo "this job's checks: ${checks:-none}"
                  echo "checks=$checks" >> "$GITHUB_OUTPUT"
            # sbt, the JDK and main's landing-check build cache, restored only: a check's tree is no main build to save
            - uses: ./.github/actions/setup-sbt-build
              if: steps.share.outputs.checks != ''
              with:
                  target-cache-restore-only: 'true'
                  # main's newest complete build (precheck-build-cache.yml); the shared family only before its first
                  target-cache-key: sbt-target-precheck-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-precheck-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
            - uses: actions/setup-node@v5
              if: steps.share.outputs.checks != ''
              with:
                  node-version: '22'
                  cache: 'npm'
            # the hook's tools that the job image lacks: a missing one blocks the check, as on the laptop
            - name: The hook's tools
              if: steps.share.outputs.checks != ''
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
                  for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
            - name: The pre-push hook's checks of the change
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  TMPDIR: ${{ runner.temp }}/hook
                  SHARE: rest
              run: |
                  mkdir -p "$TMPDIR"
                  # inside the job's 90 minutes, so the two failure steps below still print and upload its logs: the
                  # job's own timeout ends every step, those too, and leaves a run with no output at all (run 3357)
                  rc=0
                  # the branch names the hook's mode (PREPUSH_MODE, from precommit-share.sh): check/fast-<id> is agentctl's batch
                  # check -- the fast-only set (compile + the fast tests; each change passed its own full checks), as on the
                  # laptop; every other check/<id> the change's own checks. The fast-only set is the rest's alone.
                  [ "$SHARE" = rest ] || [ "$PREPUSH_MODE" = --checks-only ] || exit 0
                  timeout --kill-after=60 80m scripts/hooks/pre-push "$PREPUSH_MODE" "$PREPUSH_RANGE" || rc=$?
                  [ "$rc" != 124 ] || echo "::error::the pre-push checks ran past 80 minutes and were stopped"
                  exit "$rc"
            # The drift gate's commit rules over the change's commits, whatever paths it touched (scripts/ci/commit-rules-ci.sh):
            # the hook selects them by path; here no selection can leave them out.
            - name: The change's commits keep the drift gate's commit rules
              run: scripts/ci/commit-rules-ci.sh --base "$(git merge-base HEAD origin/main)"
            # A failed check keeps the hook's logs (its temp dir): their failure lines AND their tail here, as agentctl's
            # verdict reads them, so a remote check never fails output-less. Each log's errors first (Playwright's
            # `Error:` blocks, sbt's FAILED/[error]: run 3342's 60 `✘` lines filled every head and its error never
            # showed), then its last lines, whatever matched: `grep | head` exits 0 on no match, so the old `|| tail`
            # never ran.
            - name: The failed checks' lines
              if: failure()
              env:
                  HOOK_TMP: ${{ runner.temp }}/hook
              run: |
                  find "$HOOK_TMP" -name '*.log' -print0 | while IFS= read -r -d '' log; do
                      echo "::group::$log"
                      echo "-- its error lines (first 120):"
                      grep -E -B2 -A8 '\*\*\* FAILED|\[error\]|::error::|^ *Error:|Error: |[0-9]+ failed' "$log" | head -120 || true
                      echo "-- its last 60 lines:"
                      tail -60 "$log"
                      echo "::endgroup::"
                  done
            # ...and every log whole, for what the lines above leave out
            - name: The hook's logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: precommit-check-logs-rest
                  path: ${{ runner.temp }}/hook/**/*.log
                  if-no-files-found: ignore
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # THE IDENTITY SHARDS: the identity module's tests ran after the sbt check in the rest's job (292 s then 585 s, a
    # 15.9-minute job, run 41276112019), then in one job of their own beside it (~12.5 min: 2.5 min selecting, 10 min of
    # ~300 specs, run 41373956176). Now in three, after the plan: every shard selects the same specs (the hook's test-impact
    # selection) and runs a third of them (PREPUSH_IDENTITY_SHARD, scripts/ci/shard_tests.py: each class in exactly one shard,
    # balanced on scripts/ci/shard-weights-identity.tsv). A change the hook gives no identity check sets nothing up.
    check-identity:
        name: check (identity ${{ matrix.shard }}/3)
        # only for a change the plan gives an identity check: three shards created at t=0 for a scripts change waited up
        # to 20 min for a slot under load, to do nothing (precommit-check run 41403785550: 26 min wall, 10 runner-min)
        needs: [ plan ]
        if: ${{ needs.plan.outputs.identity == 'true' }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-check' || 'ubuntu-26.04' }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            - uses: actions/checkout@v5
              with:
                  # every commit and tree, no file contents but HEAD's (fetched with the checkout) -- the history the hook walks
                  # (merge base, commit rules, old refs) is all there and any older file arrives on demand. The whole repository
                  # (2 GB of packs) took 65-71 s a job; this 18 s (probe run 41387934910, ci-runner).
