name: Regenerate OG share cards

# Weekly refresh of the per-city Open Graph share cards
# (web/src/main/assets/img/og-{slug}.jpg) from the LIVE prod repertoire, so the
# link previews Facebook/Messenger/X/Slack render don't freeze on one week's
# posters. The cards are a screenshot of each `/{slug}/` page (all dates shown)
# under the deployment's wordmark + city line overlay — "Kinowo / Repertuar kin
# w {locative}" for Poland — see `web/src/page/scala/tools/OgCardGenerator.scala`.
#
# Runs once PER deployed country — all four of them. Every country gets its `/`
# landing card (`og-home{-code}.jpg`) and then its cities. The sweep is a card
# per city and the US alone is ~525 of them, so the countries are a MATRIX
# rather than sequential steps in one job: four ~45min-worst-case legs in
# parallel, instead of one job that would run past any sane timeout.
#
# `Country.ogOrigin` points each leg at that country's own base URL (path prefix
# included), and falls back to the DEPLOYED host for an undeployed country — so
# a leg for a country whose `webUrl` has gone dark does not fail loudly, it
# screenshots ITS OWN slugs on some other country's site and commits a PR full
# of 404 cards. That is why a leg is deleted rather than left running when a
# deployment is retired (as the UK's was between 2026-08-02 and 2026-08-29).
#
# This only authors a branch + PR for a human to review — it does NOT push to
# main and does NOT deploy. The repertoire moves week to week, so a run almost
# always produces a diff; a truly unchanged week produces no PR.
#
# Like sync-title-rules.yml, the PR is opened via the "Kinowo Sync Bot" GitHub
# App so Branch CI runs on it (a PR created with the default GITHUB_TOKEN never
# triggers `pull_request` — GitHub's recursion guard). Reuses the same repo
# secrets: SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY.

on:
    # Manual trigger for an on-demand refresh.
    workflow_dispatch:

    # Friday 00:00 UTC (midnight). GitHub cron is UTC-only and can't follow DST,
    # so this is ~02:00 Warsaw in summer / 01:00 in winter — early Friday morning
    # either way.
    schedule:
        - cron: '0 0 * * 5'

permissions:
    contents: read

jobs:
    # One leg per country: screenshot its landing card + every city card, and
    # hand the JPEGs to the `open-pr` job as an artifact. The legs do NOT commit
    # — four jobs pushing to one branch would race each other, and the last one
    # to finish would be the only country in the PR.
    generate:
        name: cards (${{ matrix.country }})
        strategy:
            # One country's flaky screenshot must not cost the other three their
            # refresh.
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl }
                    - { country: united-kingdom, code: uk }
                    - { country: germany,        code: de }
                    - { country: united-states,  code: us }
        runs-on: ubuntu-latest
        # ~5s a card, and the US is ~525 cards (55 states + their metros) — the
        # sweep alone is ~45 minutes there before a cold compile.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5

            # Same Scala toolchain as the other sbt jobs (Temurin JDK 25 + sbt
            # dependency caching).
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            # Headless Chrome for the CDP-driven generator — same install +
            # `CDP_BROWSER_BIN` wiring the page-test jobs use.
            - uses: browser-actions/setup-chrome@v1
              id: setup-chrome
              with:
                  chrome-version: stable

            # Fonts the card overlay renders: a clean Arial-metric sans for the
            # "Kinowo" wordmark + the city line (the CSS asks for Helvetica
            # Neue/Arial, absent on the runner), and colour emoji for the 🎬
            # glyph. Without these the wordmark falls back to a default face and
            # the clapperboard renders as tofu.
            - name: Install card fonts
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-noto-color-emoji

            # Share the same zinc/sbt-target cache shape as ci.yml so a cold
            # compile is the exception.
            - uses: actions/cache@v5
              with:
                  path: |
                      target
                      project/target
                      project/project/target
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/it/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            # The `/` landing montage — `og-home.jpg` for Poland, `og-home-{code}.jpg`
            # elsewhere. Screenshots the country's primary city under the same
            # overlay with the national tagline. One card, well under a minute.
            - name: Regenerate the ${{ matrix.country }} landing card
              env:
                  CDP_BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
                  KINOWO_COUNTRY: ${{ matrix.code }}
              run: sbt "web/PageTest/runMain tools.OgCardGenerator home"

            # Every live city page → web/src/main/assets/img/og-{slug}.jpg. Hits
            # the public prod site — no Mongo/Fly secrets needed. ~5s/city.
            # KINOWO_COUNTRY picks the brand/language and the base URL
            # screenshotted (its own webUrl, path prefix included).
            - name: Regenerate the ${{ matrix.country }} city cards
              env:
                  CDP_BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
                  KINOWO_COUNTRY: ${{ matrix.code }}
              run: sbt "web/PageTest/runMain tools.OgCardGenerator"

            - uses: actions/upload-artifact@v6
              with:
                  name: og-cards-${{ matrix.code }}
                  path: web/src/main/assets/img/og-*.jpg
                  retention-days: 3
                  overwrite: true
                  if-no-files-found: error

    # Collect every leg's cards into ONE commit. Runs even when a leg failed
    # (`always()` + a non-cancelled guard), so three good countries still land
    # their refresh while the fourth is retried — a leg that produced nothing
    # simply contributes no files.
    open-pr:
        needs: generate
        if: always() && !cancelled()
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        steps:
            # Short-lived installation token for the "Kinowo Sync Bot" GitHub App.
            # The PR below is opened with THIS token (not GITHUB_TOKEN) so it fires
            # `pull_request` and Branch CI runs on the refresh PR without a human
            # nudge. Needs repo secrets SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY
            # (set up for sync-title-rules.yml — see that file's header).
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v5

            - uses: actions/download-artifact@v6
              with:
                  pattern: og-cards-*
                  merge-multiple: true
                  path: web/src/main/assets/img

            # Open (or update) a PR with the refreshed cards. A fixed branch means
            # a later run amends the open PR instead of stacking duplicates; if a
            # run somehow produced no pixel diff, the action is a no-op (no PR).
            # `add-paths` scopes the commit to the cards so nothing else can ride
            # along.
            - name: Open regenerate PR
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: chore/regenerate-og-cards
                  delete-branch: true
                  add-paths: web/src/main/assets/img/og-*.jpg
                  commit-message: 'chore: regenerate per-city OG share cards'
                  title: 'chore: regenerate per-city OG share cards'
                  body: |
                      Automated weekly refresh of the per-city Open Graph share
                      cards (`web/src/main/assets/img/og-{slug}.jpg`) from the live
                      prod repertoire, so the link previews don't freeze on one
                      week's posters. Covers all four deployed countries — Poland,
                      the UK, Germany and the US — landing card included.

                      Each card is a screenshot of that city's `/{slug}/` page (all
                      dates shown) under the deployment's overlay — "Kinowo /
                      Repertuar kin w {locative}", "Showtimes / Cinema listings in
                      {city}". **Skim the cards** before merging — a city that's
                      genuinely film-dormant this week will show a sparse grid, and
                      a leg pointed at a dark deployment shows someone else's site.

                      Generated by `.github/workflows/regenerate-og-cards.yml`
                      (`tools.OgCardGenerator`).
