#
# Per-country pipeline convergence.
#
# Asks, for each country independently: does the scrape → fold → settle loop
# reach a fixpoint on THIS country's cinema catalogue and country-scoped title
# rules? The corpus is written into a real `cinema_scrapes` collection and
# replayed back out, so the archive's round-trip is on the path too.
#
# One leg per country, in parallel. They must be separate JOBS, not threads in
# one JVM: each leg installs its country's `TitleRuleSet` into `TitleNormalizer`
# process-globally, so two countries sharing a process would overwrite each
# other's normalisation and silently test the wrong rules. Each leg also gets its
# own MongoDB container and — inside it — a uniquely named database per run
# (`IsolatedMongoDatabase`), so nothing here can collide with anything else,
# including a re-run of itself.
#
# Deliberately NOT part of ci.yml: that workflow runs against a hard 20-runner
# budget (1 test + 1 integration + 4 e2e + 1 mobile + 13 page-tests), and three
# more legs would have meant re-cutting the existing shards. This runs on its
# own on pushes that touch the pipeline, and nightly to catch drift that lands
# through a data or dependency change rather than a code one.
#
name: Country convergence

on:
    # Runs AFTER `Deploy to Fly.io` finishes — not on push. These legs are
    # minutes long (Poland 3, Germany 9, the UK
    # 14) and firing them in parallel with the deploy workflow put three
    # heavyweight jobs on the runner pool at exactly the moment the deploy needed
    # it, for a signal nobody gates the deploy on anyway. Chaining keeps the
    # deploy's "all green" arriving as early as it always did and still runs the
    # convergence check against the very commit that shipped.
    workflow_run:
        workflows: [Deploy to Fly.io]
        types: [completed]
        branches: [main]
    schedule:
        # 04:20 UTC — after the nightly country-fixture recorder, before the day starts.
        - cron: '20 4 * * *'
    workflow_dispatch:

concurrency:
    # One lane for the whole workflow, so a new run always supersedes the one
    # still in flight. Keying on the head SHA and the event name (as this did)
    # gave every deploy, nightly and manual run its own lane, which meant
    # nothing ever cancelled anything: three legs of up to 75 minutes each piled
    # up on the runner pool while the only run whose result anyone reads is the
    # newest one. All three triggers land on `main`, so the ref keeps a lane per
    # branch for the rare dispatch from somewhere else without splitting main's.
    group: country-convergence-${{ github.ref }}
    cancel-in-progress: true

jobs:
    convergence:
        # workflow_run fires on ANY conclusion, including a failed or cancelled
        # deploy — gate to success so a broken build doesn't spend 26 runner
        # minutes proving its own corpus converges. Schedule and manual runs have
        # no upstream conclusion and always proceed.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        name: convergence (${{ matrix.country }})
        strategy:
            # Every country reports independently — one country's flap must not
            # hide whether the other two converged.
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl, cmd: convergencePoland }
                    - { country: germany,        code: de, cmd: convergenceGermany }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk }
        runs-on: ubuntu-latest
        # 45 was not enough headroom and cost a real run: on 2026-07-28 the Germany
        # and UK legs were CANCELLED at exactly 45m while Poland finished in 8,
        # because the corpus was mis-sized (Poland's films-per-venue ratio applied
        # to every country — see CountryScrapeCorpus.shapeOf). The sizing is fixed,
        # but a CI runner is a good deal slower than the machine these are timed on,
        # so the ceiling now sits well clear of the expected run rather than just
        # above it. A leg that approaches this is a signal to re-measure the shape,
        # not to raise the number again.
        timeout-minutes: 75
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            # Single-node replica set, not a standalone: the pipeline's repository
            # layer opens change streams, which a standalone mongod rejects (40573).
            - name: Start MongoDB (single-node replica set, for change streams)
              run: |
                  docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
                  until docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done
                  docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
                  until docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$'; do sleep 1; done

            # Prod Mongo has NO public IP — it lives on the Fly private network and
            # is reachable only through a proxy. The legs need it for two things:
            # the real `cinema_scrapes` corpus they replay (read-only) and the
            # enrichment cache they share (`convergence_test`, read-write).
            #
            # Port 27018, not 27017: the throwaway corpus container above already
            # holds 27017, and the two must not collide. The `CONVERGENCE_MONGODB_URI`
            # secret names 27018 for the same reason.
            #
            # `convergence_ci` is scoped to `read` on the country databases and
            # `readWrite` on `convergence_test` alone, so a leg cannot write prod
            # film data even if the code tried to.
            - uses: superfly/flyctl-actions/setup-flyctl@master
            - name: Tunnel to prod Mongo (corpus source + shared enrichment cache)
              run: |
                  flyctl proxy 27018:27017 --app kinowo-mongo &
                  for _ in $(seq 1 60); do nc -z 127.0.0.1 27018 && break; sleep 1; done
                  nc -z 127.0.0.1 27018 || { echo "prod Mongo tunnel never came up"; exit 1; }
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt
            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      target
                      project/target
                      project/project/target
                  key: sbt-target-convergence-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala') }}
                  restore-keys: |
                      sbt-target-convergence-${{ runner.os }}-
                      sbt-target-e2e-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            - run: sbt ${{ matrix.cmd }}
              env:
                  # No MONGODB_DB: each run names its own throwaway database via
                  # `IsolatedMongoDatabase`, and drops it on the way out.
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  # The spec installs this country's TitleRuleSet itself; naming the
                  # country here too means anything that reads the environment
                  # directly (`Country.soleFromEnv`) agrees with it rather than
                  # falling back to the Poland default.
                  KINOWO_COUNTRY:   ${{ matrix.code }}
                  KINOWO_COUNTRIES: ${{ matrix.code }}
                  # Replay this country's REAL repertoire instead of the generated
                  # corpus. The generated one cannot exercise enrichment at all —
                  # every row carries `director = Seq("Some Director")`, which sends
                  # resolution down the director-walk branch and guarantees a miss —
                  # so without this the enrichment fields sit the convergence claim
                  # out as None. `_DB` defaults to the country's own database.
                  KINOWO_CONVERGENCE_SCRAPES_URI: ${{ secrets.CONVERGENCE_MONGODB_URI }}
                  # The enrichment cache, on the shared cluster rather than in this
                  # leg's throwaway container: a container-local cache would be cold
                  # every run, which is a full live sweep against TMDB/IMDb/Filmweb/
                  # RT/Metacritic each time. Shared, the first run fills it and the
                  # rest replay it until the 1-day TTL turns it over.
                  KINOWO_CONVERGENCE_CACHE_URI:   ${{ secrets.CONVERGENCE_MONGODB_URI }}
                  # Without a real key TmdbClient short-circuits and nothing resolves,
                  # so the cache would have nothing to hold and the real corpus would
                  # buy nothing over the generated one.
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}

            - name: Publish convergence test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: convergence (${{ matrix.country }})
                  detailed_summary: true
                  include_passed: false

            # A leaked database means the drop didn't run — worth seeing in the log
            # rather than discovering as a slowly filling disk.
            - name: Report any leaked isolated databases
              if: always()
              run: |
                  docker exec mongo mongosh --quiet --eval \
                    'db.adminCommand({listDatabases:1,nameOnly:true}).databases
                       .map(d => d.name).filter(n => n.startsWith("kinowo_isolated")).join("\n")'
