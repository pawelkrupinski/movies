#
# Per-country pipeline convergence.
#
# Asks, for each country independently: does the scrape → fold → settle loop
# reach a fixpoint on THIS country's cinema catalogue and country-scoped title
# rules? The corpus is written into a real `cinema_scrapes` collection and
# replayed back out, so the archive's round-trip is on the path too.
#
# One leg per country, in parallel and independent of each other. The sample gate
# and the full run for a country both live in `country-convergence-leg.yml`, called
# once per country from the matrix below (the United States calls the same file from
# `us-convergence.yml`, for the lane, not for the leg) — that file explains why the pair has to be
# its own workflow rather than two matrix jobs here (`needs:` joins JOBS, not matrix
# legs, so one shared `needs: sample` made every country wait for every other
# country's sample).
#
# Deliberately NOT part of ci.yml: that workflow runs against a hard 20-runner
# budget (1 test + 1 integration + 4 e2e + 1 mobile + 13 page-tests), and three
# more legs would have meant re-cutting the existing shards. This runs on its
# own on pushes that touch the pipeline, and nightly to catch drift that lands
# through a data or dependency change rather than a code one.
#
name: Country convergence

on:
    # Dispatched by `Main` — not on push. Its `kick-convergence` job
    # hangs off the same `needs: ci` the deploy does, so these legs start alongside
    # it rather than behind it.
    #
    # They are TENS of minutes long once enrichment actually runs (Poland 12 warm,
    # ~22 on a cache it has to build first; Germany and the UK carry 1.6x and 2.2x
    # Poland's films), and the lane below is single and cancel-in-progress — so every
    # minute spent queueing behind something else is a minute in which the next push
    # can supersede the run before it reaches an assertion. Starting with the deploy
    # rather than after it is head start against exactly that. The runner-pool cost is
    # four concurrent jobs while the deploy runs; the deploy is a flyctl release wait,
    # so it contends for a slot, not for CPU.
    #
    # Deploy-time dispatch is best-effort by construction. The nightly schedule below
    # is the run that is guaranteed to finish.
    schedule:
        # 04:20 UTC — after the nightly country-fixture recorder, before the day starts.
        - cron: '20 4 * * *'
    workflow_dispatch:

concurrency:
    # ONE lane for the whole workflow — a constant, with nothing per-run in it — so
    # a new run always supersedes the one still in flight, whatever branch or event
    # it came from. GitHub collapses runs only when this string is EQUAL, so every
    # expression added here silently buys another lane:
    #
    #   - `${{ github.sha }}`-`${{ github.event_name }}` (the original) gave every
    #     deploy, nightly and manual run a lane of its own — nothing ever cancelled
    #     anything, and legs of up to 135 minutes piled up on the runner pool while
    #     only the newest run's result gets read.
    #   - `${{ github.ref }}` (the replacement) looked like it only split main from
    #     the rare foreign dispatch. It isn't rare: dispatching by hand from a
    #     worktree branch is how this suite normally gets run manually here. On
    #     2026-08-01 a `convergence-imdb-ladder` dispatch and a main deploy dispatch
    #     ran side by side for an hour — six heavyweight legs at once.
    #
    # The cost is deliberate: a hand-dispatched branch run is cancelled by the next
    # push to main. One authoritative answer is worth more than several competing
    # ones. (ConvergenceConcurrencyConfigSpec)
    #
    # It is deliberate because these four legs are CHEAP to throw away — 12 to 73
    # warm minutes, against a fixture tree that stays warm either way. That is what
    # stopped being true for the United States, which is why it left: its leg spends
    # hours recording the tree it is replaying, so a supersede costs the work AND
    # leaves its replacement exactly as cold. Don't add a country here without asking
    # which of the two it is.
    group: country-convergence
    # Unconditional again, and safe now: every run of this workflow is either a
    # deploy-triggered dispatch or a deliberate one, so there are no runs that exist
    # only to skip. Previously a skipped `workflow_run` run took the lane and
    # cancelled a leg 21.5 minutes into real work; the deploy dispatching us
    # explicitly removes that class of run entirely.
    cancel-in-progress: true

jobs:
    # One call per country, each carrying its own sample → convergence chain, so a
    # country's full leg waits on ITS OWN sample and nothing else.
    #
    # `fail-fast: false`, and that is the whole point of the split: every country
    # reports independently, and a country whose sample fails stops only that
    # country's full leg. Under the old shared `needs:` it stopped all of them, so one
    # country's flap cost the day's answer for the other two as well.
    #
    # `permissions` here is the CEILING for the called workflow's jobs, which narrow
    # it further per job — `contents: write` for the rolling release the fixture
    # trees live in, `actions: read` for the artifact bootstrap.
    leg:
        name: ${{ matrix.country }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # `job`/`suite` and `sampleJob`/`sampleSuite` are this country's
                    # timeout budgets, in minutes. These four carry the numbers the leg
                    # has always defaulted to; they are the warm countries, and what makes
                    # them warm is an enrichment tree their own legs keep refreshed. Spain
                    # joins them on the same budget: 595 venues is between the UK's paced set
                    # and Germany's roster, both of which fit it comfortably.
                    #
                    # The United States is NOT here. It runs the same leg from
                    # `us-convergence.yml`, on a budget several times this one and a lane
                    # that does not cancel in progress — a cold country's leg records the
                    # tree that makes the next one fast, so superseding it at hour four
                    # leaves the next run just as cold. That whole argument, and why it
                    # does NOT apply to a 12-minute Poland leg, is in that file's header.
                    #
                    # `heap` is the sbt JVM's `-Xmx`, and 4g is what these four have
                    # always run on — it is what `.jvmopts` names and what a 16 GB runner
                    # would default to. Stated rather than inherited, so the number a leg
                    # runs on is a decision somebody made. The US needs more; see there.
                    - { country: poland,         code: pl, cmd: convergencePoland,  sample: convergencePolandSample, job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: germany,        code: de, cmd: convergenceGermany, sample: convergenceGermanySample, job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk,      sample: convergenceUkSample,      job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: spain,          code: es, cmd: convergenceSpain,   sample: convergenceSpainSample,   job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
        with:
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-job-timeout-minutes:    ${{ matrix.sampleJob }}
            sample-suite-timeout-minutes:  ${{ matrix.sampleSuite }}
            heap:                          ${{ matrix.heap }}
        # TMDB_API_KEY / OMDB_API_KEY, and the GITHUB_TOKEN the setup action reads.
        secrets: inherit

    # There is no `record-enrichment` job any more. It dispatched `Record enrichment
    # fixtures`, which opens a tunnel to the shared Mongo cache and dumps it back out
    # as files — a round trip that only made sense while the legs wrote their fills
    # INTO that cache. They no longer do (see the called workflow's env block); each
    # leg now publishes the fixture tree it recorded directly, so the recorder would
    # have dumped an ever-staler snapshot over a tunnel, on top of a capture that is
    # already newer. The workflow itself stays, dispatch-only, as the way to re-cut a
    # country's fixtures from the cache by hand.
