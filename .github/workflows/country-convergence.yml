#
# Per-country pipeline convergence.
#
# Asks, for each country independently: does the scrape → fold → settle loop
# reach a fixpoint on THIS country's cinema catalogue and country-scoped title
# rules? The corpus is written into a real `cinema_scrapes` collection and
# replayed back out, so the archive's round-trip is on the path too.
#
# One leg per country, in parallel and independent of each other. The sample gate
# and the full run for a country both live in `country-convergence-leg.yml`, called
# once per country from the matrix below, the United States included — that file explains why
# the pair has to be its own workflow rather than two matrix jobs here (`needs:` joins JOBS, not matrix
# legs, so one shared `needs: sample` made every country wait for every other
# country's sample).
#
# Deliberately NOT part of ci.yml: that workflow runs against a hard 20-runner
# budget (1 test + 1 integration + 4 e2e + 1 mobile + 13 page-tests), and three
# more legs would have meant re-cutting the existing shards. This runs on its
# own on pushes that touch the pipeline, and nightly to catch drift that lands
# through a data or dependency change rather than a code one.
#
name: Country convergence

on:
    # Dispatched by `Main` — not on push. Its `kick-convergence` job
    # hangs off the same `needs: ci` the deploy does, so these legs start alongside
    # it rather than behind it.
    #
    # They are TENS of minutes long once enrichment actually runs (Poland 12 warm,
    # ~22 on a cache it has to build first; Germany and the UK carry 1.6x and 2.2x
    # Poland's films), and the lane below queues rather than cancels — so starting
    # alongside the deploy, instead of after it, is what keeps a leg dispatched by
    # one push from still being queued when the next push's leg would otherwise
    # jump ahead of it. The runner-pool cost is four concurrent jobs while the
    # deploy runs; the deploy is a flyctl release wait, so it contends for a slot,
    # not for CPU.
    #
    # Deploy-time dispatch is best-effort by construction. The nightly schedule below
    # is the run that is guaranteed to finish.
    schedule:
        # 04:20 UTC — after the nightly country-fixture recorder, before the day starts.
        - cron: '20 4 * * *'
    workflow_dispatch:

concurrency:
    # ONE lane for the whole workflow — a constant, with nothing per-run in it — so
    # GitHub collapses every run into it regardless of branch or event. Expression
    # keys were tried and rejected:
    #
    #   - `${{ github.sha }}`-`${{ github.event_name }}` (the original) gave every
    #     deploy, nightly and manual run a lane of its own — nothing ever cancelled
    #     anything, and legs of up to 135 minutes piled up on the runner pool while
    #     only the newest run's result gets read.
    #   - `${{ github.ref }}` (a later attempt) looked like it only split main from
    #     the rare foreign dispatch. It isn't rare: dispatching by hand from a
    #     worktree branch is how this suite normally gets run manually here. On
    #     2026-08-01 a `convergence-imdb-ladder` dispatch and a main deploy dispatch
    #     ran side by side for an hour — six heavyweight legs at once.
    group: country-convergence
    # NOT `true` any more (Paweł, 2026-09-08): finish what is running, hold at most
    # one newer run pending behind it, and drop every push in between. The group is
    # still a constant, so this is one lane, not one lane per commit — GitHub's rule
    # for a group that does not cancel in progress is that the run in flight is left
    # alone, at most ONE run may be pending behind it, and a newly queued run cancels
    # whatever was pending before it. A day of pushes into a running leg produces
    # exactly two runs: the one finishing, and the newest commit's.
    #
    # These four legs used to be CHEAP to throw away — 12 to 73 warm minutes,
    # against a fixture tree that stays warm either way — and cancel-in-progress
    # traded a run's progress for one authoritative answer per push. That trade
    # is gone: a cancelled run now answers NOTHING rather than answering late, so
    # the suite could go a whole day of frequent pushes without ever finishing a
    # leg. Queueing behind the run in flight costs a few more minutes of runner
    # time per push; it is worth it for a suite that otherwise never reports.
    #
    # `main.yml`'s `free-runners` job existed only to preempt this workflow for
    # the deploy — retired in the same change, because preempting a run this
    # lane no longer intends to throw away is a regression, not a runner-budget
    # optimisation. (ConvergenceConcurrencyConfigSpec, CiRunnerBudgetSpec)
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # Seconds, first: the secrets the jobs below read are set, so a missing one fails here
    # rather than hours into a leg. OMDB_API_KEY is left out: the legs read it, but it is not a repository secret and they run without it. scripts/ci/preflight.sh never prints a value.
    # (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Secrets present
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

    # One call per country, each carrying its own sample → convergence chain, so a
    # country's full leg waits on ITS OWN sample and nothing else.
    #
    # `fail-fast: false`, and that is the whole point of the split: every country
    # reports independently, and a country whose sample fails stops only that
    # country's full leg. Under the old shared `needs:` it stopped all of them, so one
    # country's flap cost the day's answer for the other two as well.
    #
    # `permissions` here is the CEILING for the called workflow's jobs, which narrow
    # it further per job — `contents: write` for the rolling release the fixture
    # trees live in, `actions: read` for the artifact bootstrap.
    leg:
        needs: preflight
        name: ${{ matrix.country }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # `job`/`suite` and `sampleJob`/`sampleSuite` are this country's
                    # timeout budgets, in minutes. The first four carry the numbers the leg
                    # has always defaulted to. Spain joins them on the same budget: 595 venues
                    # is between the UK's paced set and Germany's roster, both of which fit it.
                    #
                    # `heap` is the sbt JVM's `-Xmx`, and 4g is what these four have
                    # always run on — it is what `.jvmopts` names and what a 16 GB runner
                    # would default to. Stated rather than inherited, so the number a leg
                    # runs on is a decision somebody made.
                    #
                    # `order`/`orderJob`/`orderSuite`: the whole-corpus order-independence
                    # replay as a second ROW of the leg's `convergence` job, beside the full
                    # run, off the same sample gate. Empty `order` (the four above) folds the
                    # replay into the standard run and renders no row.
                    #
                    # The United States ran from a workflow of its own (`us-convergence.yml`)
                    # while its legs were cold: every rating fetched live, 5.5 hours on a
                    # 330-minute budget, a lane a push could not afford to supersede. Its
                    # legs are hermetic now (the pinned pair `Record scrape fixtures`
                    # records), ~20 minutes like the others, so it takes this lane (2026-09-30).
                    # It keeps what it still needs: 10g, since a leg holds the whole corpus
                    # resident (the 2026-09-01/-05 runs died at 8g on a 114-116k-document read
                    # model), the split-out replay row, and its larger budgets as ceilings.
                    - { country: poland,         code: pl, cmd: convergencePoland,  sample: convergencePolandSample,  job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: germany,        code: de, cmd: convergenceGermany, sample: convergenceGermanySample, job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk,      sample: convergenceUkSample,      job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: spain,          code: es, cmd: convergenceSpain,   sample: convergenceSpainSample,   job: 135, suite: 120, sampleJob: 32, sampleSuite: 20, heap: 4g }
                    - { country: united-states,  code: us, cmd: convergenceUs,      sample: convergenceUsSample,      job: 330, suite: 315, sampleJob: 75, sampleSuite: 60, heap: 10g, order: convergenceUsOrder, orderJob: 330, orderSuite: 315 }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-job-timeout-minutes:    ${{ matrix.sampleJob }}
            sample-suite-timeout-minutes:  ${{ matrix.sampleSuite }}
            order-command:                 ${{ matrix.order }}
            # A row without an order replay has no budget for one: the leg's own defaults.
            order-job-timeout-minutes:     ${{ matrix.orderJob || 135 }}
            order-suite-timeout-minutes:   ${{ matrix.orderSuite || 120 }}
            heap:                          ${{ matrix.heap }}
        # TMDB_API_KEY / OMDB_API_KEY, and the GITHUB_TOKEN the setup action reads.
        secrets: inherit

    # There is no `record-enrichment` job here, and these legs record nothing: they are
    # HERMETIC (the leg's `mode` input, default), replaying the corpus + enrichment tree PAIR
    # that `Record scrape fixtures` records and pins nightly. Recording lives there, beside
    # the corpus it records against — see its `enrichment` jobs. `Record enrichment
    # fixtures`, which dumped the old shared Mongo cache over a tunnel, stays dispatch-only.

    # A red leg on main hands its range to `convergence-bisect.yml` — DISPATCHED, the one event
    # the GITHUB_TOKEN may raise: this run belongs to github-actions[bot] (Main dispatched it),
    # so its completion starts no `workflow_run`. A separate run rather than a reusable call,
    # so the bisect holds none of this suite's lane. (ConvergenceBisectTriggerSpec)
    request-bisect:
        needs: [leg]
        if: ${{ !cancelled() && needs.leg.result == 'failure' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Dispatch the bisect
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SUITE: ${{ github.workflow }}
                  RUN_ID: ${{ github.run_id }}
              run: gh workflow run convergence-bisect.yml --ref main -f suite="$SUITE" -f run-id="$RUN_ID"

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        needs: [preflight, leg, request-bisect]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
