#
# Per-country pipeline convergence.
#
# Asks, for each country independently: does the scrape → fold → settle loop
# reach a fixpoint on THIS country's cinema catalogue and country-scoped title
# rules? The corpus is written into a real `cinema_scrapes` collection and
# replayed back out, so the archive's round-trip is on the path too.
#
# One leg per country, in parallel. They must be separate JOBS, not threads in
# one JVM: each leg installs its country's `TitleRuleSet` into `TitleNormalizer`
# process-globally, so two countries sharing a process would overwrite each
# other's normalisation and silently test the wrong rules. Each leg also gets its
# own MongoDB container and — inside it — a uniquely named database per run
# (`IsolatedMongoDatabase`), so nothing here can collide with anything else,
# including a re-run of itself.
#
# Deliberately NOT part of ci.yml: that workflow runs against a hard 20-runner
# budget (1 test + 1 integration + 4 e2e + 1 mobile + 13 page-tests), and three
# more legs would have meant re-cutting the existing shards. This runs on its
# own on pushes that touch the pipeline, and nightly to catch drift that lands
# through a data or dependency change rather than a code one.
#
name: Country convergence

on:
    # Runs AFTER `Deploy to Fly.io` finishes — not on push. These legs are TENS of
    # minutes long once enrichment actually runs (Poland 12 warm, ~22 on a cache it
    # has to build first; Germany and the UK carry 1.6x and 2.2x Poland's films). The
    # numbers this comment used to quote — 3, 9 and 14 — were measured while the TMDB
    # key was gated wrong and every leg resolved 0 films, so they described a suite
    # doing no enrichment at all. Firing that in parallel with the deploy put three
    # heavyweight jobs on the runner pool at exactly the moment the deploy needed it,
    # for a signal nobody gates the deploy on anyway. Chaining keeps the
    # deploy's "all green" arriving as early as it always did and still runs the
    # convergence check against the very commit that shipped.
    schedule:
        # 04:20 UTC — after the nightly country-fixture recorder, before the day starts.
        - cron: '20 4 * * *'
    workflow_dispatch:

concurrency:
    # One lane for the whole workflow, so a new run always supersedes the one
    # still in flight. Keying on the head SHA and the event name (as this did)
    # gave every deploy, nightly and manual run its own lane, which meant
    # nothing ever cancelled anything: three legs of up to 75 minutes each piled
    # up on the runner pool while the only run whose result anyone reads is the
    # newest one. All three triggers land on `main`, so the ref keeps a lane per
    # branch for the rare dispatch from somewhere else without splitting main's.
    group: country-convergence-${{ github.ref }}
    # Unconditional again, and safe now: every run of this workflow is either a
    # deploy-triggered dispatch or a deliberate one, so there are no runs that exist
    # only to skip. Previously a skipped `workflow_run` run took the lane and
    # cancelled a leg 21.5 minutes into real work; the deploy dispatching us
    # explicitly removes that class of run entirely.
    cancel-in-progress: true

env:
    # The rolling release the per-country fixture trees live in. One tag, three assets,
    # each replaced in place — a store, not a history. Marked as a prerelease when
    # created so it never reads as a shipped version of anything.
    FIXTURE_RELEASE_TAG: convergence-fixtures

jobs:
    convergence:
        name: convergence (${{ matrix.country }})
        strategy:
            # Every country reports independently — one country's flap must not
            # hide whether the other two converged.
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl, cmd: convergencePoland }
                    - { country: germany,        code: de, cmd: convergenceGermany }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk }
        runs-on: ubuntu-latest
        # 45 was not enough headroom and cost a real run: on 2026-07-28 the Germany
        # and UK legs were CANCELLED at exactly 45m while Poland finished in 8,
        # because the corpus was mis-sized (Poland's films-per-venue ratio applied
        # to every country — see CountryScrapeCorpus.shapeOf). The sizing is fixed,
        # but a CI runner is a good deal slower than the machine these are timed on,
        # so the ceiling now sits well clear of the expected run rather than just
        # above it. A leg that approaches this is a signal to re-measure the shape,
        # not to raise the number again.
        timeout-minutes: 75
        permissions:
            # `contents: write` for the rolling release the fixture trees live in —
            # see "Publish" below for why that, rather than an artifact.
            contents: write
            checks: write
            # `gh run download` still reads artifacts, for the one-off bootstrap when
            # the release doesn't exist yet.
            actions: read
        steps:
            - uses: actions/checkout@v5

            # The scrape corpus, from the nightly `Record scrape fixtures`. Restore-only
            # and prefix-matched, so a leg always takes the newest capture and simply
            # proceeds without one when none exists.
            - name: Restore recorded scrape fixtures
              uses: actions/cache/restore@v5
              with:
                  path: scrape-archive
                  key: scrape-fixtures-${{ matrix.code }}-
                  restore-keys: scrape-fixtures-${{ matrix.code }}-

            # The enrichment tree — recorded responses AND the remembered-answer cache —
            # lives in a ROLLING RELEASE, one asset per country, overwritten in place.
            #
            # Three storage options, and only one of them fits. The actions CACHE is out
            # on space: this repo already sits at 9.46 GB of a 10 GB ceiling, so these
            # tarballs were evicted the moment they were written — with
            # `actions/cache/save` still reporting success, because a save succeeding
            # says nothing about whether the entry SURVIVES — and forcing them through
            # that ceiling evicts the sbt caches every job depends on. MONGO has the
            # space and is where this cache started, but it is only reachable over a
            # `flyctl proxy`, which is the single component that has broken more runs
            # this week than everything else combined (three legs cancelled at the
            # 75-minute ceiling paying 5s a write to a socket nobody was listening to).
            # ARTIFACTS work, and are what this used to use, but they are per-run: three
            # countries at 84-434 MB every deploy, retained for days, when the only copy
            # anyone ever reads is the newest one.
            #
            # A release asset is 2 GB per file, doesn't touch the Actions storage quota,
            # comes off the CDN with no tunnel in the path, and `--clobber` replaces it
            # in place — so there is exactly one copy per country and no history to
            # prune. It is also a far simpler read than scanning runs for an artifact.
            #
            # Never fails the leg: no release yet is the normal first-run state, and the
            # leg then falls through to the artifact bootstrap, and failing that to
            # fetching live and publishing what it learns.
            - name: Restore the enrichment tree and remembered answers
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  # FIXTURE_RELEASE_TAG comes from the workflow-level `env`, which is
                  # exported into every step's shell.
                  TAG="$FIXTURE_RELEASE_TAG"
                  mkdir -p enrichment-archive
                  if gh release download "$TAG" --pattern "enrichment-${{ matrix.code }}.tar.gz" \
                     --dir enrichment-archive --clobber 2>/dev/null; then
                      echo "enrichment tree from release $TAG"
                      ls -l enrichment-archive/
                      exit 0
                  fi

                  # One-off bootstrap: before the release existed, legs published
                  # artifacts. Read the newest of those so the switch doesn't throw away
                  # captures already paid for. Conclusion deliberately NOT filtered — a
                  # leg that failed or was cancelled still recorded everything it
                  # enriched before it stopped, and today's largest captures came from
                  # cancelled legs.
                  echo "no asset in release $TAG — falling back to the newest artifact"
                  for run in $(gh run list --workflow "Country convergence" --limit 10 \
                               --json databaseId --jq '.[].databaseId' 2>/dev/null); do
                          [ "$run" = "${{ github.run_id }}" ] && continue
                          if gh run download "$run" --name "enrichment-fixtures-${{ matrix.code }}" \
                             --dir enrichment-archive 2>/dev/null; then
                              echo "enrichment fixtures from run $run"
                              ls -l enrichment-archive/
                              exit 0
                          fi
                  done
                  echo "no enrichment capture found for ${{ matrix.code }} — this leg fetches live and publishes the result"

            - name: Unpack whichever fixtures are present
              run: |
                  set -euo pipefail
                  for archive in "scrape-archive/scrapes-${{ matrix.code }}.tar.gz" \
                                 "enrichment-archive/enrichment-${{ matrix.code }}.tar.gz"; do
                      if [ -f "$archive" ]; then
                          tar -xzf "$archive"
                          echo "restored $archive ($(du -h "$archive" | cut -f1))"
                      else
                          echo "no $archive — this leg fetches live for it and the recorder captures it next"
                      fi
                  done
                  # `|| true` and a subshell: a MISSING fixture directory is the normal
                  # fallback path, not an error — the leg then fetches live and the
                  # recorder captures it next. Without this, `find` exiting non-zero on
                  # an absent path tripped `set -euo pipefail` and failed the whole leg
                  # AFTER printing the count, which is how three legs died 40 seconds in
                  # with both restores reporting success.
                  available=$( { find test/resources/fixtures/corpus \
                                      "test/resources/fixtures/enrichment-${{ matrix.code }}" \
                                      -type f 2>/dev/null || true; } | wc -l )
                  echo "fixture files available: $available"

                  # Count the REMEMBERED-ANSWER cache separately from the recorded
                  # responses, because they fail independently and only one of them is
                  # visible in the file count above.
                  #
                  # The tree records what a fetch RETURNED. Half a country's films never
                  # resolve and still cost three or four rating-slug guesses that 404,
                  # and a 404 returns nothing to record — so those verdicts live only in
                  # `.enrichment-cache`, and a leg that arrives without it re-asks every
                  # one of them live and rate-paced. That is a 22-minute Poland leg
                  # versus a 12-minute one, and the ONLY symptom is the clock: nothing
                  # errors, coverage is identical, and the run still passes. Printing the
                  # entry count on both sides of the artifact hop is what makes the
                  # difference between "warm" and "silently cold" legible in the log.
                  cache="test/resources/fixtures/enrichment-${{ matrix.code }}/.enrichment-cache"
                  remembered=$( { find "$cache" -name '*.entry' 2>/dev/null || true; } | wc -l )
                  if [ "$remembered" -gt 0 ]; then
                      echo "remembered enrichment answers restored: $remembered"
                  else
                      echo "NO remembered-answer cache in the artifact — this leg re-asks every"
                      echo "unresolved film's rating slugs live, and publishes the cache it builds."
                  fi

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt
            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      target
                      project/target
                      project/project/target
                  key: sbt-target-convergence-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala') }}
                  restore-keys: |
                      sbt-target-convergence-${{ runner.os }}-
                      sbt-target-e2e-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            # Bounded BELOW the job's 75, on purpose — the single most important line
            # in this file for a leg that runs long.
            #
            # A job that hits its own `timeout-minutes` is CANCELLED, and a cancelled
            # job runs its remaining `always()` steps only inside a short grace window.
            # The steps that have to run here tar and upload 84-152 MB, and losing that
            # race loses the whole point: the cache and the newly recorded responses
            # this leg just spent an hour building, which are exactly what would have
            # made the NEXT run fast enough not to time out. A timeout that discards its
            # own progress cannot converge — every run repeats the same cold sweep.
            #
            # Failing the STEP instead keeps the job alive and un-cancelled, so the
            # publish and upload steps below run normally with the remaining ~10 minutes
            # rather than on borrowed time. The leg still reports failure, loudly; it
            # just doesn't throw away the work first.
            # `tee`d so the findings can be republished as a report below. `pipefail`
            # explicitly, because the default shell is `bash -e` without it and the
            # pipeline would otherwise report `tee`'s exit status and pass a failing
            # suite.
            - name: Run the convergence suite
              id: suite
              shell: bash
              timeout-minutes: 62
              run: |
                  set -o pipefail
                  sbt ${{ matrix.cmd }} 2>&1 | tee convergence.log
              env:
                  # The spec installs this country's TitleRuleSet itself; naming the
                  # country here too means anything that reads the environment
                  # directly (`Country.soleFromEnv`) agrees with it rather than
                  # falling back to the Poland default.
                  KINOWO_COUNTRY:   ${{ matrix.code }}
                  KINOWO_COUNTRIES: ${{ matrix.code }}
                  # NO Mongo here, deliberately — not the corpus, not the cache.
                  #
                  # Both URIs used to be set to the shared cluster, reached over a
                  # `flyctl proxy` this job starts nowhere. Every enrichment cache
                  # write therefore blocked for the driver's 5s server selection and
                  # then failed `Connection refused` on 127.0.0.1:27018, and the write
                  # sits on the fetch path — so each of the ~780 live fills cost 5.6s
                  # instead of 0.6s and all three legs were cancelled at the 75-minute
                  # ceiling, still inside `bootCorpus`. (`EnrichmentCache` now suspends
                  # write-through after three refusals, so this can never cost more
                  # than a handful of timeouts again — but the right number of round
                  # trips to a cluster this job cannot reach is zero.)
                  #
                  # Neither one is needed. The corpus comes from the committed fixture
                  # (`CorpusFixture`), and the enrichment answers come from the fixture
                  # tree restored above — which this leg also EXTENDS as it runs and
                  # uploads below, so the loop closes without a tunnel in it.
                  #
                  # Without a real key TmdbClient short-circuits and nothing resolves,
                  # so the real corpus would buy nothing over the generated one.
                  # Replay recorded enrichment answers first; anything genuinely new
                  # falls through to the live chain and is recorded for the next run.
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ matrix.code }}
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}

            # `include_passed: true` — these tests are the report. A convergence leg that
            # PASSES is the interesting case: the run's whole value is the numbers it
            # prints on the way (coverage per rating source, per-tick emissions, films in
            # versus films out), and suppressing passed tests hid every one of them. A
            # suite whose output is only visible when it breaks tells you nothing about
            # the day it worked.
            - name: Publish convergence test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: convergence (${{ matrix.country }})
                  detailed_summary: true
                  include_passed: true

            # The findings, on the run's summary page, per country.
            #
            # ScalaTest's `info(...)` lines carry everything worth knowing about a leg —
            # enrichment coverage down the whole ladder, cache hits versus live fills,
            # cinemas and screenings in versus out, per-tick change-stream emissions —
            # and they were reachable only by downloading a 5 MB job log and grepping it.
            # Three countries' worth of that is a report nobody reads. Rendered here it is
            # the first thing on the page, for a passing run as much as a failing one.
            - name: Report the convergence findings
              if: always()
              shell: bash
              run: |
                  set -uo pipefail
                  if [ ! -s convergence.log ]; then
                      echo "### convergence (${{ matrix.country }})" >> "$GITHUB_STEP_SUMMARY"
                      echo "The suite produced no output — see the job log." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  # sbt colours its output; the escapes are noise in markdown.
                  clean=$(sed -E 's/\x1b\[[0-9;]*m//g' convergence.log)
                  totals=$(printf '%s\n' "$clean" | grep -E '^\[info\] Tests: ' | tail -1 | sed 's/^\[info\] //')
                  {
                      echo "### convergence (${{ matrix.country }})"
                      echo
                      if [ -n "$totals" ]; then echo "**$totals**"; else echo "**No test totals — the suite did not finish.**"; fi
                      echo
                      echo '```'
                      # The spec's own structure: suite name, the `should` clauses, and the
                      # `+` info lines hanging off them. Everything else on stdout is
                      # application logging, which is not a report.
                      printf '%s\n' "$clean" \
                        | grep -E '^\[info\] ([A-Za-z0-9]+Spec:|- should |  \+ |the )' \
                        | sed 's/^\[info\] //' \
                        | head -150
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            # The leg both CONSUMES and EXTENDS the fixture tree: `ArchiveReplayWiring`
            # wraps the live leg in a `RecordingHttpFetch` pointed at the same
            # directory, so whatever wasn't already recorded is on disk by the time
            # the run ends. Publishing it here is what closes the loop — a partial
            # capture converges on a complete one over successive runs, with no Mongo
            # cache to write through and no tunnel to dump it back out of.
            #
            # `always()` because a leg that FAILED or was cancelled has usually still
            # enriched most of the corpus, and that capture is exactly what stops the
            # next run repeating the work. `if-no-files-found: ignore` for the first
            # run on a new country, where nothing has been recorded yet.
            - name: Publish the enrichment fixtures this leg recorded
              if: always()
              run: |
                  set -euo pipefail
                  DIR="test/resources/fixtures/enrichment-${{ matrix.code }}"
                  if [ ! -d "$DIR" ]; then
                      echo "nothing recorded — no $DIR"
                      exit 0
                  fi
                  echo "recorded fixture files: $(find "$DIR" -type f -not -path '*/.enrichment-cache/*' | wc -l)"
                  echo "remembered enrichment answers: $( { find "$DIR/.enrichment-cache" -name '*.entry' 2>/dev/null || true; } | wc -l )"
                  mkdir -p enrichment-upload
                  tar -czf "enrichment-upload/enrichment-${{ matrix.code }}.tar.gz" "$DIR"
                  du -h "enrichment-upload/enrichment-${{ matrix.code }}.tar.gz"
                  # The cache is dot-prefixed and lives INSIDE the tree, so `tar` carries
                  # it along with the recorded responses and one artifact restores both.
                  # Asserted rather than assumed: if a future change to this tar drops
                  # hidden paths, the loss is invisible — every leg simply gets slower and
                  # still passes.
                  # `grep -c`, which reads to EOF, NOT `grep -q`, which doesn't.
                  #
                  # `tar -tzf … | grep -q` exits the moment it matches and closes the
                  # pipe; GNU tar is still streaming, takes SIGPIPE and returns 141, and
                  # under `set -euo pipefail` the PIPELINE is then a failure even though
                  # the pattern was found. The `!` turned that into "the cache is
                  # missing", so this guard failed all three legs on a tarball that
                  # contained the cache perfectly — the published asset had 3,745 cache
                  # paths in it. Reading the listing to the end removes the race
                  # entirely, and the count is worth printing anyway.
                  #
                  # (BSD tar on macOS absorbs the SIGPIPE, so this could not be
                  # reproduced locally — it needs a Linux runner. Verified instead by
                  # inspecting the asset the same run published.)
                  cached=$(tar -tzf "enrichment-upload/enrichment-${{ matrix.code }}.tar.gz" \
                           | grep -c '/\.enrichment-cache/.*\.entry' || true)
                  echo "remembered answers inside the archive: $cached"
                  if [ -d "$DIR/.enrichment-cache" ] && [ "$cached" -eq 0 ]; then
                      echo "::error::the enrichment cache exists on disk but is NOT in the tarball"
                      exit 1
                  fi

            # Replaces the country's asset IN PLACE, so the release holds one copy per
            # country and never a history — the newest capture is the only one anyone
            # reads, and keeping the rest was pure storage.
            #
            # `always()` for the same reason the tar above is: a leg that failed or was
            # cancelled has usually still enriched most of the corpus, and that capture
            # is exactly what stops the next run repeating the work. Today's two largest
            # captures (301 MB and 434 MB) both came from CANCELLED legs.
            #
            # `create ... || true` because three country legs race to create the release
            # on the very first run and exactly one of them can win; the other two find
            # it already there, which is the outcome they wanted anyway.
            - name: Publish the tree to the rolling release
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -uo pipefail
                  TAG="$FIXTURE_RELEASE_TAG"
                  ARCHIVE="enrichment-upload/enrichment-${{ matrix.code }}.tar.gz"
                  if [ ! -f "$ARCHIVE" ]; then
                      echo "nothing to publish — no $ARCHIVE"
                      exit 0
                  fi
                  gh release view "$TAG" >/dev/null 2>&1 || \
                    gh release create "$TAG" --prerelease \
                      --title "Convergence fixture trees (rolling)" \
                      --notes "Recorded enrichment responses and remembered answers per country.
                  Replaced in place by every convergence leg — one copy each, no history.
                  Not a version of anything; do not treat as a release." || true
                  gh release upload "$TAG" "$ARCHIVE" --clobber
                  echo "published $ARCHIVE to release $TAG"

    # There is no `record-enrichment` job any more. It dispatched `Record enrichment
    # fixtures`, which opens a tunnel to the shared Mongo cache and dumps it back out
    # as files — a round trip that only made sense while the legs wrote their fills
    # INTO that cache. They no longer do (see the env block above); each leg now
    # publishes the fixture tree it recorded directly, so the recorder would have
    # dumped an ever-staler snapshot over a tunnel, on top of a capture that is
    # already newer. The workflow itself stays, dispatch-only, as the way to re-cut a
    # country's fixtures from the cache by hand.
