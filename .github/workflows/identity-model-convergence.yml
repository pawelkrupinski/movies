#
# THE COUNTRY CONVERGENCE SUITE — every country's films as the identity model decides them, from the
# pinned recording (docs/design/identity-cutover-runbook.md): a sample gate, the full run and the
# order-independence replay per country. Every claim — a fixpoint under identical re-scrapes, the same
# films whatever order the corpus arrives in, every archived cinema, showtime and film emitted, coverage
# within 5% of production — is a claim about what production serves.
#
# DISPATCHED BY MAIN: its `kick-convergence` job starts it for a push that can change a verdict
# (`.github/convergence-paths.txt`); it can still be run by hand. A red HERMETIC leg on main asks
# `convergence-bisect.yml` which commit did it (`request-bisect`), and a failed scheduled run files an
# issue (`report`).
#
# `mode: hermetic`: every leg replays the pair `Record scrape fixtures` pinned for its country
# (`hermetic-<code>.txt`) and touches no network, so a red leg means the code changed — and is
# bisected. Every pair pinned since run 37216285654 (2026-10-04, main 971ccd34e) was recorded by the
# identity model, the old pipeline being gone. (HermeticConvergenceWiringSpec)
#
# ONE LANE: the run in flight is never cancelled, at most one newer run waits behind it, and each newer
# dispatch replaces the waiting one. A day of pushes into a running leg produces exactly two runs: the
# one finishing, and the newest commit's. (IdentityModelConvergenceWiringSpec, ConvergenceConcurrencyConfigSpec)
#
name: Identity model convergence

on:
    workflow_dispatch:

concurrency:
    group: identity-model-convergence
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # Seconds, first: the secrets the jobs below read are set, so a missing one fails here
    # rather than hours into a leg. (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Secrets present
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

    # One row per country, each carrying its own sample → convergence chain, so a country's full leg
    # waits on ITS OWN sample and nothing else; `fail-fast: false`, so every country reports on its
    # own. Germany and the United States run their order-independence replay in a row of their own,
    # so their replays no longer bound the lane. The United States runs its sample in a row of its
    # own too (`sampleRow`), beside its suite rather than in front of it: 79 s of the lane's 10.0-minute
    # critical path (run 37150307201), its convergence row then ungated — a red sample costs a
    # runner, not wall time. `heap` is the sbt JVM's `-Xmx`: the US holds its
    # whole corpus resident (it died at 8g on a 114-116k-document read model).
    leg:
        needs: preflight
        name: ${{ matrix.country }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { country: poland,         code: pl, cmd: convergencePoland,  sample: convergencePolandSample,  job: 155, suite: 120, sampleSuite: 20, heap: 4g }
                    - { country: germany,        code: de, cmd: convergenceGermanyWithoutOrder, sample: convergenceGermanySample, job: 155, suite: 120, sampleSuite: 20, heap: 4g, order: convergenceGermanyOrder, orderJob: 155, orderSuite: 120 }
                    - { country: united-kingdom, code: uk, cmd: convergenceUk,      sample: convergenceUkSample,      job: 155, suite: 120, sampleSuite: 20, heap: 4g }
                    - { country: spain,          code: es, cmd: convergenceSpain,   sample: convergenceSpainSample,   job: 155, suite: 120, sampleSuite: 20, heap: 4g }
                    - { country: united-states,  code: us, cmd: convergenceUs,      sample: convergenceUsSample,      job: 350, suite: 315, sampleSuite: 20, heap: 10g, order: convergenceUsOrder, orderJob: 350, orderSuite: 315, sampleRow: true }
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-suite-timeout-minutes:  ${{ matrix.sampleSuite }}
            order-command:                 ${{ matrix.order }}
            order-job-timeout-minutes:     ${{ matrix.orderJob || 155 }}
            order-suite-timeout-minutes:   ${{ matrix.orderSuite || 120 }}
            sample-row:                    ${{ matrix.sampleRow == true }}
            heap:                          ${{ matrix.heap }}
            # Replay the pinned pair and nothing else: the verdict a bisect can trust.
            mode:                          hermetic
        # TMDB_API_KEY / OMDB_API_KEY, and the GITHUB_TOKEN the setup action reads.
        secrets: inherit

    # A red HERMETIC leg on main hands its range to `convergence-bisect.yml` — DISPATCHED, the one event
    # the GITHUB_TOKEN may raise: Main dispatched this run, so its completion starts no `workflow_run`.
    # A separate run rather than a reusable call, so the bisect holds none of this suite's lane. The leg
    # leaves a request only when it ran hermetic (ConvergenceBisectTriggerSpec).
    request-bisect:
        needs: [leg]
        if: ${{ !cancelled() && needs.leg.result == 'failure' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Dispatch the bisect
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SUITE: ${{ github.workflow }}
                  RUN_ID: ${{ github.run_id }}
              run: gh workflow run convergence-bisect.yml --ref main -f suite="$SUITE" -f run-id="$RUN_ID"

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        needs: [preflight, leg, request-bisect]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
