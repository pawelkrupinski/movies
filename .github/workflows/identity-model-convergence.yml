#
# THE COUNTRY CONVERGENCE SUITE — every country's films as the identity model decides them, from the
# pinned recording (docs/design/identity-resolver.md §18): per country the corpus-shape specs and the
# full run, the order-independence replay (in the run, or a row of its own), and — for the United States —
# the sample as a row of its own. Every claim — a fixpoint under identical re-scrapes, the same
# films whatever order the corpus arrives in, every archived cinema, showtime and film emitted, coverage
# within 5% of production — is a claim about what production serves.
#
# DISPATCHED BY MAIN: its `kick-convergence` job starts it for a push that can change a verdict
# (`.github/convergence-paths.txt`); it can still be run by hand. A red HERMETIC leg on main asks
# `convergence-bisect.yml` which commit did it (`request-bisect`). It has no schedule, so no failure-report job.
#
# A VERDICT ALREADY PROVEN IS NOT RUN AGAIN: when a landing check (scripts/identity-landing-check --full) already ran this
# suite over the same tree, Main's kick names that run (`reuse-run`); the preflight checks it -- tree key, pairs, the legs'
# inputs, every row green, the takes bases (scripts/ci/convergence_reuse.py) -- and, only when all hold, every leg skips
# and the run is green, its summary naming the source. Otherwise the whole suite runs. (ConvergenceReuseSpec)
#
# `mode: hermetic`: every leg replays the pair `Record scrape fixtures` pinned for its country
# (`hermetic-<code>.txt`) and touches no network, so a red leg means the code changed — and is
# bisected. Every pair pinned since run 37216285654 (2026-10-04, main 971ccd34e) was recorded by the
# identity model, the old pipeline being gone. (HermeticConvergenceWiringSpec)
#
# ONE LANE: the run in flight is never cancelled, at most one newer run waits behind it, and each newer
# dispatch replaces the waiting one. A day of pushes into a running leg produces exactly two runs: the
# one finishing, and the newest commit's. (IdentityModelConvergenceWiringSpec, ConvergenceConcurrencyConfigSpec)
#
name: Identity model convergence

on:
    workflow_dispatch:
        inputs:
            profile:
                description: Record a JFR CPU profile of every suite step and upload it (country-convergence-leg.yml).
                required: false
                type: boolean
                default: false
            jvm-options:
                description: Extra JVM options, each prefixed -J, for every leg's sbt runs (country-convergence-leg.yml).
                required: false
                type: string
                default: ''
            runner:
                description: The runner label every leg runs on (country-convergence-leg.yml), e.g. ubuntu-24.04-arm. Empty for ubuntu-22.04.
                required: false
                type: string
                default: ''
            takes-base:
                description: The identity takes check's base commit, overriding the newest green one (re-judge a range a check passed unjudged).
                required: false
                type: string
                default: ''
            takes-only:
                description: Run only each leg's identity takes row -- a whole-corpus measurement of a commit's moved takes, as the identity-measure script dispatches it.
                required: false
                type: boolean
                default: false
            # What scripts/identity-drift-ci dispatches for its pre-land drift check (a laptop tool, never run here).
            drift-only:
                description: >-
                    Run only each leg's takes-drift rows (the incremental = whole replay, scripts/ci/identity-drift-check.sh)
                    -- the pre-land drift check: 10 rows, not 37. takes-countries narrows the
                    countries, drift-seeds pins the seeds. Never a reuse source for main's full verdict.
                required: false
                type: boolean
                default: false
            drift-seeds:
                description: >-
                    Pin the takes-drift rows' seeds -- `S1,S2`, or `S1,` / `,S2` for one row of a drift-only run (a bare `S`
                    is `S,`). Empty -- the run number's rotating pair (scripts/ci/drift_seeds.py). Never main's suite.
                required: false
                type: string
                default: ''
            recording:
                description: The `Record scrape fixtures` run every leg replays -- its own corpus and tree, no fills -- in place of the pinned pair (the identity-measure script's --recording; takes-only).
                required: false
                type: string
                default: ''
            takes-countries:
                description: The countries (pl,de,uk,us,es) whose takes rows a takes-only run runs; empty runs every leg's.
                required: false
                type: string
                default: ''
            takes-no-store:
                description: The takes check reuses and stores no resolve (identity-measure --no-store, proving the store changes no verdict).
                required: false
                type: boolean
                default: false
            takes-skip:
                description: The takes skip gate (scripts/ci/takes-skip-gate.sh) -- off, shadow or enforce. The daily full run passes shadow.
                required: false
                type: string
                default: shadow
            drift-twice:
                description: Each takes-drift row replays its seed twice and fails when the two runs' TSVs differ (the daily full run's determinism check).
                required: false
                type: boolean
                default: false
            reuse-run:
                description: >-
                    An earlier run of this workflow whose verdict this commit may reuse (Main's kick names a landing check's
                    run over the same tree): the preflight checks it (scripts/ci/convergence_reuse.py) and, only when every
                    check holds, skips every leg. Empty, or anything it cannot prove, runs the whole suite.
                required: false
                type: string
                default: ''

# Main's runs hold ONE lane: a run in flight finishes, one newer waits, and a newer dispatch replaces that one. Every
# run from any other branch -- a measurement (scripts/identity-measure's measure/*), an agent's own branch -- runs in a
# lane of its OWN, keyed by the branch (a measurement pushes a measure/ branch per run): it replaces nothing and waits
# for nothing but runners (2026-10-15: five agents' measurements queued behind each other for about an hour each).
# Never by github.run_id.
# Every workflow's group follows one convention, written down in WorkflowConcurrencyConventionSpec.
concurrency:
    group: identity-model-convergence${{ github.ref != 'refs/heads/main' && format('-{0}', github.ref_name) || '' }}
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read


env:
    # ci-runner's job image (catthehacker's hosted-Ubuntu copy) sets no locale, where a hosted VM sets C.UTF-8: the JVM
    # then encodes file names as ASCII and every fixture path with a Polish letter throws InvalidPathException
    # (precommit-check run 41356052566). (SelfHostedRunnersSpec)
    LANG: C.UTF-8

jobs:
    # Seconds, first: the secret the legs read is set, and the pair every leg replays exists, so a missing one fails
    # here rather than minutes into each of ten legs (scripts/ci/preflight.sh, scripts/ci/convergence-preflight.sh:
    # ~5 of 13.4 failed job-hours on 2026-10-20..22 were a recording this forge never held, a pinned tree the release
    # had dropped, or a country with no pin). The ONLY job in front of the legs: one runner wait, not two (a second one
    # cost measure run 968 12.6 minutes of queue on 2026-10-22). (IdentityModelConvergenceWiringSpec)
    preflight:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && github.ref != 'refs/heads/main' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
            # a reused verdict's statuses, copied onto this commit when the source ran another (convergence_reuse.py)
            statuses: write
        outputs:
            order-phases: ${{ steps.order.outputs.phases || 'both' }}
            # The run whose verdict this one reuses (`reuse-run`, proven by the step below), else empty: every leg skips
            # its rows when it names one.
            reused-from: ${{ steps.reuse.outputs.reused-from || '' }}
            # EVERY INPUT THE LEGS READ, evaluated HERE and handed on as outputs, for the reason `runner` is (below): the
            # matrix re-parse hands the legs' `with:` this job's outputs and nothing else, so an `inputs.<name>` read there
            # was empty -- since 2026-10-23 every takes-only measurement ran the whole suite and every takes-base was
            # dropped. The same values are this run's reuse facts. (ConvergenceReuseSpec)
            profile: ${{ steps.legs.outputs.profile }}
            jvm-options: ${{ steps.legs.outputs.jvm-options }}
            takes-base: ${{ steps.legs.outputs.takes-base }}
            takes-only: ${{ steps.legs.outputs.takes-only }}
            drift-only: ${{ steps.legs.outputs.drift-only }}
            drift-seeds: ${{ steps.legs.outputs.drift-seeds }}
            # ROTATING SEEDS (scripts/ci/drift_seeds.py): the seed each takes-drift row replays -- this run's rotating pair,
            # or the dispatch's pins (a row left out of a drift-only run: empty). In the reuse facts beside the inputs.
            drift-seed-1: ${{ steps.legs.outputs.drift-seed-1 }}
            drift-seed-2: ${{ steps.legs.outputs.drift-seed-2 }}
            recording: ${{ steps.legs.outputs.recording }}
            takes-countries: ${{ steps.legs.outputs.takes-countries }}
            leg-matrix: ${{ steps.plan.outputs.leg-matrix || '{"country":[],"include":[]}' }}
            any-leg: ${{ steps.plan.outputs.any-leg || 'false' }}
            takes-no-store: ${{ steps.legs.outputs.takes-no-store }}
            takes-skip: ${{ steps.legs.outputs.takes-skip }}
            drift-twice: ${{ steps.legs.outputs.drift-twice }}
            # The legs' runner: ubuntu-22.04 unless a dispatch names one -- or, off main with the repository variable
            # MOVIES_CI_RUNNERS=self-hosted, ci-runner's `movies-measure` slots (infra nix/hosts/ci-runner/movies-runners.nix):
            # every run off main is a measurement (measure/*: identity-measure, identity-drift-ci, a landing check's full
            # suite) or an agent's own branch, and none of them may queue Main's hosted runners. Main's suite stays hosted.
            # MOVIES_MEASURE_RUNNERS=hosted sends the legs back to hosted runners while the landing checks stay on ci-runner:
            # its 4 measurement slots run ~240 runner-min an hour against a run's ~240, so runs queued 5-6 hours on
            # 2026-11-02 while the hosted 20 averaged 5 busy (docs/investigations/2026-11-01-twenty-runners.md section 8).
            runner: ${{ inputs.runner || (vars.MOVIES_CI_RUNNERS == 'self-hosted' && vars.MOVIES_MEASURE_RUNNERS != 'hosted' && github.ref != 'refs/heads/main' && 'movies-measure') || 'ubuntu-22.04' }}
            # The light jobs after the legs, on the same side as the preflight.
            light-runner: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && github.ref != 'refs/heads/main' && 'movies' || 'ubuntu-26.04' }}
            # THE REST OF THE PLAN (WorkflowPlanSpec): every later job's decision, evaluated here too, as expressions so
            # they are set however this job ends.
            on-main: ${{ github.ref == 'refs/heads/main' }}
        steps:
            # Blobless history: the reuse check keys commits by their trees and walks back to main's takes base.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 300
                  filter: blob:none
                  # .github for its *-paths.txt, identity-model-convergence.yml and the convergence-setup/-fill scripts.
                  sparse-checkout: |
                      scripts/ci
                      .github
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: What every leg is handed
              id: legs
              env:
                  INPUT_PROFILE: ${{ inputs.profile }}
                  INPUT_JVM_OPTIONS: ${{ inputs.jvm-options }}
                  INPUT_RUNNER: ${{ inputs.runner }}
                  INPUT_TAKES_BASE: ${{ inputs.takes-base }}
                  INPUT_TAKES_ONLY: ${{ inputs.takes-only }}
                  INPUT_DRIFT_ONLY: ${{ inputs.drift-only }}
                  INPUT_DRIFT_SEEDS: ${{ inputs.drift-seeds }}
                  INPUT_RECORDING: ${{ inputs.recording }}
                  INPUT_TAKES_COUNTRIES: ${{ inputs.takes-countries }}
                  INPUT_TAKES_NO_STORE: ${{ inputs.takes-no-store }}
                  INPUT_TAKES_SKIP: ${{ inputs.takes-skip }}
                  INPUT_DRIFT_TWICE: ${{ inputs.drift-twice }}
              # (GITHUB_RUN_NUMBER, the runner's own: the rotating drift seeds' run -- a rerun of it replays the same pair)
              run: LEG_INPUTS_FILE="$RUNNER_TEMP/leg-inputs.json" python3 scripts/ci/convergence_reuse.py inputs >> "$GITHUB_OUTPUT"
            # THE LEG ROWS, as the `leg` job's matrix (convergence_reuse.py legs): a `country` vector the rows extend -- so a row is
            # named `leg (<country>)` by default -- narrowed to the countries a takes-only or drift-only run asks for
            # (`takes-countries`). EVERY ROW CARRIES EVERY KEY THE JOB READS, empty or at its fallback where the row has no
            # value. Written as flow maps, one per country (the specs read them here).
            - name: Which legs does this run start?
              id: plan
              env:
                  LEG_INPUTS_FILE: ${{ runner.temp }}/leg-inputs.json
                  LEG_ROWS: |
                      matrix:
                          include:
                              - { country: poland,         code: pl, cmd: convergencePolandWithoutOrder, sample: convergencePolandSample,  shape: corpusShapePoland,  job: 55, suite: 30, sample-suite: 20, heap: 7g, mongo-tmpfs: 3g, mongo-cache-gb: 2, mongo-tmpfs-order: 'true', order: convergencePolandOrder, order-job: 55, order-suite: 30, order-split: true, next-day: '' }
                              - { country: germany,        code: de, cmd: convergenceGermanyWithoutOrder, sample: convergenceGermanySample, shape: corpusShapeGermany, job: 55, suite: 30, sample-suite: 20, heap: 4g, mongo-tmpfs: 6g, mongo-cache-gb: 2, mongo-tmpfs-order: 'true', order: convergenceGermanyOrder, order-job: 55, order-suite: 30, order-split: true, next-day: '' }
                              - { country: united-kingdom, code: uk, cmd: convergenceUkWithoutOrder, sample: convergenceUkSample, shape: corpusShapeUk, job: 55, suite: 30, sample-suite: 20, heap: 7g, mongo-tmpfs: 3g, mongo-cache-gb: 2, mongo-tmpfs-order: 'true', order: convergenceUkOrder, order-job: 55, order-suite: 30, order-split: true, next-day: '' }
                              - { country: spain,          code: es, cmd: convergenceSpain,   sample: convergenceSpainSample,   shape: corpusShapeSpain, job: 55, suite: 30, sample-suite: 20, heap: 7g, mongo-tmpfs: 3g, mongo-cache-gb: 2, mongo-tmpfs-order: 'true', order: '', order-job: 55, order-suite: 30, order-split: false, next-day: '' }
                              - { country: united-states,  code: us, cmd: convergenceUsWithoutNextDay, next-day: convergenceUsNextDay, sample: convergenceUsSample, shape: corpusShapeUs, job: 55, suite: 30, sample-suite: 20, heap: 10g, order: convergenceUsOrder, order-job: 55, order-suite: 30, order-split: true, mongo-tmpfs: 3g, mongo-cache-gb: 0.5, mongo-tmpfs-order: 'false' }
              run: python3 scripts/ci/convergence_reuse.py legs >> "$GITHUB_OUTPUT"
            - name: Secrets present
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY
            # How many split order rows each leg runs (scripts/ci/order-phases.sh): both on main; off main one (p01) only
            # when the ref's change is known and touches no order code (.github/order-independence-paths.txt). Anything
            # it cannot tell, and this step failing, is both (the job output's fallback).
            - name: Which order-independence rows can this ref move?
              id: order
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: echo "phases=$(scripts/ci/order-phases.sh "$GITHUB_REF" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
            - name: Every leg's recorded pair is there
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
                  # The legs this run starts: a takes-only measurement's or a drift-only check's countries, else all five.
                  CODES: ${{ (inputs.takes-only == true || inputs.takes-only == 'true' || inputs.drift-only == true || inputs.drift-only == 'true') && inputs.takes-countries || 'pl,de,uk,es,us' }}
                  RECORDING: ${{ inputs.recording || '' }}
              run: scripts/ci/convergence-preflight.sh "$CODES" "$RECORDING"
            # REUSE ONLY WHAT IS PROVEN (scripts/ci/convergence_reuse.py): the named run covered every row this one would,
            # over the same tree, pairs, inputs and takes bases, and every row passed. Anything else -- this step failing
            # included -- names no run, and the whole suite runs. The daily full run never names one.
            - name: Does the named run's verdict hold for this commit?
              id: reuse
              if: ${{ inputs.reuse-run != '' }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
                  REUSE_RUN: ${{ inputs.reuse-run }}
                  ORDER_PHASES: ${{ steps.order.outputs.phases || 'both' }}
              run: |
                  python3 scripts/ci/convergence_reuse.py verify --source "$REUSE_RUN" --sha "$GITHUB_SHA" \
                      --inputs "$RUNNER_TEMP/leg-inputs.json" --order-phases "$ORDER_PHASES" >> "$GITHUB_OUTPUT"
            # What a later run of this commit's tree needs to reuse this one's verdict: its key, pairs and legs' inputs.
            - name: This run's reuse facts
              if: ${{ !cancelled() }}
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
                  ORDER_PHASES: ${{ steps.order.outputs.phases || 'both' }}
                  REUSED_FROM: ${{ steps.reuse.outputs.reused-from || '' }}
              run: |
                  mkdir -p "$RUNNER_TEMP/reuse-facts"
                  python3 scripts/ci/convergence_reuse.py facts --sha "$GITHUB_SHA" --inputs "$RUNNER_TEMP/leg-inputs.json" \
                      --order-phases "$ORDER_PHASES" --reused-from "$REUSED_FROM" > "$RUNNER_TEMP/reuse-facts/facts.json"
            - uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              continue-on-error: true
              with:
                  overwrite: true
                  name: convergence-reuse-facts
                  path: ${{ runner.temp }}/reuse-facts/
                  if-no-files-found: ignore
                  retention-days: 7
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # One row per country; `fail-fast: false`, so every country reports on its own. A hermetic row
    # runs no sample — it replays a slice of the corpus the suite replays, so it only failed sooner, for
    # ~2 minutes of every row (`country-convergence-leg.yml`) — and runs the sample's corpus-shape specs
    # (`shape`) ahead of its suite instead. `mongo-tmpfs` holds Mongo's data in RAM where the heap
    # leaves room for it. A row that holds its order-independence replays runs them BESIDE its boot
    # (CountryConvergenceBehaviour.runTests), so its JVM holds both at once: 7g, and 3g of tmpfs for a
    # Mongo that holds at most 1.5 GB. A country whose leg ran past the 10-minute target runs its order-independence
    # replay in rows of its own -- Germany, the United Kingdom (14.1m with its replays beside the boot) and the United
    # States -- and those rows split in two (`order-split`: passes 0,1 and 1,2), since three passes on one 4-core runner
    # ran 12.9-13.5m. Poland and Spain, under 10 minutes, keep theirs beside the boot (run 38548739769). The United
    # States' convergence row, 11.4m with no replays at all, runs its next-day test on a boot of its own (`next-day`).
    # OFF MAIN, ONE SPLIT ROW: a ref whose change from main touches no order code (scripts/ci/order-phases.sh, via the
    # preflight's `order-phases`) runs p01 alone -- two arrival orders compared instead of three. Main runs both on every
    # push, and so does any ref whose change could move the order or that the check cannot clear.
    # No row runs the ~100-film sample (country-convergence-leg.yml's header); `sample` names the alias a red leg's
    # auto-bisect replays, and `shape` the sample's corpus-shape specs each convergence row runs ahead of its
    # suite. `heap` is the sbt JVM's `-Xmx`: the US holds its
    # whole corpus resident (it died at 8g on a 114-116k-document read model).
    # CEILINGS FROM THE ROWS' OWN TIMES (2026-10-22): 7 days of green hermetic rows ran p95 <= 19.3 and at most 24.2
    # minutes (takes, the United Kingdom), the US included -- the 155/350-minute ceilings were sized for cold recording
    # legs (record-scrape-fixtures.yml keeps its own). Every row now stops at 55 (its suite at 30), so a hung JVM holds a
    # runner for 55 minutes, not 2.5-6 hours.
    leg:
        needs: [ preflight ]
        # No `name:`: github.com names a row `leg (<country>)` off the one matrix vector (`include` only adds keys to it), and
        # the job, when skipped, as plain `leg` -- a `name:` naming a matrix value renders raw (`leg (${{ matrix.country }})`)
        # on a skipped job. A proven reuse (the preflight's `reused-from`) runs no row, so it skips the job whole instead of
        # creating five legs whose rows the callee skips; so does a plan with no country left (an empty matrix is an error).
        # THE MATRIX IS THE PREFLIGHT'S (`plan`): only the countries this run starts get a row, so no row is created to be skipped
        # (a skipped matrix job renders its `name:` template raw in the run graph). The rows themselves are written there.
        if: ${{ needs.preflight.outputs.reused-from == '' && needs.preflight.outputs.any-leg == 'true' }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.preflight.outputs.leg-matrix) }}
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            country:        ${{ matrix.country }}
            code:           ${{ matrix.code }}
            sample-command: ${{ matrix.sample }}
            shape-command:  ${{ matrix.shape || '' }}
            command:        ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-suite-timeout-minutes:  ${{ matrix.sample-suite }}
            order-command:                 ${{ matrix.order }}
            order-job-timeout-minutes:     ${{ matrix.order-job || 55 }}
            order-suite-timeout-minutes:   ${{ matrix.order-suite || 30 }}
            order-split:                   ${{ matrix.order-split == true }}
            # Off main, a ref whose change touches no order code runs the split's p01 row alone (preflight's order step).
            order-one-phase:               ${{ needs.preflight.outputs.order-phases == 'one' }}
            next-day-command:              ${{ matrix.next-day || '' }}
            heap:                          ${{ matrix.heap }}
            # RAM-backed Mongo where the heap leaves the room: 4g + mongod's 2g cache + at most 6g of data
            # on a 16 GB runner. The United States (10g heap) only on its convergence, next-day and takes rows, with a
            # 0.5 GB cache: at most 2.0 GB of data there, 14.2 of the 17.2 GB cap at peak, and 2-4 GB less written to
            # the host's disk per row; its order rows stay on disk (`mongo-tmpfs-order`; runs 1258/1276).
            # github.com's hosted runners are 16 GB VMs: the United States' 10g heap keeps Mongo's data on disk there,
            # ~2-3 GB of RAM back (github-return-plan 3.4, 2c).
            mongo-tmpfs:                   ${{ matrix.code != 'us' && matrix.mongo-tmpfs || '' }}
            mongo-cache-gb:                ${{ matrix.mongo-cache-gb || '2' }}
            mongo-tmpfs-order:             ${{ matrix.mongo-tmpfs-order || 'true' }}
            # Replay the pinned pair and nothing else: the verdict a bisect can trust.
            mode:                          hermetic
            # `== 'true'` too: the preflight's outputs are STRINGS ("true"), and "true" == true is
            # false in an expression -- every takes-only measurement ran the whole suite (run 786, 2026-10-21).
            profile:                       ${{ needs.preflight.outputs.profile == 'true' }}
            jvm-options:                   ${{ needs.preflight.outputs.jvm-options }}
            # The preflight's choice (its `runner` output).
            runner:                        ${{ needs.preflight.outputs.runner }}
            takes-base:                    ${{ needs.preflight.outputs.takes-base }}
            takes-only:                    ${{ needs.preflight.outputs.takes-only == 'true' }}
            takes-countries:               ${{ needs.preflight.outputs.takes-countries }}
            # Only the takes-drift rows (scripts/identity-drift-ci): the incremental = whole replay, before a land.
            drift-only:                    ${{ needs.preflight.outputs.drift-only == 'true' }}
            drift-seed-1:                  ${{ needs.preflight.outputs.drift-seed-1 }}
            drift-seed-2:                  ${{ needs.preflight.outputs.drift-seed-2 }}
            takes-no-store:                ${{ needs.preflight.outputs.takes-no-store == 'true' }}
            # The skip gate's mode (a push's kick dispatches with none: shadow). The daily full run (convergence-daily.yml)
            # always passes shadow, so whatever main's pushes do, one run a day takes every take in full.
            takes-skip:                    ${{ needs.preflight.outputs.takes-skip }}
            # The daily full run's determinism check (convergence-daily.yml): each drift seed replayed twice, the TSVs diffed.
            drift-twice:                   ${{ needs.preflight.outputs.drift-twice == 'true' }}
            # A named recording's bare pair in place of the pinned one (convergence-setup.sh's `pair`).
            corpus-run:                    ${{ needs.preflight.outputs.recording }}
            # A proven reuse (the preflight's `reused-from`): every row of the leg skips.
            reused-from:                   ${{ needs.preflight.outputs.reused-from }}
        # TMDB_API_KEY (the pre-suite fill signs TMDB's gaps with it), DECODO_PROXY_USER / DECODO_PROXY_PASS (the
        # fill asks what an origin refuses CI again through the residential proxy), and the GITHUB_TOKEN the setup
        # and publish actions read.
        secrets: inherit

    # NO fill job: each country's convergence row fetches what the previous run's suite listed, for ~90 s before
    # its own suite, so this run already replays it (country-convergence-leg.yml, docs/design/convergence-fixture-fill.md).
    # A longer fill is a hand-dispatched `Convergence fill` (convergence-fill.yml).

    # A red HERMETIC leg on main hands its range to `convergence-bisect.yml` — DISPATCHED, the one event
    # the GITHUB_TOKEN may raise: Main dispatched this run, so its completion starts no `workflow_run`.
    # A separate run rather than a reusable call, so the bisect holds none of this suite's lane. The leg
    # leaves a request only when it ran hermetic (ConvergenceBisectTriggerSpec).
    request-bisect:
        needs: [ preflight, leg ]
        if: ${{ !cancelled() && needs.leg.result == 'failure' && needs.preflight.outputs.on-main == 'true' }}
        runs-on: ${{ needs.preflight.outputs.light-runner }}
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Dispatch the bisect
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  SUITE: ${{ github.workflow }}
                  RUN_ID: ${{ github.run_id }}
              run: gh workflow run convergence-bisect.yml --ref main -f suite="$SUITE" -f run-id="$RUN_ID"

    # NO FALSE GREEN (scripts/ci/convergence_reuse.py `complete`; convergence-failures 2026-10-29, G7): a run on main is
    # green for THE GATE only when every `takes` and `takes-drift-1` / `takes-drift-2` row of every country ran to a verdict, or the
    # preflight proved a reuse (`reused-from`). Run 1747 went green with its takes rows skipped and split one 18-hour red
    # episode in two. A row skipped, cancelled or missing fails this job -- and with it the run: no verdict is no green.
    verdict-complete:
        name: verdict complete
        needs: [ preflight, leg ]
        if: ${{ !cancelled() && needs.preflight.outputs.on-main == 'true' }}
        runs-on: ${{ needs.preflight.outputs.light-runner }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 1
                  # cone mode (WorkflowScriptsRunnableSpec): convergence_reuse.py, and .github for the workflow it reads
                  sparse-checkout: |
                      scripts/ci
                      .github
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Did every takes and takes-drift row decide?
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  REUSED_FROM: ${{ needs.preflight.outputs.reused-from }}
                  ORDER_PHASES: ${{ needs.preflight.outputs.order-phases }}
                  # only what can leave a takes row out (convergence_reuse.incomplete reads no other input)
                  INPUT_TAKES_ONLY: ${{ needs.preflight.outputs.takes-only }}
                  INPUT_DRIFT_ONLY: ${{ needs.preflight.outputs.drift-only }}
                  INPUT_RECORDING: ${{ needs.preflight.outputs.recording }}
                  INPUT_TAKES_COUNTRIES: ${{ needs.preflight.outputs.takes-countries }}
              run: |
                  LEG_INPUTS_FILE="$RUNNER_TEMP/leg-inputs.json" python3 scripts/ci/convergence_reuse.py inputs > /dev/null
                  python3 scripts/ci/convergence_reuse.py complete --run "$RUN_ID" --sha "$GITHUB_SHA" --reused-from "$REUSED_FROM" \
                      --inputs "$RUNNER_TEMP/leg-inputs.json" --order-phases "$ORDER_PHASES"
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ preflight, leg, request-bisect, verdict-complete ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`: report-timings.yml declares no secrets.
        secrets: inherit
