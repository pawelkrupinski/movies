#
# Relearn the identity resolver's VENUE DECORATIONS on one recording, on GitHub's runners.
#
# `identity-decorations.json` is learned from the recorded corpora and enrichment trees alone
# (`scripts/identity-calibrate.sh --decorations-only`; no production data, so no secret), and it
# goes stale as venues bill new programmes: a season's "ENCORE" screenings ("The Metropolitan
# Opera: Macbeth ENCORE (2026)") are unknown to decorations learned before they were listed.
# A relearn keeps every decoration the checked-in file holds that no recorded film title now carries
# (`TitleDecorationsLearner.accumulate`): one recording sees only that week's programmes.
# Dispatch-only; the learned file comes back as an artifact to review and commit, never pushed.
#
name: Identity decorations
run-name: identity decorations ${{ inputs.recording }}

on:
    workflow_dispatch:
        inputs:
            recording:
                description: The `Record scrape fixtures` run whose five corpora and enrichment trees to learn from.
                required: true
                type: string

concurrency:
    group: identity-decorations-${{ inputs.recording }}
    cancel-in-progress: false

env:
    FIXTURE_RELEASE_TAG: convergence-fixtures

permissions:
    contents: read

jobs:
    learn:
        name: learn
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5

            - name: Restore the recording's corpora and enrichment trees
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RECORDING: ${{ inputs.recording }}
                  KINOWO_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # Laid out beside the checkout by the tool a local replay uses, then moved in: the learner
                  # reads the checkout's fixtures, the hard clusters beside the corpora included. The corpus and
                  # tree only, as the relearn always read them: the identity overlay is not its input.
                  scripts/identity-fetch-recording.sh --no-overlay "$RECORDING" "$RUNNER_TEMP/recording" pl uk de us es
                  pair="$RUNNER_TEMP/recording/pair/test/resources/fixtures"
                  for entry in "$pair"/*; do
                      target="test/resources/fixtures/$(basename "$entry")"
                      if [ -e "$target" ]; then cp -a "$entry/." "$target/"; else mv "$entry" "$target"; fi
                  done
                  rm -rf "$RUNNER_TEMP/recording"
                  for f in test/resources/fixtures/corpus/cinema-scrapes-??.json.gz; do echo "corpus $f"; done

            # A relearn compiles only the learner: no build cache worth restoring.
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache: 'false'

            - name: Learn the decorations
              shell: bash
              timeout-minutes: 75
              env:
                  RECORDING: ${{ inputs.recording }}
              run: |
                  set -o pipefail
                  CORPORA=test/resources/fixtures/corpus FIXTURES=test/resources/fixtures VERSION="decorations-$RECORDING" \
                      scripts/identity-calibrate.sh --decorations-only 2>&1 | tee decorations.log

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: identity-decorations-${{ inputs.recording }}
                  path: |
                      identity/src/main/resources/identity-decorations.json
                      decorations.log
                  retention-days: 14

    # EVERY JOB'S AND STEP'S TIME, in this run's log and summary and on Grafana's CI dashboards
    # (.github/actions/report-timings). After every other job but the failure report; never fails the run.
    timings:
        needs: [learn]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/report-timings
                  sparse-checkout-cone-mode: false
            - uses: ./.github/actions/report-timings
              with:
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
