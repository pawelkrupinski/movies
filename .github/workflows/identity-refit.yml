name: Identity rule refit

# Weekly re-tune of the numbers the identity resolver's EXISTING rules read from
# identity/src/main/resources/identity-weights.json — the acceptance cut, each scope's
# cannot-link cut, the learned cannot-links' numeric bounds and the listing-film signals'
# weights — on the unmatched-cluster ratchet's ground truth (identity-judgements.tsv, which carries the
# review answers, which the review page writes there as they are given, once they are committed,
# and expected-matches.tsv). No new rule, no new feature: approach B, proposed for review in ONE PR.
#
# The whole job is ONE script, `scripts/identity-refit`, which a local run uses the same way
# (`secrets run movies TMDB_API_KEY -- scripts/identity-refit` in a worktree of your own). Its round 1 is measured
# on four runners first (the `measure` matrix, `--shard i/4`) and merged into the refit job (`--merge`).
#
# `scripts.IdentityRefit` (worker/src/test/scala/scripts) measures every bounded step of every
# parameter as the ratchet measures: the five captures (test/resources/fixtures/identity-unmatched/
# <cc>.json.gz) re-resolved under it and under the control, the agreement replayed, TMDB gaps
# asked live with TMDB_API_KEY. A step is kept only with 0 wrong, 0 unjudged, 0 switched, no
# right or expected take lost, and >= 3 labelled films of the fitting fold newly right; films
# in the held-out fold are never counted by a weight refit and are reported apart. Kept steps
# are applied greedily and written into identity-weights.json; the job then runs the checks a
# calibration change answers to — the identity specs, the ratchet, the hard clusters (real
# pipeline, throwaway Mongo) and the whole-corpus snapshots, regenerated so the PR names every
# film that moved — and a red one opens no PR. Nothing kept ⇒ no diff ⇒ no PR (the measure
# still lands in the summary).
#
# `relearn` (dispatch only): listing-film signals whose INPUTS changed (a film's releases, its
# runtimes per translation) refitted from the units the captures measure today alone, their
# stored counts dropped — the relearn such a change asks for, still under the same gate.
#
# Secrets: TMDB_API_KEY and SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY, as decoration-discovery.yml.
# This bot's PR is the second of three sanctioned exceptions to "no PRs" (with decoration-discovery.yml and
# identity-capture.yml): land it by fast-forwarding main
# after review.

on:
    workflow_dispatch:
        inputs:
            relearn:
                description: 'Listing-film signals to relearn from fresh units alone (comma-separated), e.g. year.delta,runtime.delta'
                required: false
                default: ''
            threads:
                description: 'Proposals measured at once (scripts/identity-refit --threads); empty = the script default'
                required: false
                default: ''
            sharded:
                description: 'Measure round 1 on four runners (false: on the refit job alone, as before -- the control a sharded run is compared to)'
                type: boolean
                required: false
                default: true

    # Thursday 05:00 UTC — its own slot, clear of Tuesday's decoration discovery.
    schedule:
        - cron: '0 5 * * 4'

# The weekly run is one lane: never two scheduled refits at once. A branch's dispatches are a lane of their own (keyed
# by the branch: Forgejo leaves github.run_id empty when it evaluates `concurrency:`), so measurements (threads,
# relearn) from distinct branches run side by side rather than queueing ~30 minutes each behind one another (2026-10-15: four
# thread-count runs, 15:19 to 17:30, one after another).
concurrency:
    group: identity-refit${{ github.event_name != 'schedule' && format('-{0}', github.ref_name) || '' }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    # ROUND 1 ON FOUR RUNNERS. It is the refit's measure: ~58 proposals, each the five captures re-resolved, CPU-bound
    # (JFR: 97.5% of the runner in the resolver), 17-21 of the measure step's 20-24 minutes on one 4-vCPU runner, where
    # 4 threads beat 2 by only 1.2-1.35x. Shard i measures proposals i, i+4, ... on top of the control
    # (scripts/identity-refit --shard i/4); the refit job merges them (--merge) and goes on as ever: the same proposals in
    # the same order, the same choice and tie-break, the report and the weights byte for byte the unsharded run's
    # (IdentityRefitMeasureAllSpec). Later rounds -- only after a change is kept -- run on the refit job. 4 jobs at once
    # on Thursday 05:00 UTC, well inside the 20-runner budget (CiRunnerBudgetSpec). At the triggering commit: the refit
    # job merges them only if main has not moved what they measured (below).
    measure:
        if: ${{ github.event_name == 'schedule' || inputs.sharded }}
        runs-on: ubuntu-26.04 # no Mongo here: the kernel is no matter
        timeout-minutes: 60
        strategy:
            fail-fast: true
            matrix:
                shard: [0, 1, 2, 3]
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}

            - name: Check the TMDB key is set
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

            - uses: ./.github/actions/setup-sbt-build

            - name: Measure round 1 on this shard
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  RELEARN: ${{ github.event.inputs.relearn }}
                  THREADS: ${{ github.event.inputs.threads }}
              run: scripts/identity-refit --shard "${{ matrix.shard }}/4" --shard-out "shards/shard-${{ matrix.shard }}.json" ${RELEARN:+--relearn "$RELEARN"} ${THREADS:+--threads "$THREADS"}

            - uses: actions/upload-artifact@v6
              with:
                  name: identity-refit-shard-${{ matrix.shard }}
                  path: shards/shard-${{ matrix.shard }}.json
                  retention-days: 3

    refit:
        needs: [ measure ]
        if: ${{ !cancelled() && (needs.measure.result == 'success' || needs.measure.result == 'skipped') }}
        runs-on: ubuntu-24.04 # mongod 8.3 will not start on 26.04's kernel 7.0 (MongoServerVersionParitySpec)
        timeout-minutes: 150
        steps:
            # main's tip, not the triggering commit: a long run can see main gain a
            # workflow change, and a branch built on the older commit would revert it
            # (refused for the App). See BotPullRequestBranchSpec.
            - uses: actions/checkout@v5
              with:
                  ref: main

            - name: Check the TMDB key is set
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

            - uses: ./.github/actions/setup-sbt-build

            # The hard clusters' Mongo and the page snapshots' Chrome, ready for scripts/identity-refit's checks (run only
            # when a step is kept).
            - name: Start MongoDB (single-node replica set, for the hard clusters)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            - uses: browser-actions/setup-chrome@v1
              id: setup-chrome
              with:
                  chrome-version: stable

            - uses: actions/download-artifact@v5
              if: needs.measure.result == 'success'
              with:
                  pattern: identity-refit-shard-*
                  path: shards
                  merge-multiple: true

            # The shards measured the triggering commit; this job refits main's tip. Merged only when nothing they
            # measured with moved between the two (the code, the captures, the judgements, the build): else round 1 is
            # measured here, whole, as an unsharded run measures it.
            - name: Merge the shards' round 1?
              id: shards
              if: needs.measure.result == 'success'
              run: |
                  # The checkout is main's tip at depth 1: the measured commit is fetched to diff against (a fetch that
                  # fails leaves the diff failing, read as moved: measured whole, never merged on a guess).
                  git fetch -q --no-tags --depth=1 origin ${{ github.sha }} || true
                  if git diff --quiet ${{ github.sha }} HEAD -- common identity worker test/resources build.sbt project; then
                      echo "merge=shards" >> "$GITHUB_OUTPUT"
                  else
                      echo "::warning::main moved what the shards measured since ${{ github.sha }}: round 1 measured here, whole"
                  fi

            # The whole refit, as a local run makes it (scripts/identity-refit --help): the refit's spec, the measure
            # (kept steps written into identity-weights.json, the report to identity-refit-report.md, its log to
            # refit.log), and when a step is kept the checks a calibration change answers to — the identity specs and
            # the ratchet, the hard clusters, the whole-corpus and page snapshots regenerated, the films that moved
            # appended to the report. A red check fails the job: no PR.
            - name: Refit (scripts/identity-refit)
              timeout-minutes: 140
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  RELEARN: ${{ github.event.inputs.relearn }}
                  THREADS: ${{ github.event.inputs.threads }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB: kinowo
                  CDP_BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
                  MERGE: ${{ steps.shards.outputs.merge }}
              run: scripts/identity-refit --report identity-refit-report.md ${RELEARN:+--relearn "$RELEARN"} ${THREADS:+--threads "$THREADS"} ${MERGE:+--merge "$MERGE"}

            - name: Check for kept changes
              id: changed
              run: |
                  if git diff --quiet -- identity/src/main/resources/identity-weights.json; then
                      echo "kept=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "kept=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: identity-refit
                  path: |
                      identity-refit-report.md
                      refit.log
                      refit-gc.log
                  retention-days: 14

            # A fresh branch off main every run, never a force-push over a stale one --
            # see .github/actions/drop-bot-branch.
            - uses: actions/create-github-app-token@v3
              if: steps.changed.outputs.kept == 'true'
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            - uses: ./.github/actions/drop-bot-branch
              if: steps.changed.outputs.kept == 'true'
              with:
                  branch: chore/identity-refit
                  token: ${{ steps.app-token.outputs.token }}

            - name: Open the refit PR
              if: steps.changed.outputs.kept == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: chore/identity-refit
                  delete-branch: true
                  add-paths: |
                      identity/src/main/resources/identity-weights.json
                      test/resources/fixtures/08-06-2026/*
                  commit-message: 'Re-tune the identity rules the weekly refit measured: right takes gained, none wrong, switched or lost'
                  title: 'Identity refit: re-tuned weights and thresholds'
                  body-path: identity-refit-report.md

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ measure, refit ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [ measure, refit, timings ]
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
