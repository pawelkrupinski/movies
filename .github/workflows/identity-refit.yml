name: Identity rule refit

# Weekly re-tune of the numbers the identity resolver's EXISTING rules read from
# identity/src/main/resources/identity-weights.json — the acceptance cut, each scope's
# cannot-link cut, the learned cannot-links' numeric bounds and the listing-film signals'
# weights — on the unmatched-cluster ratchet's ground truth (identity-judgements.tsv, which carries the
# review answers once `ReviewLabelsCli export` has written them there and they are committed,
# and expected-matches.tsv). No new rule, no new feature: approach B, proposed for review in ONE PR.
#
# The whole job is ONE script, `scripts/identity-refit`, which a local run uses the same way
# (`secrets run movies TMDB_API_KEY -- scripts/identity-refit` in a worktree of your own).
#
# `scripts.IdentityRefit` (worker/src/test/scala/scripts) measures every bounded step of every
# parameter as the ratchet measures: the five captures (test/resources/fixtures/identity-unmatched/
# <cc>.json.gz) re-resolved under it and under the control, the agreement replayed, TMDB gaps
# asked live with TMDB_API_KEY. A step is kept only with 0 wrong, 0 unjudged, 0 switched, no
# right or expected take lost, and >= 3 labelled films of the fitting fold newly right; films
# in the held-out fold are never counted by a weight refit and are reported apart. Kept steps
# are applied greedily and written into identity-weights.json; the job then runs the checks a
# calibration change answers to — the identity specs, the ratchet, the hard clusters (real
# pipeline, throwaway Mongo) and the whole-corpus snapshots, regenerated so the PR names every
# film that moved — and a red one opens no PR. Nothing kept ⇒ no diff ⇒ no PR (the measure
# still lands in the summary).
#
# `relearn` (dispatch only): listing-film signals whose INPUTS changed (a film's releases, its
# runtimes per translation) refitted from the units the captures measure today alone, their
# stored counts dropped — the relearn such a change asks for, still under the same gate.
#
# Secrets: TMDB_API_KEY and SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY, as decoration-discovery.yml.
# This bot's PR is the second of three sanctioned exceptions to "no PRs" (with decoration-discovery.yml and
# identity-capture.yml): land it by fast-forwarding main
# after review.

on:
    workflow_dispatch:
        inputs:
            relearn:
                description: 'Listing-film signals to relearn from fresh units alone (comma-separated), e.g. year.delta,runtime.delta'
                required: false
                default: ''
            threads:
                description: 'Proposals measured at once (scripts/identity-refit --threads); empty = the script default'
                required: false
                default: ''

    # Thursday 05:00 UTC — its own slot, clear of Tuesday's decoration discovery.
    schedule:
        - cron: '0 5 * * 4'

concurrency:
    group: identity-refit
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    refit:
        runs-on: ubuntu-26.04
        timeout-minutes: 150
        steps:
            # main's tip, not the triggering commit: a long run can see main gain a
            # workflow change, and a branch built on the older commit would revert it
            # (refused for the App). See BotPullRequestBranchSpec.
            - uses: actions/checkout@v5
              with:
                  ref: main

            - name: Check the TMDB key is set
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

            - uses: ./.github/actions/setup-sbt-build

            # The hard clusters' Mongo and the page snapshots' Chrome, ready for scripts/identity-refit's checks (run only
            # when a step is kept).
            - name: Start MongoDB (single-node replica set, for the hard clusters)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            - uses: browser-actions/setup-chrome@v1
              id: setup-chrome
              with:
                  chrome-version: stable

            # The whole refit, as a local run makes it (scripts/identity-refit --help): the refit's spec, the measure
            # (kept steps written into identity-weights.json, the report to identity-refit-report.md, its log to
            # refit.log), and when a step is kept the checks a calibration change answers to — the identity specs and
            # the ratchet, the hard clusters, the whole-corpus and page snapshots regenerated, the films that moved
            # appended to the report. A red check fails the job: no PR.
            - name: Refit (scripts/identity-refit)
              timeout-minutes: 140
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  RELEARN: ${{ github.event.inputs.relearn }}
                  THREADS: ${{ github.event.inputs.threads }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB: kinowo
                  CDP_BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
              run: scripts/identity-refit --report identity-refit-report.md ${RELEARN:+--relearn "$RELEARN"} ${THREADS:+--threads "$THREADS"}

            - name: Check for kept changes
              id: changed
              run: |
                  if git diff --quiet -- identity/src/main/resources/identity-weights.json; then
                      echo "kept=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "kept=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: identity-refit
                  path: |
                      identity-refit-report.md
                      refit.log
                      refit-gc.log
                  retention-days: 14

            # A fresh branch off main every run, never a force-push over a stale one --
            # see .github/actions/drop-bot-branch.
            - uses: actions/create-github-app-token@v3
              if: steps.changed.outputs.kept == 'true'
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            - uses: ./.github/actions/drop-bot-branch
              if: steps.changed.outputs.kept == 'true'
              with:
                  branch: chore/identity-refit
                  token: ${{ steps.app-token.outputs.token }}

            - name: Open the refit PR
              if: steps.changed.outputs.kept == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: chore/identity-refit
                  delete-branch: true
                  add-paths: |
                      identity/src/main/resources/identity-weights.json
                      test/resources/fixtures/08-06-2026/*
                  commit-message: 'Re-tune the identity rules the weekly refit measured: right takes gained, none wrong, switched or lost'
                  title: 'Identity refit: re-tuned weights and thresholds'
                  body-path: identity-refit-report.md

    # EVERY JOB'S AND STEP'S TIME, in this run's log and summary and on Grafana's CI dashboards
    # (.github/actions/report-timings). After every other job but the failure report; never fails the run.
    timings:
        needs: [refit]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/report-timings
                  sparse-checkout-cone-mode: false
            - uses: ./.github/actions/report-timings
              with:
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        needs: [refit, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
