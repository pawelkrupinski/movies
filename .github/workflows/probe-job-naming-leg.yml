name: Probe job naming leg
on:
    workflow_call:
        inputs:
            phases:
                required: true
                type: string
            order:
                required: false
                type: string
                default: ''
jobs:
    first:
        name: first
        runs-on: ubuntu-latest
        steps:
            - run: echo gate
    gated:
        name: ${{ matrix.phase }}
        needs: first
        strategy:
            matrix:
                phase: ${{ fromJson(inputs.phases) }}
        runs-on: ubuntu-latest
        steps:
            - run: echo "gated ${{ matrix.phase }}"
    conditional:
        name: cond ${{ matrix.phase }}
        strategy:
            matrix:
                phase: ${{ fromJson(inputs.order == '' && '["alpha"]' || '["alpha","beta"]') }}
        runs-on: ubuntu-latest
        steps:
            - run: echo "conditional ${{ matrix.phase }}"
