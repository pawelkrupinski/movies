name: CI

# The full build + test pipeline, factored out as a reusable workflow so it
# has exactly ONE definition. Two callers consume it:
#
#   - main.yml        — push to main: run this, then build the images and
#                       deploy them.
#   - branch-ci.yml   — pull_request: run this alone (no deploy) so every
#                       branch (e.g. the Scala Steward dependency-bump PRs)
#                       is confirmed to compile + pass the same gates main does.
#
# Everything below is identical to what gated deploy before the split — what
# lives in main.yml is the shipping half: the per-tier GHCR build jobs and the
# one Fly deploy (the retired redirect host), all of which `needs: ci`.
on:
    workflow_call:

# Pipeline shape:
#
#   test (unit + eslint + stage) ─┐
#   integration-test ─────────────┤
#   e2e × 3 shards ───────────────┤  (all independent; every shipping job in
#   mobile-local-server (iOS+And) ┤   main.yml `needs` this whole workflow)
#   page-tests × 13 ──────────────┘
#
# RUNNER BUDGET — 19 here, and it must stay there. GitHub Free allows 20
# concurrent jobs ACROSS THE ACCOUNT, and on a push to main `main.yml` adds a
# 20th (`build-image`, which runs alongside these rather than after them; its
# other jobs all `needs: ci`, so they take slots these have given back). Every
# job over that budget queues, and a queued job is pure added wall-clock: it
# starts when something else finishes. So a new job here has to take its slot
# from an existing one — that is why ReScrapeIdempotencySpec gave up its e2e
# shard to a seventh WebKit page-test row, and why two cheap page-test slices
# share a runner rather than each having one. (CiRunnerBudgetSpec)
#
# Current split: 1 test + 1 integration + 3 e2e + 1 mobile + 13 page-tests.
# eslint rides `test` (was its own job), and iOS + Android LocalServer share
# one `mobile-local-server` job (one FixtureServerMain boot for both). The
# original ~13-min long pole was the single `e2e` job (two serial whole-corpus
# determinism specs); it's now (a) fanned out across parallel shards and
# (b) each heavy spec runs its replays CONCURRENTLY (see ParallelReplays), so
# e2e drops well under the page-tests tier.
#
# Every page-test row carries the same fixed cost before it runs a single spec:
# checkout, the JDK, the zinc cache, and the FixtureServerMain boot. That boot is
# ~2.4s of application (FixtureTestWiring loads read-model-snapshot.json rather
# than recomputing the pipeline) behind a much larger sbt cost, so the levers on
# it are all outside the application: cache what sbt compiled (see below), and
# overlap what remains with the Node/Playwright installs instead of queueing
# behind it.
#
# A fixed per-row cost that large is also what dictates the shape below. Phones
# run as one sharded project SET rather than a row per phone, so the rows finish
# together instead of ranging 109-207s; and a slice too small to justify its own
# boot shares a runner with another. See .github/actions/run-page-test.
#
# All gating legs run independently. The sbt-driven ones share the
# `actions/cache` keyed on hashed sources so later jobs find zinc state warm
# (the mobile job keeps a separate JDK-21 cache key).
#
# WHAT THOSE CACHES HOLD, and why the paths look like they do: sbt leaves each
# module's compiled classes and its zinc incremental state in
# `<module>/target/scala-<v>/`, and the BUILD DEFINITION's own compile in
# `project/target`. The root `target/` holds neither — only `test-reports`
# (rewritten every run) and `bg-jobs` scratch, measured at 235 MB of a 239 MB
# directory. Every cache block here used to carry that root and none of the
# modules, so a "warm" job restored a quarter-gig of nothing and then compiled
# every module from cold. That cold compile is most of what the FixtureServerMain
# boot below costs. Cache the modules; don't cache the root.
#
# `page-tests` is the only job that needs a browser: PageJsBehaviourSpec
# drives a real headless Chrome over CDP to exercise the JS on the
# rendered pages. Kept out of `test` so the main unit job stays
# browser-free and the page checks get a discrete CI status row.
jobs:
    test:
        runs-on: ubuntu-latest
        # `checks: write` so action-junit-report can post the failure
        # check-run + summary.
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            # THE GITOPS MANIFESTS, CHECKED OUT WHERE THEY USED TO LIVE IN THIS TREE.
            #
            # They are pawelkrupinski/movies-gitops now, because Flux pulls its source on every
            # reconcile -- and, since image-automation began committing the deployed tag, on the
            # write path of every deploy. A shallow clone of this repository is 93.5s and a 1.3 GB
            # tree of 18,806 files, to reach 420 KB of manifests in 36 of them.
            #
            # ⚠️ THE `path:` IS THE WHOLE TRICK. Nine specs in worker/src/test/scala/deploy/ compare
            # those manifests against this repository's workflow and nix config -- heap sizes against
            # node capacity, NodePorts against the Prometheus scrape config, the image tag CI builds
            # against the ImagePolicy that selects it. Landing the checkout at the OLD PATH means the
            # split cost them no changes at all. Move it and nine specs fail at once.
            #
            # `main`, not a pinned ref: these specs should test what is actually DEPLOYED. A pin
            # would go stale silently, which is the failure this repository keeps having to design
            # away. No credential -- the config repo is public, like this one.
            - uses: actions/checkout@v5
              with:
                  repository: pawelkrupinski/movies-gitops
                  path: infra/kubernetes

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            # Warm zinc state across pushes so an unchanged push is near-
            # instant. Same key as `integration-test` so both jobs share the
            # cache.
            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  # Scope the exact key to the sources this job compiles
                  # (unit = every module's main + test). restore-keys still
                  # falls back to any recent sbt-target cache so zinc stays
                  # warm on a miss.
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            # Every module's unit tests except `e2e` in one sbt run; `all` keeps
            # going so a failure in one module still runs the rest. The `e2e`
            # module (the whole-corpus staging specs) rides the integration-test
            # job instead — it doubled this step's wall-clock once staging ingest
            # went always-on, and this is the deploy-gating job, so keep it off
            # the critical path. See the `testUnitNoE2e` alias in build.sbt.
            - run: sbt testUnitNoE2e
              env:
                  ZYTE_API_KEY:    ${{ secrets.ZYTE_API_KEY }}
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: unit tests
                  detailed_summary: true
                  include_passed: false

            # Prove BOTH apps' universal-stage distributions still link. Reuses
            # the warm zinc state from `sbt testUnit` — only linking + writing the
            # dists costs anything.
            #
            # The dists used to be UPLOADED here for the deploy job to download.
            # Nothing downloads them now: main.yml stages its own copy in
            # `build-image`, which runs alongside this job rather than after it,
            # so the container build is off the post-CI critical path. What
            # staging still buys is the guard below, and on a PR run
            # (branch-ci.yml never reaches main.yml) this is the only place a
            # dist that stopped linking, or a reappearing Scaladoc tree, is
            # caught at all.
            - run: sbt "web/stage" "worker/stage"

            # Guards build.sbt's `noApiDocs`. Play's dist and native-packager
            # both ship a `share/doc/api` tree by default, which put dotty's
            # scaladoc on the deploy critical path — it NPE'd here on JDK 25
            # and failed a deploy whose only diff was a workflow file. Nothing
            # reads these docs, so their reappearance is a regression: fail
            # loudly rather than let an unread artefact break deploys again.
            - name: Deploy artefacts carry no generated Scaladoc
              run: |
                  found=$(find web/target/universal/stage worker/target/universal/stage \
                              -type d -name doc -print -quit)
                  if [ -n "$found" ]; then
                      echo "::error::staged dist ships generated Scaladoc at $found — see noApiDocs in build.sbt"
                      exit 1
                  fi

            # ESLint over the production JS in `public/js/`. Folded into this job
            # (was a standalone `lint` job) to free a runner slot for the dedicated
            # `e2e` job, keeping CI at 20 jobs so nothing queues. Runs LAST: the
            # unit-test check is published above with `always()`, so a lint failure
            # never hides it, and the stage artifacts upload first. Cross-file
            # globals (constants from `_sharedJsConfig`, functions called from
            # inline `<script>` blocks) are listed in `eslint.config.js` so
            # `no-undef` stays meaningful.
            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint

    # Mobile LocalServer tests — iOS + Android share ONE FixtureServerMain boot.
    # Boots the fixture Play server (same FixtureServerMain + InMemoryMovieRepository
    # the Playwright suite uses) once, then runs both the iOS `LocalServer*` XCTest
    # cases and the Android `LocalServerApiTest` against it. KinowoCore's real
    # parsers (HTMLParser, FilmDetailParser) crawl the HTML the Twirl templates
    # rendered; Android's production KinowoApi + kotlinx models decode the live
    # /api/repertoire + /api/details JSON. The cross-cutting gate: a server-side
    # template / MovieController JSON drift that would break either mobile client
    # fails CI here, on the PR that introduces it.
    #
    # Was two separate jobs, each paying the SAME ~4-min FixtureServerMain boot to
    # run a <20s test. Merged so the boot is shared and one runner slot is freed —
    # keeps CI under the 20-runner cap without a job queueing. One JDK 21 serves
    # everything: the Scala build emits Java 21 (`--release 21`) and runs on 21,
    # Gradle 8.9 / AGP 8.6 run on 21, and Swift needs no JDK. Both junit publishes
    # keep their original `iOS LocalServer` / `Android LocalServer` check-names.
    mobile-local-server:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  # JDK-21 zinc cache, kept on its own key so cross-JDK class
                  # artifacts don't mix with the JDK-25 jobs' cache. Boots
                  # web/PageTest FixtureServerMain → page scope (every module's
                  # main + test + the web page sources).
                  key: sbt-target-android-ls-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-android-ls-${{ runner.os }}-

            # Kick the fixture-server compile off HERE, in the background, and
            # collect it below — the Swift toolchain, the Android SDK and Gradle
            # setups that follow are ~50s of download that has no reason to wait
            # behind ~100s of sbt. The exit status is parked in a file so the
            # collect step can still fail the job on a compile error, and the
            # log is replayed there rather than interleaved with three actions'
            # output.
            - name: Start compiling the fixture server
              run: |
                  nohup bash -c 'sbt web/PageTest/compile > /tmp/compile.log 2>&1; echo $? > /tmp/compile.status' &

            - uses: swift-actions/setup-swift@v2
              with:
                  swift-version: '5.10'

            - uses: actions/cache@v5
              with:
                  path: ios/.build
                  key: spm-build-${{ runner.os }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
                  restore-keys: |
                      spm-build-${{ runner.os }}-

            # `packages: platform-tools` instead of the action's default
            # `tools platform-tools`: the deprecated `tools` meta-package drags
            # in the Android Emulator, which this JVM-only `testDebugUnitTest` +
            # swift LocalServer job never uses and whose download flakily corrupts
            # ("Error on ZipFile unknown archive"), failing the whole job before a
            # single test runs. AGP auto-fetches platform-34 / build-tools.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Collect the background compile started above. Build BEFORE booting,
            # as its own step, so the boot's ceiling only has to cover booting.
            #
            # The two were one step, and the 300s below had to stretch over both. That
            # holds until the caches go cold together — a Renovate dependency bump
            # invalidates coursier while a source change invalidates sbt-target — and
            # then the runner spends the entire window fetching the sbt launcher and
            # compiling, reaching only "set current project to movies" by the time it is
            # killed. It reports as `FixtureServerMain never wrote a port file`, which
            # points at the server rather than at the build that never finished making
            # it. Split, a slow build is just a slow build, a compile error says so, and
            # the ceiling below measures the one thing it names. Backgrounding the
            # compile keeps that split — this step still names, times and fails on
            # exactly the compile — while letting the toolchain downloads overlap it.
            - name: Wait for the fixture-server compile
              run: |
                  set -uo pipefail
                  # 900s: the compile is normally ~100s warm, but a cold coursier +
                  # cold zinc cache together is minutes. Same generosity the boot
                  # ceiling below has, and for the same reason.
                  for _ in $(seq 1 450); do
                      [ -f /tmp/compile.status ] && break
                      sleep 2
                  done
                  cat /tmp/compile.log 2>/dev/null || true
                  if [ ! -f /tmp/compile.status ]; then
                      echo "::error::web/PageTest/compile did not finish within 900s"
                      exit 1
                  fi
                  exit "$(cat /tmp/compile.status)"

            - name: Boot FixtureServerMain
              run: |
                  set -euo pipefail
                  PORT_FILE=$(mktemp)
                  echo "PORT_FILE=$PORT_FILE" >> "$GITHUB_ENV"

                  nohup sbt "web/PageTest/runMain tools.FixtureServerMain $PORT_FILE" > fixture-server.log 2>&1 &
                  echo "SERVER_PID=$!" >> "$GITHUB_ENV"

                  # 300s ceiling over ~110s of CPU-bound bootStartup (the whole
                  # ~1000-film fixture corpus through scrape→enrich→fold against
                  # in-memory fixtures — processing cost, not retries) plus sbt's own
                  # startup. The compile is no longer inside this window.
                  for _ in $(seq 1 150); do
                      if [ -s "$PORT_FILE" ]; then break; fi
                      sleep 2
                  done
                  if [ ! -s "$PORT_FILE" ]; then
                      echo "::error::FixtureServerMain never wrote a port file"
                      tail -100 fixture-server.log
                      exit 1
                  fi
                  PORT=$(cat "$PORT_FILE")
                  echo "KINOWO_LOCAL_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
                  echo "fixture server listening on http://127.0.0.1:$PORT"

            # Both suites run against the one server; `set +e` + a combined exit
            # status so an iOS failure still lets the Android suite run (and vice
            # versa) — the always() publishes below then surface both. `--no-daemon`
            # so Gradle inherits KINOWO_LOCAL_URL for the forked test JVM.
            - name: Run LocalServer mobile tests (iOS + Android)
              run: |
                  set +e
                  swift test --package-path ios --filter LocalServer --xunit-output ios-localserver.xml
                  ios=$?
                  ( cd android && ./gradlew --no-daemon testDebugUnitTest --tests 'pl.kinowo.localserver.*' )
                  android=$?
                  echo "iOS exit=$ios  Android exit=$android"
                  [ $ios -eq 0 ] && [ $android -eq 0 ]

            - name: Publish iOS test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # SwiftPM writes `<base>.xml` (XCTest) and
                  # `<base>-swift-testing.xml` (swift-testing); glob both.
                  report_paths: 'ios-localserver*.xml'
                  check_name: iOS LocalServer
                  detailed_summary: true
                  include_passed: false

            - name: Publish Android test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
                  check_name: Android LocalServer
                  detailed_summary: true
                  include_passed: false

            - name: Stop FixtureServerMain
              if: always()
              run: |
                  if [ -n "${SERVER_PID:-}" ]; then
                      kill "$SERVER_PID" 2>/dev/null || true
                  fi

            - name: Upload fixture-server log on failure
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: fixture-server-log-mobile
                  path: fixture-server.log
                  if-no-files-found: ignore


    integration-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        # Throwaway Mongo for the run. The IT suites self-seed every doc they
        # assert on (MovieRepositoryIntegrationSpec, MongoTaskQueueIntegrationSpec,
        # UserRepositoryIntegrationSpec, …) and create their own collections/indexes
        # on first use, so a bare empty instance is all they need. Previously
        # this job wrote to the shared Atlas DB via `secrets.MONGODB_URI`; a run
        # cancelled mid-suite — the concurrency group kills superseded pushes
        # before `afterAll` — stranded sentinel fixtures there (the "Dotted
        # (1902)" rows). An ephemeral instance can't be polluted.
        #
        # NOT a `services:` block: MovieRepoIntegrationSpec's change-stream test
        # opens a `$changeStream`, which Mongo only supports on a replica set —
        # against a standalone the stream errors out and the test times out. We
        # need `mongod --replSet`, but GitHub `services:` can't override the
        # container command, so start Mongo by hand as a single-node RS instead.
        steps:
            - uses: actions/checkout@v5

            - name: Start MongoDB (single-node replica set, for change streams)
              run: |
                  docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
                  until docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do sleep 1; done
                  docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
                  until docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$'; do sleep 1; done

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  # it scope (every module's main + test + it). restore-keys keeps zinc warm.
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/it/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            # Both apps' integration suites in one run (web + worker each have an
            # `it` config); `all` keeps going across them. Still one GH job. The
            # `e2e` module runs in its own parallel job (below) — combining it here
            # made this the deploy gate; with a runner freed by merging the mobile
            # jobs there's now a slot to parallelise e2e off the critical path.
            - run: sbt itAll
              env:
                  ZYTE_API_KEY:    ${{ secrets.ZYTE_API_KEY }}
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB:      kinowo

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/it/**/*.xml'
                  check_name: integration tests
                  detailed_summary: true
                  include_passed: false


    # The `e2e` module (cross-app whole-corpus specs), FANNED OUT across three
    # parallel shards. On one runner the module was the ~13-min pipeline long
    # pole: each heavy spec boots the always-on staging pipeline (~110s) one or
    # more times, and they ran serially. The shards (see the
    # e2eScrape/e2eStaging/e2eRest aliases in build.sbt):
    #
    #   scrape   — ScrapeOrderDeterminismSpec  (run by name)
    #   staging  — StagingOrderDeterminismSpec (run by name)
    #   rest     — every OTHER e2e spec, via `e2e/Test/test -- -l …CorpusReplay`
    #              (tag-EXCLUSION of the two @CorpusReplay specs), so a
    #              newly-added spec auto-rides this shard and can't be silently
    #              dropped. See the `@CorpusReplay` tag annotation in
    #              CorpusReplay.java.
    #
    # ReScrapeIdempotencySpec HAD a fourth shard of its own. It gave that slot up
    # to an eighth WebKit page-test shard, which was the build's long pole while
    # this shard sat ~2 min under it. Folding it back into `rest` costs `rest`
    # only the spec's own runtime — it joins the same ScalaTest run and the same
    # already-paid sbt load — and ScalaTest keeps going across suites, so a
    # failure in one still reports the other. Untagging it is what moves it (the
    # tag means "has its own shard").
    #
    # Same coverage as the old single job, a fraction of the wall-clock. Each
    # shard pays its own compile, but they run in parallel. Uses
    # FixtureTestWiring (no Mongo); reports go to the root unit/ dir
    # (unitReportSettings) → a per-shard `e2e tests (<shard>)` check.
    e2e:
        name: e2e (${{ matrix.shard }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: scrape,   cmd: e2eScrape }
                    - { shard: staging,  cmd: e2eStaging }
                    - { shard: rest,     cmd: e2eRest }
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  # Dedicated key so these shards PERSIST the e2e/Test compile
                  # (the shared `sbt-target-` key is owned by `test`, which never
                  # compiles e2e — so on that key e2e recompiled cold every run,
                  # ~100s). All three shards share this one key: only the first to
                  # finish writes it; the rest read it warm. restore-keys falls
                  # back to the shared cache on a miss so web+worker main still
                  # come in warm on the first run.
                  key: sbt-target-e2e-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-e2e-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            - run: sbt ${{ matrix.cmd }}
              env:
                  ZYTE_API_KEY:    ${{ secrets.ZYTE_API_KEY }}
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            - name: Publish e2e test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: e2e tests (${{ matrix.shard }})
                  detailed_summary: true
                  include_passed: false


    # Cross-browser page tests, split into one matrix job per engine
    # family so the CI checks list groups red rows by browser. Every
    # row delegates to the shared `run-page-test` composite action —
    # see `.github/actions/run-page-test/action.yml` for the step
    # body that's identical across all four jobs.
    #
    # `kind` (chrome | playwright) drives which steps execute:
    #
    # - `chrome`: install Chrome via browser-actions/setup-chrome,
    #   then `sbt PageTest/test` with `CDP_BROWSER_BIN` pointing at it.
    #
    # - `playwright`: install Node + the one engine binary specified
    #   by `browser`, boot `FixtureServerMain` over a free port, then
    #   `npx playwright test --project <project>`. The Playwright
    #   suite drives `page-tests-playwright/` against a Twirl-rendered
    #   fixture server (InMemoryMovieRepository + FakeHttpFetch — same
    #   wiring the Scala spec uses, exposed over HTTP). Mobile
    #   projects are split per-phone so each runner handles one
    #   phone's four variants (portrait, zoomed, landscape,
    #   zoomed-landscape) — ~4 projects × 20 specs ≈ under 2 min.
    #
    # Chrome version pick reflects real Android phone distribution as
    # of early 2026 (120+ ≈ 85% of devices, 113–120 the long tail);
    # 113 is the floor that chrome-for-testing publishes. `stable`
    # tracks whatever Google ships next. Specific versions catch
    # regressions like the touchstart-vs-click timing change that
    # bit the card-tap fix — see [[feedback-ci-chrome-version-drift]].
    #
    # axe-core gates itself to `chromium-desktop` (see
    # `tests/a11y.spec.ts` — `test.beforeEach` skips on every other
    # project), so only that row pays the audit cost. It's
    # `continue-on-error` because the site has known WCAG violations
    # (`color-contrast` on `.text-secondary` against the dark body
    # bg) that aren't worth blocking deploys over.

    page-tests-chrome:
        name: page tests (chrome / ${{ matrix.variant }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { variant: stable, kind: chrome, version: stable }

                    # The three Chromium phones run as ONE project set, sharded
                    # three ways, rather than one runner per phone. Three reasons.
                    #
                    # Balance: per-phone rows drifted badly apart (109s vs 207s
                    # for the identical test count on the same run), and the
                    # build waits on the slowest. Playwright shards the combined
                    # list — measured 552/552 at two ways, dead even — so the
                    # rows finish together.
                    #
                    # Three rather than two because the split has to EQUALISE the
                    # two tiers, not favour the faster one. Measured per test:
                    # Chromium 0.33s, WebKit 0.83s. At two Chromium shards the
                    # Chromium rows ran 180s of tests against WebKit's 141s and
                    # became the build's long pole — the runner does more good
                    # here than as an eighth WebKit shard.
                    #
                    # And they no longer re-run the `@agnostic` set. Those ~13
                    # viewport-INDEPENDENT spec files were being executed at all
                    # four viewport variants of all three phones — 12× what the
                    # tag says is needed, and 208 of each row's 576 tests. They
                    # ride the single `behaviour` row below now, exactly as the
                    # WebKit phones have always done.
                    #
                    # chromium pixel-9 (360 px) stays out — same width as
                    # galaxy-s10, redundant for catching layout breaks. The
                    # project stays in playwright.config.ts so a local
                    # `npx playwright test --project chromium-pixel-9` still runs.
                    - variant: pw phones 1/3
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones-1-3
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ; 1/3'
                    - variant: pw phones 2/3
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones-2-3
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ; 2/3'
                    - variant: pw phones 3/3
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones-3-3
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ; 3/3'

                    # Two cheap slices sharing one runner: the viewport-independent
                    # specs once on mobile Chromium (touch emulation — `card-tap`
                    # is @agnostic and needs a touch context, so this can't be the
                    # desktop project), and the desktop-Chrome viewport-sensitive
                    # set. Each is ~35s of testing behind a ~100s boot; separately
                    # they burned two runners to save nothing.
                    - variant: pw behaviour + desktop
                      kind: playwright
                      browsers: chromium chrome
                      label: chromium-behaviour-desktop
                      runs: |
                          chromium-galaxy-s10 ; @agnostic ; axe-core ;
                          chrome-desktop ; ; axe-core|@agnostic ;
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/run-page-test
              with:
                  kind:          ${{ matrix.kind }}
                  version:       ${{ matrix.version }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}

    page-tests-safari:
        name: page tests (safari / ${{ matrix.variant }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The ~13 viewport-INDEPENDENT spec files (localStorage, URL
                    # round-trips, filter inclusion-sets, search, keyboard a11y —
                    # tagged `@agnostic`) assert byte-identically on all three
                    # portrait iPhone widths (375/390/440 all sit in one CSS
                    # bucket), so running them per-phone was a 3× re-run. They
                    # ride the single `behaviour` slice below; the phone shards
                    # run only the viewport-SENSITIVE specs (navbar geometry,
                    # landscape, zoomed-gaps).
                    #
                    # WebKit is ~3× slower per test than Chromium, so here the
                    # test run — not the ~100s boot — is the bulk, and this tier
                    # is the tier that gets the runners. All three phones run as
                    # ONE project set sharded SEVEN ways rather than per-phone: the
                    # per-phone 2-way shards ranged 306-363s on a single run, and
                    # sharding the combined list evens that out.
                    #
                    # Shard COUNT is not free to pick — Playwright splits by spec
                    # file, so some counts divide the 1104 tests far better than
                    # others. Measured sizes: 5 → 198-236, 6 → 184 exactly six
                    # times, 7 → 135-184, 8 → an alternating 106/170, 9 → 106-132.
                    # What matters is the LARGEST shard, since the build waits on
                    # it, and 6 and 7 tie at 184 — so seven is not better than six
                    # here, it is just where the Chromium/WebKit balance landed.
                    # Nine would be the real improvement if a runner ever frees up.
                    # Re-measure with `--list` before changing this rather than
                    # assuming more shards is faster. Coverage of every width is
                    # unchanged. Firefox stays dropped from CI (the firefox-desktop
                    # project remains in playwright.config.ts for local runs).
                    - { variant: pw phones 1/7, kind: playwright, browsers: webkit, label: webkit-phones-1-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 1/7' }
                    - { variant: pw phones 2/7, kind: playwright, browsers: webkit, label: webkit-phones-2-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 2/7' }
                    - { variant: pw phones 3/7, kind: playwright, browsers: webkit, label: webkit-phones-3-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 3/7' }
                    - { variant: pw phones 4/7, kind: playwright, browsers: webkit, label: webkit-phones-4-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 4/7' }
                    - { variant: pw phones 5/7, kind: playwright, browsers: webkit, label: webkit-phones-5-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 5/7' }
                    - { variant: pw phones 6/7, kind: playwright, browsers: webkit, label: webkit-phones-6-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 6/7' }
                    - { variant: pw phones 7/7, kind: playwright, browsers: webkit, label: webkit-phones-7-7, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 7/7' }
                    # The viewport-independent specs once, on the representative
                    # 390px portrait (matches the `iPhone 13` base in webkitUse).
                    #
                    # It ran the desktop-Safari set too, and that made it the long
                    # pole at 296s — 144 WebKit tests on one runner while the shards
                    # carried ~158 each. desktop-Safari is the same ENGINE as the
                    # phones, so it just joins their project set and gets sharded
                    # with them; the largest shard is 184 either way, so those rows
                    # absorb it for free and this one keeps only its 52.
                    - variant: pw behaviour
                      kind: playwright
                      browsers: webkit
                      label: webkit-behaviour
                      runs: 'webkit-iphone-13 ; @agnostic ; axe-core ;'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/run-page-test
              with:
                  kind:          ${{ matrix.kind }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}
