name: CI

# The full build + test pipeline, factored out as a reusable workflow so it
# has exactly ONE definition. Two callers consume it:
#
#   - main.yml        — push to main: run this, then build the images and
#                       deploy them.
#   - branch-ci.yml   — pull_request: run this alone (no deploy) so every
#                       branch (e.g. the Scala Steward dependency-bump PRs)
#                       is confirmed to compile + pass the same gates main does.
#
# Everything below is identical to what gated deploy before the split — what
# lives in main.yml is the shipping half: the per-tier GHCR build jobs, all of
# which `needs: ci`.
on:
    workflow_call:

# Pipeline shape:
#
#   test (unit) ────────────────────┐
#   integration-test ───────────────┤
#   e2e × 3 shards (+stage, eslint) ┤  (all independent; every shipping job in
#   mobile-local-server (iOS+And) ──┤   main.yml `needs` this whole workflow)
#   page-tests × 9 ─────────────────┘
#
# RUNNER BUDGET — 15 here, and no more. GitHub Free allows 20 concurrent jobs
# ACROSS THE ACCOUNT. On a push to main, `main.yml` adds one more at t=0 (its
# `preflight`; everything else there `needs: ci` and takes slots these have given
# back), and the other FOUR are headroom, deliberately: Main is never alone on the
# account. The convergence suite (which Main itself kicks off), dispatched identity
# runs, and the mobile workflows hold runners for 20-40 min, and with ci filling 19
# slots every one of their jobs pushed one of these rows into a queue — measured
# over 12 Main runs to 2026-10-01, ci rows started a median 1.2-2.0 min late, and
# a queued row is pure added wall-clock. The four came from the Playwright phone
# shards (WebKit 7 → 4, Chromium 3 → 2), which after the `@agnostic` sweeps moved
# out ran ~40 s of tests behind ~1.5 min of setup each. A new job here takes its
# slot from an existing one or eats into that headroom on purpose
# (CiRunnerBudgetSpec).
#
# Current split: 1 test + 1 integration + 2 e2e + 1 mobile + 9 page-tests.
# Staging the dists and eslint ride the `e2e (corpus)` row, and iOS +
# Android LocalServer share one `mobile-local-server` job (one FixtureServerMain
# boot for both). The original ~13-min long pole was the single `e2e` job (two
# serial whole-corpus determinism specs); it's now (a) fanned out across parallel
# shards and (b) each heavy spec runs its replays CONCURRENTLY (see
# ParallelReplays), so e2e drops well under the page-tests tier.
#
# Every page-test row carries the same fixed cost before it runs a single spec:
# checkout, the JDK, the zinc cache, and the FixtureServerMain boot. That boot is
# ~2.4s of application (FixtureTestWiring loads read-model-snapshot.json rather
# than recomputing the pipeline) behind a much larger sbt cost, so the levers on
# it are all outside the application: cache what sbt compiled (see below), and
# overlap what remains with the Node/Playwright installs instead of queueing
# behind it.
#
# A fixed per-row cost that large is also what dictates the shape below. Phones
# run as one sharded project SET rather than a row per phone, so the rows finish
# together instead of ranging 109-207s; and a slice too small to justify its own
# boot shares a runner with another. See .github/actions/run-page-test.
#
# All gating legs run independently. The sbt-driven ones share the sbt build
# cache (.github/actions/sbt-target-cache, which says what it carries and why)
# keyed on hashed sources so later jobs find zinc state warm (the mobile job
# keeps a separate JDK-21 cache key).
#
# `page-tests` is the only job that needs a browser: PageJsBehaviourSpec
# drives a real headless Chrome over CDP to exercise the JS on the
# rendered pages. Kept out of `test` so the main unit job stays
# browser-free and the page checks get a discrete CI status row.
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        # `checks: write` so action-junit-report can post the failure
        # check-run + summary.
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            # THE GITOPS MANIFESTS, CHECKED OUT WHERE THEY USED TO LIVE IN THIS TREE.
            #
            # They are pawelkrupinski/movies-gitops now, because Flux pulls its source on every
            # reconcile -- and, since image-automation began committing the deployed tag, on the
            # write path of every deploy. A shallow clone of this repository is 93.5s and a 1.3 GB
            # tree of 18,806 files, to reach 420 KB of manifests in 36 of them.
            #
            # ⚠️ THE `path:` IS THE WHOLE TRICK. Nine specs in worker/src/test/scala/deploy/ compare
            # those manifests against this repository's workflow and nix config -- heap sizes against
            # node capacity, NodePorts against the Prometheus scrape config, the image tag CI builds
            # against the ImagePolicy that selects it. Landing the checkout at the OLD PATH means the
            # split cost them no changes at all. Move it and nine specs fail at once.
            #
            # `main`, not a pinned ref: these specs should test what is actually DEPLOYED. A pin
            # would go stale silently, which is the failure this repository keeps having to design
            # away. No credential -- the config repo is public, like this one.
            - uses: actions/checkout@v5
              with:
                  repository: pawelkrupinski/movies-gitops
                  path: infra/kubernetes

            # GENERATED ROSTER ARTEFACTS. Cinema.scala's venue annotations, data/**'s venue
            # lists and the *RosterData/VenueTowns/PolishPages Scala + the apps' City lists
            # generated from them are all checked in; an edit that skips regenerating the
            # links below it compiles and passes every spec that reads the stale output. So
            # when the chain's sources change, regenerate it and fail on any difference
            # (scripts/ci/generated-artefacts-drift.sh). Gated on the chain's paths — it
            # fetches GeoNames and PyPI, which an unrelated push should not depend on. The
            # base commit is fetched treeless-shallow: changed-paths only diffs names.
            - name: Fetch this push's base, for the roster filter
              if: github.event_name == 'push'
              env:
                  BASE: ${{ github.event.before }}
              run: |
                  if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
                      git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
                  fi

            - name: Did this change touch the generated roster's sources?
              id: roster
              uses: ./.github/actions/changed-paths
              with:
                  patterns: |
                      common/src/main/scala/models/**
                      data/**
                      android/app/src/main/java/pl/kinowo/model/City.kt
                      ios/Kinowo/Models/City.swift
                      scripts/ci/generated-artefacts-drift.sh
                      .github/workflows/ci.yml

            - name: Generated roster artefacts match their generators
              if: steps.roster.outputs.changed == 'true'
              run: |
                  python3 -m pip install --quiet timezonefinder
                  scripts/ci/generated-artefacts-drift.sh

            # The roster generators' own specs (~8s together): the drift check above proves the
            # artefacts match their generators, these that the generators decide what they should.
            - name: Roster generator specs
              if: steps.roster.outputs.changed == 'true'
              run: |
                  python3 data/germany/scripts/test_harvest_kinoprogramm.py
                  python3 data/pl/scripts/test_build_pages.py
                  python3 data/pl/scripts/test_build_venue_towns.py
                  python3 data/spain/scripts/test_build_provinces.py
                  python3 data/spain/scripts/test_build_town_names.py
                  python3 data/spain/scripts/test_generate_roster.py
                  python3 data/us/scripts/test_cluster_metros.py
                  python3 data/us/scripts/test_generate_roster.py

            # A fixture-corpus edit that skipped the read-model snapshot's regeneration, in
            # half a second instead of the e2e shard's ~110s corpus replay. See
            # scripts/read-model-snapshot-inputs.sh for what the stamp does and does not cover.
            - name: The read-model snapshot is stamped for this fixture corpus
              run: scripts/read-model-snapshot-inputs.sh check HEAD

            # The CI-structure scripts' own specs, seconds each: which checks the pre-push hook
            # selects for which paths, what the workflows' preflight jobs accept and refuse, and
            # how a failed test is judged DETERMINISTIC or FLAKY and ledgered, and how the test
            # jobs' throwaway MongoDB is started.
            # IN THE BACKGROUND, beside the JDK, sbt and build-cache restores (~22 s) they share
            # nothing with: run first in the foreground they held the unit run back by their own
            # ~21-25 s (run 37121131703). Waited for, and failing as they would have, just before it.
            - name: Pre-push hook, preflight, flake-detection and CI-helper specs, in the background
              run: |
                  scripts/ci/in-background.sh start ci-helper-specs bash -e -c '
                      bash scripts/hooks/pre-push-test.sh
                      bash scripts/scratch-git-test.sh
                      bash scripts/ci/preflight-test.sh
                      bash scripts/ci/flake-ledger-test.sh
                      bash scripts/ci/leg-verdict-test.sh
                      bash scripts/ci/rerun-failed-sbt-test.sh
                      bash scripts/ci/start-mongo-replset-test.sh
                      bash scripts/ci/install-apt-package-test.sh
                      bash scripts/ci/in-background-test.sh
                      bash .github/scripts/restore-enrichment-tree-test.sh
                      bash .github/scripts/restore-identity-overlay-test.sh
                      bash .github/scripts/sample-recordings-test.sh
                      bash scripts/ci/close-mongo-tunnel-test.sh
                      bash scripts/ci/install-playwright-test.sh
                      bash scripts/ci/prune-actions-caches-test.sh
                      bash scripts/ci/wait-for-run-artifact-test.sh
                      bash scripts/identity-measure-ci-test.sh
                      python3 scripts/ci/flake_verdict_test.py
                      python3 scripts/test_aot_class_list.py
                      python3 scripts/test_convergence_findings.py
                      bash .github/actions/drop-bot-branch/drop-test.sh
                  '

            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            # Warm zinc state across pushes so an unchanged push is near-
            # instant. Same key as `integration-test` so both jobs share the
            # cache.
            - uses: ./.github/actions/sbt-target-cache
              with:
                  # Scope the exact key to the sources this job compiles
                  # (unit = every module's main + test). restore-keys still
                  # falls back to any recent sbt-target cache so zinc stays
                  # warm on a miss.
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            - name: The pre-push hook, preflight, flake-detection and CI-helper specs passed
              run: scripts/ci/in-background.sh wait ci-helper-specs 600

            # Every module's unit tests except `e2e` in one sbt run; `all` keeps
            # going so a failure in one module still runs the rest. The `e2e`
            # module (the whole-corpus staging specs) rides the integration-test
            # job instead — it doubled this step's wall-clock once staging ingest
            # went always-on, and this is the deploy-gating job, so keep it off
            # the critical path. See the `testUnitNoE2e` alias in build.sbt.
            - id: unit
              run: sbt testUnitNoE2e
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            # FLAKE DETECTION, the same shape in every sbt job below: each failed test rerun
            # alone, three times, in this job, and labelled DETERMINISTIC or FLAKY in the job
            # summary (scripts/ci/rerun-failed-sbt.sh). The job is ALREADY red and stays red — a
            # rerun is never a fix. FLAKY ones are uploaded as `flaky-*` for main.yml's
            # flake-ledger job, which appends them to the ledger issue.
            - name: Rerun the failed unit tests, to tell a flake from a break
              if: failure() && steps.unit.outcome == 'failure'
              timeout-minutes: 20
              run: scripts/ci/rerun-failed-sbt.sh target/test-reports/unit "unit tests" target/flake-rerun
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            - name: Keep the flaky unit tests for the ledger
              if: failure() && hashFiles('target/flake-rerun/flaky.tsv') != ''
              uses: actions/upload-artifact@v6
              with:
                  name: flaky-unit
                  path: target/flake-rerun/flaky.tsv
                  retention-days: 7

            # The snapshot guards in this run (CatalogSeedSpec's app seeds among them) write
            # what they expected; a committed file they rewrote is a stale snapshot, whether
            # or not the spec itself noticed. See scripts/ci/tree-unchanged.sh.
            - name: The unit run left every checked-in file unchanged
              run: scripts/ci/tree-unchanged.sh "sbt testUnitNoE2e"

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: unit tests
                  detailed_summary: true
                  include_passed: false

    # Mobile LocalServer tests — iOS + Android share ONE FixtureServerMain boot.
    # Boots the fixture Play server (same FixtureServerMain + InMemoryMovieRepository
    # the Playwright suite uses) once, then runs both the iOS `LocalServer*` XCTest
    # cases and the Android `LocalServerApiTest` against it. Both decode the live
    # /{city}/api/repertoire + /api/details (+ /api/cinemas on iOS) JSON through
    # their production models — KinowoCore's `Codable` types with the stores'
    # bare `JSONDecoder()`, Android's KinowoApi + kotlinx models. The
    # cross-cutting gate: a MovieController JSON drift that would break either
    # mobile client fails CI here, on the PR that introduces it.
    #
    # Was two separate jobs, each paying the SAME ~4-min FixtureServerMain boot to
    # run a <20s test. Merged so the boot is shared and one runner slot is freed —
    # keeps CI under the 20-runner cap without a job queueing. One JDK 21 serves
    # everything: the Scala build emits Java 21 (`--release 21`) and runs on 21,
    # Gradle 8.9 / AGP 8.6 run on 21, and Swift needs no JDK. Both junit publishes
    # keep their original `iOS LocalServer` / `Android LocalServer` check-names.
    mobile-local-server:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 21
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: ./.github/actions/sbt-target-cache
              with:
                  # JDK-21 zinc cache, kept on its own key so cross-JDK class
                  # artifacts don't mix with the JDK-25 jobs' cache. Boots
                  # web/PageTest FixtureServerMain → page scope (every module's
                  # main + test + the web page sources).
                  key: sbt-target-android-ls-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-android-ls-${{ runner.os }}-

            # Kick the fixture-server compile off HERE, in the background, and
            # collect it below — the Swift toolchain, the Android SDK and Gradle
            # setups that follow are ~50s of download that has no reason to wait
            # behind ~100s of sbt. The exit status is parked in a file so the
            # collect step can still fail the job on a compile error, and the
            # log is replayed there rather than interleaved with three actions'
            # output.
            - name: Start compiling the fixture server
              run: |
                  nohup bash -c 'sbt web/PageTest/compile > /tmp/compile.log 2>&1; echo $? > /tmp/compile.status' &

            - uses: swift-actions/setup-swift@v2
              with:
                  swift-version: '5.10'

            - uses: actions/cache@v5
              with:
                  path: ios/.build
                  key: spm-build-${{ runner.os }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
                  restore-keys: |
                      spm-build-${{ runner.os }}-

            # `packages: platform-tools` instead of the action's default
            # `tools platform-tools`: the deprecated `tools` meta-package drags
            # in the Android Emulator, which this JVM-only `testDebugUnitTest` +
            # swift LocalServer job never uses and whose download flakily corrupts
            # ("Error on ZipFile unknown archive"), failing the whole job before a
            # single test runs. AGP auto-fetches platform-34 / build-tools.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Collect the background compile started above. Build BEFORE booting,
            # as its own step, so the boot's ceiling only has to cover booting.
            #
            # The two were one step, and the 300s below had to stretch over both. That
            # holds until the caches go cold together — a Renovate dependency bump
            # invalidates coursier while a source change invalidates sbt-target — and
            # then the runner spends the entire window fetching the sbt launcher and
            # compiling, reaching only "set current project to movies" by the time it is
            # killed. It reported as `FixtureServerMain never wrote a port file`, which
            # points at the server rather than at the build that never finished making
            # it. Split, a slow build is just a slow build, a compile error says so, and
            # the ceiling below measures the one thing it names. Backgrounding the
            # compile keeps that split — this step still names, times and fails on
            # exactly the compile — while letting the toolchain downloads overlap it.
            - name: Wait for the fixture-server compile
              run: |
                  set -uo pipefail
                  # 900s: the compile is normally ~100s warm, but a cold coursier +
                  # cold zinc cache together is minutes. Same generosity the boot
                  # ceiling below has, and for the same reason.
                  for _ in $(seq 1 450); do
                      [ -f /tmp/compile.status ] && break
                      sleep 2
                  done
                  cat /tmp/compile.log 2>/dev/null || true
                  if [ ! -f /tmp/compile.status ]; then
                      echo "::error::web/PageTest/compile did not finish within 900s"
                      exit 1
                  fi
                  exit "$(cat /tmp/compile.status)"

            # Through `.github/scripts/fixture-server.sh`, which relaunches a server
            # that exits before writing its port (a boot-jar fetch timeout took a
            # page-test shard down this way on 2026-09-06) — see its header.
            - name: Boot FixtureServerMain
              env:
                  # 300s ceiling over ~110s of CPU-bound bootStartup (the whole
                  # ~1000-film fixture corpus through scrape→enrich→fold against
                  # in-memory fixtures — processing cost, not retries) plus sbt's own
                  # startup. The compile is no longer inside this window.
                  FIXTURE_BOOT_CEILING_SECONDS: 300
              run: |
                  set -euo pipefail
                  .github/scripts/fixture-server.sh launch /tmp/fixture-server sbt "web/PageTest/runMain tools.FixtureServerMain /tmp/fixture-server/port"
                  .github/scripts/fixture-server.sh await /tmp/fixture-server
                  echo "KINOWO_LOCAL_URL=http://127.0.0.1:$(cat /tmp/fixture-server/port)" >> "$GITHUB_ENV"

            # Both suites run against the one server; `set +e` + a combined exit
            # status so an iOS failure still lets the Android suite run (and vice
            # versa) — the always() publishes below then surface both. `--no-daemon`
            # so Gradle inherits KINOWO_LOCAL_URL for the forked test JVM.
            - name: Run LocalServer mobile tests (iOS + Android)
              run: |
                  set +e
                  swift test --package-path ios --filter LocalServer --xunit-output ios-localserver.xml
                  ios=$?
                  ( cd android && ./gradlew --no-daemon testDebugUnitTest --tests 'pl.kinowo.localserver.*' )
                  android=$?
                  echo "iOS exit=$ios  Android exit=$android"
                  [ $ios -eq 0 ] && [ $android -eq 0 ]

            - name: Publish iOS test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # SwiftPM writes `<base>.xml` (XCTest) and
                  # `<base>-swift-testing.xml` (swift-testing); glob both.
                  report_paths: 'ios-localserver*.xml'
                  check_name: iOS LocalServer
                  detailed_summary: true
                  include_passed: false

            - name: Publish Android test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
                  check_name: Android LocalServer
                  detailed_summary: true
                  include_passed: false

            - name: Stop FixtureServerMain
              if: always()
              run: .github/scripts/fixture-server.sh stop /tmp/fixture-server

            - name: Upload fixture-server log on failure
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: fixture-server-log-mobile
                  path: /tmp/fixture-server/log
                  if-no-files-found: ignore

    integration-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        # Throwaway Mongo for the run. The IT suites self-seed every doc they
        # assert on (MovieRepositoryIntegrationSpec, MongoTaskQueueIntegrationSpec,
        # UserRepositoryIntegrationSpec, …) and create their own collections/indexes
        # on first use, so a bare empty instance is all they need. Previously
        # this job wrote to the shared Atlas DB via `secrets.MONGODB_URI`; a run
        # cancelled mid-suite — the concurrency group kills superseded pushes
        # before `afterAll` — stranded sentinel fixtures there (the "Dotted
        # (1902)" rows). An ephemeral instance can't be polluted.
        #
        # NOT a `services:` block: MovieRepoIntegrationSpec's change-stream test
        # opens a `$changeStream`, which Mongo only supports on a replica set —
        # against a standalone the stream errors out and the test times out. We
        # need `mongod --replSet`, but GitHub `services:` can't override the
        # container command, so start Mongo by hand as a single-node RS instead.
        steps:
            - uses: actions/checkout@v5

            - name: Start MongoDB (single-node replica set, for change streams)
              run: scripts/ci/start-mongo-replset.sh
              # A majority write acknowledged once applied, not once synced to the journal: every
              # write the app makes is `w: majority`, and on a database that dies with the runner a
              # disk sync per write (~7 ms against ~0.2 ms) buys nothing. Same as the convergence
              # legs (convergence-setup); see the script.
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'

            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: ./.github/actions/sbt-target-cache
              with:
                  # it scope (every module's main + test + it). restore-keys keeps zinc warm.
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/it/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            # Both apps' integration suites in one run (web + worker each have an
            # `it` config); `all` keeps going across them. Still one GH job. The
            # `e2e` module runs in its own parallel job (below) — combining it here
            # made this the deploy gate; with a runner freed by merging the mobile
            # jobs there's now a slot to parallelise e2e off the critical path.
            - id: it
              run: sbt itAll
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB:      kinowo

            # Flake detection — see the unit job. The Mongo container is still up for the reruns.
            - name: Rerun the failed integration tests, to tell a flake from a break
              if: failure() && steps.it.outcome == 'failure'
              timeout-minutes: 20
              run: scripts/ci/rerun-failed-sbt.sh target/test-reports/it "integration tests" target/flake-rerun
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB:      kinowo

            - name: Keep the flaky integration tests for the ledger
              if: failure() && hashFiles('target/flake-rerun/flaky.tsv') != ''
              uses: actions/upload-artifact@v6
              with:
                  name: flaky-it
                  path: target/flake-rerun/flaky.tsv
                  retention-days: 7

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/it/**/*.xml'
                  check_name: integration tests
                  detailed_summary: true
                  include_passed: false

    # The `e2e` module (cross-app whole-corpus specs), FANNED OUT across two
    # parallel shards (see the e2eCorpus/e2eRest aliases in build.sbt):
    #
    #   corpus   — FilmScheduleEndToEndSpec (run by name), which boots the whole fixture
    #              corpus through the identity projection; this row also stages the dists
    #              Main's image build reads;
    #   rest     — every OTHER e2e spec, via `e2e/Test/test -- -l …CorpusReplay`
    #              (tag-EXCLUSION of the @CorpusReplay spec), so a newly-added spec
    #              auto-rides this shard and can't be silently dropped. See the
    #              `@CorpusReplay` tag annotation in CorpusReplay.java.
    #
    # Uses FixtureTestWiring (no Mongo); reports go to the root unit/ dir
    # (unitReportSettings) → a per-shard `e2e tests (<shard>)` check.
    e2e:
        name: e2e (${{ matrix.shard }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: corpus,   cmd: e2eCorpus }
                    - { shard: rest,     cmd: e2eRest }
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: ./.github/actions/sbt-target-cache
              with:
                  # Dedicated key so these shards PERSIST the e2e/Test compile
                  # (the shared `sbt-target-` key is owned by `test`, which never
                  # compiles e2e — so on that key e2e recompiled cold every run,
                  # ~100s). All three shards share this one key: only the first to
                  # finish writes it; the rest read it warm. restore-keys falls
                  # back to the shared cache on a miss so web+worker main still
                  # come in warm on the first run.
                  key: sbt-target-e2e-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-e2e-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            - id: e2e
              run: sbt ${{ matrix.cmd }}
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            # Flake detection — see the unit job. A whole-corpus spec reruns in minutes, hence
            # the ceiling; a rerun that runs out of it leaves those tests NOT RERUN.
            - name: Rerun the failed e2e tests, to tell a flake from a break
              if: failure() && steps.e2e.outcome == 'failure'
              timeout-minutes: 30
              run: scripts/ci/rerun-failed-sbt.sh target/test-reports/unit "e2e (${{ matrix.shard }})" target/flake-rerun
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

            - name: Keep the flaky e2e tests for the ledger
              if: failure() && hashFiles('target/flake-rerun/flaky.tsv') != ''
              uses: actions/upload-artifact@v6
              with:
                  name: flaky-e2e-${{ matrix.shard }}
                  path: target/flake-rerun/flaky.tsv
                  retention-days: 7

            # FilmScheduleEndToEndSpec's expected-schedules.txt / read-model-snapshot.json,
            # held the same way as the unit run's snapshots (scripts/ci/tree-unchanged.sh).
            - name: The e2e run left every checked-in file unchanged
              run: scripts/ci/tree-unchanged.sh "sbt ${{ matrix.cmd }}"

            - name: Publish e2e test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: e2e tests (${{ matrix.shard }})
                  detailed_summary: true
                  include_passed: false

            # Prove BOTH apps' universal-stage distributions still link — on the
            # STAGING row only, the lightest e2e shard, which has compiled the apps
            # already. (This used to close the `test` job, Main's longest ci row,
            # whose tail it lengthened by ~1 min of staging + uploads + lint.) On a
            # push to main the dists are then handed to the `image-web` job below
            # and main.yml's `image-worker` (through the uploads that follow), which
            # would otherwise restage them from a cold compile
            # on the post-CI critical path. On a PR run (branch-ci.yml never
            # reaches main.yml) this staging is the only place a dist that stopped
            # linking, or a reappearing Scaladoc tree, is caught at all.
            - if: matrix.shard == 'corpus'
              run: sbt "web/stage" "worker/stage"

            # Guards build.sbt's `noApiDocs`. Play's dist and native-packager
            # both ship a `share/doc/api` tree by default, which put dotty's
            # scaladoc on the deploy critical path — it NPE'd here on JDK 25
            # and failed a deploy whose only diff was a workflow file. Nothing
            # reads these docs, so their reappearance is a regression: fail
            # loudly rather than let an unread artefact break deploys again.
            - name: Deploy artefacts carry no generated Scaladoc
              if: matrix.shard == 'corpus'
              run: |
                  found=$(find web/target/universal/stage worker/target/universal/stage \
                              -type d -name doc -print -quit)
                  if [ -n "$found" ]; then
                      echo "::error::staged dist ships generated Scaladoc at $found — see noApiDocs in build.sbt"
                      exit 1
                  fi

            - name: Hand the staged web dist to main.yml's image build
              # Not on a PR run (branch-ci.yml's only trigger), which nothing downloads from;
              # every main.yml run — push or workflow_dispatch — needs it. Uncompressed — the dist is
              # jars, already zipped, so compressing again only costs upload time — and
              # kept one day, since its one consumer runs minutes after this job.
              if: matrix.shard == 'corpus' && github.event_name != 'pull_request'
              uses: actions/upload-artifact@v6
              with:
                  name: stage-web
                  path: web/target/universal/stage
                  compression-level: 0
                  retention-days: 1
                  if-no-files-found: error

            - name: Hand the staged worker dist to main.yml's image build
              # Not on a PR run (branch-ci.yml's only trigger), which nothing downloads from;
              # every main.yml run — push or workflow_dispatch — needs it. Uncompressed — the dist is
              # jars, already zipped, so compressing again only costs upload time — and
              # kept one day, since its one consumer runs minutes after this job.
              if: matrix.shard == 'corpus' && github.event_name != 'pull_request'
              uses: actions/upload-artifact@v6
              with:
                  name: stage-worker
                  path: worker/target/universal/stage
                  compression-level: 0
                  retention-days: 1
                  if-no-files-found: error

            # ESLint over the production JS in `public/js/`, on the corpus row for
            # the same reason as the staging above (it was a standalone `lint` job
            # once; folding it into a shard keeps CI inside the runner budget). Runs
            # LAST: the e2e check is published above with `always()`, so a lint
            # failure never hides it, and the stage artifacts upload first. Cross-file
            # globals (constants from `_sharedJsConfig`, functions called from
            # inline `<script>` blocks) are listed in `eslint.config.js` so
            # `no-undef` stays meaningful.
            - uses: actions/setup-node@v5
              if: matrix.shard == 'corpus'
              with:
                  node-version: '22'
                  cache: 'npm'
            - if: matrix.shard == 'corpus'
              run: npm ci
            - if: matrix.shard == 'corpus'
              run: npm run lint

    # THE WEB IMAGE, BUILT WHILE THE REST OF ci RUNS. It needs only the dist the e2e corpus row
    # staged, which is ready minutes before the slowest ci row finishes, so it rides runners the e2e rows
    # have just given back (no slot at t=0 — CiRunnerBudgetSpec counts only jobs without `needs`).
    # SAFETY: it pushes this commit's SHA tag ONLY. Nothing deploys a SHA tag; main.yml's
    # `build-web` gives these bytes the tags that ship (`main-<utc>-<sha7>`, `latest`) only once
    # ci is green and the tier's paths changed (DeployImageReuseSpec). Never on a PR run.
    image-web:
        needs: e2e
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # The built-in GITHUB_TOKEN can push to GHCR; no new credential.
            packages: write
        steps:
            - uses: actions/checkout@v5

            - name: Fetch the web distribution the e2e corpus row staged
              # Straight into `stage/`, the only path the Dockerfile's whitelisted context
              # (.dockerignore) can see. The artifact drops file modes; the Dockerfile's
              # `chmod +x bin/*` restores the one that matters.
              uses: actions/download-artifact@v6
              with:
                  name: stage-web
                  path: stage

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build and push under this commit's SHA tag only
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY: the cluster is Hetzner x86_64.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=web
                      COMMIT_SHA=${{ github.sha }}
                  tags: ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}
                  # INLINE cache, restored from the image last shipped: the layers worth reusing (base
                  # OS, JRE) are all in `latest`, and inline metadata rides the push itself.
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/movies-web:latest
                  cache-to: type=inline

    # Cross-browser page tests, split into one matrix job per engine
    # family so the CI checks list groups red rows by browser. Every
    # row delegates to the shared `run-page-test` composite action —
    # see `.github/actions/run-page-test/action.yml` for the step
    # body that's identical across all four jobs.
    #
    # `kind` (chrome | playwright) drives which steps execute:
    #
    # - `chrome`: install Chrome via browser-actions/setup-chrome,
    #   then `sbt PageTest/test` with `CDP_BROWSER_BIN` pointing at it.
    #
    # - `playwright`: install Node + the one engine binary specified
    #   by `browser`, boot `FixtureServerMain` over a free port, then
    #   `npx playwright test --project <project>`. The Playwright
    #   suite drives `page-tests-playwright/` against a Twirl-rendered
    #   fixture server (InMemoryMovieRepository + FakeHttpFetch — same
    #   wiring the Scala spec uses, exposed over HTTP). Mobile
    #   projects are split per-phone so each runner handles one
    #   phone's four variants (portrait, zoomed, landscape,
    #   zoomed-landscape) — ~4 projects × 20 specs ≈ under 2 min.
    #
    # Chrome version pick reflects real Android phone distribution as
    # of early 2026 (120+ ≈ 85% of devices, 113–120 the long tail);
    # 113 is the floor that chrome-for-testing publishes. `stable`
    # tracks whatever Google ships next. Specific versions catch
    # regressions like the touchstart-vs-click timing change that
    # bit the card-tap fix — see [[feedback-ci-chrome-version-drift]].
    #
    # axe-core gates itself to `chromium-desktop` (see
    # `tests/a11y.spec.ts` — `test.beforeEach` skips on every other
    # project), so only that row pays the audit cost. It's
    # `continue-on-error` because the site has known WCAG violations
    # (`color-contrast` on `.text-secondary` against the dark body
    # bg) that aren't worth blocking deploys over.

    page-tests-chrome:
        name: page tests (chrome / ${{ matrix.variant }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { variant: stable, kind: chrome, version: stable }

                    # The three Chromium phones run as ONE project set, sharded
                    # two ways, rather than one runner per phone. Three reasons.
                    #
                    # Balance: per-phone rows drifted badly apart (109s vs 207s
                    # for the identical test count on the same run), and the
                    # build waits on the slowest. Playwright shards the combined
                    # list — measured 552/552 at two ways, dead even — so the
                    # rows finish together.
                    #
                    # Two, not the three it once was: the split has to EQUALISE the
                    # two tiers, and since the `@agnostic` sweeps left the phone
                    # rows a three-way row ran only ~35-50 s of tests behind its
                    # ~1.5 min of setup. Two rows (216 listed each, 2026-10-01)
                    # stay under the WebKit rows and give a runner back.
                    #
                    # And they no longer re-run the `@agnostic` set. Those ~13
                    # viewport-INDEPENDENT spec files were being executed at all
                    # four viewport variants of all three phones — 12× what the
                    # tag says is needed, and 208 of each row's 576 tests. They
                    # ride the single `behaviour` row below now, exactly as the
                    # WebKit phones have always done.
                    #
                    # chromium pixel-9 (360 px) stays out — same width as
                    # galaxy-s10, redundant for catching layout breaks. The
                    # project stays in playwright.config.ts so a local
                    # `npx playwright test --project chromium-pixel-9` still runs.
                    - variant: pw phones 1/2
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones-1-2
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ; 1/2'
                    - variant: pw phones 2/2
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones-2-2
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ; 2/2'

                    # Two cheap slices sharing one runner: the viewport-independent
                    # specs once on mobile Chromium (touch emulation — `card-tap`
                    # is @agnostic and needs a touch context, so this can't be the
                    # desktop project), and the desktop-Chrome viewport-sensitive
                    # set. Each is ~35s of testing behind a ~100s boot; separately
                    # they burned two runners to save nothing.
                    - variant: pw behaviour + desktop
                      kind: playwright
                      browsers: chromium chrome
                      label: chromium-behaviour-desktop
                      runs: |
                          chromium-galaxy-s10 ; @agnostic ; axe-core ;
                          chrome-desktop ; ; axe-core|@agnostic ;
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/run-page-test
              with:
                  kind:          ${{ matrix.kind }}
                  version:       ${{ matrix.version }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}

    page-tests-safari:
        name: page tests (safari / ${{ matrix.variant }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The ~13 viewport-INDEPENDENT spec files (localStorage, URL
                    # round-trips, filter inclusion-sets, search, keyboard a11y —
                    # tagged `@agnostic`) assert byte-identically on all three
                    # portrait iPhone widths (375/390/440 all sit in one CSS
                    # bucket), so running them per-phone was a 3× re-run. They
                    # ride the single `behaviour` slice below; the phone shards
                    # run only the viewport-SENSITIVE specs (navbar geometry,
                    # landscape, zoomed-gaps).
                    #
                    # WebKit is ~3× slower per test than Chromium, so here the
                    # test run — not the ~100s boot — is the bulk, and this tier
                    # is the tier that gets the runners. All three phones run as
                    # ONE project set sharded FOUR ways rather than per-phone: the
                    # per-phone 2-way shards ranged 306-363s on a single run, and
                    # sharding the combined list evens that out.
                    #
                    # Shard COUNT is not free to pick — Playwright splits by spec
                    # file, and every row pays ~1.5 min of fixed setup before its
                    # first test. Since the `@agnostic` sweeps moved to the
                    # behaviour row, the phone set is small: `--list` sizes
                    # (2026-10-01, runtime skips included — about half run) are
                    # 3 → 144-170, 4 → 109-124, 5 → 82-103, 7 → 56-72. At seven,
                    # each row ran ~45 s of tests behind its ~1.5 min of setup; four
                    # keeps the largest row near ~90 s of tests, under the unit and
                    # integration rows, and gives three runners back to the account
                    # (see RUNNER BUDGET at the top). Re-measure with `--list` before
                    # changing this rather than
                    # assuming more shards is faster. Coverage of every width is
                    # unchanged. Firefox stays dropped from CI (the firefox-desktop
                    # project remains in playwright.config.ts for local runs).
                    - { variant: pw phones 1/4, kind: playwright, browsers: webkit, label: webkit-phones-1-4, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 1/4' }
                    - { variant: pw phones 2/4, kind: playwright, browsers: webkit, label: webkit-phones-2-4, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 2/4' }
                    - { variant: pw phones 3/4, kind: playwright, browsers: webkit, label: webkit-phones-3-4, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 3/4' }
                    - { variant: pw phones 4/4, kind: playwright, browsers: webkit, label: webkit-phones-4-4, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 4/4' }
                    # The viewport-independent specs once, on the representative
                    # 390px portrait (matches the `iPhone 13` base in webkitUse).
                    #
                    # It ran the desktop-Safari set too, and that made it the long
                    # pole at 296s — 144 WebKit tests on one runner while the shards
                    # carried ~158 each. desktop-Safari is the same ENGINE as the
                    # phones, so it just joins their project set and gets sharded
                    # with them; the largest shard is 184 either way, so those rows
                    # absorb it for free and this one keeps only its 52.
                    - variant: pw behaviour
                      kind: playwright
                      browsers: webkit
                      label: webkit-behaviour
                      runs: 'webkit-iphone-13 ; @agnostic ; axe-core ;'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/run-page-test
              with:
                  kind:          ${{ matrix.kind }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}
