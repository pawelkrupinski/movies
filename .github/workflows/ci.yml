name: CI

# The full build + test pipeline, factored out as a reusable workflow so it
# has exactly ONE definition. Two callers consume it:
#
#   - main.yml        — push to main: run this, then build the images and
#                       deploy them.
#   - branch-ci.yml   — pull_request: run this alone (no deploy) so every
#                       branch (e.g. the Scala Steward dependency-bump PRs)
#                       is confirmed to compile + pass the same gates main does.
#
# Everything below is identical to what gated deploy before the split — what
# lives in main.yml is the shipping half: the per-tier GHCR build jobs, all of
# which `needs: ci`.
on:
    workflow_call:

# WHERE IMAGES GO: registry.kinowo.net (infra/nix/modules/roles/registry.nix), the registry Flux's
# ImageRepositories scan (FluxImageAutomationSpec), pushed as `ci` with the REGISTRY_PASSWORD secret
# (infra/k8s-secrets/github-secrets.map). Fixed here, not in repository variables: those were set on
# one forge only, and github.com fell back to ghcr.io and logged in
# there as the pushing actor with registry.kinowo.net's password -- `denied` (Main #2030).
env:
    IMAGE_REPO: registry.kinowo.net
    REGISTRY_HOST: registry.kinowo.net
    REGISTRY_USER: ci

# Pipeline shape:
#
#   test × 5 (heavy ×2, worker-identity, worker, rest) ─┐
#   integration-test × 2 ───────────┤
#   e2e × 3 shards (+stage, eslint) ┤  (all independent; every shipping job in
#   mobile-local-server (iOS+And) ──┤   main.yml `needs` this whole workflow)
#   page-tests × 7 ─────────────────┘
#
# RUNNER BUDGET — 15 here, and no more. GitHub Free allows 20 concurrent jobs
# ACROSS THE ACCOUNT. On a push to main, `main.yml` adds one more at t=0 (its
# `preflight`; everything else there `needs: ci` and takes slots these have given
# back), and the other FOUR are headroom, deliberately: Main is never alone on the
# account. The convergence suite (which Main itself kicks off), dispatched identity
# runs, and the mobile workflows hold runners for 20-40 min, and with ci filling 19
# slots every one of their jobs pushed one of these rows into a queue — measured
# over 12 Main runs to 2026-10-01, ci rows started a median 1.2-2.0 min late, and
# a queued row is pure added wall-clock. The four came from the Playwright phone
# shards (WebKit 7 → 4, Chromium 3 → 2), which after the `@agnostic` sweeps moved
# out ran ~40 s of tests behind ~1.5 min of setup each. (Chromium 2 → 1 and WebKit
# 4 → 2 later gave their runners to splitting the unit and integration rows, not to
# the headroom.) A new job here takes its
# slot from an existing one or eats into that headroom on purpose
# (CiRunnerBudgetSpec).
#
# Current split: 5 test + 2 integration + 2 e2e + 1 mobile + 7 page-tests.
# Staging the dists and eslint ride the `e2e (corpus)` row, and iOS +
# Android LocalServer share one `mobile-local-server` job (one FixtureServerMain
# boot for both). The original ~13-min long pole was the single `e2e` job (two
# serial whole-corpus determinism specs); it's now (a) fanned out across parallel
# shards and (b) each heavy spec runs its replays CONCURRENTLY (see
# ParallelReplays), so e2e drops well under the page-tests tier.
#
# Every page-test row carries the same fixed cost before it runs a single spec:
# checkout, the JDK, the zinc cache, and the FixtureServerMain boot. That boot is
# ~2.4s of application (FixtureTestWiring loads read-model-snapshot.json rather
# than recomputing the pipeline) behind a much larger sbt cost, so the levers on
# it are all outside the application: cache what sbt compiled (see below), and
# overlap what remains with the Node/Playwright installs instead of queueing
# behind it.
#
# A fixed per-row cost that large is also what dictates the shape below. Phones
# run as one sharded project SET rather than a row per phone, so the rows finish
# together instead of ranging 109-207s; and a slice too small to justify its own
# boot shares a runner with another. See .github/actions/run-page-test.
#
# All gating legs run independently. The sbt-driven ones share the sbt build
# cache (.github/actions/sbt-target-cache, which says what it carries and why)
# keyed on hashed sources so later jobs find zinc state warm (the mobile job
# keeps a separate JDK-21 cache key).
#
# `page-tests` is the only job that needs a browser: PageJsBehaviourSpec
# drives a real headless Chrome over CDP to exercise the JS on the
# rendered pages. Kept out of `test` so the main unit job stays
# browser-free and the page checks get a discrete CI status row.
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # WHICH SLOW ROWS THIS PUSH CAN MOVE, in seconds at t=0 (scripts/ci/ci-row-scope.sh). ~65 pushes a day reach Main, and
    # a third touch only identity, the judgements, docs or scripts: each ran the 9 page/mobile/e2e rows (~44
    # runner-minutes) for nothing (2026-10-22). The base is the newest GREEN Main run's commit, not the push's `before`:
    # a superseded run's commits, or a red run's, stay inside the interval until a run passes with them, so a skipped
    # row never hides an untested change. Plus each tier's deployed marker for the e2e rows: `e2e (corpus)` builds the
    # images main.yml publishes. A skipped row counts as a success for `needs: ci` and for the run's conclusion the
    # pre-push red gate reads. FAILS OPEN: no base, a PR run, a dispatch, an unreadable runs list or a failed fetch runs
    # every row, and so does this job failing (the rows test `!= 'false'`). CiRowScopeSpec.
    scope:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            e2e: ${{ steps.scope.outputs.e2e }}
            pages: ${{ steps.scope.outputs.pages }}
            browsers: ${{ steps.scope.outputs.browsers }}
        steps:
            # What the live-script check reads (ci-row-scope.sh), nothing else: no 21k-file checkout for a few seconds' job.
            # build.sbt too, as every file at the root: a sparse checkout holds them all.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      .github
                      scripts
                      e2e/src
                      web/src/page
                      page-tests-playwright
                      project
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Which rows can this push move?
              id: scope
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  BEFORE: ${{ github.event.before }}
                  PULL_REQUEST: ${{ github.event.pull_request.number }}
              run: scripts/ci/ci-row-scope.sh --outputs
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # The unit tests, SPLIT across five runners: the worker module (~6,300 tests, the heaviest) on four through
    # build.sbt's WORKER_ROW filter, and common, identity and testkit on the fifth (`rest`). Two of the worker's rows are
    # its HEAVY suites (build.sbt `HeavyRows`, 2026-10-28): the ones that re-decide a recording's slices or re-resolve
    # the checked-in captures, which the owner wants out of the unit rows but still run before every deploy -- they do:
    # main.yml's publish jobs `needs: ci`, this job's rows included. `worker-identity` runs the resolver's other specs,
    # the tools' and the identity tooling's, and `worker` the worker's rest beside the web and scrapers modules. Each
    # row is cut to roughly equal time from per-suite JUnit times (measure run 3419 and after). One runner running all
    # five modules was the build's long pole (an `sbt testUnitNoE2e` of 7-10 min, 2026-10-15). The non-sbt checks
    # (roster drift, the read-model stamp, actionlint, …) ride `heavy1`, the lightest row (Main runs 3614-3623: heavy1
    # 4.1 min against worker-identity 7.2, which carried them until then); the script self-tests run off the gate, in
    # tool-self-tests.yml; the gitops manifests ride `worker`, whose deploy specs read them.
    test:
        name: test (${{ matrix.shard }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: heavy1,          cmd: testUnitWorker, suites: heavy1 }
                    - { shard: heavy2,          cmd: testUnitWorker, suites: heavy2 }
                    - { shard: worker-identity, cmd: testUnitWorker, suites: identity }
                    - { shard: worker,          cmd: testUnitWorkerAndWeb, suites: rest }
                    - { shard: rest,            cmd: testUnitRest }
        runs-on: ubuntu-26.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        # The worker rows' suite filter (build.sbt `workerRowSettings`); empty on `rest`, which runs no worker suite.
        env:
            WORKER_ROW: ${{ matrix.suites }}
        # `checks: write` so action-junit-report can post the failure check-run + summary on github.com.
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}

            # THE GITOPS MANIFESTS, CHECKED OUT WHERE THEY USED TO LIVE IN THIS TREE.
            #
            # They are pawelkrupinski/movies-gitops now, because Flux pulls its source on every
            # reconcile -- and, since image-automation began committing the deployed tag, on the
            # write path of every deploy. A shallow clone of this repository is 93.5s and a 1.3 GB
            # tree of 18,806 files, to reach 420 KB of manifests in 36 of them.
            #
            # ⚠️ THE `path:` IS THE WHOLE TRICK. Nine specs in worker/src/test/scala/deploy/ compare
            # those manifests against this repository's workflow and nix config -- heap sizes against
            # node capacity, NodePorts against the Prometheus scrape config, the image tag CI builds
            # against the ImagePolicy that selects it. Landing the checkout at the OLD PATH means the
            # split cost them no changes at all. Move it and nine specs fail at once.
            #
            # `main`, not a pinned ref: these specs should test what is actually DEPLOYED. A pin
            # would go stale silently, which is the failure this repository keeps having to design
            # away. No credential -- the config repo is public, like this one -- so a plain anonymous
            # clone rather than actions/checkout, which sends the job's token and asks the API for the
            # default branch: that token reaches only THIS
            # repository, and the lookup fails "The target couldn't be found" even for a public one.
            - if: matrix.shard == 'worker'
              name: Check out the gitops manifests (movies-gitops main, anonymously)
              run: git clone --quiet --depth 1 --branch main "$GITHUB_SERVER_URL/pawelkrupinski/movies-gitops" infra/kubernetes

            # GENERATED ROSTER ARTEFACTS. Cinema.scala's venue annotations, data/**'s venue
            # lists and the *RosterData/VenueTowns/PolishPages Scala (geodata/, common/) + the apps' City lists
            # generated from them are all checked in; an edit that skips regenerating the
            # links below it compiles and passes every spec that reads the stale output. So
            # when the chain's sources change, regenerate it and fail on any difference
            # (scripts/ci/generated-artefacts-drift.sh). Gated on the chain's paths — it
            # fetches GeoNames and PyPI, which an unrelated push should not depend on.
            - name: Did this change touch the generated roster's sources?
              if: matrix.shard == 'heavy1'
              id: roster
              uses: ./.github/actions/changed-paths
              with:
                  patterns: |
                      common/src/main/scala/models/**
                      geodata/src/main/scala/models/**
                      data/**
                      android/app/src/main/java/pl/kinowo/model/City.kt
                      ios/Kinowo/Models/City.swift
                      scripts/ci/generated-artefacts-drift.sh
                      .github/workflows/ci.yml

            # The generators' own specs (data/**/*_test.py) run with the script self-tests (tool-self-tests.yml): this
            # proves the artefacts match their generators, those that the generators decide what they
            # should. timezonefinder, installed here on a roster change, lets the US zone cases run there.
            - name: Generated roster artefacts match their generators
              if: steps.roster.outputs.changed == 'true'
              run: |
                  python3 -m pip install --quiet timezonefinder
                  scripts/ci/generated-artefacts-drift.sh

            # A fixture-corpus edit that skipped the read-model snapshot's regeneration, in
            # half a second instead of the e2e shard's ~110s corpus replay. See
            # scripts/read-model-snapshot-inputs.sh for what the stamp does and does not cover.
            - name: The read-model snapshot is stamped for this fixture corpus
              if: matrix.shard == 'heavy1'
              run: scripts/read-model-snapshot-inputs.sh check HEAD

            # actionlint over every workflow (shellcheck over their `run:` blocks), and the composite
            # actions' `run:` blocks, which actionlint does not lint, through shellcheck-action-runs.sh.
            # The pre-push hook runs both over what a push changes, but skips a tool that is not
            # installed — this is the check that cannot be skipped. Pinned by version and checksum.
            - name: Workflows pass actionlint, and composite actions' run blocks pass shellcheck
              if: matrix.shard == 'heavy1'
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/$archive" \
                      "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
                  SHELLCHECK_OPTS='-S warning' "$RUNNER_TEMP/actionlint"
                  scripts/ci/shellcheck-action-runs.sh

            # The JDK, sbt and the build cache (.github/actions/setup-sbt-build). Warm zinc state
            # across pushes so an unchanged push is near-instant. The exact key is scoped to the sources
            # this job compiles (unit = every module's main + test, not the action's default it scope)
            # and to the row: each row compiles only its own modules' tests, so a shared entry would hand
            # one row the other's half and recompile its own. Each row falls back to its own newest entry,
            # then to integration-test's (every module's main + test + it, a superset), then to any.
            #
            # THE ROW BEFORE THE OS, and its own family beside the shared `sbt-target-<os>-` one, so no
            # prefix is another's: `sbt-target-<os>-unit-worker-` also matched `-unit-worker-identity-` and
            # `-unit-worker-scripts-`, whose rows never compile web, and `sbt-target-<os>-` (integration-
            # test's) matched every unit row's. Whichever finished last won the fallback: `test (worker)`
            # recompiled web's 232 sources and 214 specs (2-5 min), and both integration rows those plus
            # 147 it sources (~1.5-2 min each), on 4 of 11 Main runs to 2026-10-22 (1192, 1194, 1308, 1322).
            # A family only this row writes, from a key hashing all it compiles: an exact hit needs no
            # exporter invalidation (`target-cache-exact-hit-is-current`). (SharedSbtBuildSetupSpec)
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-key: sbt-target-unit-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-unit-${{ matrix.shard }}-${{ runner.os }}-
                      sbt-target-it-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
                  target-cache-exact-hit-is-current: 'true'

            # This row's modules' unit tests in one sbt run; `all` keeps going so a
            # failure in one module still runs the rest. The `e2e` module (the
            # whole-corpus staging specs) has its own sharded job below — it doubled
            # this step's wall-clock once staging ingest went always-on, and this is
            # the deploy-gating job, so keep it off the critical path. See the
            # `testUnitWorker` / `testUnitRest` aliases in build.sbt.
            - run: sbt ${{ matrix.cmd }}
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}

            # The snapshot guards in this run (CatalogSeedSpec's app seeds among them) write
            # what they expected; a committed file they rewrote is a stale snapshot, whether
            # or not the spec itself noticed. See scripts/ci/tree-unchanged.sh.
            - name: The unit run left every checked-in file unchanged
              run: scripts/ci/tree-unchanged.sh "sbt ${{ matrix.cmd }}"

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: unit tests (${{ matrix.shard }})
                  include_passed: false

            # EVERY BUDGET FIGURE THIS ROW MEASURED (tools.costs.PerformanceBudget.Report): `scripts/adopt-ci-budgets <run>`
            # sets PerformanceBudgets' `measured` from them, CI's Linux JVM figures rather than a laptop's. Every spec writes the
            # root target/ (project/ForkedTests runs each fork there); */target/ only catches a stray one. Red rows too: a budget out of its band is what it reads.
            - name: Upload the performance budget figures
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: performance-budgets-unit-${{ matrix.shard }}
                  path: |
                      target/performance-budgets.tsv
                      */target/performance-budgets.tsv
                  if-no-files-found: ignore
                  retention-days: 14
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # The integration specs, SPLIT across two runners by build.sbt's `IT_ROW` filter: `identity` runs the
    # hard-cluster convergence, whose parallel boots fill a runner's cores; `rest` runs every other spec, by
    # exclusion. One runner running all of `itAll` was CPU-bound — 828 s of
    # suites on 4 cores, the build's long pole beside the unit tests (2026-10-15). The slot came from the WebKit
    # phone shards (4 → 2). Both rows run `itAll`, so `all` still keeps going past a failing module.
    integration-test:
        name: integration-test (${{ matrix.row }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { row: identity }
                    - { row: rest }
        runs-on: ubuntu-22.04 # mongod 8.3 refuses kernels 6.19-7.0.13: github.com's 24.04 and 26.04 images boot them, 22.04 boots 6.8 (MongoServerVersionParitySpec)
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        # Every sbt step of the row sees the same filter.
        env:
            IT_ROW: ${{ matrix.row }}
        permissions:
            contents: read
            checks: write
        # Throwaway Mongo for the run. The IT suites self-seed every doc they
        # assert on (MovieRepositoryIntegrationSpec, MongoTaskQueueIntegrationSpec,
        # UserRepositoryIntegrationSpec, …) and create their own collections/indexes
        # on first use, so a bare empty instance is all they need. Previously
        # this job wrote to the shared Atlas DB via `secrets.MONGODB_URI`; a run
        # cancelled mid-suite — the concurrency group kills superseded pushes
        # before `afterAll` — stranded sentinel fixtures there (the "Dotted
        # (1902)" rows). An ephemeral instance can't be polluted.
        #
        # NOT a `services:` block: MovieRepoIntegrationSpec's change-stream test
        # opens a `$changeStream`, which Mongo only supports on a replica set —
        # against a standalone the stream errors out and the test times out. We
        # need `mongod --replSet`, but GitHub `services:` can't override the
        # container command, so start Mongo by hand as a single-node RS instead.
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}

            # The gitops manifests where the unit `worker` row checks them out (see there): the deploy specs that run a
            # real script or JVM over them (K8sTierPathGatingIntegrationSpec, LauncherJvmFlagsSpec, …) are `it` specs
            # since unit specs spawn no process (2026-10-27), and they run on this row.
            - if: matrix.row == 'rest'
              name: Check out the gitops manifests (movies-gitops main, anonymously)
              run: git clone --quiet --depth 1 --branch main "$GITHUB_SERVER_URL/pawelkrupinski/movies-gitops" infra/kubernetes

            # IN THE BACKGROUND, beside the JDK, sbt and build-cache restores below, which it shares nothing with
            # (~20 s of every row's start, 2026-10-23), and waited for just before itAll ("Wait for MongoDB").
            - name: Start MongoDB (single-node replica set, for change streams)
              run: scripts/ci/in-background.sh start mongo-start scripts/ci/start-mongo-replset.sh
              # A majority write acknowledged once applied, not once synced to the journal: every
              # write the app makes is `w: majority`, and on a database that dies with the runner a
              # disk sync per write (~7 ms against ~0.2 ms) buys nothing. Same as the convergence
              # legs (convergence-setup); see the script.
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            # it scope (every module's main + test + it), in a family of its own: the action's default
            # `sbt-target-<os>-` family is also every dispatched identity workflow's, whose entries compile
            # less, and its prefix matched the unit rows' entries too (see `test`). Falls back to the unit
            # `worker` row's (web and worker main + test), then to any. Both rows compile the same scope,
            # so an exact hit is this commit's compile and skips the exporter invalidation.
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-key: sbt-target-it-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-it-${{ runner.os }}-
                      sbt-target-unit-worker-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
                  target-cache-exact-hit-is-current: 'true'

            # Both apps' integration suites in one run (web + worker each have an
            # `it` config); `all` keeps going across them. Still one GH job. The
            # `e2e` module runs in its own parallel job (below) — combining it here
            # made this the deploy gate; with a runner freed by merging the mobile
            # jobs there's now a slot to parallelise e2e off the critical path.
            - name: Wait for MongoDB, started in the background above
              run: scripts/ci/in-background.sh wait mongo-start 240

            - run: sbt itAll
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB:      kinowo

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'target/test-reports/it/**/*.xml'
                  check_name: integration tests (${{ matrix.row }})
                  include_passed: false

            # This row's budget figures, for `scripts/adopt-ci-budgets` (see the unit rows).
            - name: Upload the performance budget figures
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: performance-budgets-it-${{ matrix.row }}
                  path: |
                      target/performance-budgets.tsv
                      */target/performance-budgets.tsv
                  if-no-files-found: ignore
                  retention-days: 14
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # DISPATCH ORDER. A free runner takes the waiting jobs in this file's order. The
    # needs-less rows above wait from t=0 and take the slots first; the `needs: scope` rows all turn waiting the
    # moment scope ends, and then go in the order they are written here. So the longest of them come first: the
    # page-test rows (safari ~6 min, chrome / stable ~6.5), then mobile and the e2e shards (3-4.5). Written the
    # other way round, safari queued behind everything and ended last in 174 of 204 Main runs to 2026-10-26.
    # (Matrix rows are created sorted by their values, not in `include:` order.) CiDispatchOrderSpec.
    page-tests-safari:
        name: page tests (safari / ${{ matrix.variant }})
        needs: scope
        if: ${{ !cancelled() && needs.scope.outputs.browsers != 'false' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The ~13 viewport-INDEPENDENT spec files (localStorage, URL
                    # round-trips, filter inclusion-sets, search, keyboard a11y —
                    # tagged `@agnostic`) assert byte-identically on all three
                    # portrait iPhone widths (375/390/440 all sit in one CSS
                    # bucket), so running them per-phone was a 3× re-run. They
                    # ride the single `behaviour` slice below; the phone shards
                    # run only the viewport-SENSITIVE specs (navbar geometry,
                    # landscape, zoomed-gaps).
                    #
                    # WebKit is ~3× slower per test than Chromium, so here the
                    # test run — not the ~100s boot — is the bulk, and this tier
                    # is the tier that gets the runners. All three phones run as
                    # ONE project set sharded FOUR ways rather than per-phone: the
                    # per-phone 2-way shards ranged 306-363s on a single run, and
                    # sharding the combined list evens that out.
                    #
                    # Shard COUNT is not free to pick — Playwright splits by spec
                    # file, and every row pays ~1.5 min of fixed setup before its
                    # first test. Since the `@agnostic` sweeps moved to the
                    # behaviour row, the phone set is small: `--list` sizes
                    # (2026-10-01, runtime skips included — about half run) are
                    # 3 → 144-170, 4 → 109-124, 5 → 82-103, 7 → 56-72. At seven,
                    # each row ran ~45 s of tests behind its ~1.5 min of setup. Four
                    # rows ran 2.2-3.2 min each (2026-10-15), well inside the unit and
                    # integration rows; two carry about twice the tests behind the same
                    # setup, ~3.8 min, still inside them, and give two runners to
                    # splitting those rows (see RUNNER BUDGET at the top). Re-measure
                    # with `--list` before changing this rather than
                    # assuming more shards is faster. Coverage of every width is
                    # unchanged. Firefox stays dropped from CI (the firefox-desktop
                    # project remains in playwright.config.ts for local runs).
                    - { variant: pw phones 1/2, kind: playwright, browsers: webkit, label: webkit-phones-1-2, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 1/2' }
                    - { variant: pw phones 2/2, kind: playwright, browsers: webkit, label: webkit-phones-2-2, runs: 'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max*,webkit-desktop ; ; axe-core|@agnostic ; 2/2' }
                    # The viewport-independent specs once, on the representative
                    # 390px portrait (matches the `iPhone 13` base in webkitUse).
                    #
                    # It ran the desktop-Safari set too, and that made it the long
                    # pole at 296s — 144 WebKit tests on one runner while the shards
                    # carried ~158 each. desktop-Safari is the same ENGINE as the
                    # phones, so it just joins their project set and gets sharded
                    # with them; the largest shard is 184 either way, so those rows
                    # absorb it for free and this one keeps only its 52.
                    #
                    # In two shards since each WebKit row runs one worker (PW_WORKERS in
                    # run-page-test): a contended host gives each job container about one
                    # core, so a second row is a second core for its ~156 tests, where one
                    # row ran 1144s (#1862).
                    - variant: pw behaviour 1/2
                      kind: playwright
                      browsers: webkit
                      label: webkit-behaviour-1-2
                      runs: 'webkit-iphone-13 ; @agnostic ; axe-core ; 1/2'
                    - variant: pw behaviour 2/2
                      kind: playwright
                      browsers: webkit
                      label: webkit-behaviour-2-2
                      runs: 'webkit-iphone-13 ; @agnostic ; axe-core ; 2/2'
        runs-on: ubuntu-26.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: webkit
            - uses: ./.github/actions/run-page-test
              with:
                  kind:          ${{ matrix.kind }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: webkit

    page-tests-chrome:
        name: page tests (chrome / ${{ matrix.variant }})
        needs: scope
        # `stable` is the Scala PageTest row (the review and identity admin pages render identity code): it runs on
        # `pages`; the Playwright rows below it only on `browsers`, their steps skipped otherwise (a job `if:` cannot
        # read the matrix).
        if: ${{ !cancelled() && needs.scope.outputs.pages != 'false' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { variant: stable, kind: chrome, version: stable }

                    # The three Chromium phones run as ONE project set, sharded
                    # two ways, rather than one runner per phone. Three reasons.
                    #
                    # Balance: per-phone rows drifted badly apart (109s vs 207s
                    # for the identical test count on the same run), and the
                    # build waits on the slowest. Playwright shards the combined
                    # list — measured 552/552 at two ways, dead even — so the
                    # rows finish together.
                    #
                    # One row, not the three and then two it once was: since the
                    # `@agnostic` sweeps left the phone rows a two-way row ran
                    # ~2.5-2.7 min in all, most of it the ~1.5 min of setup, and
                    # finished minutes before the unit tests did. One row runs the
                    # whole set behind one setup, still inside the unit rows' time,
                    # and gives its runner to the unit tests' second row.
                    #
                    # And they no longer re-run the `@agnostic` set. Those ~13
                    # viewport-INDEPENDENT spec files were being executed at all
                    # four viewport variants of all three phones — 12× what the
                    # tag says is needed, and 208 of each row's 576 tests. They
                    # ride the single `behaviour` row below now, exactly as the
                    # WebKit phones have always done.
                    #
                    # chromium pixel-9 (360 px) stays out — same width as
                    # galaxy-s10, redundant for catching layout breaks. The
                    # project stays in playwright.config.ts so a local
                    # `npx playwright test --project chromium-pixel-9` still runs.
                    - variant: pw phones
                      kind: playwright
                      browsers: chromium
                      label: chromium-phones
                      runs: 'chromium-galaxy-s10*,chromium-galaxy-s25*,chromium-pixel-9-pro* ; ; axe-core|@agnostic ;'

                    # Two cheap slices sharing one runner: the viewport-independent
                    # specs once on mobile Chromium (touch emulation — `card-tap`
                    # is @agnostic and needs a touch context, so this can't be the
                    # desktop project), and the desktop-Chrome viewport-sensitive
                    # set. Each is ~35s of testing behind a ~100s boot; separately
                    # they burned two runners to save nothing.
                    - variant: pw behaviour + desktop
                      kind: playwright
                      browsers: chromium chrome
                      label: chromium-behaviour-desktop
                      runs: |
                          chromium-galaxy-s10 ; @agnostic ; axe-core ;
                          chrome-desktop ; ; axe-core|@agnostic ;
        runs-on: ubuntu-26.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
              if: matrix.kind == 'chrome' || needs.scope.outputs.browsers != 'false'
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              if: hashFiles('scripts/ci/job_metrics.py') != ''
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: chromium
            - uses: ./.github/actions/run-page-test
              if: matrix.kind == 'chrome' || needs.scope.outputs.browsers != 'false'
              with:
                  kind:          ${{ matrix.kind }}
                  version:       ${{ matrix.version }}
                  browsers:      ${{ matrix.browsers }}
                  label:         ${{ matrix.label }}
                  runs:          ${{ matrix.runs }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() && hashFiles('scripts/ci/job_metrics.py') != '' }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: chromium

    # Mobile LocalServer tests — iOS + Android share ONE FixtureServerMain boot.
    # Boots the fixture Play server (same FixtureServerMain + InMemoryMovieRepository
    # the Playwright suite uses) once, then runs both the iOS `LocalServer*` XCTest
    # cases and the Android `LocalServerApiTest` against it. Both decode the live
    # /{city}/api/repertoire + /api/details (+ /api/cinemas on iOS) JSON through
    # their production models — KinowoCore's `Codable` types with the stores'
    # bare `JSONDecoder()`, Android's KinowoApi + kotlinx models. The
    # cross-cutting gate: a MovieController JSON drift that would break either
    # mobile client fails CI here, on the PR that introduces it.
    #
    # Was two separate jobs, each paying the SAME ~4-min FixtureServerMain boot to
    # run a <20s test. Merged so the boot is shared and one runner slot is freed —
    # keeps CI under the 20-runner cap without a job queueing. One JDK 21 serves
    # everything: the Scala build emits Java 21 (`--release 21`) and runs on 21,
    # Gradle 8.9 / AGP 8.6 run on 21, and Swift needs no JDK. Both junit publishes
    # keep their original `iOS LocalServer` / `Android LocalServer` check-names.
    #
    # Pinned to 24.04, not `ubuntu-latest`: setup-swift@v2 refuses Ubuntu 26.04 (actions/runner-images#14748).
    # Swift 6.2 is the newest setup-swift@v2 knows (ios/Package.swift is tools 6.0, Swift 6 mode); keep it
    # in step with ios.yml's `swift:6.2` container. Locked by ActionPinningSpec.
    mobile-local-server:
        needs: scope
        # The public pages, booted from the read-model snapshot: inert for identity's code (ci-row-scope.sh browsers).
        if: ${{ !cancelled() && needs.scope.outputs.browsers != 'false' }}
        runs-on: ubuntu-22.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}

            - uses: ./.github/actions/setup-sbt-build
              with:
                  java-version: 21
                  # JDK-21 zinc cache, kept on its own key so cross-JDK class
                  # artifacts don't mix with the other jobs' cache. Boots
                  # web/PageTest FixtureServerMain → page scope (every module's
                  # main + test + the web page sources).
                  target-cache-key: sbt-target-android-ls-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-android-ls-${{ runner.os }}-

            # Kick the fixture-server compile off HERE, in the background, and
            # collect it below — the Swift toolchain, the Android SDK and Gradle
            # setups that follow are ~50s of download that has no reason to wait
            # behind ~100s of sbt. The exit status is parked in a file so the
            # collect step can still fail the job on a compile error, and the
            # log is replayed there rather than interleaved with three actions'
            # output.
            - name: Start compiling the fixture server
              run: |
                  nohup bash -c 'sbt web/PageTest/compile > /tmp/compile.log 2>&1; echo $? > /tmp/compile.status' &

            # The exact version, so setup-swift finds it
            # instead of a 47 s download; '6.2' resolved to this already.
            - uses: swift-actions/setup-swift@v2
              with:
                  swift-version: '6.2.1'

            - uses: actions/cache@v5
              with:
                  path: ios/.build
                  key: spm-build-${{ runner.os }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
                  restore-keys: |
                      spm-build-${{ runner.os }}-

            # `packages: platform-tools` instead of the action's default
            # `tools platform-tools`: the deprecated `tools` meta-package drags
            # in the Android Emulator, which this JVM-only `testDebugUnitTest` +
            # swift LocalServer job never uses and whose download flakily corrupts
            # ("Error on ZipFile unknown archive"), failing the whole job before a
            # single test runs. AGP auto-fetches platform-34 / build-tools.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  add-job-summary: always

            # Collect the background compile started above. Build BEFORE booting,
            # as its own step, so the boot's ceiling only has to cover booting.
            #
            # The two were one step, and the 300s below had to stretch over both. That
            # holds until the caches go cold together — a Renovate dependency bump
            # invalidates coursier while a source change invalidates sbt-target — and
            # then the runner spends the entire window fetching the sbt launcher and
            # compiling, reaching only "set current project to movies" by the time it is
            # killed. It reported as `FixtureServerMain never wrote a port file`, which
            # points at the server rather than at the build that never finished making
            # it. Split, a slow build is just a slow build, a compile error says so, and
            # the ceiling below measures the one thing it names. Backgrounding the
            # compile keeps that split — this step still names, times and fails on
            # exactly the compile — while letting the toolchain downloads overlap it.
            - name: Wait for the fixture-server compile
              run: |
                  set -uo pipefail
                  # 900s: the compile is normally ~100s warm, but a cold coursier +
                  # cold zinc cache together is minutes. Same generosity the boot
                  # ceiling below has, and for the same reason.
                  for _ in $(seq 1 450); do
                      [ -f /tmp/compile.status ] && break
                      sleep 2
                  done
                  cat /tmp/compile.log 2>/dev/null || true
                  if [ ! -f /tmp/compile.status ]; then
                      echo "::error::web/PageTest/compile did not finish within 900s"
                      exit 1
                  fi
                  exit "$(cat /tmp/compile.status)"

            # Through `.github/scripts/fixture-server.sh`, which relaunches a server
            # that exits before writing its port (a boot-jar fetch timeout took a
            # page-test shard down this way on 2026-09-06) — see its header.
            - name: Boot FixtureServerMain
              env:
                  # 300s ceiling over ~110s of CPU-bound bootStartup (the whole
                  # ~1000-film fixture corpus through scrape→enrich→fold against
                  # in-memory fixtures — processing cost, not retries) plus sbt's own
                  # startup. The compile is no longer inside this window.
                  FIXTURE_BOOT_CEILING_SECONDS: 300
              run: |
                  set -euo pipefail
                  .github/scripts/fixture-server.sh launch /tmp/fixture-server sbt "web/PageTest/runMain tools.FixtureServerMain /tmp/fixture-server/port"
                  .github/scripts/fixture-server.sh await /tmp/fixture-server
                  echo "KINOWO_LOCAL_URL=http://127.0.0.1:$(cat /tmp/fixture-server/port)" >> "$GITHUB_ENV"

            # Both suites run against the one server; `set +e` + a combined exit
            # status so an iOS failure still lets the Android suite run (and vice
            # versa) — the always() publishes below then surface both. `--no-daemon`
            # so Gradle inherits KINOWO_LOCAL_URL for the forked test JVM.
            - name: Run LocalServer mobile tests (iOS + Android)
              run: |
                  set +e
                  swift test --package-path ios --filter LocalServer --xunit-output ios-localserver.xml
                  ios=$?
                  ( cd android && ./gradlew --no-daemon testDebugUnitTest --tests 'pl.kinowo.localserver.*' )
                  android=$?
                  echo "iOS exit=$ios  Android exit=$android"
                  [ $ios -eq 0 ] && [ $android -eq 0 ]

            - name: Publish iOS test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  # SwiftPM writes `<base>.xml` (XCTest) and
                  # `<base>-swift-testing.xml` (swift-testing); glob both.
                  report_paths: 'ios-localserver*.xml'
                  check_name: iOS LocalServer
                  include_passed: false

            - name: Publish Android test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'android/app/build/test-results/testDebugUnitTest/*.xml'
                  check_name: Android LocalServer
                  include_passed: false

            - name: Stop FixtureServerMain
              if: always()
              run: .github/scripts/fixture-server.sh stop /tmp/fixture-server

            - name: Upload fixture-server log on failure
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: fixture-server-log-mobile
                  path: /tmp/fixture-server/log
                  if-no-files-found: ignore
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # The `e2e` module (cross-app whole-corpus specs), FANNED OUT across two
    # parallel shards (see the e2eCorpus/e2eRest aliases in build.sbt):
    #
    #   corpus   — FilmScheduleEndToEndSpec (run by name), which boots the whole fixture
    #              corpus through the identity projection; this row also stages the dists
    #              Main's image build reads;
    #   rest     — every OTHER e2e spec, via `e2e/Test/test -- -l …CorpusReplay`
    #              (tag-EXCLUSION of the @CorpusReplay spec), so a newly-added spec
    #              auto-rides this shard and can't be silently dropped. See the
    #              `@CorpusReplay` tag annotation in CorpusReplay.java.
    #
    # Uses FixtureTestWiring (no Mongo); reports go to the root unit/ dir
    # (unitReportSettings) → a per-shard `e2e tests (<shard>)` check.
    e2e:
        name: e2e (${{ matrix.shard }})
        needs: scope
        if: ${{ !cancelled() && needs.scope.outputs.e2e != 'false' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: corpus,   cmd: e2eCorpus }
                    - { shard: rest,     cmd: e2eRest }
        runs-on: ubuntu-26.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        permissions:
            contents: read
            checks: write
            # The corpus row builds and pushes the web image (SHA tag only) with the built-in GITHUB_TOKEN.
            packages: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}

            # Keyed by the one script a convergence leg also keys with: the legs restore THIS entry first, the
            # commit's whole e2e/Test compile, Main dispatching them only once `ci` is done
            # (scripts/ci/sbt-sources-key.sh, SbtCachePathsSpec).
            - name: Key the sbt build cache
              id: sbt-key
              run: echo "e2e=$(scripts/ci/sbt-sources-key.sh e2e)" >> "$GITHUB_OUTPUT"

            - uses: ./.github/actions/setup-sbt-build
              with:
                  # Dedicated key so these shards PERSIST the e2e/Test compile
                  # (the shared `sbt-target-` key is owned by `test`, which never
                  # compiles e2e — so on that key e2e recompiled cold every run,
                  # ~100s). All three shards share this one key: only the first to
                  # finish writes it; the rest read it warm. restore-keys falls
                  # back to the shared cache on a miss so web+worker main still
                  # come in warm on the first run.
                  target-cache-key: sbt-target-e2e-${{ runner.os }}-${{ steps.sbt-key.outputs.e2e }}
                  target-cache-restore-keys: |
                      sbt-target-e2e-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-
                  # Only these shards write the family, from a key over every source they compile.
                  target-cache-exact-hit-is-current: 'true'

            # Prove BOTH apps' universal-stage distributions still link — on the
            # STAGING row only, the lightest e2e shard, which compiles the apps
            # anyway — before its e2e run, so the web image builds beside that run. (This used to close the `test` job, Main's longest ci row,
            # whose tail it lengthened by ~1 min of staging + uploads + lint.) On a
            # push to main the web dist then becomes its image right here, and the
            # worker's is handed to main.yml's `image-worker` (the upload below), which
            # would otherwise restage it from a cold compile
            # on the post-CI critical path. On a PR run (branch-ci.yml never
            # reaches main.yml) this staging is the only place a dist that stopped
            # linking, or a reappearing Scaladoc tree, is caught at all.
            - if: matrix.shard == 'corpus'
              run: sbt "web/stage" "worker/stage"

            # Guards build.sbt's `noApiDocs`. Play's dist and native-packager
            # both ship a `share/doc/api` tree by default, which put dotty's
            # scaladoc on the deploy critical path — it NPE'd here on JDK 25
            # and failed a deploy whose only diff was a workflow file. Nothing
            # reads these docs, so their reappearance is a regression: fail
            # loudly rather than let an unread artefact break deploys again.
            - name: Deploy artefacts carry no generated Scaladoc
              if: matrix.shard == 'corpus'
              run: |
                  found=$(find web/target/universal/stage worker/target/universal/stage \
                              -type d -name doc -print -quit)
                  if [ -n "$found" ]; then
                      echo "::error::staged dist ships generated Scaladoc at $found — see noApiDocs in build.sbt"
                      exit 1
                  fi

            # THE WEB IMAGE, BUILT HERE, from the dist this row just staged — pushed under this commit's SHA tag
            # ONLY. Nothing deploys a SHA tag; main.yml's `publish-web` gives these bytes the tags that ship
            # (`main-<utc>-<sha7>`, `latest`) only once ci is green and the tier's paths changed
            # (DeployImageReuseSpec). It was a job of its own, `image-web`, which `needs: e2e` held until the
            # `rest` row finished too and then queued for a runner: it ended at 5.5 min on run 38810289586, after
            # every ci row. Here it costs this row ~1 min and no runner. Never on a PR run.
            # `!github.event.pull_request`, not `github.event_name != 'pull_request'`: this is a reusable
            # workflow. The caller's event
            # payload carries `pull_request` on a PR run.
            - name: Lay the staged web dist where the Dockerfile's whitelisted context sees it
              if: matrix.shard == 'corpus' && !github.event.pull_request
              # `stage/`, the only path .dockerignore lets through.
              run: cp -R web/target/universal/stage stage

            - if: matrix.shard == 'corpus' && !github.event.pull_request # shadow builds without pushing (build-image.sh)
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY_HOST }}
                  username: ${{ env.REGISTRY_USER }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}

            # BuildKit from Docker Hub's mirror, Docker Hub only when the mirror fails (CiImageMirrorSpec).
            - if: matrix.shard == 'corpus' && !github.event.pull_request
              uses: ./.github/actions/setup-buildx

            # IN THE BACKGROUND, beside the e2e run below, which shares nothing with it (2026-10-23: the build and push
            # were ~62 s after that run, on this row's end). The same build as main.yml's worker image (build-image.sh, on
            # the builder setup-buildx made the default) -- and its verdict is collected after the run ("The web image was
            # built and pushed"), failing the row as the step did.
            - name: Build and push the web image under this commit's SHA tag only
              if: matrix.shard == 'corpus' && !github.event.pull_request
              # amd64 only, the inline cache of `latest`, Docker Hub's bases when the mirror loses a blob: build-image.sh.
              run: |
                  scripts/ci/in-background.sh start web-image \
                      scripts/ci/build-image.sh web ${{ env.IMAGE_REPO }}/movies-web ${{ github.sha }}


            - run: sbt ${{ matrix.cmd }}
              env:
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}

            # FilmScheduleEndToEndSpec's expected-schedules.txt / read-model-snapshot.json,
            # held the same way as the unit run's snapshots (scripts/ci/tree-unchanged.sh).
            - name: The e2e run left every checked-in file unchanged
              run: scripts/ci/tree-unchanged.sh "sbt ${{ matrix.cmd }}"

            - name: Publish e2e test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: e2e tests (${{ matrix.shard }})
                  include_passed: false

            # The stored log loses its last seconds (Main #2647: every rest row's ended ~5 s before sbt did), and the
            # annotations above with it: a spec failing late, and sbt's summary, never show. The reports still name it.
            - name: Upload the e2e test reports on failure
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: e2e-test-reports-${{ matrix.shard }}
                  path: target/test-reports/unit/
                  if-no-files-found: ignore

            # This row's budget figures, for `scripts/adopt-ci-budgets` (see the unit rows).
            - name: Upload the performance budget figures
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: performance-budgets-e2e-${{ matrix.shard }}
                  path: |
                      target/performance-budgets.tsv
                      */target/performance-budgets.tsv
                  if-no-files-found: ignore
                  retention-days: 14

            # The web image's build and push, started before the e2e run (above): its log, and its exit as the row's.
            - name: The web image was built and pushed
              if: ${{ !cancelled() && matrix.shard == 'corpus' && !github.event.pull_request }}
              run: scripts/ci/in-background.sh wait web-image 900

            - name: Hand the staged worker dist to main.yml's image build
              # Not on a PR run (branch-ci.yml's only trigger), which nothing downloads from;
              # every main.yml run — push or workflow_dispatch — needs it. Uncompressed — the dist is
              # jars, already zipped, so compressing again only costs upload time — and
              # kept one day, since its one consumer runs minutes after this job.
              if: matrix.shard == 'corpus' && !github.event.pull_request
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: stage-worker
                  path: worker/target/universal/stage
                  compression-level: 0
                  retention-days: 1
                  if-no-files-found: error

            # ESLint over the production JS in `public/js/`, on the corpus row for
            # the same reason as the staging above (it was a standalone `lint` job
            # once; folding it into a shard keeps CI inside the runner budget). Runs
            # LAST: the e2e check is published above with `always()`, so a lint
            # failure never hides it, and the stage artifacts upload first. Cross-file
            # globals (constants from `_sharedJsConfig`, functions called from
            # inline `<script>` blocks) are listed in `eslint.config.js` so
            # `no-undef` stays meaningful.
            - uses: actions/setup-node@v5
              if: matrix.shard == 'corpus'
              with:
                  node-version: '22'
                  cache: 'npm'
            - if: matrix.shard == 'corpus'
              run: npm ci
            - if: matrix.shard == 'corpus'
              run: npm run lint
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # Cross-browser page tests, split into one matrix job per engine
    # family so the CI checks list groups red rows by browser. Every
    # row delegates to the shared `run-page-test` composite action —
    # see `.github/actions/run-page-test/action.yml` for the step
    # body that's identical across all four jobs.
    #
    # `kind` (chrome | playwright) drives which steps execute:
    #
    # - `chrome`: install Chrome via browser-actions/setup-chrome,
    #   then `sbt PageTest/test` with `CDP_BROWSER_BIN` pointing at it.
    #
    # - `playwright`: install Node + the one engine binary specified
    #   by `browser`, boot `FixtureServerMain` over a free port, then
    #   `npx playwright test --project <project>`. The Playwright
    #   suite drives `page-tests-playwright/` against a Twirl-rendered
    #   fixture server (InMemoryMovieRepository + FakeHttpFetch — same
    #   wiring the Scala spec uses, exposed over HTTP). Mobile
    #   projects are split per-phone so each runner handles one
    #   phone's four variants (portrait, zoomed, landscape,
    #   zoomed-landscape) — ~4 projects × 20 specs ≈ under 2 min.
    #
    # Chrome version pick reflects real Android phone distribution as
    # of early 2026 (120+ ≈ 85% of devices, 113–120 the long tail);
    # 113 is the floor that chrome-for-testing publishes. `stable`
    # tracks whatever Google ships next. Specific versions catch
    # regressions like the touchstart-vs-click timing change that
    # bit the card-tap fix — see [[feedback-ci-chrome-version-drift]].
    #
    # axe-core gates itself to `chromium-desktop` (see
    # `tests/a11y.spec.ts` — `test.beforeEach` skips on every other
    # project), so only that row pays the audit cost. It's
    # `continue-on-error` because the site has known WCAG violations
    # (`color-contrast` on `.text-secondary` against the dark body
    # bg) that aren't worth blocking deploys over.

    # THE DRIFT GATE'S COMMIT RULES, UNSKIPPABLE (scripts/ci/commit-rules-ci.sh): the allow-list ratchet, the shrink-only
    # known-flips baseline and the design-trailer rule (scripts/ci/commit_rules.py) over every commit since they last held
    # on main (refs/verified/commit-rules, which a run on main advances), whatever it touched. The pre-push hook runs them too, but `--no-verify` skips the hook. After
    # `scope`, so it takes no runner at t=0 (CiRunnerBudgetSpec), and last, the shortest of the rows that wait on it
    # (CiDispatchOrderSpec); like every job here it gates the deploy.
    commit-rules:
        name: commit rules
        needs: scope
        if: ${{ !cancelled() }}
        runs-on: ubuntu-26.04
        timeout-minutes: 40 # longest green row 31 min (CiRowTimeoutSpec)
        permissions:
            # write: a run on main advances refs/verified/commit-rules when the rules hold
            contents: write
            actions: read
        steps:
            # the whole history (the range, and the lists' earlier revisions the ratchet reads), no blob it does not read
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
                  sparse-checkout: |
                      .github
                      scripts
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Every commit since the rules last held on main keeps the drift gate's commit rules
              env:
                  BEFORE: ${{ github.event.before }}
              run: scripts/ci/commit-rules-ci.sh
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
