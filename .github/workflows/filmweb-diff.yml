name: Filmweb diff

# Weekly diagnostic: compare EVERY upcoming showtime our scrapers publish against
# every one Filmweb publishes (no window end — Filmweb's undated seances feed is a
# venue's whole programme), per cinema, and publish the text report + CSV summary
# as a dated artifact for trend-watching. This is observability, NOT a gate — it never deploys and its
# per-cinema network errors don't fail the job (the tool Try-wraps every fetch
# and always exits 0).
on:
    # Mondays 01:00 UTC = 02:00 Europe/Warsaw in winter (CET, UTC+1); 03:00 in
    # summer (CEST, UTC+2). Cron is UTC-only and has no DST awareness, so the
    # local wall-clock time drifts by an hour across the DST boundary — fine for
    # a once-a-week diagnostic.
    schedule:
        - cron: '0 1 * * 1'
    # Manual trigger for an on-demand run.
    workflow_dispatch:

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    filmweb-diff:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        steps:
            - uses: actions/checkout@v5

            # Mirror the repo's Scala CI toolchain (see ci.yml): Temurin JDK 27
            # with sbt dependency caching.
            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              with:
                  sbt-runner-version: 2.0.10 # the job image's (SetupSbtRunnerPinSpec)
                  disk-cache: 'false'
            # Every sbt of this job through the stale-TASTy guard (scripts/ci/sbt-guard/sbt, OneSbtPathSpec).
            - name: Route sbt through the stale-TASTy guard
              shell: bash
              run: echo "$GITHUB_WORKSPACE/scripts/ci/sbt-guard" >> "$GITHUB_PATH"

            - name: Date stamp
              id: stamp
              run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

            # Compare everything either side publishes (`all`). Multikino / biletyna / ck105 refuse a datacenter
            # runner, so — as in the worker — they go through the Decodo residential
            # proxy first, direct behind it (no Zyte key: PaidEgressWorkflowSpec).
            # `continue-on-error` is a belt-and-braces guard on top of
            # the tool's own always-exit-0 behaviour, so a transient network wobble
            # still lets the artifact upload below run.
            - name: Run FilmwebDiff
              continue-on-error: true
              run: sbt "worker/runMain tools.FilmwebDiff all filmweb-diff.txt filmweb-diff.csv filmweb-diff.json"
              env:
                  DECODO_PROXY_USER: ${{ secrets.DECODO_PROXY_USER }}
                  DECODO_PROXY_PASS: ${{ secrets.DECODO_PROXY_PASS }}

            # Upload the human-readable report, the CSV summary, AND the
            # deterministic JSON (per-film discrepancies; diffs cleanly across
            # days) under a date-stamped name. 90 days is GitHub's artifact-
            # retention ceiling; for history beyond that a file would need
            # committing to the repo (out of scope unless asked).
            - name: Upload diff artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: filmweb-diff-${{ steps.stamp.outputs.date }}
                  path: |
                      filmweb-diff.txt
                      filmweb-diff.csv
                      filmweb-diff.json
                  retention-days: 90
                  if-no-files-found: warn

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [filmweb-diff]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
