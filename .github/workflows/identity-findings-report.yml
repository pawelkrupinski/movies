#
# THE IDENTITY FINDINGS REPORT: the newest recording's whole-corpus findings, triaged from one GitHub issue
# per country ("Identity findings: <cc>") rather than failing builds.
#
# WHY A WORKFLOW OF ITS OWN. On 10-13/14 the convergence legs began failing on whole-corpus findings -- a
# suspect take no label judges (SuspectTakesAudit), a screening marker left in a query (SearchQueryMarkersSpec),
# a slot field read off the wrong node (CinemaSlotInvariantsSpec). Those judge the recording as much as the
# code: a listing that first appeared in last night's recording turned every push red, and the red-build gate
# (scripts/hooks/pre-push) held unrelated pushes behind it. Now the BLOCKING gates judge only what a commit's
# code changed -- the identity takes check resolves one recording at the base and the head
# (scripts/ci/identity_takes_diff.py, corpus_shape_diff.py) -- and the recording's own findings come here.
#
# IT RE-RUNS NOTHING. Each `Record scrape fixtures` run's convergence rows already audit the newest recording
# whole -- the suite's suspect audit, and the corpus-shape specs ahead of it -- and leave the findings in their
# `convergence-diagnostics-<cc>-convergence` artifact (reported there, never failing the recording). This reads
# those: one runner for about a minute a day, where re-deriving them would cost a convergence boot per country.
#
# Runs when a recording completes, as a daily backstop, and by hand (`run-id`: any recording's run). A recording that
# FAILED, or ran off main, is passed over for the newest successful recording on main, through the one resolver for
# upstream runs (.github/actions/upstream-run, with no age limit): run 3139 went red with "run 3136 left no country's findings"
# after recording 3136 failed before a convergence row wrote any -- a red for lack of input, not for a finding. Each
# country's issue is updated in place with the findings and their triage commands, closed when empty, reopened
# when one comes back. A finding untriaged for MORE THAN 3 DAYS is OVERDUE: marked in its country's issue, which
# is assigned to the owner, and (on the daily backstop) the `report` job's issue -- never a red run. CI red means
# only a regression (the owner, 2026-10-27): the 3-day red kept this report red for days, and that noise is why
# its red got ignored. Red now means the report could not be made.
#
name: Identity findings report

on:
    workflow_run:
        workflows: [Record scrape fixtures]
        types: [completed]
    # A backstop after the nightly recording (23:31 UTC) and its longest row (the United States', up to 6 h):
    # the age limit is judged daily even if a recording's completion event never arrived.
    schedule:
        - cron: '41 7 * * *'
    workflow_dispatch:
        inputs:
            run-id:
                description: The Record scrape fixtures run whose findings to report (default the newest completed one on main).
                required: false
                type: string
                default: ''

concurrency:
    group: identity-findings-report
    cancel-in-progress: false

permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    # THE PLAN: which recording to report (.github/actions/upstream-run, UpstreamRunSpec). One that failed or ran off main
    # -- a branch recording pins nothing anyone replays -- or none named (the backstop): the newest successful one on
    # main, whatever its age, since its findings are still the newest there are to triage. Red only when there is none.
    plan:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            run: ${{ steps.upstream.outputs.run }}
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      .github/actions/upstream-run
                      scripts
            - id: upstream
              uses: ./.github/actions/upstream-run
              with:
                  workflow: Record scrape fixtures
                  run-id: ${{ inputs.run-id }}
                  max-age-hours: '0'

    findings:
        needs: [ plan ]
        outputs:
            overdue: ${{ steps.report.outputs.overdue }}
            alert: ${{ steps.report.outputs.alert }}
            found: ${{ steps.report.outputs.found }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
            issues: write
        steps:
            # The judgements are read from the commit, not checked out: a sparse checkout names directories only
            # (WorkflowScriptsRunnableSpec), and theirs, test/resources/fixtures, is a gigabyte of recorded fixtures.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
            - name: Report each country's findings
              id: report
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RECORDING: ${{ needs.plan.outputs.run }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  git show HEAD:test/resources/fixtures/identity-judgements.tsv > "$RUNNER_TEMP/identity-judgements.tsv"
                  # exit 2 -- no recording to report, or an issue gh could not read or write -- is an ALERT
                  # (scripts/ci/alert-step.sh): the recording's failure or the forge's, never a red run of this report
                  scripts/ci/alert-step.sh 2 -- python3 scripts/ci/identity_findings_report.py --run "$RECORDING" --assignee "$OWNER" --judgements "$RUNNER_TEMP/identity-judgements.tsv" --work "$RUNNER_TEMP/identity-findings"

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec). Beside the per-country issues, which
    # carry the findings themselves: this one says findings are overdue, or the report itself could not run.
    report:
        name: report (scheduled run)
        needs: [ plan, findings ]
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
                  overdue: ${{ needs.findings.outputs.overdue }}
                  alert: ${{ needs.findings.outputs.alert }}
                  found: ${{ needs.findings.outputs.found }}
