name: Identity capture

# Weekly RECAPTURE of the unmatched-cluster fixture (test/resources/fixtures/identity-unmatched/<cc>.json.gz)
# that the ratchet (UnmatchedClustersRatchetSpec), the decoration discovery and the identity refit all
# replay — published for hand review as ONE bot branch, chore/identity-capture.
#
# Each country runs the same one command a laptop runs (scripts/identity-capture.sh, docs/design/
# identity-resolver.md §20.14 item 5) on a runner of its own: the newest successful "Record scrape
# fixtures" run's corpus and the enrichment tree recorded with it, prod's identity_family_answers
# exported READ-ONLY over the CI tunnel (the forced-command `kinowo-ci-corpus` route the recording
# reads its corpus through), then the capture — or, when <cc>.inputs says the fixture's decisions are
# current, only a fill. One runner per country rather than `--parallel 2` on one: a runner holds one
# 11 GB heap beside its Mongo, not two, and runners on separate addresses spread the live reads too.
# The publish job puts the countries' fixtures back together, runs the ratchet over them, commits the
# result with the candidate expected-matches.tsv the ratchet re-baselined, and pushes it as a fresh
# chore/identity-capture branch off main -- a BRANCH, not a PR. What the ratchet says (the takes to
# judge into identity-judgements.tsv, any WRONG or lost take) goes to the run's summary and its `identity-ratchet`
# artifact (scripts/identity-ratchet-report <run id>). A country that failed keeps its old fixture and
# says so.
#
# A PR is a request for a build, so it is opened only when there is one worth running: when the
# ratchet over the recapture is GREEN (every WRONG take known-wrong in scope capture, none UNJUDGED, none
# LOST). A recapture almost always makes new takes, whose Branch CI would only be red on the ratchet
# until someone judged them -- ten such PRs in two days (#223-#232), each closed by the next run. So
# judging happens on the branch (commit identity-judgements.tsv there), and then
#     gh workflow run identity-capture.yml -f open-pr=true
# skips the capture, re-runs the ratchet on the judged branch, commits any re-baselined
# expected-matches.tsv onto it, and opens the PR only if the ratchet is green.
#
# Monday 07:00 UTC: after the Sunday-night recording (23:31 UTC; its longest leg is capped at six
# hours, so it is done by ~05:30) and clear of Monday's 05:00 roster audit and 06:00 cinema
# discovery, so the branch has Monday to Wednesday for judging before Thursday's 05:00 identity refit
# re-tunes on the fixture.
#
# Secrets (all existing repo secrets): MONGO_CI_SSH_KEY + MONGO_CI_SSH_HOST_KEY (the tunnel, as
# record-scrape-fixtures.yml), TMDB_API_KEY (the live gaps), SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY
# (the "Kinowo Sync Bot" App, as decoration-discovery.yml: it pushes the branch, and opens the PR so
# Branch CI runs on it). This bot's PR is the third of three sanctioned exceptions to "no PRs" (with
# decoration-discovery.yml and identity-refit.yml): land it by fast-forwarding main after review.

on:
    workflow_dispatch:
        inputs:
            open-pr:
                description: 'Skip the capture: re-run the ratchet on the judged chore/identity-capture branch and open its PR if green'
                type: boolean
                default: false

    # Monday 07:00 UTC — see above.
    schedule:
        - cron: '0 7 * * 1'

concurrency:
    group: identity-capture
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # Seconds, first: every secret the jobs below read is set. (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Secrets present
              env:
                  MONGO_CI_SSH_KEY: ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
                  SYNC_PR_APP_ID: ${{ secrets.SYNC_PR_APP_ID }}
                  SYNC_PR_APP_PRIVATE_KEY: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}
              run: scripts/ci/preflight.sh MONGO_CI_SSH_KEY MONGO_CI_SSH_HOST_KEY TMDB_API_KEY SYNC_PR_APP_ID SYNC_PR_APP_PRIVATE_KEY

    capture:
        name: capture (${{ matrix.code }})
        needs: preflight
        if: ${{ !inputs.open-pr }}
        runs-on: ubuntu-24.04 # mongod 8.3 will not start on 26.04's kernel 7.0 (MongoServerVersionParitySpec)
        timeout-minutes: 300
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                # Largest first (scripts.IdentityCapture.Countries): queued in this order when runners are short.
                code: [us, de, uk, pl, es]
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup-sbt-build

            - name: Start MongoDB (single-node replica set, the capture's throwaway pipeline database)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            # The CI end of the read-only route to prod Mongo; it exports KINOWO_CONVERGENCE_SCRAPES_URI.
            - name: Tunnel to prod Mongo
              timeout-minutes: 5
              run: scripts/ci/wait-for-mongo-tunnel.sh 27018
              env:
                  MONGO_CI_SSH_KEY: ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}

            - name: Capture ${{ matrix.code }}
              timeout-minutes: 280
              env:
                  CC: ${{ matrix.code }}
                  GH_TOKEN: ${{ github.token }}
                  KINOWO_IDENTITY_LIVE_GAPS_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
              run: |
                  set -o pipefail
                  export KINOWO_IDENTITY_FAMILY_URI="$KINOWO_CONVERGENCE_SCRAPES_URI"
                  scripts/identity-capture.sh --parallel 1 --heap 11g "$CC" 2>&1 | tee "identity-capture-$CC.txt"

            - name: Close the tunnel to prod Mongo
              if: always()
              run: scripts/ci/close-mongo-tunnel.sh 27018

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: identity-capture-${{ matrix.code }}
                  path: |
                      test/resources/fixtures/identity-unmatched/${{ matrix.code }}.json.gz
                      test/resources/fixtures/identity-unmatched/${{ matrix.code }}.inputs
                      identity-capture-${{ matrix.code }}.txt
                      target/identity-capture/logs/
                  retention-days: 14

    # ONE branch for the run: every country's refreshed fixture, and what the ratchet makes of them --
    # and its PR only when the ratchet is green. With `open-pr`, the same job over the judged branch.
    publish:
        needs: [preflight, capture]
        if: always() && !cancelled() && needs.preflight.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        env:
            BRANCH: chore/identity-capture
            OPEN_PR: ${{ inputs.open-pr && 'true' || 'false' }}
        steps:
            # The App's token pushes the branch (checkout keeps it as the push credential) and opens
            # the PR, so Branch CI runs on it.
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            # A recapture: main's tip, not the triggering commit -- a long run can see main gain a
            # workflow change, and a branch built on the older commit would revert it (refused for
            # the App; see BotPullRequestBranchSpec). `open-pr`: the judged branch itself.
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.open-pr && 'chore/identity-capture' || 'main' }}
                  token: ${{ steps.app-token.outputs.token }}

            - uses: actions/download-artifact@v6
              if: ${{ !inputs.open-pr }}
              with:
                  pattern: identity-capture-*
                  path: captures

            - name: Put the countries' fixtures back
              if: ${{ !inputs.open-pr }}
              run: |
                  set -euo pipefail
                  for dir in captures/identity-capture-*; do
                      cc=${dir##*-}
                      if [ -f "$dir/test/resources/fixtures/identity-unmatched/$cc.json.gz" ]; then
                          cp "$dir/test/resources/fixtures/identity-unmatched/$cc".* test/resources/fixtures/identity-unmatched/
                      fi
                  done
                  git status --short -- test/resources/fixtures/identity-unmatched/

            - uses: ./.github/actions/setup-sbt-build

            # The ratchet is the review list and the PR's gate, not the job's: a recapture is EXPECTED
            # to make takes no label judges yet, so red only means "judge on the branch first". Green
            # (no WRONG take but those known-wrong in scope capture, none UNJUDGED, none LOST) means land-ready.
            # The candidate expected-matches.tsv it writes replaces the checked-in one either way.
            - name: Run the ratchet over the recapture
              id: ratchet
              run: |
                  set -o pipefail
                  # Red means the ratchet RAN and found takes to judge. A build that never reached it (a compile
                  # error, a crash) writes no findings -- and must fail the job, not ask for judgements. The
                  # restored target cache may hold an older run's findings: they go first.
                  rm -f target/identity-unmatched/ratchet-takes.tsv
                  if sbt "worker/testOnly services.identity.UnmatchedClustersRatchetSpec" 2>&1 | tee ratchet.log; then
                      echo "green=true" >> "$GITHUB_OUTPUT"
                  elif [ -f target/identity-unmatched/ratchet-takes.tsv ]; then
                      echo "green=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "::error::the ratchet did not run: sbt failed before it wrote its findings (see the log above)"
                      exit 1
                  fi
                  if [ -f target/identity-unmatched/expected-matches.tsv ]; then
                      cp target/identity-unmatched/expected-matches.tsv test/resources/fixtures/identity-unmatched/expected-matches.tsv
                  fi

            # Every take's finding (WRONG / UNJUDGED / MOVED / LOST / NEW / RIGHT) with its decision's explanation, as
            # TSV: what scripts/identity-ratchet-report and scripts/identity-judge-cards read, instead of the log.
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: identity-ratchet
                  path: target/identity-unmatched/ratchet-takes.tsv
                  if-no-files-found: warn
                  retention-days: 30

            - name: Write the report
              env:
                  GREEN: ${{ steps.ratchet.outputs.green }}
              run: |
                  set -euo pipefail
                  scripts/ci/identity-capture-report.sh captures target/identity-unmatched/ratchet-takes.tsv ratchet.log \
                      > identity-capture-report.md
                  cat identity-capture-report.md >> "$GITHUB_STEP_SUMMARY"

            - name: Check for a refreshed fixture
              id: changed
              run: |
                  if git diff --quiet -- test/resources/fixtures/identity-unmatched/ && [ -z "$(git ls-files --others -- test/resources/fixtures/identity-unmatched/)" ]; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit the recapture
              if: steps.changed.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- test/resources/fixtures/identity-unmatched/
                  if [ "$OPEN_PR" = true ]; then
                      git commit -q -m 'Re-baseline expected-matches.tsv over the judged recapture'
                  else
                      git commit -q -m 'Recapture the unmatched-cluster fixture from the newest recording, for the labels and expected matches to be judged'
                  fi

            # A fresh branch off main every recapture, never a rewrite of a stale one -- see
            # .github/actions/drop-bot-branch (it also closes an open PR on it). Never on `open-pr`:
            # the branch then holds the judging.
            - name: Drop the old branch
              if: ${{ !inputs.open-pr && steps.changed.outputs.changed == 'true' }}
              uses: ./.github/actions/drop-bot-branch
              with:
                  branch: chore/identity-capture
                  token: ${{ steps.app-token.outputs.token }}

            # A recapture creates the branch afresh; `open-pr` fast-forwards it by the re-baseline.
            - name: Publish the chore/identity-capture branch
              if: steps.changed.outputs.changed == 'true'
              run: git push origin "HEAD:refs/heads/$BRANCH"

            - name: Open the PR when the ratchet is green
              if: steps.ratchet.outputs.green == 'true' && (inputs.open-pr || steps.changed.outputs.changed == 'true')
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
                      gh pr edit "$BRANCH" --body-file identity-capture-report.md
                  else
                      gh pr create --base main --head "$BRANCH" \
                          --title 'Identity capture: refreshed unmatched-cluster fixture' \
                          --body-file identity-capture-report.md
                  fi

            - name: Say why there is no PR
              if: steps.ratchet.outputs.green != 'true'
              run: echo "::notice::The ratchet over $BRANCH is red, so no PR -- judge on the branch, then dispatch with open-pr. Findings - scripts/identity-ratchet-report ${GITHUB_RUN_ID}"

    # EVERY JOB'S AND STEP'S TIME, in this run's log and summary and on Grafana's CI dashboards
    # (.github/actions/report-timings). After every other job but the failure report; never fails the run.
    timings:
        needs: [preflight, capture, publish]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/report-timings
                  sparse-checkout-cone-mode: false
            - uses: ./.github/actions/report-timings
              with:
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        needs: [preflight, capture, publish, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
