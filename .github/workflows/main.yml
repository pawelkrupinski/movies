name: Main

on:
    push:
        branches: [main]
    # No inputs: CI deploys nothing itself (Flux ships the GHCR images), so there
    # is nothing here to force.
    workflow_dispatch:

# ONE RUNNING, ONE PENDING; NEVER CANCELLED (2026-10-22). A push's run finishes and publishes; a newer
# push queues behind it, and a newer push replaces it while it waits (github.com does this itself; so does
# our patched Forgejo, whose stock 15 queued the group FIFO: infra docs/forgejo-actions.md). So under a
# burst of pushes the run in flight still lands, and the next run covers every
# push since -- the tier gates measure from the deployed MARKER, so a skipped push's commits stay inside
# the next run's interval.
#
# It used to cancel the run in flight (`cancel-in-progress: true`), for GitHub Free's 20-job budget.
# With ~10 agents pushing to the self-hosted Forgejo that meant 39 of 51 runs on 2026-10-21 were
# cancelled (906 runner-minutes thrown away) and only 8 completed: builds and deploys rarely landed.
# The job-level `publish-*` lanes stay as a second guard against two publishes racing a tag.
# (WorkflowConcurrencyConventionSpec)
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

# WHERE IMAGES GO: registry.kinowo.net (infra/nix/modules/roles/registry.nix), the registry Flux's
# ImageRepositories scan (FluxImageAutomationSpec), pushed as `ci` with the REGISTRY_PASSWORD secret
# (infra/k8s-secrets/github-secrets.map). Fixed here, not in repository variables: those existed only on
# the self-hosted Forgejo, and after the 2026-10-31 cut-over github.com fell back to ghcr.io and logged in
# there as the pushing actor with registry.kinowo.net's password -- `denied` (Main #2030).
env:
    IMAGE_REPO: registry.kinowo.net
    REGISTRY_HOST: registry.kinowo.net
    REGISTRY_USER: ci

# Pipeline shape:
#
#   ci (reusable workflow — lint, test, integration, ──┬─► publish-web
#       ios/android local-server, page-tests)           ├─► image-worker ──► publish-worker
#   gates (t=0: which tiers changed since their   ──────┘
#          last deploy; both publishes read it)
#     └──► kick-convergence (minutes after the push, whether ci passes or not)
#
# NOTHING SHIPS AFTER A RED ci (2026-10-22): the worker image and both publishes need BOTH `ci` and `gates`
# and run only when both passed, instead of taking runners after the run is already lost.
# `kick-convergence` is the one deliberate exception: it hangs off `gates` alone, because convergence
# builds and judges the commit itself and behind ci it started ~50 min later (see its note).
# (MainAfterRedCiSpec, KickConvergenceWiringSpec)
#
# ONE WORKFLOW, because there used to be three: this file plus
# `build-web-image.yaml` and `build-worker-image.yaml`, which built the GHCR
# images the k3s cluster actually serves. They are folded in below; what had to
# survive the fold is their DIFFERENT `on.push.paths` filters, which is why the
# tiers are now gated per JOB — see the note over `publish-web`.
#
# The whole build+test pipeline lives in ci.yml as a `workflow_call`
# reusable workflow so it has exactly one definition; branch-ci.yml
# runs the same thing on every PR. Here on push-to-main we run it and,
# once green, deploy. `secrets: inherit` hands the called workflow the
# TMDB / MONGODB secrets its test jobs need.
#
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        # Off github.com, on the production lane (RunnerClassSpec).
        with:
            lane: ''
        secrets: inherit
        # ci.yml's jobs post JUnit check-runs, and its `image-*` jobs push this commit's SHA-tagged
        # images; a called workflow can only narrow its caller's token, never widen it.
        permissions:
            contents: read
            checks: write
            packages: write
            # ci.yml's `scope` job reads the newest green Main run (gh run list) to know which rows a push can move.
            actions: read

    # The web image is BUILT WHILE ci RUNS and only PUBLISHED here: ci's `e2e (corpus)` row builds it from the
    # dist it staged, while ci's slowest rows still run, and pushes it under the commit SHA alone — a tag
    # nothing deploys. The worker's (`image-worker`) is built from the dist that row staged once ci is green
    # (it used to start beside ci too, and kept building after a red row). `publish-web` /
    # `publish-worker` below `needs: ci` (the worker's also `needs: image-worker`),
    # and for a tier whose paths changed give those bytes the tags that ship: a registry manifest copy
    # of seconds where they used to restage (~2 min of cold `sbt stage`) and build (~1.7 min) on the
    # post-ci critical path. (DeployImageReuseSpec)
    #
    # The web image is built on every main push, even when its paths did not change: building is not
    # shipping, and an unpublished SHA-tagged image costs registry space and a runner ci's e2e rows have
    # already given back. The worker's is built only for a push that changed the worker (`image-worker`).
    # `free-runners` — the job that used to sit here, cancelling any in-flight
    # convergence run to take its runners back for the Fly deploy — was
    # retired 2026-09-08 alongside that workflow moving to `cancel-in-progress:
    # false`. Cancelling a run that lane no longer intends to throw away would
    # destroy real progress rather than merely accelerate a supersede that was
    # coming anyway. See `identity-model-convergence.yml`'s `concurrency:` block.
    #
    # This job used to occupy a concurrent slot at t=0. That slot now goes to
    # `gates` below, for the few seconds it takes to answer the tier gates
    # (`CiRunnerBudgetSpec`).

    # Seconds, at t=0 beside ci: the slot ci.yml leaves (beside the headroom kept for
    # overlapping workflows) for the few seconds it runs (CiRunnerBudgetSpec). No secret is checked
    # here: the Grafana marker's are optional by design (mark-grafana-deploy skips without them), and
    # nothing else in this workflow reads one beyond what ci.yml's own jobs check.
    gates:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        # EACH TIER'S GATE, answered here at t=0 rather than inside its build job after ci, so both
        # builds start the moment ci is green. A marker that moves between t=0 and ci's end can only
        # make a gate say "changed" more often, never skip a tier that did change.
        outputs:
            web-changed: ${{ steps.changed-web.outputs.changed }}
            worker-changed: ${{ steps.changed-worker.outputs.changed }}
        steps:
            # Full history, BLOBLESS — the tier gates below diff against each tier's last DEPLOYED
            # commit, which a shallow checkout would not have; commits and trees only.
            # ON FORGEJO, A DEPTH INSTEAD OF 0: the Forgejo copy of the repo is itself shallow (at
            # 257ad0a), and a depth-0 blobless fetch of a shallow server loops — the client rejects
            # the server's shallow root ("shallow roots are not allowed to be updated"), its
            # promisor lazy-fetches it, and the recursion spins until `cannot exec 'remote-http':
            # Argument list too long` or the job's timeout (run #83). A depth past the root takes
            # every commit the server has and records the root as the client's own shallow line.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            - name: What is the web tier actually running?
              id: base-web
              uses: ./.github/actions/deployed-base
              with:
                  tier: web

            - name: Has the web tier changed since then?
              id: changed-web
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-web.outputs.base }}
                  # THE WEB TIER'S FILTER SET. Deliberately NOT the worker's — see the note above.
                  patterns: |
                      web/**
                      geodata/**
                      common/**
                      identity/**
                      build.sbt
                      project/**
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      infra/jvm/web.options
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - name: What is the worker tier actually running?
              id: base-worker
              uses: ./.github/actions/deployed-base
              with:
                  tier: worker

            - name: Has the worker tier changed since then?
              id: changed-worker
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-worker.outputs.base }}
                  # THE WORKER TIER'S FILTER SET. `worker/**` where the web's says `web/**`, and that
                  # is the whole point: a web-only push must not reach this job's build, let alone
                  # its image, because a new worker image restarts it into a scrape storm.
                  # NOT the test sources: tests run in ci on every push, and a push that changed only
                  # them ships an image running the same code — 11 of 71 worker restarts in the 24 h to
                  # 2026-10-01, each ~350 CPU-seconds of JIT and boot re-seeding per worker.
                  patterns: |
                      worker/**
                      !worker/src/test/**
                      !worker/src/it/**
                      !worker/src/fixtures/**
                      geodata/**
                      common/**
                      !common/src/test/**
                      identity/**
                      !identity/src/test/**
                      scrapers/**
                      !scrapers/src/test/**
                      build.sbt
                      project/**
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      infra/jvm/worker.options
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**


    # Kick the convergence suite off AT THE PUSH, behind only `gates` (seconds), never
    # behind `ci`. Convergence builds and judges the commit itself; Main's tests add
    # nothing to its answer. Hung off `ci`, a push whose Main run went red on an unrelated
    # spec never dispatched at all: on 2026-10-15 the Arsenal client's push (f58b71add,
    # 09:29 UTC) got its first convergence run at 11:08, after three cancelled and two red
    # Main runs, while a landing waited on it. 65ed31dbf (2026-10-22) moved it behind
    # `[ci, gates]` with the worker image; that put every dispatch ~50 min after the push,
    # so it is back on `gates` alone (2026-10-23). The worker image and publishes still
    # skip after a red ci (MainAfterRedCiSpec).
    # `needs: gates` rather than no `needs:` keeps the runner budget's t=0 set to `gates`
    # alone (CiRunnerBudgetSpec): this job takes the slot gates has just given back.
    #
    # Two shapes this deliberately is not:
    #
    #  * Not a `workflow_run` trigger on this workflow. `workflow_run` fires on ANY
    #    completion, `failure` and `cancelled` included, and GitHub gives no way to
    #    filter on conclusion in `on:` — the only gate available was a job-level
    #    `if`, which still CREATES a run that then skips. Those runs were not merely
    #    noise: concurrency is evaluated at RUN level, before the `if`, so a run
    #    destined to skip claimed the lane and cancelled whatever was genuinely in
    #    flight. One killed a leg 21.5 minutes into real work, and since every push
    #    cancels the previous deploy, a burst of pushes produced a burst of
    #    skipped-but-cancelling runs and nothing completed for a day. An explicit
    #    dispatch inverts that: no dispatch, no run, nothing cancelled.
    #
    #  * Not after a deploy. Convergence never reads the deployed machines — every
    #    leg runs against its own MongoDB container and a recorded corpus — and
    #    nothing gates a deploy on its result, so waiting for the (since removed) Fly
    #    deploy legs only pushed a tens-of-minutes suite later into the window where the next push's
    #    dispatch supersedes it. Starting with the legs is the earliest this commit's
    #    answer can exist. (KickConvergenceWiringSpec)
    #
    # Both suites' lanes are `cancel-in-progress: false` (identity-model-convergence.yml's
    # `concurrency:` block), so a run in flight always finishes and a dispatch queues
    # behind it, replacing only whatever was queued before. Two lanes, two dispatches:
    # the US runs the same leg from its own workflow.
    kick-convergence:
        needs: gates
        # A failed tier gate (a deployed-marker read) says nothing about the commit: dispatch anyway.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-26.04
        # Room for dispatch_workflow's worst case: two rate-limit waits of up to 900 s each
        # (DISPATCH_RATE_LIMIT_MAX_WAIT) before its third attempt, plus the reads and checkout.
        timeout-minutes: 40
        permissions:
            actions: write
            contents: read
        steps:
            # Full history, BLOBLESS: the gate diffs this push against the head of each
            # suite's newest run, which can be several pushes back. The Forgejo depth: see `gates`.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            # Both convergence suites — the pipeline's and the identity model's — on the same
            # gate: only for a push that can change a verdict (`.github/convergence-paths.txt`),
            # each diffed from the head of ITS OWN newest run.
            # Each lane keeps one run pending and every newer dispatch replaces it, so
            # dispatching for an app- or docs-only push used to evict the pending run of the
            # pipeline commit before it — see the script's header for the measurement.
            - name: Start the convergence suites this push can change
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: .github/scripts/kick-convergence.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" "Identity model convergence"

    # ── The k3s tiers ────────────────────────────────────────────────────────────────────────────
    #
    # One `publish-<tier>` job per tier publishes the image the CLUSTER runs, which is how production
    # ships. They were two workflows of their own until they were folded in here
    # (`build-web-image.yaml`, `build-worker-image.yaml`).
    #
    # WHAT THE FOLD HAD TO PRESERVE, and the single most important property of the whole file: the
    # two workflows carried DIFFERENT `on.push.paths` filters, and that difference is load-bearing.
    # A web-only change must not rebuild and redeploy the worker, because deploying a worker
    # restarts it and a restarted worker cold-boots into a scrape storm that drains the shared-CPU
    # credit. That is the entire reason the worker's deploy is path-gated.
    #
    # `on.push.paths` is workflow-level, so one workflow cannot carry two filters. The gating is
    # therefore per JOB: each tier hands its own path list to `.github/actions/changed-paths` in
    # `gates`, and each `publish-<tier>` runs only on its own tier's answer.
    # `K8sTierPathGatingSpec` runs the real matcher over the real lists and asserts a web-only
    # change does not reach the worker. Keep the lists apart; a union quietly undoes all of this.
    #
    # ONE WIDENING THE FOLD COULD NOT AVOID: both lists name this file, because this file is now
    # where both tiers' publish steps live — so editing it redeploys BOTH tiers. There is no
    # sub-file granularity to be had.
    #
    # BOTH TIERS `needs: ci`: a push that fails ci publishes nothing. It also keeps the runner budget
    # intact — a job that waits for ci takes a slot ci has already given back (`CiRunnerBudgetSpec`).
    #
    # PUBLISH AND RECORD IN ONE JOB. The marker write used to be a `record-<tier>` job of its own,
    # so the `contents: write` token never sat in a job that ran a Docker build of project code.
    # The images are built elsewhere now (ci's `e2e (corpus)` row, `image-worker` below) and this job only
    # copies registry tags with the runner's own docker CLI: no project code and no third-party
    # action runs here, so the split bought nothing but a second job hop on every push.
    publish-web:
        needs: [ci, gates]
        if: needs.gates.outputs.web-changed == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 10

        permissions:
            # Moving the `deployed-web` marker is a ref write.
            contents: write
            # The built-in GITHUB_TOKEN can push to GHCR; no new credential.
            packages: write

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Two runs moving the same tag concurrently
        # is last-write-wins, and the loser could be the newer commit — which would walk the marker
        # BACKWARDS and re-ship work already covered.
        concurrency:
            group: publish-web
            cancel-in-progress: false

        steps:
            # Only so the local Grafana action below is on disk.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      .github
                      scripts/ci

            - name: Compute an orderable image tag
              id: tag
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Publish the image ci built under the tags that ship it
              # ci's `e2e (corpus)` row built this commit's image while the rest of ci ran, and pushed it
              # under its SHA tag ONLY — a tag nothing deploys. This job runs only once ci is green, and
              # gives those same bytes the two names that ship: `main-<utc>-<sha7>`, the one Flux's image
              # automation sorts and DEPLOYS, and `latest`, so a hand-applied manifest resolves to
              # something (never deploy `latest`: a restart under it can come back on another build). A
              # manifest copy in the registry — seconds. The SHA tag stays the provenance tag.
              env:
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: |
                  set -euo pipefail
                  echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
                  docker buildx imagetools create \
                      -t ${{ env.IMAGE_REPO }}/movies-web:${{ steps.tag.outputs.value }} \
                      -t ${{ env.IMAGE_REPO }}/movies-web:latest \
                      ${{ env.IMAGE_REPO }}/movies-web:${{ github.sha }}

            - name: Record that an image exists for this commit
              # PUSHES TO main ONLY. A workflow_dispatch on a branch may publish an image without
              # claiming one was published for production.
              #
              # ⚠️ THIS MARKER DOES NOT MEAN "WHAT IS LIVE". CI does not deploy: image-automation
              # commits the winning tag into movies-gitops/web/base/all.yaml and kustomize-controller
              # applies it. What this records is "an image for this commit was published", which is
              # exactly the question the tier gate asks and nothing more — and only after the publish
              # step succeeded, so the base never advances past a commit no image exists for. A
              # cancelled run leaves the change inside the interval and the next push covers it.
              #
              # WHAT IS LIVE IS READ FROM GIT. The `image:` line in that manifest IS the deployed tag,
              # and whether the cluster has caught up is ALERTED ON by Flux's rules
              # (nix/files/monitoring/rules/flux.rules) rather than inferred from a green run.
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-web" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-web -f sha='${{ github.sha }}'

            # An image existing for this commit is the closest thing CI has to a "web tier shipped"
            # event now that Flux, not CI, does the rolling. Marking it here, rather than waiting for
            # Flux to actually converge, trades a few minutes of lag for a marker that exists at all.
            - name: Mark deploy in Grafana
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: ./.github/actions/mark-grafana-deploy
              with:
                  tier: web
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  sha: ${{ github.sha }}
                  commit-message: ${{ github.event.head_commit.message }}

    # THE WORKER IMAGE, BUILT AND AOT-TRAINED ONCE ci IS GREEN — and OUTSIDE ci, so `publish-web` (which
    # `needs: ci`) never waits for the ~5 min training: only `publish-worker` needs this job. Until
    # 2026-10-22 it started beside ci and waited for the dist ci's `e2e (corpus)` row uploads, so a red
    # test row still built (and on the one-runner Forgejo `main-lane` queued) a worker image for nobody;
    # now it needs `ci` and a red run skips it (MainAfterRedCiSpec). SAFETY: it pushes this commit's SHA tag ONLY. Nothing deploys
    # a SHA tag; `publish-worker` gives these bytes the tags that ship (`main-<utc>-<sha7>`, `latest`)
    # only once ci is green and the tier's paths changed (DeployImageReuseSpec).
    # Only when the worker's paths changed: `publish-worker` publishes nothing otherwise, and an image
    # built for nobody held a runner for its wait and ~5 min build on every web-only push. Skipped
    # here, `publish-worker` skips with it — nothing ships, as before.
    image-worker:
        needs: [ci, gates]
        if: needs.gates.outputs.worker-changed == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: read
            # To see ci's artifacts and jobs while ci still runs.
            actions: read
            # The built-in GITHUB_TOKEN can push to GHCR; no new credential.
            packages: write
        steps:
            - uses: actions/checkout@v5

            # Already uploaded once ci is green; kept as the check that it is there.
            - name: Wait for the worker distribution ci's e2e corpus row stages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/ci/wait-for-run-artifact.sh stage-worker "e2e (corpus)" 900

            - name: Fetch the worker distribution the e2e corpus row staged
              # Straight into `stage/`, the only path the Dockerfile's whitelisted context
              # (.dockerignore) can see. The artifact drops file modes; the Dockerfile's
              # `chmod +x bin/*` restores the one that matters.
              uses: actions/download-artifact@v6
              with:
                  name: stage-worker
                  path: stage

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY_HOST }}
                  username: ${{ env.REGISTRY_USER }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}

            # BuildKit from Docker Hub's mirror, Docker Hub only when the mirror fails (CiImageMirrorSpec).
            - uses: ./.github/actions/setup-buildx

            # amd64 only, the inline cache of `latest`, Docker Hub's bases when the mirror loses a blob: build-image.sh.
            - name: Build and push under this commit's SHA tag only
              run: scripts/ci/build-image.sh worker ${{ env.IMAGE_REPO }}/movies-worker ${{ github.sha }}


    publish-worker:
        needs: [ci, gates, image-worker]
        if: needs.gates.outputs.worker-changed == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 10

        permissions:
            # Moving the `deployed-worker` marker is a ref write.
            contents: write
            # The built-in GITHUB_TOKEN can push to GHCR; no new credential.
            packages: write

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Two runs moving the same tag concurrently
        # is last-write-wins, and the loser could be the newer commit — which would walk the marker
        # BACKWARDS and re-ship work already covered.
        concurrency:
            group: publish-worker
            cancel-in-progress: false

        steps:
            # Only so the local Grafana action below is on disk.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      .github
                      scripts/ci

            - name: Compute an orderable image tag
              id: tag
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Publish the image ci built under the tags that ship it
              # `image-worker` above built this commit's image while ci ran, and pushed it
              # under its SHA tag ONLY — a tag nothing deploys. This job runs only once ci is green, and
              # gives those same bytes the two names that ship: `main-<utc>-<sha7>`, the one Flux's image
              # automation sorts and DEPLOYS, and `latest`, so a hand-applied manifest resolves to
              # something (never deploy `latest`: a restart under it can come back on another build). A
              # manifest copy in the registry — seconds. The SHA tag stays the provenance tag.
              env:
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              run: |
                  set -euo pipefail
                  echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
                  docker buildx imagetools create \
                      -t ${{ env.IMAGE_REPO }}/movies-worker:${{ steps.tag.outputs.value }} \
                      -t ${{ env.IMAGE_REPO }}/movies-worker:latest \
                      ${{ env.IMAGE_REPO }}/movies-worker:${{ github.sha }}

            - name: Record that an image exists for this commit
              # PUSHES TO main ONLY. A workflow_dispatch on a branch may publish an image without
              # claiming one was published for production.
              #
              # ⚠️ THIS MARKER DOES NOT MEAN "WHAT IS LIVE". CI does not deploy: image-automation
              # commits the winning tag into movies-gitops/worker/base/all.yaml and kustomize-controller
              # applies it. What this records is "an image for this commit was published", which is
              # exactly the question the tier gate asks and nothing more — and only after the publish
              # step succeeded, so the base never advances past a commit no image exists for. A
              # cancelled run leaves the change inside the interval and the next push covers it.
              #
              # WHAT IS LIVE IS READ FROM GIT. The `image:` line in that manifest IS the deployed tag,
              # and whether the cluster has caught up is ALERTED ON by Flux's rules
              # (nix/files/monitoring/rules/flux.rules) rather than inferred from a green run.
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-worker" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-worker -f sha='${{ github.sha }}'

            # An image existing for this commit is the closest thing CI has to a "worker tier shipped"
            # event now that Flux, not CI, does the rolling. Marking it here, rather than waiting for
            # Flux to actually converge, trades a few minutes of lag for a marker that exists at all.
            - name: Mark deploy in Grafana
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: ./.github/actions/mark-grafana-deploy
              with:
                  tier: worker
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  sha: ${{ github.sha }}
                  commit-message: ${{ github.event.head_commit.message }}

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ci, gates, kick-convergence, publish-web, image-worker, publish-worker]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        with:
            lane: ''
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit
