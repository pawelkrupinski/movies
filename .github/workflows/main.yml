              # automation sorts and DEPLOYS, and `latest`, so a hand-applied manifest resolves to
              # something (never deploy `latest`: a restart under it can come back on another build). A
              # manifest copy in the registry — seconds. The SHA tag stays the provenance tag.
              env:
                  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
              # A registry lost mid-publish (k3s-worker-1's host switch for this very commit, Main #2906; its daily prune)
              # is waited for, bounded, and the publish run once more: scripts/ci/wait_out_registry_outage.py.
