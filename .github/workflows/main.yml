name: Main

on:
    push:
        branches: [main]
    # Manual escape hatch: redeploy the worker even when its inputs are unchanged
    # (a base-image refresh, a forced restart) — the worker deploy is otherwise
    # skipped when nothing in its artifact changed (see the guard below).
    workflow_dispatch:
        inputs:
            force_worker_deploy:
                description: "Redeploy kinowo-worker even if its inputs are unchanged"
                type: boolean
                default: false

# Workflow-level concurrency: a newer push cancels the older workflow
# mid-flight, freeing its runners so the latest commit's jobs don't queue
# behind stale work. GitHub Free allows 20 concurrent jobs across the
# account and a push wants all 20 (see the RUNNER BUDGET note in ci.yml),
# so two overlapping pushes would otherwise halve each other.
#
# WHAT THAT COSTS NOW THAT THE k3s DEPLOYS LIVE HERE, stated rather than left to
# be rediscovered: a superseding push cancels an in-flight `deploy-web` /
# `deploy-worker` too, and no job-level `cancel-in-progress: false` can refuse a
# workflow-level cancellation. It cancels the ssh call that is WATCHING the
# rollout, not the rollout: the forced command on monitoring-1 has already run
# `kubectl set image`, and the k8s controller finishes replacing the pods with
# or without a watcher (infra/nix/modules/roles/k8s-deploy.nix). What is lost is
# the "did it come up?" answer, and the newer run is on its way with a newer
# image anyway. Do not trade the cancellation away to recover it — the runner
# budget above depends on it.
#
# The Fly deploy JOB has NO concurrency group of its own, deliberately: GitHub
# keeps one running plus one pending per group, so a group covering a tier
# CANCELS the third app rather than queueing it, and apps silently stopped
# deploying for days. DeployParallelismConfigSpec is there to stop one
# coming back — do not add one here either.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

# Pipeline shape:
#
#                                                             ┌─► deploy (6 Fly apps, all disabled)
#   ci (reusable workflow — lint, test, integration,          ├─► kick-convergence
#       ios/android local-server, page-tests) ─────────────── ─┼─► build-web ──► deploy-web
#   build-image (stage + push both Fly images) ───────────────┘   (k3s)         (k3s)
#                                                             └─► build-worker ──► deploy-worker
#
# ONE WORKFLOW, because there used to be three: this file plus
# `build-web-image.yaml` and `build-worker-image.yaml`, which built the GHCR
# images the k3s cluster actually serves. They are folded in below; what had to
# survive the fold is their DIFFERENT `on.push.paths` filters, which is why the
# tiers are now gated per JOB — see the note over `build-web`.
#
# The whole build+test pipeline lives in ci.yml as a `workflow_call`
# reusable workflow so it has exactly one definition; branch-ci.yml
# runs the same thing on every PR. Here on push-to-main we run it and,
# once green, deploy. `secrets: inherit` hands the called workflow the
# ZYTE / TMDB / MONGODB secrets its test jobs need.
#
# `build-image` runs ALONGSIDE ci, not after it, and that is the point: the
# container build is a pure function of the sources, so it does not need the
# tests to have passed — only the RELEASE does. Building it concurrently takes
# ~85s of image build off the post-CI tail, leaving the deploy legs to do the
# one thing that genuinely has to wait for a green build: point the machines at
# an image that already exists. Nothing ships if ci fails, because the legs
# still `needs: ci`; a pushed-but-never-released image is inert.
#
# It costs a runner slot, and the account has 20. ci.yml is deliberately built
# to 19 so this job is the 20th — see the RUNNER BUDGET note there before adding
# a job to either file.
jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    # Stage both apps and push both container images to Fly's registry, tagged
    # with this commit's SHA. No `needs:` — it starts with ci's jobs and is
    # normally done well before them.
    #
    # It stages independently rather than taking a build artifact from ci. It
    # used to: `test` uploaded `stage-web` / `stage-worker` and the deploy leg
    # downloaded them. But those only exist once `test` finishes, and waiting for
    # that is exactly what put the container build on the critical path — so the
    # artifacts were dropped rather than kept for a consumer that no longer
    # exists. `test` still STAGES both apps, because that is what proves the dist
    # links and ships no Scaladoc on a PR run (branch-ci.yml never reaches this
    # file); it just doesn't publish the result any more.
    #
    # Both images are built unconditionally, including the worker's on a push
    # that will skip the worker deploy. Building is not restarting: the skip
    # guard exists to protect the worker from a cold-boot scrape storm, and an
    # unreleased image in the registry costs nothing but builder time.
    # NOTHING RELEASES THESE IMAGES ANY MORE, and that is worth stating rather than leaving to be
    # rediscovered: every leg of the `deploy` matrix below is now `enabled: false`, because both
    # tiers run on k3s and are shipped by the GHCR jobs at the bottom of this file. This job is kept
    # for two
    # reasons — it holds the "take the runners back from an in-flight convergence run" step that the
    # rest of the push depends on for its runner budget, and a pushed Fly image is what makes the
    # documented rollback ("flip one word to true") a flip rather than a rebuild. It costs Fly
    # builder time and nothing else. Retire it with the Fly apps.
    build-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        outputs:
            worker_hash: ${{ steps.stage.outputs.worker_hash }}
        steps:
            # FIRST, before this job does any work of its own: take the runners
            # back off the convergence suite.
            #
            # 20 concurrent jobs is the whole account's allowance, and this run
            # wants all 20. A convergence run in flight holds 3 of them for
            # anywhere from 25 to 90 minutes, so a push landing in that window
            # doesn't get 3 of its jobs until a convergence leg finishes. Measured:
            # 17 jobs started at once and 3 waited, one of them the longest job in
            # the build — the run took 10m28s against a 7m critical path.
            #
            # Cancelling costs that suite very little, because it is already the
            # thing that yields: its own workflow keeps one lane with
            # `cancel-in-progress`, so the next push was going to throw the run away
            # regardless — 6 of 10 consecutive runs ended `cancelled` — and
            # `kick-convergence` re-dispatches it from this same run a few minutes
            # later, against the newer commit. This just makes the preemption
            # happen at the START of the deploy, where it frees runners, instead of
            # at the end, where it frees nothing. The nightly 04:20 schedule remains
            # the guaranteed-to-finish signal either way.
            #
            # The runners do not come back instantly: GitHub takes ~80s to tear a
            # cancelled job down, so a deploy that lands mid-convergence still has
            # a job or two start late — measured at +76s, against +3s for the rest.
            # Better than waiting out a convergence leg, but not free, and worth
            # knowing before someone re-measures and thinks this step did nothing.
            #
            # It cancels a HAND-STARTED convergence run too. If you dispatched one
            # deliberately and want its answer, don't push while it runs.
            - name: Take the runners back from any in-flight convergence run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -uo pipefail
                  # Anything not already finished — a QUEUED run counts: it holds no
                  # runner yet, but it takes the first ones to free up, which is
                  # precisely the ones this deploy is waiting for.
                  for id in $(gh run list --workflow "Country convergence" --limit 20 \
                                  --json databaseId,status \
                                  --jq '.[] | select(.status != "completed") | .databaseId'); do
                      echo "cancelling convergence run $id to free its runners"
                      gh run cancel "$id" || true
                  done

            - uses: actions/checkout@v5

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - uses: actions/cache@v5
              with:
                  path: |
                      project/target
                      project/project/target
                      */target/scala-*
                  # Read-only rider on the `test` job's key — same scope, same
                  # sources. Whichever of the two finishes first writes it.
                  key: sbt-target-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', 'web/src/main/resources/**') }}
                  restore-keys: |
                      sbt-target-${{ runner.os }}-

            - name: Stage both apps
              id: stage
              run: |
                  set -euo pipefail
                  sbt "web/stage" "worker/stage"
                  # The worker no-op guard's hash, computed HERE because it has to
                  # be baked into the image at build time. Same inputs, same order
                  # as the guard in the deploy leg below — the two must agree or
                  # the guard never matches. `fly.worker.toml` is hardcoded rather
                  # than looped over every worker toml because one image carries
                  # one hash; see the caveat on the guard below.
                  hash=""
                  for p in worker common build.sbt project Dockerfile fly.worker.toml; do
                      hash="$hash$(git rev-parse "HEAD:$p")"
                  done
                  echo "worker_hash=$(printf '%s' "$hash" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - uses: superfly/flyctl-actions/setup-flyctl@v1

            # `--build-only --push --remote-only` builds on Fly's builder and
            # pushes to `registry.fly.io/<app>:<sha>` without touching a single
            # machine. `--image-label` is what makes the tag the SHA, so the
            # deploy legs can name the image without plumbing an output through.
            - name: Build and push the web image
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: |
                  set -euo pipefail
                  rm -rf stage && cp -r web/target/universal/stage stage
                  flyctl deploy --build-only --push --remote-only -c fly.toml -a kinowo \
                      --image-label ${{ github.sha }} \
                      --build-arg BIN=web \
                      --build-arg COMMIT_SHA=${{ github.sha }}

            - name: Build and push the worker image
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: |
                  set -euo pipefail
                  rm -rf stage && cp -r worker/target/universal/stage stage
                  flyctl deploy --build-only --push --remote-only -c fly.worker.toml -a kinowo-worker \
                      --image-label ${{ github.sha }} \
                      --build-arg BIN=worker \
                      --build-arg COMMIT_SHA=${{ github.sha }} \
                      --build-arg WORKER_INPUT_HASH=${{ steps.stage.outputs.worker_hash }}

    # Two apps from one Dockerfile, deployed as PARALLEL matrix legs — web
    # (kinowo) and worker (kinowo-worker) ship on their own runners at the same
    # time. `fail-fast: false` so a worker-deploy failure doesn't cancel web's
    # (and vice versa). Each leg RELEASES the image `build-image` already pushed
    # for its `bin`; `matrix.builder` names the app whose registry holds it.
    # There is no build here any more — this is the part that had to wait for a
    # green ci, and it is now the only part that does.
    deploy:
        needs: [ci, build-image]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # `enabled: false` takes an app out of service WITHOUT deleting
                    # its wiring — the row, its fly config and its artifact all stay
                    # here, and restoring is one word. The guard step below turns it
                    # into a skip.
                    #
                    # A flag is needed at all because stopping the machine is NOT
                    # enough: both real skip guards below probe the LIVE machine and
                    # fail OPEN, so a stopped app reads as "no info" and the leg
                    # would deploy and restart it on the next push to main. This is
                    # the switch that makes a stop stick.
                    #
                    # THE WHOLE WEB TIER MOVED TO KUBERNETES 2026-08-29, so all three legs are
                    # disabled rather than deleted — the same treatment the workers got below, for
                    # the same reason.
                    #
                    # The three sites now run as pods on k3s (infra/kubernetes/web/) behind Caddy on
                    # k3s-worker-1, on domains this project actually owns: kinowo.net,
                    # uk.showtimes.cc and de.showtimes.cc. The `build-web` / `deploy-web` jobs at the
                    # bottom of this file build and roll them. Leaving any of these `true` would make the next push to
                    # main deploy a SECOND copy of the site on Fly, serving the same databases from a
                    # host that no longer has the traffic — and, for `kinowo`, restart a machine that
                    # is supposed to be scaled to zero.
                    #
                    # Kept as entries so the rollback is flipping one word: set back to `true`,
                    # `flyctl scale count 1`, and scale the k8s deployment to 0. Their `fly.*.toml`
                    # files are untouched (the Grafana specs still assert against them). Delete these
                    # entries only once the Fly apps themselves are retired.
                    - app: kinowo
                      toml: fly.toml
                      bin: web
                      builder: kinowo
                      enabled: false
                    # UK frontend — same `web` binary + build artifact as kinowo,
                    # its own fly config (KINOWO_COUNTRY=uk → the kinowo_uk db).
                    - app: showtimes-uk
                      toml: fly.uk.toml
                      bin: web
                      builder: kinowo
                      enabled: false
                    # DE frontend — KINOWO_COUNTRY=de → the kinowo_de db, in fra.
                    - app: showtimes-de
                      toml: fly.de.toml
                      bin: web
                      builder: kinowo
                      enabled: false
                    # MOVED TO KUBERNETES 2026-08-29, and this leg is disabled rather than deleted.
                    #
                    # The PL worker now runs as a pod on k3s (infra/kubernetes/worker/), deployed by
                    # the `build-worker` / `deploy-worker` jobs at the bottom of this file. Its Fly
                    # machine is STOPPED, not
                    # destroyed, so `flyctl deploy` here would not merely be redundant -- it would
                    # START the machine again, and two workers would both hold change streams on
                    # mongo-1 and both re-project the read model. Leaving this `true` makes the next
                    # push to main silently undo the migration.
                    #
                    # Kept as an entry so the rollback is flipping one word: set it back to `true`,
                    # scale the k8s deployment to 0, and the Fly app comes back with its secrets and
                    # config intact. Delete the entry only once the Fly app itself is retired.
                    - app: kinowo-worker
                      toml: fly.worker.toml
                      bin: worker
                      builder: kinowo-worker
                      enabled: false
                    # UK worker — same `worker` binary + artifact, split off
                    # kinowo-worker so the full-UK scrape load gets its own 2x
                    # machine (KINOWO_COUNTRIES=uk → the kinowo_uk db).
                    - app: kinowo-worker-uk
                      toml: fly.worker.uk.toml
                      bin: worker
                      builder: kinowo-worker
                      enabled: false
                    # DE worker — split off kinowo-worker (KINOWO_COUNTRIES=de →
                    # the kinowo_de db); the German roster gets its own 2x machine.
                    - app: kinowo-worker-de
                      toml: fly.worker.de.toml
                      bin: worker
                      builder: kinowo-worker
                      enabled: false
        # Every leg deploys in PARALLEL — no per-tier concurrency group. A group
        # keyed on the tier (fly-deploy-web / fly-deploy-worker) looks like it
        # serializes a tier, but GitHub keeps only ONE running + ONE pending job
        # per group, so back when there were 3 apps per tier (PL/UK/DE) the third was CANCELLED,
        # not queued — one app silently missed every deploy (kinowo-worker-de and
        # a web leg were dropped for days). The group was added after the
        # 2026-07-18 Mongo thundering-herd (all web apps restarting into an
        # overloaded Mongo, failing Fly's boot health-check, crash-looping), but
        # the SAME commit (6915b3538) fixed that at the root: MongoConnection now
        # starts DEGRADED and reconnects in the background instead of blocking
        # boot on Mongo, so a simultaneous restart into a slow Mongo no longer
        # crash-loops. If a tier ever outgrows parallel restarts, stagger it with
        # `strategy.max-parallel` on a per-tier job — never a shared concurrency
        # group, which caps at one pending and drops the rest. (DeployParallelismConfigSpec)
        steps:
            # Full history, because the roll-back guard below needs
            # `git merge-base` against whatever commit is live and that can be
            # arbitrarily old — but BLOBLESS. The guard reads commit topology and
            # tree object ids, never file contents, so fetching every blob in the
            # history (fixture corpus included) was ~15s of pure waste on the
            # deploy's critical path. `filter: blob:none` lazily fetches a blob
            # only if something asks for one; nothing here does.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            # Only a leg that can actually deploy needs flyctl. The guard below
            # reads `matrix.enabled` FIRST and short-circuits before either of its
            # flyctl probes, so a disabled leg never runs a flyctl command — and
            # every leg is disabled today. Installing it anyway made this the only
            # step in six otherwise-no-op legs that could fail, and on 2026-08-30 it
            # did: the `kinowo` leg's install died in under a second with no output
            # and no annotation (a runner glitch — the five sibling legs installed
            # fine), reddening the whole workflow over a tool nothing was going to
            # use. (DeployParallelismConfigSpec)
            - uses: superfly/flyctl-actions/setup-flyctl@v1
              if: matrix.enabled

            # Decide whether this app actually needs a deploy. Two skip reasons,
            # both fail-open (any probe error → deploy):
            #
            #  (1) Roll-back guard (both apps): the running machine carries
            #      COMMIT_SHA from the Dockerfile build-arg; if this workflow's
            #      commit is an ANCESTOR of the live one, a newer build already
            #      shipped and re-deploying would roll it back. (First-ever deploy:
            #      no machine → empty probe → proceed.)
            #
            #  (2) No-op guard (WORKER only): every worker restart pays a cold
            #      freshness re-hydrate + scrape boot storm that drains the
            #      shared-CPU credit, so a push that doesn't change the worker's
            #      deployable artifact must NOT restart it. We hash the worker
            #      inputs — the bin's sources (worker/, common/), its build
            #      (build.sbt, project/), the image recipe (Dockerfile) and its fly
            #      config (fly.worker.toml), via each one's git object id — and bake
            #      that hash into the image (WORKER_INPUT_HASH). If the live machine
            #      already runs this exact hash, skip. Force a restart anyway (a
            #      config/secret/base-image change with no code delta) with
            #      `[deploy-worker]` in the commit message or the workflow_dispatch
            #      force input.
            - name: Decide whether to deploy
              id: guard
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
                  HEAD_MSG: ${{ github.event.head_commit.message }}
                  FORCE_WORKER: ${{ github.event.inputs.force_worker_deploy }}
              run: |
                  # Taken out of service on purpose (matrix `enabled: false`). FIRST,
                  # before either probe below: both of those fail OPEN, so a stopped
                  # app would read as "no info" and get deployed and restarted. This
                  # is the only skip reason that is a decision rather than a
                  # measurement, so it is the only one that can be trusted about an
                  # app that isn't running.
                  if [ "${{ matrix.enabled }}" != "true" ]; then
                      echo "::notice::Skipping ${{ matrix.app }} — disabled in the deploy matrix (enabled: false). Flip it to true to bring the app back; see docs/restoring-a-country.md"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  deployed=$(flyctl ssh console -a ${{ matrix.app }} -C 'printenv COMMIT_SHA' 2>/dev/null || echo "")
                  if [ -n "$deployed" ] && [ "$deployed" != "${{ github.sha }}" ]; then
                      if git merge-base --is-ancestor "${{ github.sha }}" "$deployed" 2>/dev/null; then
                          echo "::warning::Skipping ${{ matrix.app }} — commit $deployed (descendant of ${{ github.sha }}) is already live"
                          echo "skip=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  fi
                  # No-op guard for EVERY worker leg (kinowo-worker and kinowo-worker-uk):
                  # hash the shared worker inputs + THIS app's own toml, and skip the
                  # cold-boot redeploy when the live machine already runs that hash. Keyed
                  # on `bin=worker` + `matrix.app`/`matrix.toml` so each worker app tracks
                  # its own config independently (a fly.worker.uk.toml edit redeploys only
                  # the UK worker; a shared worker/ or Dockerfile edit redeploys both).
                  #
                  # CAVEAT since the image moved to `build-image`: one worker image is
                  # built, and it bakes the hash of `fly.worker.toml`. So the skip only
                  # ever MATCHES for kinowo-worker. Re-enabling kinowo-worker-uk/-de
                  # would give them a hash they can never match, i.e. they would deploy
                  # on every push — the fail-open direction, correct but not thrifty.
                  # Give each re-enabled worker app its own build step there when that
                  # day comes. (DeployImageReuseSpec)
                  if [ "${{ matrix.bin }}" = "worker" ]; then
                      hash=""
                      for p in worker common build.sbt project Dockerfile ${{ matrix.toml }}; do
                          hash="$hash$(git rev-parse "HEAD:$p")"
                      done
                      hash=$(printf '%s' "$hash" | sha256sum | cut -d' ' -f1)
                      echo "worker_hash=$hash" >> "$GITHUB_OUTPUT"
                      forced=false
                      case "${HEAD_MSG:-}" in *"[deploy-worker]"*) forced=true ;; esac
                      [ "${FORCE_WORKER:-}" = "true" ] && forced=true
                      live_hash=$(flyctl ssh console -a ${{ matrix.app }} -C 'printenv WORKER_INPUT_HASH' 2>/dev/null | tr -d '[:space:]' || echo "")
                      if [ "$forced" != "true" ] && [ -n "$live_hash" ] && [ "$live_hash" = "$hash" ]; then
                          echo "::warning::Skipping ${{ matrix.app }} — inputs unchanged (hash ${hash:0:8}… already live). Force with [deploy-worker] or the workflow_dispatch input."
                          echo "skip=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  fi

            # Release only — no `--build-arg`, because COMMIT_SHA and
            # WORKER_INPUT_HASH were baked in when `build-image` built this tag.
            - name: Release the pre-built image
              if: steps.guard.outputs.skip != 'true'
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: flyctl deploy -c ${{ matrix.toml }} -a ${{ matrix.app }} -i registry.fly.io/${{ matrix.builder }}:${{ github.sha }}

            # Drop a vertical marker on the self-hosted Grafana carrying this
            # commit's SHA + subject, so a metric regression on the dashboard
            # lines up visually with the release that caused it — the "I deploy X
            # and a service degrades" loop, made legible.
            #
            # Rides the web leg rather than a job of its own: a job costs ~10s of
            # spin-up on the critical path to run a 200ms curl, and the marker is
            # more accurate here anyway — it lands when the user-visible tier
            # actually shipped, not when the last of six legs stopped. No-ops
            # (doesn't fail the deploy) until the Grafana secrets are set.
            - name: Mark deploy in Grafana
              if: ${{ matrix.app == 'kinowo' && steps.guard.outputs.skip != 'true' }}
              env:
                  GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
                  GRAFANA_ANNOTATION_TOKEN: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  SHA: ${{ github.sha }}
                  MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_ANNOTATION_TOKEN:-}" ]; then
                      echo "Grafana annotation secrets unset — skipping deploy marker."
                      exit 0
                  fi
                  short="${SHA:0:7}"
                  subject="$(printf '%s' "$MSG" | head -1)"
                  now="$(( $(date +%s) * 1000 ))"
                  body="$(jq -n --argjson time "$now" \
                      --arg text "deploy ${short} — ${subject} (${SHA})" \
                      '{time: $time, tags: ["deploy", "main"], text: $text}')"
                  # NEVER FAIL THE DEPLOY OVER A MARKER. This step failed the whole `kinowo` leg on
                  # 2026-08-29 -- `curl -fsS` returned 35 because GRAFANA_URL still named
                  # kinowo-grafana.fly.dev, which had been scaled to zero machines when Grafana moved
                  # to monitoring-1. The web app had already deployed successfully; the run went red
                  # for an annotation.
                  #
                  # A deploy marker is an aid to reading a dashboard later. It is not a release
                  # gate, and a red run for a missing annotation trains people to ignore red runs on
                  # the workflow that actually ships production.
                  if curl -fsS --max-time 20 -X POST "${GRAFANA_URL%/}/api/annotations" \
                      -H "Authorization: Bearer ${GRAFANA_ANNOTATION_TOKEN}" \
                      -H "Content-Type: application/json" \
                      -d "$body"; then
                      echo "Posted deploy marker for ${short}."
                  else
                      echo "::warning title=Deploy marker not posted::Grafana at ${GRAFANA_URL%/} did not accept the annotation for ${short}. The deploy itself succeeded."
                  fi

    # Kick the country convergence suite off ALONGSIDE the deploy matrix — same
    # `needs: ci` the legs have, so the dispatch goes out the moment the build is
    # green and the suite runs concurrently with the six flyctl legs.
    #
    # Two shapes this deliberately is not:
    #
    #  * Not a `workflow_run` trigger on this workflow. `workflow_run` fires on ANY
    #    completion, `failure` and `cancelled` included, and GitHub gives no way to
    #    filter on conclusion in `on:` — the only gate available was a job-level
    #    `if`, which still CREATES a run that then skips. Those runs were not merely
    #    noise: concurrency is evaluated at RUN level, before the `if`, so a run
    #    destined to skip claimed the lane and cancelled whatever was genuinely in
    #    flight. One killed a leg 21.5 minutes into real work, and since every push
    #    cancels the previous deploy, a burst of pushes produced a burst of
    #    skipped-but-cancelling runs and nothing completed for a day. An explicit
    #    dispatch inverts that: no dispatch, no run, nothing cancelled.
    #
    #  * Not `needs: deploy`. Convergence never reads the deployed machines — every
    #    leg runs against its own MongoDB container and a recorded corpus — and
    #    nothing gates the deploy on its result, so waiting for six flyctl legs only
    #    pushed a tens-of-minutes suite later into the window where the next push's
    #    dispatch supersedes it. Starting with the legs is the earliest this commit's
    #    answer can exist. (DeployParallelismConfigSpec)
    #
    # That superseding is still real: the convergence workflow keeps one lane with
    # `cancel-in-progress`, so a push landing mid-run throws that run away. Running in
    # parallel buys the run a deploy's worth of head start against it; it does not
    # remove it. The nightly 04:20 schedule stays the guaranteed-to-finish signal.
    kick-convergence:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Start the country convergence suite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  echo "ci green for ${GITHUB_SHA:0:9} — dispatching Country convergence"
                  gh workflow run "Country convergence" --ref "${GITHUB_REF_NAME}"

    # ── The k3s tiers ────────────────────────────────────────────────────────────────────────────
    #
    # These four jobs were two workflows of their own until they were folded in here
    # (`build-web-image.yaml`, `build-worker-image.yaml`). They build the images the CLUSTER runs —
    # the Fly `deploy` matrix above is disabled top to bottom, so THIS is the deploy that ships
    # production.
    #
    # WHAT THE FOLD HAD TO PRESERVE, and the single most important property of the whole file: the
    # two workflows carried DIFFERENT `on.push.paths` filters, and that difference is load-bearing.
    # A web-only change must not rebuild and redeploy the worker, because deploying a worker
    # restarts it and a restarted worker cold-boots into a scrape storm that drains the shared-CPU
    # credit. That is the entire reason the worker's deploy is path-gated.
    #
    # `on.push.paths` is workflow-level, so one workflow cannot carry two filters. The gating is
    # therefore per JOB: each tier hands its own path list to `.github/actions/changed-paths`, and
    # everything downstream of that answer — the build steps, and the deploy job's `if:` — reads it.
    # `K8sTierPathGatingSpec` runs the real matcher over the real lists and asserts a web-only
    # change does not reach the worker. Keep the lists apart; a union quietly undoes all of this.
    #
    # ONE WIDENING THE FOLD COULD NOT AVOID: both lists name this file, because this file is now
    # where both tiers' build steps live — so editing it redeploys BOTH tiers, where editing
    # `build-web-image.yaml` used to leave the worker alone. A workflow edit restarting the worker
    # is the same trade the old worker workflow made with its own filename; there is no sub-file
    # granularity to be had.
    #
    # BOTH TIERS `needs: ci`, which the standalone workflows did not. They deployed to the cluster
    # the moment their image built, tests or no tests — a push that failed ci still rolled a broken
    # web image onto kinowo.net. It also keeps the runner budget intact: the account's 20 concurrent
    # jobs are spoken for at t=0 by ci's 19 plus `build-image` (CiRunnerBudgetSpec), and a job that
    # waits for ci takes a slot ci has already given back.
    build-web:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential: the built-in GITHUB_TOKEN can push to
            # GHCR.
            packages: write

        outputs:
            changed: ${{ steps.changed.outputs.changed }}

        steps:
            # Full history, BLOBLESS — the changed-paths gate below diffs against the push's `before`
            # commit, which a shallow checkout would not have. Same shape as the Fly deploy job's
            # roll-back guard: commit topology and tree ids only, so no blob of history is fetched.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Did this push touch the web tier?
              id: changed
              uses: ./.github/actions/changed-paths
              with:
                  # THE WEB TIER'S FILTER SET. Deliberately NOT the worker's — see the note above.
                  patterns: |
                      web/**
                      common/**
                      build.sbt
                      project/**
                      Dockerfile
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - uses: actions/setup-java@v5
              if: steps.changed.outputs.changed == 'true'
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              if: steps.changed.outputs.changed == 'true'

            - name: Stage the web distribution
              if: steps.changed.outputs.changed == 'true'
              # `web/stage` only: staging the worker as well would roughly double the sbt time for
              # an artifact this job does not consume — `build-worker` stages its own.
              run: sbt "web/stage"

            - name: Place the staged distribution where the Dockerfile expects it
              if: steps.changed.outputs.changed == 'true'
              # The Dockerfile's context is whitelisted down to `stage/` alone (see .dockerignore),
              # which is why this copy exists rather than the Dockerfile reaching into
              # target/universal/stage: .dockerignore cannot reliably re-include a deep path whose
              # parents are excluded by `*`.
              run: rm -rf stage && cp -r web/target/universal/stage stage

            - uses: docker/login-action@v3
              if: steps.changed.outputs.changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: steps.changed.outputs.changed == 'true'

            - name: Build and push
              if: steps.changed.outputs.changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY. The cluster is Hetzner x86_64; adding arm64 would double the build
                  # for a platform nothing here runs, and the emulated leg is the slow one.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=web
                      COMMIT_SHA=${{ github.sha }}
                  # BOTH TAGS, ALWAYS. The SHA tag is what a deploy pins, so a restarted pod comes
                  # back on the exact build that was deployed; `latest` exists only so a
                  # hand-applied manifest resolves to something. Never deploy `latest` — a pod that
                  # restarts under it can come back on a different build with nothing recording
                  # which.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}
                      ghcr.io/${{ github.repository_owner }}/movies-web:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-web:
        # SEPARATE JOB, `needs: build-web`, so a failed build cannot deploy and a failed deploy is
        # distinguishable from a failed build in the run list — the two have completely different
        # fixes.
        needs: build-web
        runs-on: ubuntu-latest

        # The web tier's path gate, at job level: `build-web` published the answer as an output, so
        # a push that changed nothing web-shaped produces a skipped deploy rather than a rollout.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without putting it on production.
        if: needs.build-web.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE DEPLOY AT A TIME, AND DO NOT CANCEL A RUNNING ONE — within the limits of the
        # workflow-level group, which can still supersede this (see the concurrency note at the top).
        #
        # A GROUP OF ITS OWN, separate from the worker's: the two tiers are independent rollouts and
        # sharing a group would make a web deploy wait behind a worker deploy for no reason.
        concurrency:
            group: deploy-web-k8s
            cancel-in-progress: false

        steps:
            - name: Roll the new image onto k3s
              # NO kubectl, NO kubeconfig, NO cluster credential in CI AT ALL — one ssh command whose
              # payload is an image reference, against a key pinned to a forced command on
              # monitoring-1 (infra/nix/modules/roles/k8s-deploy.nix). That endpoint decides which
              # Deployments an image belongs to FROM THE REPOSITORY NAME, so `movies-web` rolls
              # web-pl/-de/-uk/-us and nothing else; the same key cannot be talked into deploying
              # anything not in its target list.
              #
              # THIS IS A ROLLING UPDATE OF THE ONLY USER-FACING TIER. The Deployments carry
              # maxUnavailable: 0 with a readiness probe, so the replacement pod serves before the
              # old one is terminated and the site does not go dark mid-deploy.
              env:
                  DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_SSH_KEY }}
              run: |
                  set -euo pipefail

                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/k8sdeploy
                  chmod 600 ~/.ssh/k8sdeploy

                  # accept-new, not `no`: the host key is pinned on first use within this ephemeral
                  # runner and the connection is to a fixed address that terraform/primary_ips.tf
                  # keeps stable.
                  ssh -i ~/.ssh/k8sdeploy \
                      -o BatchMode=yes \
                      -o StrictHostKeyChecking=accept-new \
                      -o ConnectTimeout=15 \
                      k8sdeploy@2.28.52.210 \
                      "ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}"

    build-worker:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential.
            packages: write

        outputs:
            changed: ${{ steps.changed.outputs.changed }}

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Did this push touch the worker tier?
              id: changed
              uses: ./.github/actions/changed-paths
              with:
                  # THE WORKER TIER'S FILTER SET. `worker/**` where the web's says `web/**`, and that
                  # is the whole point: a web-only push must not reach this job's build, let alone
                  # `deploy-worker`, because deploying a worker restarts it into a scrape storm.
                  patterns: |
                      worker/**
                      common/**
                      build.sbt
                      project/**
                      Dockerfile
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - uses: actions/setup-java@v5
              if: steps.changed.outputs.changed == 'true'
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              if: steps.changed.outputs.changed == 'true'

            - name: Stage the worker distribution
              if: steps.changed.outputs.changed == 'true'
              # `worker/stage` only, not `web/stage` — this job builds one image and staging the web
              # app as well would roughly double the sbt time for an artifact nothing here consumes.
              run: sbt "worker/stage"

            - name: Place the staged distribution where the Dockerfile expects it
              if: steps.changed.outputs.changed == 'true'
              # The Dockerfile's context is whitelisted down to `stage/` alone (see .dockerignore),
              # which is why this copy exists rather than the Dockerfile reaching into
              # target/universal/stage: .dockerignore cannot reliably re-include a deep path whose
              # parents are excluded by `*`.
              run: rm -rf stage && cp -r worker/target/universal/stage stage

            - uses: docker/login-action@v3
              if: steps.changed.outputs.changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: steps.changed.outputs.changed == 'true'

            - name: Build and push
              if: steps.changed.outputs.changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY. The cluster is Hetzner x86_64; adding arm64 would double the build
                  # for a platform nothing here runs, and the emulated leg is the slow one.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=worker
                      COMMIT_SHA=${{ github.sha }}
                  # BOTH TAGS, ALWAYS. The SHA tag is what a deploy pins, so a restarted pod comes
                  # back on the exact build that was deployed; `latest` exists only so a
                  # hand-applied manifest resolves to something. Never deploy `latest` — a pod that
                  # restarts under it can come back on a different build with nothing recording
                  # which.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}
                      ghcr.io/${{ github.repository_owner }}/movies-worker:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-worker:
        # SEPARATE JOB, `needs: build-worker`, so a failed build cannot deploy and a failed deploy is
        # distinguishable from a failed build in the run list — the two have completely different
        # fixes.
        needs: build-worker
        runs-on: ubuntu-latest

        # THE GATE THAT MATTERS. A restarted worker cold-boots into a scrape storm, so this job runs
        # only when the push actually touched the worker's inputs — never because the web tier moved.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without putting it on production; separating that is the difference between "let me see if
        # it compiles" and a deploy.
        if: needs.build-worker.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE DEPLOY AT A TIME, AND DO NOT CANCEL A RUNNING ONE — within the limits of the
        # workflow-level group, which can still supersede this (see the concurrency note at the top).
        concurrency:
            group: deploy-worker-k8s
            cancel-in-progress: false

        steps:
            - name: Roll the new image onto k3s
              # NO kubectl, NO kubeconfig, NO cluster credential in CI AT ALL. The whole interaction
              # is one ssh command whose payload is an image reference, against a key pinned to a
              # forced command on monitoring-1 (infra/nix/modules/roles/k8s-deploy.nix). That
              # endpoint validates the reference against one allowed repository, patches one
              # container in one Deployment, and waits for the rollout.
              #
              # The reason is that k3s writes exactly ONE credential and it is cluster-admin. Giving
              # that to a GitHub runner would trade a worker rollout for every Secret in the cluster.
              env:
                  DEPLOY_KEY: ${{ secrets.K8S_DEPLOY_SSH_KEY }}
              run: |
                  set -euo pipefail

                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/k8sdeploy
                  chmod 600 ~/.ssh/k8sdeploy

                  # accept-new, not `no`: the host key is pinned on first use within this ephemeral
                  # runner and the connection is to a fixed address that terraform/primary_ips.tf
                  # keeps stable. A known_hosts file checked into the repo would be one more thing to
                  # rotate by hand after every `convert-host`, which regenerates the host key.
                  ssh -i ~/.ssh/k8sdeploy \
                      -o BatchMode=yes \
                      -o StrictHostKeyChecking=accept-new \
                      -o ConnectTimeout=15 \
                      k8sdeploy@2.28.52.210 \
                      "ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}"
