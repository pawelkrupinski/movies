name: Main

on:
    push:
        branches: [main]
    # No inputs. The only one this workflow ever had was `force_worker_deploy`,
    # which forced past the Fly worker deploy's no-op guard; the worker is a k3s
    # pod now and CI does not deploy it, so there is nothing here to force.
    workflow_dispatch:

# Workflow-level concurrency: a newer push cancels the older workflow
# mid-flight, freeing its runners so the latest commit's jobs don't queue
# behind stale work. GitHub Free allows 20 concurrent jobs across the
# account and a push wants all 20 (see the RUNNER BUDGET note in ci.yml),
# so two overlapping pushes would otherwise halve each other.
#
# WHAT THAT COSTS NOW THAT THE k3s DEPLOY NO LONGER HAPPENS HERE AT ALL, stated
# rather than left to be rediscovered: a superseding push cancels an in-flight
# `record-web` / `record-worker` too, and no job-level `cancel-in-progress: false`
# can refuse a workflow-level cancellation. It used to cancel an ssh call that was
# WATCHING a rollout; there is no rollout here any more, so what it cancels is the
# marker write — and that is survivable precisely because the gate MEASURES FROM
# the marker rather than from the push's parent: a cancelled run leaves its commit
# inside the next push's interval instead of dropping it. The deploy is untouched
# either way, because CI does not perform one: the image is in GHCR, and
# image-automation ships it on its own schedule. Do not trade the cancellation
# away — the runner budget above depends on it.
#
# The Fly deploy JOB has NO concurrency group of its own, deliberately: GitHub
# keeps one running plus one pending per group, so back when that job was a
# six-app matrix a group covering a tier CANCELLED the third app rather than
# queueing it, and apps silently stopped deploying for days.
# DeployParallelismConfigSpec is there to stop one coming back — do not add one
# here either.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

# Pipeline shape:
#
#                                                             ┌─► deploy (kinowo, the retired Fly redirect host)
#   ci (reusable workflow — lint, test, integration,          ├─► kick-convergence
#       ios/android local-server, page-tests) ─────────────── ─┼─► build-web ──► record-web
#                                                             └─► build-worker ──► record-worker
#
# ONE WORKFLOW, because there used to be three: this file plus
# `build-web-image.yaml` and `build-worker-image.yaml`, which built the GHCR
# images the k3s cluster actually serves. They are folded in below; what had to
# survive the fold is their DIFFERENT `on.push.paths` filters, which is why the
# tiers are now gated per JOB — see the note over `build-web`.
#
# The whole build+test pipeline lives in ci.yml as a `workflow_call`
# reusable workflow so it has exactly one definition; branch-ci.yml
# runs the same thing on every PR. Here on push-to-main we run it and,
# once green, deploy. `secrets: inherit` hands the called workflow the
# ZYTE / TMDB / MONGODB secrets its test jobs need.
#
jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    # Take the runners back from an in-flight convergence run, so this push's jobs
    # do not queue behind it. No `needs:` — it starts with ci's jobs and is
    # normally done well before them.
    #
    # It stages independently rather than taking a build artifact from ci. It
    # used to: `test` uploaded `stage-web` / `stage-worker` and the deploy leg
    # downloaded them. But those only exist once `test` finishes, and waiting for
    # that is exactly what put the container build on the critical path — so the
    # artifacts were dropped rather than kept for a consumer that no longer
    # exists. `test` still STAGES both apps, because that is what proves the dist
    # links and ships no Scaladoc on a PR run (branch-ci.yml never reaches this
    # file); it just doesn't publish the result any more.
    #
    # Both images are built unconditionally, including the worker's on a push
    # that will skip the worker deploy. Building is not restarting: the skip
    # guard exists to protect the worker from a cold-boot scrape storm, and an
    # unreleased image in the registry costs nothing but builder time.
    # ONLY THE WEB IMAGE IS EVER RELEASED, and only to `kinowo` — the one leg of the `deploy`
    # matrix below that is `enabled: true` (see the rule stated there). The worker image and the
    # other five legs' images are built and then sit in the registry unreleased, because both tiers
    # otherwise run on k3s and are shipped by the GHCR jobs at the bottom of this file.
    #
    # THE HALF OF `build-image` THAT WAS NOT REDUNDANT.
    #
    # That job built a second copy of an image GHCR already had, on a Fly builder
    # this project does not run — but it also took the runners back off the
    # convergence suite, and it did that from a job with NO `needs:`, which is the
    # only place it works: the runners come free while ci's jobs are still
    # queueing. Moved into anything that waits for ci it would free nothing, which
    # `DeployImageReuseSpec` measured.
    #
    # So the build went and this stayed, as ~10s of runner rather than ~85s. It
    # still holds the account's 20th concurrent slot, which is why removing the
    # image build freed no runner for ci to spend.
    free-runners:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        steps:
            # FIRST, before this job does any work of its own: take the runners
            # back off the convergence suite.
            #
            # 20 concurrent jobs is the whole account's allowance, and this run
            # wants all 20. A convergence run in flight holds 3 of them for
            # anywhere from 25 to 90 minutes, so a push landing in that window
            # doesn't get 3 of its jobs until a convergence leg finishes. Measured:
            # 17 jobs started at once and 3 waited, one of them the longest job in
            # the build — the run took 10m28s against a 7m critical path.
            #
            # Cancelling costs that suite very little, because it is already the
            # thing that yields: its own workflow keeps one lane with
            # `cancel-in-progress`, so the next push was going to throw the run away
            # regardless — 6 of 10 consecutive runs ended `cancelled` — and
            # `kick-convergence` re-dispatches it from this same run a few minutes
            # later, against the newer commit. This just makes the preemption
            # happen at the START of the deploy, where it frees runners, instead of
            # at the end, where it frees nothing. The nightly 04:20 schedule remains
            # the guaranteed-to-finish signal either way.
            #
            # The runners do not come back instantly: GitHub takes ~80s to tear a
            # cancelled job down, so a deploy that lands mid-convergence still has
            # a job or two start late — measured at +76s, against +3s for the rest.
            # Better than waiting out a convergence leg, but not free, and worth
            # knowing before someone re-measures and thinks this step did nothing.
            #
            # It cancels a HAND-STARTED convergence run too. If you dispatched one
            # deliberately and want its answer, don't push while it runs.
            #
            # NOT the `US convergence` build, and the workflow is named explicitly here
            # so it can't be. That one is a separate workflow precisely so nothing
            # preempts it: its leg runs for hours recording the enrichment tree that
            # makes the NEXT one fast, so a run cancelled here has published nothing and
            # its replacement starts just as cold — the supersede loop the split exists
            # to break, reintroduced from the runner-budget side and indistinguishable
            # from an ordinary supersede in the run list. It holds two of the twenty
            # concurrent jobs while it runs; that is the price. (DeployImageReuseSpec)
            - name: Take the runners back from any in-flight convergence run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -uo pipefail
                  # Anything not already finished — a QUEUED run counts: it holds no
                  # runner yet, but it takes the first ones to free up, which is
                  # precisely the ones this deploy is waiting for.
                  for id in $(gh run list --workflow "Country convergence" --limit 20 \
                                  --json databaseId,status \
                                  --jq '.[] | select(.status != "completed") | .databaseId'); do
                      echo "cancelling convergence run $id to free its runners"
                      gh run cancel "$id" || true
                  done

    # THE ONE THING FLY.IO STILL HOSTS FROM THIS REPOSITORY: the Polish web app
    # `kinowo`, which is what `kinowo.fly.dev` resolves to. There is no matrix here
    # any more, and that absence is the point — a matrix is a place to add a row,
    # and every row anyone would add would put a SECOND copy of a live service on a
    # host with none of the traffic, against the same databases.
    #
    # THE WHOLE PRODUCT MOVED TO KUBERNETES 2026-08-29: the three sites and all
    # three workers run as pods on k3s (movies-gitops/), on domains this project
    # owns — kinowo.net and showtimes.cc, countries served as paths — built by
    # `build-web` / `build-worker` at the bottom of this file and rolled out by
    # Flux. Their Fly apps, configs and deploy legs are gone; restoring one means
    # writing it again from `fly.toml`, which is the right amount of friction.
    #
    # `kinowo` survives as the RETIRED redirect host for links that predate the
    # move. `fly.toml` sets `KINOWO_RETIRED=true`, which boots
    # `modules.RetiredComponents` instead of the serving app (docs/domain-cutover.md)
    # — a composition root with no `Wiring` mixed in, so it cannot open a Mongo
    # client whatever this job deploys. The flag lives in the fly config rather than
    # here, which is what makes tracking `main` safe: this job cannot un-retire the
    # host, only ship it a newer build of the same redirects.
    #
    # Each push therefore costs the retired host a rolling restart. That is the
    # accepted price of it not drifting away from `main` — the alternative was a
    # hand-rolled deploy nobody would remember to run. (`FlyDeployScopeSpec`)
    deploy:
        needs: [ci, build-web]
        runs-on: ubuntu-latest
        # NO concurrency group. GitHub keeps one running plus one pending per group,
        # so back when this was a six-app matrix a per-tier group CANCELLED the third
        # app rather than queueing it and one app silently missed every deploy for
        # days. One app cannot hit that, but the group would be inherited by whoever
        # re-grows this job — so it stays off, and DeployParallelismConfigSpec says so.
        steps:
            # Full history, because the roll-back guard below needs
            # `git merge-base` against whatever commit is live and that can be
            # arbitrarily old — but BLOBLESS. The guard reads commit topology and
            # tree object ids, never file contents, so fetching every blob in the
            # history (fixture corpus included) was ~15s of pure waste on the
            # deploy's critical path. `filter: blob:none` lazily fetches a blob
            # only if something asks for one; nothing here does.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            - uses: superfly/flyctl-actions/setup-flyctl@v1

            # Decide whether this app actually needs a deploy. Two skip reasons,
            # both fail-open (any probe error → deploy):
            #
            #  (1) Nothing was built for the web tier, so there is no tag to
            #      release. The image comes from `build-web`, which is path-gated:
            #      a push that does not touch the tier pushes no tag for it. That
            #      is the right answer — an unchanged tier needs no deploy — but it
            #      has to be said HERE, or the release names a tag that was never
            #      pushed and reddens a green build.
            #
            #  (2) Roll-back guard: the running machine carries COMMIT_SHA from the
            #      Dockerfile build-arg; if this workflow's commit is an ANCESTOR of
            #      the live one, a newer build already shipped and re-deploying
            #      would roll it back. (First-ever deploy: no machine → empty probe
            #      → proceed.)
            - name: Decide whether to deploy
              id: guard
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: |
                  if [ "${{ needs.build-web.outputs.changed }}" != "true" ]; then
                      echo "::notice::Skipping kinowo — the web tier did not change, so no image was built for this commit."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  deployed=$(flyctl ssh console -a kinowo -C 'printenv COMMIT_SHA' 2>/dev/null || echo "")
                  if [ -n "$deployed" ] && [ "$deployed" != "${{ github.sha }}" ]; then
                      if git merge-base --is-ancestor "${{ github.sha }}" "$deployed" 2>/dev/null; then
                          echo "::warning::Skipping kinowo — commit $deployed (descendant of ${{ github.sha }}) is already live"
                          echo "skip=true" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  fi

            # Release only — no `--build-arg`: COMMIT_SHA was baked in when the
            # image was built.
            #
            # THE IMAGE COMES FROM GHCR, which `build-web` pushes from the same
            # Dockerfile with the same build-args for the cluster. It used to be
            # built a SECOND time, by a `build-image` job running on Fly's remote
            # builder, purely so this line could say `registry.fly.io`. That builder
            # is not something this project runs — the org has no builder app, so
            # every build cold-provisioned one, and roughly two runs in five died on
            # `timed out connecting to machine: authentication handshake failed`
            # while producing bytes GHCR already had. The package is public, so Fly
            # pulls it with no credential.
            - name: Release the image GHCR already built
              if: steps.guard.outputs.skip != 'true'
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: flyctl deploy -c fly.toml -a kinowo -i ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}

            # Drop a vertical marker on the self-hosted Grafana carrying this
            # commit's SHA + subject, so a metric regression on the dashboard
            # lines up visually with the release that caused it — the "I deploy X
            # and a service degrades" loop, made legible.
            #
            # Rides this job rather than one of its own: a job costs ~10s of
            # spin-up on the critical path to run a 200ms curl. No-ops (doesn't
            # fail the deploy) until the Grafana secrets are set.
            - name: Mark deploy in Grafana
              if: steps.guard.outputs.skip != 'true'
              env:
                  GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
                  GRAFANA_ANNOTATION_TOKEN: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  SHA: ${{ github.sha }}
                  MSG: ${{ github.event.head_commit.message }}
              run: |
                  if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_ANNOTATION_TOKEN:-}" ]; then
                      echo "Grafana annotation secrets unset — skipping deploy marker."
                      exit 0
                  fi
                  short="${SHA:0:7}"
                  subject="$(printf '%s' "$MSG" | head -1)"
                  now="$(( $(date +%s) * 1000 ))"
                  body="$(jq -n --argjson time "$now" \
                      --arg text "deploy ${short} — ${subject} (${SHA})" \
                      '{time: $time, tags: ["deploy", "main"], text: $text}')"
                  # NEVER FAIL THE DEPLOY OVER A MARKER. This step failed the whole `kinowo` leg on
                  # 2026-08-29 -- `curl -fsS` returned 35 because GRAFANA_URL still named
                  # kinowo-grafana.fly.dev, which had been scaled to zero machines when Grafana moved
                  # to monitoring-1. The web app had already deployed successfully; the run went red
                  # for an annotation.
                  #
                  # A deploy marker is an aid to reading a dashboard later. It is not a release
                  # gate, and a red run for a missing annotation trains people to ignore red runs on
                  # the workflow that actually ships production.
                  if curl -fsS --max-time 20 -X POST "${GRAFANA_URL%/}/api/annotations" \
                      -H "Authorization: Bearer ${GRAFANA_ANNOTATION_TOKEN}" \
                      -H "Content-Type: application/json" \
                      -d "$body"; then
                      echo "Posted deploy marker for ${short}."
                  else
                      echo "::warning title=Deploy marker not posted::Grafana at ${GRAFANA_URL%/} did not accept the annotation for ${short}. The deploy itself succeeded."
                  fi

    # Kick the country convergence suite off ALONGSIDE the deploy matrix — same
    # `needs: ci` the legs have, so the dispatch goes out the moment the build is
    # green and the suite runs concurrently with the six flyctl legs.
    #
    # Two shapes this deliberately is not:
    #
    #  * Not a `workflow_run` trigger on this workflow. `workflow_run` fires on ANY
    #    completion, `failure` and `cancelled` included, and GitHub gives no way to
    #    filter on conclusion in `on:` — the only gate available was a job-level
    #    `if`, which still CREATES a run that then skips. Those runs were not merely
    #    noise: concurrency is evaluated at RUN level, before the `if`, so a run
    #    destined to skip claimed the lane and cancelled whatever was genuinely in
    #    flight. One killed a leg 21.5 minutes into real work, and since every push
    #    cancels the previous deploy, a burst of pushes produced a burst of
    #    skipped-but-cancelling runs and nothing completed for a day. An explicit
    #    dispatch inverts that: no dispatch, no run, nothing cancelled.
    #
    #  * Not `needs: deploy`. Convergence never reads the deployed machines — every
    #    leg runs against its own MongoDB container and a recorded corpus — and
    #    nothing gates the deploy on its result, so waiting for six flyctl legs only
    #    pushed a tens-of-minutes suite later into the window where the next push's
    #    dispatch supersedes it. Starting with the legs is the earliest this commit's
    #    answer can exist. (DeployParallelismConfigSpec)
    #
    # That superseding is still real for the SHARED suite: it keeps one lane with
    # `cancel-in-progress`, so a push landing mid-run throws that run away. Running in
    # parallel buys the run a deploy's worth of head start against it; it does not
    # remove it. The nightly 04:20 schedule stays the guaranteed-to-finish signal.
    #
    # The US build is the exception, and the reason there are two dispatches below: its
    # lane is `cancel-in-progress: false`, so a run in flight always finishes and this
    # dispatch queues behind it, cancelling only whatever else was queued.
    kick-convergence:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Start the country convergence suite
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  echo "ci green for ${GITHUB_SHA:0:9} — dispatching Country convergence"
                  gh workflow run "Country convergence" --ref "${GITHUB_REF_NAME}"
                  # Two lanes, two dispatches. The US runs the same leg from its own
                  # workflow, on a lane that does NOT cancel in progress — so this
                  # dispatch usually finds a run already in flight and simply queues
                  # behind it, replacing whatever was queued before. That is the
                  # intended shape: finish the run that is going, then pick up the
                  # newest commit and drop the rest.
                  echo "ci green for ${GITHUB_SHA:0:9} — dispatching US convergence"
                  gh workflow run "US convergence" --ref "${GITHUB_REF_NAME}"

    # ── The k3s tiers ────────────────────────────────────────────────────────────────────────────
    #
    # These four jobs were two workflows of their own until they were folded in here
    # (`build-web-image.yaml`, `build-worker-image.yaml`). They build the images the CLUSTER runs —
    # the Fly `deploy` matrix above is disabled top to bottom, so THIS is the deploy that ships
    # production.
    #
    # WHAT THE FOLD HAD TO PRESERVE, and the single most important property of the whole file: the
    # two workflows carried DIFFERENT `on.push.paths` filters, and that difference is load-bearing.
    # A web-only change must not rebuild and redeploy the worker, because deploying a worker
    # restarts it and a restarted worker cold-boots into a scrape storm that drains the shared-CPU
    # credit. That is the entire reason the worker's deploy is path-gated.
    #
    # `on.push.paths` is workflow-level, so one workflow cannot carry two filters. The gating is
    # therefore per JOB: each tier hands its own path list to `.github/actions/changed-paths`, and
    # everything downstream of that answer — the build steps, and the deploy job's `if:` — reads it.
    # `K8sTierPathGatingSpec` runs the real matcher over the real lists and asserts a web-only
    # change does not reach the worker. Keep the lists apart; a union quietly undoes all of this.
    #
    # ONE WIDENING THE FOLD COULD NOT AVOID: both lists name this file, because this file is now
    # where both tiers' build steps live — so editing it redeploys BOTH tiers, where editing
    # `build-web-image.yaml` used to leave the worker alone. A workflow edit restarting the worker
    # is the same trade the old worker workflow made with its own filename; there is no sub-file
    # granularity to be had.
    #
    # BOTH TIERS `needs: ci`, which the standalone workflows did not. They deployed to the cluster
    # the moment their image built, tests or no tests — a push that failed ci still rolled a broken
    # web image onto kinowo.net. It also keeps the runner budget intact: the account's 20 concurrent
    # jobs are spoken for at t=0 by ci's 19 plus `free-runners` (CiRunnerBudgetSpec), and a job that
    # waits for ci takes a slot ci has already given back.
    build-web:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential: the built-in GITHUB_TOKEN can push to
            # GHCR.
            packages: write

        outputs:
            changed: ${{ steps.changed.outputs.changed }}

        steps:
            # Full history, BLOBLESS — the changed-paths gate below diffs against the last DEPLOYED
            # commit, which a shallow checkout would not have. Same shape as the Fly deploy job's
            # roll-back guard: commit topology and tree ids only, so no blob of history is fetched.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: What is the web tier actually running?
              id: base
              uses: ./.github/actions/deployed-base
              with:
                  tier: web

            - name: Has the web tier changed since then?
              id: changed
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base.outputs.base }}
                  # THE WEB TIER'S FILTER SET. Deliberately NOT the worker's — see the note above.
                  patterns: |
                      web/**
                      common/**
                      build.sbt
                      project/**
                      Dockerfile
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - uses: actions/setup-java@v5
              if: steps.changed.outputs.changed == 'true'
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              if: steps.changed.outputs.changed == 'true'

            - name: Stage the web distribution
              if: steps.changed.outputs.changed == 'true'
              # `web/stage` only: staging the worker as well would roughly double the sbt time for
              # an artifact this job does not consume — `build-worker` stages its own.
              run: sbt "web/stage"

            - name: Place the staged distribution where the Dockerfile expects it
              if: steps.changed.outputs.changed == 'true'
              # The Dockerfile's context is whitelisted down to `stage/` alone (see .dockerignore),
              # which is why this copy exists rather than the Dockerfile reaching into
              # target/universal/stage: .dockerignore cannot reliably re-include a deep path whose
              # parents are excluded by `*`.
              run: rm -rf stage && cp -r web/target/universal/stage stage

            - uses: docker/login-action@v3
              if: steps.changed.outputs.changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: steps.changed.outputs.changed == 'true'

            - name: Compute an orderable image tag
              id: tag
              if: steps.changed.outputs.changed == 'true'
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Build and push
              if: steps.changed.outputs.changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY. The cluster is Hetzner x86_64; adding arm64 would double the build
                  # for a platform nothing here runs, and the emulated leg is the slow one.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=web
                      COMMIT_SHA=${{ github.sha }}
                  # THREE TAGS, ALWAYS, each doing a different job. The SHA tag is provenance:
                  # a pod that restarts comes back on the exact build, and a human can map it to a
                  # commit. The `main-<utc>-<sha7>` tag is the one Flux actually DEPLOYS, because
                  # image automation has to pick the newest by sorting and neither of the others
                  # sorts. `latest` survives only so a hand-applied manifest resolves to something.
                  # Never deploy `latest` — a pod that restarts under it can come back on a
                  # different build with nothing recording which.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}
                      ghcr.io/${{ github.repository_owner }}/movies-web:${{ steps.tag.outputs.value }}
                      ghcr.io/${{ github.repository_owner }}/movies-web:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    record-web:
        # A JOB OF ITS OWN RATHER THAN A STEP INSIDE `build-web`, and the reason is the TOKEN.
        # Moving the marker is a ref write; `build-web` runs sbt and a Docker build, which is
        # arbitrary project code. Keeping the write-capable token in a job that does nothing but
        # call `gh api` is the difference between a build that could push to this repository and
        # one that could not.
        needs: build-web
        runs-on: ubuntu-latest

        # Moving the `deployed-web` marker below is a ref write, and the only one this job makes.
        permissions:
            contents: write

        # The web tier's gate, at job level: `build-web` published the answer as an output, so a
        # push that changed nothing web-shaped since the last marker move skips this entirely. A
        # cancelled or skipped run leaves the change inside the interval and the next push covers
        # it — the property that keeps a superseding push from losing work it cancelled mid-flight.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without claiming one was published for production.
        if: needs.build-web.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Two runs moving the same tag concurrently
        # is last-write-wins, and the loser could be the newer commit — which would walk the marker
        # BACKWARDS and re-ship work already covered.
        concurrency:
            group: record-web-marker
            cancel-in-progress: false

        steps:
            - name: Record that an image exists for this commit
              # ⚠️ THIS MARKER NO LONGER MEANS "WHAT IS LIVE", AND THAT IS THE POINT OF THE CHANGE
              # THAT RENAMED THIS JOB. It used to move only after `rollout status` returned, because
              # CI did the rolling, over an ssh forced command carrying an image reference. CI does
              # not deploy any more: image-automation commits the winning tag into
              # movies-gitops/web/base/all.yaml and kustomize-controller applies it. What this
              # records is "an image for this commit was built and pushed", which is exactly the
              # question the path gate above asks and nothing more.
              #
              # WHAT IS LIVE IS NOW READ FROM GIT. The `image:` line in that manifest IS the
              # deployed tag, and `git log` on the file is the deploy history. Whether the cluster
              # has caught up is Flux's business, and it is ALERTED ON rather than inferred from a
              # green CI run — nix/files/monitoring/rules/flux.rules, which exists precisely so
              # that retiring this ssh step did not trade a loud failure for a silent one.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-web" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-web -f sha='${{ github.sha }}'

    build-worker:
        needs: ci
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential.
            packages: write

        outputs:
            changed: ${{ steps.changed.outputs.changed }}

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: What is the worker tier actually running?
              id: base
              uses: ./.github/actions/deployed-base
              with:
                  tier: worker

            - name: Has the worker tier changed since then?
              id: changed
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base.outputs.base }}
                  # THE WORKER TIER'S FILTER SET. `worker/**` where the web's says `web/**`, and that
                  # is the whole point: a web-only push must not reach this job's build, let alone
                  # its image, because a new worker image restarts it into a scrape storm.
                  patterns: |
                      worker/**
                      common/**
                      build.sbt
                      project/**
                      Dockerfile
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - uses: actions/setup-java@v5
              if: steps.changed.outputs.changed == 'true'
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              if: steps.changed.outputs.changed == 'true'

            - name: Stage the worker distribution
              if: steps.changed.outputs.changed == 'true'
              # `worker/stage` only, not `web/stage` — this job builds one image and staging the web
              # app as well would roughly double the sbt time for an artifact nothing here consumes.
              run: sbt "worker/stage"

            - name: Place the staged distribution where the Dockerfile expects it
              if: steps.changed.outputs.changed == 'true'
              # The Dockerfile's context is whitelisted down to `stage/` alone (see .dockerignore),
              # which is why this copy exists rather than the Dockerfile reaching into
              # target/universal/stage: .dockerignore cannot reliably re-include a deep path whose
              # parents are excluded by `*`.
              run: rm -rf stage && cp -r worker/target/universal/stage stage

            - uses: docker/login-action@v3
              if: steps.changed.outputs.changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: steps.changed.outputs.changed == 'true'

            - name: Compute an orderable image tag
              id: tag
              if: steps.changed.outputs.changed == 'true'
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Build and push
              if: steps.changed.outputs.changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY. The cluster is Hetzner x86_64; adding arm64 would double the build
                  # for a platform nothing here runs, and the emulated leg is the slow one.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=worker
                      COMMIT_SHA=${{ github.sha }}
                  # THREE TAGS, ALWAYS, each doing a different job. The SHA tag is provenance:
                  # a pod that restarts comes back on the exact build, and a human can map it to a
                  # commit. The `main-<utc>-<sha7>` tag is the one Flux actually DEPLOYS, because
                  # image automation has to pick the newest by sorting and neither of the others
                  # sorts. `latest` survives only so a hand-applied manifest resolves to something.
                  # Never deploy `latest` — a pod that restarts under it can come back on a
                  # different build with nothing recording which.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}
                      ghcr.io/${{ github.repository_owner }}/movies-worker:${{ steps.tag.outputs.value }}
                      ghcr.io/${{ github.repository_owner }}/movies-worker:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    record-worker:
        # A JOB OF ITS OWN RATHER THAN A STEP INSIDE `build-worker`, for the token: `build-worker`
        # runs sbt and a Docker build, and this holds a ref-write token. Keeping them apart is the
        # difference between a build that could push to this repository and one that could not.
        needs: build-worker
        runs-on: ubuntu-latest

        # Moving the `deployed-worker` marker below is a ref write, and the only one this job makes.
        permissions:
            contents: write

        # THE GATE THAT MATTERS, AND IT STILL MATTERS. A restarted worker cold-boots into a scrape
        # storm, so the tier is rebuilt only when its own inputs moved — never because the web tier
        # did. What changed is only what the marker MEANS: it is the last commit an image was built
        # for, so a worker change whose run was cancelled is still inside the interval at the next
        # push and takes exactly one restart when it lands.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without claiming one was published for production.
        if: needs.build-worker.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Concurrent moves of the same tag are
        # last-write-wins, and the loser could be the newer commit — walking the marker backwards
        # and re-shipping work already covered.
        concurrency:
            group: record-worker-marker
            cancel-in-progress: false

        steps:
            - name: Record that an image exists for this commit
              # ⚠️ THIS MARKER NO LONGER MEANS "WHAT IS LIVE" — see the note on `record-web`. CI no
              # longer rolls anything: image-automation commits the winning tag into
              # movies-gitops/worker/base/all.yaml and kustomize-controller applies it. Whether
              # the cluster has caught up is Flux's business and is alerted on directly, rather
              # than inferred from a green run here.
              # would diff from a commit production never ran.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-worker" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-worker -f sha='${{ github.sha }}'
