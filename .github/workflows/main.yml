name: Main

on:
    push:
        branches: [main]
    # No inputs: CI deploys nothing itself (Flux ships the GHCR images), so there
    # is nothing here to force.
    workflow_dispatch:

# Workflow-level concurrency: a newer push cancels the older workflow
# mid-flight, freeing its runners so the latest commit's jobs don't queue
# behind stale work. GitHub Free allows 20 concurrent jobs across the
# account and a push wants 16 of them at once (see the RUNNER BUDGET note in
# ci.yml), so two overlapping pushes would otherwise starve each other.
#
# WHAT THAT COSTS NOW THAT THE k3s DEPLOY NO LONGER HAPPENS HERE AT ALL, stated
# rather than left to be rediscovered: a superseding push cancels an in-flight
# `record-web` / `record-worker` too, and no job-level `cancel-in-progress: false`
# can refuse a workflow-level cancellation. It used to cancel an ssh call that was
# WATCHING a rollout; there is no rollout here any more, so what it cancels is the
# marker write — and that is survivable precisely because the gate MEASURES FROM
# the marker rather than from the push's parent: a cancelled run leaves its commit
# inside the next push's interval instead of dropping it. The deploy is untouched
# either way, because CI does not perform one: the image is in GHCR, and
# image-automation ships it on its own schedule. Do not trade the cancellation
# away — the runner budget above depends on it.
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

# Pipeline shape:
#
#                                                             ┌─► kick-convergence
#   ci (reusable workflow — lint, test, integration,          ├─► build-web ──► record-web
#       ios/android local-server, page-tests) ─────────────── ─┴─► build-worker ──► record-worker
#   gates (t=0: which tiers changed since their last deploy) ──┘  (both builds need it too)
#
# ONE WORKFLOW, because there used to be three: this file plus
# `build-web-image.yaml` and `build-worker-image.yaml`, which built the GHCR
# images the k3s cluster actually serves. They are folded in below; what had to
# survive the fold is their DIFFERENT `on.push.paths` filters, which is why the
# tiers are now gated per JOB — see the note over `build-web`.
#
# The whole build+test pipeline lives in ci.yml as a `workflow_call`
# reusable workflow so it has exactly one definition; branch-ci.yml
# runs the same thing on every PR. Here on push-to-main we run it and,
# once green, deploy. `secrets: inherit` hands the called workflow the
# TMDB / MONGODB secrets its test jobs need.
#
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit
        # ci.yml's jobs post JUnit check-runs, and its `image-*` jobs push this commit's SHA-tagged
        # images; a called workflow can only narrow its caller's token, never widen it.
        permissions:
            contents: read
            checks: write
            packages: write

    # The images are BUILT WHILE ci RUNS and only PUBLISHED here. ci's `image-web` and this workflow's
    # `image-worker` build them from the dists ci's `e2e (staging)` row staged, while ci's slowest rows
    # still run, and push them under the commit SHA alone — a tag nothing deploys. `build-web` /
    # `build-worker` below `needs: ci` (the worker's also `needs: image-worker`),
    # and for a tier whose paths changed give those bytes the tags that ship: a registry manifest copy
    # of seconds where they used to restage (~2 min of cold `sbt stage`) and build (~1.7 min) on the
    # post-ci critical path. (DeployImageReuseSpec)
    #
    # Both images are built on every main push, including a tier whose paths did not change: building
    # is not shipping. An unpublished SHA-tagged image costs registry space and builder time on runners
    # ci's e2e rows have already given back, nothing else.
    # `free-runners` — the job that used to sit here, cancelling any in-flight
    # `Country convergence` run to take its runners back for the Fly deploy — was
    # retired 2026-09-08 alongside that workflow moving to `cancel-in-progress:
    # false`. Cancelling a run that lane no longer intends to throw away would
    # destroy real progress rather than merely accelerate a supersede that was
    # coming anyway. See `country-convergence.yml`'s `concurrency:` block.
    #
    # This job used to occupy a concurrent slot at t=0. That slot now goes to
    # `gates` below, for the few seconds it takes to answer the tier gates
    # (`CiRunnerBudgetSpec`).

    # Seconds, at t=0. It takes the one slot ci.yml leaves it (beside the headroom kept for
    # overlapping workflows) for the few seconds it runs (CiRunnerBudgetSpec). No secret is checked
    # here: the Grafana marker's are optional by design (mark-grafana-deploy skips without them), and
    # nothing else in this workflow reads one beyond what ci.yml's own jobs check.
    gates:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # EACH TIER'S GATE, answered here at t=0 rather than inside its build job after ci, so both
        # builds start the moment ci is green. A marker that moves between t=0 and ci's end can only
        # make a gate say "changed" more often, never skip a tier that did change.
        outputs:
            web-changed: ${{ steps.changed-web.outputs.changed }}
            worker-changed: ${{ steps.changed-worker.outputs.changed }}
        steps:
            # Full history, BLOBLESS — the tier gates below diff against each tier's last DEPLOYED
            # commit, which a shallow checkout would not have; commits and trees only.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            - name: What is the web tier actually running?
              id: base-web
              uses: ./.github/actions/deployed-base
              with:
                  tier: web

            - name: Has the web tier changed since then?
              id: changed-web
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-web.outputs.base }}
                  # THE WEB TIER'S FILTER SET. Deliberately NOT the worker's — see the note above.
                  patterns: |
                      web/**
                      common/**
                      build.sbt
                      project/**
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - name: What is the worker tier actually running?
              id: base-worker
              uses: ./.github/actions/deployed-base
              with:
                  tier: worker

            - name: Has the worker tier changed since then?
              id: changed-worker
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-worker.outputs.base }}
                  # THE WORKER TIER'S FILTER SET. `worker/**` where the web's says `web/**`, and that
                  # is the whole point: a web-only push must not reach this job's build, let alone
                  # its image, because a new worker image restarts it into a scrape storm.
                  # NOT the test sources: tests run in ci on every push, and a push that changed only
                  # them ships an image running the same code — 11 of 71 worker restarts in the 24 h to
                  # 2026-10-01, each ~350 CPU-seconds of JIT and boot re-seeding per worker.
                  patterns: |
                      worker/**
                      !worker/src/test/**
                      !worker/src/it/**
                      !worker/src/fixtures/**
                      common/**
                      !common/src/test/**
                      build.sbt
                      project/**
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**


    # Kick the country convergence suite off ALONGSIDE the image builds — same
    # `needs: ci` they have, so the dispatch goes out the moment the build is
    # green.
    #
    # Two shapes this deliberately is not:
    #
    #  * Not a `workflow_run` trigger on this workflow. `workflow_run` fires on ANY
    #    completion, `failure` and `cancelled` included, and GitHub gives no way to
    #    filter on conclusion in `on:` — the only gate available was a job-level
    #    `if`, which still CREATES a run that then skips. Those runs were not merely
    #    noise: concurrency is evaluated at RUN level, before the `if`, so a run
    #    destined to skip claimed the lane and cancelled whatever was genuinely in
    #    flight. One killed a leg 21.5 minutes into real work, and since every push
    #    cancels the previous deploy, a burst of pushes produced a burst of
    #    skipped-but-cancelling runs and nothing completed for a day. An explicit
    #    dispatch inverts that: no dispatch, no run, nothing cancelled.
    #
    #  * Not after a deploy. Convergence never reads the deployed machines — every
    #    leg runs against its own MongoDB container and a recorded corpus — and
    #    nothing gates a deploy on its result, so waiting for the (since removed) Fly
    #    deploy legs only pushed a tens-of-minutes suite later into the window where the next push's
    #    dispatch supersedes it. Starting with the legs is the earliest this commit's
    #    answer can exist. (KickConvergenceWiringSpec)
    #
    # Both suites' lanes are `cancel-in-progress: false` (country-convergence.yml's
    # `concurrency:` block), so a run in flight always finishes and a dispatch queues
    # behind it, replacing only whatever was queued before. Two lanes, two dispatches:
    # the US runs the same leg from its own workflow.
    kick-convergence:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: read
        steps:
            # Full history, BLOBLESS: the gate diffs this push against the head of each
            # suite's newest run, which can be several pushes back.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            # Both convergence suites — the pipeline's and the identity model's — on the same
            # gate: only for a push that can change a verdict (`.github/convergence-paths.txt`),
            # each diffed from the head of ITS OWN newest run.
            # Each lane keeps one run pending and every newer dispatch replaces it, so
            # dispatching for an app- or docs-only push used to evict the pending run of the
            # pipeline commit before it — see the script's header for the measurement.
            - name: Start the convergence suites this push can change
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: .github/scripts/kick-convergence.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" "Country convergence" "Identity model convergence"

    # The flaky-test ledger. Every test job in ci.yml that FAILED reran its failed tests three
    # times and uploaded the ones that passed any rerun as `flaky-*` (scripts/ci/flake_verdict.py);
    # this appends them to the one open "Flaky test ledger" issue. The run is red either way. A
    # job of its own, holding `issues: write`, so no job that runs project code holds it.
    flake-ledger:
        needs: ci
        if: always() && needs.ci.result == 'failure' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - uses: actions/download-artifact@v6
              with:
                  pattern: flaky-*
                  path: flaky
            - name: Append this run's flaky tests to the ledger
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  mapfile -t files < <(find flaky -name flaky.tsv 2>/dev/null)
                  scripts/ci/flake-ledger.sh --run-url "$RUN_URL" --sha "$GITHUB_SHA" --assignee "$OWNER" "${files[@]}"

    # ── The k3s tiers ────────────────────────────────────────────────────────────────────────────
    #
    # These four jobs were two workflows of their own until they were folded in here
    # (`build-web-image.yaml`, `build-worker-image.yaml`). They publish the images the CLUSTER runs,
    # which is how production ships.
    #
    # WHAT THE FOLD HAD TO PRESERVE, and the single most important property of the whole file: the
    # two workflows carried DIFFERENT `on.push.paths` filters, and that difference is load-bearing.
    # A web-only change must not rebuild and redeploy the worker, because deploying a worker
    # restarts it and a restarted worker cold-boots into a scrape storm that drains the shared-CPU
    # credit. That is the entire reason the worker's deploy is path-gated.
    #
    # `on.push.paths` is workflow-level, so one workflow cannot carry two filters. The gating is
    # therefore per JOB: each tier hands its own path list to `.github/actions/changed-paths`, and
    # everything downstream of that answer — the publish steps and the `record-*` markers — reads it.
    # `K8sTierPathGatingSpec` runs the real matcher over the real lists and asserts a web-only
    # change does not reach the worker. Keep the lists apart; a union quietly undoes all of this.
    #
    # ONE WIDENING THE FOLD COULD NOT AVOID: both lists name this file, because this file is now
    # where both tiers' build steps live — so editing it redeploys BOTH tiers, where editing
    # `build-web-image.yaml` used to leave the worker alone. A workflow edit restarting the worker
    # is the same trade the old worker workflow made with its own filename; there is no sub-file
    # granularity to be had.
    #
    # BOTH TIERS `needs: ci`, which the standalone workflows did not. They deployed to the cluster
    # the moment their image built, tests or no tests — a push that failed ci still rolled a broken
    # web image onto kinowo.net. It also keeps the runner budget intact: ci's jobs are the only
    # ones spoken for at t=0 now that `free-runners` is retired, and a job that waits for ci takes a
    # slot ci has already given back (`CiRunnerBudgetSpec`).
    build-web:
        needs: [ci, gates]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential: the built-in GITHUB_TOKEN can push to
            # GHCR.
            packages: write

        outputs:
            changed: ${{ needs.gates.outputs.web-changed }}

        steps:
            # No checkout: the tier's gate is `gates`', and publishing is a registry copy of the
            # image ci built.
            - uses: docker/login-action@v3
              if: needs.gates.outputs.web-changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: needs.gates.outputs.web-changed == 'true'

            - name: Compute an orderable image tag
              id: tag
              if: needs.gates.outputs.web-changed == 'true'
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Publish the image ci built under the tags that ship it
              if: needs.gates.outputs.web-changed == 'true'
              # ci's `image-web` job built this commit's image while the rest of ci ran, and pushed it
              # under its SHA tag ONLY — a tag nothing deploys. This job runs only once ci is green, and
              # gives those same bytes the two names that ship: `main-<utc>-<sha7>`, the one Flux's image
              # automation sorts and DEPLOYS, and `latest`, so a hand-applied manifest resolves to
              # something (never deploy `latest`: a restart under it can come back on another build). A
              # manifest copy in the registry — seconds — instead of the ~1.7 min build it replaces on
              # the post-ci critical path. The SHA tag stays the provenance tag.
              run: |
                  set -euo pipefail
                  docker buildx imagetools create \
                      -t ghcr.io/${{ github.repository_owner }}/movies-web:${{ steps.tag.outputs.value }} \
                      -t ghcr.io/${{ github.repository_owner }}/movies-web:latest \
                      ghcr.io/${{ github.repository_owner }}/movies-web:${{ github.sha }}

    record-web:
        # A JOB OF ITS OWN RATHER THAN A STEP INSIDE `build-web`, and the reason is the TOKEN.
        # Moving the marker is a ref write; `build-web` runs a Docker build (the Dockerfile and the
        # staged app it trains an AOT cache with), which is arbitrary project code. Keeping the
        # write-capable token in a job that does nothing but call `gh api` is the difference
        # between a build that could push to this repository and one that could not.
        needs: build-web
        runs-on: ubuntu-latest

        # Moving the `deployed-web` marker below is a ref write, and the only one this job makes.
        permissions:
            contents: write

        # The web tier's gate, at job level: `build-web` published the answer as an output, so a
        # push that changed nothing web-shaped since the last marker move skips this entirely. A
        # cancelled or skipped run leaves the change inside the interval and the next push covers
        # it — the property that keeps a superseding push from losing work it cancelled mid-flight.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without claiming one was published for production.
        if: needs.build-web.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Two runs moving the same tag concurrently
        # is last-write-wins, and the loser could be the newer commit — which would walk the marker
        # BACKWARDS and re-ship work already covered.
        concurrency:
            group: record-web-marker
            cancel-in-progress: false

        steps:
            - name: Record that an image exists for this commit
              # ⚠️ THIS MARKER NO LONGER MEANS "WHAT IS LIVE", AND THAT IS THE POINT OF THE CHANGE
              # THAT RENAMED THIS JOB. It used to move only after `rollout status` returned, because
              # CI did the rolling, over an ssh forced command carrying an image reference. CI does
              # not deploy any more: image-automation commits the winning tag into
              # movies-gitops/web/base/all.yaml and kustomize-controller applies it. What this
              # records is "an image for this commit was built and pushed", which is exactly the
              # question the path gate above asks and nothing more.
              #
              # WHAT IS LIVE IS NOW READ FROM GIT. The `image:` line in that manifest IS the
              # deployed tag, and `git log` on the file is the deploy history. Whether the cluster
              # has caught up is Flux's business, and it is ALERTED ON rather than inferred from a
              # green CI run — nix/files/monitoring/rules/flux.rules, which exists precisely so
              # that retiring this ssh step did not trade a loud failure for a silent one.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-web" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-web -f sha='${{ github.sha }}'

            # Only a checkout so the local composite action below is on disk —
            # `gh api` above needs no working tree.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: .github
                  sparse-checkout-cone-mode: false

            # An image existing for this commit is the closest thing CI has to a
            # "web tier shipped" event now that Flux, not CI, does the rolling —
            # see the note above. Marking it here, rather than waiting for Flux to
            # actually converge, trades a few minutes of lag for a marker that
            # still exists at all.
            - name: Mark deploy in Grafana
              uses: ./.github/actions/mark-grafana-deploy
              with:
                  tier: web
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  sha: ${{ github.sha }}
                  commit-message: ${{ github.event.head_commit.message }}

    # THE WORKER IMAGE, BUILT AND AOT-TRAINED WHILE ci RUNS — and OUTSIDE ci, so `build-web` (which
    # `needs: ci`) never waits for the ~5 min training: only `build-worker` needs this job. It takes
    # the slot `gates` gives back seconds in (CiRunnerBudgetSpec counts only jobs without `needs`),
    # then waits for the dist ci's `e2e (staging)` row uploads to this same run — `needs: ci` would
    # also wait for every other ci row. SAFETY: it pushes this commit's SHA tag ONLY. Nothing deploys
    # a SHA tag; `build-worker` gives these bytes the tags that ship (`main-<utc>-<sha7>`, `latest`)
    # only once ci is green and the tier's paths changed (DeployImageReuseSpec).
    image-worker:
        needs: gates
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            # To see ci's artifacts and jobs while ci still runs.
            actions: read
            # The built-in GITHUB_TOKEN can push to GHCR; no new credential.
            packages: write
        steps:
            - uses: actions/checkout@v5

            - name: Wait for the worker distribution ci's e2e staging row stages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: scripts/ci/wait-for-run-artifact.sh stage-worker "e2e (staging)" 900

            - name: Fetch the worker distribution the e2e staging row staged
              # Straight into `stage/`, the only path the Dockerfile's whitelisted context
              # (.dockerignore) can see. The artifact drops file modes; the Dockerfile's
              # `chmod +x bin/*` restores the one that matters.
              uses: actions/download-artifact@v6
              with:
                  name: stage-worker
                  path: stage

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build and push the image before its AOT training
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # amd64 ONLY: the cluster is Hetzner x86_64.
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BIN=worker
                      COMMIT_SHA=${{ github.sha }}
                  # Not the SHA tag: that one names the image WITH its trained cache, pushed below.
                  # `untrained-latest` carries the inline cache the next build reuses (base OS, JRE,
                  # libvips); the shipped image's top layer is the cache, which no build reuses.
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}-untrained
                      ghcr.io/${{ github.repository_owner }}/movies-worker:untrained-latest
                  cache-from: |
                      type=registry,ref=ghcr.io/${{ github.repository_owner }}/movies-worker:untrained-latest
                      type=registry,ref=ghcr.io/${{ github.repository_owner }}/movies-worker:latest
                  cache-to: type=inline

            - name: Train its AOT cache on a replayed boot, and push it under this commit's SHA tag only
              # Archives the classes a running worker loads, not only the listed ones (no method
              # profiles) — see the script and modules.AotTrainingMain. The corpus is the tracked one
              # the checkout above brought.
              run: >-
                  scripts/ci/train-worker-aot.sh
                  ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}-untrained
                  ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}
                  "$GITHUB_WORKSPACE/test/resources/fixtures" 08-06-2026 240

    build-worker:
        needs: [ci, gates, image-worker]
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # The whole reason this needs no new credential.
            packages: write

        outputs:
            changed: ${{ needs.gates.outputs.worker-changed }}

        steps:
            - uses: docker/login-action@v3
              if: needs.gates.outputs.worker-changed == 'true'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3
              if: needs.gates.outputs.worker-changed == 'true'

            - name: Compute an orderable image tag
              id: tag
              if: needs.gates.outputs.worker-changed == 'true'
              # WHY A THIRD TAG EXISTS. Flux's image automation chooses "the newest image" by
              # SORTING tag names, and neither tag below can be sorted: a commit SHA has no order
              # at all, and `latest` is one moving name rather than a series. This adds a tag that
              # does sort -- a UTC timestamp, monotonic in real time -- keeping the short SHA on
              # the end so the tag still says which commit built it. ImagePolicy extracts the
              # number and takes the maximum; see movies-gitops/flux/image-automation.yaml.
              #
              # NOT `github.run_number`, which is monotonic only until the workflow file is renamed
              # or recreated. A reset there would leave the highest OLD number winning forever and
              # freeze deploys silently, which is the failure mode this whole stage exists to end.
              run: |
                  set -euo pipefail
                  sha='${{ github.sha }}'
                  echo "value=main-$(date -u +%Y%m%d%H%M%S)-${sha:0:7}" >> "$GITHUB_OUTPUT"

            - name: Publish the image ci built under the tags that ship it
              if: needs.gates.outputs.worker-changed == 'true'
              # `image-worker` above built this commit's image while ci ran, and pushed it
              # under its SHA tag ONLY — a tag nothing deploys. This job runs only once ci is green, and
              # gives those same bytes the two names that ship: `main-<utc>-<sha7>`, the one Flux's image
              # automation sorts and DEPLOYS, and `latest`, so a hand-applied manifest resolves to
              # something (never deploy `latest`: a restart under it can come back on another build). A
              # manifest copy in the registry — seconds — instead of the ~1.7 min build it replaces on
              # the post-ci critical path. The SHA tag stays the provenance tag.
              run: |
                  set -euo pipefail
                  docker buildx imagetools create \
                      -t ghcr.io/${{ github.repository_owner }}/movies-worker:${{ steps.tag.outputs.value }} \
                      -t ghcr.io/${{ github.repository_owner }}/movies-worker:latest \
                      ghcr.io/${{ github.repository_owner }}/movies-worker:${{ github.sha }}

    record-worker:
        # A JOB OF ITS OWN RATHER THAN A STEP INSIDE `build-worker`, for the token: `build-worker`
        # runs a Docker build that executes project code, and this holds a ref-write token.
        # Keeping them apart is the difference between a build that could push to this
        # repository and one that could not.
        needs: build-worker
        runs-on: ubuntu-latest

        # Moving the `deployed-worker` marker below is a ref write, and the only one this job makes.
        permissions:
            contents: write

        # THE GATE THAT MATTERS, AND IT STILL MATTERS. A restarted worker cold-boots into a scrape
        # storm, so the tier is rebuilt only when its own inputs moved — never because the web tier
        # did. What changed is only what the marker MEANS: it is the last commit an image was built
        # for, so a worker change whose run was cancelled is still inside the interval at the next
        # push and takes exactly one restart when it lands.
        #
        # PUSHES TO main ONLY. A workflow_dispatch on a branch should be able to BUILD an image
        # without claiming one was published for production.
        if: needs.build-worker.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'

        # ONE AT A TIME, AND DO NOT CANCEL A RUNNING ONE. Concurrent moves of the same tag are
        # last-write-wins, and the loser could be the newer commit — walking the marker backwards
        # and re-shipping work already covered.
        concurrency:
            group: record-worker-marker
            cancel-in-progress: false

        steps:
            - name: Record that an image exists for this commit
              # ⚠️ THIS MARKER NO LONGER MEANS "WHAT IS LIVE" — see the note on `record-web`. CI no
              # longer rolls anything: image-automation commits the winning tag into
              # movies-gitops/worker/base/all.yaml and kustomize-controller applies it. Whether
              # the cluster has caught up is Flux's business and is alerted on directly, rather
              # than inferred from a green run here.
              # would diff from a commit production never ran.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  gh api --method PATCH \
                      "/repos/${{ github.repository }}/git/refs/tags/deployed-worker" \
                      -f sha='${{ github.sha }}' -F force=true \
                    || gh api --method POST \
                      "/repos/${{ github.repository }}/git/refs" \
                      -f ref=refs/tags/deployed-worker -f sha='${{ github.sha }}'

            # Only a checkout so the local composite action below is on disk —
            # `gh api` above needs no working tree.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: .github
                  sparse-checkout-cone-mode: false

            # An image existing for this commit is the closest thing CI has to a
            # "worker tier shipped" event now that Flux, not CI, does the rolling —
            # see the note on `record-web`.
            - name: Mark deploy in Grafana
              uses: ./.github/actions/mark-grafana-deploy
              with:
                  tier: worker
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
                  sha: ${{ github.sha }}
                  commit-message: ${{ github.event.head_commit.message }}
