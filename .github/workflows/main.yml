# Purpose: Main's pipeline: build, test and publish the images Flux deploys; its rows are the gate
name: Main

on:
    push:
        branches: [main]
    # No inputs: CI deploys nothing itself (Flux ships the GHCR images), so there
    # is nothing here to force.
    workflow_dispatch:

# ONE RUNNING, ONE PENDING; NEVER CANCELLED (2026-10-22). A push's run finishes and publishes; a newer
# push queues behind it, and a newer push replaces it while it waits (github.com does this itself). So under a
# burst of pushes the run in flight still lands, and the next run covers every
# push since -- the tier gates measure from the deployed MARKER, so a skipped push's commits stay inside
# the next run's interval.
#
# It used to cancel the run in flight (`cancel-in-progress: true`), for GitHub Free's 20-job budget.
# With ~10 agents pushing that meant 39 of 51 runs on 2026-10-21 were
# cancelled (906 runner-minutes thrown away) and only 8 completed: builds and deploys rarely landed.
# The job-level `publish-*` lanes stay as a second guard against two publishes racing a tag.
# (WorkflowConcurrencyConventionSpec)
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

# WHERE IMAGES GO: registry.kinowo.net (infra/nix/modules/roles/registry.nix), the registry Flux's
# ImageRepositories scan (FluxImageAutomationSpec), pushed as `ci` with the REGISTRY_PASSWORD secret
# (infra/k8s-secrets/github-secrets.map). Fixed here, not in repository variables: those were set on
# one forge only, and github.com fell back to ghcr.io and logged in
# there as the pushing actor with registry.kinowo.net's password -- `denied` (Main #2030).
env:
    IMAGE_REPO: registry.kinowo.net
    REGISTRY_HOST: registry.kinowo.net
    REGISTRY_USER: ci

# Pipeline shape:
#
#   ci (reusable workflow — lint, test, integration, ──┬─► publish-web
#       ios/android local-server, page-tests;           └─► publish-worker
#       its e2e (corpus) row builds both images)        │
#   gates (t=0: which tiers changed since their   ──────┘
#          last deploy; both publishes read it)
#   kick-convergence (t=0, whether ci passes or not)
#
# NOTHING SHIPS AFTER A RED ci (2026-10-22): the worker image and both publishes need BOTH `ci` and `gates`
# and run only when both passed, instead of taking runners after the run is already lost.
# `kick-convergence` is the one deliberate exception: it hangs off nothing, because convergence
# builds and judges the commit itself and behind ci it started ~50 min later (see its note).
# (MainAfterRedCiSpec, KickConvergenceWiringSpec)
#
# ONE WORKFLOW, because there used to be three: this file plus
# `build-web-image.yaml` and `build-worker-image.yaml`, which built the GHCR
# images the k3s cluster actually serves. They are folded in below; what had to
# survive the fold is their DIFFERENT `on.push.paths` filters, which is why the
# tiers are now gated per JOB — see the note over `publish-web`.
#
# The whole build+test pipeline lives in ci.yml as a `workflow_call`
# reusable workflow so it has exactly one definition; branch-ci.yml
# runs the same thing on every PR. Here on push-to-main we run it and,
# once green, deploy. `secrets: inherit` hands the called workflow the
# TMDB / MONGODB secrets its test jobs need.
#
# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit
        # ci.yml's jobs post JUnit check-runs, and its `image-*` jobs push this commit's SHA-tagged
        # images; a called workflow can only narrow its caller's token, never widen it. `contents: write` for its
        # `commit rules` job alone, which advances refs/verified/commit-rules when the rules hold on main.
        permissions:
            contents: write
            checks: write
            packages: write
            # ci.yml's `scope` job reads the newest green Main run (gh run list) to know which rows a push can move.
            actions: read

    # The web image is BUILT WHILE ci RUNS and only PUBLISHED here: ci's `e2e (corpus)` row builds it from the
    # dist it staged, while ci's slowest rows still run, and pushes it under the commit SHA alone — a tag
    # nothing deploys. The worker's is built there too, from the dist that row staged
    # (it used to start beside ci too, and kept building after a red row). `publish-web` /
    # `publish-worker` below `needs: ci`,
    # and for a tier whose paths changed give those bytes the tags that ship: a registry manifest copy
    # of seconds where they used to restage (~2 min of cold `sbt stage`) and build (~1.7 min) on the
    # post-ci critical path. (DeployImageReuseSpec)
    #
    # The web image is built on every main push, even when its paths did not change: building is not
    # shipping, and an unpublished SHA-tagged image costs registry space and a runner ci's e2e rows have
    # already given back. So is the worker's (2026-11-01: it was a job of its own, `image-worker`, two queue hops after ci).
    # `free-runners` — the job that used to sit here, cancelling any in-flight
    # convergence run to take its runners back for the Fly deploy — was
    # retired 2026-09-08 alongside that workflow moving to `cancel-in-progress:
    # false`. Cancelling a run that lane no longer intends to throw away would
    # destroy real progress rather than merely accelerate a supersede that was
    # coming anyway. See `identity-model-convergence.yml`'s `concurrency:` block.
    #
    # This job used to occupy a concurrent slot at t=0. That slot now goes to
    # `gates` below, for the few seconds it takes to answer the tier gates
    # (`CiRunnerBudgetSpec`).

    # Seconds, at t=0 beside ci: the slot ci.yml leaves (beside the headroom kept for
    # overlapping workflows) for the few seconds it runs (CiRunnerBudgetSpec). No secret is checked
    # here: the Grafana marker's are optional by design (mark-grafana-deploy skips without them), and
    # nothing else in this workflow reads one beyond what ci.yml's own jobs check.
    gates:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        # EACH TIER'S GATE, answered here at t=0 rather than inside its build job after ci, so both
        # builds start the moment ci is green. A marker that moves between t=0 and ci's end can only
        # make a gate say "changed" more often, never skip a tier that did change.
        outputs:
            web-changed: ${{ steps.changed-web.outputs.changed }}
            worker-changed: ${{ steps.changed-worker.outputs.changed }}
            # Whether this run may ship at all: main only. A dispatch on a branch measures Main and ships nothing.
            ship: ${{ github.ref == 'refs/heads/main' }}
            # whether identity-slice's old-ref compile runs (the `old-ref-compile` row below)
            old-ref-compile: ${{ steps.old-ref-run.outputs.run }}
        steps:
            # Full history, BLOBLESS — the tier gates below diff against each tier's last DEPLOYED
            # commit, which a shallow checkout would not have; commits and trees only.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: What is the web tier actually running?
              id: base-web
              uses: ./.github/actions/deployed-base
              with:
                  tier: web

            - name: Has the web tier changed since then?
              id: changed-web
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-web.outputs.base }}
                  # THE WEB TIER'S FILTER SET. Deliberately NOT the worker's — see the note above.
                  patterns: |
                      web/**
                      geodata/**
                      base/**
                      http/**
                      common/**
                      identity/**
                      build.sbt
                      project/**
                      # The build definition no image is built from (project/ImageInputs.scala's `buildOnly`): the coupling and
                      # test-impact reports, the test guards, `sbt run`'s hooks. A change there publishes nothing (d7a733703 restarted
                      # every worker into a full re-resolve for project/Coupling.scala); ImagePathGateSpec holds the list to the build's.
                      !project/AnalysisUnits.scala
                      !project/ClassCycles.scala
                      !project/ClassReferences.scala
                      !project/Coupling.scala
                      !project/CouplingAnalysis.scala
                      !project/CouplingSimulation.scala
                      !project/DeadCode.scala
                      !project/ExemptionSlack.scala
                      !project/ForkedTests.scala
                      !project/HeadlessSafeInteractionMode.scala
                      !project/ImageInputs.scala
                      !project/ReaderNames.scala
                      !project/SameFileEdges.scala
                      !project/StaleTastyRetry.scala
                      !project/TestImpact.scala
                      !project/TouchedSpecs.scala
                      !project/UnitClasspathGuard.scala
                      !project/UsedNamesAccess.scala
                      !project/Warmup.scala
                      !project/WriteFailureTripwire.scala
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      infra/jvm/web.options
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            - name: What is the worker tier actually running?
              id: base-worker
              uses: ./.github/actions/deployed-base
              with:
                  tier: worker

            - name: Has the worker tier changed since then?
              id: changed-worker
              uses: ./.github/actions/changed-paths
              with:
                  # SINCE THE LAST DEPLOY, not since this push's parent — see the action's own note.
                  base: ${{ steps.base-worker.outputs.base }}
                  # THE WORKER TIER'S FILTER SET. `worker/**` where the web's says `web/**`, and that
                  # is the whole point: a web-only push must not reach this job's build, let alone
                  # its image, because a new worker image restarts it into a scrape storm.
                  # NOT the test sources: tests run in ci on every push, and a push that changed only
                  # them ships an image running the same code — 11 of 71 worker restarts in the 24 h to
                  # 2026-10-01, each ~350 CPU-seconds of JIT and boot re-seeding per worker.
                  patterns: |
                      worker/**
                      !worker/src/test/**
                      !worker/src/it/**
                      !worker/src/fixtures/**
                      geodata/**
                      base/**
                      !base/src/test/**
                      http/**
                      !http/src/test/**
                      !http/src/fixtures/**
                      common/**
                      !common/src/test/**
                      identity/**
                      !identity/src/test/**
                      scrapers/**
                      !scrapers/src/test/**
                      !scrapers/src/fixtures/**
                      # bundled as the worker's /identity-judgements.tsv resource (build.sbt). Every path the image is
                      # built from must be here: ImagePathGateSpec derives them from the build and fails on a miss.
                      test/resources/fixtures/identity-judgements.tsv
                      build.sbt
                      project/**
                      # The build-only definition, as the web's set excludes it (ImagePathGateSpec).
                      !project/AnalysisUnits.scala
                      !project/ClassCycles.scala
                      !project/ClassReferences.scala
                      !project/Coupling.scala
                      !project/CouplingAnalysis.scala
                      !project/CouplingSimulation.scala
                      !project/DeadCode.scala
                      !project/ExemptionSlack.scala
                      !project/ForkedTests.scala
                      !project/HeadlessSafeInteractionMode.scala
                      !project/ImageInputs.scala
                      !project/ReaderNames.scala
                      !project/SameFileEdges.scala
                      !project/StaleTastyRetry.scala
                      !project/TestImpact.scala
                      !project/TouchedSpecs.scala
                      !project/UnitClasspathGuard.scala
                      !project/UsedNamesAccess.scala
                      !project/Warmup.scala
                      !project/WriteFailureTripwire.scala
                      Dockerfile
                      infra/nix/files/heap-dumps.sh
                      infra/jvm/worker.options
                      .github/workflows/main.yml
                      .github/actions/changed-paths/**

            # SINCE THE OLD-REF COMPILE LAST PASSED ON MAIN, not since this push's parent: a queued Main run a newer push
            # replaced never ran, and a tool change in it fell between two pushes' `before`s, never compiled.
            # refs/verified/old-ref-compile (scripts/ci/verified-ref.sh, as the commit rules keep theirs) records the
            # newest commit it held on; a red or replaced run's commits stay in the range until a compile passes with
            # them. No marker yet: the push's `before`. Unreadable, or no ancestor of this commit: no base, so the
            # compile runs (changed-paths says changed for an empty base).
            - name: Where did the old-ref compile last pass on main?
              id: old-ref-base
              env:
                  BEFORE: ${{ github.event.before }}
              run: |
                  if base=$(bash scripts/ci/verified-ref.sh base old-ref-compile); then
                      base=${base:-$BEFORE}
                      git merge-base --is-ancestor "$base" HEAD 2> /dev/null || { echo "$base is no ancestor of HEAD: the compile runs"; base=""; }
                  else
                      echo "refs/verified/old-ref-compile could not be read: the compile runs"; base=""
                  fi
                  echo "old-ref compile's base: ${base:-none}"
                  echo "base=$base" >> "$GITHUB_OUTPUT"
            # The old ref is pinned, so only what this checkout brings to it can change the verdict: the tool files
            # (identity-slice's, scripts/identity-slice-tool-files.txt, and title-trace's, scripts/title-trace-tool-files.txt, every one listed below --
            # IdentitySliceOldRefGateSpec), the scripts that lay the ref out, and the JDK/sbt setup. A push touching none of them skips the compile.
            - name: Did this change touch what identity-slice brings to an old ref?
              id: slice-tools
              uses: ./.github/actions/changed-paths
              with:
                  base: ${{ steps.old-ref-base.outputs.base }}
                  patterns: |
                      worker/src/test/scala/scripts/IdentitySlice.scala
                      worker/src/test/scala/scripts/IdentityExplain.scala
                      worker/src/test/scala/services/identity/IdentitySlicing.scala
                      worker/src/test/scala/services/identity/OlderRefs.scala
                      worker/src/test/scala/services/identity/TitleTrace.scala
                      worker/src/fixtures/scala/tools/**
                      worker/src/fixtures/scala/services/identity/adapters/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identityadapters/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/tmdb/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/agreementasks/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identitystaging/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/lookupfill/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identityvenuepages/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identityprojection/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identitymodel/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identity/vocabulary/OlderRefsPackage.scala
                      worker/src/fixtures/scala/services/identity/measures/OlderRefsPackage.scala
                      common/src/main/scala/tools/TempDirectories.scala
                      scripts/identity-slice
                      scripts/identity-slice-tool-files.txt
                      scripts/identity_slice_cli.py
                      scripts/identity_slice_cli_context.py
                      scripts/identity_slice_cli_drift.py
                      scripts/identity_slice_cli_flow.py
                      scripts/identity_slice_cli_keys.py
                      scripts/identity_slice_cli_modes.py
                      scripts/identity_slice_cli_options.py
                      scripts/identity_slice_cli_run.py
                      scripts/title-trace
                      scripts/title-trace-tool-files.txt
                      scripts/title_trace.py
                      scripts/lib/cli/tool_cli.py
                      scripts/lib/processes/tool_shell.py
                      scripts/identity-tools.sh
                      scripts/tool-conventions.sh
                      scripts/tool-conventions-files.txt
                      scripts/lib/processes/tool_bounded.py
                      scripts/lib/processes/machine.py
                      scripts/lib/vcs/gh_download.py
                      scripts/lib/processes/tool_python.py
                      scripts/lib/cli/tool_countries.py
                      scripts/identity-slice-old-ref-test.sh
                      scripts/ci/verified-ref.sh
                      scripts/ci/verified_ref.py
                      scripts/lib/tool_git.py
                      scripts/lib/tool_process.py
                      .github/actions/setup-sbt-build/**
                      .github/workflows/main.yml

            # THE OLD REFS' DEPENDENCIES (.github/actions/old-ref-deps): the floors' sbt launcher and libraries, which main's
            # dependency cache does not hold, saved by the old-ref compile on main so no run downloads them twice (a 429
            # from Maven Central failed the landing check's old refs, run 44807195909). Asked here, without a download: on
            # a missing entry runs that compile whatever else this plan decided.
            - name: Which old refs' dependency entry would a check restore?
              id: old-ref-deps-key
              run: scripts/ci/old-ref-deps-key.sh >> "$GITHUB_OUTPUT"
            - id: old-ref-deps-paths
              uses: ./.github/actions/sbt-deps-key
            - name: Does GitHub hold it?
              id: old-ref-deps-lookup
              uses: actions/cache/restore@v5
              with:
                  path: ${{ steps.old-ref-deps-paths.outputs.paths }}
                  key: ${{ steps.old-ref-deps-key.outputs.key }}
                  lookup-only: 'true'
            - name: Does the old-ref compile run?
              id: old-ref-run
              # (whatever the ref: only main's run saves, the save step's own condition, CacheSavePolicySpec)
              env:
                  CHANGED: ${{ steps.slice-tools.outputs.changed }}
                  HIT: ${{ steps.old-ref-deps-lookup.outputs.cache-hit }}
              run: |
                  if [ "$CHANGED" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "the push touched what the tools bring to an old ref"
                  elif [ "$HIT" != true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "no cached old-ref dependencies: compiling to save them"
                  else echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing the old refs see changed"
                  fi
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}


    # Kick the convergence suite off AT THE PUSH, behind nothing, never
    # behind `ci`. Convergence builds and judges the commit itself; Main's tests add
    # nothing to its answer. Hung off `ci`, a push whose Main run went red on an unrelated
    # spec never dispatched at all: on 2026-10-15 the Arsenal client's push (f58b71add,
    # 09:29 UTC) got its first convergence run at 11:08, after three cancelled and two red
    # Main runs, while a landing waited on it. 65ed31dbf (2026-10-22) moved it behind
    # `[ci, gates]` with the worker image; that put every dispatch ~50 min after the push,
    # so it is back on `gates` alone (2026-10-23). The worker image and publishes still
    # skip after a red ci (MainAfterRedCiSpec).
    # NO `needs:` (2026-11-01): behind `gates` it was created after ci's second wave (the rows that need only
    # `scope`, seconds in) had taken the account's 20 runners, and queued a median 1.8 min for one, then the
    # suite's preflight queued again: every convergence row was created ~3 min after the push
    # (docs/investigations/2026-11-01-twenty-runners.md). It reads nothing of gates'. At t=0 it is the 2nd
    # main.yml job beside ci (CiRunnerBudgetSpec), holds its runner for seconds, and a row of ci's second
    # wave waits those seconds instead.
    #
    # Two shapes this deliberately is not:
    #
    #  * Not a `workflow_run` trigger on this workflow. `workflow_run` fires on ANY
    #    completion, `failure` and `cancelled` included, and GitHub gives no way to
    #    filter on conclusion in `on:` — the only gate available was a job-level
    #    `if`, which still CREATES a run that then skips. Those runs were not merely
    #    noise: concurrency is evaluated at RUN level, before the `if`, so a run
    #    destined to skip claimed the lane and cancelled whatever was genuinely in
    #    flight. One killed a leg 21.5 minutes into real work, and since every push
    #    cancels the previous deploy, a burst of pushes produced a burst of
    #    skipped-but-cancelling runs and nothing completed for a day. An explicit
    #    dispatch inverts that: no dispatch, no run, nothing cancelled.
    #
    #  * Not after a deploy. Convergence never reads the deployed machines — every
    #    leg runs against its own MongoDB container and a recorded corpus — and
    #    nothing gates a deploy on its result, so waiting for the (since removed) Fly
    #    deploy legs only pushed a tens-of-minutes suite later into the window where the next push's
    #    dispatch supersedes it. Starting with the legs is the earliest this commit's
    #    answer can exist. (KickConvergenceWiringSpec)
    #
    # Both suites' lanes are `cancel-in-progress: false` (identity-model-convergence.yml's
    # `concurrency:` block), so a run in flight always finishes and a dispatch queues
    # behind it, replacing only whatever was queued before. Two lanes, two dispatches:
    # the US runs the same leg from its own workflow.
    kick-convergence:
        # A cancelled run dispatches nothing, and neither does a dispatch on a branch (a measurement of Main itself):
        # convergence judges main's commits.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-26.04
        # Room for the dispatcher's worst case (scripts/lib/vcs/tool_dispatch.py): two rate-limit waits of up to 900 s each
        # (DISPATCH_RATE_LIMIT_MAX_WAIT) before its third attempt, plus the reads and checkout.
        timeout-minutes: 40
        permissions:
            actions: write
            contents: read
        steps:
            # Full history, BLOBLESS: the gate diffs this push against the head of each
            # suite's newest run, which can be several pushes back.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            # Both convergence suites — the pipeline's and the identity model's — on the same
            # gate: only for a push that can change a verdict (`.github/convergence-paths.txt`),
            # each diffed from the head of ITS OWN newest run.
            # Each lane keeps one run pending and every newer dispatch replaces it, so
            # dispatching for an app- or docs-only push used to evict the pending run of the
            # pipeline commit before it — see the script's header for the measurement.
            - name: Start the convergence suites this push can change
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: .github/scripts/kick-convergence.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" "Identity model convergence"
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # ── The k3s tiers ────────────────────────────────────────────────────────────────────────────
    #
    # One `publish-<tier>` job per tier publishes the image the CLUSTER runs, which is how production
    # ships. They were two workflows of their own until they were folded in here
    # (`build-web-image.yaml`, `build-worker-image.yaml`).
    #
    # WHAT THE FOLD HAD TO PRESERVE, and the single most important property of the whole file: the
    # two workflows carried DIFFERENT `on.push.paths` filters, and that difference is load-bearing.
    # A web-only change must not rebuild and redeploy the worker, because deploying a worker
    # restarts it and a restarted worker cold-boots into a scrape storm that drains the shared-CPU
    # credit. That is the entire reason the worker's deploy is path-gated.
    #
    # `on.push.paths` is workflow-level, so one workflow cannot carry two filters. The gating is
    # therefore per JOB: each tier hands its own path list to `.github/actions/changed-paths` in
    # `gates`, and each `publish-<tier>` runs only on its own tier's answer.
    # `K8sTierPathGatingSpec` runs the real matcher over the real lists and asserts a web-only
    # change does not reach the worker. Keep the lists apart; a union quietly undoes all of this.
    #
    # ONE WIDENING THE FOLD COULD NOT AVOID: both lists name this file, because this file is now
    # where both tiers' publish steps live — so editing it redeploys BOTH tiers. There is no
    # sub-file granularity to be had.
    #
    # IDENTITY-SLICE'S OLD REFS, AFTER LANDING (the owner, 2026-11-21, "(5)"): scripts/identity-slice drops this checkout's
    # tool files into every ref it slices; they must compile into old code too (83b869548 broke every older ref). A real
    # sbt compile of each floor scripts/identity-slice-old-ref-test.sh names, of the tree kept across runs. Before
    # landing it was the landing check's `check (oldrefs)` (1 catch in 27 runs, p90 20 min) and off the gate in Tool
    # self-tests after it; now a row of Main, beside ci and needed by no publish: a red is a gate red with a fixer
    # (.github/gating-checks.tsv), and never holds a deploy.
    old-ref-compile:
        name: identity-slice old-ref compile
        # gates decides (WorkflowPlanSpec): a push touching what the tools bring to an old ref, or no cached entry of
        # the old refs' dependencies to restore (this run saves it, .github/actions/old-ref-deps)
        needs: [ gates ]
        if: ${{ needs.gates.outputs.old-ref-compile == 'true' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 40
        permissions:
            # write: a green compile on main advances refs/verified/old-ref-compile (scripts/ci/verified-ref.sh)
            contents: write
        steps:
            # every commit and tree, HEAD's blobs only: the marker's advance proves it moves only forward
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}

            # sbt, the JDK and a compiled target/ to seed the old tree's compile from, restored only: no build here
            # is one to save. The integration rows' family first (every module's main + test), then any.
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
                  target-cache-restore-keys: |
                      sbt-target-it-${{ runner.os }}-
                      sbt-target-unit-worker-${{ runner.os }}-
                      sbt-target-${{ runner.os }}-

            # Over the dependency cache setup-sbt-build restored; on an exact hit every JVM below runs offline.
            - name: Restore the old refs' dependencies
