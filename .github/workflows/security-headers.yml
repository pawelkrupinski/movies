name: Security headers (live)

# Asserts the LIVE sites' security headers against kinowo.net and showtimes.cc -- see
# scripts/ci/check-security-headers.py for the checks and why each exists:
#   - no `Access-Control-Allow-Credentials: true` for a foreign Origin on /api/me (it once granted
#     credentials to any origin);
#   - HSTS max-age of at least a year (it was one week);
#   - `Secure` on the session cookie, enforced while the repository variable
#     REQUIRE_SECURE_SESSION_COOKIE is 'true' (it is: KINOWO_SESSION_SECURE is live on both
#     hosts); unset, a missing `Secure` is only a warning annotation.
#
# Header values are the one layer no test here renders: they are set by Play, Caddy and
# Cloudflare together, on the real hosts only. So this is a synthetic check, not a unit test, and
# the fleet has no blackbox exporter to hang it on.
#
# DIRECT from ci-runner, with the Decodo proxy as a fallback only. Bot Fight Mode challenges
# datacenter IPs on both zones, and on the Free plan its one exception is an IP Access Rule: both
# zones Allow ci-runner (162.55.0.154), and a custom rule blocks that address on kinowo.net /
# showtimes.cc unless the request carries the EDGE_CHECK_KEY secret as `X-Kinowo-Edge-Check`
# (infra/bin/cloudflare-ci-edge-allow). Run #2239 (2026-10-27) is why: Decodo's account went dark
# and a proxy-only check of our own headers went red with it. The checker still FAILS on a
# challenge from either path rather than passing a page that is not ours.
#
# AN ORIGIN NEVER REACHED IS AN ALERT, NOT A RED RUN (ci-failures-2026-10-30, recommendation 2): the checker exits 3
# when every failure is a request the origin never answered (no connection, the proxy dark, a challenge), and
# scripts/ci/alert-step.sh keeps the run green and hands the report job `alert`. A header the origin answered wrongly
# still exits 1 and fails the run: that is our code.

on:
    schedule:
        # Every six hours: a header regression ships with a deploy, and a quarter of a day is
        # well inside "found before anyone relies on it" without spending the proxy's quota.
        - cron: '17 */6 * * *'
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - '.github/workflows/security-headers.yml'
            - 'scripts/ci/check-security-headers.py'
            - 'scripts/ci/check_security_headers_test.py'
            - 'scripts/ci/script_module.py'
            - 'worker/src/main/resources/residential-proxy.properties'
            - 'scripts/ci/scheduled-failure-issue*.sh'
            - 'scripts/ci/open-issue.sh'
            - 'scripts/ci/alert-step.sh'
            - '.github/actions/report-scheduled-run/**'

permissions:
    contents: read


jobs:
    check:
        runs-on: ubuntu-26.04
        # A dead Decodo port is tried once and retired (check-security-headers.py, ProxyPool): the
        # whole pool timing out is 7 x 30 s, and the job must outlive it to name the proxy. The
        # pool is only reached when a direct request is refused.
        timeout-minutes: 10
        outputs:
            alert: ${{ steps.headers.outputs.alert }}
            found: ${{ steps.headers.outputs.found }}
        steps:
            - uses: actions/checkout@v5

            # The checker's own verdicts first, offline: a checker that can no longer fail would
            # otherwise report green here for as long as nobody looked at it.
            - name: Self-test the checker
              run: python3 scripts/ci/check_security_headers_test.py

            # And the reporter the `report` job below (and the OG-card workflow) relies on to reach
            # a person, against a stub `gh`: a reporter that silently stopped opening issues is the
            # exact silence it exists to end.
            - name: Self-test the failure reporter
              run: bash scripts/ci/scheduled-failure-issue-test.sh

            - name: Check kinowo.net and showtimes.cc
              id: headers
              env:
                  EDGE_CHECK_KEY: ${{ secrets.EDGE_CHECK_KEY }}
                  DECODO_PROXY_USER: ${{ secrets.DECODO_PROXY_USER }}
                  DECODO_PROXY_PASS: ${{ secrets.DECODO_PROXY_PASS }}
                  REQUIRE_SECURE_SESSION_COOKIE: ${{ vars.REQUIRE_SECURE_SESSION_COOKIE }}
              run: scripts/ci/alert-step.sh 3 -- python3 scripts/ci/check-security-headers.py

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [check]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit

    # A failed scheduled check becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run.
    report:
        name: report (scheduled run)
        needs: [check, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
                  alert: ${{ needs.check.outputs.alert }}
                  found: ${{ needs.check.outputs.found }}
