name: Retire closed venues

# Started by the worker's daily closure sweep (ClosureSweep → GitHubRetirementDispatch)
# ONLY for venues it has confirmed CLOSED (VenueClosure): their sources dropped them for
# weeks (aggregator page 404/410, fallback empty or gone) AND the venue itself shows it
# has closed — its own website gone, parked or announcing the closure, or a second
# listing that dropped it too. A venue only its sources dropped is a coverage gap: the
# sweep pages it and lists it on /uptime, and never dispatches it here. This run is the
# second, independent check, from outside the fleet: the page the venue's primary scrapes
# (the "page" the sweep sends, else its aggregator page) must answer 404/410 again NOW, and one of the venue-level checks the sweep handed over must
# re-confirm the closure with nothing showing the venue alive, or the venue is kept
# (retire_venues.py). Passing venues go into data/<roster>/retired.json,
# the roster is regenerated, CountrySpec must pass, and a PR is opened for a human to
# merge. It never pushes to main.
#
# A PR opened with GITHUB_TOKEN does not trigger other workflows, so CI does not run on
# it until someone pushes to the branch or closes and reopens it; CountrySpec, the check
# a roster change can break, runs here first.
on:
    workflow_dispatch:
        inputs:
            roster:
                description: 'Data-driven roster under data/'
                required: true
                type: choice
                options: [germany, spain, us]
            venues:
                description: 'JSON array of {"id", "name", "evidence", "page" (optional), "checks": [{"kind": "website" or "listing", "url"}]}'
                required: true
                type: string

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: retire-venues-${{ inputs.roster }}
    cancel-in-progress: false

jobs:
    # github.com keeps ONE pending run per non-cancelling concurrency group; Forgejo queues every one. A run that
    # starts with a newer run of its group already waiting is the one github.com would have dropped: it ends here,
    # green, and every other job skips on the output (.github/actions/supersede-check).
    supersede:
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            superseded: ${{ steps.check.outputs.superseded }}
        steps:
            # Fail OPEN: a check that cannot run must not stop the run's work.
            - if: github.server_url != 'https://github.com'
              continue-on-error: true
              uses: actions/checkout@v5
              with:
                  sparse-checkout: .github/actions/supersede-check
            - id: check
              if: github.server_url != 'https://github.com'
              continue-on-error: true
              uses: ./.github/actions/supersede-check

    retire:
        needs: supersede
        if: needs.supersede.outputs.superseded != 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - name: Test the retirement script
              run: python3 data/scripts/retire_venues_test.py

            - name: Re-check each venue live and retire the confirmed ones
              id: retire
              env:
                  ROSTER: ${{ inputs.roster }}
                  VENUES: ${{ inputs.venues }}
              run: |
                  # The count is read from a file, not piped: without pipefail a crash half-way through the rewrite left an
                  # empty count, which is not '0', and the half-applied roster went on to a PR.
                  python3 data/scripts/retire_venues.py --roster "$ROSTER" --venues "$VENUES" --body "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/retired.out"
                  retired=$(tail -1 "$RUNNER_TEMP/retired.out")
                  echo "retired=$retired" >> "$GITHUB_OUTPUT"
                  cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

            - uses: ./.github/actions/setup-jdk
              if: steps.retire.outputs.retired != '0'
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              if: steps.retire.outputs.retired != '0'

            - name: CountrySpec
              if: steps.retire.outputs.retired != '0'
              run: sbt "common/testOnly models.CountrySpec"

            - name: Open the PR
              if: steps.retire.outputs.retired != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
                  ROSTER: ${{ inputs.roster }}
                  RETIRED: ${{ steps.retire.outputs.retired }}
              run: |
                  branch="retire-venues/${ROSTER}-${GITHUB_RUN_ID}"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git add -A common geodata scrapers worker web data
                  git commit -m "Retire ${RETIRED} closed ${ROSTER} venue(s) the closure sweep confirmed"
                  git push origin "$branch"
                  gh pr create --base main --head "$branch" \
                      --title "Retire ${RETIRED} closed ${ROSTER} venue(s)" --body-file "$RUNNER_TEMP/pr-body.md"

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [supersede, retire]
        if: ${{ needs.supersede.outputs.superseded != 'true' && (!cancelled()) }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit
