#
# ONE country's convergence leg: the fast sample gate, and the full run behind it.
#
# A reusable workflow rather than two matrix jobs in `country-convergence.yml`,
# because GitHub has no way to say "this matrix leg needs THAT matrix leg" —
# `needs:` is between jobs, so a `convergence` matrix waiting on a `sample`
# matrix waits on ALL of it. Three countries then move as one: Poland's sample
# held Germany's and the UK's full legs, and the UK's sample (the slowest, on
# the largest corpus) held everyone's. One country's flap became three
# countries' worth of nothing.
#
# Calling this file once per country gives each pair its own `needs:` edge.
# Germany starts its full leg the moment Germany's sample is green, whatever
# Poland and the UK are doing, and a country whose sample fails stops only
# itself.
#
# The countries stay in separate JOBS (rather than one job running the sample
# first): each leg installs its country's `TitleRuleSet` into `TitleNormalizer`
# process-globally, so two countries sharing a process would overwrite each
# other's normalisation and silently test the wrong rules. Each also gets its
# own MongoDB container and — inside it — a uniquely named database per run
# (`IsolatedMongoDatabase`).
#
# NO `concurrency:` block here, deliberately. The lane belongs to the caller,
# which is one lane for the whole suite; a group named here would be shared by
# all three calls of this file in the same run and they would cancel each other.
#
name: Country convergence leg

on:
    workflow_call:
        inputs:
            country:
                description: The country's name, for job and report titles.
                required: true
                type: string
            code:
                description: The country's two-letter code (pl / de / uk).
                required: true
                type: string
            sample-command:
                description: The sbt alias running this country's ~100-film sample.
                required: true
                type: string
            command:
                description: The sbt alias running this country's full convergence leg.
                required: true
                type: string

env:
    # The rolling release the per-country fixture trees live in. One tag, three assets,
    # each replaced in place — a store, not a history. Marked as a prerelease when
    # created so it never reads as a shipped version of anything.
    #
    # Declared HERE and not only in the caller: workflow-level `env` does not cross
    # into a called workflow, and `convergence-setup` reads this variable.
    FIXTURE_RELEASE_TAG: convergence-fixtures

jobs:
    # THE GATE. A ~100-film leg, ahead of the full run on the same country.
    #
    # It replays the same four assertions the full leg does — fixpoint,
    # order-independence, no-loss, and the production-coverage band — over a sample
    # recorded beside the corpus. Five to eight minutes warm against 12 to 73, and it
    # is a real gate rather than a smoke test: the two regressions this suite has
    # caught (a rating source starved by the one above it, a 404 flattened into an
    # outage by a fallback chain) both showed up on these axes and would both have been
    # caught here.
    #
    # NOT the ~90 seconds this comment used to claim. That was the leg with its
    # enrichment answers already on disk and none of them expired — a state the
    # `~100-film slice rotates nightly` design never actually holds, since a fresh draw
    # from the corpus is a fresh draw of films to enrich. Measured across 2026-08-14 to
    # 08-16 the warm legs run 3m32s to 9m08s; the number here has to cover the cold end
    # of that, not the best case.
    #
    # A separate JOB rather than a first step inside the full leg, so the full leg
    # never starts when the sample already knows the answer — the UK's is 73 minutes
    # and the one most likely to be cancelled on a budget.
    sample:
        name: sample
        runs-on: ubuntu-latest
        # Thirty-two, against the full leg's 135 — and the twenty below is the number
        # that matters. Ten was measured on a WARM tree and quietly assumed the tree
        # would always be warm, which is only true while the full leg keeps running,
        # which is only true while the sample passes. A cold sample cannot fit in ten:
        # Germany's ~100-film slice is ~1.5 minutes of setup, ~1.5 of compile and boot,
        # ~2 of scrape and staging, and then ~11 of live enrichment (measured at 47
        # films in 5m15s on 2026-08-16, every one of them a live fetch), and no budget
        # sized for the warm case can absorb that.
        #
        # Cold is a state this gate has to survive, not an anomaly to be timed out of —
        # a five-day gap in a country's legs is enough to produce it (see
        # `convergence-publish`), and the run that meets it is the run that has to
        # rebuild the tree. Warm, which is the normal case, it still finishes in five to
        # eight minutes and gates the 73-minute leg behind it exactly as before.
        timeout-minutes: 32
        permissions:
            # `contents: write` since the gate publishes the tree it records — see the
            # publish step below for why it has to.
            contents: write
            checks: write
            actions: read
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/convergence-setup
              with:
                  code:  ${{ inputs.code }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            # Bounded BELOW the job's ceiling, for the reason spelled out over the full
            # leg's suite step: a job that hits its own `timeout-minutes` is CANCELLED,
            # and a cancelled job runs its `always()` steps only inside a short grace
            # window. Failing the STEP keeps the job alive so the publish below runs
            # normally. The sample had no step ceiling at all, so it could only ever be
            # cancelled — which is how it spent ten consecutive runs throwing away the
            # capture that would have made the eleventh fast enough to pass.
            - name: Run the ${{ inputs.country }} sample
              shell: bash
              timeout-minutes: 20
              run: |
                  set -o pipefail
                  sbt ${{ inputs.sample-command }} 2>&1 | tee convergence-sample.log
              env:
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  MONGODB_URI:      mongodb://127.0.0.1:27017/?directConnection=true
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
                  OMDB_API_KEY:     ${{ secrets.OMDB_API_KEY }}
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ inputs.code }}

            # The gate REPLAYS the tree and — until now — extended it only in the
            # runner's filesystem, which is discarded with the runner. Every recorded
            # response expires after `EnrichmentFreshness.Ttl`, so a tree only the full
            # leg refreshes is a tree that goes empty five days after that leg last ran;
            # and the full leg runs only behind this one. Publishing here is what stops
            # a red sample from being self-perpetuating.
            - uses: ./.github/actions/convergence-publish
              if: always()
              with:
                  code:  ${{ inputs.code }}
                  token: ${{ secrets.GITHUB_TOKEN }}

    convergence:
        name: convergence
        needs: sample
        runs-on: ubuntu-latest
        # 45 was not enough headroom and cost a real run: on 2026-07-28 the Germany
        # and UK legs were CANCELLED at exactly 45m while Poland finished in 8,
        # because the corpus was mis-sized (Poland's films-per-venue ratio applied
        # to every country — see CountryScrapeCorpus.shapeOf). The sizing is fixed,
        # but a CI runner is a good deal slower than the machine these are timed on,
        # so the ceiling now sits well clear of the expected run rather than just
        # above it. A leg that approaches this is a signal to re-measure the shape,
        # not to raise the number again.
        timeout-minutes: 135
        permissions:
            # `contents: write` for the rolling release the fixture trees live in —
            # see "Publish" below for why that, rather than an artifact.
            contents: write
            checks: write
            # `gh run download` still reads artifacts, for the one-off bootstrap when
            # the release doesn't exist yet.
            actions: read
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/convergence-setup
              with:
                  code:  ${{ inputs.code }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            # Bounded BELOW the job's 135, on purpose — the single most important line
            # in this file for a leg that runs long. Both numbers moved up together (from
            # 62/75) when every collection went onto a real database: the UK replays alone
            # went from ~10 minutes to over 30, and the gap between the two is what pays
            # for the publish steps, so raising one without the other would reintroduce
            # exactly the cancellation this comment exists to prevent.
            #
            # A job that hits its own `timeout-minutes` is CANCELLED, and a cancelled
            # job runs its remaining `always()` steps only inside a short grace window.
            # The steps that have to run here tar and upload 84-152 MB, and losing that
            # race loses the whole point: the cache and the newly recorded responses
            # this leg just spent an hour building, which are exactly what would have
            # made the NEXT run fast enough not to time out. A timeout that discards its
            # own progress cannot converge — every run repeats the same cold sweep.
            #
            # Failing the STEP instead keeps the job alive and un-cancelled, so the
            # publish and upload steps below run normally with the remaining ~10 minutes
            # rather than on borrowed time. The leg still reports failure, loudly; it
            # just doesn't throw away the work first.
            # `tee`d so the findings can be republished as a report below. `pipefail`
            # explicitly, because the default shell is `bash -e` without it and the
            # pipeline would otherwise report `tee`'s exit status and pass a failing
            # suite.
            - name: Run the convergence suite
              id: suite
              shell: bash
              timeout-minutes: 120
              run: |
                  set -o pipefail
                  sbt ${{ inputs.command }} 2>&1 | tee convergence.log
              env:
                  # The spec installs this country's TitleRuleSet itself; naming the
                  # country here too means anything that reads the environment
                  # directly (`Country.soleFromEnv`) agrees with it rather than
                  # falling back to the Poland default.
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  # NO Mongo here, deliberately — not the corpus, not the cache.
                  #
                  # Both URIs used to be set to the shared cluster, reached over a
                  # `flyctl proxy` this job starts nowhere. Every enrichment cache
                  # write therefore blocked for the driver's 5s server selection and
                  # then failed `Connection refused` on 127.0.0.1:27018, and the write
                  # sits on the fetch path — so each of the ~780 live fills cost 5.6s
                  # instead of 0.6s and all three legs were cancelled at the 75-minute
                  # ceiling, still inside `bootCorpus`. (`EnrichmentCache` now suspends
                  # write-through after three refusals, so this can never cost more
                  # than a handful of timeouts again — but the right number of round
                  # trips to a cluster this job cannot reach is zero.)
                  #
                  # Neither one is needed. The corpus comes from the committed fixture
                  # (`CorpusFixture`), and the enrichment answers come from the fixture
                  # tree restored above — which this leg also EXTENDS as it runs and
                  # uploads below, so the loop closes without a tunnel in it.
                  #
                  # Without a real key TmdbClient short-circuits and nothing resolves,
                  # so the real corpus would buy nothing over the generated one.
                  # Replay recorded enrichment answers first; anything genuinely new
                  # falls through to the live chain and is recorded for the next run.
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ inputs.code }}
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
                  # The OMDb rung of ImdbIdResolver is gated on this key
                  # (`omdb = Env.get("OMDB_API_KEY").map(...)`), so without it the
                  # ladder silently runs one rung short of production, which HAS the
                  # secret. Nothing logs the difference — the rung is simply absent.
                  OMDB_API_KEY:     ${{ secrets.OMDB_API_KEY }}
                  # Names the container above, so every repository — movies, screenings,
                  # slots, read model, staging and its transactional folder, tasks,
                  # freshness, chunk-scrape, OMDb attempts and the archive — runs on a
                  # real database.
                  #
                  # Re-enabled once the Mongo path produced a corpus. It had reported
                  # `resolved NOTHING — 0 films`, which was the coverage guard correctly
                  # refusing a fixpoint over nothing; the cause was two different isolated
                  # databases, not the pipeline. Measured locally after the fix: 773 films,
                  # tmdbId 289, the same enrichment ladder the in-memory path produces,
                  # three specs green in 12m05s.
                  #
                  # Absent, the suite runs in memory and says which it chose — a suite that
                  # can silently fall back is one that quietly stops testing what it claims.
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

            # `include_passed: true` — these tests are the report. A convergence leg that
            # PASSES is the interesting case: the run's whole value is the numbers it
            # prints on the way (coverage per rating source, per-tick emissions, films in
            # versus films out), and suppressing passed tests hid every one of them. A
            # suite whose output is only visible when it breaks tells you nothing about
            # the day it worked.
            - name: Publish convergence test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: convergence (${{ inputs.country }})
                  detailed_summary: true
                  include_passed: true

            # The findings, on the run's summary page, per country.
            #
            # ScalaTest's `info(...)` lines carry everything worth knowing about a leg —
            # enrichment coverage down the whole ladder, cache hits versus live fills,
            # cinemas and screenings in versus out, per-tick change-stream emissions —
            # and they were reachable only by downloading a 5 MB job log and grepping it.
            # Three countries' worth of that is a report nobody reads. Rendered here it is
            # the first thing on the page, for a passing run as much as a failing one.
            - name: Report the convergence findings
              if: always()
              shell: bash
              run: |
                  set -uo pipefail
                  if [ ! -s convergence.log ]; then
                      echo "### convergence (${{ inputs.country }})" >> "$GITHUB_STEP_SUMMARY"
                      echo "The suite produced no output — see the job log." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  # sbt colours its output; the escapes are noise in markdown.
                  # `|| true` on every grep. The step declares `shell: bash`, which runs
                  # with `-e`, and grep exits 1 when it matches NOTHING — so a run with no
                  # `Tests:` line killed this step before it printed a character. That is
                  # precisely the cancelled-or-crashed run whose partial output the report
                  # exists to salvage: it failed only when it was most needed, and blamed
                  # the reporting rather than the run.
                  clean=$(sed -E 's/\x1b\[[0-9;]*m//g' convergence.log)
                  totals=$(printf '%s\n' "$clean" | { grep -E '^\[info\] Tests: ' || true; } | tail -1 | sed 's/^\[info\] //')
                  {
                      echo "### convergence (${{ inputs.country }})"
                      echo
                      if [ -n "$totals" ]; then echo "**$totals**"; else echo "**No test totals — the suite did not finish.**"; fi
                      echo
                      echo '```'
                      # The spec's own structure — suite, `should` clauses, the `+` info
                      # lines — PLUS the `[pl] phase done in …` timings the harness prints
                      # as it goes. Those are how a slow leg is diagnosed without attaching
                      # a profiler to a live JVM, so they belong in the report rather than
                      # only in a 5 MB job log. Everything else on stdout is application
                      # logging, which is not a report.
                      printf '%s\n' "$clean" \
                        | { grep -E '^(\[info\] )?([A-Za-z0-9]+Spec:|- should |  \+ |the |\[[a-z]{2}\] )' || true; } \
                        | sed 's/^\[info\] //' \
                        | head -150
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            # The capture this leg just spent an hour building, back to the release it
            # was restored from. Shared with the sample gate above — the two must agree
            # on what publishing means, and a drifted copy would be silent.
            - uses: ./.github/actions/convergence-publish
              if: always()
              with:
                  code:  ${{ inputs.code }}
                  token: ${{ secrets.GITHUB_TOKEN }}
