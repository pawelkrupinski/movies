#
# ONE country's convergence leg: the full run, as one job of matrix rows.
#
# NO ROW RUNS THE ~100-FILM SAMPLE (2026-10-14): it replays a slice of the corpus the suite replays in
# full, so it only ever failed sooner, and once every row fit the lane's 10-minute target that cost more
# than it saved. The sample's corpus-shape specs run instead -- in a hermetic leg's `takes` row, judged
# base against head; in a recording's convergence row, ahead of its suite, reported (`shape-command`).
# The auto-bisect still replays the sample alias per commit (`sample-command`).
#
# DATA IS REPORTED, CODE IS JUDGED (2026-10-14). Whole-corpus findings -- a suspect take no label judges, a
# screening marker left in a query -- are as much the recording's as the code's: armed as gates on 10-13,
# a suspect or marker last night's recording brought turned every push red. The suite's suspect audit and a
# recording's corpus-shape findings now only REPORT (the Identity findings report triages them, one issue a
# country); what a commit's CODE made of them is the `takes` row's to fail, base against head.
#
# A HERMETIC convergence row first fetches, for at most ~90 s, what the previous leg's suite could not
# answer from the pinned pair, publishes it under its own name, and lays it over its tree; only then
# does its suite run, touching no network. Its bisect request carries the published fill in its pair;
# the other rows replay the fills already published (docs/design/convergence-fixture-fill.md).
#
# Order-independence is part of the standard run and belongs inside it; the one country
# whose corpus outgrew a single job (the United States, whose boot and replays are 5.5
# hours together in a job GitHub cancels at 6) splits it into a second MATRIX ROW of the
# same job rather than a job of its own. A conditional job would be rendered and skipped
# for the four countries that don't want it, on every run and every commit. See the
# `convergence` job below.
#
# A reusable workflow called once per country rather than one matrix job in
# `country-convergence.yml` holding every country, so each country reports — and fails —
# on its own: a country whose leg fails stops only itself. (While the sample was a job
# of its own this was also the only way to say "this matrix leg needs THAT matrix leg":
# `needs:` joins jobs, so a `convergence` matrix waiting on a `sample` matrix waited on
# ALL of it, and one country's flap held every other country's full leg.)
#
# The countries stay in separate JOBS (rather than one job running every country): each
# leg installs its country's `TitleRuleSet` into `TitleNormalizer` process-globally, so
# two countries sharing a process would overwrite each other's normalisation and silently
# test the wrong rules. Each also gets its own MongoDB container and — inside it — a
# uniquely named database per run (`IsolatedMongoDatabase`).
#
# NO `concurrency:` block here, deliberately. The lane belongs to the caller,
# which is one lane for the whole suite; a group named here would be shared by
# all three calls of this file in the same run and they would cancel each other.
#
name: Country convergence leg

on:
    workflow_call:
        inputs:
            country:
                description: The country's name, for job and report titles.
                required: true
                type: string
            code:
                description: The country's two-letter code (pl / de / uk / us / es).
                required: true
                type: string
            sample-command:
                description: The sbt alias of this country's ~100-film sample, which a red hermetic leg's auto-bisect replays per commit. No row runs it.
                required: false
                type: string
                default: ''
            command:
                description: The sbt alias running this country's full convergence leg.
                required: true
                type: string
            # The sample's corpus-shape specs, the one part of the sample the full suite does not cover. A HERMETIC
            # leg's `takes` row runs them at the base and the head over its recording and fails only on a finding the
            # head made (identity-takes-check.sh); a RECORDING's convergence row runs them ahead of its suite and
            # reports what they find -- the recording's, to triage from the Identity findings report -- never failing.
            shape-command:
                description: The sbt alias running this country's corpus-shape specs (`corpusShape*`).
                required: false
                type: string
                default: ''
            # THE BUDGETS ARE PER-COUNTRY because the legs are not the same size. They
            # default to what the three original countries have always run on, so a
            # caller that says nothing keeps today's behaviour exactly; the United
            # States passes its own, several times larger.
            #
            # What makes the US different is not its film count — at 1,419 it sits
            # between Poland and Germany — but that it has no warm enrichment tree. A
            # country's FIRST legs fetch every rating and lookup live and publish what
            # they learn, and only once that release asset exists does the leg run at
            # the pace the 135/120 pair was measured against. Give a cold country the
            # warm country's budget and it is cancelled before it can record the very
            # tree that would have made it fast — the self-defeating shape the comment
            # on the step below spells out.
            # The JOB ceilings clear the suite step's ceiling plus setup and the publishes
            # (ConvergenceLegWiringSpec). GitHub expressions have no arithmetic, so the sum is the caller's to state.
            job-timeout-minutes:
                description: Ceiling for the whole convergence row, including setup and publishes.
                required: false
                type: number
                default: 155
            suite-timeout-minutes:
                description: Ceiling for the convergence suite step alone. MUST stay clear of the job's.
                required: false
                type: number
                default: 120
            sample-suite-timeout-minutes:
                description: Ceiling for each sample replay of the auto-bisect this leg requests when it goes red.
                required: false
                type: number
                default: 20
            # THE SECOND FULL RUN, for a country whose corpus no longer fits in one job.
            #
            # Empty for every country but the United States, and a country that leaves it
            # empty expands the `convergence` job below to a single row — there is no
            # second job, and nothing skipped where one would have been. The US full leg boots the
            # corpus in 167 minutes and the whole-corpus order-independence replay costs
            # ~1.5x a boot again (measured on the UK: 2,586s of replays against a 1,676s
            # boot) — 5.5 hours in a job GitHub cancels at 6, which is why no US leg had
            # ever reached the end of that test. Splitting it out is not a weaker claim:
            # the same assertion runs, on the same corpus, in a job sized for it.
            order-command:
                description: >-
                    The sbt alias running this country's order-independence replay as a
                    second row of the `convergence` job. Empty (the default) means the country
                    runs it inside its full leg, which is where it belongs until the corpus
                    outgrows the budget — four of the five countries leave it empty.
                required: false
                type: string
                default: ''
            # The next-day test on a boot of its own, as a `next-day` row beside the convergence row
            # (`NextDay`): for a leg the test keeps past 10 minutes once its replays have moved out.
            next-day-command:
                description: The sbt alias running only this country's next-day test, as a row of its own. Empty runs it in the convergence row.
                required: false
                type: string
                default: ''
            # ONE ORDER ROW PAST 10 MINUTES IS SPLIT IN TWO: passes 0,1 and passes 1,2, each row's two
            # replays on a runner of their own instead of three sharing one. A pass is compared only
            # with the others in its row, so each row holds two and they overlap on pass 1 -- 0 = 1 and
            # 1 = 2 still hold all three to one corpus. Only for a country whose order row runs over
            # (DE, US, UK); one under 10 minutes keeps its single row (KINOWO_CONVERGENCE_ORDER_PASSES).
            order-split:
                description: Run the order-independence passes as two overlapping rows (passes 0,1 and 1,2) rather than one.
                required: false
                type: boolean
                default: false
            # ONE OF THE SPLIT ROWS, p01 (passes 0 and 1), off main when the change touches no order code
            # (scripts/ci/order-phases.sh, which says what that trades). Main, and any ref it cannot clear, runs both.
            order-one-phase:
                description: Run only the split's first order row (passes 0,1) -- a ref off main whose change touches no order code.
                required: false
                type: boolean
                default: false
            order-job-timeout-minutes:
                description: Ceiling for the whole order-independence row, including setup.
                required: false
                type: number
                default: 155
            order-suite-timeout-minutes:
                description: Ceiling for the order-independence suite step alone. MUST stay clear of the row's.
                required: false
                type: number
                default: 120
            # THE HEAP IS PER-COUNTRY for the same reason the budgets are, and it is the
            # one ceiling nothing in this repository was setting from the command line.
            # `.jvmopts` names `-Xmx4g` for the unforked local `testUnit`, the leg's sbt
            # launcher reads that file, and 4g is also what a 16 GB runner's JVM would
            # have defaulted to anyway — so every leg has always run on 4g by accident
            # rather than by decision.
            #
            # A convergence leg holds the WHOLE country at once: the replayed corpus, the
            # enrichment cache, and the read model it reloads at the end of the boot. The
            # three warm countries fit; the United States did not. Its leg reached
            # `reloadReadModel` over a 114,002-document projection, spent the next 45
            # seconds above 70% GC, and died on `.jvmopts`' `-XX:+ExitOnOutOfMemoryError`
            # (exit 3) before ScalaTest had reported a single assertion — twice, on
            # consecutive runs. A leg that cannot reach an assertion answers nothing.
            #
            # Applied to BOTH sbt invocations, not just the full one. `-Xmx` is a ceiling
            # rather than a reservation, so a sample that stays well under it pays
            # nothing, and one knob is one fewer way for the two steps to drift apart.
            heap:
                description: Max JVM heap for this country's sbt runs, as an -Xmx value.
                required: false
                type: string
                default: 4g
            # HERMETIC OR RECORDING — the one switch between a leg that renders a verdict and
            # a leg that writes the fixtures verdicts are rendered from.
            #
            # `hermetic` (every dispatched, nightly and branch leg): the network leaf is
            # replaced, so the leg replays ONLY the recorded pair — the corpus and the
            # enrichment tree `Record scrape fixtures` recorded together — and a request the
            # pair cannot answer fails the leg naming the missing fixture instead of filling
            # it live. No expiry, and no tree published: a verdict leg never changes its own inputs.
            # It does publish what it found missing (`refetch-<code>-...tsv`), and the NEXT leg's convergence
            # row fetches that list for ~90 s BEFORE its suite ("Fill the gaps the last leg listed"), publishes
            # what it got as a fill of the pair and lays it over its tree — so that run's suite already
            # replays it. The suite itself still never touches the network
            # (docs/design/convergence-fixture-fill.md).
            # Live fills inside verdict legs were a flake source of their own — a UK boot
            # making 345 live fills of which 63 failed, Cinemeta 504s, Metacritic timeouts,
            # sample legs running into their 60-minute ceiling (runs 35870834558,
            # 35918752050) — and a hermetic sample boots in seconds rather than minutes.
            #
            # `record` (only `Record scrape fixtures`): the old behaviour — expire, fill live,
            # record, publish — plus the transient failures a hermetic replay needs, and the
            # PINNED pair the hermetic legs replay once the full leg's boot is complete.
            mode:
                description: "`hermetic` (replay the recorded pair, never the network) or `record` (fill and publish it)."
                required: false
                type: string
                default: hermetic
            identity-lookups:
                description: >-
                    Run the identity resolver's per-listing lookup sweep after the boot
                    (`KINOWO_IDENTITY_LOOKUPS`): a `record` leg records its answers into the tree,
                    a `hermetic` one fails on each the tree lacks.
                required: false
                type: boolean
                default: false
            # MongoDB's data in RAM: see `convergence-setup`'s input of the same name. Per country because
            # the room is: the United States' 10g heap leaves none.
            mongo-tmpfs:
                description: Hold MongoDB's data on a RAM-backed tmpfs of at most this size; empty keeps it on disk.
                required: false
                type: string
                default: ''
            # mongod's WiredTiger cache: see `convergence-setup`'s input of the same name.
            mongo-cache-gb:
                description: mongod's --wiredTigerCacheSizeGB.
                required: false
                type: string
                default: '2'
            # 'false' keeps an order-independence row's Mongo on disk with the default 2 GB cache whatever `mongo-tmpfs` says:
            # the United States' order rows hold the most beside their 10g heap (a 9.1 GB live set, 2.0 GB of data), and on a
            # tmpfs they kept 1.6 GB of the 17.2 GB cap free against 2.2 on disk (runs 1258, 1276, cgroup-sampler.sh).
            mongo-tmpfs-order:
                description: "'false' keeps the order-independence rows' Mongo on disk (default cache) whatever mongo-tmpfs says."
                required: false
                type: string
                default: 'true'
            # The runner label the leg runs on: how a hand-dispatched run tries another machine (an arm64
            # runner's 4 vCPUs are 4 cores, an x64 one's 2 hyperthreaded) on the lane it would ship to.
            runner:
                description: The runner label the leg runs on.
                required: false
                type: string
                default: ubuntu-22.04 # mongod 8.3 refuses kernels 6.19-7.0.13: github.com's 24.04 and 26.04 images boot them, 22.04 boots 6.8 (MongoServerVersionParitySpec)
            # Extra sbt JVM options for every sbt run of the leg (`-J-XX:+UseParallelGC`) — the corpus capture,
            # the pre-suite fill and the suite; not a bisect the leg requests, which replays with the
            # bisect's own settings: how a hand-dispatched run tries a JVM setting on the runner it would ship to.
            # Empty on every dispatch Main makes.
            jvm-options:
                description: Extra JVM options (each prefixed -J) for the leg's sbt runs.
                required: false
                type: string
                default: ''
            # The identity takes check's base, named by hand (scripts/ci/identity-takes-check.sh's TAKES_BASE):
            # how to re-judge a range a check once passed without judging it. Empty on every dispatch Main makes.
            takes-base:
                description: The identity takes check's base commit, overriding the newest green one.
                required: false
                type: string
                default: ''
            # Only the `takes` row: what scripts/identity-measure dispatches to measure a commit's moved takes over every
            # country's whole corpus, without the convergence, order and next-day rows. False on every dispatch Main makes.
            takes-only:
                description: Run only the identity takes row (a hermetic leg's).
                required: false
                type: boolean
                default: false
            # Only the `takes-drift-1` / `takes-drift-2` rows: scripts/identity-drift-ci's pre-land drift check
            # (identity-model-convergence.yml's `drift-only`), the incremental = whole replay without the convergence, order,
            # next-day and takes rows. Like takes-only it honours `takes-countries`; a drift-only leg runs the row whose
            # `drift-seed-<row>` is set (both when both are, or neither). False on every dispatch Main makes.
            drift-only:
                description: Run only the takes-drift rows (a hermetic leg's).
                required: false
                type: boolean
                default: false
            # FIXED SEEDS (scripts/ci/drift_seeds.py, 2026-11-04): a takes-drift row replays the seeds drift-gate-seeds.tsv
            # assigns it, or a dispatch's pin. The row NAMES stay `takes-drift-1` / `takes-drift-2`; the seeds are in the
            # step's ::error title, verdict.txt, the summary and the leg's status. Empty: the row's fixed set.
            drift-seed-1:
                description: The seed the takes-drift-1 row replays (empty -- the row's fixed set, drift-gate-seeds.tsv).
                required: false
                type: string
                default: ''
            drift-seed-2:
                description: The seed the takes-drift-2 row replays (empty -- the row's fixed set, drift-gate-seeds.tsv).
                required: false
                type: string
                default: ''
            # A JFR CPU profile of the suite, uploaded as `convergence-profile-<code>-<phase>`: where a
            # leg's CPU goes, for whoever is making the lane faster. Off on every dispatch Main makes.
            profile:
                description: Record a JFR profile of the suite step and upload it.
                required: false
                type: boolean
                default: false
            # The countries a takes-only run measures (identity-model-convergence.yml's `takes-countries`): a leg
            # outside them runs no row at all. Empty is every country.
            takes-countries:
                description: Comma-separated codes whose takes rows a takes-only run runs; empty runs every leg's.
                required: false
                type: string
                default: ''
            # The countries a VERIFY run judges (verify-scrape-recording.yml): those its recording captured complete. A
            # country the capture left incomplete is the capture's red, so its leg runs no row here. Empty is every country.
            countries:
                description: Comma-separated codes whose legs run at all; empty runs every country's.
                required: false
                type: string
                default: ''
            # The `takes` row (base against head) is the push verdict's (identity-model-convergence.yml); a verify run
            # judges one commit against one recording and has no base to diff, so it passes false.
            phases:
                description: >-
                    The convergence rows as JSON, in the order they start (main's suite, longest first:
                    scripts/ci/convergence_slots.py); empty for the rows the inputs below expand to, in the workflow's order.
                required: false
                type: string
                default: ''
            max-parallel:
                description: How many of this leg's rows run at once (main's suite, the leg's share of the 20 runners).
                required: false
                type: number
                default: 256
            takes-row:
                description: A hermetic leg also runs its identity takes row.
                required: false
                type: boolean
                default: true
            # Resolve both sides afresh, neither reusing nor storing a result (identity-takes-check.sh's TAKES_STORE
            # empty): how scripts/identity-measure --no-store proves the store changes no verdict.
            takes-no-store:
                description: The takes check reuses and stores nothing.
                required: false
                type: boolean
                default: false
            # THE SKIP GATE (scripts/ci/takes-skip-gate.sh, identity-takes-check.sh): off, shadow (the takes run, the gate's
            # answer is held against them and posted) or enforce (a proven title-rule-only commit leaves its takes diff out,
            # 1 in 10 sampled in full). Shadow until scripts/ci/takes-skip-shadow-report.sh counts 20 SKIPs, none disagreeing.
            takes-skip:
                description: The takes skip gate -- off, shadow or enforce.
                required: false
                type: string
                default: shadow
            # THE DETERMINISM CHECK (identity-drift-check.sh's DRIFT_TWICE; convergence-daily.yml passes it): each
            # takes-drift row replays its seed a second time and fails when the two runs' drift and flips TSVs differ.
            drift-twice:
                description: Each takes-drift row replays its seed twice and diffs the TSVs.
                required: false
                type: boolean
                default: false
            # THE EXPLORER (identity-drift-explorer.yml; identity-drift-check.sh's DRIFT_EXPLORE): each takes-drift row
            # replays the head alone on N (`auto`: the country's count) random seeds off the gate, never red, and writes
            # the flips no backlog row names to explore-<cc>.tsv in its artifact.
            drift-explore:
                description: Explore N (or `auto`) random seeds a takes-drift row, head alone, never red (empty -- the gate).
                required: false
                type: string
                default: ''
            # THE DRIFT HARNESS'S A/A SELF-TEST (scripts/ci/harness_aa.py; the preflight's `harness-aa`): two more rows,
            # `takes-drift-aa-pass0|1`, each replaying the head once against itself on the row-1 seeds, and order-compare's
            # `takes-drift-aa` after them, red only when the two differ. And
            # `takes-aa`: the takes check against itself (identity-takes-check.sh TAKES_AA), red on any take the two differ in.
            harness-aa:
                description: Add the takes-drift-aa and takes-aa rows (the drift and takes harnesses against themselves) -- a push that changed a harness.
                required: false
                type: boolean
                default: false
            # A complete RECORDING becomes the hermetic pair only when this is true; false still publishes its tree
            # under its run and marks it prod-latest (`convergence-publish`'s `pin`). Record scrape fixtures passes
            # false unless a dispatch asks, while prod-latest proves itself as a landing bar.
            pin-hermetic:
                description: A complete `record` leg pins its recording as the hermetic pair (else prod-latest only).
                required: false
                type: boolean
                default: true
            # A run whose verdict the caller proved this commit may reuse (identity-model-convergence.yml's `reuse-run`,
            # scripts/ci/convergence_reuse.py): every row skips. Empty on every run that judges the commit itself.
            reused-from:
                description: The run whose verdict this leg reuses; every row skips.
                required: false
                type: string
                default: ''
            # THE RUN'S PAIRS (the caller's preflight, convergence-setup.sh `pins`): `{"<code>": "<pair>"}`. This leg's
            # order-pass rows replay its code's pair, fills included, as given -- never the release as each row finds it.
            pinned-pairs:
                description: The pairs pinned once for the run, as JSON by country code; the order-pass rows replay this leg's.
                required: false
                type: string
                default: '{}'
            corpus-run:
                description: >-
                    The `Record scrape fixtures` run whose corpus a RECORDING leg replays — the
                    recorder passes its own run. Empty takes the newest (record) or the pinned
                    pair's (hermetic); named in a hermetic leg, that recording's own tree, no fills.
                required: false
                type: string
                default: ''

env:
    # The rolling release the per-country fixture trees live in. One tag, three assets,
    # each replaced in place — a store, not a history. Marked as a prerelease when
    # created so it never reads as a shipped version of anything.
    #
    # Declared HERE and not only in the caller: workflow-level `env` does not cross
    # into a called workflow, and `convergence-setup` reads this variable.
    FIXTURE_RELEASE_TAG: convergence-fixtures
    # The takes check's store (identity-takes-check.sh's TAKES_STORE): a release of its own, created on first store. It
    # keeps 24 results a kind and country -- over 700 assets -- and beside the fixtures on one release it took that
    # release to GitHub's 1000-asset cap, where every upload is refused (run 41351315090).
    TAKES_RELEASE_TAG: identity-takes
    # ci-runner's job image (catthehacker's hosted-Ubuntu copy) sets no locale, where a hosted VM sets C.UTF-8: the JVM
    # then encodes file names as ASCII and every fixture path with a Polish letter throws InvalidPathException
    # (precommit-check run 41356052566). (SelfHostedRunnersSpec)
    LANG: C.UTF-8

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    # THE RUN — one PHASE per row: `convergence` for every country, plus `order-independence` (or its two split
    # rows) for a corpus whose replays no longer fit beside the boot, plus `next-day` for a leg its next-day test keeps
    # past 10 minutes, plus `takes` (the identity takes check) and `takes-drift-1` / `takes-drift-2` (the incremental =
    # whole gate, each its fixed seeds, scripts/ci/drift_seeds.py) in every hermetic leg. No row runs the sample (see the header).
    #
    # A ROW rather than a job of its own, because "a job that exists only sometimes" is
    # not something GitHub can express. A job carrying `if: inputs.order-command != ''`
    # is still a JOB: it is rendered, skipped, in every run and posts a skipped check-run
    # on every commit. Four warm countries times every push was four `order-independence`
    # entries that meant nothing, on the page where the ones that do are read. A matrix a
    # country expands to one row leaves nothing behind at all.
    #
    # The phase is the ONLY thing the matrix carries, and the row's alias and budgets are
    # picked off the caller's inputs by it — so they stay declared where every other
    # budget in this file is declared, as named inputs with defaults and descriptions,
    # rather than as fields of a JSON blob a job built at runtime.
    #
    # (A job's `name:` renders as the literal `${{ matrix.phase }}` in the run graph
    # until the job actually STARTS. A convergence row cancelled at creation never gets
    # that far, and reads as a broken name when nothing is broken. A skipped row of a takes-only measurement of some
    # countries still reads so; a proven reuse skips the caller's `leg` job whole instead.)
    #
    # `fail-fast: false` because the rows are independent claims about the same country —
    # a divergent replay must not cancel the boot that would have said where, and vice
    # versa.
    #
    # They are side by side, NOT chained. The replay seeds its own archive and never
    # touches the booted corpus, so chaining them would only put a 4-hour row behind a
    # 3-hour one — the 6-hour cancellation the split exists to escape. The leg costs one
    # more concurrent runner while it is in flight rather than one more afternoon.
    convergence:
        # `<phase> (<country>)`, the label the row's test report carries.
        name: ${{ matrix.phase }} (${{ inputs.country }})
        # A takes-only measurement of some countries (scripts/identity-measure --countries) skips the others' legs whole.
        # A verify run skips the countries its recording did not capture complete (`countries`), a proven reuse every row.
        if: ${{ inputs.reused-from == '' && (inputs.countries == '' || contains(format(',{0},', inputs.countries), format(',{0},', inputs.code))) && (!(inputs.takes-only || inputs.drift-only) || inputs.takes-countries == '' || contains(format(',{0},', inputs.takes-countries), format(',{0},', inputs.code))) }}
        strategy:
            fail-fast: false
            # IN 20 RUNNERS (convergence_slots.py): main's caller lists the rows longest first and caps them at the leg's share;
            # GitHub starts a capped matrix's rows in their listed order, the next when one ends.
            max-parallel: ${{ inputs.max-parallel }}
            matrix:
                phase: ${{ fromJson(inputs.phases || inputs.drift-only && (inputs.drift-seed-1 == '' && inputs.drift-seed-2 != '' && '["takes-drift-2"]' || inputs.drift-seed-2 == '' && inputs.drift-seed-1 != '' && '["takes-drift-1"]' || '["takes-drift-1","takes-drift-2"]') || inputs.takes-only && '["takes","takes-base"]' || format('["convergence"{0}{1}{2}{3}]', inputs.order-command != '' && (inputs.order-split && (inputs.order-one-phase && ',"order-independence-p01-pass0","order-independence-p01-pass1"' || ',"order-independence-p01-pass0","order-independence-p01-pass1","order-independence-p12-pass1","order-independence-p12-pass2"') || ',"order-independence"') || '', inputs.next-day-command != '' && ',"next-day"' || '', inputs.mode == 'hermetic' && inputs.takes-row && ',"takes","takes-base","takes-drift-1","takes-drift-2"' || '', inputs.mode == 'hermetic' && inputs.takes-row && inputs.harness-aa && ',"takes-drift-aa-pass0","takes-drift-aa-pass1","takes-aa"' || '')) }}
        runs-on: ${{ inputs.runner }}
        # 45 was not enough headroom and cost a real run: on 2026-07-28 the Germany
        # and UK legs were CANCELLED at exactly 45m while Poland finished in 8,
        # because the corpus was mis-sized (Poland's films-per-venue ratio applied
        # to every country — see CountryScrapeCorpus.shapeOf). The sizing is fixed,
        # but a CI runner is a good deal slower than the machine these are timed on,
        # so the ceiling now sits well clear of the expected run rather than just
        # above it. A leg that approaches this is a signal to re-measure the shape,
        # not to raise the number again. A drift row's is its step's own ceiling plus setup (the step: 75 minutes, 140 when
        # `drift-twice` replays each seed twice; an A/A pass replays once): under the order rows' 55 the step's bound never
        # fired and a slow daily row was cancelled, no verdict.
        timeout-minutes: ${{ startsWith(matrix.phase, 'takes-drift-') && (inputs.drift-twice && 150 || 85) || (matrix.phase == 'convergence' || matrix.phase == 'next-day') && inputs.job-timeout-minutes || inputs.order-job-timeout-minutes }}
        permissions:
            # `contents: write` for the rolling release the fixture trees live in —
            # see "Publish" below for why that, rather than an artifact. The replay row never
            # writes it (its publish
            # steps are gated on the phase), and `permissions:` takes no expression, so
            # it is granted a scope it does not use rather than the two rows being two
            # jobs again.
            contents: write
            checks: write
            # `gh run download` still reads artifacts, for the one-off bootstrap when
            # the release doesn't exist yet.
            actions: read
            # The row's leg-verdict and identity-takes statuses.
            statuses: write
        steps:
            # The commit, fetched here rather than by actions/checkout so that a stalled fetch is asked again: GitHub's git
            # server leaves some of a run's ~50 simultaneous depth-1 fetches silent for 5-7 minutes while fetches started
            # later go through in seconds (run 41872808505: 10 of the 18 rows starting at 17:08:16 waited 303-422 s, the
            # other 8 took 14-20 s; p99 of 1,068 row checkouts 303 s, p50 13 s). An attempt that has not finished in
            # 100 s is ended and made again; the third runs under the job's own ceiling. Everything actions/checkout
            # left that a row reads is here: the tree at the run's commit, its branch checked out by name, and the
            # token a later `git fetch` / `git push` authenticates with. .github/scripts/row-checkout-test.sh runs
            # this step.
            - name: Check out the commit
              shell: bash
              env:
                  CHECKOUT_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  bound=${CHECKOUT_ATTEMPT_SECONDS:-100}
                  cd "$GITHUB_WORKSPACE"
                  # A self-hosted runner's workspace outlives the job: start from nothing, as actions/checkout does.
                  find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                  git init -q .
                  git config --local gc.auto 0
                  git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
                  git config --local "http.$GITHUB_SERVER_URL/.extraheader" \
                      "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
                  case "$GITHUB_REF" in
                      refs/heads/*) branch=${GITHUB_REF#refs/heads/}; target="refs/remotes/origin/$branch" ;;
                      *)            branch="";                        target="refs/remotes/origin/checkout" ;;
                  esac
                  for attempt in 1 2 3; do
                      limit=$bound; [ "$attempt" = 3 ] && limit=0 # 0: no limit but the job's
                      started=$(date +%s) rc=0
                      timeout -k 10 "$limit" git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules \
                          --depth=1 origin "+$GITHUB_SHA:$target" || rc=$?
                      if [ "$rc" = 0 ]; then echo "fetched $GITHUB_SHA in $(( $(date +%s) - started )) s (attempt $attempt)"; break; fi
                      [ "$attempt" = 3 ] && { echo "::error::could not fetch $GITHUB_SHA (exit $rc)"; exit "$rc"; }
                      echo "::warning::fetch attempt $attempt ended after $(( $(date +%s) - started )) s (exit $rc): asking again"
                      rm -f .git/shallow.lock .git/index.lock
                  done
                  if [ -n "$branch" ]; then git checkout -q --force -B "$branch" "$target"
                  else git checkout -q --force --detach "$GITHUB_SHA"; fi
                  echo "checked out $(git rev-parse HEAD)${branch:+ as $branch}"
            # The job's measurements (machine, resources, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            # It starts cgroup-sampler.sh too: the job's memory and disk writes from its own cgroup, reported in the
            # row's last step -- what decides whether a country's Mongo fits on a tmpfs beside its heap.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: ${{ inputs.country }}
            # THE ROW'S CEILING, in its log: its `timeout-minutes` is an expression the timings reporter cannot read off
            # this file, so it reads this line instead, for the near-ceiling alert (scripts/ci/ci_timings.py
            # `CEILING_LINE`, ci-build-times.rules). The same expression as the job's, which ci_timings_test.py holds it to.
            - name: Report the row's ceiling
              shell: bash
              run: echo "ci-job-ceiling ${{ startsWith(matrix.phase, 'takes-drift-') && (inputs.drift-twice && 150 || 85) || (matrix.phase == 'convergence' || matrix.phase == 'next-day') && inputs.job-timeout-minutes || inputs.order-job-timeout-minutes }} minutes"
            # Each row resolves the pinned pair here, once, and its suite and
            # any bisect it requests all replay that one (`steps.setup.outputs.hermetic-pair`)
            # even if the recorder pins a new pair while this row is running.
            - uses: ./.github/actions/convergence-setup
              id: setup
              with:
                  code:          ${{ inputs.code }}
                  token:         ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token:    ${{ secrets.DOCKERHUB_TOKEN }}
                  mode:          ${{ inputs.mode }}
                  # An order-pass row replays the run's pinned pair (the caller's preflight), so the passes compared were fed alike.
                  hermetic-pair: ${{ inputs.mode == 'hermetic' && contains(matrix.phase, '-pass') && fromJson(inputs.pinned-pairs || '{}')[inputs.code] || '' }}
                  # A recording leg's own run when no corpus run is named.
                  corpus-run:    ${{ inputs.corpus-run || (inputs.mode == 'record' && github.run_id || '') }}
                  mongo-tmpfs:   ${{ (inputs.mongo-tmpfs-order != 'false' || !startsWith(matrix.phase, 'order-independence')) && inputs.mongo-tmpfs || '' }}
                  mongo-cache-gb: ${{ (inputs.mongo-tmpfs-order != 'false' || !startsWith(matrix.phase, 'order-independence')) && inputs.mongo-cache-gb || '2' }}
                  takes:         ${{ startsWith(matrix.phase, 'takes') }}

            # A RECORDING leg records its own country's corpus FIRST, in this job — the shape specs
            # and the suite below then replay what it wrote to test/resources/fixtures/corpus.
            #
            # It used to be five `scrapes (<country>)` jobs of the recorder, every one of which
            # had to finish before ANY country's leg could start (`needs:` joins jobs, not matrix
            # rows), each paying a runner, a checkout and a JDK/sbt setup of its own to hand a
            # tarball to the leg through an artifact. Here it reuses the setup above and the
            # slowest country's capture holds up only itself.
            #
            # Refuses an empty read rather than writing a fixture from one, and `findAll`
            # discards an incomplete keyset scan — a fixture is AUTHORITATIVE, and a truncated
            # one already slipped through once at 236 of 281 Polish venues. No
            # `continue-on-error`: a leg with no fresh corpus has nothing to record a tree over.
            #
            # THE TUNNEL IS OPENED LAST AND CLOSED FIRST. Last, immediately before the read: a
            # tunnel wedges while idle (see wait-for-mongo-tunnel.sh), and opening it before a
            # JDK install and a possibly-cold sbt compile left it rotting for 5-10 minutes.
            # Closed straight after the read, `always()`: this job goes on to run project code
            # for hours with a write-scoped token and the TMDB/OMDb keys, and none of it may
            # reach prod Mongo — close-mongo-tunnel.sh kills the relay, deletes the key and
            # blanks the credential, and fails unless the port is dead.
            #
            # THE CONNECTION STRING IS NOT A SECRET OF THIS WORKFLOW. The tunnel step asks
            # mongo-1's forced-command endpoint for the read-only credential and exports
            # KINOWO_CONVERGENCE_SCRAPES_URI itself, so the only thing GitHub holds is an ssh key
            # that can do exactly two read-only things, and only the tunnel step sees it.
            # (RecordCorpusInLegWiringSpec)
            # The two corpus steps' ceilings are fifteen minutes between them — the recorder sizes
            # its job over them (HermeticConvergenceWiringSpec). The tunnel bounds its own retries
            # in ~3 minutes; the read took under 2 for the largest corpus (run 36928948671).
            - name: Tunnel to prod Mongo
              if: inputs.mode == 'record' && matrix.phase == 'convergence'
              timeout-minutes: 5
              shell: bash
              run: |
                  . scripts/ci/bounded-step.sh
                  scripts/ci/wait-for-mongo-tunnel.sh 27018
              env:
                  MONGO_CI_SSH_KEY:      ${{ secrets.MONGO_CI_SSH_KEY }}
                  MONGO_CI_SSH_HOST_KEY: ${{ secrets.MONGO_CI_SSH_HOST_KEY }}

            #
            # From `worker/Fixtures`, not `worker/Test`: nothing else in a leg compiles worker's
            # specs (e2e depends on worker's fixtures only), so the build cache every hermetic leg
            # saves carries worker/test-classes as stale as whatever it was first restored from,
            # and this step paid for recompiling them — 13 to 80 sources most nights, all 744
            # (~2 minutes) on two of the seven recordings to 2026-10-03. The fixtures are
            # compiled, and cached, by every leg. (RecordCorpusInLegWiringSpec)
            - name: Record ${{ inputs.country }}'s corpus
              if: inputs.mode == 'record' && matrix.phase == 'convergence'
              timeout-minutes: 10
              shell: bash
              run: |
                  . scripts/ci/bounded-step.sh
                  # As every sbt run of a leg: the runner's whole CPU beside it (cpu-sampler.sh).
                  scripts/ci/cpu-sampler.sh 15 & sampler=$!; trap 'kill "$sampler"' EXIT
                  read -ra jvm <<< "$JVM_OPTIONS"
                  sbt -J-Xmx${{ inputs.heap }} "${jvm[@]}" "worker/Fixtures/runMain scripts.RecordCorpusFixture ${{ inputs.code }}"
              env:
                  JVM_OPTIONS:      ${{ inputs.jvm-options }}
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}

            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            - name: Close the tunnel to prod Mongo
              if: always() && inputs.mode == 'record' && matrix.phase == 'convergence'
              shell: bash
              run: scripts/ci/close-mongo-tunnel.sh 27018

            # Corpus, baseline and the sample pair all travel in ONE archive. They are captured
            # from a single connection at a single instant and only mean anything together — the
            # convergence band compares this run's coverage of the corpus against what prod had
            # achieved on that same repertoire, so a corpus arriving beside a staler baseline
            # would be comparing two different days.
            - name: Pack ${{ inputs.country }}'s corpus
              if: inputs.mode == 'record' && matrix.phase == 'convergence'
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p scrape-archive
                  # prod's pins and filed family answers (ProdIdentityInputs), its model's accepted listings (ProdListings)
                  # and the TMDB store, question memory and venue pages it read (ProdLookupInputs), for the live drift
                  # check's whole resolve, and the listings its model keeps for their facts alone (ProdRetained), every row's
                  # model input beside the corpus: packed when the recorder read them, which it does not fail the corpus over
                  inputs=()
                  for f in "prod-pins-${{ inputs.code }}.json" "prod-family-answers-${{ inputs.code }}.json.gz" \
                      "prod-listings-${{ inputs.code }}.json.gz" "prod-lookups-${{ inputs.code }}.json.gz" \
                      "prod-retained-${{ inputs.code }}.json.gz"; do
                      [ ! -f "test/resources/fixtures/corpus/$f" ] || inputs+=("test/resources/fixtures/corpus/$f")
                  done
                  tar -czf "scrape-archive/scrapes-${{ inputs.code }}.tar.gz" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ inputs.code }}.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ inputs.code }}.json" \
                      "test/resources/fixtures/corpus/prod-films-${{ inputs.code }}.json.gz" \
                      "test/resources/fixtures/corpus/cinema-scrapes-${{ inputs.code }}-sample.json.gz" \
                      "test/resources/fixtures/corpus/prod-coverage-${{ inputs.code }}-sample.json" \
                      "test/resources/fixtures/corpus/prod-films-${{ inputs.code }}-sample.json.gz" \
                      ${inputs[@]+"${inputs[@]}"}
                  ls -l scrape-archive/

            # Every later leg's corpus: the hermetic legs replay a pinned run's
            # `scrape-fixtures-<code>`, and the provenance diff the last green one's.
            - uses: actions/upload-artifact@v6
              if: inputs.mode == 'record' && matrix.phase == 'convergence'
              with:
                  name: scrape-fixtures-${{ inputs.code }}
                  path: scrape-archive/scrapes-${{ inputs.code }}.tar.gz
                  # 14 days, not 3. This artifact is the ONLY copy a convergence leg reads (a
                  # cache entry once saved beside it was evicted within hours by 7 GB of
                  # sbt-target builds, which is how the UK corpus went missing and the leg
                  # silently replayed invented films instead). Three days is two nights of slack
                  # on a nightly job: one failed run over a weekend and every country's corpus
                  # expires at once. The tarballs together are ~12 MB, so the margin costs nothing.
                  retention-days: 14
                  overwrite: true
                  if-no-files-found: warn

            # A RECORDING's order-independence row (the United Kingdom's — see the recorder) replays the
            # corpus THIS run's convergence row records: one capture, from one connection at one
            # instant, shared by both rows rather than a second tunnel and a second, different read.
            # It waits for that row's upload (~1.5 minutes in, while this row's own setup runs) and
            # restores it as convergence-setup restores a pinned one.
            - name: Restore the corpus the convergence row records
              if: inputs.mode == 'record' && matrix.phase != 'convergence'
              timeout-minutes: 20
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  . scripts/ci/bounded-step.sh
                  set -euo pipefail
                  scripts/ci/wait-for-run-artifact.sh "scrape-fixtures-${{ inputs.code }}" "convergence (${{ inputs.country }})" 1080
                  gh run download "$GITHUB_RUN_ID" --name "scrape-fixtures-${{ inputs.code }}" --dir scrape-archive
                  .github/scripts/unpack-fixture-archive.sh "scrape-archive/scrapes-${{ inputs.code }}.tar.gz"

            # THE PRE-SUITE FILL (docs/design/convergence-fixture-fill.md): what the PREVIOUS leg's suite
            # could not answer from this pair — the newest `refetch-<code>-<corpus>-*.tsv` it published —
            # fetched live now, through the worker's own per-host pace, 429 gate and breaker
            # (`FillMissingFixtures`, `HttpWiring.pacedWire`), and laid over this row's tree, so THIS run's
            # suite replays it instead of the run after next. `held` is the tree as setup restored it — the
            # pinned tree and every fill already laid over it — so nothing it holds is asked again.
            #
            # It FINISHES before the suite starts: the deadline is 90 s from this step's start (sbt's boot and
            # the fixtures' compile, which the suite would pay anyway, come out of it), and past it a request
            # already in flight only completes. The suite itself never touches the network — it refuses every
            # request its tree cannot answer, as it always has. Best effort: a failed or slow fill is a gap the
            # suite reports, never a red row. TMDB's key is this step's alone among the fill's steps
            # (`FillCredentials` signs the TMDB gaps listed with it masked); nothing it records carries it.
            #
            # A NAMED RECORDING IS REPLAYED BARE (`corpus-run`: a verify run, an identity measure's --recording): its own
            # tree and nothing fetched, so a gap is the named failure the verdict is about, never quietly filled.
            #
            # THE CONVERGENCE ROW ALONE FILLS. Every other row (order-independence, takes) replays the pair's
            # published fills that setup laid over its tree, and asks nothing: three rows asking one list was the
            # same paid egress three times a run. A gap the fill was refused (anything but a 404) is published as
            # a `refused-…tsv` list, and the next four fills skip it (convergence-fill.sh `gaps`) — so an origin
            # refusing CI for good is asked once every few runs, not every run.
            - name: Fill the gaps the last leg listed, before the suite
              id: fill
              if: inputs.mode == 'hermetic' && matrix.phase == 'convergence' && inputs.corpus-run == ''
              continue-on-error: true
              timeout-minutes: 5
              shell: bash
              env:
                  GH_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
                  JVM_OPTIONS:      ${{ inputs.jvm-options }}
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
                  # What an origin refuses CI's own address (Cineworld's 403s) is asked again through the
                  # residential proxy, as production reaches it (MissingFixtureFill.route).
                  DECODO_PROXY_USER: ${{ secrets.DECODO_PROXY_USER }}
                  DECODO_PROXY_PASS: ${{ secrets.DECODO_PROXY_PASS }}
                  FILL_SECONDS:     90
              run: |
                  . scripts/ci/bounded-step.sh
                  set -uo pipefail
                  . scripts/tool-conventions.sh # bounded
                  started=$(date +%s)
                  until=$(( $(date +%s) + FILL_SECONDS ))
                  list="$RUNNER_TEMP/fill-refetch.tsv"
                  count=$(.github/scripts/convergence-fill.sh gaps "${{ inputs.code }}" "$KINOWO_CONVERGENCE_PIN_CORPUS_RUN" "$list") || exit 1
                  if [ "${count:-0}" -eq 0 ]; then
                      echo "[fill] the last leg listed no fetchable gap of this pair — nothing to fetch"
                      exit 0
                  fi
                  fixtures="$GITHUB_WORKSPACE/test/resources/fixtures"
                  out="$RUNNER_TEMP/fill-out"
                  # As every sbt run of a leg: the runner's whole CPU beside it, on the caller's heap ceiling.
                  scripts/ci/cpu-sampler.sh 15 & sampler=$!; trap 'kill "$sampler"' EXIT
                  read -ra jvm <<< "$JVM_OPTIONS"
                  mkdir -p fill-upload-source
                  # ENDED BY THE STEP ITSELF, inside its 5 minutes: the runner abandons a step at its timeout without
                  # ending it, and this sbt compiled on beside the suite's in the same target/ (run #1880's germany row:
                  # "value forCountry is not a member" of a class both had; scripts/ci/stop-stray-sbt.sh).
                  bounded $(( started + 280 - $(date +%s) )) \
                  sbt -J-Xmx${{ inputs.heap }} "${jvm[@]}" -J-Djdk.http.auth.tunneling.disabledSchemes= "worker/Fixtures/runMain scripts.FillMissingFixtures ${{ inputs.code }} $list $fixtures $out/test/resources/fixtures $until fill-upload-source/refused.tsv"
                  .github/scripts/convergence-fill.sh pack "$out" fill-upload-source/fill.tar.zst

            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            # PUBLISHED BEFORE IT IS REPLAYED, so the pair a bisect replays is exactly the tree that decides the
            # verdict: on main the fill is laid over this row's tree only once it is published under its own name
            # (`fill-<code>-<corpus>-<run>-<attempt>-convergence`), and the bisect request names it. A publish that
            # fails leaves the tree as setup restored it — the suite replays without the fill, and the pair says so.
            # Off main nothing is published and no bisect is asked for, so the fill is laid over regardless.
            - uses: ./.github/actions/convergence-publish
              id: publish-fill
              if: inputs.mode == 'hermetic' && matrix.phase == 'convergence' && inputs.corpus-run == ''
              with:
                  code:         ${{ inputs.code }}
                  token:        ${{ secrets.GITHUB_TOKEN }}
                  mode:         hermetic
                  fill-archive: fill-upload-source/fill.tar.zst
                  fill-row:     convergence
                  refused-list: fill-upload-source/refused.tsv

            - name: Lay the fill over the tree the suite replays
              if: inputs.mode == 'hermetic' && matrix.phase == 'convergence' && inputs.corpus-run == ''
              shell: bash
              env:
                  PUBLISHED: ${{ steps.publish-fill.outputs.fill-asset }}
                  ON_MAIN:   ${{ github.ref == 'refs/heads/main' }}
              run: |
                  set -uo pipefail
                  fetched="$RUNNER_TEMP/fill-out/test/resources/fixtures"
                  [ -d "$fetched" ] || { echo "[fill] fetched nothing — the suite replays the tree as setup restored it"; exit 0; }
                  if [ "$ON_MAIN" = true ] && [ -z "$PUBLISHED" ]; then
                      echo "::warning::the fill could not be published — the suite replays without it, as a bisect of this leg would"
                      exit 0
                  fi
                  cp -a "$fetched/." "$GITHUB_WORKSPACE/test/resources/fixtures/"
                  echo "[fill] laid ${PUBLISHED:-the fill (unpublished off main)} over the tree"
                  # What the takes check keys a stored resolve by: the published fill, or that it cannot be named.
                  echo "${PUBLISHED:-unpublished}" > "$RUNNER_TEMP/laid-fill"

            # NO SAMPLE RUNS IN A LEG ANY MORE (2026-10-14): every row's suite fits the lane's 10-minute target, so the
            # ~100-film slice of the corpus the suite replays in full only cost a runner or minutes in front of it. The
            # sample's corpus-shape specs (`shape-command`) run in the `takes` row of a hermetic leg, base against head,
            # and here, ahead of a RECORDING's suite. The SAMPLE ALIAS stays: the auto-bisect replays it per commit
            # (`sample-command`).

            # A RECORDING's corpus-shape findings, REPORTED: the newest recording's markers left in a query and slots
            # read off the wrong node, written to the diagnostics (`corpus-shape-recorded-<cc>-*.txt`) the Identity
            # findings report reads. Never failing, and never in front of the suite on its sbt line, where a finding
            # stopped the suite before its boot (run 38625654132's UK and DE rows, on "Arrietty … Experience It In IMAX"
            # and "Preview am Mi."). The specs fail on a finding by design; their findings files are the result.
            - name: Report the recording's corpus-shape findings
              if: inputs.mode == 'record' && matrix.phase == 'convergence' && inputs.shape-command != ''
              shell: bash
              env:
                  JVM_OPTIONS:      ${{ inputs.jvm-options }}
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
              run: |
                  # As every sbt run of a leg: the runner's whole CPU beside it (cpu-sampler.sh).
                  scripts/ci/cpu-sampler.sh 15 & sampler=$!; trap 'kill "$sampler"' EXIT
                  read -ra jvm <<< "$JVM_OPTIONS"
                  sbt -J-Xmx${{ inputs.heap }} "${jvm[@]}" "${{ inputs.shape-command }}" > corpus-shape.log 2>&1 || true
                  ls target/convergence-diagnostics/corpus-shape-recorded-${{ inputs.code }}-*.txt \
                    || { tail -50 corpus-shape.log; echo "::warning::the corpus-shape specs wrote no findings -- see the log above"; }

            # Bounded BELOW the job's ceiling, on purpose — the single most important line
            # in this file for a leg that runs long. Both numbers moved up together (from
            # 62/75) when every collection went onto a real database: the UK replays alone
            # went from ~10 minutes to over 30, and the gap between the two is what pays
            # for the publish steps, so raising one without the other would reintroduce
            # exactly the cancellation this comment exists to prevent.
            #
            # A job that hits its own `timeout-minutes` is CANCELLED, and a cancelled
            # job runs its remaining `always()` steps only inside a short grace window.
            # The steps that have to run here tar and upload 84-152 MB, and losing that
            # race loses the whole point: the cache and the newly recorded responses
            # this leg just spent an hour building, which are exactly what would have
            # made the NEXT run fast enough not to time out. A timeout that discards its
            # own progress cannot converge — every run repeats the same cold sweep.
            #
            # Failing the STEP instead keeps the job alive and un-cancelled, so the
            # publish and upload steps below run normally with the remaining ~10 minutes
            # rather than on borrowed time. The leg still reports failure, loudly; it
            # just doesn't throw away the work first.
            # `tee`d so the findings can be republished as a report below. `pipefail`
            # explicitly, because the default shell is `bash -e` without it and the
            # pipeline would otherwise report `tee`'s exit status and pass a failing
            # suite.
            #
            # A RECORDING'S SUITE JUDGES NOTHING (exits 0 in record mode, `failed` saying how it ended): it is how the capture boots the
            # corpus and fills its tree live, and what it asserts over live fallbacks is no verdict on code. Whether the
            # capture worked is "Fail the capture unless its boot completed" below; whether the code holds on what it
            # captured is the hermetic replay of it, `Verify scrape recording`.
            - name: Run the ${{ inputs.country }} ${{ matrix.phase }} suite
              id: suite
              if: "!startsWith(matrix.phase, 'takes')"
              shell: bash
              timeout-minutes: ${{ (matrix.phase == 'convergence' || matrix.phase == 'next-day') && inputs.suite-timeout-minutes || inputs.order-suite-timeout-minutes }}
              run: |
                  . scripts/ci/bounded-step.sh
                  set -o pipefail
                  # When the suite started, for "Say whether the suite ran out of time" below.
                  date +%s > "$RUNNER_TEMP/suite-started"
                  # A recording's shape specs, above, wrote their JUnit XML here; the report below is this suite's.
                  rm -rf target/test-reports/unit
                  # This sbt the build's only writer: a JVM a timed-out step (the fill, a capture) left compiling into
                  # the same target/ makes zinc's class files and analysis disagree, and the compile fails on members
                  # the sources have (run #1880). Never a retry: whatever fails after this is the code's.
                  scripts/ci/stop-stray-sbt.sh
                  # The runner's whole CPU beside the phase log's JVM-only number (cpu-sampler.sh), and which
                  # collections Mongo's share of it goes to (mongo-top.sh).
                  scripts/ci/cpu-sampler.sh 15 & sampler=$!; trap 'kill "$sampler"' EXIT
                  scripts/ci/mongo-top.sh start || true
                  profile=()
                  if [ "${{ inputs.profile }}" = true ]; then
                      profile=("-J-XX:StartFlightRecording=filename=convergence.jfr,settings=profile,dumponexit=true" "-J-XX:FlightRecorderOptions=stackdepth=1024")
                  fi
                  read -ra jvm <<< "$JVM_OPTIONS"
                  sbt -J-Xmx${{ inputs.heap }} "${jvm[@]}" "${profile[@]}" -J-Djdk.http.auth.tunneling.disabledSchemes= ${{ matrix.phase == 'convergence' && inputs.command || matrix.phase == 'next-day' && inputs.next-day-command || inputs.order-command }} 2>&1 | tee convergence.log || suite=$?
                  # What the leg left in Mongo — the size a RAM-backed mongod would have to hold, and where its
                  # time went — on a red suite too, which is when it is read; then the suite's own verdict.
                  scripts/ci/mongo-exec.sh du -sh /data/db || true
                  scripts/ci/mongo-top.sh report || true
                  if [ "${suite:-0}" != 0 ] && [ "$RECORDING" = true ]; then
                      echo "failed=true" >> "$GITHUB_OUTPUT"
                      echo "::warning::the recording's suite failed (exit $suite) -- no verdict over live fallbacks; Verify scrape recording judges the code on this recording"
                      exit 0
                  fi
                  exit "${suite:-0}"
              env:
                  RECORDING:        ${{ inputs.mode == 'record' }}
                  # The spec builds this country's TitleNormalizer itself; naming the
                  # country here too means anything that reads the environment
                  # directly (`Country.fromEnv`) agrees with it rather than
                  # falling back to the Poland default.
                  JVM_OPTIONS:      ${{ inputs.jvm-options }}
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  # NO Mongo here, deliberately — not the corpus, not the cache.
                  #
                  # Both URIs used to be set to the shared cluster, reached over a
                  # `flyctl proxy` this job starts nowhere. Every enrichment cache
                  # write therefore blocked for the driver's 5s server selection and
                  # then failed `Connection refused` on 127.0.0.1:27018, and the write
                  # sits on the fetch path — so each of the ~780 live fills cost 5.6s
                  # instead of 0.6s and all three legs were cancelled at the 75-minute
                  # ceiling, still inside `bootCorpus`. (`EnrichmentCache` now suspends
                  # write-through after three refusals, so this can never cost more
                  # than a handful of timeouts again — but the right number of round
                  # trips to a cluster this job cannot reach is zero.)
                  #
                  # Neither one is needed. The corpus comes from the committed fixture
                  # (`CorpusFixture`), and the enrichment answers come from the fixture
                  # tree restored above — which this leg also EXTENDS as it runs and
                  # uploads below, so the loop closes without a tunnel in it.
                  #
                  # Without a real key TmdbClient short-circuits and nothing resolves,
                  # so the real corpus would buy nothing over the generated one.
                  # Replay recorded enrichment answers first; anything genuinely new
                  # falls through to the live chain and is recorded for the next run —
                  # in a RECORDING leg. A hermetic one refuses that request and names it.
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ inputs.code }}
                  KINOWO_CONVERGENCE_HERMETIC: ${{ inputs.mode == 'hermetic' }}
                  # A split order row's passes, read off its phase (`order-independence-p01` -> 0,1);
                  # empty, every pass, on any other row.
                  KINOWO_CONVERGENCE_ORDER_PASSES: ${{ endsWith(matrix.phase, '-pass0') && '0' || endsWith(matrix.phase, '-pass1') && '1' || endsWith(matrix.phase, '-pass2') && '2' || '' }}
                  # ONE PASS PER ROW: the row writes its pass's corpus here, uploaded below for `order-compare`.
                  KINOWO_CONVERGENCE_ORDER_PASS_OUT: ${{ contains(matrix.phase, '-pass') && format('{0}/order-pass', runner.temp) || '' }}
                  # GAP-FILL in a RECORDING's order row: it replays the
                  # working tree it restored (the last recording's) and fetches live only what that
                  # lacks, ONCE between its three passes (`SharedLiveAnswers`), never refreshing it.
                  # Inside the convergence row the passes replayed what the boot had just fetched;
                  # in a row of their own they have no boot, and three passes each asking the live
                  # web for the same page need not hear the same answer — an arrival-order
                  # "dependence" the pipeline does not have (run 36801876786). Nothing it records
                  # is published: the convergence row is the one writer.
                  KINOWO_CONVERGENCE_FILL_ONLY: ${{ inputs.mode == 'record' && matrix.phase != 'convergence' }}
                  KINOWO_IDENTITY_LOOKUPS: ${{ inputs.identity-lookups }}
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
                  # A RECORDING asks what an origin refuses the runner's own address (Cineworld's detail API
                  # answers every runner 403) again through the residential proxy, as production reaches it and
                  # as the fill does (ArchiveReplayWiring.recordingProxy); the sbt line allows the tunnel's Basic
                  # auth. A hermetic run asks no wire, so it is handed no credentials.
                  DECODO_PROXY_USER: ${{ inputs.mode == 'record' && secrets.DECODO_PROXY_USER || '' }}
                  DECODO_PROXY_PASS: ${{ inputs.mode == 'record' && secrets.DECODO_PROXY_PASS || '' }}
                  # The OMDb rung of ImdbIdResolver is gated on this key
                  # (`omdb = Env.get("OMDB_API_KEY").map(...)`), so without it the
                  # ladder silently runs one rung short of production, which HAS the
                  # secret. Nothing logs the difference — the rung is simply absent.
                  OMDB_API_KEY:     ${{ secrets.OMDB_API_KEY }}
                  # Names the container above, so every repository — movies, screenings,
                  # slots, read model, staging and its transactional folder, tasks,
                  # freshness, chunk-scrape, OMDb attempts and the archive — runs on a
                  # real database.
                  #
                  # Re-enabled once the Mongo path produced a corpus. It had reported
                  # `resolved NOTHING — 0 films`, which was the coverage guard correctly
                  # refusing a fixpoint over nothing; the cause was two different isolated
                  # databases, not the pipeline. Measured locally after the fix: 773 films,
                  # tmdbId 289, the same enrichment ladder the in-memory path produces,
                  # three specs green in 12m05s.
                  #
                  # Absent, the suite runs in memory and says which it chose — a suite that
                  # can silently fall back is one that quietly stops testing what it claims.
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            # A one-pass order row's corpus, for the comparison job (`order-compare`); only a pass that ended green wrote
            # one, and a missing file fails the comparison, as the pass would have failed the row that compared it.
            - name: Upload the order pass's corpus for the comparison
              if: contains(matrix.phase, '-pass') && steps.suite.outcome == 'success'
              uses: actions/upload-artifact@v6
              with:
                  name: order-pass-${{ inputs.code }}-${{ matrix.phase }}
                  path: ${{ runner.temp }}/order-pass/
                  retention-days: 1
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true
            # A SUITE STOPPED AT ITS CEILING IS NOT A TEST FAILURE, and said so: the leg names the ceiling and the runner's
            # load at that moment (/proc/loadavg is the host's, so other jobs' CPU shows in it), so a row starved by CPU
            # contention reads "timed out under load" -- an infra verdict, rerun it -- rather than a red like any other.
            - name: Say whether the suite ran out of time, and under what load
              if: always() && !startsWith(matrix.phase, 'takes') && steps.suite.outcome != 'success' && steps.suite.outcome != 'skipped'
              shell: bash
              env:
                  LEG: ${{ matrix.phase }} (${{ inputs.country }})
                  LIMIT_MINUTES: ${{ (matrix.phase == 'convergence' || matrix.phase == 'next-day') && inputs.suite-timeout-minutes || inputs.order-suite-timeout-minutes }}
              run: |
                  started=$(cat "$RUNNER_TEMP/suite-started" 2>/dev/null) || exit 0
                  elapsed=$(( $(date +%s) - started ))
                  # Within a minute of the ceiling: the step was stopped there, not failed on its own.
                  [ "$elapsed" -ge $(( LIMIT_MINUTES * 60 - 60 )) ] || exit 0
                  read -r load1 load5 load15 _ < /proc/loadavg
                  cores=$(nproc)
                  echo "::error title=${LEG} timed out under load::${LEG} reached its ${LIMIT_MINUTES}-minute suite ceiling after $(( elapsed / 60 )) min; runner load ${load1} / ${load5} / ${load15} (1/5/15 min) on ${cores} cores -- an infra verdict, not a test failure: rerun it when the runner is not contended"
                  echo "### ${LEG} timed out under load (load ${load1} / ${load5} / ${load15} on ${cores} cores, ceiling ${LIMIT_MINUTES} min)" >> "$GITHUB_STEP_SUMMARY"
                  # The leg's commit status says it too (leg-verdict.sh): the one channel that outlives a job log the runner
                  # stopped shipping, as the germany rows' did in run #2301.
                  echo "timed out under load: ${LIMIT_MINUTES}-min suite ceiling, load ${load1} / ${load5} / ${load15} on ${cores} cores" > "$RUNNER_TEMP/leg-verdict-why"

            # WHAT THIS JOB ASKED THE OUTSIDE WORLD: the live calls of a recording's suite, or of a hermetic leg's
            # pre-suite fill, per external service and outcome -- the worker's own `kinowo_worker_http_total`, dumped by
            # tools.CiHttpCalls -- as a table on the summary and as `kinowo_ci_http_calls{job="ci-recording"}` beside
            # production's (Grafana "Kinowo HTTP", "CI calls per external service"). Nothing asked, nothing reported;
            # never fails the leg (scripts/ci/ci_http_calls.py).
            - name: Report the external services this job called
              if: always() && !startsWith(matrix.phase, 'takes')
              shell: bash
              env:
                  GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
                  GRAFANA_ANNOTATION_TOKEN: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
              run: python3 scripts/ci/ci_http_calls.py --country "${{ inputs.code }}" --row "${{ matrix.phase }}" --push || true

            - name: Upload the suite's CPU profile
              if: always() && inputs.profile && !startsWith(matrix.phase, 'takes')
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: convergence-profile-${{ inputs.code }}-${{ matrix.phase }}
                  path: convergence.jfr
                  if-no-files-found: warn
                  retention-days: 7

            # `include_passed: true` — these tests are the report. A convergence leg that
            # PASSES is the interesting case: the run's whole value is the numbers it
            # prints on the way (coverage per rating source, per-tick emissions, films in
            # versus films out), and suppressing passed tests hid every one of them. A
            # suite whose output is only visible when it breaks tells you nothing about
            # the day it worked.
            - name: Publish convergence test report
              if: always() && !startsWith(matrix.phase, 'takes')
              uses: mikepenz/action-junit-report@v5
              with:
                  # Annotations and a detailed job summary, never a check run: creating one spends GitHub API requests
                  # from the repository's shared GITHUB_TOKEN budget, and Main #2035's report step failed on 'API rate
                  # limit exceeded for installation'. The suite step's exit code grades the tests; neither of these needs the API.
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: ${{ matrix.phase }} (${{ inputs.country }})
                  include_passed: true
                  # A leg that wrote no XML has to say so. The directory is emptied by
                  # `convergence-setup` before the suite runs, so "no report" now means
                  # exactly one thing — this leg never reached an assertion — and that is
                  # a fact about the run, not an absence of one. Left at the default
                  # `false` the action shrugged and the check-run went green on a leg
                  # that had OOM'd. `fail_on_failure` stays off: the suite step's exit
                  # code already grades the tests that DID run, and failing here as well
                  # would only report the same failure twice.
                  #
                  # A `takes` row runs no convergence suite: its XML here is the takes check's, reported under
                  # the row's name.
                  require_tests: true

            - uses: ./.github/actions/convergence-findings
              if: always() && !startsWith(matrix.phase, 'takes')
              with:
                  title: ${{ matrix.phase }} (${{ inputs.country }})
                  log:   convergence.log
                  name:  ${{ inputs.code }}-${{ matrix.phase }}

            # A ROW OF ITS OWN, `takes`, beside the suite rather than after it: it reads the pinned pair setup restored and
            # none of the suite's output, and after the suite it was 4-9 minutes of every convergence row (run 38568096186).
            # Its red is its own: no bisect request, no hard-clusters seeds, as when it shared the row (those read the suite).
            # It does not see the gap fill the convergence row lays over its tree this run -- base and head still read one
            # tree, and the fill reaches the check on the next run, which lays it as a published fill.
            # THE IDENTITY TAKES CHECK (scripts/ci/identity-takes-check.sh): the pinned pair this row replays,
            # resolved by the base commit and by the head -- the model's takes, and the FINAL takes (model and
            # agreement stage) over the checked-in capture -- and every listing the code moved to another film --
            # lost or changed, and accepted by no identity judgement (identity-judgements.tsv) -- fails the row,
            # listed in the step summary with both films and both reasons; so does an unjudged SUSPECT take the head
            # took or flagged and the base did not, and a corpus-shape finding (`shape-command`, at both) only the head
            # has. Base vs head on one recording, so a new recording never fails it; only code does -- what the
            # recording brought stands at both and is listed, never failed. Its commit status names the base the next
            # run diffs from.
            # Exit 2 (it could not run: no base, an unfetchable one, a resolve that wrote nothing) is no verdict, and never
            # a pass: it posts an `error` status and fails the row (run 38533191835 passed every leg on a base it could
            # not fetch).
            - name: Check which listings the code moved to another film
              id: takes
              # THE A/A ROW (`takes-aa`, TAKES_AA; scripts/ci/harness_aa.py): the same check, the head against itself, both
              # sides in this row, nothing stored; red only on a take the two runs differ in (HARNESS FAULT), and it posts no
              # status (`identity takes (<cc>)` names the next run's base).
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && (matrix.phase == 'takes' || matrix.phase == 'takes-aa') }}
              shell: bash
              # 25 for the two resolves, 20 for the two unmatched-cluster ratchet replays (the final takes), 10 for the
              # two corpus-shape runs (only when the checks, their allowlists or the identity code changed)
              timeout-minutes: 55
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAP: ${{ inputs.heap }}
                  KINOWO_COUNTRY: ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  TAKES_BASE: ${{ inputs.takes-base }}
                  SHAPE_COMMAND: ${{ inputs.shape-command }}
                  # Where each head's resolve is stored for the run whose base it becomes (identity-takes-check.sh).
                  TAKES_STORE: ${{ inputs.takes-no-store != true && inputs.takes-no-store != 'true' && env.TAKES_RELEASE_TAG || '' }}
                  # The base is the `takes-base` row's (below), main's suite and a takes-only dispatch alike: this row runs
                  # the head and waits. On main the base was resolved here after the head, 159-252 s of a 12-15 minute UK
                  # or US row (the rotating fills change its key every run); a base row still queued leaves it to this row.
                  TAKES_SIDE: head
                  TAKES_BASE_JOB: takes-base (${{ inputs.country }})
                  TAKES_SKIP_MODE: ${{ inputs.takes-skip }}
                  TAKES_AA: ${{ matrix.phase == 'takes-aa' }}
              run: |
                  . scripts/ci/bounded-step.sh
                  # `|| code=$?`: the step runs under bash -e, which would end it at the script's own non-zero exit.
                  # A profiled dispatch: a JFR profile of every JVM the check starts (scripts/ci/jfr-every-jvm.sh).
                  [ "${{ inputs.profile }}" = true ] && . scripts/ci/jfr-every-jvm.sh
                  code=0; scripts/ci/identity-takes-check.sh "${{ inputs.code }}" "$RUNNER_TEMP/identity-takes" || code=$?
                  # the A/A row's verdict is harness_aa.py's ::error / PASS line in its log: no status, no move to accept
                  [ "$TAKES_AA" = true ] && exit "$code"
                  case $code in 0) state=success ;; 1) state=failure ;; *) state=error ;; esac
                  # allow-silenced: the status only names the next run's base; failing to post it must not turn the verdict
                  gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" \
                      -f context="identity takes (${{ inputs.code }})" -f description="$(head -1 "$RUNNER_TEMP/identity-takes/verdict.txt" | cut -c1-140)" \
                      -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null || true
                  case $code in
                      0) ;;
                      1) echo "::error title=identity takes (${{ inputs.code }})::the code moved listings to another film -- see the step summary" ;;
                      *) echo "::error title=identity takes (${{ inputs.code }})::the check could not run, so nothing was judged -- see the step log" ;;
                  esac
                  exit "$code"

            # THE INCREMENTAL = WHOLE GATE (scripts/ci/identity-drift-check.sh): production keeps its identity state event by
            # event -- the model's families, the agreement's verdicts, across ticks and deploys -- and must end where a whole
            # resolve of the same listings ends. Over the pinned pair this row laid, the head replays that sequence (answers
            # filed late, new venues, re-scrapes, listings leaving and returning, two deploys through the stores' BSON) and
            # every listing whose take at a checkpoint differs from the whole resolve's fails the row, unless
            # identity-drift-allow.tsv names it with why. And every listing's served take is recorded at each projection on
            # the way: one that FLIPS -- back to a film it left, moved more than once, or moved where none of its inputs did
            # (prod's kinowo_identity_listing_flips; services.identity.TakeFlips) -- fails the row only when the change ADDS
            # it: the base replays the same seeds and a flip both show is `pre-existing (backlog)`
            # (identity-flip-backlog.tsv), never failed (the differential gate, 2026-11-04; a TEMPORARY birth row passes too). Main's rows and drift-only runs
            # (scripts/identity-drift-ci), not a takes-only measurement's (its phases are takes and takes-base).
            # TWO ROWS (`takes-drift-1` / `takes-drift-2`), beside the takes check rather than after it: in the takes
            # row the check and the two seeds ran in turn, 30-55 minutes on main (runs 2683-2809), the 55-minute ceiling
            # cancelling half of them. FIXED SEEDS (the owner, 2026-11-04; scripts/ci/drift_seeds.py): the row's seeds are
            # drift-gate-seeds.tsv's, grown by the nightly explorer (identity-drift-explorer.yml, `drift-explore`: random
            # seeds, head alone, never red) -- and a red NAMES its seeds: the ::error title, verdict.txt, the summary and the leg's commit status (leg-verdict-why), with
            # its one-line reproducer and the drift slice of a red listing that has one. The job name stays.
            - name: Check that the incremental state ends where a whole resolve does
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && startsWith(matrix.phase, 'takes-drift-') }}
              shell: bash
              timeout-minutes: ${{ inputs.drift-twice && 140 || 75 }}
              env:
                  HEAP: ${{ inputs.heap }}
                  DRIFT_ROW: ${{ matrix.phase }}
                  DRIFT_PINS: ${{ format('{0},{1}', inputs.drift-seed-1, inputs.drift-seed-2) }}
                  DRIFT_TWICE: ${{ inputs.drift-twice }}
                  DRIFT_EXPLORE: ${{ inputs.drift-explore }}
                  DRIFT_EXPLORE_REF: ${{ format('run:{0}/identity-drift-{1}-{2}', github.run_id, inputs.code, matrix.phase) }}
                  # THE DIFFERENTIAL'S STORE (identity-drift-check.sh): each green head's flips on main, a base's anywhere
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRIFT_STORE: ${{ inputs.takes-no-store != true && inputs.takes-no-store != 'true' && 'identity-drift' || '' }}
              run: |
                  . scripts/ci/bounded-step.sh
                  if [ -n "$DRIFT_EXPLORE" ]; then
                      DRIFT_SEED_LIST=$(python3 scripts/ci/drift_explorer.py pick --cc "${{ inputs.code }}" --count "$DRIFT_EXPLORE" --salt "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$DRIFT_ROW")
                  else row=${DRIFT_ROW#takes-drift-}; case $row in aa-pass*) row=1 ;; esac
                      DRIFT_SEED_LIST=$(python3 scripts/ci/drift_seeds.py seeds --cc "${{ inputs.code }}" --row "$row" --pins "$DRIFT_PINS")
                  fi
                  # THE A/A PASSES (scripts/ci/harness_aa.py, review 2026-11-06 P5): the head against ITSELF -- base = head, so
                  # nothing is replayed at a base -- storing nothing (the takes-drift-1 row stores the head's flips), each
                  # pass one replay of the row-1 seeds, side by side; order-compare's `takes-drift-aa` compares the two, red
                  # only when they differ: the harness's own fault.
                  case $DRIFT_ROW in takes-drift-aa-pass*) export DRIFT_BASE=$GITHUB_SHA DRIFT_STORE="" ;; esac
                  [ -n "$DRIFT_SEED_LIST" ] \
                      || { echo "::error title=identity drift (${{ inputs.code }})::no seed for $DRIFT_ROW from pins '$DRIFT_PINS' or drift-gate-seeds.tsv -- nothing was judged"; exit 2; }
                  export DRIFT_SEED_LIST DRIFT_SEED="${DRIFT_SEED_LIST// /,}"
                  # A profiled dispatch: a JFR profile of every JVM the replay starts (scripts/ci/jfr-every-jvm.sh).
                  [ "${{ inputs.profile }}" = true ] && . scripts/ci/jfr-every-jvm.sh
                  echo "$DRIFT_ROW (${{ inputs.code }}) replays its fixed seed(s) $DRIFT_SEED_LIST (pins '$DRIFT_PINS'; drift-gate-seeds.tsv), judged against its base"
                  code=0; scripts/ci/identity-drift-check.sh "${{ inputs.code }}" "$RUNNER_TEMP/identity-drift" || code=$?
                  if [[ $DRIFT_ROW == takes-drift-aa-pass* ]]; then
                      aa=0; python3 scripts/ci/harness_aa.py judge --cc "${{ inputs.code }}" --code "$code" --verdict "$RUNNER_TEMP/identity-drift/verdict.txt" || aa=$?
                      [ "$aa" = 0 ] || echo "harness A/A, seed $DRIFT_SEED: $(cat "$RUNNER_TEMP/identity-drift/verdict.txt" 2>/dev/null || echo 'could not run')" > "$RUNNER_TEMP/leg-verdict-why"
                      exit "$aa"
                  fi
                  repro=$(cat "$RUNNER_TEMP/identity-drift/reproduce.txt" 2>/dev/null || echo "IdentityDrift ${{ inputs.code }} --seed $DRIFT_SEED")
                  case $code in
                      0) ;;
                      1) verdict=$(cat "$RUNNER_TEMP/identity-drift/verdict.txt" 2>/dev/null || echo 'divergences, or flips the change adds over its base')
                         echo "seed $DRIFT_SEED: $verdict -- reproduce: $repro" > "$RUNNER_TEMP/leg-verdict-why"
                         echo "::error title=identity drift (${{ inputs.code }}, seed $DRIFT_SEED)::$verdict -- each named in the step log; reproduce: $repro" ;;
                      *) echo "seed $DRIFT_SEED: the drift replay could not run" > "$RUNNER_TEMP/leg-verdict-why"
                         echo "::error title=identity drift (${{ inputs.code }}, seed $DRIFT_SEED)::the drift replay could not run, so nothing was judged -- see the step log" ;;
                  esac
                  exit "$code"
            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            - uses: actions/upload-artifact@v6
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && startsWith(matrix.phase, 'takes-drift-') }}
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: identity-drift-${{ inputs.code }}-${{ matrix.phase }}
                  path: ${{ runner.temp }}/identity-drift/
                  if-no-files-found: ignore
                  retention-days: 7
            # A takes or drift row's profiles, once its check ended: one per JVM it started (scripts/ci/jfr-every-jvm.sh).
            - name: Upload the check's CPU profiles
              if: always() && inputs.profile && startsWith(matrix.phase, 'takes')
              uses: actions/upload-artifact@v6
              with:
                  overwrite: true
                  name: convergence-profile-${{ inputs.code }}-${{ matrix.phase }}
                  path: ${{ runner.temp }}/jfr/
                  if-no-files-found: warn
                  retention-days: 7

            # THE BASE ROW of a takes-only dispatch (scripts/identity-measure): the takes check's base side -- its resolve,
            # final takes and corpus shape, each downloaded when stored, else made -- on a runner of its own, stored for the
            # `takes` row, which runs the head's meanwhile and waits for them (identity-takes-check.sh's THE BASE ROW). After
            # its head's session that row resolved the base itself: 5.5 of run 38735006233's 13.8-minute US row. No verdict
            # and no status: a base row that fails leaves the base to the takes row.
            - name: Store the base's side for the takes row
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && matrix.phase == 'takes-base' }}
              shell: bash
              timeout-minutes: 45
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAP: ${{ inputs.heap }}
                  KINOWO_COUNTRY: ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  TAKES_BASE: ${{ inputs.takes-base }}
                  SHAPE_COMMAND: ${{ inputs.shape-command }}
                  TAKES_STORE: ${{ inputs.takes-no-store != true && inputs.takes-no-store != 'true' && env.TAKES_RELEASE_TAG || '' }}
                  TAKES_SIDE: base
              run: |
                  . scripts/ci/bounded-step.sh
                  scripts/ci/identity-takes-check.sh "${{ inputs.code }}" "$RUNNER_TEMP/identity-takes"

            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            # THE TAKES ROW'S BUILD, for the next takes row to restore (convergence-setup's `takes`): the check compiled
            # worker/Test and worker/It, which no other row does, and the job-end entry under the convergence key is
            # whichever row finishes first -- a suite row's, without them (run 38693633421: Spain's, 60 MB). On main
            # only: a branch's entry is restorable from that branch alone. Saved only once they exist (a check that
            # found no identity code changed compiles nothing).
            # AND THE FIRST DRIFT SEED'S, when no takes entry was there to restore: the drift replay compiles scrapers/Test
            # and worker/Test (884 sources, ~170 s a row) and a takes check that compiled nothing saves nothing, so after
            # an eviction every drift row of every run recompiled them all (runs 41242893057-41271681408: 10 of 10 rows,
            # 5 runs in a row). Saved under the takes family, whose restore every takes and drift row tries first, and only
            # when the restored build held no worker test classes (convergence-setup reads that before anything compiles):
            # a row that restored them saves nothing. The takes row's own entry, when it compiled, wins the key (it ends
            # first) and this save is then a no-op warning.
            - name: Did the takes check compile worker's test and it classes?
              id: takes-build
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && (matrix.phase == 'takes' || matrix.phase == 'takes-drift-1') && github.ref == 'refs/heads/main' }}
              shell: bash
              env:
                  PHASE: ${{ matrix.phase }}
                  RESTORED_TESTS: ${{ steps.setup.outputs.worker-test-classes-restored }}
              run: |
                  # The check's JVMs ended before the entry is read: a step past its timeout is abandoned, not ended.
                  scripts/ci/stop-stray-sbt.sh
                  if [ "$PHASE" = takes ]; then
                      if compgen -G 'worker/target/scala-*/test-classes/*' > /dev/null && compgen -G 'worker/target/scala-*/it-classes/*' > /dev/null; then
                          echo "compiled=true" >> "$GITHUB_OUTPUT"
                      fi
                  elif [ "$RESTORED_TESTS" != true ] && compgen -G 'worker/target/scala-*/test-classes/*' > /dev/null; then
                      echo "the restored build held no worker test classes: saving this row's worker/Test build for the next drift rows"
                      echo "compiled=true" >> "$GITHUB_OUTPUT"
                  fi
            - uses: ./.github/actions/sbt-target-cache
              if: ${{ !cancelled() && steps.takes-build.outputs.compiled == 'true' }}
              with:
                  key: sbt-target-takes-${{ runner.os }}-${{ steps.setup.outputs.sbt-sources }}
                  save-only: 'true'

            # The check's own output -- both sides' decisions and final takes, base.txt, verdict.txt -- for
            # scripts/identity-measure, which classifies every move against the judgements (scripts/identity_measure.py).
            - uses: actions/upload-artifact@v6
              if: ${{ !cancelled() && inputs.mode == 'hermetic' && matrix.phase == 'takes' }}
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: identity-takes-${{ inputs.code }}
                  path: ${{ runner.temp }}/identity-takes/
                  if-no-files-found: ignore
                  retention-days: 7

            # The capture this leg just spent an hour building back to the release it was restored from.
            #
            # ONE writing row, and the phase test is what makes it one. Both rows finish
            # into the same `enrichment-<code>.tar.zst`, and `gh release upload --clobber`
            # is a last-writer-wins overwrite of a 428 MB asset — two in flight is how the
            # next run restores a truncated tree. The replay row has nothing to publish
            # anyway: its replays share the preloaded cache, and the leg that recorded that
            # cache measured 4 live fills across the whole run.
            #
            # `complete` is what lets a RECORDING leg pin the tree it leaves as the pair every
            # hermetic leg replays: the boot answered every request the corpus makes (live,
            # or remembered as the failure it was) only if it got to the end. A leg that ran
            # out of time before then still publishes its working tree, so the next
            # recording resumes from it — but a hermetic leg must never replay a half-recorded
            # pair. Replays re-ask nothing: they share the boot's cache.
            - uses: ./.github/actions/convergence-publish
              if: always() && matrix.phase == 'convergence'
              id: publish
              with:
                  code: ${{ inputs.code }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  green: ${{ steps.suite.outcome == 'success' && steps.suite.outputs.failed != 'true' }}
                  mode: ${{ inputs.mode }}
                  complete: ${{ inputs.mode == 'record' && steps.suite.outcome != 'cancelled' }}
                  pin: ${{ inputs.pin-hermetic }}
                  # A hermetic row's fetchable gaps, for the next leg's pre-suite fill (MissingFixtures.writeRefetches).
                  # Its own fill went up before its suite ("publish-fill").
                  refetch-list: ${{ inputs.mode == 'hermetic' && format('test/resources/fixtures/enrichment-{0}.refetch.tsv', inputs.code) || '' }}

            # A red HERMETIC leg on main asks `convergence-bisect.yml` which commit did it — with
            # the sample alias, which the bisect first checks reproduces the failure.
            # Not for a red takes check alone (below too, the ratchet): it names its own range (base..head), and
            # neither the sample nor the suite's findings can reproduce it.
            # Not when setup itself failed (no pinned pair, run 324): there is no pair to replay, and no commit made it red.
            - uses: ./.github/actions/convergence-bisect-request
              if: failure() && steps.setup.outcome == 'success' && inputs.mode == 'hermetic' && github.ref == 'refs/heads/main' && !startsWith(matrix.phase, 'takes')
              with:
                  country:        ${{ inputs.country }}
                  code:           ${{ inputs.code }}
                  sample-command: ${{ inputs.sample-command }}
                  heap:           ${{ inputs.heap }}
                  step-minutes:   ${{ inputs.sample-suite-timeout-minutes }}
                  # The pair as this row replayed it: setup's, then the fill the convergence row published before
                  # its suite — the only fill laid over its tree on main — last.
                  pair:           ${{ format('{0} {1}', steps.setup.outputs.hermetic-pair, steps.publish-fill.outputs.fill-asset) }}

            # Only on a red leg, and after the publish so it can never cost the tree:
            # the films this leg named become clusters the itAll layer checks on every
            # push. See the action. The SUITE's findings — so not when the sample failed,
            # whose findings the ratchet below reads instead (in the old shape a red sample
            # meant this job never ran).
            - uses: ./.github/actions/hard-clusters-ratchet
              if: failure() && !startsWith(matrix.phase, 'takes')
              with:
                  code:  ${{ inputs.code }}
                  name:  ${{ inputs.code }}-${{ matrix.phase }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            # A RECORDING whose per-origin health failed (convergence-publish's "Judge this recording's per-origin
            # health", its table in the log): red here, after every publish, so the tree
            # is saved either way.
            - name: Fail the leg on the recording's health
              if: always() && inputs.mode == 'record' && steps.publish.outputs.recording-healthy == 'false'
              shell: bash
              env:
                  UNKNOWN: ${{ steps.publish.outputs.recording-health-unknown }}
              run: |
                  if [ "$UNKNOWN" = proxy-unreachable ]; then
                      echo "::error::UNKNOWN: proxy unreachable — ${{ inputs.country }}'s recording met the residential proxy down, so the origins it routes through it were not judged; fix the proxy (the Decodo probe workflow says whether it answers), not the code — see the Recording health table in this job's log"
                  else
                      echo "::error::an origin refused most of ${{ inputs.country }}'s recording, vanished from its tree, or the health could not be judged — see the Recording health table in this job's log"
                  fi
                  exit 1

            # THE CAPTURE'S OWN VERDICT: a recording's convergence row is red only when it captured nothing usable -- no
            # `[<code>] boot complete` in its log means the boot never answered every request the corpus makes, so no
            # complete recording exists for verify to replay (convergence-publish.sh pins and marks prod-latest on the same
            # line). A suite that failed after a complete boot is reported, not failed: Verify scrape recording judges it.
            - name: Fail the capture unless its boot completed
              if: always() && inputs.mode == 'record' && matrix.phase == 'convergence'
              shell: bash
              env:
                  SUITE: ${{ steps.suite.outputs.failed == 'true' && 'failure' || steps.suite.outcome }}
              run: |
                  if grep -q "^\[${{ inputs.code }}\] boot complete" convergence.log 2>/dev/null; then
                      [ "$SUITE" = success ] || echo "::warning::${{ inputs.country }}'s recording suite ended $SUITE after a complete boot -- a live-fallback run, no verdict: Verify scrape recording replays this recording hermetically and judges the code"
                      exit 0
                  fi
                  echo "::error::${{ inputs.country }}'s capture is incomplete: its boot never finished (suite $SUITE), so tonight has no complete ${{ inputs.code }} recording to verify"
                  exit 1

            # NOTHING WRITES target/ WHILE THE JOB-END CACHE SAVE READS IT: a step past its timeout (the suite's,
            # the takes check's) is abandoned with its sbt still compiling, and main's save would store its half-written
            # classes beside an analysis that no longer describes them, for every later restore. (stop-stray-sbt.sh)
            - name: End any JVM a timed-out step left running
              if: always()
              shell: bash
              run: scripts/ci/stop-stray-sbt.sh

            - name: Report the job's memory and disk writes
              if: always()
              shell: bash
              run: scripts/ci/cgroup-sampler.sh report || true

            # github.com's hosted runner: the whole VM's peak memory and least free disk (.github/actions/free-disk).
            - uses: ./.github/actions/runner-peaks
              if: always()

            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: ${{ inputs.country }}

            # Last, and whatever happened (scripts/ci/leg-verdict.sh, LegVerdictWiringSpec).
            - uses: ./.github/actions/leg-verdict
              if: always()
              with:
                  leg:    ${{ matrix.phase }} (${{ inputs.country }})
                  status: ${{ job.status }}
                  token:  ${{ secrets.GITHUB_TOKEN }}

    # THE ORDER COMPARISON, A JOB OF ITS OWN (2026-11-02, rows under 8 minutes): a split row ran its two passes side by
    # side on one 4-core runner and compared them, 8-13 minutes; one pass alone took 8-9.3. Each pass now replays in a
    # row of its own (`order-independence-p01-pass0`, `-p01-pass1`, `-p12-pass1`, `-p12-pass2`: the same passes, seeds
    # and rows' runs as before, pass 1 in both) and writes its corpus out (ReplayCorpusFile); this job reads the two its
    # row names and runs the same order test on them, the same CorpusComparison, under the name the row had --
    # `order-independence-p01 (<country>)` -- so the verdict, its report and its readers are unchanged. No MongoDB, no
    # corpus: a warm sbt and the two files. And on a push that changed a harness, THE DRIFT HARNESS'S A/A (2026-11-06):
    # its two passes (`takes-drift-aa-pass0`, `-pass1`, rows side by side where one row replayed twice in turn, 35-69
    # minutes for Germany) compared under the row's old name, `takes-drift-aa (<country>)` -- two TSVs, no sbt
    # (scripts/ci/drift-replays-compare.sh, judged by harness_aa.py). Spain, splitting no order row, runs it alone.
    order-compare:
        name: ${{ matrix.phase }} (${{ inputs.country }})
        needs: [ convergence ]
        if: ${{ !cancelled() && inputs.reused-from == '' && (inputs.order-command != '' && inputs.order-split || inputs.harness-aa && inputs.mode == 'hermetic' && inputs.takes-row) && !inputs.takes-only && !inputs.drift-only && (inputs.countries == '' || contains(format(',{0},', inputs.countries), format(',{0},', inputs.code))) }}
        strategy:
            fail-fast: false
            max-parallel: ${{ inputs.max-parallel }}
            matrix:
                phase: ${{ fromJson(inputs.order-command != '' && inputs.order-split && format('[{0}{1}]', inputs.order-one-phase && '"order-independence-p01"' || '"order-independence-p01","order-independence-p12"', inputs.harness-aa && ',"takes-drift-aa"' || '') || '["takes-drift-aa"]') }}
        runs-on: ${{ inputs.runner }}
        timeout-minutes: 20
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: ${{ inputs.country }}
            - uses: ./.github/actions/convergence-setup
              if: matrix.phase != 'takes-drift-aa'
              with:
                  code:          ${{ inputs.code }}
                  token:         ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token:    ${{ secrets.DOCKERHUB_TOKEN }}
                  mode:          ${{ inputs.mode }}
                  corpus-run:    ${{ inputs.corpus-run }}
                  replay:        'false'
            - name: Download the drift harness's two A/A passes
              if: ${{ !cancelled() && matrix.phase == 'takes-drift-aa' }}
              uses: actions/download-artifact@v6
              with:
                  # each into a directory of its name: the two hold the same file names
                  pattern: identity-drift-${{ inputs.code }}-takes-drift-aa-pass*
                  path: ${{ runner.temp }}/drift-aa
            - name: Compare the drift harness's two A/A passes
              if: ${{ !cancelled() && matrix.phase == 'takes-drift-aa' }}
              shell: bash
              env:
                  PASSES: ${{ runner.temp }}/drift-aa/identity-drift-${{ inputs.code }}-takes-drift-aa-pass
              run: |
                  code=0; scripts/ci/drift-replays-compare.sh "${{ inputs.code }}" "${PASSES}0" "${PASSES}1" "$RUNNER_TEMP/drift-aa-verdict.txt" || code=$?
                  aa=0; python3 scripts/ci/harness_aa.py judge --cc "${{ inputs.code }}" --code "$code" --verdict "$RUNNER_TEMP/drift-aa-verdict.txt" || aa=$?
                  [ "$aa" = 0 ] || echo "harness A/A: $(cat "$RUNNER_TEMP/drift-aa-verdict.txt" 2>/dev/null || echo 'the two passes could not be compared')" > "$RUNNER_TEMP/leg-verdict-why"
                  exit "$aa"
            - name: Download the row's two passes
              if: matrix.phase != 'takes-drift-aa'
              uses: actions/download-artifact@v6
              with:
                  pattern: order-pass-${{ inputs.code }}-${{ matrix.phase }}-pass*
                  path: ${{ runner.temp }}/order-pass
                  merge-multiple: true
            # A pass row that died (exit 137, Verify scrape recording #14) uploaded no corpus: named, never a test failure.
            - name: Check both passes arrived
              if: matrix.phase != 'takes-drift-aa'
              shell: bash
              run: scripts/ci/order-passes-present.sh "${{ runner.temp }}/order-pass" "${{ matrix.phase == 'order-independence-p01' && '0,1' || '1,2' }}" "${{ matrix.phase }}"
            - name: Compare the ${{ inputs.country }} ${{ matrix.phase }} passes
              if: matrix.phase != 'takes-drift-aa'
              id: suite
              shell: bash
              timeout-minutes: 15
              run: |
                  . scripts/ci/bounded-step.sh
                  set -o pipefail
                  ls -l "$KINOWO_CONVERGENCE_ORDER_PASS_IN" || true
                  rm -rf target/test-reports/unit
                  scripts/ci/stop-stray-sbt.sh
                  # As every sbt run of a leg: the runner's whole CPU beside it (cpu-sampler.sh).
                  scripts/ci/cpu-sampler.sh 15 & sampler=$!; trap 'kill "$sampler"' EXIT
                  read -ra jvm <<< "$JVM_OPTIONS"
                  sbt -J-Xmx${{ inputs.heap }} "${jvm[@]}" ${{ inputs.order-command }} 2>&1 | tee convergence.log
              env:
                  JVM_OPTIONS:      ${{ inputs.jvm-options }}
                  KINOWO_COUNTRY:   ${{ inputs.code }}
                  KINOWO_COUNTRIES: ${{ inputs.code }}
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ inputs.code }}
                  KINOWO_CONVERGENCE_ORDER_PASSES: ${{ matrix.phase == 'order-independence-p01' && '0,1' || '1,2' }}
                  KINOWO_CONVERGENCE_ORDER_PASS_IN: ${{ runner.temp }}/order-pass
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            - name: Publish convergence test report
              if: always() && matrix.phase != 'takes-drift-aa'
              uses: mikepenz/action-junit-report@v5
              with:
                  annotate_only: true
                  job_summary: true
                  detailed_summary: true
                  report_paths: 'target/test-reports/unit/**/*.xml'
                  check_name: ${{ matrix.phase }} (${{ inputs.country }})
                  include_passed: true
                  require_tests: true
            - uses: ./.github/actions/convergence-findings
              if: always() && matrix.phase != 'takes-drift-aa'
              with:
                  title: ${{ matrix.phase }} (${{ inputs.country }})
                  log:   convergence.log
                  name:  ${{ inputs.code }}-${{ matrix.phase }}
            - name: End any JVM a timed-out step left running
              if: always()
              shell: bash
              run: scripts/ci/stop-stray-sbt.sh
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: ${{ inputs.country }}
            - uses: ./.github/actions/leg-verdict
              if: always()
              with:
                  leg:    ${{ matrix.phase }} (${{ inputs.country }})
                  status: ${{ job.status }}
                  token:  ${{ secrets.GITHUB_TOKEN }}
