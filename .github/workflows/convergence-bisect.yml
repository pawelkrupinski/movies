#
# THE AUTO-BISECT — which commit turned a country's hermetic convergence leg red?
#
# A leg is an hour (the US: three and a half), each suite's lane keeps one run in flight and
# one pending, and a day of pushes collapses into a handful of verdicts — so a red leg names a
# SHA with an untested range under it, and red streaks ran from three hours to two and a half
# days with the breaking commit unknown. A HERMETIC leg replays the same recorded pair
# whatever the code, so the question has a mechanical answer: replay the fast sample over the
# pipeline commits of (last green, first red], halving the range each time.
#
# DISPATCHED by the convergence run itself, as its last job, when a leg on main failed — not
# run inside it: a bisect there would hold the suite's one-run lane for up to four hours,
# queueing the very next verdict (and the newer red run meant to supersede this bisect). A red
# leg on main leaves a `bisect-request-<code>` artifact (`.github/actions/convergence-bisect-request`);
# this workflow bisects exactly the countries that left one.
#
# Not started by the convergence run's COMPLETION any more. Main's `kick-convergence`
# dispatches the convergence runs with the GITHUB_TOKEN, so they belong to
# github-actions[bot] — and GitHub creates no run for an event the GITHUB_TOKEN caused, `workflow_dispatch` and `repository_dispatch` excepted. Their
# completions started nothing: every bisect that ever ran followed a run dispatched by hand
# with a personal token, and a red run from a normal push was never bisected. A dispatch is the
# one event the GITHUB_TOKEN may raise. (ConvergenceBisectTriggerSpec)
#
# By hand: `gh workflow run convergence-bisect.yml -f suite="Country convergence" -f run-id=<red run>`.
#
# CONFIRMED first: the last green commit is replayed once under the red leg's recording, since
# the pair is re-pinned nightly and a red the new pair brings is no commit's doing.
#
# CAPPED: per country, at most three halvings — exact for up to eight pipeline commits — and
# none started that BUDGET_MINUTES cannot fit — a budget for the halvings alone, after the
# (at most two) replays that confirm there is a range to bisect — so the worst case is one runner
# per red country for ~2 hours (the US: ~3.5). A range it could not narrow is reported as a range, never as a guess. A
# newer red run of the same suite supersedes an older bisect: its range contains the older one;
# nothing else starts a bisect, so nothing else can cancel one.
# The logic is `.github/scripts/convergence-bisect.sh` (ConvergenceBisectSpec).
#
name: Convergence bisect

on:
    workflow_dispatch:
        inputs:
            suite:
                description: The convergence workflow whose run went red.
                required: true
                type: choice
                options:
                    - Country convergence
                    - US convergence
            run-id:
                description: The red run's id — the one that left the `bisect-request-*` artifacts.
                required: true
                type: string

concurrency:
    # Only a newer RED run supersedes a bisect (its range contains the older one) — and only red
    # runs on main start one, since the convergence run dispatches it on nothing else. So one lane
    # per suite, cancelling. (ConvergenceBisectConcurrencySpec)
    group: convergence-bisect-${{ inputs.suite }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # `convergence-setup` reads the pinned pair from here.
    FIXTURE_RELEASE_TAG: convergence-fixtures
    BUDGET_MINUTES: 90

jobs:
    # Seconds, first: the secrets the jobs below read are set, so a missing one fails here
    # rather than hours into a leg. OMDB_API_KEY is left out: the legs read it, but it is not a repository secret and they run without it. scripts/ci/preflight.sh never prints a value.
    # (PreflightWiringSpec)
    preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
                  sparse-checkout-cone-mode: false
            - name: Secrets present
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: scripts/ci/preflight.sh TMDB_API_KEY

    # The red run, as GitHub records it — still in progress when its last job dispatched this,
    # so its CONCLUSION is not read: the requests are the gate, since only a red hermetic leg on
    # main leaves one.
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
        outputs:
            requests: ${{ steps.requests.outputs.requests }}
            head-sha: ${{ steps.requests.outputs.head-sha }}
            red-run:  ${{ steps.requests.outputs.red-run }}
        steps:
            - id: requests
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN: ${{ inputs.run-id }}
                  SUITE: ${{ inputs.suite }}
              run: |
                  set -uo pipefail
                  IFS=$'\t' read -r name branch sha url < <(gh api "repos/$GH_REPO/actions/runs/$RUN" \
                      --jq '[.name, .head_branch, .head_sha, .html_url] | @tsv')
                  if [ "$name" != "$SUITE" ]; then
                      echo "::error::run $RUN is a '$name' run, not '$SUITE'"
                      exit 1
                  fi
                  echo "head-sha=$sha" >> "$GITHUB_OUTPUT"
                  echo "red-run=$url" >> "$GITHUB_OUTPUT"
                  if [ "$branch" != main ]; then
                      echo "run $RUN is on $branch, not main — nothing to bisect"
                      echo "requests=[]" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  mkdir -p requests
                  gh run download "$RUN" --pattern 'bisect-request-*' --dir requests 2>/dev/null || true
                  requests=$(find requests -name '*.json' -exec cat {} + | jq -sc '.')
                  echo "bisect requests: $requests"
                  echo "requests=${requests:-[]}" >> "$GITHUB_OUTPUT"

    bisect:
        name: bisect (${{ matrix.request.country }})
        needs: [plan, preflight]
        if: needs.plan.outputs.requests != '[]' && needs.plan.outputs.requests != ''
        strategy:
            fail-fast: false
            matrix:
                request: ${{ fromJson(needs.plan.outputs.requests) }}
        runs-on: ubuntu-latest
        # Above everything the script may spend, so its own cap is what stops it and the
        # verdict it has so far still reaches the summary: up to two replays before bisecting
        # (the red commit when only the full leg failed, and the last green one under this
        # recording) plus BUDGET_MINUTES of halvings. The US sample is 60 minutes a replay:
        # 60 + 60 + 90, plus setup.
        timeout-minutes: 240
        # READ-ONLY: this job builds and runs the code of every commit it replays. The commit
        # comment, the one write, is `tell`'s, below — no job running project code holds a
        # write token.
        permissions:
            contents: read
            # The previous runs' jobs, to find the last green leg.
            actions: read
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ needs.plan.outputs.head-sha }}
                  fetch-depth: 0
                  persist-credentials: false
            # The SAME recorded pair the red leg replayed, so a recorder that pinned a new pair
            # meanwhile cannot move the ground.
            - uses: ./.github/actions/convergence-setup
              with:
                  code:          ${{ matrix.request.code }}
                  token:         ${{ secrets.GITHUB_TOKEN }}
                  mode:          hermetic
                  hermetic-pair: ${{ matrix.request.pair }}

            - name: Bisect over the pipeline commits since the last green leg
              id: bisect
              shell: bash
              env:
                  GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO:         ${{ github.repository }}
                  COUNTRY:         ${{ matrix.request.country }}
                  CODE:            ${{ matrix.request.code }}
                  WORKFLOW:        ${{ inputs.suite }}
                  RUN_ID:          ${{ inputs.run-id }}
                  BAD:             ${{ needs.plan.outputs.head-sha }}
                  SAMPLE_COMMAND:  ${{ matrix.request.sample }}
                  HEAP:            ${{ matrix.request.heap }}
                  STEP_MINUTES:    ${{ matrix.request.minutes }}
                  MAX_STEPS:       3
                  SAMPLE_FAILED:   ${{ matrix.request.sampleFailed }}
                  # What every sample replay runs on — the same as the leg's sample step.
                  KINOWO_COUNTRY:   ${{ matrix.request.code }}
                  KINOWO_COUNTRIES: ${{ matrix.request.code }}
                  MONGODB_URI:      mongodb://127.0.0.1:27017/?directConnection=true
                  TMDB_API_KEY:     ${{ secrets.TMDB_API_KEY }}
                  OMDB_API_KEY:     ${{ secrets.OMDB_API_KEY }}
                  KINOWO_CONVERGENCE_ENRICHMENT_FIXTURES: enrichment-${{ matrix.request.code }}
                  KINOWO_CONVERGENCE_HERMETIC: 'true'
              run: |
                  set -uo pipefail
                  # Copied OUT of the checkout first: `git bisect` rewrites the working tree
                  # under a running script, and bash reads a script as it goes.
                  tools="$RUNNER_TEMP/bisect"; mkdir -p "$tools"
                  cp .github/scripts/convergence-bisect.sh .github/convergence-paths.txt "$tools/"
                  export CONVERGENCE_PATHS_FILE="$tools/convergence-paths.txt"
                  export FIRST_BAD_FILE="$tools/first-bad"
                  # One replay of the sample at whatever commit bisect checked out: 0 green,
                  # 1 red, 125 untestable — a commit older than hermetic replay, a timeout, or
                  # a request that commit makes and the pinned recording never saw.
                  cat > "$tools/step.sh" <<'STEP'
                  #!/usr/bin/env bash
                  set -uo pipefail
                  git grep -q KINOWO_CONVERGENCE_HERMETIC HEAD -- worker/src/fixtures/scala/tools/ArchiveReplayWiring.scala || exit 125
                  # The pinned corpus over whatever the commit carries — the pair is the constant.
                  tar -xzf "scrape-archive/scrapes-$CODE.tar.gz"
                  timeout "$((STEP_MINUTES * 60))" sbt -J-Xmx"$HEAP" "$SAMPLE_COMMAND" > "$RUNNER_TEMP/bisect-step.log" 2>&1
                  status=$?
                  git checkout -q -- test/resources
                  echo "$(git rev-parse --short HEAD): sample exit $status"
                  grep -q 'HERMETIC run needed' "$RUNNER_TEMP/bisect-step.log" && exit 125
                  [ "$status" -eq 124 ] && exit 125
                  [ "$status" -eq 0 ] && exit 0
                  exit 1
                  STEP
                  chmod +x "$tools/step.sh"
                  export STEP_COMMAND="$tools/step.sh"
                  git checkout -q -- test/resources
                  if ! good=$("$tools/convergence-bisect.sh" last-green); then
                      echo "### Convergence bisect — $COUNTRY" >> "$GITHUB_STEP_SUMMARY"
                      echo "No green $COUNTRY leg in the last 60 runs — nothing to bisect from." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi
                  "$tools/convergence-bisect.sh" bisect "$good" "$BAD"
                  if [ -s "$FIRST_BAD_FILE" ]; then
                      echo "first-bad=$(cat "$FIRST_BAD_FILE")" >> "$GITHUB_OUTPUT"
                  fi

            # Handed to `tell` as a file: a matrix job's outputs are the last leg's alone.
            - name: Hand the first bad commit to the comment job
              if: steps.bisect.outputs.first-bad != ''
              shell: bash
              env:
                  SHA:     ${{ steps.bisect.outputs.first-bad }}
                  COUNTRY: ${{ matrix.request.country }}
              run: |
                  mkdir -p first-bad
                  printf '%s %s\n' "$SHA" "$COUNTRY" > "first-bad/$COUNTRY.txt"
            - uses: actions/upload-artifact@v6
              if: steps.bisect.outputs.first-bad != ''
              with:
                  name: first-bad-${{ matrix.request.code }}
                  path: first-bad/
                  retention-days: 3

    # The commit comment on each first bad commit: the workflow's only write, in a job that
    # checks out and runs nothing of the project.
    tell:
        needs: [plan, bisect]
        if: ${{ !cancelled() && needs.bisect.result != 'skipped' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            # None at all when no leg pinned a commit.
            - uses: actions/download-artifact@v6
              continue-on-error: true
              with:
                  pattern: first-bad-*
                  merge-multiple: true
                  path: first-bad
            - name: Tell the first bad commit
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO:  ${{ github.repository }}
                  RED_RUN:  ${{ needs.plan.outputs.red-run }}
                  THIS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -uo pipefail
                  shopt -s nullglob
                  failed=0
                  for f in first-bad/*.txt; do
                      read -r SHA COUNTRY < "$f"
                      gh api -X POST "repos/$GH_REPO/commits/$SHA/comments" \
                          -f body="The hermetic $COUNTRY convergence sample turns red at this commit and was green at its parent. Red leg: $RED_RUN — bisected by $THIS_RUN. The leg replays a pinned recorded corpus and enrichment tree, so the change is this commit's, not the network's." \
                          || failed=1
                  done
                  exit "$failed"
