#
# THE VERIFY PHASE of the nightly recording: main's code judged, hermetically, against what one
# `Record scrape fixtures` run captured ("Capture, then verify").
#
# The recorder used to capture AND judge in one go: its legs ran their suites in record mode, with live
# fallback, so one red meant any of "the scrape or tunnel failed", "the runner was starved" (1476: Germany at
# its 120-minute ceiling), "a live site timed out" or "the code mishandles tonight's data" (1542: a sold-out
# billing splitting a pair the next day). Now the recorder only captures and goes red only when it could not
# (its legs' "Fail the capture unless its boot completed"); its last job dispatches this run with its own run
# id, and this run replays that recording the way every verdict leg replays a pair:
#
#   - HERMETIC: `mode: hermetic` with the recording named (`corpus-run`), so each leg restores that run's corpus
#     and the tree recorded over it, bare -- no pinned pair, no fills, no pre-suite fetch. A request the
#     recording cannot answer fails the leg naming the missing fixture.
#   - THE WHOLE SUITE: boot, convergence, order-independence and the next-day test (the stability check 1542
#     tripped: the next day's listings taken over the same booted corpus), as the identity lane runs them. No
#     takes row (`takes-row: false`): that diffs a base commit against a head over one pair, the push verdict's
#     job (identity-model-convergence.yml), not a verdict on one commit against one recording.
#   - ONLY WHAT WAS CAPTURED: a country whose capture did not complete is the capture's red, so it runs no leg
#     here (scripts/ci/recorded-countries.sh, `countries`).
#   - BOUNDED: the identity lane's own ceilings (row 55, suite 30 minutes), sized from green hermetic rows, not
#     the recorder's cold-recording ones. A suite stopped at its ceiling says "timed out under load" with the
#     runner's load, so contention reads as infra, not as a test failure.
#
# GATING: this workflow, not the recorder, is what the pre-push red gate reads for the nightly data
# (scripts/hooks/pre-push's GatingWorkflows). A red here clears with a later green run on main -- tonight's,
# or one dispatched by hand on the SAME recording once a fix has landed, which takes this run's ~30 minutes
# rather than another night:
#
#   gh workflow run verify-scrape-recording.yml --ref main -f recording=<Record scrape fixtures run id>
#
name: Verify scrape recording

on:
    workflow_dispatch:
        inputs:
            recording:
                description: The `Record scrape fixtures` run (its run id, GITHUB_RUN_ID) whose recording every leg replays.
                required: true
                type: string
            countries:
                description: The countries (pl,de,uk,es,us) to judge; empty judges every country the recording captured complete.
                required: false
                type: string
                default: ''

concurrency:
    group: verify-scrape-recording-${{ github.ref }}
    # A verdict half-way through is kept: a cancelled run says nothing to the red gate, so cancelling one for the
    # next would only delay the verdict both are asked for.
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8
    # The fixtures release `convergence-setup` (the order-comparison jobs') reads; a called workflow's own env does not reach here.
    FIXTURE_RELEASE_TAG: convergence-fixtures

jobs:
    # Seconds, before any leg takes a runner: which countries the recording holds complete, and that each one's
    # corpus and tree are there (convergence-preflight.sh, the identity lane's check for a named recording).
    preflight:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        # THE PLAN (WorkflowPlanSpec): the legs' matrix call reads `needs.preflight.outputs`.
        outputs:
            countries: ${{ steps.countries.outputs.countries }}
            # The `leg` matrix: a row for each country the recording captured complete and none for the rest, so no row is
            # created to be skipped (a skipped matrix job renders its `name:` template raw in the run graph).
            leg-matrix: ${{ steps.plan.outputs.leg-matrix || '{"country":[],"include":[]}' }}
            # The order-comparison jobs' rows: the recorded countries that split their order replay.
            order-matrix: ${{ steps.plan.outputs.order-matrix || '{"country":[],"include":[]}' }}
            any-order: ${{ steps.plan.outputs.any-order || 'false' }}
            recording: ${{ inputs.recording }}
            # ci-runner's measurement slots, as the recorder's legs (the owner, 2026-11-06); ubuntu-22.04 while it is off.
            runner: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-22.04' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/workflows
            - name: Which countries the recording captured complete
              id: countries
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
                  RECORDING: ${{ inputs.recording }}
                  ASKED: ${{ inputs.countries || '' }}
              run: |
                  set -euo pipefail
                  countries=$(scripts/ci/recorded-countries.sh "$RECORDING" "$ASKED")
                  if [ -z "$countries" ]; then
                      echo "::error::recording $RECORDING holds no complete country${ASKED:+ among $ASKED} -- nothing to verify (a capture failure is Record scrape fixtures' red, not this run's)"
                      exit 1
                  fi
                  echo "verifying recording $RECORDING for: $countries"
                  echo "countries=$countries" >> "$GITHUB_OUTPUT"
            # THE LEG ROWS: Identity model convergence's own (its LEG_ROWS, read by convergence_reuse.py legs -- aliases,
            # splits, heaps, Mongo, typed as YAML types them), each recorded country's full convergence leg. Written once:
            # a copy here drifted, and a narrowing that matched none started no leg without a word (run 42524021121).
            - name: Which legs does this run start?
              id: plan
              env:
                  LEG_CODES: ${{ steps.countries.outputs.countries }}
              run: python3 scripts/ci/convergence_reuse.py legs >> "$GITHUB_OUTPUT"
            - name: Every leg's recording is there
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  FIXTURE_RELEASE_TAG: convergence-fixtures
              run: scripts/ci/convergence-preflight.sh "${{ steps.countries.outputs.countries }}" "${{ inputs.recording }}"

    # THE IDENTITY LANE'S ROWS (identity-model-convergence.yml's `leg` matrix: aliases, splits, heaps, Mongo), replaying
    # the named recording instead of the pinned pair. EVERY ROW CARRIES EVERY KEY THE JOB READS.
    leg:
        needs: [ preflight ]
        name: verify (${{ matrix.country }})
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.preflight.outputs.leg-matrix) }}
        uses: ./.github/workflows/country-convergence-leg.yml
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        with:
            country:                       ${{ matrix.country }}
            code:                          ${{ matrix.code }}
            sample-command:                ${{ matrix.sample }}
            command:                       ${{ matrix.cmd }}
            job-timeout-minutes:           ${{ matrix.job }}
            suite-timeout-minutes:         ${{ matrix.suite }}
            sample-suite-timeout-minutes:  ${{ matrix.sample-suite }}
            order-command:                 ${{ matrix.order }}
            order-job-timeout-minutes:     ${{ matrix.order-job || 55 }}
            order-suite-timeout-minutes:   ${{ matrix.order-suite || 30 }}
            order-split:                   ${{ matrix.order-split == true }}
            next-day-command:              ${{ matrix.next-day || '' }}
            heap:                          ${{ matrix.heap }}
            # The United States' Mongo on disk on github.com's 16 GB VMs (identity-model-convergence.yml's note).
            mongo-tmpfs:                   ${{ matrix.code != 'us' && matrix.mongo-tmpfs || '' }}
            mongo-cache-gb:                ${{ matrix.mongo-cache-gb || '2' }}
            mongo-tmpfs-order:             ${{ matrix.mongo-tmpfs-order || 'true' }}
            mode:                          hermetic
            corpus-run:                    ${{ needs.preflight.outputs.recording }}
            countries:                     ${{ needs.preflight.outputs.countries }}
            takes-row:                     false
            # The nightly pipeline's own runner, as the recorder's legs: verify runs right behind the capture it judges.
            runner: ${{ needs.preflight.outputs.runner }}
        # The GITHUB_TOKEN the setup and publish actions read; nothing here fetches, so no key is used.
        secrets: inherit

    # THE ORDER COMPARISONS (owner, 2026-11-09: out of the shared leg, which created `order-compare` skipped in every Identity
    # takes run): a split country's two one-pass rows per pair replay in the leg and upload their corpora; one job per pair,
    # a row per country that has order rows (the preflight's `order-matrix`, convergence_reuse.py order_matrix), reads the two
    # back and runs the same order test on them -- `order-independence-p01 (<country>)`, the name the check always had
    # without the `leg (<country>) /` prefix. After the whole `leg` (a matrix job cannot be waited on per row). Identity
    # model convergence's own jobs of the same names are these (a verify run replays a recording, so it runs both pairs).
    order-independence-p01:
        needs: [ preflight, leg ]
        # No `name:`: the job id and the matrix's one `country` vector name a row `order-independence-p01 (<country>)`, and the job, when skipped,
        # plain `order-independence-p01` -- a `name:` naming a matrix value renders raw on a skipped job.
        if: ${{ !cancelled() && needs.preflight.outputs.any-order == 'true' }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.preflight.outputs.order-matrix) }}
        runs-on: ${{ needs.preflight.outputs.runner }}
        timeout-minutes: 20
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: ${{ matrix.country }}
            - uses: ./.github/actions/order-compare
              with:
                  code:               ${{ matrix.code }}
                  country:            ${{ matrix.country }}
                  phase:              order-independence-p01
                  command:            ${{ matrix.order }}
                  heap:               ${{ matrix.heap }}
                  corpus-run:         ${{ needs.preflight.outputs.recording }}
                  token:              ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token:    ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: ${{ matrix.country }}
            - uses: ./.github/actions/leg-verdict
              if: always()
              with:
                  leg:    order-independence-p01 (${{ matrix.country }})
                  status: ${{ job.status }}
                  token:  ${{ secrets.GITHUB_TOKEN }}

    order-independence-p12:
        needs: [ preflight, leg ]
        # No `name:`: the job id and the matrix's one `country` vector name a row `order-independence-p12 (<country>)`, and the job, when skipped,
        # plain `order-independence-p12` -- a `name:` naming a matrix value renders raw on a skipped job.
        if: ${{ !cancelled() && needs.preflight.outputs.any-order == 'true' }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.preflight.outputs.order-matrix) }}
        runs-on: ${{ needs.preflight.outputs.runner }}
        timeout-minutes: 20
        permissions:
            contents: write
            checks: write
            actions: read
            statuses: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
                  label: ${{ matrix.country }}
            - uses: ./.github/actions/order-compare
              with:
                  code:               ${{ matrix.code }}
                  country:            ${{ matrix.country }}
                  phase:              order-independence-p12
                  command:            ${{ matrix.order }}
                  heap:               ${{ matrix.heap }}
                  corpus-run:         ${{ needs.preflight.outputs.recording }}
                  token:              ${{ secrets.GITHUB_TOKEN }}
                  dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
                  dockerhub-token:    ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
                  label: ${{ matrix.country }}
            - uses: ./.github/actions/leg-verdict
              if: always()
              with:
                  leg:    order-independence-p12 (${{ matrix.country }})
                  status: ${{ job.status }}
                  token:  ${{ secrets.GITHUB_TOKEN }}

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job.
    timings:
        needs: [ preflight, leg, order-independence-p01, order-independence-p12 ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`: report-timings.yml declares no secrets.
        secrets: inherit
