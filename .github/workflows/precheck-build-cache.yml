name: Landing check build cache

# THE LANDING CHECK'S BUILD CACHE (docs/investigations/2026-11-01-twenty-runners.md §11). Every sbt job of
# precommit-check.yml restores a build of main and compiles only what the change moved. It used to restore the shared
# `sbt-target-<os>-` family, which no Main job writes any more (each Main row keys a family of its own) -- only the
# occasional identity/discovery workflow does, each compiling a different part -- so on 2026-11-03 every landing check
# restored a 16-hour-old build without web, web's tests or e2e's tests and each of its 5-6 sbt jobs recompiled ~700
# sources: ~3 min and ~600 CPU-seconds per job, all at once, on ci-runner's one saturated host.
#
# This job compiles, after each green-or-red Main run on main, everything a landing check's sbt jobs compile -- the
# identity test-impact selection's every module's main, fixtures and tests (identityImpact), and the integration-test
# classes the heavy rows run -- and saves it as the `sbt-target-precheck-<os>-` family, which only it writes. A landing
# check restores the newest entry (an EXACT hit for a change touching no Scala source: nothing compiles).
#
# After Main, never beside it: on a GitHub-hosted runner, so it takes none of ci-runner's check slots, and none of the
# 20 Main starts with (CiRunnerBudgetSpec). Runs queue rather than cancel: the cache is saved at the job's end, so a
# cancelled run would save nothing. Off the gate: a red here costs the landing check speed, never correctness.
on:
    workflow_run:
        workflows: [Main]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: precheck-build-cache
    cancel-in-progress: false

permissions:
    contents: read

env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    build:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-key: sbt-target-precheck-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-precheck-${{ runner.os }}-
                      sbt-target-unit-worker-identity-${{ runner.os }}-
                  # Only this job writes the family, from a key over every source it compiles.
                  target-cache-exact-hit-is-current: 'true'
            - name: Compile what a landing check compiles
              run: |
                  : > "$RUNNER_TEMP/no-changes"
                  sbt "identityImpact $RUNNER_TEMP/no-changes $RUNNER_TEMP/impact" \
                      "web/IntegrationTest/compile" "worker/IntegrationTest/compile"
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # THE POPULATION WALK'S ROWS for the landing check (PopulationMonotonicitySpec.Cached, scripts/hooks/pre-push): main's
    # every slice walked under main's walk digest (sbt identityWalkDigest) and saved as `population-walk-rows-main-<sha>`,
    # which the identity shards restore (a check/ branch reads the default branch's caches only). Starts from the previous
    # entry: a main commit that leaves the walk's code and data as they were walks only the slices whose files moved. Rows
    # are kept whether or not the spec passes (main's own flips are the identity tests' to judge, not this cache's).
    population-walk:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'
                  target-cache-key: sbt-target-precheck-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/fixtures/**/*.scala', '**/src/it/**/*.scala', '**/src/page/**/*.scala', 'web/src/main/resources/**') }}
                  target-cache-restore-keys: |
                      sbt-target-precheck-${{ runner.os }}-
                      sbt-target-unit-worker-identity-${{ runner.os }}-
            - name: Restore the previous population walk rows
              uses: actions/cache/restore@v5
              with:
                  path: ${{ runner.temp }}/population-walk-rows
                  key: population-walk-rows-main-${{ github.sha }}
                  restore-keys: |
                      population-walk-rows-main-
            - name: Walk every slice under main's walk digest
              env:
                  ROWS: ${{ runner.temp }}/population-walk-rows
              run: |
                  sbt "identityWalkDigest $RUNNER_TEMP/walk-digest"
                  digest="$(tr -cd '0-9a-f' < "$RUNNER_TEMP/walk-digest")"
                  [ "${#digest}" = 64 ] || { echo "::error::no walk digest"; exit 1; }
                  mkdir -p "$ROWS/$digest" && touch "$ROWS/$digest"
                  # the newest 8 digests only
                  find "$ROWS" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -rn | tail -n +9 | cut -d' ' -f2- | xargs -r rm -rf
                  before=$(find "$ROWS/$digest" -name '*.tsv' | wc -l)
                  sbt "worker/testOnly services.identity.PopulationMonotonicityPart*Spec -- -Didentity.population.cache=$ROWS/$digest" \
                      || echo "::warning::the population walk spec failed on main: its rows are kept all the same"
                  echo "population walk rows: digest ${digest:0:12}, $before kept before, $(find "$ROWS/$digest" -name '*.tsv' | wc -l) now"
            - name: Save the population walk rows
              uses: actions/cache/save@v5
              with:
                  path: ${{ runner.temp }}/population-walk-rows
                  key: population-walk-rows-main-${{ github.sha }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    timings:
        needs: [build, population-walk]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        secrets: inherit
