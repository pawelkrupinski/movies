name: Order independence

# Nightly: run the suites in an order they never meet on push, so a test that passes only
# because of what ran before it (or fails only after something else) is caught the night it
# lands, not the day a harmless rename reshuffles the order.
#
# The leaks this is for, all found by accident (2026-09-23):
#   - Android: the prefs DataStore is one process-wide singleton under Robolectric, so
#     "null until set" assertions passed or failed by which test wrote first (40ffc4b55).
#   - Android on-device: CountrySwitchRewiresApiTest's "uk" became DeepLinkInstrumentedTest's
#     starting country (dbfebcfc6).
#   - iOS: a country/language one UI test chose leaked into the next.
#
# Five legs:
#   scala                every module's unit specs one suite at a time, reversed and
#                        shuffled (TEST_ORDER_SEED — see testOrderSettings in build.sbt).
#   android              every Robolectric test, classes (nested ones too) AND methods
#                        reordered by a seed (-PtestOrderSeed — see ShuffledOrderSuite);
#                        the sync model at 100x its push seed count.
#   android-instrumented every androidTest class ALONE on an emulator, in a seeded order
#                        (android/scripts/devtest-shuffled.sh).
#   swift                every `swift test` case ALONE, in a seeded order
#                        (ios/scripts/swift-test-shuffled.sh); the sync model at 10x.
#   ios                  every XCUITest class ALONE, in its own xcodebuild run: a class
#                        that only passes after another has set state up fails here.
#
# A failure prints its seed; replay it locally with the command in the job summary, or
# re-run this workflow by hand with that seed.
on:
    schedule:
        - cron: '40 2 * * *'
    workflow_dispatch:
        inputs:
            seed:
                description: 'Order seed to replay (a number); empty draws a new one'
                required: false
                default: ''

permissions:
    contents: read

jobs:
    # The one seed every shuffled leg uses: the dispatch input, checked to be digits
    # (scripts/ci/order-seed.sh) before any leg puts it in a shell or an emulator
    # `script:`, or this run's id. The legs read it through `env:`, never `${{ }}` in a
    # script body -- see OrderIndependenceSeedSpec.
    seed:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            seed: ${{ steps.pick.outputs.seed }}
        steps:
            - uses: actions/checkout@v5
            - name: Pick and check the seed
              id: pick
              env:
                  REQUESTED: ${{ inputs.seed }}
              # Assigned first: inside `echo "seed=$(...)"` a refusal's status is dropped and the
              # legs would run on an empty seed. (scripts/ci/order-seed-test.sh)
              run: seed=$(scripts/ci/order-seed.sh "$REQUESTED" "$GITHUB_RUN_ID"); echo "seed=$seed" >> "$GITHUB_OUTPUT"

    scala:
        name: scala (${{ matrix.order }})
        needs: seed
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                order: [reverse, shuffled]
        steps:
            - uses: actions/checkout@v5

            # The deploy specs read the GitOps manifests at their old path — see ci.yml's
            # `test` job for why this checkout lands exactly here.
            - uses: actions/checkout@v5
              with:
                  repository: pawelkrupinski/movies-gitops
                  path: infra/kubernetes

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: sbt

            - uses: sbt/setup-sbt@v1

            - name: Pick the order
              id: order
              env:
                  ORDER: ${{ matrix.order }}
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  if [ "$ORDER" = reverse ]; then seed=reverse; else seed="$SEED"; fi
                  echo "seed=$seed" >> "$GITHUB_OUTPUT"
                  echo "Scala unit specs, suite order \`$seed\` — replay: \`TEST_ORDER_SEED=$seed sbt testUnitNoE2e\`" >> "$GITHUB_STEP_SUMMARY"

            # Same env as ci.yml's unit run, so a spec that needs a key behaves as it does there.
            - name: Unit specs, one suite at a time in that order
              run: sbt testUnitNoE2e
              env:
                  TEST_ORDER_SEED: ${{ steps.order.outputs.seed }}
                  ZYTE_API_KEY:    ${{ secrets.ZYTE_API_KEY }}
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
                  MONGODB_URI:     ${{ secrets.MONGODB_URI }}
                  MONGODB_DB:      ${{ secrets.MONGODB_DB }}

    android:
        needs: seed
        runs-on: ubuntu-latest
        timeout-minutes: 45
        defaults:
            run:
                working-directory: android
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'

            # platform-tools only, as android.yml's JVM-only lane: the default `tools`
            # package drags in the emulator, whose download flakily corrupts.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Robolectric tests, classes and methods in a seeded order
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  seed="$SEED"
                  echo "Android unit tests, seed \`$seed\` — replay: \`./gradlew testDebugUnitTest -PtestOrderSeed=$seed -PsyncModelSeeds=20000\`" >> "$GITHUB_STEP_SUMMARY"
                  # The sync model runs deep here: 100× its push-sized seed count.
                  ./gradlew --no-daemon testDebugUnitTest -PtestOrderSeed="$seed" -PsyncModelSeeds=20000

            - name: Upload the test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: android-order-independence-report
                  path: android/app/build/reports/tests/testDebugUnitTest
                  if-no-files-found: ignore

    android-instrumented:
        needs: seed
        runs-on: ubuntu-latest
        timeout-minutes: 120
        defaults:
            run:
                working-directory: android
        env:
            # The same emulator as android.yml's `instrumented` lane.
            API_LEVEL: 34
            AVD_PROFILE: pixel_6
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Cache AVD
              id: avd-cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.android/avd/*
                      ~/.android/adb*
                  key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.AVD_PROFILE }}

            - name: Create AVD snapshot
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."

            - name: Record the order
              working-directory: ${{ github.workspace }}
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  echo "Android instrumented classes, each alone, seed \`$SEED\` — replay: \`android/scripts/devtest-shuffled.sh $SEED\`" >> "$GITHUB_STEP_SUMMARY"

            - name: Every androidTest class alone, in that order
              uses: reactivecircus/android-emulator-runner@v2
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  emulator-boot-timeout: 600
                  working-directory: android
                  # --skip-live-youtube: see android.yml's instrumented lane.
                  script: scripts/devtest-shuffled.sh "$SEED" --skip-live-youtube

            - name: Upload the instrumented test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: android-instrumented-order-independence-report
                  path: |
                      android/app/build/reports/androidTests/connected
                      android/app/build/outputs/androidTest-results/connected
                  if-no-files-found: ignore

    swift:
        needs: seed
        runs-on: macos-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Every swift test case alone, in a seeded order
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  seed="$SEED"
                  echo "swift test cases, each alone, seed \`$seed\` — replay: \`ios/scripts/swift-test-shuffled.sh $seed\`" >> "$GITHUB_STEP_SUMMARY"
                  ios/scripts/swift-test-shuffled.sh "$seed"

            # The sync model deep: 10x its push-sized seed count.
            - name: StateSyncModelTests at 2000 seeds
              run: swift test --package-path ios --filter StateSyncModelTests
              env:
                  SYNC_MODEL_SEEDS: '2000'

    ios:
        runs-on: macos-latest
        timeout-minutes: 150
        steps:
            - uses: actions/checkout@v5

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            # An iPhone simulator this image actually has, not a hard-coded model it may have
            # dropped (run 36111347595: "iPhone 15" on an Xcode 26 image). (ios-sim-destination-test.sh)
            - name: Pick the simulator
              run: echo "DESTINATION=$(scripts/ci/ios-sim-destination.sh)" >> "$GITHUB_ENV"

            - name: Build for testing
              run: |
                  xcodebuild build-for-testing \
                      -project ios/Kinowo.xcodeproj \
                      -scheme Kinowo \
                      -destination "$DESTINATION" \
                      -derivedDataPath build/dd \
                      CODE_SIGNING_ALLOWED=NO

            # Each XCUITest class on its own, so none can lean on state another left behind.
            # Every class runs even after a failure; the job fails at the end, naming them.
            # Each test is bounded (a hung one fails at its allowance, naming itself), and so
            # is the step: the whole suite in one run takes ~25 min, alone ~a minute more a class.
            - name: Every XCUITest class alone
              timeout-minutes: 120
              run: |
                  set -uo pipefail
                  mkdir -p build/alone
                  classes=$(grep -hoE 'class[[:space:]]+[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*XCTestCase' ios/KinowoUITests/*.swift \
                      | sed -E 's/class[[:space:]]+([A-Za-z0-9_]+).*/\1/' | sort -u)
                  [ -n "$classes" ] || { echo "::error::no XCUITest classes found in ios/KinowoUITests"; exit 1; }
                  failed=""
                  for class in $classes; do
                      echo "::group::$class"
                      started=$SECONDS
                      if xcodebuild test-without-building \
                          -project ios/Kinowo.xcodeproj \
                          -scheme Kinowo \
                          -destination "$DESTINATION" \
                          -derivedDataPath build/dd \
                          -only-testing:"KinowoUITests/$class" \
                          -resultBundlePath "build/alone/$class.xcresult" \
                          -test-timeouts-enabled YES \
                          -default-test-execution-time-allowance 180 \
                          -maximum-test-execution-time-allowance 300 \
                          CODE_SIGNING_ALLOWED=NO > "build/alone/$class.log" 2>&1; then
                          echo "$class passed alone in $((SECONDS - started))s"
                      else
                          echo "$class FAILED alone after $((SECONDS - started))s"
                          tail -80 "build/alone/$class.log"
                          failed="$failed $class"
                      fi
                      echo "::endgroup::"
                  done
                  if [ -n "$failed" ]; then
                      echo "XCUITest classes that fail when run alone:$failed" >> "$GITHUB_STEP_SUMMARY"
                      echo "::error::XCUITest classes that fail when run alone:$failed"
                      exit 1
                  fi

            - name: Upload the result bundles
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: ios-alone-results
                  path: build/alone
                  if-no-files-found: ignore

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        needs: [seed, scala, android, android-instrumented, swift, ios]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
