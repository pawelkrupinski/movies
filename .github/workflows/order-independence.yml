name: Order independence

# Nightly: run the suites in an order they never meet on push, so a test that passes only
# because of what ran before it (or fails only after something else) is caught the night it
# lands, not the day a harmless rename reshuffles the order.
#
# The leaks this is for, all found by accident (2026-09-23):
#   - Android: the prefs DataStore is one process-wide singleton under Robolectric, so
#     "null until set" assertions passed or failed by which test wrote first (40ffc4b55).
#   - Android on-device: CountrySwitchRewiresApiTest's "uk" became DeepLinkInstrumentedTest's
#     starting country (dbfebcfc6).
#   - iOS: a country/language one UI test chose leaked into the next.
#
# Five legs:
#   scala                every module's unit specs one suite at a time, reversed and
#                        shuffled (TEST_ORDER_SEED — see testOrderSettings in build.sbt).
#   android              every Robolectric test, classes (nested ones too) AND methods
#                        reordered by a seed (-PtestOrderSeed — see ShuffledOrderSuite);
#                        the sync model at 100x its push seed count.
#   android-instrumented every androidTest class ALONE on an emulator, in a seeded order
#                        (android/scripts/devtest-shuffled.sh).
#   swift                every `swift test` case ALONE, in a seeded order
#                        (ios/scripts/swift-test-shuffled.sh); the sync model at 10x.
#                        Also every script self-test under macOS's /bin/bash 3.2 (see there).
#   ios                  every XCUITest class ALONE, in its own xcodebuild run: a class
#                        that only passes after another has set state up fails here.
#
# A failure prints its seed; replay it locally with the command in the job summary, or
# re-run this workflow by hand with that seed.
on:
    schedule:
        - cron: '40 2 * * *'
    workflow_dispatch:
        inputs:
            seed:
                description: 'Order seed to replay (a number); empty draws a new one'
                required: false
                default: ''

permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    # The one seed every shuffled leg uses: the dispatch input, checked to be digits
    # (scripts/ci/order-seed.sh) before any leg puts it in a shell or an emulator
    # `script:`, or this run's id. The legs read it through `env:`, never `${{ }}` in a
    # script body -- see OrderIndependenceSeedSpec.
    seed:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        outputs:
            seed: ${{ steps.pick.outputs.seed }}
        steps:
            - uses: actions/checkout@v5
            - name: Pick and check the seed
              id: pick
              env:
                  REQUESTED: ${{ inputs.seed }}
              # Assigned first: inside `echo "seed=$(...)"` a refusal's status is dropped and the
              # legs would run on an empty seed. (scripts/ci/order-seed-test.sh)
              run: seed=$(scripts/ci/order-seed.sh "$REQUESTED" "$GITHUB_RUN_ID"); echo "seed=$seed" >> "$GITHUB_OUTPUT"

    scala:
        # No `name:`: the default `scala (<order>)` is the same, and a job cancelled before it starts shows no raw template.
        needs: seed
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        timeout-minutes: 105
        strategy:
            fail-fast: false
            matrix:
                order: [reverse, shuffled]
        steps:
            - uses: actions/checkout@v5

            # The deploy specs read the GitOps manifests at their old path — see ci.yml's
            # `test` job for why this checkout lands exactly here, and why it is an anonymous clone.
            - name: Check out the gitops manifests (movies-gitops main, anonymously)
              run: git clone --quiet --depth 1 --branch main "$GITHUB_SERVER_URL/pawelkrupinski/movies-gitops" infra/kubernetes

            - uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: 27
                  cache: sbt

            - uses: sbt/setup-sbt@v1
              with:
                  sbt-runner-version: 2.0.10 # the job image's (SetupSbtRunnerPinSpec)
                  disk-cache: 'false'
            # Every sbt of this job through the stale-TASTy guard (scripts/ci/sbt-guard/sbt, OneSbtPathSpec).
            - name: Route sbt through the stale-TASTy guard
              shell: bash
              run: echo "$GITHUB_WORKSPACE/scripts/ci/sbt-guard" >> "$GITHUB_PATH"

            - name: Pick the order
              id: order
              env:
                  ORDER: ${{ matrix.order }}
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  if [ "$ORDER" = reverse ]; then seed=reverse; else seed="$SEED"; fi
                  echo "seed=$seed" >> "$GITHUB_OUTPUT"
                  echo "Scala unit specs, suite order \`$seed\` — replay: \`TEST_ORDER_SEED=$seed sbt testUnitNoE2e\`" >> "$GITHUB_STEP_SUMMARY"

            # Same env as ci.yml's unit run, so a spec that needs a key behaves as it does there.
            - name: Unit specs, one suite at a time in that order
              run: sbt testUnitNoE2e
              env:
                  TEST_ORDER_SEED: ${{ steps.order.outputs.seed }}
                  TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}

    android:
        needs: seed
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        timeout-minutes: 45
        defaults:
            run:
                working-directory: android
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: '17'

            # platform-tools only, as android.yml's JVM-only lane: the default `tools`
            # package drags in the emulator, whose download flakily corrupts.
            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  add-job-summary: always

            - name: Robolectric tests, classes and methods in a seeded order
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  seed="$SEED"
                  echo "Android unit tests, seed \`$seed\` — replay: \`./gradlew testDebugUnitTest -PtestOrderSeed=$seed -PsyncModelSeeds=20000\`" >> "$GITHUB_STEP_SUMMARY"
                  # The sync model runs deep here: 100× its push-sized seed count.
                  ./gradlew --no-daemon testDebugUnitTest -PtestOrderSeed="$seed" -PsyncModelSeeds=20000

            - name: Upload the test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: android-order-independence-report
                  path: android/app/build/reports/tests/testDebugUnitTest
                  if-no-files-found: ignore

    android-instrumented:
        needs: seed
        runs-on: ubuntu-26.04
        timeout-minutes: 120
        defaults:
            run:
                working-directory: android
        env:
            # The same emulator as android.yml's `instrumented` lane.
            API_LEVEL: 34
            AVD_PROFILE: pixel_6
        steps:
            - uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: ./.github/actions/setup-jdk
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  add-job-summary: always

            - name: Enable KVM
              # The script lives at the repo root; this job's run steps default to android/.
              working-directory: ${{ github.workspace }}
              run: scripts/ci/enable-kvm.sh

            - name: Cache AVD
              id: avd-cache
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.android/avd/*
                      ~/.android/adb*
                  key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.AVD_PROFILE }}

            - name: Create AVD snapshot
              if: steps.avd-cache.outputs.cache-hit != 'true'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: false
                  script: echo "Generated AVD snapshot for caching."

            - name: Record the order
              working-directory: ${{ github.workspace }}
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  echo "Android instrumented classes, each alone, seed \`$SEED\` — replay: \`android/scripts/devtest-shuffled.sh $SEED\`" >> "$GITHUB_STEP_SUMMARY"

            - name: Every androidTest class alone, in that order
              uses: reactivecircus/android-emulator-runner@v2
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              with:
                  api-level: ${{ env.API_LEVEL }}
                  target: google_apis
                  arch: x86_64
                  profile: ${{ env.AVD_PROFILE }}
                  force-avd-creation: false
                  emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  emulator-boot-timeout: 600
                  working-directory: android
                  # --skip-live-youtube: see android.yml's instrumented lane.
                  script: scripts/devtest-shuffled.sh "$SEED" --skip-live-youtube

            - name: Upload the instrumented test report
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: android-instrumented-order-independence-report
                  # One directory per failing class (devtest-shuffled.sh keeps them): the
                  # Gradle report paths hold only the LAST class's run.
                  path: android/app/build/order-independence
                  if-no-files-found: ignore

    swift:
        needs: seed
        # macOS legs: github.com's hosted macOS only.
        runs-on: macos-latest
        timeout-minutes: 105
        steps:
            - uses: actions/checkout@v5

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Every swift test case alone, in a seeded order
              env:
                  SEED: ${{ needs.seed.outputs.seed }}
              run: |
                  seed="$SEED"
                  echo "swift test cases, each alone, seed \`$seed\` — replay: \`ios/scripts/swift-test-shuffled.sh $seed\`" >> "$GITHUB_STEP_SUMMARY"
                  ios/scripts/swift-test-shuffled.sh "$seed"

            # The sync model deep: 10x its push-sized seed count.
            - name: StateSyncModelTests at 2000 seeds
              run: swift test --package-path ios --filter StateSyncModelTests
              env:
                  SYNC_MODEL_SEEDS: '2000'

            # The tools the self-tests drive run on ubuntu CI and the laptop, both with GNU `timeout` and shellcheck;
            # this image has neither (run 41294275183: ten self-tests failed "timeout: command not found" / "shellcheck
            # is not installed"). Only `timeout` is linked unprefixed, as on the laptop -- no coreutils gnubin, so
            # the tests still meet macOS's own sed, date and friends. (ScriptSelfTestsRunInCiSpec)
            - name: GNU timeout and shellcheck, as Linux CI and the laptop have them
              if: ${{ !cancelled() }}
              env:
                  HOMEBREW_NO_AUTO_UPDATE: '1'
              run: |
                  brew install coreutils shellcheck
                  mkdir -p "$RUNNER_TEMP/gnu-timeout"
                  ln -sf "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/gnu-timeout/timeout"
                  echo "$RUNNER_TEMP/gnu-timeout" >> "$GITHUB_PATH"

            # Not an order leg, but the one nightly macOS job: the script tools promise macOS's /bin/bash 3.2 and
            # /usr/bin/python3 3.9 (scripts/run-script-tests' PythonFloor), and ci.yml's Linux run has neither, so a
            # bash-4-only construct ($BASHPID, an empty "${a[@]}" under set -u) or 3.10+ syntax passed there. Every
            # self-test under this image's own /bin/bash; the floor lint run BY /usr/bin/python3 compiles every Python
            # file as 3.9 does (python_floor_lint.py).
            - name: Script self-tests under macOS /bin/bash 3.2, Python at the floor
              if: ${{ !cancelled() }}
              run: |
                  /bin/bash --version | head -1
                  scripts/run-script-tests --bash /bin/bash
                  /usr/bin/python3 scripts/ci/python_floor_lint.py

    ios:
        # macOS legs: github.com's hosted macOS only.
        runs-on: macos-latest
        timeout-minutes: 150
        steps:
            - uses: actions/checkout@v5

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            # An iPhone simulator this image actually has, not a hard-coded model it may have
            # dropped (run 36111347595: "iPhone 15" on an Xcode 26 image). (ios-sim-destination-test.sh)
            - name: Pick the simulator
              run: echo "DESTINATION=$(scripts/ci/ios-sim-destination.sh)" >> "$GITHUB_ENV"

            - name: Build for testing
              run: |
                  xcodebuild build-for-testing \
                      -project ios/Kinowo.xcodeproj \
                      -scheme Kinowo \
                      -destination "$DESTINATION" \
                      -derivedDataPath build/dd \
                      CODE_SIGNING_ALLOWED=NO

            # Boot the simulator BEFORE the loop, after the build (booting beside the build
            # starved the 3-core runner, 3451eee5d). Otherwise its ~2-4 min cold boot lands on
            # whichever class sorts first, whose app launch then times out (CardShareMenuUITests,
            # run 38270450938) — a failure of the harness's order, not of the class.
            - name: Boot the simulator
              run: xcrun simctl bootstatus "${DESTINATION##*id=}" -b

            # Each XCUITest class on its own, so none can lean on state another left behind.
            # Every class runs even after a failure; the job fails at the end, naming them, each
            # failed test an error carrying its own assertion (the script says why it is one).
            # Each test is bounded (a hung one fails at its allowance, naming itself), and so
            # is the step: the whole suite in one run takes ~25 min, alone ~a minute more a class.
            - name: Every XCUITest class alone
              timeout-minutes: 120
              run: |
                  . scripts/ci/bounded-step.sh
                  scripts/ci/xcuitest-each-class-alone.sh

            # A timed-out step's processes run on: end them before anything after it reads the workspace (bounded-step.sh).
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            - name: Upload the result bundles
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: ios-alone-results
                  path: build/alone
                  if-no-files-found: ignore

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [seed, scala, android, android-instrumented, swift, ios]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`: report-timings.yml declares no secrets.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [seed, scala, android, android-instrumented, swift, ios, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
