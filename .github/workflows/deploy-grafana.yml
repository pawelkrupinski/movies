name: Deploy Grafana

# MANUAL ONLY. Grafana runs on monitoring-1 now (infra/nix/modules/roles/grafana.nix);
# `kinowo-grafana` on Fly is KEPT as the migration's rollback and its machine is
# STOPPED. This used to fire on any `fly/grafana/**` push, which meant every alert-rule
# tweak silently redeployed — and therefore STARTED — a second Grafana holding a second
# copy of the same alerts, on a host nobody looks at. Fly hosts one thing from this
# repository (the `kinowo` web app), and CI deploys only that; see `FlyDeployScopeSpec`.
#
# Kept rather than deleted because a rollback you have to reconstruct is not one. Rolling
# back is now a deliberate act: dispatch this workflow, then point grafana.kinowo.net's
# DNS back. While it sits unrun the Fly instance's provisioning goes stale against
# fly/grafana/provisioning — that is the accepted cost, and the reason to prefer the
# vendored copy under infra/nix/files/monitoring/grafana/ as the live truth.
on:
  workflow_dispatch:

concurrency:
  group: fly-deploy-grafana
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy kinowo-grafana
        # Run from fly/grafana so the build context is that dir and the
        # Dockerfile's `COPY provisioning` resolves (config defaults to ./fly.toml).
        working-directory: fly/grafana
        run: flyctl deploy --remote-only -a kinowo-grafana
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
