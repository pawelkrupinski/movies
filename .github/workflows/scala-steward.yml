name: Scala Steward

# Scala Steward scans build.sbt, project/*.scala (so it reads the version
# vals in project/Dependencies.scala directly) and project/plugins.sbt, then
# opens one PR per available dependency / sbt-plugin upgrade with a link to
# the release notes. It only proposes the bump — per CLAUDE.md's test gate,
# a human still reviews each PR and lands it once the suite is green.
#
# What it is NOT allowed to propose lives in .scala-steward.conf at the repo
# root — currently the sbt 2.x jump, which no plugin set of ours supports yet.
on:
    # Daily sweep — 06:00 UTC every day. Steward only opens a PR when a new
    # version actually exists and dedups against open ones, so a quiet day
    # produces nothing; this just shortens the lag between a release and its PR.
    schedule:
        - cron: '0 6 * * *'
    # Manual kick from the Actions tab when you want an upgrade pass now.
    workflow_dispatch:

# Steward pushes its update branches and opens PRs as the "Kinowo Sync Bot"
# GitHub App (secrets SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY, shared with
# discover-cinemas.yml), so pull_request CI fires on them -- a PR opened with
# the default GITHUB_TOKEN never does. The App mints a fresh token per run; the
# personal access token this used before expired silently on 2026-09-28 and
# every run 401'd from then on.
#
# ON FORGEJO there is no GitHub App: the same action runs with --forge-type gitea against Forgejo's API
# as the ci-bot user (SCALA_STEWARD_TOKEN, minted by infra's bin/forgejo-bootstrap; ci-bot has write on
# this repository only, team pawelkrupinski/steward). A PR opened with a user token fires pull_request
# CI there too.
permissions:
    contents: read

# SHADOW SWITCH (scripts/ci/ci-writes.sh): on github.com this run writes nothing outside its runner unless CI_ROLE=primary.
env:
    CI_ROLE: ${{ vars.CI_ROLE }}

jobs:
    scala-steward:
        runs-on: ubuntu-26.04
        name: Scala Steward
        steps:
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            - name: Scala Steward
              uses: scala-steward-org/scala-steward-action@v2
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  author-name: Paweł Krupiński
                  author-email: pawel.krupinski@gmail.com

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [scala-steward]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [scala-steward, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
