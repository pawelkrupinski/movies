name: Nightly stress

# The tests whose failures are a matter of LUCK, run enough times for luck to run out.
#
# Eight Main runs and four Android runs in the four weeks to 2026-09-24 went green on a rerun of
# the same commit. Each was a race or a timing assumption that a single push-time run meets once
# in dozens; the push that meets it goes red, a rerun turns it green, and nothing is learned.
# Here the same code meets it every night, with a count:
#
#   races           the race / concurrency harnesses (scripts/ci/stress-races.sh — the list is
#                   there), in-JVM and against a real Mongo replica set, 50 times over;
#   webkit-phones   the Playwright WebKit phone projects — the slowest, most timing-sensitive
#                   rows of ci.yml — with --repeat-each 5, sharded four ways.
#
# The sync-model property suites (Android StateSyncModelTest, iOS StateSyncModelTests) already
# run at 100x / 10x their push seed counts in order-independence.yml, and every androidTest class
# on the emulator there too, so they are not repeated here.
#
# A failure is reported like every scheduled run: an owner-assigned issue, closed by the next
# green night (report-scheduled-run, ScheduledRunReportSpec).
on:
    schedule:
        - cron: '30 1 * * *'
    workflow_dispatch:
        inputs:
            iterations:
                description: 'How many times to run the race harnesses'
                required: false
                default: '50'

# Tonight's run finishes; a hand-dispatched one queues behind it.
concurrency:
    group: nightly-stress
    cancel-in-progress: false

permissions:
    contents: read


jobs:
    races:
        # TWO HALVES ON GITHUB.COM: the 50 iterations ran into this job's 180-minute cap on ci-runner already, and a hosted
        # 4-core runner is no faster -- 2 x 25 there, each well inside it; one job of all 50 on Forgejo, as before.
        name: races${{ format(' ({0}/2)', matrix.half) || '' }}
        strategy:
            fail-fast: false
            matrix:
                half: [1, 2]
        runs-on: ubuntu-22.04 # mongod 8.3 refuses kernels 6.19-7.0.13: github.com's 24.04 and 26.04 images boot them, 22.04 boots 6.8 (MongoServerVersionParitySpec)
        # ~25s an iteration for the in-JVM set measured locally, the Mongo set more; 50 of both
        # fit well inside this, and a hung harness still stops.
        timeout-minutes: 180
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/free-disk

            # A single-node replica set, as ci.yml's integration-test job starts it (change
            # streams and transactions need one).
            - name: Start MongoDB (single-node replica set)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

            # Read-only use of the integration-test job's zinc cache (the action's default key): this job
            # compiles the same scopes, and has no business writing a key the push-time jobs own.
            - uses: ./.github/actions/setup-sbt-build
              with:
                  target-cache-restore-only: 'true'

            - name: Race harnesses, many times over
              env:
                  ITERATIONS: ${{ inputs.iterations || '50' }}
                  HALVES: 2
                  MONGODB_URI: mongodb://127.0.0.1:27017/kinowo?directConnection=true
                  MONGODB_DB: kinowo
              run: |
                  ITERATIONS=$(( (ITERATIONS + HALVES - 1) / HALVES ))
                  scripts/ci/stress-races.sh "$ITERATIONS" all

            - name: Upload the failing iterations' reports
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  name: stress-races${{ format('-{0}', matrix.half) || '' }}
                  path: target/stress-races
                  if-no-files-found: ignore

    webkit-phones:
        name: webkit phones x5 (${{ matrix.shard }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { shard: 1/4, label: webkit-stress-1-4 }
                    - { shard: 2/4, label: webkit-stress-2-4 }
                    - { shard: 3/4, label: webkit-stress-3-4 }
                    - { shard: 4/4, label: webkit-stress-4-4 }
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/run-page-test
              with:
                  kind:       playwright
                  browsers:   webkit
                  label:      ${{ matrix.label }}
                  runs:       'webkit-iphone-se*,webkit-iphone-13*,webkit-iphone-17-pro-max* ; ; axe-core|@agnostic ; ${{ matrix.shard }}'
                  # On Forgejo the four shards share one ci-runner host with every other job; at the
                  # action's 5 workers each, run 414's WebKit loads took ~10s (load average 130+), so
                  # the stress rows run 3. Nothing is appended on github.com.
                  extra-args: --repeat-each 5

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ races, webkit-phones ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [ races, webkit-phones, timings ]
        if: ${{ always() && !cancelled() && github.event_name == 'schedule' }}
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
