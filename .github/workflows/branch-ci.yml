name: Branch CI

# Runs the exact same build + test pipeline main.yml gates on — but
# WITHOUT deploying — for every pull request. The Scala Steward
# dependency-bump PRs (and any feature branch) are thereby confirmed to
# compile and pass every layer before they can be merged, instead of
# only finding out on the push-to-main deploy run.
#
# Reuses ci.yml verbatim (one definition, two callers — see ci.yml's
# header). `secrets: inherit` hands the called workflow the
# TMDB / MONGODB secrets its test jobs need; same-repo PRs (which
# is what Steward opens) get a write-scoped token so the junit
# check-runs post fine.
on:
    pull_request:

# A newer push to the same PR branch cancels the older run mid-flight so
# stale commits don't hold worker slots.
concurrency:
    group: branch-ci-${{ github.ref }}
    cancel-in-progress: true

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit
        # ci.yml's jobs post JUnit check-runs; a called workflow can only
        # narrow its caller's token, never widen it. `packages: write` only so the
        # workflow loads: its `image-*` jobs ask for it, and GitHub refuses a called
        # job more than its caller grants even when, as on every PR run, it is skipped.
        permissions:
            contents: read
            checks: write
            packages: write
            # ci.yml's `scope` job reads the newest green Main run (gh run list) to know which rows a push can move.
            actions: read

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ci]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit
