#
# ANY sbt COMMAND ON CI (scripts/identity-ci-run) -- a targeted testOnly or compile check at a commit, or one over a CACHED RECORDING: an IntegrationTest runMain -- a resolve dump,
# an ablation, a simulation, a replay sweep -- over one `Record scrape fixtures` run laid out as
# scripts/identity-fetch-recording.sh lays it (the pair identity-measure-local and identity-slice replay), against a
# throwaway MongoDB, off the laptop (the user's rule, 2026-10-21: heavy work runs on CI). SIDE BY SIDE, a job each
# (scripts/ci/identity_run_shards.py): once per country when the command names {cc}, once per line of a command of
# several lines, once in all otherwise; each job lays out only the country it runs. What each writes under {out} comes
# back as its `identity-run-<shard>` artifact, with its sbt log; scripts/identity-ci-run lays them all into one directory.
#
# Placeholders in `command`: {cc} the country, {fixtures} the laid pair's test/resources/fixtures, {corpus} its corpus/,
# {out} the directory uploaded ({out} is per country when the command names {cc}).
#
# Dispatch-only, from a measure/ branch scripts/identity-ci-run pushes: every run in a lane of its own.
#
name: Identity run
run-name: identity run ${{ inputs.recording }} ${{ inputs.countries }}
on:
    workflow_dispatch:
        inputs:
            recording:
                description: The `Record scrape fixtures` run to lay out (e.g. 528); empty lays none (any sbt target at this commit, e.g. a testOnly).
                required: false
                default: ''
                type: string
            countries:
                description: Comma-separated codes the recording holds and the command runs for.
                required: false
                default: 'pl,de,uk,us,es'
                type: string
            command:
                description: "The sbt command (several, one a line, run side by side), e.g. worker/IntegrationTest/runMain integration.IdentityResolveDump --out {out} --full {cc} --corpus-dir {corpus} --fixtures {fixtures}"
                required: true
                type: string
            heap:
                description: sbt's -Xmx.
                required: false
                default: '8g'
                type: string
# Every branch's runs in a lane of their own off main (a measurement's form; identity-ci-run pushes a measure/ branch per
# run): runs side by side, none replaced. Keyed by the branch, never github.run_id.
# Main's runs (one lane) are dispatched one at a time.
concurrency:
    group: identity-run${{ github.ref != 'refs/heads/main' && format('-{0}', github.ref_name) || '' }}
    cancel-in-progress: false
env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8
    FIXTURE_RELEASE_TAG: convergence-fixtures
permissions:
    contents: read
jobs:
    # THE PLAN (WorkflowPlanSpec): the one job that reads `inputs` whole; the shards read its outputs. On the run's own
    # runner label, not a light `movies` slot: a light job can wait behind every measurement for one (run 42370669779's
    # timings job waited 26 min), and this one holds up the whole run.
    plan:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-22.04' }}
        timeout-minutes: 5
        outputs:
            recording: ${{ steps.plan.outputs.recording }}
            # SHARDS (scripts/ci/identity_run_shards.py): a command naming {cc} runs as one job a country, and each line
            # of a command of several as one of its own, side by side (two countries took 28 min one after the other
            # in one job, run 42370669779); one line naming none runs once, as the shard `all`.
            shards: ${{ steps.plan.outputs.shards }}
            countries: ${{ steps.plan.outputs.countries }}
            heap: ${{ steps.plan.outputs.heap }}
        steps:
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: scripts/ci
            - id: plan
              shell: bash
              env:
                  RECORDING: ${{ inputs.recording }}
                  COUNTRIES: ${{ inputs.countries }}
                  COMMAND: ${{ inputs.command }}
                  HEAP: ${{ inputs.heap }}
              run: |
                  set -euo pipefail
                  [ -z "$RECORDING" ] || [[ "$RECORDING" =~ ^[0-9]+$ ]] || { echo "::error::recording is a run id, not $RECORDING"; exit 1; }
                  shards=$(scripts/ci/identity_run_shards.py --command "$COMMAND" --countries "$COUNTRIES")
                  { echo "recording=$RECORDING"; echo "countries=$COUNTRIES"; echo "heap=$HEAP"; echo "shards=$shards"; } >> "$GITHUB_OUTPUT"
                  jq -r '.[] | "\(.name): sbt \(.command)"' <<< "$shards"
    run:
        name: run (${{ matrix.shard.name }})
        needs: [ plan ]
        # mongod 8.3 refuses kernels 6.19-7.0.13: github.com's 24.04 and 26.04 images boot them, 22.04 boots 6.8 (MongoServerVersionParitySpec)
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-22.04' }}
        # The longest green run took 162 min (run 965, five countries in one job); the mean is 10. CiRowTimeoutSpec.
        timeout-minutes: 200
        strategy:
            # one country's red is no reason to throw away the others' output
            fail-fast: false
            matrix:
                shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5
            - name: Lay out the recording
              if: needs.plan.outputs.recording != ''
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RECORDING: ${{ needs.plan.outputs.recording }}
                  CC: ${{ matrix.shard.cc }}
                  COUNTRIES: ${{ needs.plan.outputs.countries }}
                  KINOWO_REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  # a country's shard lays out its own country alone; any other every country the run names
                  if [ -n "$CC" ]; then ccs=("$CC"); else IFS=, read -r -a ccs <<< "${COUNTRIES// /}"; fi
                  scripts/identity-fetch-recording.sh "$RECORDING" "$RUNNER_TEMP/recording" "${ccs[@]}"
                  rm -rf "$RUNNER_TEMP/recording/archive"
            - uses: ./.github/actions/free-disk
            - uses: ./.github/actions/setup-sbt-build
            - name: Start MongoDB (single-node replica set, the command's throwaway database)
              run: scripts/ci/start-mongo-replset.sh
              env:
                  MONGO_MAJORITY_JOURNAL: 'false'
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Run the command
              shell: bash
              env:
                  MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
                  SBT_OPTS: -Xmx${{ needs.plan.outputs.heap }}
                  COMMAND: ${{ matrix.shard.command }}
                  CC: ${{ matrix.shard.cc }}
                  SHARD_OUT: ${{ matrix.shard.out }}
                  SHARD_LOG: ${{ matrix.shard.log }}
              run: |
                  set -uo pipefail
                  fixtures="$RUNNER_TEMP/recording/pair/test/resources/fixtures" out="$RUNNER_TEMP/identity-run"
                  mkdir -p "$out"
                  fill() { local c=${COMMAND//\{fixtures\}/$fixtures}; c=${c//\{corpus\}/$fixtures/corpus}; c=${c//\{out\}/$2}; echo "${c//\{cc\}/$1}"; }
                  # the artifact's layout is the one-job run's: <cc>/ and sbt-<cc>.log a country, or sbt.log
                  dir="$out${SHARD_OUT:+/$SHARD_OUT}"; mkdir -p "$dir"
                  cmd=$(fill "$CC" "$dir") log="$out/$SHARD_LOG"
                  echo "sbt $cmd"
                  sbt -batch "$cmd" 2>&1 | tee "$log"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  # a rerun (--failed) re-uploads the same name: without this it fails "already exists"
                  overwrite: true
                  # one a shard; scripts/identity-ci-run lays every identity-run-* into one directory again
                  name: identity-run-${{ matrix.shard.name }}
                  path: ${{ runner.temp }}/identity-run/
                  retention-days: 14
