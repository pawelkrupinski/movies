name: Discover UK cinemas

# Weekly discovery of NEW UK cinemas on flicks.co.uk, wired into the catalog as a
# PR for a human to review.
#
# Every UK venue is one row of data/uk/roster.json (its name, display and pill names,
# Flicks slug and primary source), generated into the Scala by
# data/uk/scripts/generate_roster.py. Flicks lists every cinema in
# sitemap-cinemas.xml; scripts/discover-cinemas/discover.py diffs that against the
# slugs we already wire (minus scripts/discover-cinemas/exclude.txt, the known-
# defunct venues) and appends a row for each genuinely new venue, beside the
# nearest already-wired UK venue. "Already wired" spans every row's `flicks` slug,
# whether Flicks is the venue's primary or the fallback of its own-site client.
#
# Venues it can't wire safely — London (needs a manual area-group), name
# collisions, no coordinates, or no sessions this week — are PARKED into the PR
# body, never written as a row the generator would refuse. It also lists GONE venues (wired by us but
# dropped from Flicks' sitemap) as retirement candidates; it never auto-deletes.
#
# A newly wired venue then needs its TOWN, or it is on no page: which page lists
# a UK venue is generated from its town. So the same job tops up data/uk/venues.json
# (`harvest_towns.py --sync`: only the venues the file lacks, a handful at most),
# places the new towns on GeoNames (`geocode_towns.py`, which refuses a town it
# cannot place — the run fails rather than guess), rebuilds the pages and
# regenerates the Scala, the apps' city lists and their catalog seeds, in the same
# PR as the wiring that needs it.
#
# On github.com, like scala-steward.yml, the PR is opened via the
# "Kinowo Sync Bot" GitHub App (secrets SYNC_PR_APP_ID + SYNC_PR_APP_PRIVATE_KEY)
# so Branch CI runs on it — a PR opened with the default GITHUB_TOKEN never fires
# `pull_request`. A fixed branch means a rerun replaces the open PR; a week with no
# new venues produces no diff and therefore no PR (the report still lands in the
# run summary so retirement candidates stay visible).

on:
    workflow_dispatch:

    # Monday 06:00 UTC — off on its own slot.
    schedule:
        - cron: '0 6 * * 1'
    # The external scheduler's run of a cron slot (infra/nix/files/scheduled_dispatch.py; GitHub's own
    # runs come hours late, or not at all): treated as the schedule wherever this workflow branches on it.
    repository_dispatch:
        types: [scheduled-discover-cinemas]

permissions:
    contents: write
    pull-requests: write
    issues: write


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    discover-cinemas:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies-measure' || 'ubuntu-26.04' }}
        timeout-minutes: 30
        steps:
            # Short-lived installation token for the "Kinowo Sync Bot" GitHub App,
            # so the PR fires `pull_request` and Branch CI runs on it. Same secrets
            # as scala-steward.yml — see that file's header.
            - uses: actions/create-github-app-token@v3
              id: app-token
              with:
                  app-id: ${{ secrets.SYNC_PR_APP_ID }}
                  private-key: ${{ secrets.SYNC_PR_APP_PRIVATE_KEY }}

            # main's tip, not the triggering commit: a long run can see main gain a
            # workflow change, and a branch built on the older commit would revert it
            # (refused for the App). See BotPullRequestBranchSpec.
            - uses: actions/checkout@v5
              with:
                  ref: main

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            # Guard the tool itself before trusting its edits.
            - name: Unit-test the discovery tool
              working-directory: scripts/discover-cinemas
              run: python3 discover_test.py

            # Guard the town parser before trusting the towns it derives. Scores
            # itself against the 87 UK venues whose recorded Cineworld fixture
            # carries the chain's own city beside the address.
            - name: Unit-test the town parser
              run: python3 data/uk/scripts/harvest_towns_test.py

            # Enumerate Flicks, diff, and splice new venues into the two source
            # files (--apply). Stdlib only — no pip install. Writes the markdown
            # report used for the PR body and the run summary.
            - name: Discover + wire new cinemas
              run: |
                  python3 scripts/discover-cinemas/discover.py --apply --report-path discovery-report.md
                  cat discovery-report.md >> "$GITHUB_STEP_SUMMARY"

            # Give the venues it just wired their town. Incremental: --sync fetches
            # only the ones venues.json does not already hold, forgets any that are
            # no longer wired, and re-reads the display names it is keyed on (a
            # rename in roster.json would otherwise orphan a row in silence). A
            # week with no new venues fetches nothing and changes no file.
            - name: Harvest towns for the newly wired venues
              run: |
                  python3 data/uk/scripts/harvest_towns.py --sync
                  python3 data/scripts/generate_venue_towns.py

            # …and put them on pages. GeoNames' gazetteer is fetched for the run and
            # never committed; towns.json is what the build reads.
            - name: Place the new venues on pages
              run: |
                  mkdir -p "$RUNNER_TEMP/geonames"
                  curl -fsSL --retry 5 --retry-all-errors https://download.geonames.org/export/dump/cities1000.zip \
                      -o "$RUNNER_TEMP/geonames/cities1000.zip"
                  unzip -oq "$RUNNER_TEMP/geonames/cities1000.zip" -d "$RUNNER_TEMP/geonames"
                  python3 data/uk/scripts/geocode_towns.py "$RUNNER_TEMP/geonames/cities1000.txt"
                  python3 data/uk/scripts/build_pages.py
                  python3 data/uk/scripts/generate_roster.py

            # Only compile when the discovery actually changed the wiring — a bad
            # splice must fail the job here, BEFORE a broken PR is opened. Weeks
            # with no new venues skip the (slow) compile entirely.
            - name: Check for wiring changes
              id: changed
              run: |
                  if git diff --quiet -- common/src/main/scala/models/UkRosterData.scala scrapers/src/main/scala/services/cinemas/uk/UkSourcesData.scala geodata/src/main/scala/models/VenueTowns.scala data/uk; then
                      echo "wired=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "wired=true" >> "$GITHUB_OUTPUT"
                  fi

            # The JDK, sbt and the shared `sbt-target-` build cache (the action's default key).
            - uses: ./.github/actions/setup-sbt-build
              if: steps.changed.outputs.wired == 'true'

            # Gate: the generated Scala must compile (common + worker) or the job
            # fails and no PR is opened.
            - name: Compile-gate the generated wiring
              if: steps.changed.outputs.wired == 'true'
              run: sbt "worker/compile"

            # A new venue in a new town is a new page, so the apps' bundled catalog
            # seeds move with it — and CatalogSeedSpec (with tree-unchanged.sh) would
            # turn the PR red without them. The spec rewrites stale seeds and fails;
            # the second run must pass on what it wrote.
            - name: Regenerate the apps' catalog seeds
              if: steps.changed.outputs.wired == 'true'
              run: |
                  sbt "web/Test/testOnly tools.CatalogSeedSpec" || sbt "web/Test/testOnly tools.CatalogSeedSpec"

            # A fresh branch off main every run, never a force-push over a stale one --
            # see .github/actions/drop-bot-branch.
            - uses: ./.github/actions/drop-bot-branch
              with:
                  branch: chore/discover-cinemas
                  token: ${{ steps.app-token.outputs.token || github.token }}

            # Open (or replace) the PR with the newly wired venues. `add-paths` scopes
            # the commit to the two source files; the report is the body only (not
            # committed). No diff ⇒ no PR.
            - name: Open discovery PR
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: chore/discover-cinemas
                  delete-branch: true
                  add-paths: |
                      data/uk/roster.json
                      common/src/main/scala/models/UkRosterData.scala
                      scrapers/src/main/scala/services/cinemas/uk/UkSourcesData.scala
                      geodata/src/main/scala/models/VenueTowns.scala
                      common/src/main/scala/models/UkPages.scala
                      data/uk/venues.json
                      data/uk/towns.json
                      data/uk/pages.json
                      android/app/src/main/java/pl/kinowo/model/City.kt
                      ios/Kinowo/Models/City.swift
                      android/app/src/main/assets/catalog-seed.json
                      ios/Kinowo/catalog-seed.json
                  commit-message: 'chore: wire newly-discovered UK cinemas from Flicks'
                  title: 'chore: wire newly-discovered UK cinemas'
                  body-path: discovery-report.md

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [discover-cinemas]
        if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
