#
# THE LONG FILL, BY HAND: what the last hermetic convergence leg of each country could not answer from its
# pinned pair, fetched for `minutes` and published as `fill-<code>-<corpus>-<this run>.tar.zst`, which every
# hermetic leg set up after it replays over the pinned tree (docs/design/convergence-fixture-fill.md).
#
# Every leg row already spends ~90 s on the list before its suite (country-convergence-leg.yml); this is for
# a list longer than that — a new detail fetch that left thousands of pages unrecorded. DISPATCH ONLY: it
# changes the inputs of every later verdict, so nobody's push starts it.
#
#   gh workflow run convergence-fill.yml --ref main -f countries=us -f minutes=20
#
# `recording` fills a recording that is not pinned yet (a nightly `Record scrape fixtures` run, e.g. 3166) from the
# refetch lists its verify legs published: its fills go up under its own corpus run, so the pin that promotes it
# finds them as any pair's (convergence-setup), and a promotion never waits on a gap a dispatch could have closed.
#
# Its own run id names what it publishes, so it never writes a leg row's name (those carry their phase).
# Main only, like every publish of the release (convergence-publish). (ConvergenceFillWiringSpec)
#
name: Convergence fill

on:
    workflow_dispatch:
        inputs:
            countries:
                description: Comma-separated country codes to fill (pl, de, uk, es, us).
                required: false
                type: string
                default: pl,de,uk,es,us
            minutes:
                description: Minutes into each country's job at which its fill stops starting requests (at most 30).
                required: false
                type: number
                default: 7
            recording:
                description: A `Record scrape fixtures` run not pinned yet to fill instead of the pinned pair (its verify legs' lists).
                required: false
                type: string
                default: ''

# One fill at a time PER COUNTRY SET: two of the same set would fetch the same list twice, but a newer dispatch
# for other countries must not replace a pending one (the lane keeps one waiting run, the newest).
concurrency:
    group: convergence-fill-${{ inputs.countries }}
    cancel-in-progress: false

# Least privilege by default: every job that needs more than reading the
# repository grants it at job level.
permissions:
    contents: read

# SHADOW SWITCH (scripts/ci/ci-writes.sh): on github.com this run writes nothing outside its runner unless CI_ROLE=primary.
env:
    CI_ROLE: ${{ vars.CI_ROLE }}

jobs:
    # The countries asked for, as the fill's matrix — only the five that have a convergence leg.
    countries:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'measure' }}
        timeout-minutes: 2
        outputs:
            codes: ${{ steps.codes.outputs.codes }}
            # The fill rows' runner, evaluated HERE: their matrix reads this job's outputs, so Forgejo re-parses them
            # with these outputs and no `github` -- a `github.server_url` read there is empty (WorkflowPlanSpec).
            fill-runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-26.04' || 'measure' }}
        steps:
            - id: codes
              env:
                  COUNTRIES: ${{ inputs.countries }}
              run: |
                  set -euo pipefail
                  codes=$(tr -s ', ' '\n' <<< "$COUNTRIES" | { grep -xE 'pl|de|uk|es|us' || true; } | sort -u | jq -Rnc '[inputs]')
                  if [ "$codes" = "[]" ]; then
                      echo "::error::no country with a convergence leg in '$COUNTRIES' (pl, de, uk, es, us)"
                      exit 1
                  fi
                  echo "codes=$codes" >> "$GITHUB_OUTPUT"

    fill:
        needs: [ countries ]
        # No `name:`: github.com and Forgejo both name each row `fill (<code>)` off its one matrix key -- Forgejo appends a
        # matrix computed from `needs` even to a named row, so naming it `fill (<code>)` read `fill (de) (de)`.
        strategy:
            fail-fast: false
            matrix:
                code: ${{ fromJson(needs.countries.outputs.codes) }}
        runs-on: ${{ needs.countries.outputs.fill-runs-on }}
        # `minutes` (at most 30) plus the grace for requests in flight, the pack and the publish.
        timeout-minutes: 40
        permissions:
            contents: write
            actions: read
        env:
            # The rolling release the trees and their fills live in (country-convergence-leg.yml declares the same).
            FIXTURE_RELEASE_TAG: convergence-fixtures
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/convergence-fill
              with:
                  code:         ${{ matrix.code }}
                  token:        ${{ secrets.GITHUB_TOKEN }}
                  minutes:      ${{ inputs.minutes > 30 && 30 || inputs.minutes }}
                  recording:    ${{ inputs.recording }}
                  tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
                  proxy-user: ${{ secrets.DECODO_PROXY_USER }}
                  proxy-pass: ${{ secrets.DECODO_PROXY_PASS }}

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [ countries, fill ]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        with:
            lane: ${{ github.server_url != 'https://github.com' && 'measure' || '' }}
        # `inherit`, not the two secrets by name: naming them obliges report-timings.yml to declare them
        # under `workflow_call.secrets`, which Forgejo 15 refuses outright (the whole file then fails on
        # every event). `inherit` reads the same on github.com and declares nothing.
        secrets: inherit
