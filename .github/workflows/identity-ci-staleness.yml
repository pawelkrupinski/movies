# IS THE IDENTITY CI STILL TELLING US ANYTHING? Every three hours, scripts/ci/identity-ci-staleness.sh
# asks GitHub whether `Identity model convergence` has been red on main for over 6 hours, whether the
# newest pipeline commit has gone 3 hours with no convergence run covering it, and whether
# `Record scrape fixtures` has gone 36 hours without a success. Any of them is work OVERDUE, not a
# regression: the run stays green (the owner, 2026-10-27: CI red means only a regression) and the
# `report` job turns it into the owner-assigned issue, closed by the next run with nothing overdue.
# The run is red only when the checker itself cannot judge (gh, git or jq failed).
#
# WHY A WORKFLOW AND NOT AN ALERT: Prometheus cannot see GitHub. And WHY AT ALL: convergence is
# dispatched by Main, so its own `report` job (schedule-only) never runs -- a red leg sat red for ~10
# hours on 2026-10-13 with nobody told.
name: Identity CI staleness

on:
    schedule:
        - cron: '23 */3 * * *'
    workflow_dispatch:

concurrency:
    group: identity-ci-staleness
    cancel-in-progress: true

permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    check:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        outputs:
            overdue: ${{ steps.staleness.outputs.overdue }}
            alert: ${{ steps.staleness.outputs.alert }}
            found: ${{ steps.staleness.outputs.found }}
        permissions:
            contents: read
            actions: read
        steps:
            - uses: actions/checkout@v5
              with:
                  # The coverage check asks whether a run's commit descends from the newest pipeline commit.
                  fetch-depth: 0

            # The checker's own verdicts first, offline: a checker that can no longer fail would report
            # green here for as long as nobody looked at it.
            - name: Self-test the checker
              run: bash scripts/ci/identity-ci-staleness-test.sh

            - name: Is the identity CI stale?
              id: staleness
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              # A checker that cannot read the runs (gh, git or jq failed: the forge's API, not our code) is an ALERT
              # (scripts/ci/alert-step.sh), never a red run; its self-test above still fails red.
              run: scripts/ci/alert-step.sh 1 -- scripts/ci/identity-ci-staleness.sh

    # EVERY JOB'S AND STEP'S TIME (.github/workflows/report-timings.yml). After every other job but the failure report.
    timings:
        needs: [check]
        if: ${{ !cancelled() }}
        permissions:
            actions: read
            contents: read
        uses: ./.github/workflows/report-timings.yml
        # `inherit`: report-timings.yml declares no secrets.
        secrets: inherit

    # A failed scheduled check becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [check, timings]
        if: always() && !cancelled() && github.event_name == 'schedule'
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
                  overdue: ${{ needs.check.outputs.overdue }}
                  alert: ${{ needs.check.outputs.alert }}
                  found: ${{ needs.check.outputs.found }}
