name: Report run timings

# EVERY JOB'S AND STEP'S TIME, as each workflow's last job: every workflow that runs on its own calls this as its
# `timings` job, after every other job but the scheduled-failure report (RunTimingsWiringSpec). The caller's job gives
# the `needs`, the `if: ${{ !cancelled() }}` and the permissions; this holds the rest once, where 27 workflows each held
# a copy. The report itself is .github/actions/report-timings (scripts/ci/ci_timings.py). Never fails the run.
# NO `secrets:` DECLARATION: callers pass `secrets: inherit`.
#
# DISPATCHED, for THE GATE's convergence workflow (2026-11-06): that run's END is the gate's verdict, and the report, run
# as its last job, held the verdict back 40-70 s. Its `timings` job dispatches this workflow with the run's id instead (a
# few seconds); the run this starts waits for that one to end and reports it (RunTimingsWiringSpec).
on:
    workflow_call:
    workflow_dispatch:
        inputs:
            run-id:
                description: The run to report, once it has ended (empty when called -- the caller's own run).
                required: true
                type: string

permissions:
    actions: read
    contents: read


env:
    # ci-runner's job image (catthehacker's hosted-Ubuntu copy) sets no locale, where a hosted VM sets C.UTF-8: the JVM
    # then encodes file names as ASCII and every fixture path with a Polish letter throws InvalidPathException
    # (precommit-check run 41356052566). (SelfHostedRunnersSpec)
    LANG: C.UTF-8

jobs:
    # Named, not the bare `report`: beside a workflow's own scheduled-run `report` this row would read `report-1`.
    report:
        name: report (timings)
        # Where its caller runs (`github.workflow` is the CALLER's name here). THE GATE's workflows on main -- Main and
        # Identity model convergence -- stay on GitHub's hosted runners (the owner, 2026-11-06); with
        # MOVIES_CI_RUNNERS=self-hosted every other run -- a landing check, a measurement, a nightly explorer, a bot --
        # reports from any free slot of ci-runner's (`movies`), beside the jobs it reports on.
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && (github.ref != 'refs/heads/main' || github.workflow != 'Main' && github.workflow != 'Identity model convergence') && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        steps:
            # The workflows too: each job's `timeout-minutes` goes out beside its time (ci_timings.py `workflow_ceilings`).
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      scripts/ci
                      .github/actions/report-timings
                      .github/workflows
            # A dispatched report's run ends seconds after the dispatch: wait for it, so its last job is in the report.
            - name: Wait for the run it reports to end
              if: inputs.run-id != ''
              # never fails the report: past the bound it reports the run as it stands
              continue-on-error: true
              timeout-minutes: 4
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_ID: ${{ inputs.run-id }}
              run: |
                  . scripts/ci/bounded-step.sh
                  until [ "$(gh run view "$RUN_ID" --json status --jq .status)" = completed ]; do sleep 10; done
            - name: End what a timed-out step left running
              if: always()
              run: scripts/ci/bounded-step.sh --reap
            - uses: ./.github/actions/report-timings
              with:
                  run-id: ${{ inputs.run-id }}
                  grafana-url: ${{ secrets.GRAFANA_URL }}
                  grafana-annotation-token: ${{ secrets.GRAFANA_ANNOTATION_TOKEN }}
