name: iOS

on:
    pull_request:
        paths:
            - 'ios/**'
            - 'mobile-version.txt'
            - 'scripts/mobile-version-check.sh'
            - 'scripts/ci/ios-sim-destination*.sh'
            - 'scripts/ci/xcresult_junit*.py'
            - '.github/workflows/ios.yml'
            # The retry-classification table the language-push and hidden-films tests hold the app's rules to.
            - 'test/resources/retry-classification.json'
    push:
        branches: [main]
        paths:
            - 'ios/**'
            - 'mobile-version.txt'
            - 'scripts/mobile-version-check.sh'
            - 'scripts/ci/ios-sim-destination*.sh'
            - 'scripts/ci/xcresult_junit*.py'
            - '.github/workflows/ios.yml'
            # The retry-classification table the language-push and hidden-films tests hold the app's rules to.
            - 'test/resources/retry-classification.json'
    workflow_dispatch:

# On a pull request a newer push cancels the older run mid-flight, freeing the slow macOS
# Simulator lane instead of queueing stale UI-test work behind it. On main every commit
# finishes: cancelling there is what killed run 36115063750's XCUITest step 24 minutes in,
# 57 passes and no failures deep, and read as a hang. (A queued main run still replaces an
# older queued one, so a commit storm waits for at most one run.)
concurrency:
    group: ios-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `checks: write` so action-junit-report can post failure check-runs +
# summaries; `contents: read` for checkout. All jobs are same-repo.
permissions:
    contents: read
    checks: write

# Two jobs, two lanes:
#
#   unit-integration ─► Linux swift:5.10 container, fast.
#   ui-tests         ─► macOS runner + iOS Simulator, slow.
#
# The live-server contract (the JSON the app decodes) is checked by the
# `mobile-local-server` job in ci.yml against a FixtureServerMain boot, not
# against production.
jobs:
    unit-integration:
        runs-on: ubuntu-latest
        container: swift:5.10
        steps:
            - uses: actions/checkout@v5

            # The Xcode project carries a COPY of mobile-version.txt (an Xcode
            # project cannot read a file), and nothing in the build fails when
            # the copy drifts — only the two store pages would. Fail here instead.
            - name: Assert MARKETING_VERSION matches mobile-version.txt
              run: scripts/mobile-version-check.sh

            - uses: actions/cache@v5
              with:
                  path: ios/.build
                  key: spm-build-${{ runner.os }}-${{ hashFiles('ios/Package.swift', 'ios/Package.resolved') }}
                  restore-keys: |
                      spm-build-${{ runner.os }}-

            # KINOWO_LOCAL_URL unset → LocalServerTestCase XCTSkips itself, so
            # a plain `swift test` covers the unit suites cleanly.
            - run: swift test --package-path ios --xunit-output ios-unit.xml

            - name: Publish test report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'ios-unit*.xml'
                  check_name: iOS unit/integration
                  detailed_summary: true
                  include_passed: false


    ui-tests:
        runs-on: macos-latest
        # Build ~1 min + SPM ~1 min + XCUITest step (bounded below).
        timeout-minutes: 75
        steps:
            # Only what this job reads: the Xcode project and SwiftPM package, the CI helpers, and the
            # one file outside ios/ a test loads (RetryClassificationTable). The full tree is 20k files
            # and ~1.2 GB, almost all of it test/resources fixtures; checking it out cost 18 s a run.
            - uses: actions/checkout@v5
              with:
                  sparse-checkout: |
                      /ios/
                      /scripts/ci/
                      /test/resources/retry-classification.json
                  sparse-checkout-cone-mode: false

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            # The destination every simulator step below uses: an iPhone this image HAS, never a
            # hard-coded model (an Xcode 26 image dropped "iPhone 15", and the continue-on-error
            # XCUITest step silently stopped running). Its spec runs first.
            #
            # Booted here, before the build and the SPM tests, so the cold boot overlaps them instead
            # of following them: the XCUITest step used to spend 1-8 minutes between its build
            # finishing and the test runner starting. `simctl boot` returns once the boot is under
            # way; the XCUITest step waits for it to finish.
            - name: Pick and boot the simulator
              run: |
                  scripts/ci/ios-sim-destination-test.sh
                  destination="$(scripts/ci/ios-sim-destination.sh)"
                  echo "DESTINATION=$destination" >> "$GITHUB_ENV"
                  echo "SIM_UDID=${destination##*id=}" >> "$GITHUB_ENV"
                  xcrun simctl boot "${destination##*id=}"

            # COMPILING the app is a separate step from RUNNING the UI tests,
            # and only this one blocks. `swift test` builds the SPM view of the
            # sources, which excludes every SwiftUI file (`Views/`, ContentView,
            # KinowoApp — see Package.swift), so nothing else in CI type-checks
            # them: a `Views/*.swift` that does not compile shipped to main green
            # on 2026-09-04 and was caught only by a build to a real device.
            #
            # build-for-testing builds the app AND the UI-test bundle once, for the simulator the
            # tests run on (arm64 only: `generic/platform=iOS Simulator` compiled every file twice,
            # arm64 and x86_64), and the XCUITest step runs those products without building again.
            - name: Build the app and its UI tests
              id: build
              run: |
                  xcodebuild build-for-testing \
                      -project ios/Kinowo.xcodeproj \
                      -scheme Kinowo \
                      -destination "$DESTINATION" \
                      CODE_SIGNING_ALLOWED=NO

            # Parity check — catches Foundation/Darwin vs Linux drift in
            # the model / decoder layer that Linux swift-corelibs-foundation
            # wouldn't surface.
            #
            # Before the XCUITest step, not after: the simulator is still booting here, and a cold
            # boot on this runner has taken anywhere from 1 to 8 minutes before the first test could
            # run (runs 36899664976, 36298642377). Work done now hides inside that wait.
            - name: Run SPM tests on macOS
              run: swift test --package-path ios --xunit-output ios-macos.xml

            - name: Publish SPM macOS report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'ios-macos*.xml'
                  check_name: iOS SPM (macOS)
                  detailed_summary: true
                  include_passed: false

            # One simulator, serially: ~28 min (green run 36117454325). Two clones were slower on
            # this 3-core runner, not faster: run 36157983964 took 38 min and clone 2 ran 3 of the
            # 62 tests.
            # Every test is bounded: one that hangs is killed at its allowance and FAILS, naming
            # itself in the report, instead of eating the step's budget in silence. The step's own
            # timeout backs that up if xcodebuild itself wedges.
            #
            # Still continue-on-error until two main runs are green with the city-gate flake fixed
            # (only the gate's own suites still tap it, see FixtureLaunch.intoCity); then drop it.
            # Runs whatever the SPM tests above concluded, as it did when it ran first.
            #
            # `-collect-test-diagnostics never`: on any test-run issue — even a passing run's
            # runtime warning, like the ATS one a live http:// cinema URL raises — xcodebuild runs
            # `simctl diagnose` after the last test: locally that added ~35 s to a green run and,
            # once, hung the step for its full 600 s timeout. The result bundle still carries each
            # failure's message, screenshots and the app/runner logs; only the sysdiagnose is gone.
            - name: Run XCUITest
              id: xcuitest
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              continue-on-error: true
              timeout-minutes: 50
              run: |
                  xcrun simctl bootstatus "$SIM_UDID" -b
                  xcodebuild test-without-building \
                      -project ios/Kinowo.xcodeproj \
                      -scheme Kinowo \
                      -destination "$DESTINATION" \
                      -resultBundlePath build/Kinowo.xcresult \
                      -collect-test-diagnostics never \
                      -test-timeouts-enabled YES \
                      -default-test-execution-time-allowance 180 \
                      -maximum-test-execution-time-allowance 300 \
                      CODE_SIGNING_ALLOWED=NO

            # Turn the binary XCUITest result bundle into JUnit XML so a
            # failure is readable on the run page without Xcode. The
            # upload below keeps the full bundle for deep inspection.
            # Plain `xcresulttool` + a script, not `brew install xcresultparser` (~50 s a run).
            - name: Convert xcresult to JUnit
              if: always()
              run: |
                  python3 scripts/ci/xcresult_junit_test.py
                  [ -d build/Kinowo.xcresult ] || exit 0
                  python3 scripts/ci/xcresult_junit.py build/Kinowo.xcresult > xcuitest.xml \
                      || echo "::warning title=xcresult::could not read build/Kinowo.xcresult (step killed mid-write?)"

            - name: Publish XCUITest report
              if: always()
              uses: mikepenz/action-junit-report@v5
              with:
                  report_paths: 'xcuitest.xml'
                  check_name: iOS XCUITest
                  detailed_summary: true
                  include_passed: false

            # XCUITest step is continue-on-error (see there), so leave a glance-able signal when
            # it has failures, WITH each failure's assertion and line, as annotations on the run page
            # itself (the xcresultparser report this used to sit beside named only the test, under
            # "Uncategorized", which left run 36157983964's two failures unexplained).
            - name: Flag XCUITest failures
              if: always()
              run: |
                  [ -d build/Kinowo.xcresult ] || exit 0
                  xcrun xcresulttool get test-results summary --path build/Kinowo.xcresult > xcuitest-summary.json || exit 0
                  python3 - <<'PY'
                  import json
                  summary = json.load(open("xcuitest-summary.json"))
                  for failure in summary.get("testFailures", []):
                      text = str(failure.get("failureText")).replace("%", "%25").replace("\n", "%0A")
                      print(f"::warning title={failure.get('testName')}::{text}")
                  PY

            # `failure()` alone never fires for the XCUITest step: continue-on-error keeps the job
            # green, so its result bundle was never kept. Its own outcome decides.
            - uses: actions/upload-artifact@v6
              if: always() && (failure() || steps.xcuitest.outcome == 'failure')
              with:
                  name: Kinowo.xcresult
                  path: build/Kinowo.xcresult
                  if-no-files-found: ignore
