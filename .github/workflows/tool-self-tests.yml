# Purpose: The development tooling's own tests, off the gate (ci-failures-2026-10-30, recommendation 1)
name: Tool self-tests

# THE DEVELOPMENT TOOLING'S OWN TESTS, OFF THE GATE (ci-failures-2026-10-30, recommendation 1). The script self-tests
# (scripts/run-script-tests: the pre-push hook, sbt-warm, the JVM gate and its keeper, agent-procs, tool-conventions,
# the identity tools, the release tooling, ...) used to run inside Main (ci.yml's `script self-tests` job). None guards
# a user-visible behaviour, yet in the five days to 2026-10-30 they and the old-ref compile turned Main red 12 times and
# failed 8 landing checks, every one about time or process lifecycle on a loaded host, each red closing THE GATE (Main
# and Identity model convergence) to every other change. (identity-slice's old-ref compile ran here too, until it became
# a row of Main on 2026-11-21: main.yml's `old-ref-compile`.)
#
# They still guard every change to what they test:
#   - BEFORE IT LANDS: the pre-push hook's `scripttests` check (scripts/run-script-tests --changed, on Mac and Linux)
#     runs them for every change touching their paths, on the laptop and in the landing check (precommit-check.yml),
#     and a failure there blocks that change;
#   - AFTER: this workflow runs them all on every push to main touching those paths. A red here is the tooling's,
#     listed by `agentctl ci-why` outside the gate; it closes no push.
# NOT AGAIN FOR A TREE A LANDING CHECK PASSED (the owner, 2026-11-18: 165 runner-minutes in two days): a push whose very
# tree a full landing check passed (scripts/ci/landing_check_for_tree.py: keyed on the tree and the run's conclusion,
# never a branch name) had them run there by the same hook; anything that landed some other way runs them here.
#
# AND UNDER macOS's /bin/bash 3.2, BSD tools and /usr/bin/python3 3.9 (`macos-script-tests`), the floor the tools
# promise and ubuntu has none of: on every push touching the tools, the push's floor scope (run-script-tests --changed
# <before> --floor: the bash files it touched parsed by 3.2, their self-tests under it, the rest natively on macOS) and
# the floor lint; nightly (and a dispatch), every self-test under 3.2. Until 2026-11-22 only Order independence's swift leg ran them --
# about a third of its reds (#89, #90, #94, #97, #103, #105), none an order dependence. A landing check's Linux pass is
# no macOS pass: the skip below holds for the Linux job only.
on:
    push:
        branches: [main]
        paths:
            - 'scripts/**'
            - '.github/scripts/**'
            - '.github/actions/**'
            - 'android/scripts/**'
            - 'ios/scripts/**'
            - 'infra/bin/**'
            - 'infra/nix/files/**'
            - 'data/**'
            - '.github/workflows/tool-self-tests.yml'
            # the checked-in files identity_judgements_lint_test.py lints (ToolSelfTestsOffGateSpec)
            - 'test/resources/fixtures/identity-judgements.tsv'
            - 'test/resources/fixtures/identity-unmatched/expected-matches.tsv'
            - 'test/resources/fixtures/corpus/expected-hard-clusters-*.txt'
    # nightly: every self-test under macOS's bash 3.2 (a push runs only its floor scope)
    schedule:
        - cron: '29 17 * * *'
    # The external scheduler's run of a cron slot (infra/nix/files/scheduled_dispatch.py): treated as the schedule.
    repository_dispatch:
        types: [scheduled-tool-self-tests]
    workflow_dispatch:

concurrency:
    group: tool-self-tests-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read


env:
    # ci-runner's job image sets no locale where a hosted VM sets C.UTF-8 (SelfHostedRunnersSpec).
    LANG: C.UTF-8

jobs:
    # WHETHER THEY RUN (WorkflowPlanSpec: the one plan job): a push to main runs them unless a landing check passed its
    # very tree; a dispatch always does; the schedule runs the macOS job alone. gh unable to say runs them. The macOS
    # job's scope: a push's floor scope since its `before`, else (dispatch, schedule) every self-test.
    plan:
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            run: ${{ steps.plan.outputs.run }}
            macos-base: ${{ steps.plan.outputs.macos-base }}
        steps:
            - uses: actions/checkout@v5
              with:
                  # scripts/ for scripts/ci (cone mode: directories)
                  sparse-checkout: |
                      scripts
                      .github/actions/job-telemetry
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Did a landing check pass this very tree?
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  if [ "$EVENT" = push ]; then echo "macos-base=$BEFORE" >> "$GITHUB_OUTPUT"; else echo "macos-base=" >> "$GITHUB_OUTPUT"; fi
                  if [ "$EVENT" = schedule ] || [ "$EVENT" = repository_dispatch ]; then
                      echo "the nightly run: the macOS job alone, every self-test"
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  elif [ "$EVENT" = push ] && run="$(scripts/ci/landing_check_for_tree.py "$(git rev-parse 'HEAD^{tree}')")"; then
                      echo "landing check run $run passed this very tree: its script self-tests ran there"
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "no landing check passed this tree (or a dispatch): every tool self-test runs"
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  fi
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # Every script self-test (`*-test.sh`, `*_test.py` under scripts/, .github/, android/scripts, ios/scripts and
    # infra/bin), found by name and run in parallel by scripts/run-script-tests. A new test runs here the moment it
    # exists; one tagged `# script-test: <tag>` runs where its toolchain is. It needs no JDK, sbt or build cache.
    script-tests:
        name: script self-tests
        needs: [ plan ]
        if: ${{ needs.plan.outputs.run == 'true' }}
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - name: Every script self-test
              env:
                  RUN_SCRIPT_TESTS_LOG_DIR: ${{ runner.temp }}/script-test-logs
              run: scripts/run-script-tests
            # the whole log of each failing self-test (run-script-tests keeps it in RUN_SCRIPT_TESTS_LOG_DIR): the report
            # holds its failing cases and last 60 lines, and the rest left with the runner (Order independence #94)
            - name: Keep the failing self-tests' whole logs
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: script-test-logs
                  path: ${{ runner.temp }}/script-test-logs/
                  if-no-files-found: ignore
                  overwrite: true
                  retention-days: 14
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    macos-script-tests:
        name: script self-tests (macOS bash 3.2)
        needs: [ plan ]
        # github.com's hosted macOS only (SelfHostedRunnersSpec)
        runs-on: macos-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v5
              with:
                  # the push's `before`, for --changed
                  fetch-depth: 0
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            # The tools the self-tests drive run on ubuntu CI and the laptop, both with GNU `timeout`, shellcheck and
            # rsync 3; this image has none of them (run 41294275183: ten self-tests failed "timeout: command not
            # found" / "shellcheck is not installed"; run 44664123050: backtest_alerts_local_test.py "rsync on PATH is
            # not rsync 3", the image's rsync being openrsync). Only `timeout` and `rsync` are linked, ahead of
            # /usr/bin, as on the laptop -- no coreutils gnubin, so the tests still meet macOS's own sed, date and
            # friends. (ScriptSelfTestsRunInCiSpec)
            - name: GNU timeout, shellcheck and rsync 3, as Linux CI and the laptop have them
              env:
                  HOMEBREW_NO_AUTO_UPDATE: '1'
              run: |
                  brew install coreutils shellcheck rsync
                  mkdir -p "$RUNNER_TEMP/gnu-timeout"
                  ln -sf "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/gnu-timeout/timeout"
                  ln -sf "$(brew --prefix rsync)/bin/rsync" "$RUNNER_TEMP/gnu-timeout/rsync"
                  "$RUNNER_TEMP/gnu-timeout/rsync" --version | head -1
                  echo "$RUNNER_TEMP/gnu-timeout" >> "$GITHUB_PATH"
            # The script tools promise macOS's /bin/bash 3.2 and /usr/bin/python3 3.9 (scripts/run-script-tests'
            # PythonFloor), and the Linux job has neither, so a bash-4-only construct ($BASHPID, an empty "${a[@]}"
            # under set -u) or 3.10+ syntax passed there. The floor lint, run BY /usr/bin/python3, compiles every
            # Python file as 3.9 does (python_floor_lint.py).
            - name: Script self-tests under macOS /bin/bash 3.2, Python at the floor
              env:
                  RUN_SCRIPT_TESTS_LOG_DIR: ${{ runner.temp }}/script-test-logs
                  BASE: ${{ needs.plan.outputs.macos-base }}
              run: |
                  /bin/bash --version | head -1
                  if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2> /dev/null; then
                      echo "the push's floor scope, since $BASE"
                      scripts/run-script-tests --changed "$BASE" --floor "$(scripts/floor-bash)"
                  else
                      scripts/run-script-tests --bash "$(scripts/floor-bash)"
                  fi
                  /usr/bin/python3 scripts/ci/python_floor_lint.py
            # the whole log of each failing self-test (run-script-tests keeps it in RUN_SCRIPT_TESTS_LOG_DIR): the report
            # holds its failing cases and last 60 lines, and the rest left with the runner (Order independence #94)
            - name: Keep the self-tests' whole logs
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: script-test-logs-macos
                  path: ${{ runner.temp }}/script-test-logs/
                  if-no-files-found: ignore
                  overwrite: true
                  retention-days: 14
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}

    # A failed scheduled run becomes an issue assigned to the owner, closed on the next pass --
    # see .github/actions/report-scheduled-run (ScheduledRunReportSpec).
    report:
        name: report (scheduled run)
        needs: [plan, script-tests, macos-script-tests]
        if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        runs-on: ${{ vars.MOVIES_CI_RUNNERS == 'self-hosted' && 'movies' || 'ubuntu-26.04' }}
        timeout-minutes: 5
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@v5
            # The job's measurements (machine, CPU, memory, GC, tests) for ci-timings and VictoriaLogs; never fails it.
            - uses: ./.github/actions/job-telemetry
              with:
                  phase: start
                  token: ${{ github.token }}
            - uses: ./.github/actions/report-scheduled-run
              with:
                  failed: ${{ contains(needs.*.result, 'failure') }}
            - uses: ./.github/actions/job-telemetry
              if: ${{ !cancelled() }}
              with:
                  phase: finish
                  token: ${{ github.token }}
                  job-status: ${{ job.status }}
