name: Set up JDK (cached, retrying)
description: >-
  Most hosted runner images do not preinstall JDK 27 (ubuntu-26.04 does:
  see below). A pinned JDK (scripts/ci/jdk-pin.sh: 27 on Linux x64/arm64 and
  macOS arm64) is ONE actions/cache entry per platform, keyed by release and
  checksum and saved only from main: a warm cache downloads nothing from
  GitHub's release CDN, whose 504s failed Main #2306 (2026-11-08), and
  scripts/ci/fetch-verified.sh re-verifies the checksum on a hit and
  downloads a miss (or a failed restore) with a retry budget of minutes;
  setup-java's `jdkfile` then installs it offline. A download GitHub still
  fails after that takes the same release's Zulu build from cdn.azul.com. A runner whose
  tool-cache already holds a Temurin 27 (ubuntu-26.04: 27.0.0+35), and
  anything unpinned, goes
  through plain actions/setup-java, retried up to 3 times (ECONNRESET while
  resolving the latest version, run 36327812746).

inputs:
  java-version:
    description: Java version to install (e.g. 27, 21, '17').
    required: true
  distribution:
    description: JDK distribution to install.
    required: false
    default: temurin
  cache:
    description: >-
      Build tool whose dependencies to cache (e.g. sbt, gradle, maven).
      Left empty, no cache is configured — same as omitting setup-java's
      own `cache` input.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # sbt's dependency cache is OURS, not setup-java's. setup-java keys it on a hash of the build
    # files with NO fallback, so any build.sbt / project/** edit started every runner of a push —
    # fifteen at once — downloading sbt and every dependency from Maven Central, which answers
    # that burst with 403s (run 36807612216: "Error downloading org.scala-sbt:sbt:1.13.0 …
    # forbidden"). Same paths, same exact key shape, but a prefix restore-key: a changed build
    # starts from the previous cache and fetches only what actually changed.
    # Saved by main only, like the sbt target cache (sbt-target-cache's header; CacheSavePolicySpec):
    # 0.4 GB an entry, and every other ref restores the prefix.
    # The restore's outcome, time and size for the job's metrics (cache-marker.sh, ci-timings' cache hit rates).
    - if: inputs.cache == 'sbt'
      shell: bash
      continue-on-error: true
      run: '"$GITHUB_WORKSPACE/scripts/ci/cache-marker.sh" begin sbt-deps || true'
    - name: Restore the sbt dependency cache
      id: sbt-deps-cache
      if: inputs.cache == 'sbt' && github.ref == 'refs/heads/main'
      uses: actions/cache@v5
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
          !~/.sbt/*.lock
        # The build's own files by NAME, never `**/*.sbt`: hashFiles walks every file a `**` can reach,
        # and a convergence leg's workspace holds a ~127,000-file restored fixture tree — the walk cost
        # ~39 s at restore and again in the post step, on every leg.
        key: sbt-deps-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/**/*.scala') }}
        restore-keys: |
          sbt-deps-${{ runner.os }}-
    - name: Restore the sbt dependency cache (not main, restore only)
      id: sbt-deps-restore
      if: inputs.cache == 'sbt' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
          !~/.sbt/*.lock
        key: sbt-deps-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties', 'project/**/*.scala') }}
        restore-keys: |
          sbt-deps-${{ runner.os }}-
    - if: inputs.cache == 'sbt'
      shell: bash
      continue-on-error: true
      env:
        HIT: ${{ steps.sbt-deps-cache.outputs.cache-hit || steps.sbt-deps-restore.outputs.cache-hit }}
      run: '"$GITHUB_WORKSPACE/scripts/ci/cache-marker.sh" end sbt-deps "$HIT" "" "$HOME/.ivy2/cache" "$HOME/.cache/coursier" || true'
    - name: The pinned JDK
      id: pin
      shell: bash
      env:
        JAVA_VERSION_WANTED: ${{ inputs.java-version }}
      run: '"$GITHUB_WORKSPACE/scripts/ci/jdk-pin.sh" "$JAVA_VERSION_WANTED" >> "$GITHUB_OUTPUT"'
    - name: Restore the pinned JDK
      id: jdk-restore
      if: steps.pin.outputs.key != ''
      uses: actions/cache/restore@v5
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/jdk-archive
        key: ${{ steps.pin.outputs.key }}
    - name: Fetch the pinned JDK (verified)
      id: fetch
      if: steps.pin.outputs.key != ''
      continue-on-error: true
      shell: bash
      env:
        FILE: ${{ runner.temp }}/jdk-archive/${{ steps.pin.outputs.file }}
        URL: ${{ steps.pin.outputs.url }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
      run: '"$GITHUB_WORKSPACE/scripts/ci/fetch-verified.sh" "$FILE" "$URL" "$SHA256"'
    # GitHub's release CDN failing for minutes on end (2026-11-08): the same release's Zulu build from cdn.azul.com,
    # checksum-pinned the same way and never cached.
    - name: Fetch the pinned JDK's fallback from Azul (verified)
      if: steps.pin.outputs.key != '' && steps.fetch.outcome == 'failure'
      shell: bash
      env:
        FILE: ${{ runner.temp }}/jdk-fallback/${{ steps.pin.outputs.fallback_file }}
        URL: ${{ steps.pin.outputs.fallback_url }}
        SHA256: ${{ steps.pin.outputs.fallback_sha256 }}
      run: '"$GITHUB_WORKSPACE/scripts/ci/fetch-verified.sh" "$FILE" "$URL" "$SHA256"'
    - name: Save the pinned JDK (main only)
      if: steps.pin.outputs.key != '' && github.ref == 'refs/heads/main' && steps.jdk-restore.outputs.cache-hit != 'true' && steps.fetch.outcome == 'success'
      uses: actions/cache/save@v5
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/jdk-archive
        key: ${{ steps.pin.outputs.key }}
    - name: Set up the pinned JDK
      if: steps.pin.outputs.key != ''
      uses: actions/setup-java@v5
      with:
        distribution: jdkfile
        jdkFile: ${{ steps.fetch.outcome == 'success' && format('{0}/jdk-archive/{1}', runner.temp, steps.pin.outputs.file) || format('{0}/jdk-fallback/{1}', runner.temp, steps.pin.outputs.fallback_file) }}
        java-version: ${{ steps.pin.outputs.version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}

    - name: Set up JDK (attempt 1)
      id: setup-jdk-1
      if: steps.pin.outputs.key == ''
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}

    - name: Wait before retry 1
      if: steps.pin.outputs.key == '' && steps.setup-jdk-1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Set up JDK (attempt 2)
      id: setup-jdk-2
      if: steps.pin.outputs.key == '' && steps.setup-jdk-1.outcome == 'failure'
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}

    - name: Wait before retry 2
      if: steps.pin.outputs.key == '' && steps.setup-jdk-1.outcome == 'failure' && steps.setup-jdk-2.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Set up JDK (attempt 3)
      id: setup-jdk-3
      if: steps.pin.outputs.key == '' && steps.setup-jdk-1.outcome == 'failure' && steps.setup-jdk-2.outcome == 'failure'
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}
