name: Set up JDK (retrying)
description: >-
  Wraps actions/setup-java with retries. Hosted runners don't preinstall
  JDK 27 (only 21/17 come baked into some images), so most jobs resolve and
  download it over the network on every run; a transient network blip
  (e.g. ECONNRESET while resolving the latest version, as in run
  36327812746) otherwise fails the whole job for no reason related to the
  code under test. Retries up to 3 times with a short sleep between
  attempts before giving up for real.

inputs:
  java-version:
    description: Java version to install (e.g. 27, 21, '17').
    required: true
  distribution:
    description: JDK distribution to install.
    required: false
    default: temurin
  cache:
    description: >-
      Build tool whose dependencies to cache (e.g. sbt, gradle, maven).
      Left empty, no cache is configured — same as omitting setup-java's
      own `cache` input.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # sbt's dependency cache is OURS, not setup-java's. setup-java keys it on a hash of the build
    # files with NO fallback, so any build.sbt / project/** edit started every runner of a push —
    # fifteen at once — downloading sbt and every dependency from Maven Central, which answers
    # that burst with 403s (run 36807612216: "Error downloading org.scala-sbt:sbt:1.13.0 …
    # forbidden"). Same paths, same exact key shape, but a prefix restore-key: a changed build
    # starts from the previous cache and fetches only what actually changed.
    - name: Restore the sbt dependency cache
      if: inputs.cache == 'sbt'
      uses: actions/cache@v5
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.cache/coursier
          !~/.sbt/*.lock
        key: sbt-deps-${{ runner.os }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**/*.scala') }}
        restore-keys: |
          sbt-deps-${{ runner.os }}-
    - name: Set up JDK (attempt 1)
      id: setup-jdk-1
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}

    - name: Wait before retry 1
      if: steps.setup-jdk-1.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Set up JDK (attempt 2)
      id: setup-jdk-2
      if: steps.setup-jdk-1.outcome == 'failure'
      uses: actions/setup-java@v5
      continue-on-error: true
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}

    - name: Wait before retry 2
      if: steps.setup-jdk-1.outcome == 'failure' && steps.setup-jdk-2.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Set up JDK (attempt 3)
      id: setup-jdk-3
      if: steps.setup-jdk-1.outcome == 'failure' && steps.setup-jdk-2.outcome == 'failure'
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache != 'sbt' && inputs.cache || '' }}
