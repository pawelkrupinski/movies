name: Drop a bot PR branch
description: >-
  Deletes a bot's fixed PR branch so the create-pull-request step after it
  pushes a fresh branch off main instead of force-pushing over a stale one. A
  branch that outlived its PR (merged by fast-forwarding main, which GitHub
  never cleans up) would otherwise rewind weeks of main, and GitHub refuses
  that push from an App without the `workflows` permission whenever those
  weeks touched .github/workflows/. An open PR on the branch is closed and
  reopened fresh -- its content is regenerated from scratch every run anyway.
  See BotPullRequestBranchSpec. On Forgejo (no App, no git/refs API in the gh
  shim) git reads the branch through the checkout's credentials and Forgejo's
  branches API deletes it (a delete push from the shallow checkout crashes
  receive-pack; see drop.sh).

inputs:
  branch:
    description: The branch create-pull-request is about to push
    required: true
  token:
    description: The token that pushes it (the Sync Bot App's on github.com; the job's on Forgejo, where git uses the checkout's)
    required: true

runs:
  using: composite
  steps:
      - shell: bash
        env:
            GH_TOKEN: ${{ inputs.token }}
            GH_REPO: ${{ github.repository }}
            BRANCH: ${{ inputs.branch }}
        run: '"$GITHUB_ACTION_PATH"/drop.sh'
