name: Report run timings
description: >-
  Prints every job's and step's duration (and a convergence suite's PhaseTimer phases) to the log
  and the run summary, and pushes them to Prometheus for the "CI — build timings" Grafana
  dashboard (scripts/ci/ci_timings.py). Runs in .github/workflows/report-timings.yml, after the
  run it reports has ended (a `workflow_run`, or a dispatch with the run's id), or as the last
  job of the three workflows a GITHUB_TOKEN dispatch starts (RunTimingsWiringSpec). Never fails
  anything: a chart is not a gate.

inputs:
  grafana-url:
    description: Base URL of the Grafana instance (secrets.GRAFANA_URL)
    required: false
    default: ''
  grafana-annotation-token:
    description: The deploy marker's Grafana token, which Grafana vouches for on the metrics path
    required: false
    default: ''
  run-id:
    description: The run to report (a dispatched or workflow_run report-timings.yml's); empty for this job's own run
    required: false
    default: ''

runs:
  using: composite
  steps:
      - shell: bash
        env:
            GH_TOKEN: ${{ github.token }}
            GRAFANA_URL: ${{ inputs.grafana-url }}
            GRAFANA_ANNOTATION_TOKEN: ${{ inputs.grafana-annotation-token }}
            RUN_ID: ${{ inputs.run-id }}
        run: |
            python3 "$GITHUB_WORKSPACE/scripts/ci/ci_timings.py" --repo "$GITHUB_REPOSITORY" \
                --run-id "${RUN_ID:-$GITHUB_RUN_ID}" --push || true
