name: Install actionlint
description: >-
    The pinned actionlint, verified by its sha256, on PATH -- the one install of it every workflow uses. Its release
    tarball is one actions/cache entry keyed by version and checksum, saved only from main (every other ref restores
    it), so a warm cache needs no download from GitHub's release CDN, whose 504s failed three lands' `check (rest)` on
    2026-11-08 (run 42466721258). scripts/ci/fetch-verified.sh checks the checksum on a hit too, and a miss or a failed
    restore downloads with a retry budget of minutes; a CDN that fails even that leaves install-actionlint.sh to build
    the same version through proxy.golang.org or nixpkgs, version-checked and never cached. Needs the repository
    checked out.

inputs:
    version:
        description: The actionlint release.
        default: 1.7.12
    sha256:
        description: The sha256 of that release's actionlint_<version>_linux_amd64.tar.gz.
        default: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

runs:
    using: composite
    steps:
        - id: restore
          uses: actions/cache/restore@v5
          continue-on-error: true
          with:
              path: ${{ runner.temp }}/actionlint
              key: actionlint-${{ runner.os }}-${{ inputs.version }}-${{ inputs.sha256 }}
        - id: install
          shell: bash
          env:
              ACTIONLINT_VERSION: ${{ inputs.version }}
              ACTIONLINT_SHA256: ${{ inputs.sha256 }}
          run: |
              scripts/ci/install-actionlint.sh "$RUNNER_TEMP/actionlint"
              echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
        - if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.source == 'release'
          uses: actions/cache/save@v5
          continue-on-error: true
          with:
              path: ${{ runner.temp }}/actionlint
              key: actionlint-${{ runner.os }}-${{ inputs.version }}-${{ inputs.sha256 }}
