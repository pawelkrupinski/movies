# The sbt build cache every Scala job restores: the build definition's compile and each module's
# classes plus zinc state — ONE copy of the path list, which ten cache blocks used to repeat.
#
# What it carries, and why only that:
#   - NOT the root `target/`: that is test reports (rewritten every run — a cached one once handed a
#     convergence leg a report of specs it never ran) and sbt scratch. (SbtCachePathsSpec)
#   - NOT the packaged jars: ~0.5 GB of a ~0.9 GB entry, re-packaged in seconds, and what kept the
#     repository over GitHub's 10 GB cache cap. (SbtTargetCacheJarsSpec)
#
# The KEY stays with each caller: it scopes the hash to the sources that job compiles, and names
# the family (`sbt-target-`, `-e2e-`, `-page-`, ...) whose entries that job owns.
name: sbt target cache
description: Restore (and, unless restore-only, save) sbt's compiled classes and zinc state.
inputs:
  key:
    description: The exact cache key, scoped to the sources this job compiles.
    required: true
  restore-keys:
    description: Prefixes to fall back to on a miss, newest-matching first, one per line (unused by save-only).
    required: false
    default: ''
  restore-only:
    description: "'true' to restore without saving (a job whose compile must not become the family's entry)."
    required: false
    default: 'false'
  exact-hit-is-current:
    description: >-
      'true' where an EXACT key hit is an entry this same job saved from these very sources: the key hashes every Scala
      source the job compiles and no other job writes the family. Such an entry needs no exporter invalidation (below).
    required: false
    default: 'false'
  save-only:
    description: >-
      'true' to save what this job compiled under `key` NOW, restoring nothing -- a second family from one job, beside
      the entry its restoring call saves at the job's end (the takes row's worker test and it classes).
    required: false
    default: 'false'
# ONLY MAIN SAVES. Every other ref (measure/*, a landing check's batch, a lane run) restores and never
# saves. A measure or landing run's entries are read by nobody after it, and a save of a key another job
# already saved is a second copy. (CacheSavePolicySpec)
runs:
  using: composite
  steps:
    - if: inputs.restore-only != 'true' && inputs.save-only != 'true' && github.ref == 'refs/heads/main'
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          project/target
          project/project/target
          */target/scala-*
          !*/target/scala-*/*.jar
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - if: (inputs.restore-only == 'true' || github.ref != 'refs/heads/main') && inputs.save-only != 'true'
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: |
          project/target
          project/project/target
          */target/scala-*
          !*/target/scala-*/*.jar
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    # zinc misses one change in a restored build: a member added to an object another source `export X.*`s leaves the
    # exporter's class without its forwarder (Main #226, an entry from an older commit). Recompiling the few wildcard
    # exporters, seconds, keeps the incremental build correct; on every restore, since not every key hashes every source.
    # EXCEPT an exact hit on a caller's `exact-hit-is-current` key: that entry was compiled from these same sources, so
    # nothing in it is stale -- and the invalidation's own recompile (IdentityMeasures, CachingReviewSource and the two
    # review specs, plus what zinc re-checks behind them) was the whole of every Main row's 7-26 s compile on a push
    # that changed no Scala (runs 1216, 1244: ~150 row-seconds a run). (SharedSbtBuildSetupSpec)
    - if: >-
        inputs.save-only != 'true' && !(inputs.exact-hit-is-current == 'true'
        && (steps.cache.outputs.cache-hit == 'true' || steps.restore.outputs.cache-hit == 'true'))
      shell: bash
      run: scripts/ci/sbt-invalidate-exporters.sh
    # The same path list as above, or the entry's version would differ and no restore could read it.
    - if: inputs.save-only == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: |
          project/target
          project/project/target
          */target/scala-*
          !*/target/scala-*/*.jar
        key: ${{ inputs.key }}
