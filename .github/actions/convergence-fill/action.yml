# THE LONG FILL: what the last hermetic leg's tree could not answer, fetched for `minutes` and published
# beside the pinned pair (docs/design/convergence-fixture-fill.md). Run by the hand-dispatched
# `Convergence fill` workflow (convergence-fill.yml), one row per country — for a list longer than the
# ~90 s a leg's convergence row spends on it before its suite ("Fill the gaps the last leg listed",
# country-convergence-leg.yml).
#
# It reads the newest `refetch-<code>-<corpus>-*.tsv` of the pinned pair, which a hermetic convergence
# row publishes (`convergence-publish`), less the gaps the last fills were refused. It fetches through the worker's
# own per-host pacing, 429 gate and breaker (`HttpWiring.pacedWire`, `HostPolicies` — Flicks stays at its 200 ms),
# skips what the pair's fills already hold, and stops starting requests `minutes` into the job. What it fetched goes
# up as `fill-<code>-<corpus>-<run>-<attempt>.tar.zst` (main only): every hermetic leg set up after that replays it over
# the pinned tree. A TMDB gap is signed with the key handed in; OMDb's, a header's or a body's never are.
name: Fill a hermetic leg's gaps
description: Fetch, within a budget, what the last hermetic leg's tree lacked, and publish it beside the pinned pair.

inputs:
  code:
    description: The country's two-letter code (pl / de / uk / us / es).
    required: true
  token:
    description: A token that can read runs and write this repo's releases.
    required: true
  tmdb-api-key:
    description: >-
      TMDB's key, for the gaps listed with it masked (tools.FillCredentials). Only the fetching step sees it; without
      one those gaps are left for the recorder.
    required: false
    default: ''
  proxy-user:
    description: >-
      The residential proxy's user — what an origin refuses directly is asked again through it
      (MissingFixtureFill.route). Only the fetching step sees it; without one, refused requests stay gaps.
    required: false
    default: ''
  proxy-pass:
    description: The residential proxy's password, beside proxy-user.
    required: false
    default: ''
  minutes:
    description: >-
      Minutes from this action's start at which the fill stops starting requests. Its setup and compile come
      out of them too; packing and publishing take about one more.
    required: false
    default: '7'

runs:
  using: composite
  steps:
    - name: Note when the fill's minutes run out
      shell: bash
      run: echo "FILL_UNTIL=$(( $(date +%s) + ${{ inputs.minutes }} * 60 ))" >> "$GITHUB_ENV"

    # The pair's name and its fills, and a warm sbt — no MongoDB, corpus or tree.
    - uses: ./.github/actions/convergence-setup
      with:
          code:   ${{ inputs.code }}
          token:  ${{ inputs.token }}
          mode:   hermetic
          replay: 'false'

    - name: Find the gaps the last leg listed
      id: gaps
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          count=$(.github/scripts/convergence-fill.sh gaps "${{ inputs.code }}" "$KINOWO_CONVERGENCE_PIN_CORPUS_RUN" refetch.tsv)
          echo "the last leg listed $count fetchable gap(s)"
          echo "count=$count" >> "$GITHUB_OUTPUT"

    # What earlier fills already hold, so nothing is asked twice. One that cannot be restored only means its pages
    # are asked again — this job replays no verdict — so it fails nothing.
    - name: Restore the fills already published over the pair
      if: steps.gaps.outputs.count > 0
      continue-on-error: true
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          read -ra fills <<< "${KINOWO_CONVERGENCE_FILL_ASSETS:-}"
          .github/scripts/convergence-fill.sh unpack "$RUNNER_TEMP/fill-held" "${fills[@]}"

    - name: Fetch them until the fill's minutes run out
      if: steps.gaps.outputs.count > 0
      shell: bash
      env:
          KINOWO_COUNTRY:   ${{ inputs.code }}
          KINOWO_COUNTRIES: ${{ inputs.code }}
          TMDB_API_KEY:     ${{ inputs.tmdb-api-key }}
          DECODO_PROXY_USER: ${{ inputs.proxy-user }}
          DECODO_PROXY_PASS: ${{ inputs.proxy-pass }}
      run: |
          sbt -J-Xmx2g -J-Djdk.http.auth.tunneling.disabledSchemes= "worker/Fixtures/runMain scripts.FillMissingFixtures ${{ inputs.code }} refetch.tsv $RUNNER_TEMP/fill-held/test/resources/fixtures $RUNNER_TEMP/fill-out/test/resources/fixtures $FILL_UNTIL $RUNNER_TEMP/fill-refused.tsv"

    # Whatever the fetch step did: a fill cut short still holds every page it wrote (one file per answer).
    - name: Pack what the fill fetched
      if: always() && steps.gaps.outputs.count > 0
      shell: bash
      run: .github/scripts/convergence-fill.sh pack "$RUNNER_TEMP/fill-out" "fill-upload-source/fill.tar.zst"

    - uses: ./.github/actions/convergence-publish
      if: always() && steps.gaps.outputs.count > 0
      with:
          code:         ${{ inputs.code }}
          token:        ${{ inputs.token }}
          mode:         hermetic
          fill-archive: fill-upload-source/fill.tar.zst
          refused-list: ${{ runner.temp }}/fill-refused.tsv
