# Everything a convergence leg owes the NEXT one: the enrichment tree it just
# recorded, tarred and pushed back to the rolling release it was restored from.
#
# Extracted for the same reason `convergence-setup` was — a drifted copy is silent.
# It is the exact mirror of that action: setup restores the
# tree, this publishes it, and a leg that does one without the other is a leg that
# consumes a shared resource without replenishing it.
#
# That asymmetry is not hypothetical. The sample gate restored the tree and published
# nothing for its whole life, on the reasonable-sounding grounds that a fast gate has
# no business writing to a release. But the tree EXPIRES — `EnrichmentFreshness.Ttl`
# is five days, and `prune` deletes every recorded response older than that before the
# leg reads a byte of it. The only job that refreshed the tree was the full leg, and
# the full leg is `needs: sample`. Germany's sample failed on 2026-08-09; five days
# later its tree pruned to nothing, every one of its ~100 sample films went to live
# HTTP at 1-8 seconds a call, and the leg could no longer finish inside any budget —
# which kept the full leg from running, which kept the tree from being refreshed. Ten
# consecutive red runs, and the one thing that would have broken the loop was the
# gate writing down what it had already paid to fetch. (Recording is now the recorder's
# alone, and every leg runs its sample as the first suite step of the full leg's job, so
# this one publish carries what both recorded — see country-convergence-leg.yml.)
name: Publish a convergence leg's enrichment capture
description: Tar the enrichment tree this leg recorded and replace the country's asset in the rolling release.

inputs:
  code:
    description: The country's two-letter code (pl / de / uk / us / es).
    required: true
  token:
    description: A token that can write this repo's releases.
    required: true
  green:
    description: >-
      'true' when this is a FULL leg whose suite passed — it then records which corpus it
      replayed as the country's last green one.
    required: false
    default: 'false'
  mode:
    description: >-
      `hermetic` publishes no tree — a verdict leg fills nothing, so it has nothing to add and
      must not replace the pair other legs replay. `record` publishes the working tree, and
      pins it as the hermetic pair when `complete`.
    required: false
    default: record
  complete:
    description: >-
      'true' when a RECORDING full leg's suite ran to the end; the tree is then pinned as the
      pair hermetic legs replay — if the log also shows the boot finished.
    required: false
    default: 'false'
  log:
    description: The suite log, read for the boot-complete line.
    required: false
    default: convergence.log
  refetch-list:
    description: >-
      A HERMETIC convergence row's list of the gaps its tree could not answer and a later leg can fetch
      (`MissingFixtures.writeRefetches`) — published for the next leg's rows to fetch before their suites.
      Empty publishes none.
    required: false
    default: ''
  fill-archive:
    description: >-
      A fill's packed fetches (`convergence-fill.sh pack`) — a leg row's pre-suite fill, or the manual
      `Convergence fill` workflow's — published beside the pinned pair for every later hermetic leg to
      replay over it. Empty, or a path with no file, publishes none.
    required: false
    default: ''
  fill-row:
    description: >-
      The leg row that fetched `fill-archive` (its phase), appended to the fill's name so it never meets the
      manual workflow's fills, which leave it empty.
    required: false
    default: ''
  refused-list:
    description: >-
      The gaps `fill-archive`'s fill asked and was refused (`MissingFixtureFill.writeRefused`) — published for the
      next fills to skip for a while (convergence-fill.sh `gaps`). Empty, or a path with no file, publishes none.
    required: false
    default: ''

outputs:
  fill-asset:
    description: The name `fill-archive` was published under; empty when nothing was.
    value: ${{ steps.fill.outputs.asset }}
  recording-healthy:
    description: >-
      A RECORDING's per-origin health (scripts/ci/recording_health.py): 'false' when an origin refused most of
      what it was asked or vanished from the tree, or the tree could not be judged at all; 'true' when none did;
      empty when not judged (a hermetic leg, or this run's start or the last manifest unreadable).
    value: ${{ steps.health.outputs.healthy }}

runs:
  using: composite
  steps:

    # The leg both CONSUMES and EXTENDS the fixture tree: `ArchiveReplayWiring` wraps
    # the live leg in a `RecordingHttpFetch` pointed at the same directory, so whatever
    # wasn't already recorded is on disk by the time the run ends. Publishing here is
    # what closes the loop — a partial capture converges on a complete one over
    # successive runs, with no Mongo cache to write through and no tunnel to dump it
    # back out of.
    #
    # Both writers land on disk PER CALL — `RecordingHttpFetch` writes each response as
    # it arrives, and `EnrichmentCache.remember` writes its verdict through the
    # single-flight lock — so there is no buffer to flush and a killed JVM loses only
    # the fetch that was in flight. That is what makes publishing from a leg that ran
    # out of time worth doing at all.
    #
    # The packing and its cache guard live in a script rather than here, so
    # `EnrichmentTreePackingSpec` can run the real thing against a fabricated tree —
    # including the "nothing recorded yet" case a new country starts in.
    - name: Pack the enrichment fixtures this leg recorded
      if: inputs.mode == 'record'
      shell: bash
      run: |
          .github/scripts/pack-enrichment-tree.sh \
              "test/resources/fixtures/enrichment-${{ inputs.code }}" \
              "enrichment-upload/enrichment-${{ inputs.code }}.tar.zst"

    # Replaces the country's asset IN PLACE, so the release holds one copy per country
    # and never a history — the newest capture is the only one anyone reads, and
    # keeping the rest was pure storage.
    #
    # Called under `always()`, because a leg that failed or was cancelled
    # has usually still enriched most of the corpus, and that capture is exactly what
    # stops the next run repeating the work. Today's two largest captures (301 MB and
    # 434 MB) both came from CANCELLED legs.
    #
    # `create ... || true` because the country legs race to create the release on the
    # very first run and exactly one of them can win; the others find it already there,
    # which is the outcome they wanted anyway.
    #
    # MAIN ONLY. A branch dispatched to verify a fix still packs (so the log shows what
    # it recorded) but never overwrites the tree every main run restores with a capture
    # made by code main has not run. (ConvergencePublishMainOnlySpec)
    - name: Publish the tree to the rolling release
      if: github.ref == 'refs/heads/main' && inputs.mode == 'record'
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          CODE:     ${{ inputs.code }}
          COMPLETE: ${{ inputs.complete }}
          LOG:      ${{ inputs.log }}
      # FIXTURE_RELEASE_TAG comes from the calling workflow's `env`, exported into every step's shell.
      run: .github/scripts/convergence-publish.sh tree "$CODE" "$COMPLETE" "$LOG"

    # WHICH ORIGINS REFUSED THIS RECORDING. From 2026-10-07 to 10-13 Cineworld's API answered 403 to every
    # detail read every recording made (~350 a run: the recorder had no residential-proxy fallback until
    # f20a6b5dd), and every recording went green — the first thing to fail was an identity capture six days
    # later. Per origin (the URL's host; no host lists), the share of what this recording asked that came back
    # refused — 403 / 429 / 5xx / timeouts; a 404 is an answer — and whether an origin the last green recording
    # held responses from now holds none. The leg fails on it, after every publish ("Fail the leg on the
    # recording's health"), so a refusing night still saves the tree the next recording resumes from.
    #
    # The baseline is the last HEALTHY recording's manifest, `recording-health-<code>.json`, which only a healthy
    # recording on main replaces (the step below); with none yet, the absolute floor alone applies.
    - name: Judge this recording's per-origin health
      id: health
      if: inputs.mode == 'record'
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          CODE: ${{ inputs.code }}
      run: |
          set -uo pipefail
          # The attempt's start: a restored file keeps its archived, older mtime; one this run recorded is newer.
          since="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)" \
              || { echo "::warning::cannot read this run's start time — recording health not judged"; exit 0; }
          manifest="recording-health-$CODE.json"
          previous="$RUNNER_TEMP/previous-$manifest"
          present=$(scripts/ci/gh-optional.sh release download "$FIXTURE_RELEASE_TAG" --pattern "$manifest" --output "$previous" --clobber) \
              || { echo "::warning::cannot read $manifest — recording health not judged"; exit 0; }
          [ "$present" = present ] || echo "no $manifest on $FIXTURE_RELEASE_TAG yet — judged against the absolute floor alone"
          # `|| verdict=$?`: the step's shell is `bash -e`, which would end it on the verdict before it is recorded.
          verdict=0
          python3 scripts/ci/recording_health.py "test/resources/fixtures/enrichment-$CODE" --since "$since" \
              --previous "$previous" --write "$manifest" --summary "$GITHUB_STEP_SUMMARY" --title "$CODE" || verdict=$?
          # 2: it could not judge the tree (unreadable, or holding nothing) — no verdict, never a healthy one: failed as unjudged.
          [ "$verdict" -gt 1 ] && echo "::error::recording_health.py could not judge $CODE's recording ($verdict) — failing it unjudged"
          echo "healthy=$([ "$verdict" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Publish this healthy recording's manifest as the next one's baseline
      if: github.ref == 'refs/heads/main' && inputs.mode == 'record' && steps.health.outputs.healthy == 'true'
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          scripts/ci/gh-release.sh upload "$FIXTURE_RELEASE_TAG" "recording-health-${{ inputs.code }}.json" --clobber \
              || echo "::warning::could not publish the manifest — the next recording compares against an older one"

    # WHAT A HERMETIC LEG FOUND MISSING, AND WHAT A FILL FETCHED — the two halves of "every convergence
    # build publishes the missing data it found" (docs/design/convergence-fixture-fill.md).
    #
    # The suite's refetch list goes up for the NEXT leg's convergence row, which fetches it within ~90 s
    # before its suite, publishes what it got as a fill of the pinned pair, and replays it; every hermetic
    # leg after that replays the pinned tree with the pair's fills laid over it (`convergence-setup`). Never
    # the tree, never the pin: the pinned pair stays the recorder's to replace.
    #
    # NEW NAMES, never `--clobber`: `<kind>-<code>-<corpus run>-<this run>-<this attempt>[-<row>]`, so no
    # reader meets an asset mid-replacement, the five countries' rows, publishing side by side, never write
    # one name, and a re-run of a failed job never meets its first attempt's ("already exists").
    # Main only, like every write here (ConvergencePublishMainOnlySpec): a branch's gaps and fetches are a
    # branch's.
    - name: Publish the gaps this leg's tree could not answer
      if: github.ref == 'refs/heads/main' && inputs.mode == 'hermetic' && inputs.refetch-list != '' && env.KINOWO_CONVERGENCE_PIN_CORPUS_RUN != ''
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          LIST: ${{ inputs.refetch-list }}
      run: |
          set -uo pipefail
          [ -f "$LIST" ] || { echo "no $LIST — the suite never reached its end"; exit 0; }
          code="${{ inputs.code }}"
          named="refetch-$code-$KINOWO_CONVERGENCE_PIN_CORPUS_RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tsv"
          mkdir -p refetch-upload && cp "$LIST" "refetch-upload/$named"
          echo "$(grep -c "$(printf '\t')" "$LIST" || true) fetchable gap(s) for the next leg's fill"
          scripts/ci/gh-release.sh upload "$FIXTURE_RELEASE_TAG" "refetch-upload/$named" || { echo "::warning::could not publish $named — the next leg's fill reads the list before it"; exit 0; }
          # Only the newest is read (convergence-fill.sh gaps); the one before it may be mid-read.
          # allow-silenced: pruning old lists is housekeeping; one that fails to delete is pruned next time.
          gh release view "$FIXTURE_RELEASE_TAG" --json assets \
                  --jq ".assets[].name | select(test(\"^refetch-$code-$KINOWO_CONVERGENCE_PIN_CORPUS_RUN-[0-9]+(-[0-9]+)?\\\\.tsv$\"))" \
              | LC_ALL=C sort -t- -k4,4n -k5,5n | head -n -2 \
              | while read -r stale; do scripts/ci/gh-release.sh delete-asset "$FIXTURE_RELEASE_TAG" "$stale" -y || true; done

    # What a fill asked and was refused, for the next fills to skip (convergence-fill.sh `gaps` reads the newest
    # four): an origin refusing CI for good is then asked once every few fills through paid egress, not every run.
    - name: Publish the gaps this leg's fill was refused
      if: github.ref == 'refs/heads/main' && inputs.mode == 'hermetic' && inputs.refused-list != '' && env.KINOWO_CONVERGENCE_PIN_CORPUS_RUN != ''
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          LIST: ${{ inputs.refused-list }}
      run: |
          set -uo pipefail
          [ -f "$LIST" ] || { echo "no $LIST — the fill asked nothing"; exit 0; }
          code="${{ inputs.code }}"
          named="refused-$code-$KINOWO_CONVERGENCE_PIN_CORPUS_RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tsv"
          mkdir -p refused-upload && cp "$LIST" "refused-upload/$named"
          scripts/ci/gh-release.sh upload "$FIXTURE_RELEASE_TAG" "refused-upload/$named" || { echo "::warning::could not publish $named — the next fill asks its gaps again"; exit 0; }
          # allow-silenced: pruning old lists is housekeeping; one that fails to delete is pruned next time.
          gh release view "$FIXTURE_RELEASE_TAG" --json assets \
                  --jq ".assets[].name | select(test(\"^refused-$code-$KINOWO_CONVERGENCE_PIN_CORPUS_RUN-[0-9]+(-[0-9]+)?\\\\.tsv$\"))" \
              | LC_ALL=C sort -t- -k4,4n -k5,5n | head -n -5 \
              | while read -r stale; do scripts/ci/gh-release.sh delete-asset "$FIXTURE_RELEASE_TAG" "$stale" -y || true; done

    # Names what it published in `fill-asset`: the leg's convergence row lays its fill over its tree only once this
    # names it (on main), and its bisect request carries it in the pair — so the bisect replays exactly the tree
    # that decided the verdict.
    - name: Publish what this leg's fill fetched
      id: fill
      if: github.ref == 'refs/heads/main' && inputs.mode == 'hermetic' && inputs.fill-archive != '' && env.KINOWO_CONVERGENCE_PIN_CORPUS_RUN != ''
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          ARCHIVE: ${{ inputs.fill-archive }}
          ROW: ${{ inputs.fill-row }}
      run: |
          set -uo pipefail
          [ -f "$ARCHIVE" ] || { echo "the fill fetched nothing — nothing to publish"; exit 0; }
          named="fill-${{ inputs.code }}-$KINOWO_CONVERGENCE_PIN_CORPUS_RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${ROW:+-$ROW}.tar.zst"
          mkdir -p fill-upload && ln -f "$ARCHIVE" "fill-upload/$named"
          scripts/ci/gh-release.sh upload "$FIXTURE_RELEASE_TAG" "fill-upload/$named" || { echo "::warning::could not publish $named — the next fill fetches its pages again"; exit 0; }
          echo "asset=$named" >> "$GITHUB_OUTPUT"
          echo "published $named over pair $KINOWO_CONVERGENCE_PIN_CORPUS_RUN"

    # Which corpus this GREEN full leg replayed, as `corpus-green-<code>.txt` beside the
    # tree — `convergence-setup` reads it back so the next leg can diff its corpus against
    # the last one the pipeline converged on (`CorpusProvenance`). Main only, like the
    # tree: a branch run's green says nothing about main.
    - name: Record the corpus this green leg replayed
      if: github.ref == 'refs/heads/main' && inputs.green == 'true' && env.KINOWO_CONVERGENCE_CORPUS_RUN != ''
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          marker="corpus-green-${{ inputs.code }}.txt"
          echo "$KINOWO_CONVERGENCE_CORPUS_RUN $KINOWO_CONVERGENCE_CORPUS_RECORDED_AT" > "$marker"
          scripts/ci/gh-release.sh upload "$FIXTURE_RELEASE_TAG" "$marker" --clobber

    # THE HERMETIC PAIR — what every verdict leg replays, and the reason a verdict no longer
    # depends on the network.
    #
    # Pinned only by a RECORDING full leg whose boot finished: by then every request the
    # corpus makes has been answered live and recorded, or failed and been remembered as the
    # failure it was (`EnrichmentCache.Transients.Recorded`), so a hermetic replay of this
    # corpus asks the tree nothing it cannot answer. A leg that ran out of time before that
    # leaves the previous pin alone — a hermetic leg must never replay a half-recorded pair.
    #
    # A COPY under a name carrying the corpus run, never the working asset: the recorder
    # keeps extending `enrichment-<code>.tar.zst` (a leg that ran out of time publishes it
    # half-recorded), and a hermetic leg reading that mid-recording would replay a
    # tree the other half of its pair was never recorded into. The pin is written LAST, so a
    # reader sees either the old pair or the new one, and the previous pair's tree is kept
    # so a leg (or a bisect) that read the old pin a moment ago can still download it.
    #
    # The pinned tree itself went up beside the working one in "Publish the tree", which
    # decided — boot complete in the log, a packed archive — and named it in
    # KINOWO_PINNED_TREE; this step writes the marker that makes it the pair, and prunes.
    - name: Pin this recording as the pair hermetic legs replay
      if: github.ref == 'refs/heads/main' && inputs.mode == 'record' && inputs.complete == 'true' && env.KINOWO_CONVERGENCE_CORPUS_RUN != ''
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          CODE:     ${{ inputs.code }}
      run: .github/scripts/convergence-publish.sh pin "$CODE"
