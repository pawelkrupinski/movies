# Everything a convergence leg needs BEFORE it can run a spec: a real database, the
# recorded corpus and its production baseline, the enrichment tree, and a warm sbt.
#
# Extracted because more than one job needs all of it — every row of a country's leg
# (whose sample and full suite share this one setup) and the bisect replaying a red leg's
# sample — and the setup is not incidental: it is ~180 lines of hard-won detail about
# which storage survives (artifacts and a rolling release, never the actions cache, which
# evicts silently at this repo's 9.46 GB), and duplicating it would guarantee the copies
# drift. A drifted copy is worse than no gate: the bisect's sample would pass on inputs
# the leg never saw.
name: Convergence leg setup
description: MongoDB, recorded fixtures and a warm sbt for a country's convergence leg.

inputs:
  code:
    description: The country's two-letter code (pl / de / uk / us / es).
    required: true
  token:
    description: A token that can read this repo's runs and releases.
    required: true
  mode:
    description: "`hermetic` restores the PINNED recorded pair; `overlay` that pair plus the identity model's overlay; `record` the newest corpus and the working tree."
    required: false
    default: hermetic
  corpus-run:
    description: The `Record scrape fixtures` run whose corpus to restore (a recording leg's own recorder run).
    required: false
    default: ''
  hermetic-pair:
    description: >-
      `<corpus run> <recorded at> <tree asset>` — a pair a red leg already resolved, so the
      bisect replays the same one it did. Empty resolves the pinned pair afresh.
    required: false
    default: ''

outputs:
  hermetic-pair:
    description: The recorded pair this job restored (hermetic mode), for the steps after it.
    value: ${{ steps.pair.outputs.pair }}

runs:
  using: composite
  steps:

    # A real database under the assertions, because the suite spent its whole
    # life claiming a pipeline fixpoint with every repository faked out. Nothing
    # in those runs could have caught a BSON codec that drops a field, a
    # `findAll` that recurses the async driver into a StackOverflowError once a
    # collection grows, a required DTO field that fails a whole batch's decode,
    # or a staging fold that needs a real transaction — all of which this
    # repository has actually shipped.
    #
    # A CONTAINER, emphatically not a tunnel. The `flyctl proxy` to a production
    # cluster is what cancelled three legs at the 75-minute ceiling and hung a
    # preload past its 120-second budget; this is on localhost, needs no
    # credential, holds nothing anyone would miss, and dies with the runner.
    #
    # Single-node REPLICA SET rather than standalone: change streams (the
    # read-model projector) and multi-document transactions (the staging fold)
    # are both rejected by a standalone mongod, and both are on the path.
    #
    # `--wiredTigerCacheSizeGB` because mongod's DEFAULT is half of (RAM - 1GB),
    # which on a 16 GB `ubuntu-latest` runner is ~7.5 GB — sized for a host it owns,
    # and this one it shares with a JVM holding a whole country resident. The two
    # defaults together ask for more than the box has, which is why the heaviest
    # leg's `-Xmx` could not be raised without capping this first. 2 GB is ample:
    # the databases here live for one job and are read back through a driver, not
    # served to anyone.
    #
    # And for the same reason a majority write is acknowledged once applied, not once synced
    # to the journal (MONGO_MAJORITY_JOURNAL, see the script): every write the app makes is
    # `w: majority`, and a disk sync each — most of a US take-up's 160,000 store writes — buys
    # durability for a database that dies with the runner.
    # IN THE BACKGROUND: pulling the image, booting mongod and electing the one-node replica set is
    # ~20 s of waiting that nothing before the suite needs — the JDK, the caches and the fixture unpack
    # below run meanwhile, and the last step of this action waits for it (and fails as it would have),
    # both through scripts/ci/in-background.sh.
    - name: Start MongoDB (single-node replica set, for change streams)
      shell: bash
      env:
          MONGO_MAJORITY_JOURNAL: 'false'
      run: '"$GITHUB_WORKSPACE"/scripts/ci/in-background.sh start mongo-start "$GITHUB_WORKSPACE"/scripts/ci/start-mongo-replset.sh --wiredTigerCacheSizeGB 2'

    # A RECORDING leg's tunnel to prod Mongo relays through `socat`, which the runner image lacks:
    # an `apt-get update` and install that took 9-17 s of every recording's critical path inside
    # the tunnel step (run 37105119296). It needs no secret and nothing from the steps below, so
    # it runs beside them, and wait-for-mongo-tunnel.sh waits for whatever is left of it (and
    # installs it itself if this never ran or failed).
    - name: Install socat for the prod-Mongo tunnel, in the background
      if: inputs.mode == 'record'
      shell: bash
      run: |
          "$GITHUB_WORKSPACE"/scripts/ci/drop-microsoft-apt-sources.sh
          "$GITHUB_WORKSPACE"/scripts/ci/in-background.sh start socat-install "$GITHUB_WORKSPACE"/scripts/ci/install-apt-package.sh socat

    # WHICH recording to replay, decided once and before anything is downloaded.
    #
    # A HERMETIC leg replays a PAIR: a corpus and the enrichment tree recorded against it,
    # pinned together by the recording leg that completed the boot over that corpus
    # (`convergence-publish`) as `hermetic-<code>.txt` → `<corpus run> <recorded at> <tree
    # asset>`. The two only mean anything together — a newer corpus beside an older tree is a
    # set of requests nobody recorded, which a hermetic leg would (correctly) refuse. No pin
    # yet is a hard failure, never a quiet fall-back to live filling: the fix is one dispatch
    # of `Record scrape fixtures`, and the message says so.
    #
    # A RECORDING leg takes the corpus it is given (its own recorder run) or the newest, and
    # the working tree — the one it extends.
    - name: Resolve the recorded pair to replay
      id: pair
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
          MODE: ${{ inputs.mode }}
          GIVEN: ${{ inputs.hermetic-pair }}
          CORPUS_RUN: ${{ inputs.corpus-run }}
      run: |
          set -uo pipefail
          if [ "$MODE" = "record" ]; then
              [ -n "$CORPUS_RUN" ] && echo "KINOWO_CONVERGENCE_PIN_CORPUS_RUN=$CORPUS_RUN" >> "$GITHUB_ENV"
              # A glob: the working tree is `.tar.zst` since it moved off gzip, `.tar.gz` until a
              # country's first zstd publish replaces (and deletes) it.
              echo "KINOWO_CONVERGENCE_TREE_ASSET=enrichment-${{ inputs.code }}.tar.*" >> "$GITHUB_ENV"
              echo "recording leg: corpus ${CORPUS_RUN:-newest}, working tree enrichment-${{ inputs.code }}.tar.*"
              exit 0
          fi
          pair="$GIVEN"
          if [ -z "$pair" ]; then
              marker="hermetic-${{ inputs.code }}.txt"
              if gh release download "$FIXTURE_RELEASE_TAG" --pattern "$marker" --dir hermetic-marker --clobber 2>/dev/null; then
                  pair=$(head -1 "hermetic-marker/$marker")
              fi
          fi
          read -r corpus recorded tree <<< "$pair"
          if [ -z "${tree:-}" ]; then
              echo "::error::No recorded pair pinned for ${{ inputs.code }} (release asset hermetic-${{ inputs.code }}.txt) — a hermetic leg replays nothing else. Record one: gh workflow run \"Record scrape fixtures\" --ref main"
              exit 1
          fi
          echo "hermetic leg: corpus from recording run $corpus ($recorded), tree $tree"
          echo "KINOWO_CONVERGENCE_PIN_CORPUS_RUN=$corpus" >> "$GITHUB_ENV"
          echo "KINOWO_CONVERGENCE_TREE_ASSET=$tree" >> "$GITHUB_ENV"
          echo "pair=$pair" >> "$GITHUB_OUTPUT"

    # The enrichment tree, fetched and unpacked in the BACKGROUND from here on — beside the
    # JDK, sbt and build-cache restores below, which it shares nothing with — into a stage
    # OUTSIDE the workspace, so their workspace globs never walk it; "Unpack whichever fixtures
    # are present" waits for it and moves it in. 13-19 s of every leg's setup, queued behind
    # those restores until 2026-10-03 (run 37105119296). See restore-enrichment-tree.sh.
    #
    # The tree lives in a ROLLING RELEASE, one asset per country, overwritten in place. Three
    # storage options, and only one of them fits. The actions CACHE is out on space: this repo
    # already sits at 9.46 GB of a 10 GB ceiling, so these tarballs were evicted the moment
    # they were written — with `actions/cache/save` still reporting success, because a save
    # succeeding says nothing about whether the entry SURVIVES — and forcing them through that
    # ceiling evicts the sbt caches every job depends on. MONGO has the space but is only
    # reachable over a tunnel, the component that has broken more runs than everything else
    # combined. ARTIFACTS work, and are what this used to use, but they are per-run: every
    # country at 84-434 MB every deploy, when the only copy anyone reads is the newest. A
    # release asset is 2 GB per file, outside the Actions storage quota, comes off the CDN with
    # no tunnel in the path, and `--clobber` replaces it in place.
    - name: Fetch the enrichment tree in the background
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_WORKSPACE"/scripts/ci/in-background.sh start tree-restore "$GITHUB_WORKSPACE"/.github/scripts/restore-enrichment-tree.sh "${{ inputs.code }}" "${{ inputs.mode }}" "$RUNNER_TEMP/tree-stage"'

    # The JDK, sbt and the build cache BEFORE any fixture is restored: each keys its cache by
    # globbing the workspace (setup-java's `**/*.sbt`, the build cache's `**/src/...`), and a
    # restored enrichment tree is up to 127k files that every such glob walks for nothing —
    # ~50 s of the United States' setup.
    - uses: ./.github/actions/setup-jdk
      with:
          distribution: temurin
          java-version: 27
          cache: sbt
    # sbt 1.x keeps no sbt-2 disk cache: the step restored nothing and saved nothing, at ~30 s a
    # leg in its key's workspace glob.
    - uses: sbt/setup-sbt@v1
      with:
          disk-cache: false

    # The key is hashed HERE, in a step of its own: the runner re-evaluates a cache step's
    # inputs for its post-job save, and by then the restored fixture trees put 127k files
    # (US) under the `**` globs — 17 s to restore and 21 s to save, hashing sources that
    # tree holds none of. And off git's index rather than `hashFiles`: the same sources' content
    # (a blob's id is its content's hash), read from the index instead of by walking and reading
    # the workspace — which still cost 8.8 s of the US recording's setup with the tree staged
    # elsewhere (run 37111868620).
    - name: Key the sbt build cache
      id: sbt-key
      shell: bash
      run: |
          sources=$(git ls-files -s -- build.sbt project/build.properties project/plugins.sbt \
              ':(glob)**/src/main/**/*.scala' ':(glob)**/src/test/**/*.scala' ':(glob)**/src/fixtures/**/*.scala' | sha256sum)
          echo "key=sbt-target-convergence-${{ runner.os }}-${sources%% *}" >> "$GITHUB_OUTPUT"
    # NOT the root `target/`: every module writes its JUnit XML into the one root-level
    # `target/test-reports/unit/` (`unitReportSettings` in build.sbt), and the restore-keys
    # fall through to the key `ci.yml`'s unit job saves. Cached, it handed a leg a report
    # directory full of specs it never ran — the United States' leg died on an OOM before
    # ScalaTest reported a result on 2026-09-01, and its check-run went green naming
    # `CinemaScraperCatalogSpec`. The module classes are all that is worth carrying.
    # (SbtCachePathsSpec, ConvergenceLegWiringSpec)
    - uses: actions/cache@v5
      with:
          path: |
              project/target
              !project/target/active.json
              project/project/target
              */target/scala-*
              !*/target/scala-*/*.jar
          key: ${{ steps.sbt-key.outputs.key }}
          restore-keys: |
              sbt-target-convergence-${{ runner.os }}-
              sbt-target-e2e-${{ runner.os }}-
              sbt-target-${{ runner.os }}-

    # The scrape corpus, from the ARTIFACT of a `Record scrape fixtures` run (the
    # pinned one, else the newest) — not from the actions cache it also writes.
    #
    # The cache silently loses it. This repo sits at ~9.46 GB of a 10 GB ceiling,
    # so entries are evicted by LRU with no signal: a leg logs `Cache not found
    # for input keys: scrape-fixtures-uk-` and carries on. Poland and Germany
    # never noticed because their corpora are committed to the repository; the
    # UK's is not, so it depended entirely on the evictable copy — and when that
    # vanished the leg fell back to a generated corpus and reported `tmdbId 0`,
    # which cost eleven runs and a wrong diagnosis to trace.
    #
    # Same lesson as the enrichment trees a few steps below: an artifact has its
    # own retention and cannot be evicted to make room for a build cache.
    - name: Restore the recorded scrape corpus
      shell: bash
      # A recording leg falls through to bootstrapping; a replay leg's missing pin ENDS the leg.
      continue-on-error: ${{ inputs.mode == 'record' }}
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          mkdir -p scrape-archive
          pinned="${KINOWO_CONVERGENCE_PIN_CORPUS_RUN:-}"
          # A recording leg's own run: the leg records the corpus itself, in a step after this
          # action ("Record <country>'s corpus" in country-convergence-leg.yml), so there is
          # nothing to download — only the provenance to name.
          if [ -n "$pinned" ] && [ "$pinned" = "${{ github.run_id }}" ]; then
              echo "scrape corpus recorded by this job, in recorder run $pinned"
              echo "KINOWO_CONVERGENCE_CORPUS_RUN=$pinned" >> "$GITHUB_ENV"
              echo "KINOWO_CONVERGENCE_CORPUS_RECORDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
              exit 0
          fi
          if [ -n "$pinned" ]; then
              if gh run download "$pinned" --name "scrape-fixtures-${{ inputs.code }}" --dir scrape-archive 2>/dev/null; then
                  recorded=$(gh run view "$pinned" --json createdAt --jq .createdAt 2>/dev/null || echo unknown)
                  echo "scrape corpus from PINNED recording run $pinned ($recorded)"
                  echo "KINOWO_CONVERGENCE_CORPUS_RUN=$pinned" >> "$GITHUB_ENV"
                  echo "KINOWO_CONVERGENCE_CORPUS_RECORDED_AT=$recorded" >> "$GITHUB_ENV"
                  ls -l scrape-archive/
              else
                  echo "::error::recording run $pinned's corpus is no longer downloadable — the pinned pair has expired; re-run Record scrape fixtures"
                  exit 1
              fi
              exit 0
          fi
          # `id recordedAt` per line; the pair is exported so the spec can say WHICH
          # corpus it replayed (`CorpusProvenance`) and a green leg can record it.
          while read -r run recorded; do
              if gh run download "$run" --name "scrape-fixtures-${{ inputs.code }}" \
                 --dir scrape-archive 2>/dev/null; then
                  echo "scrape corpus from recording run $run ($recorded)"
                  echo "KINOWO_CONVERGENCE_CORPUS_RUN=$run" >> "$GITHUB_ENV"
                  echo "KINOWO_CONVERGENCE_CORPUS_RECORDED_AT=$recorded" >> "$GITHUB_ENV"
                  ls -l scrape-archive/
                  exit 0
              fi
          done < <(gh run list --workflow "Record scrape fixtures" --status success \
                       --limit 10 --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"' 2>/dev/null)
          echo "no recorded scrape corpus for ${{ inputs.code }} — the leg will fail and say so"

    # The corpus this country's last GREEN full leg replayed — recorded by that leg as
    # `corpus-green-<code>.txt` in the fixture release — and, when today's differs, that
    # corpus itself, unpacked aside so the spec can diff the two (`CorpusProvenance`).
    # A red leg on a changed corpus then says so in its failure message instead of
    # sending the next person bisecting commits for a data change. Never fails the leg:
    # no marker yet, or an expired artifact, only makes the verdict less specific.
    - name: Restore the last green leg's corpus for the provenance diff
      shell: bash
      continue-on-error: true
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          marker="corpus-green-${{ inputs.code }}.txt"
          gh release download "$FIXTURE_RELEASE_TAG" --pattern "$marker" --dir green-marker --clobber 2>/dev/null \
              || { echo "no $marker yet — no last-green corpus to compare against"; exit 0; }
          read -r green recorded < "green-marker/$marker"
          echo "last green ${{ inputs.code }} leg replayed recording run $green ($recorded)"
          echo "KINOWO_CONVERGENCE_GREEN_CORPUS_RUN=$green" >> "$GITHUB_ENV"
          echo "KINOWO_CONVERGENCE_GREEN_CORPUS_RECORDED_AT=$recorded" >> "$GITHUB_ENV"
          [ "$green" = "${KINOWO_CONVERGENCE_CORPUS_RUN:-}" ] && { echo "same corpus as today"; exit 0; }
          if gh run download "$green" --name "scrape-fixtures-${{ inputs.code }}" --dir green-archive 2>/dev/null; then
              mkdir -p green-corpus
              tar -xzf "green-archive/scrapes-${{ inputs.code }}.tar.gz" -C green-corpus
              echo "KINOWO_CONVERGENCE_GREEN_CORPUS_DIR=$PWD/green-corpus/test/resources/fixtures/corpus" >> "$GITHUB_ENV"
          else
              echo "recording run $green's corpus is no longer downloadable — no diff"
          fi

    - name: Unpack whichever fixtures are present
      shell: bash
      env:
          MODE: ${{ inputs.mode }}
      run: |
          set -euo pipefail
          # The enrichment tree, fetched and unpacked in the background since the top of this
          # action ("Fetch the enrichment tree in the background"). A replay leg's missing pin
          # (exit 3) ends the leg; a recording falls through to fetching live.
          tree_status=0
          "$GITHUB_WORKSPACE"/scripts/ci/in-background.sh wait tree-restore 900 || tree_status=$?
          if [ "$tree_status" -ne 0 ] && ! { [ "$tree_status" -eq 3 ] && [ "$MODE" = "record" ]; }; then
              exit "$tree_status"
          fi
          # Moved in by rename (same filesystem), entry by entry; a directory already present is
          # merged into rather than replaced.
          stage="$RUNNER_TEMP/tree-stage/test/resources/fixtures"
          mkdir -p test/resources/fixtures
          for entry in "$stage"/* "$stage"/.[!.]*; do
              [ -e "$entry" ] || continue
              target="test/resources/fixtures/$(basename "$entry")"
              if [ -e "$target" ]; then cp -a "$entry/." "$target/"; else mv "$entry" "$target"; fi
          done
          # The scrape corpus, by its magic (`unpack-fixture-archive.sh`), as the tree was.
          archive="scrape-archive/scrapes-${{ inputs.code }}.tar.gz"
          if [ -f "$archive" ]; then
              "$GITHUB_WORKSPACE/.github/scripts/unpack-fixture-archive.sh" "$archive"
              echo "restored $archive ($(du -h "$archive" | cut -f1))"
          else
              echo "no $archive — this leg fetches live for it and the recorder captures it next"
          fi
          # `|| true` and a subshell: a MISSING fixture directory is the normal
          # fallback path, not an error — the leg then fetches live and the
          # recorder captures it next. Without this, `find` exiting non-zero on
          # an absent path tripped `set -euo pipefail` and failed the whole leg
          # AFTER printing the count, which is how three legs died 40 seconds in
          # with both restores reporting success.
          available=$( { find test/resources/fixtures/corpus \
                              "test/resources/fixtures/enrichment-${{ inputs.code }}" \
                              -type f 2>/dev/null || true; } | wc -l )
          echo "fixture files available: $available"

          # Count the REMEMBERED-ANSWER cache separately from the recorded
          # responses, because they fail independently and only one of them is
          # visible in the file count above.
          #
          # The tree records what a fetch RETURNED. Half a country's films never
          # resolve and still cost three or four rating-slug guesses that 404,
          # and a 404 returns nothing to record — so those verdicts live only in
          # `.enrichment-cache`, and a leg that arrives without it re-asks every
          # one of them live and rate-paced. That is a 22-minute Poland leg
          # versus a 12-minute one, and the ONLY symptom is the clock: nothing
          # errors, coverage is identical, and the run still passes. Printing the
          # entry count on both sides of the artifact hop is what makes the
          # difference between "warm" and "silently cold" legible in the log.
          cache="test/resources/fixtures/enrichment-${{ inputs.code }}/.enrichment-cache"
          remembered=$( { find "$cache" -name '*.entry' 2>/dev/null || true; } | wc -l )
          if [ "$remembered" -gt 0 ]; then
              echo "remembered enrichment answers restored: $remembered"
          else
              echo "NO remembered-answer cache in the artifact — this leg re-asks every"
              echo "unresolved film's rating slugs live, and publishes the cache it builds."
          fi

    # An OVERLAY leg (`Identity model convergence`) replays the pinned pair plus the model's own
    # enrichment — recorded by earlier overlay legs over THIS pair, published as
    # `identity-overlay-<code>-<corpus run>.tar.gz` — and records what it still lacks on top. The
    # stamp dates the replay: every file the run then writes is newer, which is what the
    # overlay publish packs (see convergence-overlay-publish).
    - name: Unpack the identity model's overlay
      if: inputs.mode == 'overlay'
      shell: bash
      env:
          GH_TOKEN: ${{ inputs.token }}
      run: |
          set -uo pipefail
          overlay="identity-overlay-${{ inputs.code }}-${KINOWO_CONVERGENCE_PIN_CORPUS_RUN}.tar.gz"
          mkdir -p overlay-archive
          : > "$RUNNER_TEMP/overlay-files.txt"
          if gh release download "$FIXTURE_RELEASE_TAG" --pattern "$overlay" --dir overlay-archive --clobber 2>/dev/null; then
              tar -xzf "overlay-archive/$overlay"
              tar -tzf "overlay-archive/$overlay" | grep -v '/$' > "$RUNNER_TEMP/overlay-files.txt" || true
              echo "restored $overlay ($(wc -l < "$RUNNER_TEMP/overlay-files.txt") files)"
          else
              # A new recording starts with no overlay of its own; without one, every question only the
              # model asks went live again after each recording (Wikidata rate-limiting a Poland leg for
              # over 1,000 s). Carry the newest earlier overlay forward: its answers fill only what the
              # new tree lacks (an existing file is never replaced), and its remembered verdicts stay
              # behind, so a past 429 or timeout is asked again rather than replayed (carry-overlay.sh).
              previous=$(gh release view "$FIXTURE_RELEASE_TAG" --json assets \
                  --jq '.assets[].name' 2>/dev/null \
                  | grep -E "^identity-overlay-${{ inputs.code }}-[0-9]+\.tar\.gz$" | sort -t- -k4 -n | tail -1 || true)
              if [ -n "$previous" ] && gh release download "$FIXTURE_RELEASE_TAG" --pattern "$previous" --dir overlay-archive --clobber 2>/dev/null; then
                  echo "no $overlay yet"
                  .github/scripts/carry-overlay.sh "overlay-archive/$previous" "$RUNNER_TEMP/overlay-files.txt"
              else
                  echo "no $overlay yet — this leg fills the model's gaps live and publishes the first"
              fi
          fi
          echo "KINOWO_CONVERGENCE_OVERLAY_ASSET=$overlay" >> "$GITHUB_ENV"
          sleep 1; touch "$RUNNER_TEMP/overlay-stamp"

    - name: Wait for MongoDB, started in the background above
      shell: bash
      run: '"$GITHUB_WORKSPACE"/scripts/ci/in-background.sh wait mongo-start 240'
