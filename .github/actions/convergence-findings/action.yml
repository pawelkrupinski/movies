#
# The findings of one convergence run, on the run's summary page.
#
# ScalaTest's `info(...)` lines carry everything worth knowing about a leg —
# enrichment coverage down the whole ladder, cache hits versus live fills, cinemas and
# screenings in versus out, per-tick change-stream emissions — and they were reachable
# only by downloading a 5 MB job log and grepping it. Rendered here they are the first
# thing on the page, for a passing run as much as a failing one.
#
# A composite action rather than a copy per job: the leg runs the suite from two matrix
# rows now (the full leg and, for a country whose corpus has outgrown one, the
# order-independence replay), and both want the same report. The filter lives in
# .github/scripts/convergence-findings-summary.sh, tested beside it: it is the part
# that must not drift.
#
name: Convergence findings
description: Render one convergence run's ScalaTest narration and phase timings onto the job summary.

inputs:
    title:
        description: The heading, e.g. `convergence (united-states)`.
        required: true
    log:
        description: The tee'd suite log to read.
        required: false
        default: convergence.log
    name:
        description: >-
            Suffix of the `convergence-diagnostics-<name>` artifact this job's diagnostics upload as, unique per job
            (`<code>-<phase>`).
        required: true

runs:
    using: composite
    steps:
        - shell: bash
          env:
              TITLE: ${{ inputs.title }}
              LOG:   ${{ inputs.log }}
          run: '"$GITHUB_WORKSPACE"/.github/scripts/convergence-findings-summary.sh "$TITLE" "$LOG" >> "$GITHUB_STEP_SUMMARY"'

        # What the suite wrote for a reader beyond its log (`tools.ConvergenceDiagnostics`): the per-film
        # account of a coverage band against production, an order replay's differing films. Each `.md` is the
        # short account, onto the summary page; the full lists go up as an artifact whose name the log prints.
        - shell: bash
          run: |
              set -uo pipefail
              dir=target/convergence-diagnostics
              [ -d "$dir" ] || { echo "no convergence diagnostics written"; exit 0; }
              for summary in "$dir"/*.md; do
                  if [ -e "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
              done
              echo "convergence diagnostics: $(ls "$dir" | tr '\n' ' ')— uploaded as artifact convergence-diagnostics-${{ inputs.name }}"
              echo "Full lists: artifact \`convergence-diagnostics-${{ inputs.name }}\`." >> "$GITHUB_STEP_SUMMARY"
        - uses: actions/upload-artifact@v6
          with:
              name: convergence-diagnostics-${{ inputs.name }}
              path: target/convergence-diagnostics/
              if-no-files-found: ignore
              retention-days: 14
