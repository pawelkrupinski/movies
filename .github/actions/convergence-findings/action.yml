#
# The findings of one convergence run, on the run's summary page.
#
# ScalaTest's `info(...)` lines carry everything worth knowing about a leg —
# enrichment coverage down the whole ladder, cache hits versus live fills, cinemas and
# screenings in versus out, per-tick change-stream emissions — and they were reachable
# only by downloading a 5 MB job log and grepping it. Rendered here they are the first
# thing on the page, for a passing run as much as a failing one.
#
# A composite action rather than a copy per job: the leg runs the suite from two jobs
# now (the full leg and, for a country whose corpus has outgrown one, the
# order-independence replay), and both want the same report. The `grep` below is the
# part that must not drift — it is a list of what counts as narration versus
# application logging, and a copy that fell behind would silently stop rendering the
# phase timings that are the only way to diagnose a leg while it is still running.
#
name: Convergence findings
description: Render one convergence run's ScalaTest narration and phase timings onto the job summary.

inputs:
    title:
        description: The heading, e.g. `convergence (united-states)`.
        required: true
    log:
        description: The tee'd suite log to read.
        required: false
        default: convergence.log

runs:
    using: composite
    steps:
        - shell: bash
          run: |
              set -uo pipefail
              if [ ! -s "${{ inputs.log }}" ]; then
                  echo "### ${{ inputs.title }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "The suite produced no output — see the job log." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
              # sbt colours its output; the escapes are noise in markdown.
              # `|| true` on every grep. The step declares `shell: bash`, which runs
              # with `-e`, and grep exits 1 when it matches NOTHING — so a run with no
              # `Tests:` line killed this step before it printed a character. That is
              # precisely the cancelled-or-crashed run whose partial output the report
              # exists to salvage: it failed only when it was most needed, and blamed
              # the reporting rather than the run.
              clean=$(sed -E 's/\x1b\[[0-9;]*m//g' "${{ inputs.log }}")
              totals=$(printf '%s\n' "$clean" | { grep -E '^\[info\] Tests: ' || true; } | tail -1 | sed 's/^\[info\] //')
              {
                  echo "### ${{ inputs.title }}"
                  echo
                  if [ -n "$totals" ]; then echo "**$totals**"; else echo "**No test totals — the suite did not finish.**"; fi
                  echo
                  echo '```'
                  # The spec's own structure — suite, `should` clauses, the `+` info
                  # lines — PLUS the `[pl] phase done in …` timings the harness prints
                  # as it goes. Those are how a slow leg is diagnosed without attaching
                  # a profiler to a live JVM, so they belong in the report rather than
                  # only in a 5 MB job log. Everything else on stdout is application
                  # logging, which is not a report.
                  #
                  # The scope is TWO LETTERS PLUS AN OPTIONAL PASS NUMBER: the
                  # order-independence replays run `Passes` of them concurrently and each
                  # names itself `[usp0]`, `[usp1]`, … so the interleaved heartbeats say
                  # which pass wrote them. A `[a-z]{2}`-only filter dropped every one.
                  printf '%s\n' "$clean" \
                    | { grep -E '^(\[info\] )?([A-Za-z0-9]+Spec:|- should |  \+ |the |\[[a-z]{2}[0-9]*\] )' || true; } \
                    | sed 's/^\[info\] //' \
                    | head -150
                  echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
