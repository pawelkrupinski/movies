name: The pre-push hook's tools
description: >-
    The tools the pre-push hook's checks need that the job image lacks -- actionlint (.github/actions/install-actionlint),
    the floor bash 3.2 scripttests runs the self-tests under again (.github/actions/install-floor-bash), timezonefinder,
    shellcheck and jq. A missing one blocks the check, as on the laptop. Needs the repository checked out.

inputs:
    checks:
        description: The hook checks the job runs (scripts/ci/precommit-share.sh checks); the floor bash only for scripttests.
        default: ''

runs:
    using: composite
    steps:
        - uses: ./.github/actions/install-actionlint
        - if: contains(format(' {0} ', inputs.checks), ' scripttests ')
          uses: ./.github/actions/install-floor-bash
        - shell: bash
          run: |
              python3 -m pip install --quiet timezonefinder || python3 -m pip install --quiet --break-system-packages timezonefinder
              for tool in shellcheck jq; do command -v "$tool" > /dev/null || scripts/ci/install-apt-package.sh "$tool"; done
