name: Install the floor bash
description: >-
    GNU bash 3.2.57, the floor every script tool promises (macOS's /bin/bash), built by `scripts/floor-bash --install`
    into ~/.cache/kinowo-floor-bash, where the pre-push hook's `scripttests` finds it: a Linux runner has no bash 3, and
    without one the hook's floor run BLOCKS (it once passed in silence, and ed160b94b landed a construct 3.2 cannot
    parse). The build is one actions/cache entry keyed by scripts/floor-bash (version, checksum, flags), saved only
    from main (precheck-build-cache.yml; every other ref restores it), so a warm landing check builds nothing; a miss
    builds it (~1 min, the C toolchain and bison installed first where the image lacks them). Needs the repository checked out.

runs:
    using: composite
    steps:
        - id: restore
          uses: actions/cache/restore@v5
          continue-on-error: true
          with:
              path: ~/.cache/kinowo-floor-bash
              key: floor-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/floor-bash') }}
        - id: install
          shell: bash
          run: |
              if ! scripts/floor-bash > /dev/null 2>&1; then
                  command -v cc > /dev/null && command -v make > /dev/null && command -v bison > /dev/null \
                      || scripts/ci/install-apt-package.sh build-essential bison
                  echo "built=true" >> "$GITHUB_OUTPUT"
              fi
              # a failed build names the hook check it stops (`floor`), so the landing check's red is never
              # "check (rest) (no failing test named)" (2026-11-22, a -j32 build race); floor-bash names its step
              start=$SECONDS
              floor="$(scripts/floor-bash --install)" || { echo "pre-push floor FAILED ($((SECONDS - start))s): scripts/floor-bash --install could not build bash 3.2.57 (its step above)"; exit 1; }
              "$floor" --version | head -1
        - if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.built == 'true'
          uses: actions/cache/save@v5
          continue-on-error: true
          with:
              path: ~/.cache/kinowo-floor-bash
              key: floor-bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/floor-bash') }}
