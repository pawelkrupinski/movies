name: Mark deploy in Grafana
description: >-
  Posts a Grafana annotation tagged "deploy" carrying this commit's SHA and
  subject, so a metric regression on a dashboard lines up visually with the
  release that caused it. Never fails the calling job — a missing or rejected
  annotation is a dashboard-reading aid, not a release gate.

inputs:
  tier:
    description: Deploy tier recorded in the annotation's tags and text (e.g. kinowo, web, worker)
    required: true
  grafana-url:
    description: Base URL of the Grafana instance
    required: true
  grafana-annotation-token:
    description: Bearer token for POST /api/annotations
    required: true
  sha:
    description: Commit SHA being marked
    required: true
  commit-message:
    description: Full commit message; only its first line is used
    required: true

runs:
  using: composite
  steps:
      - shell: bash
        env:
            GRAFANA_URL: ${{ inputs.grafana-url }}
            GRAFANA_ANNOTATION_TOKEN: ${{ inputs.grafana-annotation-token }}
            TIER: ${{ inputs.tier }}
            SHA: ${{ inputs.sha }}
            MSG: ${{ inputs.commit-message }}
        run: '"$GITHUB_ACTION_PATH"/mark.sh'
