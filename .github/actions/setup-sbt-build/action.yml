# A Scala job's build setup in one step: the JDK (through setup-jdk, which retries), the sbt
# runner, and the sbt build cache (through sbt-target-cache, which owns the path list) — the trio
# every sbt job repeated, copy for copy, with the same `sbt-target-` key in each.
#
# The JVM's heap is NOT here: it is each sbt invocation's own `-J-Xmx`, and a job's calls differ
# (identity-refit's unit-test run takes the default, its refit 12g), so it stays on the command line.
# (SharedSbtBuildSetupSpec)
name: Set up the sbt build
description: Install the JDK and sbt, and restore (and save) the sbt build cache.
inputs:
  java-version:
    description: The JDK to install.
    required: false
    default: '27'
  sbt-disk-cache:
    description: setup-sbt's sbt-2 disk cache ('false' where it restores and saves nothing, at a workspace glob's cost).
    required: false
    default: 'true'
  target-cache:
    description: "'false' for a job that compiles too little to be worth restoring a build cache for."
    required: false
    default: 'true'
  target-cache-key:
    description: >-
      The build cache's exact key. Empty, the shared `sbt-target-<os>-` family keyed on every source a full
      build compiles, falling back to that family's newest entry.
    required: false
    default: ''
  target-cache-restore-keys:
    description: Fallback prefixes for a `target-cache-key` of the caller's own, one per line.
    required: false
    default: ''
  target-cache-restore-only:
    description: "'true' to restore the build cache without saving it."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-jdk
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: sbt
    # setup-sbt installs the runner; ITS sbt-2 disk cache is off, and restored below under a key of our
    # own. setup-sbt keys it on the first line of `java -version`, which is the JVM's "Picked up
    # JAVA_TOOL_OPTIONS: ..." banner wherever that variable is set (every Forgejo container job), so
    # the key carried it (2026-10-22). Its key also hashed `**/*.sbt`, a walk of every file in the
    # workspace (~9 s a job). NOTE the build is still sbt 1.x, which writes nothing to ~/.cache/sbt, so
    # nothing is saved under any key until it moves to sbt 2; the restore is then a cheap miss.
    - uses: sbt/setup-sbt@v1
      with:
        disk-cache: 'false'
    - name: Key the sbt disk cache
      id: sbt-disk-cache
      if: inputs.sbt-disk-cache == 'true'
      shell: bash
      run: |
        # The JDK's own version from its release file: no JVM start, no banner.
        java_version=$(sed -n 's/^JAVA_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
        echo "prefix=$RUNNER_OS-$RUNNER_ARCH-java$java_version-sbt-diskcache-" >> "$GITHUB_OUTPUT"
        echo "monday=$(date -d 'last Monday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - if: inputs.sbt-disk-cache == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/sbt
        key: ${{ steps.sbt-disk-cache.outputs.prefix }}${{ steps.sbt-disk-cache.outputs.monday }}-${{ hashFiles('build.sbt', 'project/*.sbt', 'project/build.properties') }}
        restore-keys: ${{ steps.sbt-disk-cache.outputs.prefix }}
    - if: inputs.target-cache == 'true'
      uses: ./.github/actions/sbt-target-cache
      with:
        key: ${{ inputs.target-cache-key != '' && inputs.target-cache-key || format('sbt-target-{0}-{1}', runner.os, hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', '**/src/main/**/*.scala', '**/src/test/**/*.scala', '**/src/it/**/*.scala', 'web/src/main/resources/**')) }}
        restore-keys: ${{ inputs.target-cache-key == '' && format('sbt-target-{0}-', runner.os) || inputs.target-cache-restore-keys }}
        restore-only: ${{ inputs.target-cache-restore-only }}
