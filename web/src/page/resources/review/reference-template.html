<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column queue of review cards, a sticky progress strip, decisions as a row of chips per card. */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1d1f24; --muted: #646a75; --line: #dddbd3;
  --accent: #2f5d8a; --accent-soft: #e6eef6;
  --ok: #2e7d4f; --ok-soft: #e3f2e8; --warn: #9a6a12; --warn-soft: #f7eed9; --bad: #a3392f; --bad-soft: #f6e3e0;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --surface: #1e2127; --fg: #e8e7e3; --muted: #9aa0aa; --line: #30343c;
  --accent: #7fb0e0; --accent-soft: #23303e;
  --ok: #6cc28f; --ok-soft: #1e3227; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a80; --bad-soft: #3d2422; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1e2127; --fg: #e8e7e3; --muted: #9aa0aa; --line: #30343c;
  --accent: #7fb0e0; --accent-soft: #23303e;
  --ok: #6cc28f; --ok-soft: #1e3227; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a80; --bad-soft: #3d2422; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; margin: 0 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 65ch; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.meter { flex: 1 1 220px; min-width: 0; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.count { font-family: var(--mono); font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 500 .8rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.notice { margin: 16px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
.list { display: grid; gap: 14px; margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card.done { opacity: .62; }
.head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.raw { font-family: var(--display); font-weight: 500; font-size: 1.08rem; overflow-wrap: anywhere; min-width: 0; }
.conf { font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.meta a, .cand a { color: var(--accent); }
.tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 6px; }
.cands { display: grid; gap: 8px; }
.listing { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; min-width: 0; }
.poster { width: 72px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; background: var(--line); display: block; max-width: 100%; }
.poster.empty { display: grid; place-items: center; font: 500 .65rem var(--mono); color: var(--muted); text-align: center; }
.syn { font-size: .86rem; color: var(--fg); max-width: 65ch; }
.syn.muted { color: var(--muted); font-style: italic; }
details.venues summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
details.venues ul { margin: 6px 0 0; padding-left: 18px; font-size: .85rem; columns: 2 220px; }
.cand { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px 12px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.cand .poster { width: 56px; }
.cand .ov { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.cand.picked { border-color: var(--ok); background: var(--ok-soft); }
.cand .t { min-width: 0; overflow-wrap: anywhere; }
.cand .t b { font-weight: 600; }
.cand .s { color: var(--muted); font-size: .82rem; }
.pct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: .8rem; }
.btn { font: 600 .82rem var(--body); border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.yes { border-color: var(--ok); color: var(--ok); }
.btn.on.yes { background: var(--ok); color: var(--surface); }
.other { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.on.none { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.on.event, .btn.on.bill { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.status { font-size: .8rem; color: var(--muted); }
.own { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.own input { flex: 1 1 240px; min-width: 0; font: 400 .85rem var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.own input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.own .hint { font-size: .78rem; color: var(--muted); flex-basis: 100%; }
.picked-own { font-size: .85rem; border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.lead { border: 1px solid var(--accent); border-radius: 10px; padding: 8px; }
.lead .cand { border: 0; padding: 0; }
.lead .kind { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 4px; }
.lead .rb { display: flex; gap: 8px; margin-top: 8px; }
.btn.on.right { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.on.wrong { background: var(--bad); border-color: var(--bad); color: var(--surface); }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; font-size: .82rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
details.why { font-size: .8rem; color: var(--muted); }
details.why li { font-family: var(--mono); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
@media (max-width: 480px) { .cand { grid-template-columns: 56px 1fr; } .cand > .btn { grid-column: 1 / -1; } }
</style>

<div class="wrap">
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
  <div class="bar">
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <span class="count" id="count">loading…</span>
    <div class="filters" role="group" aria-label="Show">
      <button id="fOpen" aria-pressed="true">To review</button>
      <button id="fAll" aria-pressed="false">All</button>
      <button id="fDone" aria-pressed="false">Answered</button>
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="list" id="list"></div>
</div>

<script>
// 1 = most confident first, -1 = least confident first.
const SORT_DIR = __SORT__;
const state = { items: [], answers: {}, filter: "open", db: null, me: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const flag = { pl: "PL", uk: "UK", de: "DE", es: "ES", us: "US" };

// A pasted link or id as the label vocabulary labels.tsv uses: tmdb:123, imdb:tt…, filmweb:123, wikidata:Q…, rt:slug, letterboxd:slug.
function parseRef(raw) {
  const s = String(raw || "").trim();
  let m;
  if ((m = s.match(/themoviedb\.org\/movie\/(\d+)/i)) || (m = s.match(/^tmdb:\s*(\d+)$/i)) || (m = s.match(/^(\d+)$/))) return `tmdb:${m[1]}`;
  if ((m = s.match(/(tt\d{5,})/i))) return `imdb:${m[1].toLowerCase()}`;
  if ((m = s.match(/filmweb\.pl\/(?:film|serial)\/[^?#]*?-(\d+)(?:[/?#]|$)/i)) || (m = s.match(/^filmweb:\s*(\d+)$/i))) return `filmweb:${m[1]}`;
  if ((m = s.match(/\b(Q\d+)\b/))) return `wikidata:${m[1]}`;
  if ((m = s.match(/rottentomatoes\.com\/m\/([a-z0-9_\-]+)/i)) || (m = s.match(/^rt:\s*([a-z0-9_\-]+)$/i))) return `rt:${m[1].toLowerCase()}`;
  if ((m = s.match(/letterboxd\.com\/film\/([a-z0-9\-]+)/i)) || (m = s.match(/^letterboxd:\s*([a-z0-9\-]+)$/i))) return `letterboxd:${m[1].toLowerCase()}`;
  return null;
}
function refUrl(ref) {
  const [db, id] = ref.split(/:(.+)/);
  return ({ tmdb: `https://www.themoviedb.org/movie/${id}`, imdb: `https://www.imdb.com/title/${id}/`, filmweb: `https://www.filmweb.pl/film/x-${id}`,
            wikidata: `https://www.wikidata.org/wiki/${id}`, rt: `https://www.rottentomatoes.com/m/${id}`, letterboxd: `https://letterboxd.com/film/${id}/` })[db] || "#";
}

function posterImg(src, who) {
  return src && String(src).startsWith("data:image/")
    ? `<img class="poster" src="${src}" alt="${who} poster" loading="lazy">`
    : `<div class="poster empty">no ${who} poster</div>`;
}

function notice(text) { const n = $("notice"); n.textContent = text; n.hidden = !text; }

function render() {
  const total = state.items.length, done = state.items.filter(i => state.answers[i.id]).length;
  $("count").textContent = total ? `${done} / ${total} answered` : "no items yet";
  $("meterFill").style.width = total ? `${(100 * done / total).toFixed(1)}%` : "0";
  const shown = state.items
    .filter(i => state.filter === "all" || (state.filter === "open") === !state.answers[i.id])
    .sort((a, b) => SORT_DIR * ((b.confidence || 0) - (a.confidence || 0)) || String(b.matchedAt || "").localeCompare(String(a.matchedAt || "")));
  $("list").innerHTML = shown.map(i => { try { return card(i); } catch (e) { console.error("card", i.id, e); return `<article class="card"><div class="raw">${esc(i.title)}</div><div class="s muted">This card could not be shown.</div></article>`; } }).join("") ||
    `<div class="notice">${state.items.length ? "Nothing here. Switch the filter to see the rest." : "The review queue is empty. Items appear here once they are loaded."}</div>`;
}

function filmLinks(f) {
  const ref = f.ref && !/^(tmdb|imdb):/.test(f.ref) ? ` · <a href="${esc(refUrl(f.ref))}" target="_blank" rel="noopener">${esc(f.ref.split(":")[0])}</a>` : "";
  return [f.tmdb ? `<a href="https://www.themoviedb.org/movie/${f.tmdb}" target="_blank" rel="noopener">TMDB</a>` : null,
          f.imdb ? `<a href="https://www.imdb.com/title/${esc(f.imdb)}/" target="_blank" rel="noopener">IMDb</a>` : null].filter(Boolean).join(" · ") + ref;
}
function filmBody(f, pct) {
  const facts = [f.year, (f.directors || []).join(", "), f.runtime ? `${f.runtime} min` : null].filter(Boolean).join(" · ");
  const names = [f.localTitle, f.original].filter(t => t && t !== f.title);
  const orig = names.length ? ` <span class="s">(${esc(names.join(" / "))})</span>` : "";
  return `${posterImg(f.poster, "TMDB")}
      <div class="t"><b>${esc(f.title || f.ref)}</b>${orig}<div class="s">${[esc(facts), pct != null ? `<span class="pct">${pct}%</span>` : null, filmLinks(f)].filter(Boolean).join(" · ")}</div>${f.overview ? `<div class="ov">${esc(f.overview)}</div>` : ""}</div>`;
}
function leadBlock(i, a) {
  const f = i.film || i.expected; if (!f) return "";
  const on = (v) => a && a.verdict === v ? "on" : "";
  const kind = i.film ? `Matched${i.basis ? ` by ${esc(i.basis)}` : ""}${i.matchedAt ? ` · ${esc(i.matchedAt.slice(0, 16).replace("T", " "))} UTC` : ""}` : `Labelled right${i.expected.note ? ` · ${esc(i.expected.note)}` : ""}`;
  return `<div class="lead"><div class="kind">${kind}</div><div class="cand">${filmBody(f, null)}</div>
    <div class="rb"><button class="btn yes ${on("right")}" data-id="${i.id}" data-v="right">Right film</button>
    <button class="btn none ${on("wrong")}" data-id="${i.id}" data-v="wrong">Wrong film</button></div></div>`;
}
// Catalogue ids arrive as a list of {source, id}, a single object, a {source: id} map or a plain string.
function ids(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(ids).filter(Boolean).join(", ");
  if (v.source != null && v.id != null) return `${v.source}:${v.id}`;
  return Object.entries(v).map(([k, x]) => `${k}:${typeof x === "object" ? JSON.stringify(x) : x}`).join(", ");
}

// What the venue itself says about the listing, merged across its cinemas: the first non-empty value per field wins.
function venueFacts(i) {
  const f = {};
  for (const m of i.members || []) for (const [k, v] of Object.entries(m.venueFacts || {})) if (f[k] == null) f[k] = v;
  const list = (v) => Array.isArray(v) ? v.join(", ") : v;
  const s = f.screenings;
  const rows = [
    ["Original title", f.originalTitle], ["Year", f.year], ["Director", list(f.directors)], ["Cast", list(f.cast)],
    ["Runtime", f.runtime ? `${f.runtime} min` : null], ["Country", list(f.countries)], ["Catalogue ids", ids(f.catalogueIds)],
    ["Screenings", s ? `${s.count} · ${s.first}${s.last !== s.first ? ` → ${s.last}` : ""}` : null],
  ].filter(([, v]) => v != null && v !== "");
  const cat = {};
  for (const m of i.members || []) for (const [k, v] of Object.entries(m.catalogueFacts || {})) if (cat[k] == null) cat[k] = v;
  const catRows = [["Year", cat.year], ["Director", list(cat.directors)], ["Runtime", cat.runtime ? `${cat.runtime} min` : null], ["Catalogue ids", ids(cat.catalogueIds)]]
    .filter(([, v]) => v != null && v !== "");
  const catBlock = catRows.length ? `<div class="s">The aggregator's catalogue entry says (not the venue):</div><dl class="facts muted">${catRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
  return (rows.length ? `<dl class="facts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<div class="s muted">The venue gives no film details.</div>`) + catBlock;
}

function card(i) {
  const a = state.answers[i.id];
  const cands = (i.candidates || []).map(c => {
    const picked = a && a.verdict === "film" && a.tmdb === c.tmdb;
    return `<div class="cand ${picked ? "picked" : ""}">
      ${filmBody(c, c.pct)}
      <button class="btn yes ${picked ? "on" : ""}" data-id="${i.id}" data-v="film" data-tmdb="${c.tmdb}">This film</button>
    </div>`;
  }).join("");
  const on = (v) => a && a.verdict === v ? "on" : "";
  const members = i.members && i.members.length ? i.members : (i.venues || []).map(v => ({ venue: v, page: i.page }));
  const venueLink = (m) => m.page ? `<a href="${esc(m.page)}" target="_blank" rel="noopener">${esc(m.venue)}</a>` : esc(m.venue);
  const venues = members.length <= 3
    ? `<div class="meta">${members.map(venueLink).join(" · ")}</div>`
    : `<details class="venues"><summary>${members.length} cinemas</summary><ul>${members.map(m => `<li>${venueLink(m)}</li>`).join("")}</ul></details>`;
  return `<article class="card ${a ? "done" : ""}">
    <div class="head"><div class="raw"><span class="tag">${flag[i.country] || esc(i.country)}</span>${esc(i.title)}</div>${i.confidence ? `<span class="conf">${i.confidence}%</span>` : ""}</div>
    <div class="listing">${posterImg(i.poster, "venue")}<div>
      ${venues}
      ${venueFacts(i)}
      <div class="syn ${i.synopsis ? "" : "muted"}">${i.synopsis ? esc(i.synopsis) : "The venue gives no synopsis."}</div>
    </div></div>
    ${leadBlock(i, a)}
    ${i.why && i.why.length ? `<details class="why"><summary>Why the resolver decided this</summary><ul>${i.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details>` : ""}
    ${cands ? `${i.film || i.expected ? `<div class="s">${i.film ? "Other candidates" : "What the model leaned to"}</div>` : ""}<div class="cands">${cands}</div>` : ""}
    ${a && a.verdict === "film" && a.ref ? `<div class="picked-own">Your answer: <a href="${esc(refUrl(a.ref))}" target="_blank" rel="noopener">${esc(a.ref)}</a></div>` : ""}
    <form class="own" data-id="${i.id}">
      <input id="own-${i.id}" name="ref" placeholder="Other film: paste a TMDB, IMDb, Filmweb, Wikidata, RT or Letterboxd link" autocomplete="off" aria-label="Other film link or id">
      <button class="btn yes" type="submit">Use this film</button>
      <span class="hint" id="hint-${i.id}"></span>
    </form>
    <div class="other">
      <button class="btn none ${on("none")}" data-id="${i.id}" data-v="none">None of these</button>
      <button class="btn event ${on("event")}" data-id="${i.id}" data-v="event">Not a film</button>
      <button class="btn bill ${on("bill")}" data-id="${i.id}" data-v="bill">Double bill</button>
      ${a ? `<button class="btn" data-id="${i.id}" data-v="clear">Undo</button>` : ""}
    </div>
  </article>`;
}

document.addEventListener("input", (e) => {
  const f = e.target.closest("form.own"); if (!f) return;
  const ref = parseRef(e.target.value), hint = $(`hint-${f.dataset.id}`);
  hint.textContent = !e.target.value.trim() ? "" : ref ? `Reads as ${ref}` : "Not a link or id I recognise.";
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form.own"); if (!f) return;
  e.preventDefault();
  const input = f.querySelector("input"), ref = parseRef(input.value);
  if (!ref) { $(`hint-${f.dataset.id}`).textContent = "Paste a TMDB, IMDb, Filmweb, Wikidata, RT or Letterboxd link or id."; return; }
  answer(f.dataset.id, "film", ref.startsWith("tmdb:") ? ref.slice(5) : null, ref);
});

async function answer(id, verdict, tmdb, refOf) {
  if (!state.db) { notice("Answers can't be saved here: sign in to claude.ai and open this page there."); return; }
  if (state.canWrite === false) { notice("You can view this queue but not answer it. Ask the owner for Contributor access."); return; }
  const ref = state.db.collection("answers").doc(id);
  const write = () => verdict === "clear" ? ref.delete()
    : ref.set({ verdict, tmdb: tmdb ? Number(tmdb) : null, ref: refOf || (tmdb ? `tmdb:${tmdb}` : null), by: state.me, at: new Date().toISOString() });
  try {
    await write(); notice("");
  } catch (e) {
    if (e && e.code === "unavailable") {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      try { await write(); notice(""); return; } catch (_) {}
    }
    notice(e && e.code === "quota_exceeded" ? "The answer store is full, so this answer wasn't saved."
      : e && e.code === "revoked" ? "This page can no longer save answers."
      : "That answer wasn't saved. Try again.");
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (b) { answer(b.dataset.id, b.dataset.v, b.dataset.tmdb); return; }
  const f = e.target.closest(".filters button");
  if (f) {
    state.filter = f.id === "fAll" ? "all" : f.id === "fDone" ? "done" : "open";
    for (const x of document.querySelectorAll(".filters button")) x.setAttribute("aria-pressed", String(x === f));
    try { localStorage.setItem("filter", state.filter); } catch (_) {}
    render();
  }
});

(async () => {
  try { const f = localStorage.getItem("filter"); if (f) { state.filter = f; for (const x of document.querySelectorAll(".filters button")) x.setAttribute("aria-pressed", String((x.id === "fAll" && f === "all") || (x.id === "fDone" && f === "done") || (x.id === "fOpen" && f === "open"))); } } catch (_) {}
  render();
  const db = await window.claude?.use?.("db");
  const user = await window.claude?.use?.("user");
  if (!db) { notice("Sign in to claude.ai to load the review queue."); return; }
  state.db = db;
  try { state.me = user ? await user.id() : null; } catch (_) { state.me = null; }
  try { state.canWrite = user ? await user.can("data.write") : null; } catch (_) { state.canWrite = null; }
  db.collection("items").onSnapshot((snap) => {
    state.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  db.collection("answers").onSnapshot((snap) => {
    const next = {}; for (const d of snap.docs) next[d.id] = d.data();
    state.answers = next; render();
  });
})();
