# ── Application ───────────────────────────────────────────────────────────────
play.http.secret.key = "changeme-use-a-long-random-string-in-production"
play.http.secret.key = ${?APPLICATION_SECRET}

# Static assets are versioned in their filename (e.g.
# `bootstrap-5.3.3.min.css`); a future version bump gets a new URL, so we
# can mark them immutable + cache them forever. Play's default
# `max-age=3600` was forcing iPhone Safari to re-validate Bootstrap on
# every cold-ish hit, which is exactly the cross-origin handshake we
# self-hosted Bootstrap to avoid.
play.assets.defaultCache = "public, max-age=31536000, immutable"

play.server.http.port = 9000
play.server.http.port = ${?PORT}

# Bind on every interface — kube-proxy forwards the NodePort to the pod's own
# cluster IP, and the kubelet's probes arrive there too, so 127.0.0.1 alone
# would refuse every connection that matters. Play 3.0 defaults to 0.0.0.0 but
# we set it explicitly so a future Play upgrade can't quietly flip it back to
# localhost.
play.server.http.address = "0.0.0.0"
play.server.http.address = ${?HTTP_ADDRESS}

# Trust the proxy in front of us: TLS terminates in Caddy on k3s-worker-1, and
# the pod receives plain HTTP plus `X-Forwarded-Proto: https` /
# `X-Forwarded-Host`. Without this, `request.secure` is always false inside the
# container and the OAuth callback URL we hand to Google becomes
# `http://kinowo.net/...` — a `redirect_uri_mismatch` against the `https://` URI
# registered in Cloud Console. Trusting ANY source IP is still safe, though for
# a different reason since the move off Fly: the Hetzner firewall opens 22, 80
# and 443 and nothing else, so the NodePort these headers arrive on is
# unreachable from the internet and only Caddy can set them. (See
# `controllers.PageMeta.origin`, which reads the same two headers directly
# because this knob alone didn't make `request.secure` follow the proxied
# scheme on Play 3.0.)
play.http.forwarded.version        = "x-forwarded"
play.http.forwarded.trustedProxies = ["0.0.0.0/0", "::/0"]

play.filters.hosts {
  # The kubelet's startup / readiness / liveness probes hit the container at
  # the pod's own cluster IP, which is a bare dotted IPv4 and a NEW one after
  # every rollout; Prometheus reaches `/metrics` through the node's address on
  # the NodePort, another bare IPv4. Listing them literally is brittle in the
  # worst way — the next scheduling decision hands the pod an address this file
  # doesn't know, the probes start failing, and the kubelet restarts a process
  # that is serving users perfectly well. Play's host filter doesn't support
  # CIDR, but a bare "." matches any host with at least one dot, which covers
  # every IPv4 + every dotted hostname (the only host without a dot we'd ever
  # legitimately see is "localhost"). The filter still rejects header-only
  # spoof attempts that don't contain a dot, and for anything arriving from
  # outside the cluster Caddy on k3s-worker-1 is the only ingress anyway.
  allowed = [
    ".",
    "localhost"
  ]
}

play.filters.cors {
  allowedOrigins    = null   # null = allow all; list specific origins in production
  allowedHttpMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
}

# ── MongoDB ────────────────────────────────────────────────────────────────────
mongodb {
  uri      = "mongodb://localhost:27017"
  uri      = ${?MONGODB_URI}           # override with env var in production
  database = "scala_play_db"
  database = ${?MONGODB_DATABASE}
}

# ── i18n ──────────────────────────────────────────────────────────────────────
# Supported UI languages. The deployment renders in ONE of these, chosen at boot
# from the country's language (`Country.fromEnv.language` → `pl` for Poland, `en`
# elsewhere) — see `modules.AppComponents.deploymentMessages`. `pl` has no
# `messages.pl` file: it falls through to the default `messages` (Polish).
play.i18n.langs = ["pl", "en", "de"]

# ── Where this deployment is MOUNTED ──────────────────────────────────────────
# `play.http.context` (and the session/flash cookie paths that default to it) is
# NOT set here, and deliberately not: `modules.AppLoader.mountedAt` writes all
# three into the configuration at load time, from `Country.fromEnv.mountPath`.
#
# Three of the four deployments share `showtimes.cc` and are told apart by a path
# segment (`showtimes.cc/uk/kent/`), while Poland keeps `kinowo.net/poznan/` at
# the root. `KINOWO_COUNTRY` already selects the database, the language and the
# city list; the mount point is one more thing that follows from it, so a literal
# in this file (or per Kubernetes overlay) would only be a second place to get
# the same fact wrong. Setting it here would also be inert: compile-time DI skips
# Play's `RoutesProvider`, so the router is given the prefix explicitly in
# `AppComponents`.

# ── Compile-time DI ───────────────────────────────────────────────────────────
# Replaces Guice. The single wiring class lives in app/modules/AppLoader.scala.
play.application.loader = "modules.AppLoader"

# ── Logging ────────────────────────────────────────────────────────────────────
play.logger.includeConfigProperties = true
