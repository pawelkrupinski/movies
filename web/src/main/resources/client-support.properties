# Which client versions this server still serves, and where to send the rest.
#
# Committed on purpose: dropping support for a build is a decision worth having in
# git history next to the release that caused it, not a silent runtime flip.
#
# A platform is GATED only when BOTH its minimumVersion and storeUrl are set. An
# unset pair means "everything is supported" and the clients never nag — which is
# the safe default, and the reason ios.storeUrl stayed empty until the App Store id
# existed: sending people to a made-up id would have stranded them on a 404. Both
# platforms are gated now.
#
# minimumVersion is the OLDEST version that still works. A client at or above it is
# supported; anything below is sent to storeUrl.

android.minimumVersion = 1.0
android.storeUrl = https://play.google.com/store/apps/details?id=net.pawel.kinowo

ios.minimumVersion = 1.0
ios.storeUrl = https://apps.apple.com/app/id6792566321
