@()
@* The review pages' fonts and stylesheet: the queue, the matchable and recent pages, and one listing's explain page. *@
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@@500;700&family=IBM+Plex+Sans:wght@@400;500;600&family=IBM+Plex+Mono:wght@@400;500&display=swap">
  <style>
    /* The published review pages' design: one column of cards under a sticky progress strip. */
    :root {
      --bg: #f6f5f1; --surface: #ffffff; --fg: #1d1f24; --muted: #646a75; --line: #dddbd3;
      --accent: #2f5d8a; --accent-soft: #e6eef6;
      --ok: #2e7d4f; --ok-soft: #e3f2e8; --warn: #9a6a12; --warn-soft: #f7eed9; --bad: #a3392f; --bad-soft: #f6e3e0;
      --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    }
    @@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #15171b; --surface: #1e2127; --fg: #e8e7e3; --muted: #9aa0aa; --line: #30343c;
      --accent: #7fb0e0; --accent-soft: #23303e;
      --ok: #6cc28f; --ok-soft: #1e3227; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a80; --bad-soft: #3d2422; color-scheme: dark } }
    :root[data-theme="dark"] {
      --bg: #15171b; --surface: #1e2127; --fg: #e8e7e3; --muted: #9aa0aa; --line: #30343c;
      --accent: #7fb0e0; --accent-soft: #23303e;
      --ok: #6cc28f; --ok-soft: #1e3227; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a80; --bad-soft: #3d2422; color-scheme: dark }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
    .wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
    h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; margin: 0 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
    .lede { color: var(--muted); margin: 0 0 16px; max-width: 65ch; }
    nav.review-nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
    nav.review-nav a { font: 500 .8rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 10px; text-decoration: none; }
    nav.review-nav a.is-active { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    nav.review-nav .spacer { flex: 1; }
    select, .controls input { font: 400 .85rem var(--body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 12px; font-size: .85rem; color: var(--muted); }
    .controls a { color: var(--accent); }
    .controls a.is-active { font-weight: 600; color: var(--fg); }
    #export-summary { white-space: pre-wrap; font: .8rem var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    #export-summary:empty { display: none; }
    .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .meter { flex: 1 1 220px; min-width: 0; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .count { font-family: var(--mono); font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button { font: 500 .8rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
    .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .summary { color: var(--muted); font-size: .85rem; margin-top: 8px; }
    .notice { margin: 16px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
    .suspects { margin: 16px 0; overflow-x: auto; }
    .suspects table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    .suspects th, .suspects td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    .suspects .hint { color: var(--muted); font-size: .85rem; }
    .notice.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
    .list { display: grid; gap: 14px; margin-top: 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
    .card.done { opacity: .62; }
    .head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .raw { font-family: var(--display); font-weight: 500; font-size: 1.08rem; overflow-wrap: anywhere; min-width: 0; }
    .conf { font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
    .priority { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
    .priority .settles { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 500; }
    .tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 6px; }
    .tag.veto { border-color: var(--bad); color: var(--bad); }
    details.checks { font-size: .8rem; color: var(--warn); }
    details.checks summary { cursor: pointer; }
    details.checks li { font-family: var(--mono); overflow-wrap: anywhere; }
    details.checks details.venues summary { font-size: .8rem; }
    .label-row { font-size: .85rem; color: var(--ok); overflow-wrap: anywhere; }
    .label-row.wrong { color: var(--bad); }
    .cands { display: grid; gap: 8px; }
    .listing { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; min-width: 0; }
    .listing > div { min-width: 0; }
    .poster { width: 72px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 4px; background: var(--line); display: block; max-width: 100%; }
    .poster.empty { display: grid; place-items: center; font: 500 .65rem var(--mono); color: var(--muted); text-align: center; }
    .syn { font-size: .86rem; color: var(--fg); max-width: 65ch; white-space: pre-line; overflow-wrap: anywhere; }
    .syn.muted { color: var(--muted); font-style: italic; }
    details.venues summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
    details.venues ul { margin: 6px 0 0; padding-left: 18px; font-size: .85rem; columns: 2 220px; }
    .cand { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px 12px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
    .cand .poster { width: 56px; }
    .cand .ov { font-size: .82rem; color: var(--muted); margin-top: 4px; }
    .cand.picked { border-color: var(--ok); background: var(--ok-soft); }
    .cand .t { min-width: 0; overflow-wrap: anywhere; }
    .cand .t b { font-weight: 600; }
    .s { color: var(--muted); font-size: .82rem; }
    .s.muted { font-style: italic; }
    .denial { color: var(--bad); font-size: .82rem; }
    .pct { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: .8rem; }
    .btn { font: 600 .82rem var(--body); border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
    .btn:hover { border-color: var(--accent); }
    .btn:focus-visible, .filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn.yes { border-color: var(--ok); color: var(--ok); }
    .btn.on.yes { background: var(--ok); color: var(--surface); }
    .other { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn.on.none { background: var(--bad); border-color: var(--bad); color: var(--surface); }
    .btn.on.event, .btn.on.bill { background: var(--warn); border-color: var(--warn); color: var(--surface); }
    .status { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
    .status.is-error { color: var(--bad); }
    .own { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .own input { flex: 1 1 240px; min-width: 0; font: 400 .85rem var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .own input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .own .hint { font-size: .78rem; color: var(--muted); flex-basis: 100%; }
    .own .hint:empty { display: none; }
    .picked-own { font-size: .85rem; border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
    .lead { border: 1px solid var(--accent); border-radius: 10px; padding: 8px; }
    .lead .cand { border: 0; padding: 0; }
    .lead .kind { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 4px; }
    .lead .rb { display: flex; gap: 8px; margin-top: 8px; }
    details.vetoed { font-size: .85rem; }
    details.vetoed > summary { cursor: pointer; color: var(--muted); }
    details.vetoed .cands { margin-top: 6px; }
    .cand.vetoed { background: var(--bg); }
    .cand.vetoed .t, .cand.vetoed .t b { color: var(--muted); }
    .cand.vetoed .poster { opacity: .6; }
    .cand.vetoed .denial { color: var(--bad); }
    .btn.on.right { background: var(--ok); border-color: var(--ok); color: var(--surface); }
    .btn.on.wrong { background: var(--bad); border-color: var(--bad); color: var(--surface); }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; font-size: .82rem; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; overflow-wrap: anywhere; }
    details.cast > summary { cursor: pointer; list-style: none; }
    details.cast > summary::-webkit-details-marker { display: none; }
    details.cast .more { color: var(--accent); white-space: nowrap; }
    details.cast[open] .more { display: none; }
    .with { overflow-wrap: anywhere; }
    dl.facts.muted, dl.facts.muted dt { color: var(--muted); }
    details.why { font-size: .8rem; color: var(--muted); }
    details.why summary { cursor: pointer; }
    details.why li { font-family: var(--mono); overflow-wrap: anywhere; }
    details.why .trace { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    details.why .who { color: var(--fg); font-weight: 500; }
    details.why ul { margin: 2px 0; }
    details.why .for li, details.why li.for { color: var(--ok); }
    details.why .against li, details.why li.against { color: var(--bad); }
    details.why li.veto { color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 0 4px; }
    @@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
    @@media (max-width: 480px) { .cand { grid-template-columns: 56px 1fr; } .cand > .btn { grid-column: 1 / -1; } }
  </style>
