@*
   Wraps a block of rendered HTML and minifies the JS / CSS inside any
   `<script>` and `<style>` tags it contains. Markup outside those tags
   passes through verbatim. See `tools.Minify` for the stripper rules
   (comment removal, whitespace collapse, ASI-safe for JS, semicolon-
   dropping for CSS).

   `minifier` is the one the web composition root chose
   (`tools.Minifier.forMode`): production gets a `tools.MemoisingMinifier`,
   so the per-request cost after the first hit is one
   `ConcurrentHashMap.get` lookup; dev mode gets `tools.PassThroughMinifier`,
   so DevTools-style debugging (readable, indented source) keeps working
   while running `sbt run` locally.

   Apply at the call site of inline `<style>` / `<script>` blocks, OR
   wrapped around `@_sharedStyles()` / `@_sharedJs(…)` invocations.
*@
@(minifier: tools.Minifier)(content: Html)@Html(minifier.process(content.body))
