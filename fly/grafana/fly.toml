app = 'kinowo-grafana'
# Same region as the apps it watches (kinowo / kinowo-worker / kinowo-mongo all
# in `arn`) — not load-bearing for Grafana, but keeps it next to the org it
# alerts on. This is the *alerting* Grafana: Fly's hosted fly-metrics.net Grafana
# cannot run alert rules (confirmed, even on paid plans), so we self-host a tiny
# one per Fly's own recommendation. Reads the same managed Prometheus.
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  GF_SERVER_HTTP_PORT = '3000'
  GF_SERVER_ROOT_URL = 'https://kinowo-grafana.fly.dev'
  # Single-operator instance — no public signups, no anonymous access, no
  # phone-home. Admin password + the Fly read token + Telegram creds all come
  # from `fly secrets` (see README), never the image.
  GF_USERS_ALLOW_SIGN_UP = 'false'
  GF_AUTH_ANONYMOUS_ENABLED = 'false'
  GF_ANALYTICS_REPORTING_ENABLED = 'false'
  GF_ANALYTICS_CHECK_FOR_UPDATES = 'false'

[http_service]
  internal_port = 3000
  force_https = true
  # STOOD DOWN 2026-08-29. This app is superseded by Grafana on monitoring-1 (Hetzner), which runs
  # the same provisioning from infra/nix/modules/roles/grafana.nix and is fed by a Prometheus that
  # scrapes the fleet directly. Keeping both would mean two Grafanas evaluating the same alert rules
  # against the same data and both messaging the same Telegram chat.
  #
  # NOT DESTROYED, DELIBERATELY. The app, its secrets and its 1GB volume are all still here, so
  # rolling back is `flyctl deploy --remote-only -a kinowo-grafana` after reverting these three
  # lines. Everything it serves is config-as-code in this directory; what the volume holds that the
  # repo does not is alert state and silences, which are worth keeping until the Hetzner stack has
  # been trusted for a while.
  #
  # ALL THREE LINES HAVE TO CHANGE TOGETHER. `min_machines_running = 1` alone makes Fly restart a
  # stopped machine within about a minute -- observed today -- and `auto_start_machines = true`
  # makes any stray HTTP request wake it. Stopping the machine without these is not a stop.
  auto_stop_machines = true
  auto_start_machines = false
  min_machines_running = 0

[[vm]]
  # Grafana + unified alerting + the VictoriaMetrics direct-scrape sidecar. VM is
  # capped at 128 MB (-memory.allowedBytes in start.sh) and scrapes two tiny
  # targets, so 512 MB comfortably holds both; was 256 MB before the sidecar.
  # CPU is near-idle. Watch the kinowo-grafana memory panel after a redeploy.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  # Grafana keeps its SQLite (alert state, silences, annotations posted by CI,
  # the admin user) here. Without a volume every redeploy would reset alert
  # state and drop the deploy-marker history.
  source = 'grafana_data'
  destination = '/var/lib/grafana'

[checks]
  [checks.health]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    port = 3000
    timeout = '10s'
    type = 'http'
