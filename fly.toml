app = 'kinowo'
# RETIRED. The Polish site moved to kinowo.net on the k3s cluster
# (docs/domain-cutover.md); this app stays up only so the links, bookmarks and
# installed apps still pointing at `kinowo.fly.dev` keep working. It runs the
# same image as the live site with `KINOWO_RETIRED` set, which boots
# `modules.RetiredComponents` instead of the serving one: `/` and `/{city}/`
# render a "the address changed" notice carrying the LIVE page's own Open Graph
# metadata (so a link shared years ago still previews), and everything else —
# every `/api/…` the mobile apps call, every film deep link — redirects
# permanently to the same path on kinowo.net.
#
# Nothing here reads a database any more. Region is now irrelevant (the Fly
# Mongo it was colocated with is gone); left at `arn` because moving a machine
# that only emits redirects buys nothing.
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '9000'
  # Boots the retirement composition root — see the header. Deliberately an
  # `[env]` entry rather than a secret: it is not one, and a knob you can read
  # off `fly.toml` is a knob the next person can find.
  KINOWO_RETIRED = 'true'
  # Sized for a process that renders one static page and otherwise emits
  # redirects. The serving app needed 384m of heap for the in-memory MovieCache;
  # a retired host has no cache, no read model and no Mongo driver, so the live
  # set is Play itself. Metaspace (~110 MB of loaded classes) and the code cache
  # dominate the footprint here, not the heap, so those are the caps that stay
  # generous relative to it.
  JAVA_OPTS = '-Xms128m -Xmx128m -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=32m'

[http_service]
  internal_port = 9000
  force_https = true
  # Keep at least one machine running so users never pay a cold-start hit;
  # auto_stop disabled so Fly doesn't try to scale to zero on idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # ALPN over Fly's edge TLS. Only `h2` and `http/1.1` are valid here —
  # the field controls TCP TLS handshake protocol negotiation, and HTTP/3
  # runs over QUIC/UDP (separate listener). Fly's edge advertises h3 via
  # the `Alt-Svc` response header when the org/app has HTTP/3 enabled at
  # the proxy level; that's the configuration knob for "HTTP/3 on iOS
  # Safari," not this `alpn` array.
  [http_service.tls_options]
    alpn = ['h2', 'http/1.1']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  # 512 MB, down from the 1 GB the serving app needed. The old sizing note
  # warned that 512 MB OOM-crash-looped — that was with the MovieCache holding
  # five cities' repertoire (anon-RSS ~408 MB against the cgroup). A retired
  # host holds none of it: 128 (heap) + 160 (meta) + 64 (code) + 32 (direct)
  # = 384 MB of committed ceiling, plus thread stacks and native overhead, fits
  # 512 MB with real headroom.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    port = 9000
    timeout = '10s'
    type = 'http'

# No `[[metrics]]` block any more. A retired host serves no repertoire, so its
# only real series would be redirect counts, and `/metrics` deliberately 404s
# here (see `RetiredSiteController.metrics`) rather than redirecting — a stale
# scrape job following a 30x would file the LIVE site's series under this app's
# labels, which is worse than no data.
