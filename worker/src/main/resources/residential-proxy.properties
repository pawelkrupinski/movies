# Residential-proxy egress (Decodo static ISP) for the cinema sites that
# Cloudflare-block our Fly datacenter IP (Multikino, biletyna). NON-SECRET config,
# committed on purpose — the host is public and the ports are just IP selectors.
#
# The credentials are NOT here: DECODO_PROXY_USER / DECODO_PROXY_PASS come from
# the process environment (tools.Env: env var -> -D system property; locally,
# launch under `secrets run movies DECODO_PROXY_USER DECODO_PROXY_PASS ...`). The proxy stays
# disabled (worker falls back to direct) wherever those secrets aren't set.
# See the reference_decodo_isp_proxy memory.
host=isp.decodo.com
ports=10001,10002,10003,10004,10005,10006,10007
