# Repo-specific configuration for the Scala Steward sweep
# (.github/workflows/scala-steward.yml). Reference:
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Hold the build tool on the 1.x line.
#
# sbt 2.0 only loads plugins cross-published for `sbt2_3`, and two of the five
# plugins in project/plugins.sbt have no stable sbt 2 build:
#
#   org.playframework:sbt-plugin  — sbt2 only at 3.1.0-M5…M9
#   com.github.sbt:sbt-digest     — sbt2 only at 2.2.0-M1
#
# So taking sbt 2 today would drag three pre-release artifacts into the live
# web tier: Play itself (3.0.11 → 3.1.0-M9), scalatestplus-play (7.0.2 →
# 8.0.0-M2, since 7.x is Play-3.0-only) and sbt-digest. That is a framework
# upgrade wearing a build-tool bump's clothes, and it is not a trade we want
# for a production service.
#
# This is a PIN rather than an ignore on purpose: 1.x bumps still get proposed,
# only the 2.x jump is held back. Drop this entry once Play 3.1.0 ships a
# stable release — at that point the sbt 2 migration is worth doing properly.
updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
